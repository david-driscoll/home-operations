# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# ─── DATABASE INDEX ALLOCATION ──────────────────────────────────────────────
#
# This Valkey is shared and passwordless; consumers are kept apart by database
# index alone. THIS TABLE IS THE ALLOCATION -- add a row in the same change
# that takes an index, and read it rather than grepping for `:6379/<n>`.
#
# Grepping is how db 13 ended up with two owners. Nextcloud set it in a PHP
# file and Sure's author searched for URLs; dawarich sets three through
# RAILS_*_DB variables and does not show up in that search either. Each app's
# comment carried its own partial list of "taken" indexes, and each list was
# missing someone.
#
#    0  default: anything that sets no index (immich explicitly, pinepods)
#    1  dawarich     Rails cache       (RAILS_CACHE_DB)
#    2  dawarich     Sidekiq           (RAILS_JOB_QUEUE_DB)
#    3  dawarich     ActionCable       (RAILS_WS_DB)
#    4  nextcloud    cache + file locking (resources/zz-redis.config.php)
#    5  romm                           (REDIS_DB)
#    6  dispatcharr  Celery broker
#    7  patchmon     Asynq queues      (REDIS_DB)
#    8  searxng      limiter           (resources/settings.yml)
#    9  degoog
#   10  postiz
#   11  tracearr
#   12  outline
#   13  sure         Sidekiq + Rails cache
#   14  renovate     lookup cache      (coder/renovate/renovatejob.yaml)
#   15  free -- the last one
#
# `databases` is Valkey's default of 16, so the app after the last free index
# needs either a key prefix inside an existing index or `--databases` raised on
# this server (which restarts it under every consumer at once).
#
# Checked against the live server on 2026-10-18: `INFO keyspace` for which
# indexes hold keys, and CLIENT LIST's per-connection `db=` for who is
# connected where. Repeat that before trusting a row nobody has touched in a
# while -- and never FLUSHDB an index without reading this first, let alone
# FLUSHALL.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  # the config can take a while to restore
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        containers:
          *app :
            image:
              repository: ghcr.io/valkey-io/valkey
              tag: 9.2-trixie@sha256:247b5e730bdc9dc29fddb8274d1731b203a1a1a46af63eae3a9d55b4bf74853f
            env:
              VALKEY_PORT: &port 6379
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 4Gi
        # Was `longhorn-local` (strict-local, 1 replica) until 2026-08-04. That
        # class gives the PV a hard nodeAffinity to a single node, so any drain
        # of that node left valkey unschedulable ("3 node(s) didn't match
        # PersistentVolume's node affinity") and took immich, romm, dispatcharr,
        # searxng, outline, pinepods and n8n down with it. `longhorn` is
        # replicated (3 replicas, dataLocality best-effort), so the pod can move.
        # The volume is pure cache/broker state and was recreated empty.
        storageClass: longhorn
    service:
      *app :
        controller: *app
        ports:
          *app :
            port: *port
