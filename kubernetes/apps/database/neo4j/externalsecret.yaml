---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Minted by stacks/system (neo4j-auth.ts) into OpenBao, where the network map's
# collector, its declared-layer loader and the Neo4j MCP read the same value.
# NEO4J_AUTH sets the password only on first start (an empty data directory);
# rotating it needs the steps in neo4j-auth.ts's header.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-config
    creationPolicy: Owner
    template:
      data:
        NEO4J_AUTH: "{{ .username }}/{{ .password }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/neo4j/auth
