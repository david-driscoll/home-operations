---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app neo4j
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn: []
  values:
    defaultPodOptions:
      # The PVC is a plain Longhorn volume (no volsync restore to set it up),
      # so it and the subPath directories kubelet creates in it are root-owned,
      # and Neo4j (568) failed to start: "Folder /plugins is not accessible".
      # fsGroup hands the volume to group 568. `Always`, not OnRootMismatch: on
      # a wiped volume kubelet re-creates the subPath dirs as root AFTER the
      # root already matches, which OnRootMismatch would never fix. 10Gi, so a
      # recursive pass per mount is cheap.
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: Always
    controllers:
      *app :
        enabled: true
        annotations:
          # The network map's database (ADR 0006): the hourly collector writes
          # here around the clock, so it stays up through the nightly window.
          downscaler/exclude: "true"
          # NEO4J_AUTH comes from neo4j-config; it only applies to an empty
          # data directory, but a rendered change should still roll the pod.
          reloader.stakater.com/auto: "true"
        pod:
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
        containers:
          *app :
            image:
              repository: neo4j
              tag: "2026.10.1-community-trixie@sha256:7dbd307cc8f35d6a061cf71659d3d8f783c3db9e8c2f5bb9d54f77921931952a"
              pullPolicy: IfNotPresent
            env:
              TZ: "${TIMEZONE}"
              # Core APOC only, the copy bundled in the image (labs/), so it always
              # matches the server. apoc-extended is fetched from GitHub by
              # version and lagged the server (a 2026.04 jar on 2026.10.1);
              # genai is unused. The network map needs neither.
              NEO4J_PLUGINS: '["apoc"]'
              NEO4J_AUTH:
                secretKeyRef:
                  name: "${APP}-config"
                  key: NEO4J_AUTH
            ports:
              - containerPort: &http-port 7474
              - containerPort: &bolt-port 7687
            securityContext:
              runAsNonRoot: true
              runAsGroup: 568
              runAsUser: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *http-port
          bolt:
            port: *bolt-port

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /logs
            subPath: logs
          - path: /config
            subPath: config
          - path: /data
            subPath: data
          - path: /plugins
            subPath: plugins

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *http-port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-api
      bolt:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *bolt-port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-api
    # serviceMonitor:
    #   *app :
    #     endpoints:
    #       - port: 2004
