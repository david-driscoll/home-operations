---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  # The `database` store directly, not `openbao`: every value this app needs is
  # in the credential Secret components/postgres renders, and Temporal has no
  # secret of its own (no API key, no signing key -- authn is "whoever can
  # reach :7233", which is what the namespace's network policy is for).
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        TZ: "${TIMEZONE}"

        # --- persistence -------------------------------------------------
        # `postgres12` is the plugin name for PostgreSQL 12+, not a version
        # pin -- it is what auto-setup.sh validates against and the only
        # non-Cassandra Postgres driver besides its `_pgx` variant.
        DB: postgres12
        POSTGRES_SEEDS: "{{ .postgres_hostname }}"
        DB_PORT: "{{ .postgres_port }}"
        POSTGRES_USER: "{{ .postgres_username }}"
        POSTGRES_PWD: "{{ .postgres_password }}"

        # The app's own database, from components/postgres.
        DBNAME: "{{ .postgres_database }}"
        # The second database, declared in ./postgres-databases/. Temporal's
        # own default here is `temporal_visibility`; this is spelled with a
        # hyphen to match the estate's `<app>-<suffix>` convention (the same
        # shape as `sonarr-log`), which is safe precisely because the name is
        # passed explicitly rather than defaulted.
        VISIBILITY_DBNAME: "${APP}-visibility"

        # ⚠️ BOTH DATABASES ALREADY EXIST -- CNPG created them from the
        # `Database` CRs. Without this, auto-setup.sh runs `temporal-sql-tool
        # ... create`, and the login role is not a superuser and cannot
        # `CREATE DATABASE`. Schema setup itself only needs ownership, which
        # the role has, so `setup-schema`/`update-schema` still run and are
        # idempotent on every restart.
        SKIP_DB_CREATE: "true"

        # No Elasticsearch. With ES off, the visibility schema is applied to
        # VISIBILITY_DBNAME above and list/search runs on Postgres -- which is
        # the supported single-node configuration and skips the three extra
        # containers (ES + its JVM) the upstream compose file carries.
        ENABLE_ES: "false"

        # --- cluster -----------------------------------------------------
        # ⚠️ IMMUTABLE AFTER FIRST SCHEMA SETUP. numHistoryShards is baked into
        # the persisted cluster metadata; changing it on a live cluster
        # corrupts task routing and Temporal refuses to start. 4 is the
        # image's own default and is sized for exactly this -- one node, one
        # low-volume consumer. Changing it later means a new database.
        NUM_HISTORY_SHARDS: "4"

        # 0.0.0.0 so the services bind every interface and the ClusterIP
        # Service can reach them; the template's own default is 127.0.0.1,
        # which would answer nothing from outside the pod. entrypoint.sh then
        # derives TEMPORAL_BROADCAST_ADDRESS from the pod IP, which is what
        # ringpop membership gossips -- that pairing is why BIND_ON_IP is set
        # here rather than left to the entrypoint's hostname lookup.
        BIND_ON_IP: "0.0.0.0"

        # The namespace Postiz's orchestrator connects to. auto-setup creates
        # it on first boot; `default` is also the Temporal SDK's own fallback,
        # so Postiz needs no TEMPORAL_NAMESPACE of its own.
        DEFAULT_NAMESPACE: default
        DEFAULT_NAMESPACE_RETENTION: 72h

        # --- observability -----------------------------------------------
        PROMETHEUS_ENDPOINT: "0.0.0.0:9090"
        LOG_LEVEL: info
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
