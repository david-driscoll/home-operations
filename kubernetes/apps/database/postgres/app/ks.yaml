---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres
  namespace: &namespace database
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/database/postgres/app
  dependsOn:
    - name: postgres-operator
      namespace: cloudnative-pg
    - name: external-secrets
      namespace: kube-system
  prune: true
  # Never cascade-delete what this manages on a Kustomization ownership
  # change. On 2026-08-13 an external-secrets CRD cascade took the CNPG
  # Cluster CR *and its PVCs* with it -- see
  # docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  force: false
  suspend: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      POSTGRES_STORAGE: "40Gi"
