---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
# The two credentials that are NOT app-scoped, so they do not come from
# `components/postgres`: the ${CLUSTER_CNAME} login role and the cluster
# superuser. Both roles stay declared inline in `resources/values.yaml`
# (`cluster.roles` and `superuserSecret`) rather than as `DatabaseRole` CRs --
# `postgres` is the break-glass path and must never end up under OpenBao's
# control. See docs/postgres-credentials/PLAN.md.
#
# Lifted verbatim out of the generated `users.yaml` when Update.cs was retired;
# the shape is the old `postgres-user-template.yaml` with the role name
# substituted in. Hand-maintained from here on -- there are exactly two.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name postgres-user
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshPolicy: Periodic
  refreshInterval: 4m
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      templateFrom:
        - target: Data
          configMap:
            name: pgsql-user-template
            items:
            - key: username
              templateAs: Values
            - key: password
              templateAs: Values
            - key: hostname
              templateAs: Values
            - key: public-hostname
              templateAs: Values
            - key: port
              templateAs: Values
            - key: database
              templateAs: Values
            - key: pgpass
              templateAs: Values
            - key: jdbc-uri
              templateAs: Values
            - key: uri
              templateAs: Values
            - key: uriql
              templateAs: Values
            - key: public-jdbc-uri
              templateAs: Values
            - key: public-uri
              templateAs: Values
            - key: public-uriql
              templateAs: Values
            - key: connection-string
              templateAs: Values
            - key: public-connection-string
              templateAs: Values
  dataFrom:
    - extract:
        key: "postgres-user-password"
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
