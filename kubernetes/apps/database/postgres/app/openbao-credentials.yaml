---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The password-bearing `openbao-postgres` credential Secret. OpenBao itself no
# longer uses it -- it authenticates with a client certificate since phase 2.3b.
#
# It is still here for exactly one consumer: the nightly `openbao-replica-dump`
# CronJob in kube-system, whose ExternalSecret pulls `uri` out of this Secret
# and hands it to `pg_dump` as PG_URI. That is the OpenBao backup path
# (bootstrap/RUNBOOK.md Scenarios B and D), so it is not optional.
#
# WHY IT LIVES HERE. It used to be rendered by components/postgres, which
# openbao left in phase 2.4a. That left this object orphaned -- alive only
# because of `prune: disabled` plus the nested ks's `deletionPolicy: Orphan`,
# with nothing in git declaring it. An undeclared object that a backup depends
# on is a trap: the next person to tidy up orphans takes the nightly dump with
# it. Re-declared here so it is owned again.
#
# WHEN IT GOES. Phase 2.4b sets `disablePassword: true` on the openbao role,
# which ALTERs the password to NULL and breaks this URI. So 2.4b MUST first
# move openbao-replica onto the same client certificate -- the CronJob would
# need `openbao-client-cert` mounted and a cert-based PG_URI. Only then can
# this file, the sops document and the password all go together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openbao-postgres
  annotations:
    reloader.stakater.com/auto: "true"
    # `creationPolicy: Owner` puts an ownerReference on the Secret this
    # produces, so pruning THIS object garbage-collects the live credential --
    # for the app and for CNPG both. `target.deletionPolicy: Retain` does not
    # cover that; it governs the provider-side key vanishing, not this object
    # being deleted. The nested ks is already `deletionPolicy: Orphan`, so this
    # only guards the narrower case of a reconcile that stops rendering it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 4m
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      templateFrom:
        - target: Data
          configMap:
            name: pgsql-user-template
            items:
            - key: username
              templateAs: Values
            - key: password
              templateAs: Values
            - key: hostname
              templateAs: Values
            - key: public-hostname
              templateAs: Values
            - key: port
              templateAs: Values
            - key: database
              templateAs: Values
            - key: pgpass
              templateAs: Values
            - key: jdbc-uri
              templateAs: Values
            - key: uri
              templateAs: Values
            - key: uriql
              templateAs: Values
            - key: public-jdbc-uri
              templateAs: Values
            - key: public-uri
              templateAs: Values
            - key: public-uriql
              templateAs: Values
            - key: connection-string
              templateAs: Values
            - key: public-connection-string
              templateAs: Values
  dataFrom:
    - extract:
        key: "openbao-postgres-password"
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
