---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/charts/refs/heads/main/charts/cluster/values.schema.json
nameOverride: &name "postgres"
fullnameOverride: *name
type: postgresql
# STEP 1 OF THE 17 -> 18 MIGRATION. Do not skip straight to 18 from 17.5.
#
# `check_max_slot_wal_keep_size` in the 17.0-17.5 backend raises a hard ERROR
# when `max_slot_wal_keep_size` is other than -1 *and* the server is started
# in binary-upgrade mode -- which is exactly how pg_upgrade starts the OLD
# server. We set it to 10GB below (deliberately, after the WAL-fill outage), so
# a 17.5 -> 18 pg_upgrade cannot start the old postmaster and fails outright.
#
# postgres/postgres@f36e5774 removed that check_hook and was backpatched to
# 17.6, so the fix lives in the OLD server's binaries -- meaning the source
# cluster has to be running 17.6+ before the major upgrade is attempted. This
# is a plain rolling minor upgrade: replicas first, then a switchover. No
# pg_upgrade, no downtime, no data-format change.
#
# Bare tags now resolve to the "system" flavour on bullseye (the legacy 17.5
# image was pgdg110 = bullseye too), so the OS distribution is unchanged --
# which matters, because CNPG only supports a major upgrade between images
# built on the same distro. Verified in-cluster that 17.11 carries the same
# extension set this estate actually uses (vector, cube, earthdistance,
# pg_trgm, unaccent, uuid-ossp, pg_stat_statements) and the same uid 26.
#
# TRACKING, fixed in this same change: nothing watched this image before. The
# `helm-values` manager only recognises `image.repository`/`image.tag` pairs and
# this chart takes a single `imageName` string, so the cluster sat on 17.5 for a
# year while every other image in the estate moved -- that is the whole reason
# the 17.6 fix above was missed until the 18 upgrade went looking for it.
#
# Both lines below now carry an annotation for the "Process annotated
# dependencies" custom manager in .github/renovate.json5. They resolve to the
# same depName and currentValue, so one update rewrites both, and they have to
# move together: `version.postgresql` is what the chart derives
# `cluster.postgresqlMajor` from.
#
# Majors are blocked outright by the "Never propose a Postgres major" rule
# there -- crossing one is a written migration, never a merged tag change.
version:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  postgresql: "17.11"
mode: standalone
recovery:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  clusterName: "postgres"
  endpointURL: "{{ .minio_endpoint }}"
  provider: s3
  s3:
    region: "{{ .minio_region }}"
    bucket: "cnpg-${CLUSTER_CNAME}"
    path: "/barman/${CLUSTER_CNAME}"
    accessKey: "{{ .minio_username }}"
    secretKey: "{{ .minio_password }}"
backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  endpointURL: "{{ .minio_endpoint }}"
  provider: s3
  s3:
    region: "{{ .minio_region }}"
    bucket: "cnpg-${CLUSTER_CNAME}"
    path: "/barman/${CLUSTER_CNAME}-20260813"
    accessKey: "{{ .minio_username }}"
    secretKey: "{{ .minio_password }}"
  wal:
    compression: gzip
    encryption: ''
    maxParallel: 4
  data:
    compression: gzip
    encryption: ''
    jobs: 2
  scheduledBackups:
  - name: daily-backup
    schedule: "${POSTGRES_BACKUP_SCHEDULE:=0 0 16 * * *}"
    backupOwnerReference: self
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "30d"
cluster:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11
  priorityClassName: system-node-critical
  storage:
    size: ${POSTGRES_STORAGE:=10Gi}
    storageClass: longhorn-local
  resources:
    requests:
      cpu: ${POSTGRES_REQUESTS_CPU}
      memory: ${POSTGRES_REQUESTS_MEMORY}
    limits:
      cpu: ${POSTGRES_LIMITS_CPU}
      memory: ${POSTGRES_LIMITS_MEMORY}
  logLevel: "info"
  affinity:
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  enableSuperuserAccess: true
  superuserSecret: "postgres-superuser-password"
  roles:
  - name: ${CLUSTER_CNAME}
    ensure: present
    login: true
    superuser: true
    passwordSecret:
      name: postgres-user-password
  # The 17 app roles that used to be spliced in here by
  # kubernetes/components/postgres/Update.cs are now `DatabaseRole` CRs,
  # rendered per app by components/postgres. See
  # docs/postgres-credentials/PLAN.md.
  #
  # $${CLUSTER_CNAME} stays inline deliberately: it is not app-scoped, and
  # together with `superuserSecret` above it is the break-glass path into
  # this cluster. Neither may move under OpenBao's control.
  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      excludeRules:
      - CNPGClusterLogicalReplicationErrorsCritical
      - CNPGClusterLogicalReplicationErrors
      - CNPGClusterLogicalReplicationStoppedCritical
      - CNPGClusterLogicalReplicationStopped
    disableDefaultQueries: false
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "${POSTGRES_SHARED_BUFFERS}"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      wal_keep_size: "1GB"
      max_slot_wal_keep_size: "10GB"
      wal_sender_timeout: "120s"
      wal_receiver_timeout: "120s"
      tcp_keepalives_idle: "10"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "3"
    # Inserted between CNPG's fixed rules and its default
    # `host all all all scram-sha-256` catch-all, so this is matched first for
    # an SSL connection as `openbao` to the `openbao` database.
    #
    # This change is a NO-OP on its own, and that is the point. pg_hba matches
    # on connection type: `hostssl` does not match a non-SSL connection, and
    # BAO_PG_CONNECTION_URL still ends in `?sslmode=disable`. So OpenBao keeps
    # falling through to the catch-all and keeps using its password until the
    # URL is switched -- which makes that switch a one-line, database-free
    # rollback. Closing the password path (`hostnossl openbao openbao all
    # reject`) is a separate later step, after the cert path has soaked.
    pg_hba:
      - hostssl openbao openbao all cert
      # Phase 3: the database secrets engine's rotation connection. Same
      # inertness as the line above -- `hostssl` cannot match a non-SSL
      # connection, and nothing connects as baoadmin until the engine is
      # configured from Pulumi. Database is `postgres`, not an app database:
      # the engine connects to the maintenance database to ALTER other roles.
      - hostssl postgres baoadmin all cert
      # PHASE 2.4b. No longer inert: this closes the password path entirely.
      #
      # The rules above only ever matched SSL connections, so a NON-SSL
      # connection as openbao still fell through to CNPG's
      # `host all all all scram-sha-256` catch-all and authenticated with a
      # password. With the role's password now NULL that would fail anyway --
      # this makes it fail at the pg_hba layer instead, and makes the intent
      # explicit rather than incidental.
      #
      # Ordering is safe: hostssl and hostnossl are disjoint, and both sit ahead
      # of the catch-all.
      - hostnossl openbao openbao all reject
    pg_ident: []
    shared_preload_libraries: []
    ldap: {}
  serviceAccountTemplate: {}
  additionalLabels: {}
  annotations: {}
imageCatalog:
  create: true
  images: []
poolers: []
