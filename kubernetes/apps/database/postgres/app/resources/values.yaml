---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/charts/refs/heads/main/charts/cluster/values.schema.json
nameOverride: &name "postgres"
fullnameOverride: *name
type: postgresql
# STEP 2 OF THE 17 -> 18 MIGRATION: the major upgrade itself.
#
# MERGE THIS ONLY ONCE THE CLUSTER IS ACTUALLY REPORTING 17.11. Step 1 was the
# 17.5 -> 17.11 minor bump, and it is a hard prerequisite, not tidiness: the
# 17.0-17.5 backend raises an ERROR from `check_max_slot_wal_keep_size` when
# `max_slot_wal_keep_size` is other than -1 and the server is started in
# binary-upgrade mode, which is exactly how pg_upgrade starts the OLD server.
# We set that GUC to 10GB below on purpose (after the WAL-fill / stuck-slot
# outage), so from 17.5 the upgrade cannot even start the old postmaster.
# postgres/postgres@f36e5774 removed the check_hook and was backpatched to
# 17.6, and it lives in the OLD server's binaries -- hence step 1 first.
#
# WHAT THE OPERATOR DOES (CNPG 1.30, declarative offline in-place upgrade):
# shuts every pod down, records the old image in `.status.pgDataImageInfo`,
# runs a `postgres-<n>-major-upgrade` Job that does `pg_upgrade --link` on the
# primary's volume, then DESTROYS both replica PVC groups and re-clones them
# from the upgraded primary. The whole cluster is offline for the duration.
# At ~1GB total this is minutes, not hours, but it is a real outage window --
# every app in the estate that talks to postgres-rw is down for it.
#
# ROLLBACK: revert this file to 17.11. pg_upgrade does not modify the source
# data directory, so the operator detects the reverted image, deletes the
# failed Job, and restarts on the old major. That is the whole reason this is
# preferable to a dump/restore -- but it is only true while the upgrade Job is
# failing. Once it has SUCCEEDED, going back is a restore from the PG17
# archive, so the point of no return is the Job's success, not the merge.
#
# DISTRO: bare tags resolve to the "system" flavour on bullseye, same as
# 17.11, and CNPG only supports a major upgrade between images built on the
# same OS distribution. Verified in-cluster that 18.6 carries every extension
# in use here -- vector (0.8.6 available; the installed 0.8.0 is carried over
# untouched by pg_upgrade), cube, earthdistance, pg_trgm, unaccent, uuid-ossp,
# pg_stat_statements -- and runs as the same uid 26.
#
# DATA CHECKSUMS: 18's initdb enables them by default and pg_upgrade demands
# both clusters match; this one has them OFF. The operator handles that on its
# own (`tryAddDataChecksums` passes `--no-data-checksums` for a 18+ target),
# so the upgraded cluster stays checksum-off. Turning them on is a separate,
# optional exercise and cannot be done as part of this.
#
# NO REINDEX NEEDED: 18 makes full-text search and pg_trgm read their configs
# through the cluster's default collation provider instead of always libc,
# which is a reindex hazard for ICU/builtin clusters. Every database here is
# datlocprovider='c' with C collation, so nothing changes.
#
# AFTER THE UPGRADE, in order:
#   1. `ANALYZE` every database -- pg_upgrade carries no optimizer statistics.
#   2. Apply `update_extensions.sql` from the primary's PGDATA if the operator
#      logged that pg_upgrade emitted one (it will, for vector 0.8.0 -> 0.8.6).
#   3. Take a fresh base backup IMMEDIATELY. Until one exists there is no
#      recovery baseline for the new major at all -- see the backup path note.
#
# TRACKING: nothing watched this image until step 1 -- the `helm-values`
# manager only recognises `image.repository`/`image.tag` pairs and this chart
# takes a single `imageName` string, so the cluster sat on 17.5 for a year while
# every other image in the estate moved. The annotation on `imageName` feeds the
# "Process annotated dependencies" custom manager in .github/renovate.json5.
# `version.postgresql` used to carry a twin annotation on the same depName so
# one update rewrote both; since the move to the TimescaleDB image family (whose
# tags are `<pg>-<postgis>-<date>-<flavour>-<os>`, not a bare `18.6`) only
# `imageName` is tracked -- see the note on `version` below.
#
# Majors are blocked outright by the "Never propose a Postgres major" rule
# there. Renovate will offer 18.x minors and dated rebuilds from here on --
# those are rolling restarts, safe to take. It will never offer 19.
version:
  # NOT Renovate-annotated any more -- see `cluster.imageName`. The chart only
  # derives `cluster.postgresqlMajor` from this, and a major is never automated
  # (the "Never propose a Postgres major" rule), so it only changes by hand, on a
  # major, together with the image. Keep the minor in step when you touch it so
  # the two do not read as disagreeing.
  postgresql: "18.6"
mode: standalone
# DORMANT, AND NOT RENDERED AT ALL. `mode: standalone` means this cluster
# bootstraps with initdb, and under that mode the chart emits only the
# `postgres-backups` ObjectStore -- verified with
# `helm get hooks postgres -n database`, which lists exactly one ObjectStore.
# So this block is INERT: editing it changes nothing in the cluster. It is
# rendered from whatever these values say at the moment someone flips
# `mode: recovery` to rebuild from the archive, which is precisely the day it
# has to be right.
#
# (An earlier version of this note claimed the chart renders it under
# standalone and it merely goes unread. That was wrong, and it matters: it
# invites "fix the recovery path" changes that appear to land and do nothing.
# A `postgres-recovery` CR in the namespace is an ORPHAN from a past restore --
# both ObjectStores are Helm hooks, which Helm does not prune -- not evidence
# that this block is live. See the Restore notes in docs/garage-offsite-s3.md.)
#
# STILL ON MINIO, DELIBERATELY, while backups below moved to Garage. The
# barman-cloud plugin allows exactly one backup/archive object store per
# cluster (the sidecar resolves the store from the Cluster's plugin config;
# a ScheduledBackup's barmanObjectName parameter is ignored -- cloudnative-pg
# issue 7778, confirmed against the plugin source), so the cutover is a flip,
# not an addition -- and at the moment of the flip the Garage store holds
# NOTHING. Until a base backup lands there and is verified, the minio archive
# is the only thing a rebuild can restore from, so recovery keeps naming it.
#
# FOLLOW-UP, part of the cutover runbook (docs/garage-offsite-s3.md): once the
# first Garage base backup succeeds, repoint this block at the garage_* values
# (same shape as backups below). Until then the minio archive is frozen --
# nothing writes OR prunes it after the flip, so its last 30 days of history
# stay readable indefinitely.
#
# `recovery.s3.path` and `backups.s3.path` are kept as two separate knobs on
# purpose, NOT aliased to one value. They are the same only in steady state:
# recovery is the archive you rebuild FROM, and during an actual restore
# exercise it is meant to be edited to an older prefix while backups keep
# writing to the current one. That is exactly how `-20260813` came to exist,
# and forcing them equal would break the workflow that produced it. The cost is
# that they can drift -- which they did, twice -- so when you change one, look
# at the other.
recovery:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  clusterName: "postgres"
  endpointURL: "{{ .minio_endpoint }}"
  provider: s3
  s3:
    region: "{{ .minio_region }}"
    bucket: "cnpg-${CLUSTER_CNAME}"
    path: "/barman/${CLUSTER_CNAME}-pg18"
    accessKey: "{{ .minio_username }}"
    secretKey: "{{ .minio_password }}"
# THE GARAGE CUTOVER IS STAGED, NOT DONE. This block is the ONE
# backup/archive object store the barman-cloud plugin will serve for this
# cluster -- WAL archiving and base backups both -- and it is meant to become
# the geo-distributed Garage cluster on the celestia/luna/skystar dockge hosts
# (docker/_common/garage). Why a flip and not an addition: the plugin resolves
# its object store from the Cluster's plugin configuration only, so a second
# ObjectStore + ScheduledBackup pair targeting Garage would silently back up
# into THIS store instead (cloudnative-pg issue 7778; verified in
# plugin-barman-cloud internal/cnpgi/instance/backup.go).
#
# IT STILL NAMES MINIO, and the ordering that forces this is not negotiable:
#
#   1. The Garage cluster must be up and laid out (docs/garage-offsite-s3.md
#      steps 1-3) -- pointing barman at a store that does not answer stops WAL
#      archiving, and postgres cannot recycle a segment barman has not
#      confirmed, so pg_wal grows until the PVCs fill. That is the WAL-fill
#      cascade, and it is an outage, not a degradation.
#   2. stacks/system must then mint the bucket key and write
#      `clusters/equestria/apps/postgres/garage-backup` (step 4).
#   3. ONLY THEN do this block and the garage extract in externalsecret.yaml
#      flip together -- see the note there for what merging the extract early
#      cost (#1233 -> #1235: a 23-Kustomization reconciliation freeze).
#
# When flipping: endpointURL/region/bucket/accessKey/secretKey become the
# garage_* values, and the endpoint should be http://garage-s3.<tailnet>:3900 --
# the Tailscale VIP, NOT http://dockge-celestia.<tailnet>:3900. Both work; the
# VIP is advertised by all three Garage nodes and answers from whichever is up,
# whereas the per-node name pins every backup to celestia. This is the OFF-SITE
# copy, so the node most likely to be unreachable is precisely the one it would
# otherwise be pinned to.
#
# Pods have no route to tailnet IPs either way, so the traffic rides a
# tailscale-operator egress Service. Both are declared and inert:
# `garage-s3` (the VIP) in stacks/unifi-network/tailnet-egress.ts, and
# `dockge-celestia` in tailscale-system/services/bootstrap.yaml. The ACL is
# opened by the `garage-s3-backups` grant, which covers the VIP too -- Tailscale
# evaluates VIP traffic against the advertising node's tag:dockge. Plain http is
# fine: WireGuard end to end. Then TAKE A BASE BACKUP IMMEDIATELY
# (`kubectl cnpg backup postgres --method plugin -n database`): until one
# succeeds the Garage archive holds WAL with no base to replay it onto, which
# is also why the recovery block above stays on minio until it is verified.
backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  endpointURL: "{{ .minio_endpoint }}"
  provider: s3
  s3:
    region: "{{ .minio_region }}"
    bucket: "cnpg-${CLUSTER_CNAME}"
    # The `-pg18` suffix is REQUIRED BY the major upgrade, not cosmetic.
    #
    # pg_upgrade gives the cluster a new system identifier and resets the
    # timeline to 1. Barman Cloud does not separate archives across a major on
    # its own -- with the path unchanged, PG18's fresh timeline-1 WAL segments
    # would be written over PG17's timeline-1 segments in the same prefix, and
    # the 30d retention would then age out a mixed-major archive. That destroys
    # the only rollback path that exists once the upgrade Job has succeeded.
    #
    # Keeping the old prefix intact leaves the PG17 archive readable for as
    # long as the bucket holds it. Note it is only usable to restore a *17*
    # cluster: PITR across a major boundary is not a thing, so the pre-upgrade
    # backups can never roll forward into the 18 cluster.
    #
    # The suffix carries over to the Garage bucket unchanged when this flips:
    # that bucket starts empty so nothing collides today, but the NEXT major
    # needs the same split and the convention should already be standing.
    path: "/barman/${CLUSTER_CNAME}-pg18"
    accessKey: "{{ .minio_username }}"
    secretKey: "{{ .minio_password }}"
  wal:
    compression: gzip
    encryption: ''
    maxParallel: 4
  data:
    compression: gzip
    encryption: ''
    jobs: 2
  scheduledBackups:
  - name: daily-backup
    schedule: "${POSTGRES_BACKUP_SCHEDULE:=0 0 16 * * *}"
    backupOwnerReference: self
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "30d"
cluster:
  instances: 3
  # TIMESCALEDB-CAPABLE OPERAND, ADDED FOR media/tracearr. This is the official
  # `ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm` image with the
  # packagecloud TimescaleDB (TSL build, so compression and continuous aggregates
  # work), timescaledb_toolkit, PostGIS and pgRouting layered on, still running as
  # uid 26: https://github.com/imusmanmalik/cloudnative-pg-timescaledb-postgis-containers
  # (Dockerfile is `FROM $BASE` + one apt layer). Everything the previous image
  # carried -- vector, pg_trgm, unaccent, uuid-ossp, cube, earthdistance,
  # pg_stat_statements -- comes from that same base.
  #
  # IT MOVES THE OS FROM BULLSEYE TO BOOKWORM. The bare `18.6` tag this replaces
  # is the same digest as `18.6-system-bullseye` (checked against the registry
  # 2026-09-12), and the TimescaleDB family is only built on bookworm/trixie.
  # Same PostgreSQL minor, so CNPG does a ROLLING update (replicas, then a
  # switchover), not an offline major upgrade -- the "same distribution" rule in
  # the header only binds pg_upgrade. glibc 2.31 -> 2.36 can reorder libc
  # collations, which would silently corrupt text indexes; it cannot here because
  # every database is `datlocprovider = 'c'` with `C`/`C` (re-verified live
  # 2026-09-12, all 38 databases). The column-level check to re-run before
  # merging, in every database, expecting zero rows:
  #
  #   SELECT DISTINCT c.collname FROM pg_attribute a
  #     JOIN pg_collation c ON c.oid = a.attcollation
  #    WHERE c.collname NOT IN ('default','C','POSIX','ucs_basic');
  #
  # ROLLBACK: revert this line AND `shared_preload_libraries` together, as one
  # change -- a server told to preload a library its image lacks will not start.
  # That is clean for as long as no database has run `CREATE EXTENSION
  # timescaledb`. Once tracearr's has, its database must be dropped (or the
  # extension removed) first.
  #
  # EXTENSION UPDATES ARE MANUAL. An image bump ships a newer timescaledb, but
  # the installed extension stays put until `ALTER EXTENSION timescaledb UPDATE`
  # runs as its owner -- which is the superuser, because CNPG's `Database`
  # created it, not the app. It must be the FIRST statement in its session.
  # Tracearr logs a drift warning at boot when this is due.
  #
  # NO DIGEST, ON PURPOSE. The annotated-dependency regex manager captures the
  # tag only and cannot rewrite an `@sha256:` suffix, so a digest here would be
  # left behind on every bump and silently keep the old image. The dated tag is
  # immutable by the publisher's policy; that is the pin.
  #
  # `versioning` for this tag shape lives in .github/renovate.json5.
  # renovate: datasource=docker depName=ghcr.io/imusmanmalik/timescaledb-postgis
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:18.6-3.6.4-202609071017-system-bookworm
  priorityClassName: system-node-critical
  storage:
    size: ${POSTGRES_STORAGE:=10Gi}
    storageClass: longhorn-local
  resources:
    requests:
      cpu: ${POSTGRES_REQUESTS_CPU}
      memory: ${POSTGRES_REQUESTS_MEMORY}
    limits:
      cpu: ${POSTGRES_LIMITS_CPU}
      memory: ${POSTGRES_LIMITS_MEMORY}
  logLevel: "info"
  affinity:
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  enableSuperuserAccess: true
  superuserSecret: "postgres-superuser-password"
  roles:
  - name: ${CLUSTER_CNAME}
    ensure: present
    login: true
    superuser: true
    passwordSecret:
      name: postgres-user-password
  # The 17 app roles that used to be spliced in here by
  # kubernetes/components/postgres/Update.cs are now `DatabaseRole` CRs,
  # rendered per app by components/postgres. See
  # docs/postgres-credentials/PLAN.md.
  #
  # $${CLUSTER_CNAME} stays inline deliberately: it is not app-scoped, and
  # together with `superuserSecret` above it is the break-glass path into
  # this cluster. Neither may move under OpenBao's control.
  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      excludeRules:
      - CNPGClusterLogicalReplicationErrorsCritical
      - CNPGClusterLogicalReplicationErrors
      - CNPGClusterLogicalReplicationStoppedCritical
      - CNPGClusterLogicalReplicationStopped
    disableDefaultQueries: false
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "${POSTGRES_SHARED_BUFFERS}"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      wal_keep_size: "1GB"
      max_slot_wal_keep_size: "10GB"
      wal_sender_timeout: "120s"
      wal_receiver_timeout: "120s"
      tcp_keepalives_idle: "10"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "3"
      # TimescaleDB, for media/tracearr. Added in its own change, after the
      # operand image, because CNPG's validating webhook refuses an image change
      # and a `parameters` change in one update while `primaryUpdateMethod:
      # switchover` (validateConfigurationChange, internal/webhook/v1/
      # cluster_webhook.go, 1.30.0) -- which is exactly how #1638 was denied and
      # rolled back on 2026-09-12. #1649 then shipped the image alone. Keep any
      # future image bump and any parameter edit in SEPARATE changes for the same
      # reason.
      #
      # `timescaledb.license` is pinned even though the packagecloud TSL build
      # already defaults to `timescale` (verified in the tracearr database after
      # the roll): tracearr, finding `apache`, would try to fix it with ALTER
      # SYSTEM -- which its non-superuser role cannot do -- and then run without
      # compression. The GUC only accepts file/argv sources, so this is the one
      # place it can come from, and pinning it means a future image built
      # Apache-only cannot silently change it.
      #
      # These GUCs are registered by the versioned TimescaleDB library, which the
      # preloaded loader only pulls into a backend connected to a database that
      # has the extension. `SHOW timescaledb.license;` in `postgres` therefore
      # errors with "unrecognized configuration parameter"; check it in
      # `tracearr` instead.
      timescaledb.license: timescale
      timescaledb.telemetry_level: "off"
      # Tracearr's own compose ships 4096 for large Tautulli imports over many
      # chunks. The lock table is sized max_locks_per_transaction x
      # (max_connections + max_prepared_transactions), so at 300 connections 4096
      # would pin roughly 300MB of shared memory on every instance. 512 is ~8x the
      # default; raise it only if an import actually fails with "out of shared
      # memory" / "Try increasing max_locks_per_transaction". Changing it needs a
      # restart, which CNPG performs as a rolling one (replicas, then switchover).
      max_locks_per_transaction: "512"
    # Inserted between CNPG's fixed rules and its default
    # `host all all all scram-sha-256` catch-all, so this is matched first for
    # an SSL connection as `openbao` to the `openbao` database.
    #
    # This change is a NO-OP on its own, and that is the point. pg_hba matches
    # on connection type: `hostssl` does not match a non-SSL connection, and
    # BAO_PG_CONNECTION_URL still ends in `?sslmode=disable`. So OpenBao keeps
    # falling through to the catch-all and keeps using its password until the
    # URL is switched -- which makes that switch a one-line, database-free
    # rollback. Closing the password path (`hostnossl openbao openbao all
    # reject`) is a separate later step, after the cert path has soaked.
    pg_hba:
      - hostssl openbao openbao all cert
      # Phase 3: the database secrets engine's rotation connection. Same
      # inertness as the line above -- `hostssl` cannot match a non-SSL
      # connection, and nothing connects as baoadmin until the engine is
      # configured from Pulumi. Database is `postgres`, not an app database:
      # the engine connects to the maintenance database to ALTER other roles.
      - hostssl postgres baoadmin all cert
      # PHASE 2.4b. No longer inert: this closes the password path entirely.
      #
      # The rules above only ever matched SSL connections, so a NON-SSL
      # connection as openbao still fell through to CNPG's
      # `host all all all scram-sha-256` catch-all and authenticated with a
      # password. With the role's password now NULL that would fail anyway --
      # this makes it fail at the pg_hba layer instead, and makes the intent
      # explicit rather than incidental.
      #
      # Ordering is safe: hostssl and hostnossl are disjoint, and both sit ahead
      # of the catch-all.
      - hostnossl openbao openbao all reject
    pg_ident: []
    # `timescaledb` must be preloaded before any database can CREATE EXTENSION
    # it. CNPG still appends `pg_stat_statements` on its own (the
    # `pg_stat_statements.*` parameters above trigger that), so the live value
    # becomes `timescaledb,pg_stat_statements`. Changing this list restarts every
    # instance.
    shared_preload_libraries:
      - timescaledb
    ldap: {}
  serviceAccountTemplate: {}
  additionalLabels: {}
  annotations: {}
imageCatalog:
  create: true
  images: []
poolers: []
