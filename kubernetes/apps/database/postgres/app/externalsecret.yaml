---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-values
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
      templateFrom:
      - target: Data
        configMap:
          name: ${APP}-values
          items:
          - key: values.yaml
            templateAs: Values
  dataFrom:
    # Split source on purpose: the Minio credential has migrated to OpenBao but
    # the ${BACKBLAZE_DATABASE} extract above has NOT (B2 is excluded from the
    # migration, estate decision 2026-08-07). So secretStoreRef stays on
    # onepassword-connect and only this reference is redirected — flipping the
    # store would silently take the Backblaze extract with it.
    - extract:
        # was: 'Spike Minio Access Token'
        key: clusters/equestria/apps/postgres/minio-backup
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "minio_$1"
    # The Garage S3 key for the barman-cloud archive — endpoint, region,
    # bucket, username, password, written by stacks/system (garage.ts) when it mints the
    # cnpg-equestria bucket's key. values.yaml templates these into the chart's
    # `backups:` block as {{ .garage_* }}; the minio_* extract above now feeds
    # only the (dormant) recovery block. ORDERING: until that stack has run
    # once, this path does not exist, this ExternalSecret stops refreshing, and
    # the Retain'd target keeps its previous rendering — postgres simply keeps
    # backing up to wherever the last successful render pointed. Degraded, not
    # destructive.
    - extract:
        key: clusters/equestria/apps/postgres/garage-backup
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "garage_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-backup-config
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-backup-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        rclone.conf: |
          [local]
          type = s3
          provider = Rclone
          endpoint = {{ .minio_endpoint }}
          access_key_id = {{ .minio_username }}
          secret_access_key = {{ .minio_password }}
          use_multipart_uploads = false
  dataFrom:
    # Split source on purpose: the Minio credential has migrated to OpenBao but
    # the ${BACKBLAZE_DATABASE} extract above has NOT (B2 is excluded from the
    # migration, estate decision 2026-08-07). So secretStoreRef stays on
    # onepassword-connect and only this reference is redirected — flipping the
    # store would silently take the Backblaze extract with it.
    - extract:
        # was: 'Spike Minio Access Token'
        key: clusters/equestria/apps/postgres/minio-backup
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "minio_$1"
