---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/database_v1.json
#
# OpenBao's database and role, hand-written rather than rendered by
# `components/postgres`. Phase 2.4 of docs/postgres-credentials/PLAN.md.
#
# It is carved out because OpenBao authenticates with a client certificate and
# needs no credential Secret at all — and rendering one is the component's
# entire job. Keeping it on the component would mean carrying a
# `<app>-postgres` ExternalSecret, a `<app>-postgres-password` sops document
# and a `passwordSecret` reference that nothing reads.
#
# The deeper reason it can never rejoin: OpenBao stores its own state in this
# cluster, so its database credential is the one credential in the estate that
# cannot come from OpenBao. Phase 3 hands every other app's password to
# OpenBao's database secrets engine; this role has to sit outside that.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # NOT backed up by the postgres-backup CronJob, and this annotation is what
    # stops it trying. That job enumerates `Database` resources and reads a
    # credential Secret for each; openbao's role authenticates with a client
    # certificate and, since phase 2.4b below, has `disablePassword: true` and a
    # `hostnossl openbao openbao all reject` rule -- there is no password
    # anywhere and `openbao-postgres` was deleted with the sops document.
    #
    # ⚠️ Without this the job fails NIGHTLY on a Secret that is deliberately
    # absent, and one failed database exits the whole run non-zero. It is
    # opt-OUT here (unlike a Garage bucket, where the same annotation opts one
    # IN) because forgetting it on a database loses data.
    #
    # openbao IS backed up -- kube-system/openbao-replica runs its own nightly
    # pg_dump over the same client certificate, which is exactly why the
    # password could be removed. See resources/App.cs.
    driscoll.dev/backup: "false"
    driscoll.dev/backup-reason: >-
      client-certificate auth, no password; dumped nightly by openbao-replica
spec:
  cluster:
    name: postgres
  name: openbao
  owner: openbao
  ensure: present
  allowConnections: true
  databaseReclaimPolicy: retain
  schemas:
    - ensure: present
      name: public
      owner: openbao
    - ensure: present
      name: openbao
      owner: openbao
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: openbao
  annotations:
    # REQUIRED, not defensive. With clientCertificate enabled this role OWNS
    # the generated `openbao-client-cert` Secret through a controller
    # ownerReference, and CNPG's deleteOwnedCertSecret removes it outright the
    # moment `enabled` goes false. Pruning this object would take OpenBao's
    # only storage credential with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  cluster:
    name: postgres
  name: openbao
  comment: "openbao storage backend"
  ensure: present
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  clientCertificate:
    enabled: true
  # PHASE 2.4b: the rollback is now deliberately gone.
  #
  # Still no passwordSecret -- the instance manager does not manage this role's
  # password. `disablePassword: true` goes further and ALTERs the password to
  # NULL, so there is nothing to fall back to and no way back without a manual
  # ALTER ROLE. That is the intent, not a side effect.
  #
  # Taken only after the cert path soaked. All three replicas have run 31h on a
  # password-free connection_url and they STARTED on it -- the pods were created
  # 90 minutes after the certificate Secret existed, so that is a cold-start
  # proof rather than a long-lived connection that merely survived. Postgres
  # reports all six openbao backends on TLSv1.3.
  #
  # The prerequisite is done too: openbao-replica's nightly pg_dump moved onto
  # the same certificate, and a manually triggered run shipped
  # openbao-20260826-034528.sql.age before this landed. Without that, NULLing
  # the password breaks the backup at 03:00 rather than at merge.
  disablePassword: true
