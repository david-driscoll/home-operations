---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/serviceaccount-v1.json
#
# The identity the rotation generator authenticates to OpenBao with.
#
# WHY IT HAS TO LIVE HERE, IN `database`
#
# ESO resolves a generator's `serviceAccountRef` in the namespace of the
# ExternalSecret that invokes it, and IGNORES the `namespace` field. Pointing at
# `external-secrets` in kube-system fails with
#
#   cannot get Kubernetes service account "external-secrets":
#   ServiceAccount "external-secrets" not found
#
# even from a cluster-scoped ClusterGenerator with `namespace: kube-system`
# spelled out — verified on the live object, whose spec carries the field and is
# still resolved against `database`. ClusterSecretStore honours it; the
# generator path does not.
#
# WHY A DEDICATED IDENTITY RATHER THAN COPYING `external-secrets` HERE
#
# An SA called `external-secrets` in this namespace would have to be bound to
# the `eso-equestria` OpenBao role to be useful, and that role can read every
# `secrets/` prefix in the estate. This one is bound to `eso-postgres-rotation`
# instead, which grants exactly `database/static-creds/*` and nothing else. Any
# workload that manages to mount it gets the rotated Postgres passwords — which
# it could already read from the `<app>-postgres` Secrets sitting in this
# namespace — and gains nothing further.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-postgres-rotation
  annotations:
    # Nothing should mount this. It exists so ESO can mint a token for it.
    kubernetes.io/enforce-mountable-secrets: "false"
automountServiceAccountToken: false
