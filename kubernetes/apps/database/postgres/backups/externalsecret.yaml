---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postgres-backup-restic
    creationPolicy: Owner
    # Everything restic needs to stream the nightly dumps into Garage
    # (docs/plans/host-owned-backups.md §C4, phase 3 step 5): the `postgres`
    # prefix of the `backrest-pgdump` bucket, reached the way the VolSync
    # movers reach theirs. kubernetes/components/volsync/externalsecret.yaml
    # explains the route, celestia's node over the LAN on plain HTTP. restic
    # encrypts every pack before it leaves the pod.
    #
    # The password is the VolSync one, on purpose: Backrest already holds it
    # for its VolSync browse repos, so it can open this repository read-only
    # the same way.
    template:
      data:
        RESTIC_REPOSITORY: "s3:{{ .garage_endpoint }}/{{ .garage_bucket }}/postgres"
        RESTIC_PASSWORD: "{{ .credential }}"
        AWS_ACCESS_KEY_ID: "{{ .garage_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_password }}"
        AWS_DEFAULT_REGION: "{{ .garage_region }}"
  dataFrom:
    - extract:
        key: apps/volsync/password
    # The bucket's own read-write key, written by stacks/system (garage.ts)
    # with the bucket and endpoint beside it. ESO fails the WHOLE
    # ExternalSecret on one unreadable extract, so move this line in the same
    # change that moves or renames the record.
    - extract:
        key: clusters/equestria/apps/postgres/garage-pgdump
      rewrite:
        - regexp:
            source: "(.*)"
            target: "garage_$1"
