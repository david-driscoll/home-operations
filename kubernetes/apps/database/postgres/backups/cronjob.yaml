# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postgres-backup
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  values:
    # Reads the `Database` resources in this namespace to decide WHAT to back up
    # and with WHICH credential, then reads those credential Secrets directly.
    # Both are namespaced, so a Role beats a ClusterRole.
    serviceAccount:
      *app : {}

    rbac:
      roles:
        *app :
          type: Role
          rules:
            # `get` only, and only in this namespace: the CronJob resolves each
            # Secret by name off a `Database` annotation and never lists them,
            # so a name-scoped read beats a wildcard.
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get"]
            # `list` is unavoidable here -- the register IS the set of Database
            # objects, so the job cannot know their names in advance. Read-only,
            # one namespace, one resource; a Database carries no secret material.
            - apiGroups: ["postgresql.cnpg.io"]
              resources: ["databases"]
              verbs: ["get", "list"]
      bindings:
        *app :
          type: RoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app

    controllers:
      *app :
        # Deliberately NO `reloader.stakater.com/auto`. This pod template
        # references exactly one ConfigMap -- postgres-backup-script, generated
        # from resources/App.cs with disableNameSuffixHash so it mutates in place
        # -- and zero Secrets: the per-database credentials are read at runtime
        # through the API server under this job's own Role, so Reloader could
        # never observe a rotation here even in principle. What the annotation
        # actually meant was "re-dump all 24 databases the moment someone edits
        # App.cs".
        #
        # On 2026-08-27 that fired: PR #1230 rewrote App.cs, kustomize-controller
        # applied the new ConfigMap at 02:01:41Z, and Reloader POSTed a manual Job
        # (generateName postgres-backup-, `cronjob.kubernetes.io/instantiate:
        # manual`) on top of the 02:00:00Z scheduled run that was still going.
        # `concurrencyPolicy: Forbid` below does NOT protect against this -- Forbid
        # is only enforced by the CronJob controller when IT schedules a run; a Job
        # POSTed straight at the API bypasses the check entirely. The two runs then
        # collided on immich's shared staging file (see the staging-file note in
        # resources/App.cs, which is the defect that made the collision destructive
        # rather than merely wasteful).
        #
        # Trade-off, stated plainly: a change to App.cs now waits for the next
        # 02:00 run rather than taking effect immediately.
        cronjob:
          backoffLimit: 6
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
          schedule: "0 2 * * *"  # Daily at 2 AM
          startingDeadlineSeconds: 30
          successfulJobsHistory: 3
          suspend: false
        type: cronjob
        pod:
          automountServiceAccountToken: true
        serviceAccount:
          identifier: *app
        initContainers:
          # Puts the pinned restic binary where `main` can run it. Ubuntu's
          # packaged restic is too old for `backup --stdin-from-command`, and
          # this keeps one restic version across the estate: the same pin as
          # the etcd CronJobs and the VolSync lock cancellers.
          restic:
            image:
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
              - cp /usr/bin/restic /tools/restic
        containers:
          main:
            image:
              repository: mcr.microsoft.com/dotnet/sdk
              tag: '10.0-noble@sha256:35d40304542c8689331f8cab17c65926cdf48fe711e289321d71924b230a7d29'
              pullPolicy: IfNotPresent
            env:
              # Explicit in the manifest rather than inferred from the
              # service-account token dir, so the namespace the credentials are
              # read from is visible where the RBAC that permits it is.
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              # Databases still in postgres whose application has been removed.
              # They have no `Database` resource -- that is what decommissioned
              # means here -- so they are named rather than being skipped by a
              # "no resource? never mind" rule: an unrepresented LIVE database
              # must stay a hard failure.
              # Their existing dumps are left untouched; nothing is deleted.
              #   keeper   -- app removed 2026-03-26 (6a2139535)
              #   vikunja  -- app removed 2026-07-27 (0b289652f)
              #
              # This is the ONE thing the annotations did not absorb, and there
              # is nowhere for it to go: an entry exists here precisely because
              # the database has no Kubernetes object to annotate. A live
              # database that DOES have one is excluded with
              # `driscoll.dev/backup: "false"` on that resource instead, and the
              # job says so if it finds a name in both places.
              DECOMMISSIONED_DATABASES: "keeper,vikunja"
              # The restic side of each dump (resources/App.cs, WHERE THE DUMPS
              # GO). The binary is the init container's copy; the cache sits in
              # the pod's emptyDir and goes with it.
              RESTIC_BINARY: /tools/restic
              RESTIC_CACHE_DIR: /tmp/restic-cache
            # The repository, its password and the Garage key
            # (externalsecret.yaml). Optional, so a missing Secret cannot stop
            # the pod starting: App.cs then still writes the dump files, says
            # the stream is unavailable, and fails the run.
            envFrom:
              - secretRef:
                  name: postgres-backup-restic
                  optional: true
            command:
              - /bin/sh
              - -c
              # postgresql-client-18 is COUPLED to the CNPG cluster's major:
              # pg_dump aborts against a server newer than itself, so this pin
              # must never lag database/postgres/app/resources/values.yaml. It
              # may lead it -- an 18 client dumps a 17 server fine -- which is
              # why it moved first, in the same change that prepared the 17->18
              # upgrade. Same constraint, same reason, as the openbao-replica
              # nightly dump in kube-system/openbao-replica.
              - >-
                set -eux;
                export DEBIAN_FRONTEND=noninteractive;
                apt-get update
                && apt install -y postgresql-common
                && /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
                && apt-get install -y --no-install-recommends postgresql-client-18
                && dotnet run /scripts/App.cs
            # 1Gi, up from 512Mi: restic now runs in this container beside
            # dotnet and pg_dump, and it holds the repository's index in
            # memory while it chunks a dump.
            resources:
              requests:
                memory: 256Mi
                cpu: 20m
              limits:
                memory: 1Gi
                cpu: 500m

      # Retention for the streamed dumps, the way etcd's prune job owns its
      # repository's. Grouped by host and tags, so each database (tag
      # `db:<name>`) keeps its own 7 daily, 4 weekly and 3 monthly snapshots.
      # `unlock` first removes only locks restic judges stale, left by a
      # killed backup pod.
      prune:
        type: cronjob
        cronjob:
          schedule: "0 6 * * 0"  # Sundays at 6 AM, hours after the 2 AM dumps
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        pod:
          automountServiceAccountToken: false
        containers:
          restic:
            image:
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
              - >-
                restic unlock
                && restic forget --group-by host,tags
                --keep-daily 7 --keep-weekly 4 --keep-monthly 3 --prune
            envFrom:
              - secretRef:
                  name: postgres-backup-restic
            resources:
              requests:
                memory: 128Mi
                cpu: 20m
              limits:
                memory: 1Gi

    # defaultPodOptions:
    #   securityContext:
    #     runAsUser: 999
    #     runAsGroup: 999
    #     fsGroup: 999
    #     runAsNonRoot: true
    #     fsGroupChangePolicy: "OnRootMismatch"
    #     seccompProfile:
    #       type: RuntimeDefault

    # Every volume is mounted by name into the backup job only
    # (advancedMounts), so the prune job carries none of them. In particular
    # it has no NFS mount, and a TrueNAS outage cannot hold it up.
    persistence:
      script:
        type: configMap
        name: postgres-backup-script
        defaultMode: 493
        advancedMounts:
          *app :
            main:
              - path: /scripts/App.cs
                subPath: App.cs
      tmp:
        type: emptyDir
        advancedMounts:
          *app :
            main:
              - path: /tmp
                subPath: tmp
              - path: /.dotnet
                subPath: dotnet
      # The restic binary, from the init container to `main`.
      tools:
        type: emptyDir
        advancedMounts:
          *app :
            restic:
              - path: /tools
            main:
              - path: /tools
                readOnly: true
      # The dump files, until phase 3 step 5 retires them after a week of
      # green streamed runs.
      backups:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/pgdump
        advancedMounts:
          *app :
            main:
              - path: /backups
