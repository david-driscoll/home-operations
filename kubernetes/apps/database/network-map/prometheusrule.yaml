---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# The collector runs hourly and exits non-zero only when the Neo4j write failed
# or every source failed (images/network-map/src/exit.ts): one source being down
# is normal, keeps its last-good nodes and is recorded on its CollectorSource
# node. So this fires when the map as a whole has stopped updating. A single
# stale source is the drift alerts' job (follow-up). The second branch covers a
# CronJob that has never succeeded.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: network-map-collector
spec:
  groups:
    - name: network-map-collector
      rules:
        - alert: NetworkMapCollectorNotRunning
          annotations:
            summary: The network map collector has not succeeded in 3 hours.
            description: >-
              network-map-collector last succeeded {{ $value | humanizeDuration }} ago, so the
              network map in Neo4j has stopped updating (the write failed, or every source did). Read the failed Job's
              log (`kubectl -n database logs job/<job>`): each source logs one line with its status.
          expr: |
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{namespace="database", cronjob="network-map-collector"}
              )
              or
              (
                time() - max by (namespace, cronjob) (
                  kube_cronjob_created{namespace="database", cronjob="network-map-collector"}
                )
              )
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{namespace="database", cronjob="network-map-collector"}
            ) > 10800
          for: 5m
          labels:
            severity: warning
