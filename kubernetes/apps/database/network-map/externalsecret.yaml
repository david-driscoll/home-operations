---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Every credential the collector uses, in one Secret, each an existing OpenBao
# path some other in-cluster reader already uses. All of them are only ever
# used for GETs (and the Tailscale token exchange):
#
#   unifi/api-key       the UniFi API key (../../network/external-dns/unifi)
#   tailscale/pulumi-oauth
#                       the OAuth client; images/network-map/src/sources/tailscale.ts
#                       mints a fresh ~1h token from it every run (its header says
#                       why not the auto-minted tailscale/api-key)
#   netbird/mcp         the `mcp` service user's auditor PAT and the management
#                       URL (../../agents/agent-tools-servers/netbird.yaml)
#   proxmox/api-key     the four hypervisors' shared token, and alpha-site's own
#                       (../../agents/agent-tools-servers/proxmox/base); `username`
#                       is the full USER@REALM!TOKENID, so the header value is
#                       `<username>=<credential>`
#   neo4j/auth          stacks/system/neo4j-auth.ts, what database/neo4j itself reads
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: network-map-collector
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: network-map-collector
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UNIFI_API_KEY: "{{ .unifi_api_key }}"
        TAILSCALE_CLIENT_ID: "{{ .tailscale_client_id }}"
        TAILSCALE_CLIENT_SECRET: "{{ .tailscale_client_secret }}"
        NETBIRD_URL: "{{ .netbird_url }}"
        NETBIRD_TOKEN: "{{ .netbird_token }}"
        PROXMOX_TOKEN_MAIN: "{{ .proxmox_main_username }}={{ .proxmox_main_credential }}"
        PROXMOX_TOKEN_ALPHA_SITE: "{{ .proxmox_alpha_site_username }}={{ .proxmox_alpha_site_credential }}"
        NEO4J_USERNAME: "{{ .neo4j_username }}"
        NEO4J_PASSWORD: "{{ .neo4j_password }}"
  data:
    - secretKey: unifi_api_key
      remoteRef:
        key: third-party-tokens/unifi/api-key
        property: credential
    - secretKey: tailscale_client_id
      remoteRef:
        key: third-party-tokens/tailscale/pulumi-oauth
        property: username
    - secretKey: tailscale_client_secret
      remoteRef:
        key: third-party-tokens/tailscale/pulumi-oauth
        property: credential
    - secretKey: netbird_url
      remoteRef:
        key: third-party-tokens/netbird/mcp
        property: url
    - secretKey: netbird_token
      remoteRef:
        key: third-party-tokens/netbird/mcp
        property: personal_access_token
    - secretKey: proxmox_main_username
      remoteRef:
        key: apps/proxmox/api-key
        property: username
    - secretKey: proxmox_main_credential
      remoteRef:
        key: apps/proxmox/api-key
        property: credential
    - secretKey: proxmox_alpha_site_username
      remoteRef:
        key: apps/proxmox/alpha-site/api-key
        property: username
    - secretKey: proxmox_alpha_site_credential
      remoteRef:
        key: apps/proxmox/alpha-site/api-key
        property: credential
    - secretKey: neo4j_username
      remoteRef:
        key: clusters/equestria/apps/neo4j/auth
        property: username
    - secretKey: neo4j_password
      remoteRef:
        key: clusters/equestria/apps/neo4j/auth
        property: password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The forge registry's estate-images read:package token as a dockerconfigjson,
# for the collector image. The forge is REQUIRE_SIGNIN_VIEW, so an anonymous
# pull is refused. The same OpenBao key as
# ../../pulumi/workspace-image/externalsecret.yaml; this copy belongs to the
# collector so its pods never depend on another app's Kustomization (as for
# ../../netbird-system/region-exits).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: network-map-image-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # Short, as for the other Forgejo tokens: a scope change mints a new token
  # and deletes the old one after.
  refreshInterval: 4m
  target:
    name: network-map-image-pull
    creationPolicy: Owner
    # A node pulling the image while this is being recreated still finds it.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "git.${ROOT_DOMAIN}": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: clusters/equestria/apps/pulumi/workspace-image-pull
