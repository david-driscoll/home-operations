---
# The collector's Kubernetes reads (images/network-map/src/sources/kubernetes.ts):
# nodes, the tailnet egress Services' annotations, and the Gateway API routes.
# Read-only, cluster-wide, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-map-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-map-collector
rules:
  - apiGroups: [""]
    resources: [nodes, services]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-map-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-map-collector
subjects:
  - kind: ServiceAccount
    name: network-map-collector
    namespace: database
