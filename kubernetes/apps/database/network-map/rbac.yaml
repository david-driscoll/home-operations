---
# The collector's Kubernetes reads (images/network-map/src/sources/kubernetes.ts):
# nodes, the tailnet egress Services' annotations, the Gateway API routes, and
# the workloads (Deployments, StatefulSets, DaemonSets, CronJobs, CNPG
# Clusters) it observes Apps from. Read-only, cluster-wide, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-map-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-map-collector
rules:
  - apiGroups: [""]
    resources: [nodes, services]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  # CNPG runs its instances as bare Pods; the Cluster is the workload.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-map-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-map-collector
subjects:
  - kind: ServiceAccount
    name: network-map-collector
    namespace: database
