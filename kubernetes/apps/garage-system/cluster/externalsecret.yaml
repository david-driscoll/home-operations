---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The two pieces of Garage identity that must NOT be operator-generated.
#
# The operator will happily mint an RPC secret when `network.rpcSecretRef` is
# absent -- but that secret IS the mesh identity, and GarageKey material is
# derived from it. Lose it (namespace wiped, cluster rebuilt) and the object
# store cannot be reassembled from its PVCs; every access key would have to be
# reissued. Same argument as every other Tier-1 credential in this estate: it
# belongs in OpenBao, where bootstrap/INVENTORY.md can account for it.
#
# Both values are 32 random bytes, hex-encoded. Create them once:
#
#   bao kv put secrets/clusters/equestria/apps/garage/rpc-secret \
#     password="$(openssl rand -hex 32)"
#   bao kv put secrets/clusters/equestria/apps/garage/admin-token \
#     password="$(openssl rand -hex 32)"
#
# Both live under the `clusters/*` prefix the ESO role already grants, so this
# needs no root ceremony -- see docs/openbao-migration and the note in
# components/store/bao.ts about which five prefixes are in scope.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secrets
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-secrets
    creationPolicy: Owner
    # Retain, so an ExternalSecret hiccup or a namespace-level prune cannot take
    # the mesh identity out from under running Garage pods.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        rpc-secret: "{{ .rpc_secret }}"
        admin-token: "{{ .admin_token }}"
  # One remoteRef per value rather than a `dataFrom.extract` of a single blob:
  # a missing path then fails naming the path, not a template variable. Same
  # reasoning as kubernetes/apps/equestria/media/kometa/externalsecret.yaml.
  data:
    - secretKey: rpc_secret
      remoteRef:
        key: clusters/equestria/apps/garage/rpc-secret
        property: password
    - secretKey: admin_token
      remoteRef:
        key: clusters/equestria/apps/garage/admin-token
        property: password
