---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: garage-operator
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.7.8
    digest: sha256:c7e386a89885f58e62a9589361b9c0243523f11625bcf52cf3bf43cdede0d580
  url: oci://ghcr.io/rajsinghtech/charts/garage-operator
  # NO `verify:` BLOCK, and do not add one back. There is nothing to verify.
  #
  # The operator's install docs show a `cosign verify` for the chart, so this
  # shipped with `verify: { provider: cosign }`. Flux rejected it:
  #
  #   failed to verify the signature using provider 'cosign keyless':
  #   no matching attestations: failed to build policy: can't verify
  #   identities without providing at least one identity
  #
  # That message reads like a missing `matchOIDCIdentity`, and it is not.
  # Inspecting what is actually published at this digest: there is no
  # `sha256-<digest>.sig` tag, and the referrers index holds exactly one
  # artifact --
  #
  #   application/vnd.dev.sigstore.bundle.v0.3+json
  #     dev.sigstore.bundle.content:       dsse-envelope
  #     dev.sigstore.bundle.predicateType: https://slsa.dev/provenance/v1
  #
  # -- a SLSA BUILD PROVENANCE ATTESTATION, not a cosign signature. Flux's
  # cosign provider verifies signatures; it has no path to consume a SLSA
  # attestation, so no identity regex could have made this pass.
  #
  # The chart is still verifiable, just not by Flux at pull time:
  #   gh attestation verify oci://ghcr.io/rajsinghtech/charts/garage-operator@<digest> \
  #     --repo rajsinghtech/garage-operator
  #
  # The digest pin above is what actually protects this pull: the tag can move,
  # the digest cannot. Re-check for a real signature when bumping the chart --
  # if upstream starts publishing one, `verify:` becomes worth having.
