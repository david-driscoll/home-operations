---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "code.${ROOT_DOMAIN}"
  rules:
    # /api gets `local-api` -- the same internal-network guard as `local-user`,
    # MINUS error-pages. error-pages intercepts 401-599 and swaps the body for a
    # generic HTML page, and coder's JSON bodies are the only diagnostic it
    # emits for a failed login: the OIDC callback logs NOTHING at any level, so
    # `{"message":"Cookie \"oauth_state\" must be provided."}` vs
    # `{"message":"State mismatched."}` is the whole difference between a
    # five-minute fix and reproducing the flow against the pod by hand
    # (2026-09-05). It also keeps error-pages off the API's websockets.
    #
    # Gateway API resolves overlapping rules by longest matching path prefix, so
    # this wins for /api and the catch-all below keeps the pretty pages for the
    # dashboard.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: ${APP}
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: local-api
    - backendRefs:
        - name: ${APP}
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: local-user
---
# Per-workspace app subdomains (dashboard port forwarding, coder_apps). These
# proxy websockets and stream non-200 responses, so they skip the error-pages
# middleware that local-user adds; local-api keeps the internal-network guard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-apps
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "*.code.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: local-api
