---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app coder
  namespace: &namespace coder
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/coder/coder
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # No failover/fast-node-eviction: it patches `defaultPodOptions`, which only
    # the app-template chart reads. The equivalent tolerations are set natively
    # under coder.tolerations in helmrelease.yaml.
    # Rotating credential. No liveness probe at all, so coder cannot be
    # probe-killed mid-boot the way tandoor was.
    #
    # It consumes the credential as a CONNECTION URI
    # (CODER_PG_CONNECTION_URL <- coder-pguser-secret/uri) rather than a bare
    # password, so the rotated value has to arrive already embedded in the URI.
    # It does -- pgsql-user-template builds all 15 keys from whatever password
    # the ExternalSecret resolved, whatever its source.
    #
    # Coder holds a pool, so it takes a short burst of auth failures at each
    # rotation (8 over 8 seconds at cutover, none after). That is the
    # rotate-then-propagate gap, not a fault.
    - ../../../components/postgres
    #
    # NO components/tailscale. Coder has exactly ONE CODER_ACCESS_URL
    # (https://code.${ROOT_DOMAIN}) and derives the OIDC redirect_uri, the
    # workspace-app wildcard, the `coder` CLI endpoint and every agent dial
    # address from it -- there is no per-Host equivalent. A second hostname
    # therefore cannot serve a login: starting the flow on
    # code.${TAILSCALE_DOMAIN} set `oauth_state` on THAT origin while sending
    # authentik a redirect_uri on code.${ROOT_DOMAIN}, so the callback arrived
    # cookie-less and coder answered 401 `Cookie "oauth_state" must be
    # provided.` (2026-09-05).
    #
    # CODER_REDIRECT_TO_ACCESS_URL is NOT the fix. Its first check is
    # `!tunnel && accessURL.Scheme == "https" && r.TLS == nil` (cli/server.go),
    # which runs BEFORE the X-Forwarded-Host and app-hostname escapes, and
    # coder honours X-Forwarded-Proto nowhere in coderd/ or cli/. TLS is
    # terminated at Traefik, so r.TLS is nil on every request and the flag
    # would redirect the whole deployment to the access URL root in a loop.
    #
    # The tailnet reaches code.${ROOT_DOMAIN} through split-horizon DNS
    # anyway, so nothing is lost.
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
