---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app coder
  namespace: &namespace coder
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/coder/coder
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # No failover/fast-node-eviction: it patches `defaultPodOptions`, which only
    # the app-template chart reads. The equivalent tolerations are set natively
    # under coder.tolerations in helmrelease.yaml.
    - ../../../components/postgres
    # TRANCHE 4, group A of the boot-budget sweep: coder has no liveness
    # probe at all, so it cannot be probe-killed mid-boot the way tandoor was.
    #
    # Coder is the first app to consume the credential as a CONNECTION URI
    # (CODER_PG_CONNECTION_URL <- coder-pguser-secret/uri) rather than a bare
    # password, so the password has to reach it already embedded in the URI.
    # It does: the component builds the same 15 keys for a rotating app as for
    # a static one, and `uri` on grafana, tandoor and crowdsec all carry their
    # rotated 20-character password today.
    - ../../../components/postgres/rotate
    - ../../../components/tailscale
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      TAILSCALE_HOST: code
