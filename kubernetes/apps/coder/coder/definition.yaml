---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Coder
  category: Development
  description: Self-hosted Cloud Development Environments
  url: &url https://code.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/coder.svg
  # Coder OSS has no IdP role sync, so Authentik decides who may sign in at all
  # and every login lands as a Coder member. Admins are promoted in-app.
  access_policy:
    groups:
      - admins
      - family
  authentik:
    oauth2:
      clientType: confidential
      # ONE entry on purpose. Coder builds redirect_uri from CODER_ACCESS_URL
      # and nothing else, so a code.${TAILSCALE_DOMAIN} entry is never sent --
      # it only made the single-access-URL constraint look optional. See
      # ks.yaml for why coder has no tailnet route.
      allowedRedirectUris:
        - url: "https://code.${ROOT_DOMAIN}/api/v2/users/oidc/callback"
      propertyMappings:
        - email
        - openid
        - profile
        # helmrelease.yaml asks for the offline_access scope. Without the
        # matching mapping authentik simply does not grant it, coder gets no
        # refresh token, and sessions end at token expiry instead of renewing.
        - offline_access
        # NOT the `email_verified` mapping. authentik only evaluates a scope
        # mapping when the client REQUESTS that scope, and coder's
        # CODER_OIDC_SCOPES is a fixed openid,profile,email,offline_access --
        # so mapping it here changed nothing. The built-in `email` mapping
        # returns `email_verified: False` regardless; helmrelease.yaml sets
        # CODER_OIDC_IGNORE_EMAIL_VERIFIED instead and explains why.
      includeClaimsInIdToken: true
      subMode: user_email
      # Workspaces log in to OpenBao with this access token (the vault-jwt
      # module in kubernetes/apps/coder/coder/templates). Coder refreshes it
      # at build time, but the login only runs once the workspace pod is up,
      # and a cold pull of the Universal image takes over ten minutes.
      # authentik's default of five minutes expired first (2026-10-17: "token
      # is expired" 12 min after the refresh). Coder renews it with the
      # refresh token either way, so this only widens that window.
      accessTokenValidity: hours=1

  gatus:
    - group: "Applications"
      url: https://code.${ROOT_DOMAIN}/healthz
      method: GET
      conditions:
        - "[STATUS] == 200"
