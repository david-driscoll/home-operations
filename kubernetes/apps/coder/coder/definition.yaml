---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Coder
  category: Applications
  description: Self-hosted Cloud Development Environments
  url: &url https://code.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/coder.svg
  # Coder OSS has no IdP role sync, so Authentik decides who may sign in at all
  # and every login lands as a Coder member. Admins are promoted in-app.
  access_policy:
    groups:
      - admins
      - family
  authentik:
    oauth2:
      clientType: confidential
      # ONE entry on purpose. Coder builds redirect_uri from CODER_ACCESS_URL
      # and nothing else, so a code.${TAILSCALE_DOMAIN} entry is never sent --
      # it only made the single-access-URL constraint look optional. See
      # ks.yaml for why coder has no tailnet route.
      allowedRedirectUris:
        - url: "https://code.${ROOT_DOMAIN}/api/v2/users/oidc/callback"
      propertyMappings:
        - email
        - openid
        - profile
        # helmrelease.yaml asks for the offline_access scope. Without the
        # matching mapping authentik simply does not grant it, coder gets no
        # refresh token, and sessions end at token expiry instead of renewing.
        - offline_access
      includeClaimsInIdToken: true
      subMode: user_email

  gatus:
    - group: "Applications"
      url: https://code.${ROOT_DOMAIN}/healthz
      method: GET
      conditions:
        - "[STATUS] == 200"
