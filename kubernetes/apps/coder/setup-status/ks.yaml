---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app setup-status
  namespace: &namespace coder
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The ExternalSecrets need ESO's stores. Deliberately NOT git-pages, even
    # though the forward auth needs the proxy provider in
    # git-pages/definition.yaml: that only matters on a first install, where
    # the API answers 400 until the provider exists and then works with no
    # redeploy. A dependsOn would instead make every update here wait behind
    # git-pages -> forgejo, whose health checks can take most of an hour after
    # a busy run of merges.
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/coder/setup-status
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
