---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# The API behind the family setup guide's "My apps" page: which home apps the
# visitor has signed in to, and which devices are connected. One file of Bun,
# ./resources/server.mjs, mounted from a ConfigMap into the stock image (the
# toolport watchdog's pattern), so there is no image to build.
#
# Served at https://setup.${ROOT_DOMAIN}/setup/api/ by the route below, behind
# authentik forward auth. The rest of setup.${ROOT_DOMAIN} is the static guide
# (../git-pages, route `setup`) and stays open; only /setup/api signs in.
# See docs/kubernetes/git-pages.md, "My apps".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app setup-status
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          # Named, not `auto`: `auto` would also follow ${APP}-tailscale, which
          # is re-minted every 5 minutes and is read from its mounted file.
          # ${APP} for the API keys, the -db Secret for its 30-day
          # password rotation, and the ConfigMap for server.mjs itself.
          secret.reloader.stakater.com/reload: "setup-status,setup-status-nextcloud-db"
          configmap.reloader.stakater.com/reload: "setup-status-server"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              # The same pin as agents/toolport's watchdog.
              repository: oven/bun
              tag: 1.4.3-alpine@sha256:629e17411f1f129dbec3af78d5af9c9f2a937435c80349437206c6b0b7422373
            command: ["bun", "/app/server.mjs"]
            env:
              HOME: /tmp
              TZ: "${TIMEZONE}"
              PORT: "8080"
              ROOT_DOMAIN: "${ROOT_DOMAIN}"
              # In-cluster, not canterlot: no gateway hop for a server-to-server
              # call, and the token works on any authentik host.
              AUTHENTIK_URL: http://authentik-server.stargate-command.svc.cluster.local
              JELLYFIN_URL: http://jellyfin.equestria.svc.cluster.local:8096
              SEERR_URL: http://seerr.equestria.svc.cluster.local:5055
              # Straight to the pod, not through Traefik: Navidrome logs in
              # whoever X-authentik-username names when the caller is in the
              # pod CIDR. navidrome's ciliumnetworkpolicy.yaml admits this pod.
              # The Navidrome admin is found among authentik's `admins` group;
              # set NAVIDROME_ADMIN_USERNAME to pin it instead.
              NAVIDROME_URL: http://navidrome.equestria.svc.cluster.local:4533
              TAILSCALE_API_KEY_FILE: /secrets/tailscale/api-key
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: setup-status-nextcloud-db
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 192Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      server:
        type: configMap
        name: setup-status-server
        globalMounts:
          - path: /app
            readOnly: true
      tailscale:
        type: secret
        name: setup-status-tailscale
        globalMounts:
          - path: /secrets/tailscale
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      # /setup/api on the guide's own hostname. Longest-prefix precedence puts
      # it ahead of git-pages' `/setup` and `/` rules (../git-pages,
      # route `setup`); Gateway API merges rules for one hostname across routes,
      # the same way authentik's `/outpost.goauthentik.io` routes share every
      # app's host. Same external-dns target as that route, so the record is
      # identical rather than competing.
      app:
        annotations:
          external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "setup.${ROOT_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /setup/api
            backendRefs:
              - identifier: app
                port: *port
            filters:
              # Forward auth, without error-pages (./middleware.yaml).
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: setup-status-auth
