---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The two long-lived API credentials ./resources/server.mjs reads.
#
#   AUTHENTIK_TOKEN  The bootstrap (superuser) token, the same one dynacat and
#                    the pulumi stacks use -- there is no narrower authentik
#                    token. server.mjs reads, and writes exactly one thing: the
#                    music password it generated, into the visitor's own
#                    `setup_guide` attributes. Only ever for the visitor the
#                    outpost vouched for.
#   JELLYFIN_TOKEN   Admin-scoped Jellyfin API key, for GET /Users. Property
#                    `token`, not `apikey` (see
#                    ../../equestria/media/arr-mcp-jellyfin/externalsecret.yaml:
#                    a wrong property is a silent empty string).
#   SEERR_TOKEN      Seerr's API key (the Jellyfin-side instance at seerr.*,
#                    NOT apps/jellyseerr, which is the Plex one). It acts as
#                    Seerr's admin; server.mjs only GETs one user by Jellyfin id.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTHENTIK_TOKEN: "{{ .authentik_token }}"
        JELLYFIN_TOKEN: "{{ .jellyfin_token }}"
        SEERR_TOKEN: "{{ .seerr_token }}"
  data:
    - secretKey: authentik_token
      remoteRef:
        key: clusters/alpha-site/apps/authentik/token
        property: credential
    - secretKey: jellyfin_token
      remoteRef:
        key: clusters/equestria/apps/jellyfin/api-key
        property: token
    - secretKey: seerr_token
      remoteRef:
        key: clusters/equestria/apps/seerr/api-key
        property: apikey
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Nextcloud's database login, for the one SELECT on oc_authtoken that tells the
# My apps page which devices are connected (phone app, calendar, desktop).
# Mirrors ../../equestria/home/nextcloud/externalsecret.yaml's `nextcloud-db`:
# the password rotates every 30 days, this refreshes every 4m, and Reloader
# (./helmrelease.yaml) restarts the pod when it changes.
#
# This is the app's owning role: no read-only role exists on the shared
# cluster. server.mjs runs a single parameterized SELECT.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-nextcloud-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-nextcloud-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_DB_HOST: "{{ .postgres_hostname }}"
        NEXTCLOUD_DB_PORT: "{{ .postgres_port }}"
        NEXTCLOUD_DB_NAME: "{{ .postgres_database }}"
        NEXTCLOUD_DB_USER: "{{ .postgres_username }}"
        NEXTCLOUD_DB_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: nextcloud-postgres
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# SuperSync's database login, for the one SELECT that tells the guide whether
# the visitor has a sync token and which of their devices have synced (the
# Tasks tile). Same shape and reasoning as ${APP}-nextcloud-db above: the
# owning role (no read-only one exists), rotated every 30 days, refreshed
# every 4m, and Reloader restarts the pod when it changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-supersync-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-supersync-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SUPERSYNC_DB_HOST: "{{ .postgres_hostname }}"
        SUPERSYNC_DB_PORT: "{{ .postgres_port }}"
        SUPERSYNC_DB_NAME: "{{ .postgres_database }}"
        SUPERSYNC_DB_USER: "{{ .postgres_username }}"
        SUPERSYNC_DB_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: supersync-postgres
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# A Tailscale API access token, for listing the visitor's devices. Re-minted
# every 5 minutes by stacks/unifi-network/tailscale-api-token.ts (each lives
# ~1h), the same source ../../agents/agent-tools-servers/tailscale.yaml reads.
#
# Kept out of the `${APP}` Secret on purpose: it changes every few minutes, so
# it is MOUNTED as a file (the kubelet refreshes it in place) and is not on
# Reloader's list -- otherwise the pod would restart every 5 minutes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-tailscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-tailscale
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        api-key: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: third-party-tokens/tailscale/api-key
        property: key
