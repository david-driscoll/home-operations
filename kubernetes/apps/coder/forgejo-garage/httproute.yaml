---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# The S3 API, and ONLY the S3 API.
#
# Forgejo does NOT come through here -- it talks to
# forgejo-garage.coder.svc.cluster.local:3900 directly, which is in the same
# namespace and avoids a hairpin through Traefik for every LFS object. This
# route exists for exactly one client: backrest on celestia, which cannot
# resolve a ClusterIP.
#
# Deliberately NOT behind authentik forward-auth, unlike every other route in
# this estate: S3 clients authenticate with SigV4 and cannot follow an
# interactive redirect. A middleware here would break the backup while looking
# like a Garage fault. Access control is the GarageKey grant.
#
# Deliberately NOT publishing the Admin API (3903) or RPC (3901). Admin is the
# control plane and RPC is the mesh; both stay on the ClusterIP Service.
#
# `internal` gateway, so this resolves only on the LAN and the tailnet through
# Technitium's split horizon.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-s3
  annotations:
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    # Its own name, not a path under s3.${ROOT_DOMAIN}: that hostname routes to
    # the garage-system cluster, and these are two independent Garage clusters
    # with separate layouts, keys and RPC secrets. Path-style addressing only
    # (`https://s3-forgejo.<domain>/<bucket>/<key>`) -- virtual-hosted style
    # would need `s3Api.rootDomain` plus a wildcard hostname and cert.
    - "s3-forgejo.${ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # The operator names the cluster API Service after the GarageCluster.
        - name: ${APP}
          port: 3900
