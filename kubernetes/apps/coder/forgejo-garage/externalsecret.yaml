---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The two pieces of Garage identity that must NOT be operator-generated.
#
# The operator will happily mint an RPC secret when `network.rpcSecretRef` is
# absent -- but that secret IS the node's mesh identity, and GarageKey material
# is derived from it. Lose it (namespace wiped, cluster rebuilt) and the object
# store cannot be reassembled from its PVCs; every access key would have to be
# reissued, which for this cluster means Forgejo losing every LFS object it can
# still see listed in its database.
#
# Both values are 32 random bytes, hex-encoded. Create them once:
#
#   bao kv put secrets/clusters/equestria/apps/forgejo/garage-rpc-secret \
#     password="$(openssl rand -hex 32)"
#   bao kv put secrets/clusters/equestria/apps/forgejo/garage-admin-token \
#     password="$(openssl rand -hex 32)"
#
# Filed under the FORGEJO app prefix with a `garage-` name rather than under a
# `forgejo-garage` prefix of its own. This cluster is not a service in its own
# right -- it exists only to hold one forge's objects, and its credentials
# belong next to that forge's other credentials rather than in a directory
# somebody would have to know to go looking for.
#
# Deliberately NOT garage-system's paths: these are two independent Garage
# clusters that must never share an RPC secret, or a node from one could join
# the other's mesh.
#
# Both live under the `clusters/*` prefix the ESO role already grants, so this
# needs no root ceremony.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secrets
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-secrets
    creationPolicy: Owner
    # Retain, so an ExternalSecret hiccup or a namespace-level prune cannot take
    # the mesh identity out from under a running Garage pod.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        rpc-secret: "{{ .rpc_secret }}"
        admin-token: "{{ .admin_token }}"
  # One remoteRef per value rather than a `dataFrom.extract` of a single blob:
  # a missing path then fails naming the path, not a template variable.
  data:
    - secretKey: rpc_secret
      remoteRef:
        key: clusters/equestria/apps/forgejo/garage-rpc-secret
        property: password
    - secretKey: admin_token
      remoteRef:
        key: clusters/equestria/apps/forgejo/garage-admin-token
        property: password
