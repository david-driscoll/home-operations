---
# Extra Forgejo Actions runners, started when jobs are waiting and gone when
# they are not. ../forgejo-runner is the standing runner: four jobs at a time,
# always there. This is the overflow.
#
# Why it exists: Renovate's first pass over github-mirror/home-operations
# opened about sixty pull requests at once, each with a `flate` check, and the
# job that publishes merges to GitHub sat in the same queue behind them.
#
# How it works (https://keda.sh/docs/2.21/scalers/forgejo/): KEDA asks Forgejo
# every 30 seconds how many jobs are waiting on that repository, and creates
# one Kubernetes Job per waiting job, up to maxReplicaCount. Each Job is one
# pod running `forgejo-runner one-job`: it takes a single job, runs it and
# exits. A pod that finds the queue already empty exits at once.
#
# THE PODS SHARE THE STANDING RUNNER'S IDENTITY. They mount the same
# `forgejo-runner-config` Secret, so Forgejo sees one runner asking for more
# work, exactly as it does when the standing runner's `capacity` is raised.
# That is how KEDA's own documentation sets it up. ../forgejo-runner's
# config.yml says not to run two DAEMONS on one identity; these are not
# daemons, and each asks for one task and reports only on that task. If
# Forgejo ever starts refusing it, this pool needs a registration of its own
# (a second OpenBao path), not a different shape.
#
# What a job loses here compared with the standing runner: the actions cache
# and the image cache. Both live in the pod and die with it, so every job is
# a cold pull of the job image and a cold `flate` render.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/keda.sh/triggerauthentication_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ${APP}
spec:
  secretTargetRef:
    # The mirror bot's own token (stacks/system/forgejo-github-mirror.ts),
    # already in this namespace for the sync relay. It owns the repository the
    # trigger below watches, which is all listing that repository's waiting
    # jobs needs.
    - parameter: token
      name: forgejo-github-sync
      key: FORGEJO_TOKEN
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/keda.sh/scaledjob_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ${APP}
spec:
  pollingInterval: 30
  minReplicaCount: 0
  # On top of the standing runner's four. Each pod may use up to 6Gi (below),
  # so this is 36Gi of worker memory at the very worst; raise it with that in
  # mind, not by itself.
  maxReplicaCount: 6
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  scalingStrategy:
    # The queue Forgejo reports holds WAITING jobs only; one that a runner has
    # taken leaves it. `accurate` is KEDA's strategy for that kind of queue:
    # it subtracts the pods it has already started that have not taken a job
    # yet, where the default would start a second pod for the same job.
    strategy: accurate
  triggers:
    - type: forgejo-runner
      metadata:
        # Informational; the scaler does not read it.
        name: equestria
        address: http://forgejo-http.${NAMESPACE}.svc.cluster.local:3000
        # Repository scope: the only endpoint the bot's token can read, and
        # the repository whose bursts this is for. A pod started for it still
        # takes whatever job Forgejo hands the runner, from any repository.
        owner: github-mirror
        repo: home-operations
        # Every label the workflows in that repository run on.
        labels: ubuntu-latest
      authenticationRef:
        name: ${APP}
  jobTargetRef:
    # A runner pod that fails did not necessarily fail its job: Forgejo has
    # the job's own result. Never re-run the pod.
    backoffLimit: 0
    # `runner.timeout` in the shared config is 3h; a pod older than that plus
    # start-up is stuck.
    activeDeadlineSeconds: 11700
    ttlSecondsAfterFinished: 600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ${APP}
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        enableServiceLinks: false
        # `runner.shutdown_timeout` gives a job 30m to finish after SIGTERM,
        # as on the standing runner.
        terminationGracePeriodSeconds: 1860
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # A native sidecar, as on the standing runner and for the same
          # reasons (see ../forgejo-runner/helmrelease.yaml): the kubelet
          # starts it first, waits for its startup probe, and in a Job stops
          # it once the runner container has exited.
          - name: dind
            restartPolicy: Always
            image: data.forgejo.org/oci/docker:29-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            securityContext:
              privileged: true
              runAsUser: 0
              runAsNonRoot: false
            resources:
              requests:
                cpu: 100m
                # What one cold render of this repository is known to reach is
                # about 3.7 GB; the request is what the scheduler should plan
                # around, so six of these do not all land on one node.
                memory: 2Gi
                ephemeral-storage: 4Gi
              limits:
                # One job per pod, so this is the ceiling for one job.
                memory: 6Gi
                ephemeral-storage: 24Gi
            startupProbe:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    docker --tlsverify
                    --tlscacert=/certs/client/ca.pem
                    --tlscert=/certs/client/cert.pem
                    --tlskey=/certs/client/key.pem
                    -H tcp://127.0.0.1:2376 info
              initialDelaySeconds: 5
              periodSeconds: 2
              failureThreshold: 30
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
        containers:
          - name: app
            image: data.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
            command: ["forgejo-runner"]
            # No --wait: a pod that arrives after the standing runner has
            # already taken the job exits instead of sitting there.
            args: ["one-job", "--config", "/config/config.yml"]
            env:
              - name: TZ
                value: "${TIMEZONE}"
              - name: DOCKER_HOST
                value: tcp://127.0.0.1:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: HOME
                value: /data
              - name: XDG_CACHE_HOME
                value: /data/.cache
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 1Gi
                ephemeral-storage: 8Gi
            volumeMounts:
              - name: data
                mountPath: /data
              - name: docker-certs
                mountPath: /certs
                readOnly: true
              - name: config
                mountPath: /config
                readOnly: true
        volumes:
          - name: data
            emptyDir:
              sizeLimit: 6Gi
          - name: docker-storage
            emptyDir:
              sizeLimit: 20Gi
          - name: docker-certs
            emptyDir: {}
          - name: config
            secret:
              secretName: forgejo-runner-config
