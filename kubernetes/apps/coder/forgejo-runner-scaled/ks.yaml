---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo-runner-scaled
  namespace: &namespace coder
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The ScaledJob and TriggerAuthentication CRDs, and the webhook that
    # admits them.
    - name: keda
      namespace: kube-system
    # The `forgejo-runner-config` Secret every runner pod mounts.
    - name: forgejo-runner
      namespace: coder
    # The `forgejo-github-sync` Secret the scaler reads the queue with.
    - name: forgejo-github-sync
      namespace: coder
  path: ./kubernetes/apps/coder/forgejo-runner-scaled
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
