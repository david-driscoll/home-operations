---
# The token KEDA lists waiting jobs with. An administrator's token limited to
# `read:admin`, made for this and nothing else by
# stacks/system/forgejo-renovate.ts.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: clusters/equestria/apps/forgejo-runner-scaled/credentials
        property: token
