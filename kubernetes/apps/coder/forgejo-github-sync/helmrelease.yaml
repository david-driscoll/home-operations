---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# The relay between Flux and Forgejo: one file of Bun, ./resources/server.mjs,
# mounted from a ConfigMap into the stock image (../setup-status's pattern), so
# there is no image to build.
#
# It has two jobs, unrelated except that both translate GitHub for something
# in this namespace. The second is small: GET /ghcr/<owner>/<image> gives
# Renovate an image's tags with the day each was pushed and its digest
# (resources/ghcr.mjs; `customDatasources.ghcr` in .github/renovate.json5).
#
# The first is the one it is named for. When GitHub's main moves, Flux raises an event
# (./notification.yaml) and this starts .forgejo/workflows/github-sync.yml on
# the Forgejo copy of the repository, which pulls the new commits in. The
# other direction -- Forgejo to GitHub -- needs nothing from here: a merge on
# Forgejo starts the same workflow by itself.
#
# No route and no Gatus check: nothing outside the cluster talks to it, and if
# it is down the workflow's hourly schedule still syncs.
# See docs/runbooks/forgejo-github-mirror.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-github-sync
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          # The token is re-minted only when its scopes change, and the script
          # only when this directory does; either way the pod has to restart to
          # see it.
          secret.reloader.stakater.com/reload: "forgejo-github-sync"
          configmap.reloader.stakater.com/reload: "forgejo-github-sync-server"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              # The same pin as ../setup-status and agents/toolport's watchdog.
              repository: oven/bun
              tag: 1.4.3-alpine@sha256:629e17411f1f129dbec3af78d5af9c9f2a937435c80349437206c6b0b7422373
            command: ["bun", "/app/server.mjs"]
            env:
              HOME: /tmp
              TZ: "${TIMEZONE}"
              PORT: "8080"
              # The in-cluster Service, as the runner and Renovate use: no
              # gateway hop, and it keeps the forge's hostname out of here.
              FORGEJO_URL: http://forgejo-http.${NAMESPACE}.svc.cluster.local:3000
              FORGEJO_WORKFLOW: github-sync.yml
              FORGEJO_REF: main
              # For GET /ghcr (resources/ghcr.mjs). A file and not an env var:
              # the token below lasts an hour, and the kubelet rewrites the
              # file when the Secret changes while an env var is read once.
              GITHUB_TOKEN_FILE: /github/token
              # /ghcr calls GitHub through Octokit, which Bun downloads from
              # npm on the first lookup -- there is no image build and no
              # node_modules (resources/ghcr.mjs has the detail). This is the
              # version it asks for, here and not in the script so that
              # Renovate's annotated-dependency manager can raise it.
              # renovate: datasource=npm depName=@octokit/rest
              OCTOKIT_VERSION: "22.0.1"
              # Where Bun keeps what it downloads: the root filesystem is
              # read-only and /tmp is the emptyDir below.
              BUN_INSTALL_CACHE_DIR: /tmp/bun-cache
            envFrom:
              # FORGEJO_TOKEN and FORGEJO_REPOSITORY (./externalsecret.yaml).
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                # 128Mi until /ghcr: Octokit and fifty pages of package
                # versions held at once are more than the relay alone needed.
                # Not measured in the pod; doubled as headroom.
                memory: 256Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      server:
        type: configMap
        name: forgejo-github-sync-server
        globalMounts:
          - path: /app
            readOnly: true
      # The GitHub App installation token that stacks/vault mints hourly and
      # emberstack reflects into every namespace -- the same Secret Renovate
      # reads as GITHUB_COM_TOKEN (../renovate/renovatejob.yaml). Only its
      # `token` key is mounted. /ghcr uses it to read GitHub's Packages API,
      # which answers nothing anonymously.
      github-token:
        type: secret
        name: github-token
        items:
          - key: token
            path: token
        globalMounts:
          - path: /github
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
