---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# What ./resources/server.mjs needs to start the sync workflow. Nothing here is
# hand-created: stacks/system/forgejo-github-mirror.ts creates the `github-mirror`
# account that owns the mirror, mints its token, and writes both fields.
#
#   FORGEJO_TOKEN       The owner's token, scope `write:repository`. Dispatching
#                       a workflow needs write access to the repository; the
#                       relay does nothing else with it.
#   FORGEJO_REPOSITORY  owner/name of the mirror. Read from the same place as
#                       the token so the two cannot name different repositories.
#
# Until stacks/system has run once after this lands, the path does not exist
# and this sits in SecretSyncedError with the pod unable to start. That clears
# by itself -- the same first-reconcile shape as ../renovate-operator.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        FORGEJO_TOKEN: "{{ .forgejo_token }}"
        FORGEJO_REPOSITORY: "{{ .repository }}"
  data:
    - secretKey: forgejo_token
      remoteRef:
        key: clusters/equestria/apps/forgejo-github-sync/credentials
        property: forgejo_token
    - secretKey: repository
      remoteRef:
        key: clusters/equestria/apps/forgejo-github-sync/credentials
        property: repository
