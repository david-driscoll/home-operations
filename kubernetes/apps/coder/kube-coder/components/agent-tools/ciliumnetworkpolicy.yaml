---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ws-${KUBE_CODER_USER}-agent-tools
spec:
  endpointSelector:
    matchLabels:
      app: ws-${KUBE_CODER_USER}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: agents
            # The ToolHive operator's labels for this VirtualMCPServer -- the
            # same pair the ingress policy on the agents side selects. Not
            # `virtualmcpserver` alone: that also matches the authenticated
            # external server.
            app.kubernetes.io/name: virtualmcpserver
            toolhive-name: agent-tools-internal
      toPorts:
        - ports:
            # The pod port. The Service maps 4483 -> 4483, and Cilium evaluates
            # after ClusterIP translation.
            - port: "4483"
              protocol: TCP
