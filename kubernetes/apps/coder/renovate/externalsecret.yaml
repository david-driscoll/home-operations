---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The credentials the Renovate pods run with. Mounted whole as `envFrom` on
# both the discovery and executor Jobs (spec.secretRef on the RenovateJob), so
# every key here becomes an environment variable Renovate reads directly --
# there is no config file involved and no key may be named anything else.
#
# Nothing here is hand-created: `stacks/system/forgejo-renovate.ts` mints the
# Forgejo token and generates the webhook secret, then writes both to the path
# below. See docs/runbooks/renovate-forgejo.md.
#
# That path is `apps/renovate-operator/`, not `apps/renovate/`, even though this
# app is `renovate`. Both Kubernetes apps read out of the one OpenBao prefix
# because they are two halves of one deployment and splitting them would mean
# two Pulumi writes to keep in step. Do not "correct" it to `${APP}`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secret
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # The Forgejo PAT for the `renovate` bot account. `RENOVATE_TOKEN` is
        # both what Renovate itself reads and the FIRST key the operator tries
        # when it needs the platform token for `skipForks` and webhook sync
        # (the fallback order is RENOVATE_TOKEN, GITHUB_COM_TOKEN,
        # GITLAB_TOKEN, BITBUCKET_TOKEN, GITEA_TOKEN, FORGEJO_TOKEN) -- so this
        # key name is load-bearing twice over.
        RENOVATE_TOKEN: "{{ .credentials_forgejo_token }}"
        # GITHUB_COM_TOKEN is deliberately NOT here. The github.com credential
        # is the `github-token` Secret that stacks/vault mints and emberstack
        # reflects into every namespace, so this app has no business minting a
        # second one -- see `extraEnv` in renovatejob.yaml.
  dataFrom:
    # Path within the `secrets` mount; the store pins `path: secrets`.
    - extract:
        key: clusters/equestria/apps/renovate-operator/credentials
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "credentials_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The shared secret on the Forgejo -> operator webhook hop.
#
# Read twice, in opposite directions: the operator verifies the
# `Authorization: Bearer <token>` header on an incoming delivery, and the same
# operator WRITES that header onto every repository hook it syncs. One value,
# so rotating it means rotating it here and letting the next sync catch up.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-webhook
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          # REQUIRED, and the only reason this is a separate ExternalSecret.
          #
          # The operator runs with `policy.requireSecretRefOptIn: true`, which
          # refuses to read a Secret at a caller-chosen key unless the Secret
          # itself opts in with this label. Without it the RenovateJob is
          # rejected with a False `Accepted` condition and NOTHING runs -- the
          # policy failure is not scoped to the webhook.
          #
          # spec.secretRef (the credentials above) is exempt from the opt-in,
          # because the operator only ever reads it at Renovate's own
          # well-known token key names.
          renovate-operator.mogenius.com/allow-ref: "true"
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # Key name is the RenovateJob's
        # `spec.webhook.authentication.secretRef.key`.
        token: "{{ .credentials_webhook_token }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/renovate-operator/credentials
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "credentials_$1"
