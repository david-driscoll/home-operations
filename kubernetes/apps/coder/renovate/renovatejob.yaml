---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: ${APP}
  # No `reloader` annotation, unlike every other object in this namespace:
  # reloader only ever restarts Deployments, StatefulSets and DaemonSets, and
  # this is neither. It does not need one either -- the credentials reach
  # Renovate through `envFrom` on Jobs the operator creates fresh for every
  # run, so a rotated token is picked up by the next run with nothing to
  # restart.
spec:
  # Hourly, on the hour. This is when the bot RUNS; when PRs may OPEN is the
  # inherited `schedule` in .github/renovate.json5, now "at any time", and when
  # they may MERGE is the `automergeSchedule` on the rules there (overnight).
  #
  # It was once a night, which automerge cannot work with: Renovate never waits
  # for a check. The run that opens a pull request sees its checks pending and
  # moves on, and it is the NEXT run that finds them green and merges -- so the
  # overnight window needs more than one run inside it.
  #
  # The operator reads a schedule in its own TZ, which
  # ../renovate-operator/helmrelease.yaml sets from TIMEZONE. For "every hour"
  # that changes nothing; it is there so a wall-clock time written here later
  # means what it says.
  schedule: "0 * * * *"

  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  image: ghcr.io/renovatebot/renovate:44.139.0

  # No digest, on purpose. This is a CRD field, so neither the `kubernetes` nor
  # the `helm-values` manager sees it -- it is picked up by the repo's
  # `Process annotated dependencies` customManager, whose "full docker image
  # reference" pattern captures `[^\s@]+` and therefore cannot round-trip a
  # `@sha256:` suffix. Same reason forgejo's `image.fullOverride` carries a bare
  # tag. The operator's policy.allowedImages matches the repository only and
  # ignores the tag either way.

  parallelism: 2

  secretRef: ${APP}-secret

  provider:
    name: forgejo
    # The in-cluster Service, matching what forgejo-runner already does
    # (resources/config.yml). Renovate wants the API root, hence /api/v1 --
    # the operator's own Forgejo client trims that suffix back off before it
    # builds its calls, so the one value serves both.
    #
    # Not the public hostname: that would hairpin every API call out to
    # Traefik and back for a Service two DNS labels away.
    endpoint: http://forgejo-http.${NAMESPACE}.svc.cluster.local:3000/api/v1
    # No `publicEndpoint`, so the operator UI links projects to the endpoint
    # above rather than to https://git.<domain>.
    #
    # It is omitted to keep the domain out of the manifests: the operator's
    # policy.allowedHosts must list the host of every endpoint it is given, and
    # allowedHosts is the one Helm value in this estate that gets schema-
    # validated against a hostname pattern -- which an offline `flate` render
    # cannot satisfy for a `${ROOT_DOMAIN}` that lives in a SOPS Secret. See
    # the long note on `policy.allowedHosts` in ../renovate-operator.
    #
    # Cloning is NOT affected by this being absent -- but it IS affected by
    # `endpoint` above, which is a different thing and cost a failed run to
    # learn. See `gitUrl` in the config below.

  # Cheap insurance rather than a live concern: a fork of an upstream repo
  # would otherwise get its own nightly run and its own PRs against a tree
  # nobody here maintains. Costs one API call per discovered repository, and
  # fails OPEN -- a repository whose lookup errors is kept.
  skipForks: true

  # No `discoveryFilters` and no `discoverTopics`, so discovery returns every
  # repository the bot's token can see. That is the correct gate on this
  # instance: Forgejo is REQUIRE_SIGNIN_VIEW and the bot is an ordinary
  # account, so "what Renovate manages" is decided by which repositories the
  # `renovate` user is a collaborator on -- in the forge, where a repository
  # owner can change it, rather than in this file.

  webhook:
    # Turns the Dependency Dashboard checkboxes and the per-PR "rebase" box
    # into something that acts now instead of at 03:00 tomorrow.
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: ${APP}-webhook
        key: token
    sync:
      # The operator creates and maintains the hook on every discovered
      # repository itself, using the platform token above. The alternative is
      # adding a webhook by hand to every repo, forever.
      #
      # No `sync.secretRef`, so that token is the bot's -- and Forgejo only
      # lets a repository owner or ADMIN manage hooks. That is why the bot is
      # repo-admin everywhere it works (an `admin` team per organization, an
      # `admin` collaborator grant per user repository; both in
      # stacks/system/forgejo-renovate.ts) rather than merely able to push. A
      # repository where it is anything less gets a 403 here every night and
      # no hook; discovery and the run itself are unaffected, so the only
      # symptom is a checkbox that does nothing until 03:00.
      enabled: true

  extraEnv:
    # The github.com credential, and NOT the platform token -- the platform is
    # Forgejo. Renovate still talks to api.github.com on every run: release
    # notes, and every `github-releases` / `github-tags` datasource lookup.
    # Unauthenticated that is 60 requests an hour for the whole cluster's egress
    # IP, which this estate's manifests exhaust inside a single repository, and
    # the run then reports `no-result` for perfectly healthy dependencies.
    #
    # `github-token` is the GitHub App installation token that
    # stacks/vault/KubernetesGithubAppToken.ts mints and emberstack reflects
    # into every namespace, this one included. Two consequences of it being an
    # App token rather than a PAT, both benign here:
    #
    #   * it EXPIRES HOURLY and is re-minted. That would be a problem for a
    #     long-lived Deployment holding it in memory; these are Jobs the
    #     operator creates fresh per run, so each one reads whatever is current
    #     at pod start and is finished long before it lapses.
    #   * its rate limit is the App installation's, not a user's 5000/hour.
    #
    # It is read as an env var rather than through the ExternalSecret next to it
    # for the same reason: the Secret is reflected and already current, so
    # copying it into a second Secret would only add a staleness window.
    - name: GITHUB_COM_TOKEN
      valueFrom:
        secretKeyRef:
          name: github-token
          key: token

  renovateConfig:
    # Mounted read-only at /etc/renovate/config.js with RENOVATE_CONFIG_FILE
    # pointed at it. The operator writes it into a ConfigMap it owns -- so
    # nothing secret may go here, and nothing does: platform, endpoint and
    # token all arrive as environment variables.
    fileName: config.js
    inline: |
      module.exports = {
        // THE HOUSE CONFIG. `globalExtends` is the bot-level equivalent of
        // `extends`: it is resolved once for the whole run and every repository
        // inherits it, and a repository's own renovate.json still merges on
        // top -- so this is a DEFAULT, not a policy. That is the difference
        // from `force`, which would win over the repo and is not what is
        // wanted here.
        //
        // It points at the file GitHub's Renovate already reads for this same
        // estate, so the two bots share one set of grouping rules, semantic
        // commit scopes and package rules instead of drifting apart.
        //
        // Two things it drags along that are worth knowing:
        //
        //   * `schedule: ["at any time"]` (it was "every weekend"). Inherited
        //     by every Forgejo repository, so PRs open on whichever night the
        //     cron above finds an update, unless a repository overrides it.
        //     That is the house default; change it in the preset, not here.
        //   * the flux/helm-values/kubernetes/kustomize manager settings are
        //     scoped to `kubernetes/**`, so on a repository without that tree
        //     they are inert rather than wrong.
        //
        // `owner/repo:preset` -- the repository is `david-driscoll/.github` and
        // the preset is `renovate-config.json` at its root (Renovate appends
        // the `.json`). Written as a path instead, the first two segments are
        // read as the repository and discovery dies on config-validation.
        globalExtends: ['github>david-driscoll/.github:renovate-config'],

        // CLONE FROM THE ENDPOINT, NOT FROM `clone_url`.
        //
        // By default Renovate clones whatever the repository's `clone_url`
        // says, which Forgejo builds from ROOT_URL -- so
        // https://git.<domain>/owner/repo. But Renovate's credential is keyed
        // to the host of `endpoint`, which is the in-cluster Service. The two
        // hosts differ, no host rule matched, and git fell through to an
        // interactive prompt:
        //
        //   fatal: could not read Password for
        //   'https://**redacted**@git.<domain>': No such device or address
        //
        // The executor failed on every repository while discovery looked
        // perfectly healthy, because discovery only calls the API and never
        // clones.
        //
        // `endpoint` makes Renovate build the clone URL from the same host it
        // authenticates against, so the token applies. The alternative is a
        // `hostRules` entry for the public host, which would mean putting the
        // token in this ConfigMap -- it is not a Secret, so that is not an
        // option.
        gitUrl: 'endpoint',

        // Silences the level-40 warning every run logs against
        // forgejo-http.<ns>.svc.cluster.local, a ClusterIP and so an internal
        // address:
        //
        //   HTTP request to an internal host, which `internalHostAccess=block`
        //   would refuse - permit it with a `hostRules` entry naming the host
        //
        // `internalHostAccess` defaults to `warn` today and becomes `block` in
        // a future major. Under `block` the configured platform `endpoint` is
        // exempt, so this bot would keep working either way -- the grant is
        // here to stop the warning, and to survive `endpoint` ever ceasing to
        // be the only internal host reached (git clone uses the same host via
        // `gitUrl: 'endpoint'` above).
        //
        // A URL PREFIX WITH THE PORT, not a bare hostname: Renovate matches a
        // bare `matchHost` against every subdomain, and the docs recommend the
        // narrow form so one grant cannot quietly cover other Services. Safe
        // in this ConfigMap because it carries no credential -- `allowInternal`
        // alone is an access grant, and the token stays in RENOVATE_TOKEN.
        hostRules: [
          {
            matchHost: 'http://forgejo-http.${NAMESPACE}.svc.cluster.local:3000',
            allowInternal: true,
          },
        ],

        // Not set here and deliberately so: `endpoint` and `token` come from
        // RENOVATE_ENDPOINT / RENOVATE_TOKEN, which the operator sets from
        // spec.provider and spec.secretRef. `platform` is restated below only
        // because it is cheap to read and impossible to get wrong twice.
        platform: 'forgejo',

        // THE IDENTITY GITHUB'S RENOVATE COMMITS WITH, name and address both --
        // not an address on this forge.
        //
        // One of the repositories this bot works on is the Forgejo copy of the
        // estate's GitHub repository, and what merges there is pushed to
        // GitHub (docs/runbooks/forgejo-github-mirror.md). With this, an
        // update reads the same in GitHub's history whichever bot raised it:
        // authored by renovate[bot], avatar and all.
        //
        // It used to be `renovate@git.<root domain>`, the bot's account
        // address, and could not stay that: the repository on GitHub is
        // public, and the sync refuses to publish a commit that names the
        // domain -- so not one update would ever have got out.
        //
        // What it costs is on the forge only. The address belongs to no
        // account here, so Forgejo shows these commits with no avatar and no
        // link to the bot. The pull request is still the bot's, and Renovate
        // tells its own branches from edited ones by this address, not by the
        // account. The same branches imported from GitHub are, for the same
        // reason, already its own.
        //
        // The `[bot]` in the address is not valid RFC 5322 and Renovate's
        // parser has a special case for exactly this spelling.
        gitAuthor: 'renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>',

        // Addresses whose commits count as Renovate's own, besides the one
        // above. Without this a branch whose last commit has any other author
        // is "edited by someone else": Renovate stops updating it and waits
        // for a checkbox. This is `gitAuthor` as it was until now -- every
        // branch already open on the forge was committed with it.
        gitIgnoredAuthors: ['renovate@git.${ROOT_DOMAIN}'],

        // Every repository gets a dashboard issue rather than silent PRs.
        // This is what the webhook above makes interactive.
        dependencyDashboard: true,
        dependencyDashboardTitle: 'Renovate Dashboard 🤖',

        // INERT, and kept only so the intent is on the record: BOTH job types
        // the operator creates pass the flag on the command line, and CLI beats
        // the config file. The discovery job runs `renovate --autodiscover`,
        // and each executor runs `renovate --autodiscover=false <project>` --
        // which is exactly what keeps one executor from re-running every
        // repository. Deleting this line changes nothing; so does setting it
        // false.
        autodiscover: true,

        // Run against repositories that have no renovate config yet, and open
        // an onboarding PR offering one. `requireConfig: 'optional'` is what
        // makes the first half true -- the default ('required') would have
        // Renovate skip an un-onboarded repository entirely, so a repo would
        // only ever be managed after someone merged a PR they never saw.
        onboarding: true,
        requireConfig: 'optional',
        onboardingConfig: {
          // The same preset the bot already applies globally. Without this the
          // onboarding PR would propose bare `config:recommended`, which reads
          // as "here is the house config" while actually being a narrower one
          // -- and merging it would pin that repository to the narrower set.
          extends: ['github>david-driscoll/home-operations//.github/renovate.json5'],
        },

        // Implicit executions Renovate is permitted to run. The allowed values
        // are a fixed enum (bazelModDeps, goGenerate, gradleWrapper, mise,
        // pixi); `mise` is the one that matters here, because a repo carrying
        // .mise.toml needs it to resolve tool versions and otherwise the
        // update is skipped rather than failed. It is `globalOnly`, so this is
        // the only place it can be set -- a repository cannot grant itself
        // more.
        allowedUnsafeExecutions: ['mise'],

        // Let Forgejo do the merge itself when a rule asks for automerge,
        // instead of Renovate polling and merging through the API. Needs
        // Forgejo >= 10 for branch autodelete; this instance is on 16.
        platformAutomerge: true,

        // Match the commit style the estate already uses everywhere else.
        semanticCommits: 'enabled',

        // Renovate's own default is 2 PRs/hour and 20 open. The hourly limit
        // exists to be polite to hosted platforms; the forge is in this
        // cluster, so it only serves to spread a first run over days.
        prHourlyLimit: 0,
        prConcurrentLimit: 10,

        // `repositoryCache` is NOT set here, and that is not the same as it
        // being off. The operator sets `RENOVATE_REPOSITORY_CACHE=enabled` and
        // `RENOVATE_REPOSITORY_CACHE_TYPE=s3://renovate/renovate-cache/` on
        // every Job from `config.forwardS3CacheToJobs`, pointed at the Garage
        // cluster in this namespace -- so dependency metadata does survive
        // between runs. Environment beats the config file in Renovate's
        // precedence, so setting it here would be shadowed anyway, and would
        // give one setting two owners.
        //
        // `persistRepoData` stays off. That one caches the git working copy,
        // which lands on the scratch emptyDir below and dies with the Job no
        // matter what this says -- the S3 cache holds metadata, not clones.
      };

  scratchVolume:
    # RENOVATE_BASE_DIR. Renovate clones each repository here and runs package
    # managers in it, so it is not incidental scratch -- a small one fails a
    # big lockfile refresh with a confusing ENOSPC from inside npm.
    enabled: true
    path: /tmp
    sizeLimit: 4Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      # Renovate is Node; lockfile maintenance on a large repo is the peak and
      # it is memory-shaped. No CPU limit -- throttling a batch job only makes
      # the run longer while holding the same memory.
      memory: 2Gi
