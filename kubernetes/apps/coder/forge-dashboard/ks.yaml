---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forge-dashboard
  namespace: &namespace coder
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The ExternalSecret needs ESO's store; the PVC needs VolSync's populator.
    # Not forgejo: the app starts without a forge and shows it as "starting".
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/coder/forge-dashboard
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/failover/fast-node-eviction
    - ../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # One SQLite file: passkeys, sessions, encrypted tokens, a refillable cache.
      VOLSYNC_CAPACITY: 1Gi
