---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ENCRYPTION_KEY, which the app encrypts the forge tokens it saves with. Written
# to OpenBao by stacks/system/forge-dashboard.ts; nothing is hand-created.
#
# The forge tokens themselves are NOT here: the app has no environment variable
# for them. They are entered on its Settings page after the first passkey
# sign-in and stored encrypted in /data. See docs/kubernetes/forge-dashboard.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ENCRYPTION_KEY: "{{ .encryption_key }}"
  data:
    - secretKey: encryption_key
      remoteRef:
        key: clusters/equestria/apps/${APP}/credentials
        property: encryption_key
