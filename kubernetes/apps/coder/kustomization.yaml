---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coder
components:
  - ../../components/alerts
  - ../../components/common
  # The app-template OCIRepository. It is namespace-scoped and forgejo-runner's
  # HelmRelease refers to it by bare name, so every namespace that uses the
  # chart has to bring its own copy -- `equestria` does the same thing.
  - ../../components/repos/app-template
resources:
  - ./coder/ks.yaml
  - ./forgejo-garage/ks.yaml
  - ./forgejo/ks.yaml
  - ./forgejo-runner/ks.yaml
  # The operator first: ./renovate/ks.yaml is nothing but a RenovateJob, and
  # the CRD that admits it ships with the operator's chart. Flux orders on
  # dependsOn rather than on this list, so the order here is documentation --
  # but keeping the two adjacent and in dependency order is how a reader tells
  # they are a pair.
  - ./renovate-operator/ks.yaml
  - ./renovate/ks.yaml
