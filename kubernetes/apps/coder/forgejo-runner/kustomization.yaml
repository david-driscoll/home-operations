---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./scaledjob.yaml
configMapGenerator:
  - name: ${APP}-config
    files:
      - config.yml=./resources/config.yml
    options:
      disableNameSuffixHash: true
  # containerd hosts.toml files for the dind sidecar: pulls of ghcr.io and
  # docker.io go through the cluster's zot (./resources/ghcr.io.hosts.toml).
  # Keys cannot hold a `/`, so the ScaledJob's volume maps each key to
  # <registry>/hosts.toml. No hash suffix, for the same reason as below.
  - name: forgejo-runner-registries
    files:
      - ghcr.io=./resources/ghcr.io.hosts.toml
      - docker.io=./resources/docker.io.hosts.toml
    options:
      disableNameSuffixHash: true
  # The shell scripts the runner pods run. Flux substitution is OFF for
  # this ConfigMap, because envsubst would blank every shell variable in them
  # -- which is also why the name is spelled out. No hash suffix: the
  # ScaledJob names it literally, and each pod is new anyway.
  - name: forgejo-runner-scripts
    files:
      - prepull.sh=./resources/prepull.sh
      - run-job.sh=./resources/run-job.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
