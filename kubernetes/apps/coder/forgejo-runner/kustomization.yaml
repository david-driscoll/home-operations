---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./scaledjob.yaml
configMapGenerator:
  - name: ${APP}-config
    files:
      - config.yml=./resources/config.yml
    options:
      disableNameSuffixHash: true
