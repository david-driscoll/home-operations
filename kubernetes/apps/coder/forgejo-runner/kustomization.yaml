---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./scaledjob.yaml
configMapGenerator:
  - name: ${APP}-config
    files:
      - config.yml=./resources/config.yml
    options:
      disableNameSuffixHash: true
  # The two shell scripts the runner pods run. Flux substitution is OFF for
  # this ConfigMap, because envsubst would blank every shell variable in them
  # -- which is also why the name is spelled out. No hash suffix: the
  # ScaledJob names it literally, and each pod is new anyway.
  - name: forgejo-runner-scripts
    files:
      - queue-check.sh=./resources/queue-check.sh
      - run-job.sh=./resources/run-job.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
