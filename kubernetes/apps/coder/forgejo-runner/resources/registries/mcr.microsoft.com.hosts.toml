# mcr.microsoft.com through the cluster's zot, falling back to https://mcr.microsoft.com.
# See ./ghcr.io.hosts.toml for how the runner's dind reads this.
server = "https://mcr.microsoft.com"

[host."http://registry.kube-system.svc.cluster.local:8080/v2/mcr.microsoft.com"]
  capabilities = ["pull", "resolve"]
  override_path = true
