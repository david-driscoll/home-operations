# public.ecr.aws through the cluster's zot, falling back to https://public.ecr.aws.
# See ./ghcr.io.hosts.toml for how the runner's dind reads this.
server = "https://public.ecr.aws"

[host."http://registry.kube-system.svc.cluster.local:8080/v2/public.ecr.aws"]
  capabilities = ["pull", "resolve"]
  override_path = true
