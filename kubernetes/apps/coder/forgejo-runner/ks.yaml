---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app forgejo-runner
  namespace: &namespace coder
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # `forgejo` is wait: true, so KEDA only starts asking it for jobs once
    # the forge is actually Ready.
    - name: forgejo
      namespace: coder
    # The ScaledJob and TriggerAuthentication CRDs, and the webhook that
    # admits them.
    - name: keda
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/coder/forgejo-runner
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # No components/volsync: a runner pod has only emptyDirs and lives for
      # one job.
      #
      # Not Tier 1: no critical-tier priority class and no control-plane
      # toleration. During Low Power the runner pods have nowhere to schedule
      # once the workers are down and stay Pending, so CI waits out the
      # window, which is the call
      # docs/cluster-consolidation/24-power-states.md already records for
      # `github-actions`.
