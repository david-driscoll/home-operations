---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        type: statefulset
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          # Jobs can run for a long time; `runner.shutdown_timeout` in the
          # config gives them 30m to finish after SIGTERM, so the kubelet has to
          # be willing to wait roughly that long before it sends SIGKILL.
          terminationGracePeriodSeconds: 1860

        initContainers:
          # A native sidecar (`restartPolicy: Always` on an initContainer), not
          # a plain container: that makes the kubelet start it BEFORE the runner
          # and keep it running for the pod's lifetime. A plain container gives
          # no ordering guarantee, and the runner logs a hard error when the
          # Docker host is unreachable at startup.
          dind:
            restartPolicy: Always
            image:
              # The Forgejo project's own mirror of docker:dind. Same content as
              # Docker Hub's library image, but anonymous and not rate-limited,
              # and it keeps this app on a single registry with the runner and
              # the forge.
              repository: data.forgejo.org/oci/docker
              tag: 29-dind@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
            env:
              # TLS ON, with client verification. This is not belt-and-braces --
              # it is the only way to keep an unauthenticated Docker daemon off
              # the pod network.
              #
              # The first cut set this empty and passed
              # `--host=tcp://127.0.0.1:2375`, intending a loopback-only
              # listener. That cannot work: dockerd-entrypoint.sh prepends its
              # OWN `--host` before anything you pass, unconditionally --
              # `tcp://0.0.0.0:2376` with TLS, `tcp://0.0.0.0:2375` without. So
              # the flag became a SECOND --host on the same port, dockerd bound
              # 0.0.0.0 first and then died on "port is already allocated", and
              # the sidecar crash-looped with an unauthenticated daemon briefly
              # live on a routable pod IP each time round.
              #
              # With a certdir the entrypoint generates a CA plus server and
              # client certs into it and starts the daemon with --tlsverify, so
              # the 0.0.0.0 listener is useless without the client key that only
              # the runner container has.
              DOCKER_TLS_CERTDIR: /certs
            securityContext:
              # Unavoidable for Docker-in-Docker: dockerd needs to manage
              # cgroups, mounts and iptables in its own namespace. It is the
              # reason this runs in its own namespace rather than alongside the
              # forge.
              privileged: true
              runAsUser: 0
              runAsNonRoot: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                # Makes the scheduler account for the layer store instead of
                # discovering it after the fact. Modest on purpose: this is the
                # floor it reserves, not the ceiling it may use.
                ephemeral-storage: 4Gi
              limits:
                memory: 4Gi
                # Slightly ABOVE the docker-storage sizeLimit below, so the
                # volume's own limit is what trips first and the eviction
                # message names the volume rather than the container. This is
                # the backstop for the container's writable layer and logs.
                ephemeral-storage: 64Gi
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - >-
                        docker --tlsverify
                        --tlscacert=/certs/client/ca.pem
                        --tlscert=/certs/client/cert.pem
                        --tlskey=/certs/client/key.pem
                        -H tcp://127.0.0.1:2376 info
                  initialDelaySeconds: 5
                  periodSeconds: 2
                  failureThreshold: 30

        containers:
          app:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.0.0@sha256:7fb853bfe73c229be6349398359c0a7bd01fadfd17c106607b2221150b799ed2
            command: ["forgejo-runner"]
            args: ["daemon", "--config", "/config/config.yml"]
            env:
              TZ: "${TIMEZONE}"
              # 127.0.0.1 still, because the containers share a network
              # namespace -- but the security now comes from the client
              # certificate, not from the bind address.
              DOCKER_HOST: tcp://127.0.0.1:2376
              DOCKER_TLS_VERIFY: "1"
              DOCKER_CERT_PATH: /certs/client
              # The image runs as uid 1000 with no home directory of its own;
              # without these the runner writes its cache under / and fails.
              HOME: /data
              XDG_CACHE_HOME: /data/.cache
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 2Gi
                ephemeral-storage: 12Gi
            probes:
              # forgejo-runner serves no health endpoint and exports no metrics,
              # so the only thing in the process that can be probed at all is
              # the internal cache server -- which is why `cache.port` is pinned
              # to 8088 in resources/config.yml rather than left at the default
              # 0 (random).
              #
              # BE CLEAR ABOUT WHAT THIS CATCHES. A bound TCP port proves the
              # process is alive and its listeners are up. It does NOT prove the
              # poller is still claiming jobs, which is the failure mode that
              # actually matters and the one Forgejo gives us no signal for. It
              # upgrades "hung or deadlocked process" from invisible to a
              # restart; it does not close the silent-idle gap. See the note on
              # ForgejoRunnerDown in prometheusrule.yaml.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8088
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: false
              startup:
                enabled: false

    persistence:
      # Runner state: the actions cache and job working directories.
      #
      # emptyDir, not a PVC. Everything here is rebuildable -- the actcache
      # directory is a cache, `/data/act` is per-job scratch, and `.runner` is
      # never written because registration comes from `server.connections` in
      # the config Secret. A 10Gi Longhorn volume at three replicas was 30Gi of
      # replicated storage protecting nothing, and it made the pod wait for an
      # RWO detach on every reschedule -- the same wait that stalled the forgejo
      # pod for minutes during the migration. With no volume to detach the
      # runner moves immediately.
      #
      # It also removes a trap: `persistence` with `type: persistentVolumeClaim`
      # creates ONE shared PVC, and app-template 5.1.0 exposes no
      # `volumeClaimTemplates`, so a second replica would have blocked forever on
      # a ReadWriteOnce volume already attached elsewhere. That is now moot --
      # though replicas must still stay 1, for the independent reason in
      # resources/config.yml.
      data:
        type: emptyDir
        sizeLimit: 10Gi
        advancedMounts:
          *app :
            app:
              - path: /data

      # Docker's image and layer store. emptyDir rather than a PVC: it is pure
      # cache, it churns hard enough to be unkind to Longhorn, and a cold pull
      # after a restart costs minutes, not data.
      #
      # sizeLimit is the real control on this app's disk appetite. Workflow code
      # is arbitrary and `runner.capacity` lets four jobs pull and build at once,
      # so without a bound one repository can fill a worker's ephemeral storage
      # and take its neighbours down with it -- these nodes also carry Plex, the
      # *arr stack and Immich, and the kubelet evicts by QoS class, not by who
      # caused it. 60Gi is roughly an eighth of a worker's ~430Gi and far more
      # than any honest build needs.
      docker-storage:
        type: emptyDir
        sizeLimit: 60Gi
        advancedMounts:
          *app :
            dind:
              - path: /var/lib/docker

      # The TLS material dockerd-entrypoint.sh generates on start: a CA, a
      # server pair under /certs/server, and a client pair under /certs/client.
      # It has to be a shared volume rather than each container's own, because
      # the whole point is that the runner presents the client key the daemon
      # will accept.
      #
      # emptyDir, so it is regenerated every start. Nothing outside this pod
      # ever needs to verify against it, and a CA that lives exactly as long as
      # the daemon it authenticates is one fewer thing to rotate.
      docker-certs:
        type: emptyDir
        advancedMounts:
          *app :
            dind:
              - path: /certs
            app:
              - path: /certs
                readOnly: true

      config:
        type: secret
        name: ${APP}-config
        advancedMounts:
          *app :
            app:
              - path: /config
                readOnly: true

    service:
      app:
        enabled: false
