---
# Two runners that are always up, so a job starts within seconds instead of
# waiting for KEDA's next poll, a pod to schedule and a Docker daemon to boot.
# ./scaledjob.yaml still starts more pods when the forge has more jobs than
# these two can carry.
#
# What they have that the on-demand pods do not:
#
# - they are already running when a job arrives;
# - their Docker image store and actions cache live as long as the pod, so
#   after the first job the 1.5 GB job image is not pulled again and a
#   `flate` render finds its cache.
#
# Each runs `forgejo-runner daemon` with `capacity: 1` from the shared config,
# so one job at a time per pod, with the same 6Gi ceiling per job as an
# on-demand pod. Two pods, not one pod with `capacity: 2`, so a node going
# away takes one of them and not both.
#
# THEY SHARE THE ONE REGISTRATION with each other and with every on-demand
# pod (./scaledjob.yaml's header has the reasoning). Ten `one-job` processes
# on one identity are known to work; two daemons on it were what the old
# config comment warned against, and that has not been tried here yet. If
# Forgejo misbehaves with it, give these their own registration.
#
# ./scaledjob.yaml subtracts these two from the count it scales on. Change
# `replicas` here and `customScalingQueueLengthDeduction` there has to follow.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP}-warm
  annotations:
    # The registration and config come from a Secret External Secrets keeps
    # fresh; a daemon reads them once, at start.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  # Never more than the two: a surge pod would be a third daemon for the
  # length of a rollout. One at a time, so one is always there.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      driscoll.dev/runner: warm
  template:
    metadata:
      labels:
        driscoll.dev/runner: warm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # `runner.shutdown_timeout` in the config gives a job 30m to finish
      # after SIGTERM, so the kubelet has to wait about that long before it
      # sends SIGKILL.
      terminationGracePeriodSeconds: 1860
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # One per node where the scheduler can manage it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              driscoll.dev/runner: warm
      initContainers:
        # A native sidecar, exactly as in ./scaledjob.yaml and for the same
        # reasons: started first, probed, and privileged because dockerd has
        # to be. TLS with client verification, because the entrypoint always
        # listens on 0.0.0.0.
        - name: dind
          restartPolicy: Always
          image: data.forgejo.org/oci/docker:29-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 100m
              # Idle most of the time, so the request is what an idle daemon
              # with a warm image store needs, not what a job peaks at.
              memory: 512Mi
              ephemeral-storage: 4Gi
            limits:
              # One job at a time, so this is the ceiling for one job.
              memory: 6Gi
              ephemeral-storage: 44Gi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  docker --tlsverify
                  --tlscacert=/certs/client/ca.pem
                  --tlscert=/certs/client/cert.pem
                  --tlskey=/certs/client/key.pem
                  -H tcp://127.0.0.1:2376 info
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: docker-certs
              mountPath: /certs
      containers:
        - name: app
          image: data.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
          command: ["/usr/bin/dumb-init", "--", "forgejo-runner"]
          args: ["daemon", "--config", "/config/config.yml"]
          env:
            - name: TZ
              value: "${TIMEZONE}"
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: HOME
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/.cache
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 12Gi
          # The daemon has no health endpoint; the cache server's port
          # (`cache.port` in the config) is the one thing in the process a
          # probe can reach. It proves the process is alive and listening,
          # not that it is still claiming jobs.
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        # Both caches, for as long as the pod lives. emptyDir, not a PVC:
        # everything in them can be rebuilt, and nothing has to detach before
        # the pod can move.
        - name: data
          emptyDir:
            sizeLimit: 10Gi
        - name: docker-storage
          emptyDir:
            sizeLimit: 40Gi
        - name: docker-certs
          emptyDir: {}
        - name: config
          secret:
            secretName: forgejo-runner-config
