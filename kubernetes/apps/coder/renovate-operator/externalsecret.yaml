---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The OIDC client secret for the operator's web UI, plus the session
# encryption key.
#
# `client_secret` is written to OpenBao by stacks/applications from
# definition.yaml; `session_secret` by stacks/system/forgejo-renovate.ts, which
# generates it. Neither is hand-created. See docs/runbooks/renovate-forgejo.md.
#
# They are two separate OpenBao paths with two separate writers, hence the two
# `extract` blocks below rather than one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # Key names are the chart's `auth.oidc.secretKey` and
        # `auth.oidc.sessionSecretKey` -- change one, change the other.
        client-secret: "{{ .oidc_client_secret }}"
        session-secret: "{{ .credentials_session_secret }}"
  dataFrom:
    # Path within the `secrets` mount; the store pins `path: secrets`.
    - extract:
        key: clusters/equestria/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
    # A path of its own, not a field on `.../credentials`: it is written by a
    # different resource in a different Pulumi component, and a single-field
    # path is what keeps the two writers from racing each other's payload.
    - extract:
        key: clusters/equestria/apps/${APP}/session_secret
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "credentials_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The Helm values fragment carrying the OIDC issuer and client id -- see
# resources/values.yaml for why those two cannot be Secret references.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-values
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      templateFrom:
        - target: Data
          configMap:
            name: ${APP}-values
            items:
              - key: values.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: clusters/equestria/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
