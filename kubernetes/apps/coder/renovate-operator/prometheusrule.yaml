---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ${APP}-rules
spec:
  groups:
    - name: renovate-operator.rules
      rules:
        # WHAT THIS GROUP IS FOR.
        #
        # Renovate is batch work on a nightly cadence, so nothing here is
        # urgent -- every rule is `warning` and every `for:` is long. The
        # failure mode worth catching is the SILENT one: the operator stops
        # scheduling, or every run fails, and nobody notices because the only
        # symptom is dependency PRs quietly not appearing.
        #
        # Every renovate_operator_* series below comes from the operator's own
        # /metrics, scraped by the chart's ServiceMonitor. They only exist once
        # the operator has completed a run, so a brand new install is
        # legitimately silent here -- the Deployment rule covers that window.
        - alert: RenovateOperatorDown
          annotations:
            description: >-
              The renovate-operator Deployment has no available replica, so
              nothing is scheduling Renovate runs. This is EXPECTED during a Low
              Power window: the operator carries no priorityClassName and no
              control-plane toleration, so it goes Pending with the rest of
              Tier 2.
            summary: Renovate operator is not running.
          expr: |
            kube_deployment_status_replicas_available{namespace="coder", deployment="renovate-operator"} == 0
          for: 2h
          labels:
            severity: warning

        # The scheduler's own liveness. `schedule_next_run_timestamp_seconds`
        # is the operator's plan for when the cron fires next; if that moment is
        # hours in the past, the tick that should have advanced it never
        # happened. Catches a wedged scheduler that a Running pod and a green
        # Deployment both hide.
        - alert: RenovateScheduleStalled
          annotations:
            description: >-
              The next planned run for {{ $labels.renovate_job }} was
              {{ humanizeDuration $value }} ago and has not been rescheduled.
              The operator is up but its scheduler has stopped advancing.
            summary: Renovate schedule has stopped firing.
          expr: |
            time() - renovate_operator_schedule_next_run_timestamp_seconds{renovate_namespace="coder"} > 21600
          for: 1h
          labels:
            severity: warning

        # A repository whose last run failed. Per-project deliberately: one
        # broken repository is the common case (a malformed renovate.json, a
        # registry that stopped answering) and aggregating it away would hide
        # exactly the thing that needs fixing.
        #
        # 12h rather than something shorter because the gauge HOLDS its value
        # between runs -- a failure at 03:00 stays 1 until the next nightly run
        # clears it, so anything under a day would fire on a single bad night.
        - alert: RenovateRunFailing
          annotations:
            description: >-
              The last Renovate run for {{ $labels.project }} failed. Dependency
              updates for that repository have stopped; the run log is in the
              operator UI.
            summary: Renovate run failing for {{ $labels.project }}.
          expr: |
            renovate_operator_run_failed{renovate_namespace="coder"} == 1
          for: 12h
          labels:
            severity: warning

        # Discovery is upstream of everything else: if it cannot reach Forgejo
        # there are no projects to run, the per-project rule above has nothing
        # to fire on, and the whole group goes quiet in exactly the way a
        # working estate does. This is the rule that tells the two apart.
        #
        # MATCH `failed`, NOT `!= "success"`. The operator only ever emits two
        # values for this label -- `metricStore.IncDiscoveryJob(..., "failed")`
        # and `(..., "completed")` in src/internal/renovate/discoveryAgent.go --
        # so `status!="success"` matched the SUCCESSFUL runs too. One healthy
        # nightly discovery per day put `increase(...[24h])` at ~1.0007, just
        # over the `> 1` threshold, and this alert sat firing from 2026-09-14
        # while discovery was working (`discovered_repositories=1`, projects
        # enumerated). `> 0` is the right threshold once the selector only
        # matches real failures: one failed discovery is worth knowing about.
        - alert: RenovateDiscoveryFailing
          annotations:
            description: >-
              {{ $value }} discovery Jobs for {{ $labels.renovate_job }} failed
              in the last 24h. Renovate cannot enumerate
              repositories -- usually an expired Forgejo token, or an endpoint
              refused by the operator's policy.allowedHosts.
            summary: Renovate repository discovery is failing.
          expr: |
            increase(renovate_operator_discovery_jobs_total{renovate_namespace="coder", status="failed"}[24h]) > 0
          for: 1h
          labels:
            severity: warning

        # THE WEBHOOK HOP. Forgejo authenticates a delivery with the bearer
        # token the operator wrote onto the hook, so the failure that matters
        # here is `auth_failures` rather than the HMAC counter the upstream
        # example alerts on -- that one only moves for GitHub and Bitbucket.
        # `auth_failed` is a token mismatch (rotated in OpenBao, hook not yet
        # re-synced); `no_matching_job` is a hook left behind for a RenovateJob
        # that no longer exists; `secret_error` is the `renovate-webhook`
        # Secret being unreadable.
        #
        # The symptom is otherwise invisible: a Dependency Dashboard checkbox
        # that silently waits for 03:00 instead of acting.
        #
        # This does NOT catch a hook that was never created -- a sync 403 has
        # no metric, only an operator log line. See the runbook.
        - alert: RenovateWebhookRejecting
          annotations:
            description: >-
              The renovate-operator refused {{ $value | humanize }} webhook
              deliveries from {{ $labels.provider }} in the last hour
              ({{ $labels.error_type }}). Dependency Dashboard checkboxes and
              PR rebase boxes will not act until the nightly run.
            summary: Renovate webhook deliveries are being rejected.
          expr: |
            sum by (provider, error_type) (increase(renovate_operator_webhook_auth_failures_total[1h])) > 0
          for: 30m
          labels:
            severity: warning

        # A Secret the operator was told to read is missing, or missing the
        # key -- `renovate-secret` or `renovate-webhook`. Both are
        # ExternalSecrets over a path stacks/system writes, so this is what a
        # failed Pulumi write or a renamed OpenBao field looks like from here.
        - alert: RenovateSecretResolutionFailing
          annotations:
            description: >-
              The renovate-operator failed to resolve a Secret
              {{ $value | humanize }} times in the last hour
              ({{ $labels.error_type }}). Check the ExternalSecrets in
              kubernetes/apps/coder/renovate.
            summary: Renovate operator cannot read one of its Secrets.
          expr: |
            sum by (error_type) (increase(renovate_operator_secret_resolution_errors_total[1h])) > 0
          for: 30m
          labels:
            severity: warning

        # The policy engine is ON in this estate (it ships off), and a refused
        # RenovateJob runs nothing at all. `destination` is a host missing from
        # policy.allowedHosts; `secret_ref` is a Secret without the
        # `allow-ref` label.
        - alert: RenovatePolicyDenying
          annotations:
            description: >-
              The renovate-operator policy refused a RenovateJob action
              ({{ $labels.check }}). `kubectl -n coder get renovatejob -o wide`
              and read the Accepted condition for the value to allowlist.
            summary: Renovate operator is refusing a RenovateJob.
          expr: |
            sum by (check) (increase(renovate_operator_policy_denials_total[1h])) > 0
          for: 30m
          labels:
            severity: warning

        # The inverse: the engine itself switched off, which a chart default
        # reasserting itself would do with no other symptom.
        - alert: RenovatePolicyNotEnforcing
          annotations:
            description: >-
              renovate_operator_policy_enabled is 0. Anything that can write a
              RenovateJob in `coder` can now point the operator's credentials
              at a host of its choosing. Restore `policy.enabled: true`.
            summary: Renovate operator policy engine is off.
          expr: |
            max(renovate_operator_policy_enabled) == 0
          for: 30m
          labels:
            severity: warning
