---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-operator
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.0.1
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  maxHistory: 3
  interval: 15m
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  valuesFrom:
    # The OIDC issuer and client id. Both are plain Helm values in this chart
    # (only the client SECRET can be an existingSecret reference), and both are
    # generated by authentik rather than known at commit time -- so they arrive
    # the same way forgejo's autoDiscoverUrl does: an ExternalSecret rendering a
    # values.yaml fragment. Flux merges valuesFrom first and `spec.values` on
    # top, recursively, so the `auth` map below and the one in the Secret
    # combine rather than replace.
    - kind: Secret
      name: ${APP}-values
      valuesKey: values.yaml
  values:
    # REQUIRED. Without it the chart's fullname helper is
    # `<release>-<chart>` = `renovate-operator-renovate-operator`, which would
    # rename the Service the tailscale component and the HTTPRoute point at,
    # and the webhook base URL below with it.
    fullnameOverride: *app

    replicaCount: 1

    crd:
      install: true
      # `template`, not the chart default `hook`. The hook mode installs the
      # CRD from a pre-install/pre-upgrade Job that needs a cluster-scoped
      # ServiceAccount able to write CustomResourceDefinitions; template mode
      # makes the CRD an ordinary rendered manifest that Flux owns, diffs and
      # prunes like everything else.
      mode: template

    # No `image:` block on purpose. Left unset, the chart's tag falls back to
    # .Chart.AppVersion, so the OCIRepository tag above is the single version to
    # bump and the operator image can never drift from the chart that templates
    # it. Writing `tag: ~` explicitly means the same thing to Helm but reads as
    # an unresolved value to flate.

    deployment:
      annotations:
        # The `-values` and `-oidc` Secrets both feed the operator's OIDC
        # config; a refresh has to restart the pod for it to be read.
        reloader.stakater.com/auto: "true"

    rbac:
      # The operator only ever watches this namespace: the single RenovateJob
      # lives beside it in `coder`. A ClusterRole would let anyone who can
      # create a RenovateJob anywhere in the estate borrow the operator's
      # credentials.
      ownNamespaceOnly: true

    config:
      # `memory`, not the `disabled` default: with no log store the UI has
      # nothing to show once a Job's pod is gone, and `kubectl logs` on a
      # completed Job is the only fallback. In-process, so it is lost on an
      # operator restart -- the durable options are Valkey or S3, neither of
      # which is worth standing up for a nightly run.
      logStorage:
        mode: memory
      # Keep the finished Jobs for a week rather than the chart's `-1`
      # (forever). The operator's own status and the log store above are what
      # the UI reads; the Job objects are only there for `kubectl`, and an
      # unbounded pile of them is a slow etcd leak.
      jobTTLSecondsAfterFinished: 604800
      deleteSuccessfulJobs: false

    policy:
      # ON, despite the chart shipping it off. The whole point of the engine is
      # to bound where the operator will send its credentials and the
      # repository webhooks it writes, and this cluster hands RenovateJob edit
      # rights to anything with write access to `coder`.
      enabled: true
      allowedHosts:
        # ONE ENTRY, AND NO PUBLIC HOSTNAME. That is deliberate and it is the
        # reason `provider.publicEndpoint` is not set on the RenovateJob.
        #
        # This chart ships a values.schema.json constraining each entry to
        # `^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$`, and it is the only chart
        # in the estate that validates a hostname. `${ROOT_DOMAIN}` comes from
        # the SOPS-encrypted `shared-secrets` Secret, which an offline render
        # cannot decrypt -- flate implements no `spec.decryption` -- so
        # `git.${ROOT_DOMAIN}` renders as the bare `git.`, a trailing dot,
        # which fails that pattern and makes `mise run flate` reject the WHOLE
        # HelmRelease. Not a warning: `✗ 1 failed`, and the hk `flate` step
        # gates the commit.
        #
        # There is no spelling that survives it. flate's own answer for SOPS
        # values is a placeholder (`..PLACEHOLDER_ROOT_DOMAIN..`), which
        # contains `_` and fails the same pattern; an envsubst default puts the
        # domain back as a literal; a `valuesFrom` ConfigMap is still rendered
        # and still validated. So the domain does not go in here at all.
        #
        # The cost is confined to one thing: the operator UI links a project to
        # the endpoint it reconciles against, which is now the ClusterIP name
        # below rather than https://git.<domain>. Cloning, the API and the
        # webhook are all unaffected -- Renovate takes the clone URL from the
        # repository's own `clone_url`, which Forgejo builds from ROOT_URL.
        #
        # `${NAMESPACE}` resolves offline (it is in this app's
        # postBuild.substitute map, not in a Secret), so this entry renders
        # `forgejo-http.coder.svc.cluster.local` in flate and in-cluster alike.
        #
        # The chart appends the webhook base URL's host
        # (renovate-operator.coder.svc.cluster.local) on its own, because it
        # comes from `webhook.baseUrl` below and is therefore already approved.
        - forgejo-http.${NAMESPACE}.svc.cluster.local
      allowedImages:
        # Only the GHCR spelling. The chart's default also allows the two
        # Docker Hub forms; nothing here pulls Renovate from Docker Hub, and an
        # unused allowance is an unaudited one.
        - ghcr.io/renovatebot/renovate
      # A RenovateJob may only have the operator read a secret at a
      # caller-chosen key if that Secret opts in with the
      # `renovate-operator.mogenius.com/allow-ref: "true"` label. The webhook
      # token Secret in ../renovate carries it; nothing else does.
      requireSecretRefOptIn: true
      allowRootUser: false

    webhook:
      # Forgejo delivers "the rebase checkbox was ticked" and Dependency
      # Dashboard edits here, which is the difference between a checkbox acting
      # now and acting at 03:00 tomorrow.
      enabled: true
      port: 8082
      # In-cluster, on purpose. Forgejo is a Service away in this same
      # namespace, so publishing a second public hostname (with a Gateway
      # listener, a certificate and an internet-reachable receiver) to carry
      # traffic that never leaves the pod network would be all cost.
      #
      # This does need a change on the FORGEJO side: `[webhook]
      # ALLOWED_HOST_LIST` defaults to `external`, which refuses every private
      # address, so the delivery would be rejected by Forgejo before it left
      # the pod. See the `webhook:` block in ../forgejo/helmrelease.yaml.
      baseUrl: http://renovate-operator.${NAMESPACE}.svc.cluster.local:8082

    auth:
      oidc:
        enabled: true
        # issuerUrl and clientId come from the `-values` ExternalSecret; see
        # valuesFrom above and resources/values.yaml.
        existingSecret: ${APP}-oidc
        secretKey: client-secret
        # Without a static session secret the operator generates one per
        # startup and every session dies with the pod -- which, with
        # `reloader` above, is every credential refresh that changes anything.
        sessionSecretKey: session-secret
        # Pinned rather than auto-detected. Auto-detection reads
        # `route.hostnames[0]` or `ingress.host`, and this app uses neither:
        # the HTTPRoute is hand-written (httproute.yaml) so it can carry the
        # `local-user` middleware filter, and `ingress` is the tailscale
        # component's.
        #
        # It is a SINGLE value, so the tailnet hostname registered in
        # definition.yaml cannot also be a landing point -- a login started at
        # renovate.${TAILSCALE_DOMAIN} completes on the public hostname. Both
        # resolve from the tailnet, so this works; it is a redirect, not a
        # second entrypoint.
        redirectUrl: https://renovate.${ROOT_DOMAIN}/auth/callback

    authorization:
      enabled: true
      defaults:
        # The authentik group, matched case-insensitively. `admins` is the same
        # group forgejo's `adminGroup` uses, and it arrives in the id token via
        # the `profile` property mapping -- authentik's default `profile` scope
        # carries `groups`.
        #
        # This is a DEFAULT: the RenovateJob leaves `spec.access` unset, so it
        # inherits this. Setting `spec.access.adminGroups` on the job would
        # REPLACE this list for that job rather than add to it.
        adminGroups:
          - admins
        # No anonymous read. Renovate logs are unredacted.
        anonymousRead: false

    metrics:
      enabled: true
      serviceMonitor:
        # serviceMonitorSelectorNilUsesHelmValues is false on this Prometheus,
        # so a bare ServiceMonitor is discovered with no release label needed.
        enabled: true
      dashboard:
        enabled: true
        # Deliberately EMPTY, overriding the chart's `grafana_dashboard: "1"`.
        # Two loaders would otherwise pick this ConfigMap up: kube-prometheus-
        # stack's sidecar (by label) and grafana-operator (by the CR below).
        # The CR is the one that wins here because it can be pointed at this
        # estate's instance selector; leaving the sidecar label on as well would
        # import the same dashboard twice.
        labels: {}
        grafanaDashboard:
          # The GrafanaDashboard CR and the ConfigMap it references land in
          # `coder`; the Grafana instance is in `observability`.
          allowCrossNamespaceImport: true
          instanceSelector:
            matchLabels:
              # Matches every hand-written dashboard in
              # kubernetes/apps/observability/grafana/dashboards/.
              dashboards: "grafana"

    logging:
      level: info
      format: json

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi

    # No `priorityClassName` and no control-plane toleration, unlike everything
    # else in this namespace. Renovate is batch work: during a Low Power window
    # (docs/cluster-consolidation/24-power-states.md) the workers are off, the
    # operator and its Jobs go Pending, and the run simply happens later. That
    # is the correct outcome -- promoting dependency updates onto the
    # control-plane trio would spend the Tier-1 budget on something nobody is
    # waiting for.
    tolerations:
      # The fast-node-eviction pair only; the equivalent of the
      # failover/fast-node-eviction component, which this chart cannot consume.
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
