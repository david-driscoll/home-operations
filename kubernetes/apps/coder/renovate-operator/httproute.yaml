---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/httproute-gateway-v1.json
# Hand-written rather than the chart's `route:` values, which cannot express an
# ExtensionRef filter -- and the middleware is the point: the UI can trigger,
# cancel and reconfigure Renovate runs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "renovate.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          # The chart's `http` port; 8082 (webhook) is deliberately NOT routed
          # here -- Forgejo reaches it on the ClusterIP.
          port: 8081
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # error-pages -> internal-network. Network-gated in ADDITION to the
            # operator's own authentik OIDC, not instead of it: the UI's own
            # session is what authorises an action, this only keeps the login
            # page off the internet.
            name: local-user
