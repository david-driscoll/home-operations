---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Database credentials for the CNPG role that components/postgres provisions.
# The `${APP}-postgres` item in the `database` store is the Secret rendered by
# that component (kubernetes/components/postgres/database/credentials.yaml), not
# anything written here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-db
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # Forgejo's [database] HOST takes host:port in one string.
        host: "{{ .postgres_hostname }}:{{ .postgres_port }}"
        database: "{{ .postgres_database }}"
        username: "{{ .postgres_username }}"
        password: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Instance secrets that must outlive the pod. Hand-created in OpenBao before
# the first deploy -- see the checklist in the PR that introduced this app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secrets
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        secret_key: "{{ .credentials_secret_key }}"
        jwt_secret: "{{ .credentials_jwt_secret }}"
  dataFrom:
    # Path within the `secrets` mount; the store pins `path: secrets`.
    - extract:
        key: clusters/equestria/apps/${APP}/credentials
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "credentials_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The break-glass local admin. The chart's configure-gitea init container reads
# exactly the keys `username` and `password` from this Secret name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-admin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        username: "{{ .credentials_username }}"
        password: "{{ .credentials_password }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/${APP}/credentials
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "credentials_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# OIDC client credentials, written to OpenBao by stacks/applications from
# definition.yaml. The chart's configure-gitea container reads exactly the keys
# `key` and `secret` from this Secret name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oauth
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        key: "{{ .oidc_client_id }}"
        secret: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The Helm values fragment carrying the OIDC discovery URL -- see
# resources/values.yaml for why that one field cannot be a Secret reference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-values
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      templateFrom:
        - target: Data
          configMap:
            name: ${APP}-values
            items:
              - key: values.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: clusters/equestria/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
