---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# The forge's container registry API (`/v2/`, token endpoint included), WITHOUT
# the error-pages middleware the chart's own route carries (`local-user` in
# ./helmrelease.yaml: error-pages -> internal-network).
#
# error-pages is a Traefik `errors` middleware over 401-599: it swaps the
# backend's response for an HTML page, and the backend's headers go with it.
# A registry's 401 is not an error page, it is the auth handshake -- its
# `Www-Authenticate: Bearer realm=".../v2/token"` is how a client learns where
# to fetch a token. Stripped, containerd has nowhere to send the pull secret
# and gives up after the first HEAD. Measured 2026-10-19: Forgejo answered
# with the header on localhost:3000 and without it through this hostname, and
# every node pull of the Pulumi workspace image
# (docs/kubernetes/pulumi-workspace-image.md) failed `401 Unauthorized` with
# only HEADs in Forgejo's log and never a /v2/token request.
#
# Same hostname as the chart's route; Gateway API picks the longest matching
# path prefix, so `/v2` lands here and everything else stays on the chart's
# route, error pages and all. `local-api` (kubernetes/components/common) is
# internal-network alone: the registry is no more exposed than the forge
# already is, and every client authenticates to Forgejo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-registry
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "git.${ROOT_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: local-api
      backendRefs:
        # The chart's HTTP Service (service.http in ./helmrelease.yaml).
        - name: ${APP}-http
          port: 3000
