---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: forgejo
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 17.3.1
    digest: sha256:38d6d9ea57512808754d310bd6c0fe717d697b5f67ea4e34bdb8500ab49b0343
  # data.forgejo.org, not code.forgejo.org (the chart's own default), for the
  # same reason docker/celestia/forgejo used it: code.forgejo.org is itself a
  # Forgejo instance and answers /v2/ with a Bearer challenge that Renovate
  # intermittently fails to complete, dropping the dep with "no-result" and
  # silently stranding the pin. data.forgejo.org is the project's own mirror,
  # serves /v2/ anonymously, and carries byte-identical manifests.
  url: oci://data.forgejo.org/forgejo-helm/forgejo
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  maxHistory: 3
  interval: 15m
  timeout: 15m
  install:
    createNamespace: true
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  valuesFrom:
    # Only the OIDC discovery URL comes from here. `gitea.oauth[].autoDiscoverUrl`
    # is rendered into the `forgejo admin auth add-oauth` command line by the
    # chart, so unlike the client id/secret it cannot be sourced from a Secret
    # at runtime -- it has to be a Helm value. Flux merges valuesFrom first and
    # `spec.values` on top, and the merge is recursive, so the `gitea` map below
    # and the `gitea.oauth` list in the Secret combine rather than replace.
    - kind: Secret
      name: ${APP}-values
      valuesKey: values.yaml
  values:
    image:
      # `fullOverride` rather than registry/repository/tag, and NO digest.
      #
      # The chart's `gitea.image` helper builds the reference as
      # <registry>/<repo>:<tag><rootless><digest> -- it inserts the literal
      # "-rootless" BETWEEN the tag and the digest whenever `image.rootless` is
      # true and the tag does not already end in it. Every other spelling loses:
      #   tag: 16.0.3 + image.digest  -> Renovate rewrites `tag` to
      #     `16.0.3@sha256:<non-rootless digest>` and the helper then appends
      #     "-rootless" after the digest, producing an invalid reference.
      #   tag: 16.0.3-rootless        -> same, once a digest is appended the
      #     hasSuffix check stops matching and "-rootless" lands at the end.
      # `image.rootless` is not just a tag suffix -- it also drives HOME, the
      # SSH port defaults and the directory init script -- so it has to stay
      # true. That leaves fullOverride, which the annotation below keeps
      # Renovate-managed via the repo's `Process annotated dependencies`
      # customManager (.github/renovate.json5).
      rootless: true
      #
      # Renovate will not actually move this on its own right now, and the
      # dependency dashboard (issue #11) says so every run: "Error obtaining
      # docker token" / "No docker auth found - returning", then a no-result on
      # all three data.forgejo.org images this repo uses (forgejo/forgejo,
      # forgejo/runner, oci/docker). That message is the catch-all branch of
      # getAuthHeaders -- a network-level throw, not a 401/403/404 -- and it is
      # specific to the Mend-hosted bot's egress. The exact same renovate
      # 44.48.1 and the exact same config, run locally, resolve all three
      # anonymously with zero warnings. Nothing in this repo fixes that; bump
      # the tag by hand until Mend can reach the host.
      # renovate: datasource=docker depName=data.forgejo.org/forgejo/forgejo
      fullOverride: data.forgejo.org/forgejo/forgejo:16.0.6-rootless
      pullPolicy: IfNotPresent

    # Forgejo is explicitly not HA -- the chart refuses to be useful above one
    # replica and `strategy: Recreate` avoids two processes touching the RWO
    # volume during a rollout.
    replicaCount: 1
    strategy:
      type: Recreate

    # Tier 1 (docs/cluster-consolidation/20-low-power-tier.md): the forge must
    # not be shed, and must be placeable on a control plane once the workers are
    # powered down. It also runs in the `coder` namespace (see ./ks.yaml -- there
    # is no `forgejo` namespace, which is what an earlier version of this comment
    # claimed), and `coder` is in go-kube-downscaler's excludedNamespaces, so a
    # mistyped `kubectl annotate` cannot scale it to 0. The protection was always
    # real; only the namespace named here was wrong.
    priorityClassName: critical-tier
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # The failover/fast-node-eviction equivalent; that component only patches
      # `defaultPodOptions`, which this chart does not read.
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60

    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
      # First boot runs the full schema migration; the default 60s is enough for
      # shutdown but a long migration should not be interrupted by a rollout.
      terminationGracePeriodSeconds: 60
      env:
        # The estate's zone, as every other app has it (the timezone sweep):
        # Forgejo's own scheduled tasks (`[cron.*]` in app.ini) and its log
        # timestamps follow the process's local time. NOT what Actions
        # `schedule:` crons use -- those default to UTC whatever this says,
        # and take a per-entry `timezone:` in the workflow instead
        # (.forgejo/workflows/merge-window.yml).
        - name: TZ
          value: "${TIMEZONE}"

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi

    initContainers:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    # The PVC is owned by components/volsync (named `${APP}`), not by the chart:
    # that is what puts the volume on the Tier-1 storage class and what gives it
    # a nightly restic ReplicationSource. `create: false` keeps the chart from
    # provisioning its own `gitea-shared-storage` alongside it.
    persistence:
      enabled: true
      create: false
      mount: true
      claimName: *app

    # The commit-signing key pair (`[repository.signing]` below). Mounted into
    # the init containers as well as the main one, and that is not optional:
    # Forgejo reads SIGNING_KEY while it loads its settings and log.Fatal()s
    # when the file is missing, and configure-gitea runs `forgejo migrate` and
    # the admin commands, which load the same settings -- so an init-only gap
    # would crash-loop the pod before the main container ever started.
    #
    # The files land as root:1000 0440 (fsGroup below adds the group). That is
    # readable by the git user, and it is also why ssh-keygen accepts the key:
    # its "UNPROTECTED PRIVATE KEY FILE" refusal only applies to a key file the
    # CALLING user owns, and these are owned by root.
    #
    # Not the chart's own `signing.ssh.existingSecret`, which does the same job
    # with one less key: its configure-ssh-signing init container COPIES the
    # private key onto the data PVC (/data/git/.ssh-signing/), which puts it
    # into every nightly volsync restic snapshot and leaves it behind there if
    # signing is ever turned off. Mounted like this it only ever exists in the
    # pod's tmpfs and in OpenBao.
    extraVolumes:
      - name: signing-key
        secret:
          secretName: ${APP}-signing
          defaultMode: 0440
    extraContainerVolumeMounts: &signingMounts
      - name: signing-key
        mountPath: /etc/forgejo-signing
        readOnly: true
    extraInitVolumeMounts: *signingMounts

    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        # 22, matching the Gateway listener, the TCPRoute and the SSH_PORT in
        # the UI's clone URLs. This is the SERVICE port and is free to be
        # privileged; the container still binds 2222 (see SSH_LISTEN_PORT).
        # The chart emits `targetPort: ssh` -- the NAMED container port --
        # whenever SSH_LISTEN_PORT is set, which is what lets the two differ.
        port: 22

    httpRoute:
      enabled: true
      annotations:
        external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
      parentRefs:
        - name: internal
          namespace: network
          kind: Gateway
      hostnames:
        - "git.${ROOT_DOMAIN}"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # error-pages -> internal-network. Network-gated, not authentik-gated:
            # the runner, Flux and `git push` all authenticate to Forgejo itself,
            # and an authentik outage must not take the forge with it.
            name: local-user

    tcpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: network
          sectionName: gitssh
      port: 22

    ingress:
      enabled: false

    # The chart's helm-test Pod. Disabled because Flux never runs Helm tests, so
    # the only thing it contributes is a `busybox:latest` reference in the
    # rendered output for lint and Renovate to trip over.
    test:
      enabled: false

    gitea:
      admin:
        # Break-glass local admin, the same account docker/celestia/forgejo's
        # provision.sh reconciled. The email is deliberately not a real person's:
        # ACCOUNT_LINKING=auto links OIDC logins to local accounts BY EMAIL, and
        # this account must never be silently claimed by an SSO identity.
        existingSecret: ${APP}-admin
        email: forgejo-admin@${ROOT_DOMAIN}
        passwordMode: keepUpdated

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      # The client id and secret arrive through `existingSecret`; the rest of the
      # oauth entry (including autoDiscoverUrl) comes from the values Secret --
      # see `valuesFrom` above and resources/values.yaml.

      additionalConfigFromEnvs:
        # Everything secret in app.ini is injected here rather than written into
        # gitea.config, which the chart renders into a plain ConfigMap-like
        # Secret it also prints in `helm get values`.
        - name: FORGEJO__database__HOST
          valueFrom:
            secretKeyRef:
              name: ${APP}-db
              key: host
        - name: FORGEJO__database__NAME
          valueFrom:
            secretKeyRef:
              name: ${APP}-db
              key: database
        - name: FORGEJO__database__USER
          valueFrom:
            secretKeyRef:
              name: ${APP}-db
              key: username
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: ${APP}-db
              key: password
        # Encrypts secrets at rest in the database (2FA seeds, webhook secrets,
        # Actions secrets). Losing it after first boot orphans that data, which
        # is why it is a stored credential rather than something generated in
        # the container.
        - name: FORGEJO__security__SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ${APP}-secrets
              key: secret_key
        # Signs session and OAuth2 JWTs. Same argument as SECRET_KEY: if it is
        # regenerated every restart, every issued Actions token dies with the pod.
        - name: FORGEJO__oauth2__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ${APP}-secrets
              key: jwt_secret
        # S3 credentials for forgejo-garage, minted by the GarageKey operator.
        # Only these two are secret -- the rest of the [storage] block is plain
        # config below.
        - name: FORGEJO__storage__MINIO_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: forgejo-garage-forgejo-credentials
              key: access-key-id
        - name: FORGEJO__storage__MINIO_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: forgejo-garage-forgejo-credentials
              key: secret-access-key

      config:
        RUN_MODE: prod
        # APP_NAME: "${CLUSTER_TITLE} - Coding for ourselves"
        repository:
          # No DISABLE_HTTP_GIT. Everything in the cluster talks git to the
          # forge over HTTP (forgejo-http:3000): Renovate, the runners'
          # actions/checkout, github-sync's pushes, git-pages. With it set,
          # every one of them gets `Interacting with repositories by HTTP
          # protocol is not allowed` (403), as on 2026-10-18.
          ENABLE_PUSH_CREATE_USER: true
          ENABLE_PUSH_CREATE_ORG: true
          # Pinned to the upstream default so a chart or image bump cannot
          # quietly change what the clone box tells people to paste: true keeps
          # the `ssh://` form. It belongs here, not under `server:` with the
          # other SSH keys -- Forgejo reads it from the [repository] section.
          USE_COMPAT_SSH_URI: true

        repository.pull-request:
          DEFAULT_MERGE_STYLE: squash

        repository.issue:
          MAX_PINNED: "6"

        repository.release:
          DEFAULT_PAGING_NUM: "20"

        ui:
          DIFF_PAGING_NUM: "50"
          EXPLORE_PAGING_NUM: "50"
          ISSUE_PAGING_NUM: "50"
          MEMBERS_PAGING_NUM: "50"
          FEED_MAX_COMMIT_NUM: "10"
          FEED_PAGING_NUM: "50"
          SITEMAP_PAGING_NUM: "50"
          GRAPH_MAX_COMMIT_NUM: "200"
          DEFAULT_THEME: forgejo-auto

        server:
          DOMAIN: git.${ROOT_DOMAIN}
          ROOT_URL: https://git.${ROOT_DOMAIN}/
          HTTP_PORT: 3000
          # The rootless image has no sshd; this is Forgejo's built-in Go SSH
          # server. The two numbers deliberately DIFFER:
          #
          #   SSH_PORT        22   -- advertised in clone URLs, and the port
          #                           the Service and Gateway listener publish,
          #                           so a clone is plain
          #                           git@git.<root domain>:<owner>/<repo>.git
          #   SSH_LISTEN_PORT 2222 -- what the process actually binds INSIDE
          #                           the container. It cannot be 22: the
          #                           rootless image runs as uid 1000, and
          #                           unlike Traefik's pod this one is not
          #                           relying on the sandbox's unprivileged
          #                           port range. Keep it >= 1024.
          #
          # Setting SSH_LISTEN_PORT is also what makes the chart target the
          # named container port rather than the Service port -- without it the
          # Service would point at 22 inside the pod, where nothing listens.
          START_SSH_SERVER: true
          SSH_DOMAIN: git.${ROOT_DOMAIN}
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
          # What the clone box actually shows, and why each part of it:
          #
          #   ssh://git@git.<root domain>/<owner>/<repo>.git
          #
          # No port, because ComposeSSHCloneURL (models/repo/repo.go) only
          # writes one when SSH_PORT != 22. The `ssh://` form rather than the
          # scp-style `git@host:owner/repo.git` comes from USE_COMPAT_SSH_URI
          # in the [repository] section below.
          #
          # SSH_USER is pinned rather than inherited. Forgejo derives it
          # SSH_USER -> BUILTIN_SSH_SERVER_USER -> RUN_USER ->
          # user.CurrentUsername(), so with none of them set the clone URL is
          # whatever the image happens to call uid 1000. It is `git` today; if
          # upstream ever renamed it every clone URL would change and nothing
          # would fail loudly -- the URL would simply be wrong.
          SSH_USER: git
          # LFS objects live in Garage, not on this volume -- the `[storage]`
          # block below is the default for the `lfs` subsystem too, so they land
          # under `lfs/` in the bucket. Only the git repositories themselves are
          # on the PVC; Forgejo has no S3 backend for those.
          LFS_START_SERVER: true

        # Signs the commits Forgejo writes itself: web-editor and API file
        # edits, wiki edits, a new repository's first commit, and the commit a
        # pull-request merge COMPOSES -- the `merge`, `rebase-merge` and
        # `squash` styles. NOT the plain `rebase` style: Forgejo replays the
        # pull request's commits with git-replay/git-rebase and no `-S`, so
        # they land unsigned, and `fast-forward-only` writes no commit at all.
        # Those are the only two styles github-mirror/home-operations allows
        # (stacks/system/forgejo-github-mirror.ts), so on that repository this
        # signs web edits but not merges. The key is mounted from the
        # `-signing` Secret above; the runbook
        # (docs/runbooks/forgejo-commit-signing.md) has how it was made and
        # where its public half lives.
        #
        # SSH rather than OpenPGP because it is one file pair and nothing else:
        # no keyring to import into a GNUPGHOME on the PVC, no gpg-agent, no
        # trustdb. Git 2.34+ and ssh-keygen are both already in the image.
        #
        # Nothing has to be registered on any account for the UI to say
        # Verified. Forgejo checks a signature against the committer's own
        # keys first, then against THIS key, and an instance-key signature is
        # "trusted" under the `collaborator` trust model every repository has
        # by default (CalculateTrustStatus, models/asymkey). Do NOT add the
        # public key to a user as an SSH key: that makes it a login key for
        # that account over the git SSH server, so whoever holds this Secret
        # could push as them.
        repository.signing:
          FORMAT: ssh
          SIGNING_KEY: /etc/forgejo-signing/signing_key.pub
          # Shown as the signer on the commit page; never written into a
          # commit while the trust model is `collaborator` (the committer
          # stays the person who pressed the button). The `.invalid` address
          # for the same reason as NO_REPLY_ADDRESS below: a commit made here
          # is published to GitHub, and the sync refuses one that names the
          # domain.
          SIGNING_NAME: Forgejo
          SIGNING_EMAIL: forgejo@noreply.forgejo.invalid
          # `always` everywhere, and deliberately so. Each conditional rule
          # would quietly turn signing off for this forge:
          #   twofa         -- accounts sign in through authentik, which owns
          #                    MFA; Forgejo has no 2FA record for any of them.
          #   pubkey        -- Renovate and the bot accounts hold no keys.
          #   basesigned /  -- `main` arrives from GitHub, whose merge commits
          #   parentsigned     carry GitHub's web-flow signature, which this
          #                    forge cannot verify.
          #   commitssigned -- Renovate's and most agents' commits are unsigned.
          #   approved      -- one human; nobody can approve their own PR.
          # A signature from this key therefore means "Forgejo wrote this
          # commit", not "the content was vetted" -- which is all an instance
          # key can honestly say anyway.
          INITIAL_COMMIT: always
          CRUD_ACTIONS: always
          WIKI: always
          MERGES: always

        database:
          DB_TYPE: postgres
          # HOST / NAME / USER / PASSWD come from additionalConfigFromEnvs above.

        security:
          # No web installer; this instance is configured entirely from here.
          INSTALL_LOCK: true

        # Every object store on S3, in one block.
        #
        # `[storage]` is the DEFAULT for all eight subsystems -- attachments,
        # LFS, avatars, repo avatars, repo archives, packages, Actions logs and
        # Actions artifacts -- each of which gets its own prefix inside the
        # bucket automatically (`lfs/`, `packages/`, ...). Setting it here rather
        # than per-section means there is one place to look and no subsystem can
        # be quietly left behind on local disk.
        #
        # What this does NOT move: bare git repositories. Forgejo always keeps
        # those on disk under APP_DATA_PATH, so the volsync-backed PVC is still
        # load-bearing and still the thing a restore rebuilds the forge from.
        storage:
          STORAGE_TYPE: minio
          # In-cluster Service, same namespace. Not s3.git.${ROOT_DOMAIN} --
          # that hostname exists for backrest on celestia, and routing every LFS
          # object through Traefik and back would be a hairpin for nothing.
          MINIO_ENDPOINT: forgejo-garage.${NAMESPACE}.svc.cluster.local:3900
          MINIO_BUCKET: forgejo
          # Must equal the GarageCluster's `s3Api.region`. It is not geographic,
          # but it is baked into every SigV4 signature -- a mismatch is a
          # SignatureDoesNotMatch on every request, not a routing error.
          MINIO_LOCATION: equestria
          # Plain HTTP to a ClusterIP inside the same namespace. TLS here would
          # mean minting a cert for a Service name to protect a hop that never
          # leaves the pod network.
          MINIO_USE_SSL: false
          # `path`, not the `auto` default. Garage is only addressable
          # path-style here -- virtual-hosted style needs `s3Api.rootDomain`
          # plus a wildcard DNS name and cert, which this cluster does not have.
          # On `auto` the client may probe DNS style first and fail confusingly.
          MINIO_BUCKET_LOOKUP: path
          # MINIO_ACCESS_KEY_ID / MINIO_SECRET_ACCESS_KEY come from
          # additionalConfigFromEnvs above.
          #
          # Deliberately no MINIO_BASE_PATH: Forgejo rejects it in the
          # `[storage]` section, because that is what each subsystem's own
          # prefix already is.

        webhook:
          # Renovate support. The renovate-operator's webhook receiver is a
          # ClusterIP two DNS labels away
          # (kubernetes/apps/coder/renovate-operator), and Forgejo would refuse
          # to deliver to it: ALLOWED_HOST_LIST defaults to `external`, which
          # means "valid non-private unicast IPs only" and drops every RFC1918
          # destination before the request leaves the pod. The rejection is
          # logged on the Forgejo side and shows up in the repository's webhook
          # delivery history -- the operator sees nothing at all, which makes
          # this a slow thing to diagnose from the other end.
          #
          # The exact hostname rather than the `private` group. `private` would
          # re-open webhook delivery to EVERY RFC1918 address, which turns any
          # repository's webhook settings into an SSRF primitive against the
          # rest of the estate. Forgejo matches this list against the host name
          # as well as the resolved IP, so naming the Service is enough.
          #
          # Change this and the operator's `webhook.baseUrl` together: they are
          # two spellings of the same destination.
          ALLOWED_HOST_LIST: renovate-operator.${NAMESPACE}.svc.cluster.local

        service:
          # This exact pair is the documented combination for "accounts come only
          # from the IdP": registration stays technically enabled, but only the
          # external (OAuth2) path may exercise it. DISABLE_REGISTRATION=true
          # would block OIDC auto-registration too.
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          # Private instance: nothing is browsable anonymously. The runner and
          # any automation authenticate with tokens, so this costs nothing.
          REQUIRE_SIGNIN_VIEW: true
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          # The domain of the address Forgejo writes into a commit it makes for
          # an account whose email is private -- which, with the line above, is
          # every account: `<login>@<this>`. That is the COMMITTER on each
          # commit of a rebased or merged pull request.
          #
          # The default is `noreply.<DOMAIN>`, so every such commit carried the
          # forge's hostname. That was invisible while nothing left the forge.
          # It is not now: the github-mirror repository pushes its main to the
          # estate's public GitHub repository, and the sync there refuses any
          # commit that names the domain
          # (docs/runbooks/forgejo-github-mirror.md) -- with the default, every
          # pull request merged on the forge would be one.
          #
          # `.invalid` is reserved (RFC 2606): it can never resolve, so nothing
          # is ever mailed to it and nobody else can own it. Forgejo maps the
          # address back to the account by this suffix, which is why the
          # committer the sync and the pull request check set for themselves
          # (.forgejo/workflows/) is spelled with it. Change it there too or
          # attribution on the forge quietly stops.
          #
          # So a Renovate commit that Forgejo rebased reaches GitHub authored
          # by renovate[bot] (`gitAuthor` in ../renovate/renovatejob.yaml) and
          # committed by `renovate@` this.
          #
          # Commits made through the web UI before this changed keep the old
          # address and lose their link to an account. Cosmetic.
          NO_REPLY_ADDRESS: noreply.forgejo.invalid

        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          ACCOUNT_LINKING: auto

        session:
          # `db`, not the chart's `memory` default: sessions must survive the
          # pod restart that a `Recreate` rollout guarantees.
          PROVIDER: db

        actions:
          ENABLED: true
          # Where `uses: actions/checkout@v4` resolves from when a workflow does
          # not fully qualify the action. `github` keeps GitHub-authored
          # workflows working unmodified; the alternative is a self-hosted
          # mirror, which is a separate piece of work.
          DEFAULT_ACTIONS_URL: github

        metrics:
          ENABLED: true

        time:
          # The zone dates are shown in on the web UI, for every viewer.
          # Forgejo's default is the server's, which in a container without
          # TZ was UTC.
          DEFAULT_UI_LOCATION: "${TIMEZONE}"

        cron.update_checker:
          # Nothing here should be phoning home for release announcements; the
          # image tag is Renovate's job.
          ENABLED: false
