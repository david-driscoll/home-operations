---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ${APP}-rules
spec:
  groups:
    - name: forgejo.rules
      rules:
        - alert: ForgejoAbsent
          annotations:
            description: >-
              Forgejo has disappeared from Prometheus target discovery. The git
              forge, its SSH endpoint and every Actions workflow are down with it.
            summary: Forgejo is down.
          expr: |
            absent(up{job=~".*forgejo.*"} == 1)
          for: 15m
          labels:
            severity: critical

        # `gitea_*` is not a typo: Forgejo still exports the Gitea metric
        # namespace (modules/metrics/collector.go, `namespace = "gitea_"`).
        # There is deliberately no alert on runner count here -- the collector
        # exports no runner metric at all, so that rule could never fire. The
        # runners are short-lived pods started by KEDA now; what watches them is
        # the KEDA alerts in kubernetes/apps/kube-system/keda.
        #
        # There is deliberately no webhook-backlog alert either. The obvious
        # metric, `gitea_hooktasks`, counts EVERY row of the hook_task table,
        # delivered or not -- it is delivery history, which Forgejo keeps for a
        # week. A `> 1000` rule on it fired permanently on 2026-10-14 with 2,752
        # rows, all `is_delivered = true`. Forgejo exports nothing for the
        # undelivered count; the honest check is
        #   select count(*) from hook_task where not is_delivered;
        # against the forgejo database.
