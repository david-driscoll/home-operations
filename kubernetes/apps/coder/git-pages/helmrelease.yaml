---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app git-pages
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        # Two, because there is no local state: every site lives in the
        # forgejo-garage bucket and each replica caches independently.
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              # The image also bundles Caddy and supervisord for a standalone
              # deployment; only the git-pages binary is used here.
              repository: codeberg.org/git-pages/git-pages
              tag: 0.9.1@sha256:bbcdd603ef3d3dc66aa254479b255674e51286921c02e9f6569dc188f8756594
            command: ["git-pages"]
            args: ["-config", "/config/config.toml"]
            env:
              TZ: "${TIMEZONE}"
              PAGES_STORAGE_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-garage-git-pages-credentials
                    key: access-key-id
              PAGES_STORAGE_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-garage-git-pages-credentials
                    key: secret-access-key
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            probes:
              # No global health endpoint upstream -- /.git-pages/health is per
              # site and 404s for a host with nothing published -- so a bound
              # listener is the best available signal.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
              startup:
                enabled: false

    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
          metrics:
            port: 3002

    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    persistence:
      config:
        type: configMap
        name: ${APP}-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      # Every team's sites. `local-api`, not `local-user`: the same
      # internal-network guard minus error-pages, which would swap a site's own
      # 404.html (and git-pages' "site not found") for the generic page.
      pages:
        annotations:
          external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        kind: HTTPRoute
        hostnames:
          - "*.pages.${ROOT_DOMAIN}"
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-api
      # docs.${ROOT_DOMAIN} -> the docs team's site. A redirect rather than a
      # second hostname on the route above: git-pages keys sites by Host, so
      # serving it directly would need the site published twice. Path is kept.
      docs:
        annotations:
          external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        kind: HTTPRoute
        hostnames:
          - "docs.${ROOT_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: "docs.pages.${ROOT_DOMAIN}"
                  # 302, not 301: browsers cache a 301 indefinitely.
                  statusCode: 302
