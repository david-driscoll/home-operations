---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Rendered into the `database` namespace by the `prowlarr-postgres-databases`
# Kustomization that components/postgres/databases emits -- see that component's
# ks.yaml for the wiring.
#
# ⚠️ DELIBERATELY NOT listed in ../kustomization.yaml. This directory sits inside
# the app's build path, so adding it there would render the `Database` a SECOND
# time into the `equestria` namespace, where it is meaningless (CNPG resolves
# `spec.cluster.name` locally) and would fight the real one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./prowlarr-log.yaml
