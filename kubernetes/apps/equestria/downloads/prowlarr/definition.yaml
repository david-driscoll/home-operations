---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Prowlarr
  category: Media Management
  description: Prowlarr is an indexer manager
  url: &url https://${APP}.${ROOT_DOMAIN}
  # The same app under its tailnet name. authentik's ProxyProvider.external_host
  # holds ONE hostname, so without this the outpost has no application for
  # ${APP}.${TAILSCALE_DOMAIN} and answers 400 "no app for hostname" -- which is
  # what the Dockge hosts' authentik-gated tailnet routes did until now. Paired
  # with TAILSCALE_MIDDLEWARE: tailscale-user in ks.yaml; the two go together.
  tailnetUrl: https://${TAILSCALE_HOST:=${APP}}.${TAILSCALE_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/prowlarr.svg
  access_policy:
    groups:
      - media-managers
  authentik:
    proxy:
      mode: forward_single
      externalHost: *url
      skipPathRegex: "^/api([/?].*)?$"
  gatus:
    - group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/ping
      method: GET
      conditions:
        - "[STATUS] == 200"
