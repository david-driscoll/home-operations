---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: MusicGrabber
  category: Media Management
  description: Search YouTube, SoundCloud, Monochrome and more, and grab single tracks straight into the music library
  url: &url https://${APP}.${ROOT_DOMAIN}
  # authentik's ProxyProvider holds ONE external host; this gives the outpost
  # an application for the tailnet name too. Pairs with
  # TAILSCALE_MIDDLEWARE: tailscale-user in ks.yaml -- see media/lidarr.
  tailnetUrl: https://${TAILSCALE_HOST:=${APP}}.${TAILSCALE_DOMAIN}
  # Not in homarr-labs/dashboard-icons; upstream's own icon.
  icon: https://gitlab.com/g33kphr33k/musicgrabber/-/raw/main/static/favicon.png
  access_policy:
    groups:
      - media-managers
  authentik:
    # Proxy, not oauth2: MusicGrabber has no OIDC, only local users and an
    # optional API key.
    proxy:
      mode: "forward_single"
      externalHost: *url
  gatus:
    - group: "Applications"
      url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      # This service is scaled to 0 overnight, so a failed check in that window
      # is expected rather than an incident.
      maintenance-windows:
        - start: "02:00"
          duration: 7h
          timezone: ${TIMEZONE}
