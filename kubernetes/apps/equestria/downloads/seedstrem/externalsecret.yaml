---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# seedstrem's two secrets, as the SEEDSTREM_* environment variables it reads.
#
# NOT here: qBittorrent credentials. qBittorrent skips WebUI auth for the pod
# and service networks (QBT_Preferences__WebUI__AuthSubnetWhitelist in
# ../qbittorrent/helmrelease.yaml), exactly as arr-mcp relies on.
#
# seedstrem writes its effective config -- these two values included -- back
# into /config/config.yaml whenever settings are saved in its UI. That file is
# on the app's own Longhorn volume and in its (encrypted) restic backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshInterval: 1h
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Web UI login. Created by hand -- see docs/runbooks/seedstrem-gelato.md.
    - secretKey: SEEDSTREM_SERVER_ADMIN_PASSWORD
      remoteRef:
        key: clusters/equestria/apps/seedstrem/admin-password
        property: password
    # The same per-app path ../../shared/secrets/media-management.yaml reads.
    - secretKey: SEEDSTREM_PROWLARR_API_KEY
      remoteRef:
        key: clusters/equestria/apps/prowlarr/api-key
        property: apikey
    # The same per-app path ../../shared/secrets/media-management.yaml reads.
    - secretKey: SEEDSTREM_META_TMDB_API_KEY
      remoteRef:
        key: third-party-tokens/tmdb/api-key
        property: password
