---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app autobrr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/equestria/downloads/autobrr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/tailscale
    - ../../../../components/volsync
    - ../../../../components/failover/fast-node-eviction
    # Enabled 2026-08-26. autobrr has had first-class Postgres since v0.20.0;
    # this line and the block in externalsecret.yaml were imported commented-out
    # in 91760f82 and never turned on. `dependsOn: postgres` was already here.
    #
    # ⚠️ autobrr has NO database or role in this cluster, so this is the
    # BRAND-NEW-APP case: `stacks/system` will create the OpenBao static role
    # before CNPG has applied the DatabaseRole and stall on
    # `role "autobrr" does not exist`. Expected; recovery is in
    # components/postgres/ks.yaml and in the runbook.
    - ../../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
