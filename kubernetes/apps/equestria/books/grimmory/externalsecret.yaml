---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Both MariaDB passwords are minted in-cluster: the database is private to this
# pod (bound to 127.0.0.1, see ./helmrelease.yaml) and has no other consumer, so
# nothing is seeded in OpenBao by hand. Each `sourceRef` below that names this
# generator gets its OWN value. No symbols: the values are spliced into SQL
# string literals by the `mariadb-passwords` init container and into a JDBC
# connection, and 32 alphanumerics is plenty for a loopback-only database.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-mariadb-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. A Password generator mints a
# NEW value on every call, so `Periodic` would hand MariaDB and Grimmory fresh
# passwords on a schedule.
#
# THIS SECRET IS AUTHORITATIVE, NOT THE DATABASE. The official image only reads
# MARIADB_PASSWORD / MARIADB_ROOT_PASSWORD when it initialises an EMPTY datadir;
# after that the hashes live in mysql.global_priv on the volsync PVC. So a
# re-minted Secret (this ExternalSecret pruned and recreated, a namespace or
# cluster rebuild) next to a kept or RESTORED datadir would otherwise lock
# Grimmory out of its own database, with no root password to fix it either.
# The `mariadb-passwords` init container closes that: on every pod start it
# ALTERs both accounts to whatever this Secret holds, authenticating with the
# image's healthcheck credential, which lives IN the datadir and so is restored
# with it. Deleting this Secret is therefore a safe way to rotate both: ESO
# re-mints, Reloader restarts the pod, the init container applies them.
#
# `deletionPolicy: Retain` keeps the Secret if the provider call ever fails. It
# does not survive this ExternalSecret being pruned (`creationPolicy: Owner`),
# which per the above now costs nothing but a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-mariadb
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-mariadb
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # root@localhost. Nothing uses it at runtime; it is the break-glass
        # login for a human:
        #   kubectl -n equestria exec -it deploy/grimmory -c mariadb -- \
        #     sh -c 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD"'
        # (the entrypoint unsets the variable for mariadbd, but `exec` gets a
        # fresh environment from the pod spec).
        MARIADB_ROOT_PASSWORD: "{{ .root }}"
        # 'grimmory'@'%', owner of the `grimmory` schema. Read by the mariadb
        # sidecar on first init and by Grimmory as DATABASE_PASSWORD.
        MARIADB_PASSWORD: "{{ .app }}"
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-mariadb-password
      rewrite: [{regexp: {source: "^password$", target: "root"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "app"}}]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The authentik credential -- NOT mounted by the pod. Grimmory keeps its OIDC
# settings in its database and offers no environment variables for them, so
# this exists only to put the three values one `kubectl` away for the one-time
# UI setup:
#
#   kubectl -n equestria get secret grimmory-oidc -o go-template='{{range $k, $v := .data}}{{$k}}={{$v | base64decode}}{{"\n"}}{{end}}'
#
# Settings -> Authentication, OIDC:
#   Provider Name   whatever the login button should say
#   Client ID       OIDC_CLIENT_ID
#   Client Secret   OIDC_CLIENT_SECRET
#   Issuer URI      OIDC_ISSUER -- authentik's per-provider issuer, WITH its
#                   trailing slash; Grimmory appends
#                   .well-known/openid-configuration and validates `iss`
#                   against it, and upstream's guide calls out a missing slash
#                   as the cause of "Invalid Client".
#   Scopes          leave the default `openid profile email groups offline_access`
#   Claims          leave the defaults: preferred_username / email / name / groups
#   Group Sync      On Login (Replace), with one mapping per authentik group
#                   (admins -> Admin; media-managers, family, friends -> the
#                   permissions and libraries each should have). Group names
#                   are case-sensitive.
#
# `${APP}-oidc-credentials` does not exist until `stacks/system` has read
# ./definition.yaml, i.e. after this app's first Flux apply. Until then this
# fails to sync; nothing waits on it. Nudge it once Pulumi has run:
#
#   kubectl -n equestria annotate externalsecret grimmory-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_ISSUER: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
