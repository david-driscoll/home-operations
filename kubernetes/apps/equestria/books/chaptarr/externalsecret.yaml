---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Chaptarr's PostgreSQL connection, in the shape Chaptarr reads it. Same
# contract as media/sonarr/externalsecret.yaml: the values come from
# `${APP}-postgres` (the Secret components/postgres renders, password owned and
# rotated by OpenBao) through ClusterSecretStore/database.
#
# THE PREFIX IS `CHAPTARR__`, not `READARR__`. Chaptarr binds
# `config.GetSection("Chaptarr:Postgres")` (src/NzbDrone.Core/Datastore/
# PostgresOptions.cs, NzbDrone.Host/Bootstrap.cs) and only falls back to the
# `Readarr:` / `Audioarr:` sections when the host is empty. The README spells
# the variables `Chaptarr__Postgres__Host`; .NET configuration keys are
# case-insensitive, so the upper-case spelling the other *arr apps use here
# binds identically.
#
# THREE DATABASES, not two. Chaptarr adds a `CacheDb` (an HTTP-response cache,
# the `HttpResponse` table) to the Servarr main/log pair, opens all three at
# startup and creates none of them. `${APP}` comes from components/postgres;
# `${APP}-log` and `${APP}-cache` from ./postgres-databases/. All three share
# this ONE credential -- ConnectionStringFactory varies only the database name.
#
# Setting CHAPTARR__POSTGRES__HOST is the on switch: with it empty Chaptarr
# uses SQLite files in /config instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A
  # rotated password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is mounting.
    deletionPolicy: Retain
    template:
      data:
        CHAPTARR__POSTGRES__HOST: "{{ .postgres_hostname }}"
        CHAPTARR__POSTGRES__PORT: "{{ .postgres_port }}"
        CHAPTARR__POSTGRES__USER: "{{ .postgres_username }}"
        CHAPTARR__POSTGRES__PASSWORD: "{{ .postgres_password }}"
        # `chaptarr`, not the README's default `chaptarr-main`:
        # components/postgres names the database after the app.
        CHAPTARR__POSTGRES__MAINDB: "{{ .postgres_database }}"
        # Literals, not Secret keys: the credential Secret describes ONE
        # database. Must match `spec.name` in ./postgres-databases/.
        CHAPTARR__POSTGRES__LOGDB: "${APP}-log"
        CHAPTARR__POSTGRES__CACHEDB: "${APP}-cache"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        # Normalise the hyphenated keys into legal Go template identifiers,
        # then prefix them -- same two steps as media/sonarr.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Chaptarr's API key, minted in-cluster. Nothing outside the cluster needs to
# know it in advance: Prowlarr and other clients are given it by hand from
# Settings > General, so a generator replaces the human-seeded
# `clusters/equestria/apps/<app>/api-key` OpenBao path the older *arr apps use.
#
# 32 lowercase alphanumerics, the same length and alphabet as the
# `Guid.ToString("N")` key Chaptarr would generate itself (ApiKeyValidationCheck
# warns below 20 characters).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-apikey
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: true
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. A Password generator mints a
# NEW value on every call, so `Periodic` would silently rotate the API key and
# break every client holding the old one (Prowlarr, dashboards, scripts).
#
# `creationPolicy: Owner` means deleting THIS object (a rename, a prune)
# garbage-collects the Secret and the next reconcile mints a different key --
# re-paste it into Prowlarr if that ever happens. Kept under a neutral key name,
# `apikey`, so another workload in the namespace can secretKeyRef it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-apikey
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-apikey
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        apikey: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-apikey
