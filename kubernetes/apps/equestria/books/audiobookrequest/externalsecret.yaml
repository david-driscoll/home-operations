---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# THREE Secrets, split for the reason ../../home/dawarich/externalsecret.yaml
# gives: every reference in an ExternalSecret must resolve or the whole object
# fails, taking its Secret along.
#
#   ${APP}-env    The Postgres credential, from components/postgres. Rotates
#                 every 30 days; Reloader restarts the Deployment and ABR
#                 re-reads it at boot. Mounted.
#   ${APP}-root   The break-glass root admin's initial password, minted
#                 in-cluster. Never rotates. Mounted.
#   ${APP}-oidc   The authentik client, for pasting into the UI. NOT mounted.
#
# Nothing here is seeded in OpenBao by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Discrete fields, not a URI: ABR reads only these five and assembles
        # `postgresql://user:password@host:port/db?sslmode=...` itself
        # (app/util/db.py), without URL-escaping the password. That is safe
        # because OpenBao's default database password policy is alphanumeric
        # plus `-` -- the same assumption the `uri` keys of
        # pgsql-user-template already make for every other app.
        #
        # ABR_DB__USE_POSTGRES and ABR_DB__POSTGRES_SSL_MODE are plain env in
        # ./helmrelease.yaml, on purpose: see the note there.
        ABR_DB__POSTGRES_HOST: "{{ .postgres_hostname }}"
        ABR_DB__POSTGRES_PORT: "{{ .postgres_port }}"
        ABR_DB__POSTGRES_DB: "{{ .postgres_database }}"
        ABR_DB__POSTGRES_USER: "{{ .postgres_username }}"
        ABR_DB__POSTGRES_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Alphanumeric only: it is typed by a human into ABR's backup login form, and
# ABR .strip()s it (app/routers/pages/init.py), so it must not start or end
# with anything that could be whitespace-adjacent in a paste.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-root-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The root admin, created from env so the /init page is NEVER served.
#
# ABR has no users on first boot, and until it has one its middleware sends
# every GET to /init (app/main.py, redirect_to_init) -- a page that lets
# whoever loads it first pick the root admin's name and password. With
# ABR_APP__INIT_ROOT_USERNAME/PASSWORD set, a GET of /init creates the root
# admin from them instead and never renders the form (init.py). The first
# startup probe does exactly that: /api/health is redirected to /init, the
# kubelet follows the same-host redirect, and the account exists before
# anything outside the pod has connected.
#
# These credentials are also the ONLY way in that bypasses OIDC:
# https://audiobookrequest.<root domain>/login?backup=1 accepts the root admin
# and nobody else (auth/login.py, "Not root admin"). That is how the OIDC
# settings get entered in the first place, and the recovery path if authentik
# is ever down or misconfigured. Read it with:
#
#   kubectl -n equestria get secret audiobookrequest-root \
#     -o jsonpath='{.data.ABR_APP__INIT_ROOT_PASSWORD}' | base64 -d
#
# `refreshPolicy: CreatedOnce` IS LOAD-BEARING. The generator mints a new value
# per call; ABR only reads this on the very first boot and stores an argon2
# hash in Postgres, so a rotation would make this Secret silently disagree
# with the real password. For the same reason it is only the INITIAL password:
# if the root password is ever changed in Settings -> Account, this Secret is
# stale, and if the Secret is ever lost the password still lives (hashed) in
# the nightly pg_dump.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-root
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-root
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ABR_APP__INIT_ROOT_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-root-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# NOT mounted into the pod. ABR keeps its OIDC settings in its own database
# (app/internal/auth/oidc_config.py, a StringConfigCache over the `config`
# table) and has no environment override for any of them, so this Secret
# exists only to put the authentik client one command away when filling in
# the UI:
#
#   kubectl -n equestria get secret audiobookrequest-oidc -o go-template='{{range $k, $v := .data}}{{$k}}={{$v | base64decode}}{{"\n"}}{{end}}'
#
# Log in at /login?backup=1 as the root admin (${APP}-root above), then
# Settings -> Security. Login Type is already locked to OpenID Connect by
# ABR_APP__FORCE_LOGIN_TYPE:
#   OIDC Configuration Endpoint  OIDC_CONFIGURATION_URL (the discovery
#                                document; ABR reads the authorize, token,
#                                userinfo and end-session URLs from it)
#   Client ID / Client Secret    OIDC_CLIENT_ID / OIDC_CLIENT_SECRET
#   OIDC Scopes                  openid email profile abr_groups
#   OIDC Username Claim          email -- NOT preferred_username. Any OIDC
#                                login whose username equals the root admin's
#                                becomes root (docs: "Any user logging in with
#                                the username of the root admin account will
#                                be root admin"), and usernames reach authentik
#                                from Plex and Tailscale enrollment, i.e. are
#                                chosen by the user. An email always contains
#                                `@`, the root name `abr-root` never does, so
#                                that collision cannot happen.
#   OIDC Group Claim             abr_groups -- see ./definition.yaml
#   OIDC Redirect Scheme         https
#   OIDC Logout URL              leave empty; filled from the discovery
#                                document's end_session_endpoint
# ABR validates on save that every scope and both claims are advertised by the
# provider (oidc_config.py, validate), so a typo is refused rather than stored.
# Test with "log out", not by reloading: the current session survives a save.
#
# The rest of the setup is not OIDC but lives in the same database, so it is
# UI-only too:
#   Settings -> Prowlarr        http://prowlarr.equestria.svc.cluster.local:9696
#                               API key: kubectl -n equestria get secret
#                               spike-management-credentials -o
#                               jsonpath='{.data.prowlarr_apikey}' | base64 -d
#   Settings -> Audiobookshelf  http://audiobookshelf.equestria.svc.cluster.local:13378
#                               plus an API token minted in Audiobookshelf's
#                               own UI (Settings -> API Keys) for an account
#                               that can see the audiobook library.
#
# `${APP}-oidc-credentials` does not exist until `stacks/system` has read
# ./definition.yaml, i.e. after this app's first Flux apply. Until then this
# fails to sync; nothing waits on it. Nudge it once Pulumi has run:
#
#   kubectl -n equestria annotate externalsecret audiobookrequest-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CONFIGURATION_URL: "{{ .oidc_openid_configuration_url }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
