---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ONE Secret: the authentik client, as Spring Boot's own OAuth2 client
# properties. It does NOT exist until `stacks/system` has read
# ./definition.yaml, which is after this app's first Flux apply, so
# ./helmrelease.yaml mounts it `optional: true`.
#
# Nothing here is seeded by hand, and there is no Password generator: Komga's
# only app-owned secret, the remember-me signing key, is minted by its own
# Flyway migration (`hex(randomblob(32))` into SERVER_SETTINGS) and lives in
# database.sqlite, which VolSync backs up with the rest of /config.
#
# EVERY OAuth2 property is in here, not just the credentials, and that is the
# point. Spring Boot validates a registration as a whole at startup
# ("Client id of registration 'authentik' must not be empty."), so a
# half-configured registration -- scope and grant type in plain env, client
# id still missing -- would crash-loop Komga until `stacks/system` ran. With
# all of it here, an absent Secret means no registration at all: Komga boots
# with local accounts only (no ClientRegistrationRepository, so
# SecurityConfiguration.kt skips oauth2Login), which is still a login wall, not
# an open instance.
#
# Names follow Spring Boot's environment-variable rule (dots to underscores,
# dashes dropped, upper-cased) for
# spring.security.oauth2.client.{registration,provider}.authentik.*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # --- registration.authentik --------------------------------------
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_PROVIDER: authentik
        # The button reads "Sign in with <this>".
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_CLIENTNAME: "${CLUSTER_TITLE}"
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_CLIENTID: "{{ .oidc_client_id }}"
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_CLIENTSECRET: "{{ .oidc_client_secret }}"
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_AUTHORIZATIONGRANTTYPE: authorization_code
        # Spring Security's own template, expanded per request -- which is why
        # ./definition.yaml registers one callback per hostname. Required: a
        # registration that is not one of Spring's built-in providers gets no
        # default. Single braces are literal to both Flux and the ESO template.
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_REDIRECTURI: "{baseUrl}/{action}/oauth2/code/{registrationId}"
        # `groups` for the email_verified assertion; see ./definition.yaml.
        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHENTIK_SCOPE: openid,email,profile,groups
        # --- provider.authentik ------------------------------------------
        # The four endpoints, NOT issuer-uri, deliberately. issuer-uri makes
        # Spring Boot fetch the discovery document while building the
        # registration at startup (ClientRegistrations.fromIssuerLocation), so
        # Komga would refuse to boot whenever authentik is unreachable -- and
        # take OPDS, Kobo and KOReader sync down with it, none of which use
        # authentik at all. Explicit endpoints need nothing from authentik
        # until someone actually clicks the SSO button.
        #
        # The trade is that Spring has no issuer to compare the ID token's
        # `iss` against (OidcIdTokenValidator skips the check when the
        # provider has no issuer-uri). The signature is still verified against
        # this application's own signing key via jwks_url, which authentik
        # mints per provider (components/authentik/application-certificate.ts),
        # so a token from anywhere else fails anyway. That key is RSA, i.e.
        # RS256 -- the only algorithm Komga's docs say it accepts.
        SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_AUTHORIZATIONURI: "{{ .oidc_authorization_url }}"
        SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_TOKENURI: "{{ .oidc_token_url }}"
        SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_USERINFOURI: "{{ .oidc_userinfo_url }}"
        SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_JWKSETURI: "{{ .oidc_jwks_url }}"
        # Only the principal's name. Komga matches the login to a Komga user
        # by the `email` claim, never by this.
        SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_AUTHENTIK_USERNAMEATTRIBUTE: sub
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
