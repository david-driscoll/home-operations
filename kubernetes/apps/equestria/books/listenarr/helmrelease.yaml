---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app listenarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        # One SQLite file on an RWO volume: never two pods at once.
        strategy: Recreate
        containers:
          app:
            image:
              # Upstream publishes ONLY canary builds. Every GitHub release is a
              # prerelease (`vX.Y.Z-canary`), the GHCR tags are `canary` and
              # `canary-X.Y.Z`, and there is no `latest` or bare-version tag on
              # GHCR or Docker Hub (therobbiedavis/listenarr). The install docs
              # say as much: pin `canary-X.Y.Z`, do not assume a stable exists.
              # So this is the newest versioned canary, pinned by digest, rather
              # than the floating `canary`. GHCR and Docker Hub carry DIFFERENT
              # digests for the same tag (separate pushes) -- this one is GHCR's.
              #
              # Renovate's default docker versioning cannot parse a `canary-`
              # prefix: without a regex-versioning packageRule for this package
              # in .github/renovate.json5 it will only ever re-pin the digest.
              repository: ghcr.io/listenarrs/listenarr
              tag: canary-1.3.18@sha256:3618100bdf951b13d60fefb31246c604f1afa3cbe3dcecf18c29fb02c2625527
              pullPolicy: IfNotPresent
            env:
              # docker-entrypoint.sh only acts on PUID/PGID when started as
              # root (groupmod/usermod, chown /app/config, then gosu). Started
              # as 568 below it skips straight to `exec dotnet
              # Listenarr.Api.dll`. Kept for parity with the other *arr apps.
              PUID: ${PUID}
              PGID: ${PGID}
              # The entrypoint DOES apply this on the non-root path (`umask`
              # runs before the uid check). 002 so imported books stay
              # group-writable for the other apps sharing the media tree.
              # Quoted: unquoted it is the integer 2 by the time it arrives.
              UMASK: "002"
              TZ: ${TIMEZONE}
              # Overrides Serilog's level from config/appsettings/appsettings.json.
              LISTENARR_LOG_LEVEL: Information
              # NOT the public URL, despite the name and the upstream compose
              # example. DiscordBotService.GetListenarrUrl() hands this value
              # to the in-pod Discord bot as LISTENARR_URL, and the bot uses it
              # only as the base of its own API/SignalR calls back into
              # Listenarr. The public hostname would send those through
              # authentik forward auth, which a headless bot cannot pass --
              # loopback reaches the same process with no proxy in between.
              LISTENARR_PUBLIC_URL: http://127.0.0.1:4545
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # [AllowAnonymous]. 200 when the SQLite database opens and
                    # no EF Core migration is pending; 503 otherwise. Never
                    # calls out to indexers or download clients
                    # (BACKEND_ARCHITECTURE.md, "/system/ready").
                    path: /api/v1/system/ready
                    port: &port 4545
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              # Startup applies every EF migration (and its legacy-data repair
              # passes) before Kestrel listens; an upgrade across many canaries
              # can take a while on a large library. 30 x 10s = five minutes
              # before liveness takes over. (The ffprobe download from GitHub
              # into /app/config/ffmpeg is a background service and does not
              # hold up readiness.)
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/system/ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [0, 1, 44, 109, 303, 568, 10000]
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      # Docker's content root is /app, so EVERYTHING Listenarr writes lands
      # under /app/config (ApplicationPathService; listenarr.api/CONFIG.md):
      # database/, config.json, dataprotection-keys/, cache/images/, ffmpeg/,
      # logs/, temp/downloads/. One volsync PVC covers all of it.
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /app/config
      # SAME container paths as qbittorrent and sabnzbd (whole share at
      # /media, completing into /media/downloads/completed) and as chaptarr,
      # readmeabook and audiobookshelf -- so no remote path mappings, and the
      # root folder is the shared /media/audiobooks.
      #
      # No /media/ebooks: Listenarr manages audiobooks only.
      #
      # Hardlinks will NOT work across these two mounts: each subPath is its
      # own bind mount, and link(2) refuses to cross mounts (EXDEV) even on one
      # NFS export. Completed File Action "Hardlink/Copy" therefore copies --
      # which is what keeps torrents seeding; "Move" moves.
      media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media/downloads
            subPath: downloads
          - path: /media/audiobooks
            subPath: audiobooks

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        # One catch-all on authentik. No API-key carve-out rule -- see the
        # components note in ./ks.yaml for why it would be unsafe here.
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user
