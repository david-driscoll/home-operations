---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# No externalsecret.yaml: ebook2audiobook has no database, no OIDC client and
# no API keys -- authentik forward auth in front is its only login.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./helmrelease.yaml
  - ./definition.yaml
configMapGenerator:
  # The `publish` sidecar's loop: copies finished books to
  # /media/ai-audiobooks. The name is LITERAL, not `${APP}-publish`: the
  # `substitute: disabled` annotation below switches Flux substitution off for
  # the whole object, metadata.name included. ./helmrelease.yaml's
  # `${APP}-publish` IS substituted and resolves to this same name.
  - name: ebook2audiobook-publish
    files:
      - resources/publish-audiobooks.sh
    options:
      disableNameSuffixHash: true
      annotations:
        # Shell, full of `$var`. Flux would rewrite any `${...}` in it.
        kustomize.toolkit.fluxcd.io/substitute: disabled
