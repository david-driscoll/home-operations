---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# TWO Secrets, split so the rotating one and the never-rotating one cannot
# take each other down (one failed extract fails a whole ExternalSecret):
#
#   ${APP}-env      DATABASE_URL, from components/postgres. Rotates every 30
#                   days; Reloader restarts the Deployment and the entrypoint
#                   re-reads it at boot.
#   ${APP}-secrets  JWT_SECRET, JWT_REFRESH_SECRET, CONFIG_ENCRYPTION_KEY,
#                   minted in-cluster. Never rotates.
#
# Nothing here needs seeding in OpenBao by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Any host other than localhost/127.0.0.1 here is the image's switch
        # to EXTERNAL Postgres: docker/unified/entrypoint.sh then leaves its
        # bundled PostgreSQL stopped and runs `prisma db push` plus the
        # run-once SQL in prisma/data-migrations against this URL instead.
        #
        # `uriql` (postgresql://...?sslmode=disable) rather than discrete
        # fields because the app reads only DATABASE_URL. The one query
        # parameter is safe in all three places the URL is consumed: Prisma
        # and psql both accept sslmode, and the entrypoint writes it to
        # /etc/environment unquoted and sources it back -- a `?` is not
        # globbed in an assignment, but a second `&param` would background the
        # rest of the line. Do not add one. In particular NOT Prisma's
        # `?schema=public`: psql rejects it as an unknown URI parameter and
        # the data migrations would fail on every boot.
        DATABASE_URL: "{{ .postgres_uriql }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Alphanumeric only, and that is load-bearing: the entrypoint writes these
# values into /app/config/.secrets as `KEY="value"` and `source`s that file on
# every boot, so a `"`, `$` or backtick would corrupt it. 48 characters is past
# what CONFIG_ENCRYPTION_KEY uses -- encryption.service.ts truncates it to its
# first 32 bytes as the AES-256-GCM key.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-secret
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. The generator mints a NEW
# value per call, so `Periodic` would rotate these on a schedule:
#   - JWT_SECRET / JWT_REFRESH_SECRET sign sessions and download links; a
#     rotation logs everyone out.
#   - CONFIG_ENCRYPTION_KEY encrypts the credentials RMAB stores in its own
#     database (Audiobookshelf token, OIDC client secret, Prowlarr key,
#     download-client passwords). A rotation makes every one of them
#     undecryptable.
#
# Belt and braces: on first boot the entrypoint also persists all three to
# /app/config/.secrets on the volsync PVC, and on every later boot it sources
# that file AFTER reading the environment -- so from then on the file wins.
# Losing this Secret therefore costs nothing while the PVC survives; losing
# the PVC is recovered by its restic backup, and only losing both loses the
# key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secrets
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .jwt }}"
        JWT_REFRESH_SECRET: "{{ .jwt_refresh }}"
        CONFIG_ENCRYPTION_KEY: "{{ .config_encryption }}"
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-secret
      rewrite: [{regexp: {source: "^password$", target: "jwt"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "jwt_refresh"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "config_encryption"}}]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# NOT mounted into the pod. RMAB keeps its backend and OIDC settings in its
# own database, never in env, so this Secret exists only to put the authentik
# client one command away when running the setup wizard:
#
#   kubectl -n equestria get secret readmeabook-oidc -o go-template='{{range $k, $v := .data}}{{$k}}={{$v | base64decode}}{{"\n"}}{{end}}'
#
# Setup wizard, in order:
#   Backend           Audiobookshelf
#   Audiobookshelf    URL http://audiobookshelf.equestria.svc.cluster.local:13378,
#                     plus an API key created in Audiobookshelf
#                     (Settings -> API Keys) by its admin
#   Auth method       OIDC, with the local admin account kept as break-glass
#   OIDC              Provider name: whatever the button should say
#                     Issuer URL     OIDC_ISSUER (with its trailing slash)
#                     Client ID      OIDC_CLIENT_ID
#                     Client Secret  OIDC_CLIENT_SECRET
#                     Access control: open -- authentik's access_policy in
#                     ./definition.yaml already decides who gets this far
#                     Admin claim:   enabled, claim `groups`, value `admins`
#   Paths             download dir /media/downloads/completed/readmeabook,
#                     media dir /media/audiobooks (the folder Audiobookshelf's
#                     library scans)
#
# `readmeabook-oidc-credentials` does not exist until `stacks/system` has read
# ./definition.yaml, i.e. after this app's first Flux apply. Until then this
# fails to sync; nothing waits on it. Nudge it once Pulumi has run:
#
#   kubectl -n equestria annotate externalsecret readmeabook-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_ISSUER: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
