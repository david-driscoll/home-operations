---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# NOT mounted into the pod. Audiobookshelf reads its OIDC settings from its own
# database, never from env, so this Secret exists only to put the authentik
# client one command away when filling in the UI:
#
#   kubectl -n equestria get secret audiobookshelf-oidc -o go-template='{{range $k, $v := .data}}{{$k}}={{$v | base64decode}}{{"\n"}}{{end}}'
#
# Settings -> Authentication -> OpenID Connect Authentication:
#   Issuer URL        OIDC_ISSUER, then "Auto-populate" to fill the
#                     authorize/token/userinfo/JWKS/logout URLs from discovery
#   Client ID         OIDC_CLIENT_ID
#   Client Secret     OIDC_CLIENT_SECRET
#   Signing Algorithm RS256
#   Match existing    by email, so the root account links to its authentik
#                     user on first OIDC login. That user must be in authentik's
#                     `admins`: ABS denies the root account any OIDC login whose
#                     role claim is not `admin` (setUserGroup in
#                     OidcAuthStrategy.js).
#   Auto Register     on
#   Group Claim       abs_groups -- see ./definition.yaml
#
# `${APP}-oidc-credentials` does not exist until `stacks/system` has read
# ./definition.yaml, i.e. after this app's first Flux apply. Until then this
# fails to sync; nothing waits on it. Nudge it once Pulumi has run:
#
#   kubectl -n equestria annotate externalsecret audiobookshelf-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_ISSUER: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
