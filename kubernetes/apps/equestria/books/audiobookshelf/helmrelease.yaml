---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app audiobookshelf
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        # No reloader annotation: the pod references no Secret or ConfigMap.
        # OIDC is configured in the UI (./externalsecret.yaml).
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.37.1@sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
            # Every variable the server reads is in index.js / prod.js and
            # server/Server.js; the image's own defaults are PORT=80,
            # CONFIG_PATH=/config and METADATA_PATH=/metadata.
            env:
              # Off 80: the container runs as 568 with every capability
              # dropped, so a privileged port would hang on whether the
              # runtime happens to lower ip_unprivileged_port_start.
              PORT: &port 13378
              CONFIG_PATH: /config
              METADATA_PATH: /metadata
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # First boot creates the SQLite schema and the first library scan
              # runs in the same process, so give it room before liveness bites.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      # The volsync claim. Replaces the old `audiobookshelf-config` claim, which
      # nothing in this repo ever created -- the volsync component names its
      # PVC ${APP}, so the old mount could never have bound.
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
            subPath: config
          - path: /metadata
            subPath: metadata
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      truenas-media:
        existingClaim: truenas-media
        globalMounts:
          # The share has no `books` directory -- the old mount pointed at
          # nothing. These are the two library folders ../chaptarr,
          # ../lazylibrarian and ../readmeabook write into, at the same
          # in-container paths, so a path in one app's logs means the same
          # file in this one.
          - path: /media/audiobooks
            subPath: audiobooks
          - path: /media/ebooks
            subPath: ebooks

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          # local-user, not authenticated-user: Audiobookshelf does its own
          # OIDC login, and the mobile apps and ../readmeabook call its API
          # with ABS-issued tokens that the authentik outpost would bounce.
          # Socket.IO's websocket upgrade rides this route as-is.
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
