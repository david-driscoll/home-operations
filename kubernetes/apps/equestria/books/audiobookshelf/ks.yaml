---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app audiobookshelf
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The `audiobooks` and `ebooks` subPaths of truenas-media.
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/equestria/books/audiobookshelf
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # No components/postgres: Audiobookshelf's only database is SQLite
    # (absdatabase.sqlite under CONFIG_PATH, opened by server/Database.js
    # through Sequelize's sqlite dialect), with no other dialect wired up.
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # No TAILSCALE_MIDDLEWARE override: login is Audiobookshelf's own OIDC,
      # and the mobile apps talk to the API with their own tokens, so the
      # tailnet takes the default tailscale-local chain like the internal
      # route's local-user.
      #
      # One claim, two subPaths (./helmrelease.yaml): /config holds the SQLite
      # database, /metadata the covers, item cache, logs and ABS's own nightly
      # backups.
      VOLSYNC_CAPACITY: 5Gi
