---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
#
# The tailnet twin of the `/api` + `?apikey` rule on the internal HTTPRoute in
# ./helmrelease.yaml, so the tailnet path stays identical to the LAN path.
#
# components/tailscale/api-key does this job for the *arr apps, but matches
# `X-Api-Key` OR `?apikey` on EVERY path. That is safe for an app with a login of
# its own; LazyLibrarian behind authentik has none, so the union would serve its
# whole UI to any tailnet request carrying `?apikey=x`. This copy adds the path.
#
# Same shape as that component (a second router in front of
# components/tailscale/ingressroute.yaml): priority 20 above the base route's 10,
# and always the network-only chain, because an API client cannot follow an
# authentik redirect and LazyLibrarian checks the key itself.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${APP}-tailnet-api
  annotations:
    kubernetes.io/ingress.class: internal
spec:
  entryPoints:
    - tailscale
  routes:
    - kind: Rule
      priority: 20
      match: Host(`${TAILSCALE_HOST:=${APP}}.${TAILSCALE_DOMAIN}`) && Path(`/api`) && QueryRegexp(`apikey`, `.+`)
      middlewares:
        - name: tailscale-local
          namespace: network
      services:
        - name: ${APP}
          port: http
