---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lazylibrarian
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/lazylibrarian
              # `latest`, deliberately. linuxserver tags this image only by
              # upstream COMMIT (`version-16ce29fe`, `16ce29fe-ls373`), which no
              # Renovate versioning can order -- a `version-<sha>` pin would only
              # ever get digest refreshes of that one commit and never move on.
              # A digest-pinned `latest` is the form Renovate tracks, the same
              # one ersatztv and kptv-fast use. Today all three tags resolve to
              # this digest (upstream commit 16ce29fe, build ls373).
              tag: latest@sha256:03cb8867dc1d80390c3e72708344d49ab519d46f61feaa157102abdb3887b869
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE}
              # s6 starts as root, chowns /config and drops to PUID:PGID -- the
              # 568:568 that owns truenas-media.
              PUID: ${PUID}
              PGID: ${PGID}
              UMASK: "002"
              # No DOCKER_MODS. The old manifest's two are opt-in extras that
              # apt-install at EVERY boot (so nightly, with the shed) and need
              # egress to ghcr.io and the Ubuntu mirrors to start:
              #   linuxserver/mods:universal-calibre   -- still maintained, but
              #     only feeds calibredb/ebook-convert into a Calibre library;
              #     there is none in the estate, and LL can talk to a Calibre
              #     content server over HTTP (CALIBRE_USE_SERVER) instead.
              #   linuxserver/mods:lazylibrarian-ffmpeg -- untouched since 2023;
              #     only used by the off-by-default CREATE_SINGLEAUDIO and
              #     WRITE_AUDIOTAGS audiobook options.
              # Re-add either as `DOCKER_MODS: linuxserver/mods:<name>` (pipe-
              # separated) if one of those features is wanted, and widen the
              # startup probe when you do.
            probes:
              # `/api` answers 200 with a small JSON body whether or not the API
              # is enabled or a key is given (errors go in the body), touches no
              # template or database, and is exempt from every LazyLibrarian
              # auth mode -- so it stays a valid probe after the UI is locked down.
              liveness: &probes
                enabled: true
                custom: true
                spec: &spec
                  httpGet:
                    path: /api
                    port: &port 5299
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  <<: *spec
                  # s6 init plus the first-boot SQLite schema build; 5 minutes.
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              # Root at start is required by the linuxserver s6 init (chown of
              # /config, then the drop to PUID:PGID), so no runAsNonRoot and no
              # `drop: [ALL]` -- s6 needs CHOWN/SETUID/SETGID/DAC_OVERRIDE.
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      # The same paths every other app sees, so nothing needs remapping:
      #   /media/downloads  sabnzbd (complete_dir) and qbittorrent
      #                     (DefaultSavePath) both report finished downloads as
      #                     /media/downloads/completed/<name>; LL reads the
      #                     client's path back verbatim.
      #   /media/ebooks     the ebook library readarr-ebook also uses.
      #   /media/audiobooks the audiobook library audiobookshelf serves.
      # There is no `books` directory on the share -- the old `/media/books`
      # mount pointed at nothing.
      media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media/downloads
            subPath: downloads
          - path: /media/ebooks
            subPath: ebooks
          - path: /media/audiobooks
            subPath: audiobooks

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          # HAND-WRITTEN, and deliberately NOT components/route/api-key.
          #
          # LazyLibrarian reads its key from the `apikey` query parameter only
          # (lazylibrarian/api.py takes it from the request kwargs; there is no
          # X-Api-Key header), and only on `/api`. The component matches the
          # header OR the parameter on ANY path, and behind authentik this app
          # has no login of its own -- so `?apikey=x` on any URL would skip SSO
          # and land on the full UI. One match entry, so path AND parameter
          # must both hold. Prowlarr's app sync does not need this at all: it
          # talks to the Service in-cluster, not through the gateway.
          - matches:
              - path:
                  type: Exact
                  value: /api
                queryParams:
                  - name: apikey
                    value: ".*"
                    type: RegularExpression
            backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user
