---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./definition.yaml
  - ./tailnet-api.yaml
  - ./user-sync.yaml
  # Only Traefik may reach the pod: PROXY_AUTH trusts X-Authentik-Username.
  - ./ciliumnetworkpolicy.yaml
configMapGenerator:
  # Mounted by ./user-sync.yaml's CronJob, which kustomize rewrites to the
  # hashed name.
  - name: lazylibrarian-user-sync-script
    files:
      - sync_users.py=./resources/sync_users.py
