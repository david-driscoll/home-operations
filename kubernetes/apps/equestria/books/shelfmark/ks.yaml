---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app shelfmark
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The `downloads` subPath of truenas-media: the tree qBittorrent and
    # SABnzbd complete into, and where Shelfmark's own ingest folders live.
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/equestria/books/shelfmark
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # No components/postgres: Shelfmark has no SQL backend to point at. Its
    # only database is SQLite -- `users.db` under CONFIG_DIR
    # (shelfmark/core/user_db.py, "SQLite user database"; main.py opens
    # CONFIG_DIR/users.db) -- and pyproject.toml carries no Postgres driver.
    # No valkey either: nothing in it speaks Redis.
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # No TAILSCALE_MIDDLEWARE override: login is Shelfmark's own OIDC, so the
      # tailnet takes the default tailscale-local chain, the same posture as
      # the internal route's local-user. Putting the authentik outpost in front
      # as well would be a second login for nothing.
      #
      # /config holds users.db, the settings JSON, the Flask session key and a
      # cover cache capped at 500 MB (COVERS_CACHE_MAX_SIZE_MB).
      VOLSYNC_CAPACITY: 2Gi
