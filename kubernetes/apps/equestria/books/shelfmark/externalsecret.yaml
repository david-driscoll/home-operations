---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# TWO Secrets, split for the reason ../../home/dawarich/externalsecret.yaml
# gives: every reference in an ExternalSecret must resolve or the whole object
# fails, taking its Secret, and with it the pod, along.
#
#   ${APP}-env   The Prowlarr and SABnzbd API keys. Both paths already exist
#                in OpenBao (media/arr-mcp-jellyfin reads the same two), so
#                this resolves on the first apply.
#   ${APP}-oidc  The authentik client. It does NOT exist until `stacks/system`
#                has read ./definition.yaml, which is after this app's first
#                Flux apply. ./helmrelease.yaml mounts it `optional: true`.
#
# Nothing here is seeded by hand, and there is no Password generator either:
# Shelfmark's one app-owned secret, the Flask session key, is minted by the
# app itself into /config/.flask_secret on first boot (main.py,
# _load_or_create_secret_key) and VolSync backs it up with the rest of /config.
#
# qBittorrent needs no credential: it whitelists the cluster pod network
# (QBT_Preferences__WebUI__AuthSubnetWhitelist in
# ../../downloads/qbittorrent/helmrelease.yaml), the same reason
# media/arr-mcp-jellyfin carries none for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: clusters/equestria/apps/prowlarr/api-key
        property: apikey
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: clusters/equestria/apps/sabnzbd/api-key
        property: apikey
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Only the three values Shelfmark cannot know. AUTH_METHOD=oidc and the
# admin-group mapping are plain env in ./helmrelease.yaml, deliberately: if
# they lived here, the window before this Secret exists would boot Shelfmark
# with AUTH_METHOD unset, which defaults to `none`, an open instance. With
# AUTH_METHOD set and these missing, Shelfmark fails closed instead
# (auth_modes.py, determine_auth_mode): sign-in errors until the credential
# lands and the pod is restarted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # The discovery document itself, not the issuer: Shelfmark hands this
        # straight to Authlib as server_metadata_url (oidc_routes.py).
        OIDC_DISCOVERY_URL: "{{ .oidc_openid_configuration_url }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
