---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Streamystats' database connection and session keys, shared by BOTH containers
# in the pod.
#
# No INTERNAL_API_KEY, although upstream's docker-compose.yml still passes one:
# nothing in v2.19.2 reads it. The job server's API is unauthenticated, and is
# kept private by binding it to loopback (helmrelease.yaml) instead.
#
# DATABASE_URL comes from `${APP}-postgres` in the `database` namespace (the
# Secret components/postgres renders; OpenBao rotates its password every 30
# days). `uriql` is the `postgresql://...?sslmode=disable` form upstream's
# compose uses. It must carry a username: without one the driver falls back to
# the OS user and fails with `role "root" does not exist`.
#
# The keys live at `clusters/equestria/apps/streamystats/secrets` and are
# created by hand before first boot:
#
#   bao kv put secrets/clusters/equestria/apps/streamystats/secrets \
#     session_secret="$(openssl rand -hex 32)" \
#     server_actions_key="$(openssl rand -base64 32)"
#
# SESSION_SECRET signs the session JWT (apps/nextjs-app/lib/session.ts); the
# app refuses to start in production without it. Rotating it logs everyone out.
#
# `server_actions_key` is NEXT_SERVER_ACTIONS_ENCRYPTION_KEY, a base64 AES key.
# Without a stable one, Next.js derives a fresh key per build and every image
# bump breaks open sessions. Upstream's .env.example suggests `openssl rand -hex
# 16`, which only works because 32 hex characters happen to base64-decode to a
# valid 24-byte key; `-base64 32` is the 32-byte AES-256 key Next.js documents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is reading.
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        DATABASE_URL: "{{ .postgres_uriql }}"
        SESSION_SECRET: "{{ .session_secret }}"
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "{{ .server_actions_key }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        # Two steps, same as media/pulsarr. The first normalises the Secret's
        # hyphenated keys (`public-uriql`, `jdbc-uri`, ...) into legal Go
        # template identifiers.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
  data:
    - secretKey: session_secret
      remoteRef:
        key: clusters/equestria/apps/streamystats/secrets
        property: session_secret
    - secretKey: server_actions_key
      remoteRef:
        key: clusters/equestria/apps/streamystats/secrets
        property: server_actions_key
