---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# SECRET_KEY encrypts every stored addon configuration. Upstream: it MUST be 64
# hex characters and CANNOT change after first run -- a new value makes the
# existing configs undecryptable. It is therefore created once by hand
# (docs/runbooks/seedstrem-gelato.md) and never rotated.
#
# AIOSTREAMS_AUTH is the app's OWN credential list, on top of the authentik
# proxy in front of it. Without it the instance reports `protected: false` and
# anything that clears authentik can create configs; with it, AIOStreams asks
# for a username and password of its own.
#
# FORMAT: a comma-separated list of `username:password`, parsed by splitting
# each entry on its FIRST colon and trimming whitespace
# (packages/core/src/utils/env.ts, `proxyAuth`). So a password may contain a
# colon but NOT a comma, and must not begin or end with a space -- which is why
# the stored value is hex. One pair here; add more by extending this template,
# not by hand-editing the Secret.
#
# PERMISSIONS: AIOSTREAMS_AUTH_PERMISSIONS is deliberately NOT set. A user that
# is not listed there defaults to admin, which is what a single-operator estate
# wants; setting it would be the way to demote an extra account later.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshInterval: 1h
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # An emptied Secret would start the app with no key, which is worse than a
    # stale one.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
        AIOSTREAMS_AUTH: "{{ .auth_username }}:{{ .auth_password }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: clusters/equestria/apps/aiostreams/secret-key
        property: key
    - secretKey: auth_username
      remoteRef:
        key: clusters/equestria/apps/aiostreams/credentials
        property: username
    - secretKey: auth_password
      remoteRef:
        key: clusters/equestria/apps/aiostreams/credentials
        property: password
