---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: AIOStreams
  category: Media Management
  description: Merges Stremio addons into the single manifest Gelato reads
  url: &url https://${APP}.${ROOT_DOMAIN}
  tailnetUrl: https://${TAILSCALE_HOST:=${APP}}.${TAILSCALE_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/stremio.svg
  access_policy:
    groups:
      - media-managers
  authentik:
    proxy:
      # The whole app, configure page included, sits behind authentik. Gelato
      # never comes through here: it reads the in-cluster Service.
      mode: forward_single
      externalHost: *url
  gatus:
    - group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/api/v1/status
      method: GET
      conditions:
        - "[STATUS] == 200"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      maintenance-windows:
        - start: "02:00"
          duration: 7h
          timezone: ${TIMEZONE}
