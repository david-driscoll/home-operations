---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The authentik credential, on its own and mounted `optional: true`.
#
# `${APP}-oidc-credentials` does not exist until `stacks/applications` has read
# ./definition.yaml and created the provider -- after this app's first Flux
# apply. Until then this ExternalSecret fails to sync, the Secret is absent, and
# so is OIDC_ENABLED: Aurral boots on local login (first run creates the admin
# account in the UI) instead of warning about a half-configured OIDC. When the
# Secret lands, reloader restarts the pod with SSO on.
#
# Aurral has no app-owned secret to seed (sessions live in its SQLite
# database), so there is nothing to create in OpenBao/1Password by hand.
#
# After `pulumi up` in stacks/applications, nudge it rather than waiting:
#
#   kubectl -n equestria annotate externalsecret aurral-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_ENABLED: "true"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # Passed through WITH authentik's trailing slash. openid-client v6
        # discovery appends /.well-known/openid-configuration itself (collapsing
        # the double slash) and then requires the document's `issuer` to equal
        # this URL exactly -- trimming the slash breaks that check. Same trap as
        # reitti.
        OIDC_ISSUER: "{{ .oidc_issuer }}"
        # Log out of authentik too, not just Aurral.
        OIDC_LOGOUT_URL: "{{ .oidc_end_session_url }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
