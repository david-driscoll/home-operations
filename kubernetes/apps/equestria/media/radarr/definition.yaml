---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Radarr
  category: Media Management
  description: Radarr is a movie collection manager
  url: &url https://${APP}.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/radarr.svg
  access_policy:
    groups:
      - media-managers
  authentik:
    # oauth2, NOT proxy: Radarr 7's native OIDC (RADARR__AUTH__METHOD: Oidc in
    # ./helmrelease.yaml), so the route takes `local-user`, not the forward-auth
    # chain -- same as aurral. Native OIDC is single-user: it accepts one
    # identity, AUTH__OIDCUSERIDENTIFIER, so the `servarr_identity` scope
    # (components/authentik/property-mappings.ts) gives every media-managers
    # member that same verified email. access_policy above stays the gate.
    oauth2:
      clientType: confidential
      # Both hostnames: Radarr builds redirect_uri from the request's own host
      # (forwarded headers, trusted via SERVER__TRUSTEDNETWORKS), so a login
      # started on either name comes back to the same one.
      allowedRedirectUris:
        - url: "https://${APP}.${ROOT_DOMAIN}/signin-oidc"
        - url: "https://${TAILSCALE_HOST:=${APP}}.${TAILSCALE_DOMAIN}/signin-oidc"
      # NOT `email`: authentik's built-in mapping sends the real address with
      # email_verified False, which Radarr ignores.
      propertyMappings:
        - openid
        - servarr_identity
  gatus:
    - group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/ping
      method: GET
      conditions:
        - "[STATUS] == 200"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      # This service is scaled to 0 between 01:00 and 07:00, so a failed check in
      # that window is expected rather than an incident. Gatus keeps checking and
      # keeps the history; it just does not alert.
      maintenance-windows:
        - start: "01:00"
          duration: 6h
          timezone: ${TIMEZONE}
