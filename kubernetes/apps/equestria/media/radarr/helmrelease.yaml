---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.0@sha256:c044b4df8e7b2546ef389481626a56fabe291575ff2d65481b1555432d6161ff
              pullPolicy: IfNotPresent
            # -- environment variables.
            # See [image docs](https://github.com/dani-garcia/vaultwarden/blob/main/.env.template) for more details.
            env:
              PUID: ${PUID}
              PGID: ${PGID}
              UMASK: 002
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              # Native OIDC through authentik (./definition.yaml). AUTHORITY,
              # CLIENTID and CLIENTSECRET come from ${APP}-oidc below; if any
              # is missing Radarr silently falls back to Forms with the form
              # hidden -- the UI stays locked, API keys keep working.
              RADARR__AUTH__METHOD: Oidc
              # Enabled, not DisabledForLocalAddresses: TRUSTEDNETWORKS makes
              # Radarr see the real client IP, and every LAN address would then
              # skip the login.
              RADARR__AUTH__REQUIRED: Enabled
              # The one identity native OIDC accepts; `servarr_identity` sends
              # it, verified, for every media-managers member. Changing it here
              # AND in that mapping ends every session (7-day sliding cookies
              # otherwise outlive removal from the group).
              RADARR__AUTH__OIDCUSERIDENTIFIER: media-managers
              RADARR__AUTH__OIDCSCOPES: openid servarr_identity
              RADARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: spike-management-credentials
                    key: radarr_apikey
              # "True" since the log database exists: see
              # ./postgres-databases/. This is what puts System > Logs back
              # in the UI. It is also what makes that database REQUIRED at
              # startup -- the app connects to PostgresLogDb and will not
              # create it, so flipping this back to "False" is the rollback
              # if the database is ever missing.
              RADARR__LOG__DBENABLED: "True"
              RADARR__LOG__LEVEL: info
              RADARR__PORT: &port 7878
              RADARR__SERVER__ALLOWEDHOSTS: "*"
              # The pod CIDR (talos/talconfig.yaml clusterPodNets), i.e. Traefik.
              # Without it only loopback is trusted, the X-Forwarded-Proto/Host
              # are ignored, and the OIDC redirect_uri goes out as http://<pod>
              # -- which authentik's exact match rejects.
              RADARR__SERVER__TRUSTEDNETWORKS: 10.206.0.0/16
              TZ: ${TIMEZONE}
            # RADARR__POSTGRES__{HOST,PORT,USER,PASSWORD,MAINDB}, from the
            # ExternalSecret next door. envFrom rather than five secretKeyRefs
            # so the whole connection moves as one unit, and because the
            # password rotates: the Secret changes under a running pod and
            # reloader.stakater.com/auto on the controller above is what turns
            # that into a restart.
            envFrom:
              - secretRef:
                  name: ${APP}-env
              # RADARR__AUTH__OIDC{AUTHORITY,CLIENTID,CLIENTSECRET}. Optional:
              # it cannot exist before stacks/system has read ./definition.yaml,
              # and reloader restarts the pod when it lands.
              - secretRef:
                  name: ${APP}-oidc
                  optional: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              # First boot against an EMPTY Postgres database replays the entire
              # migration chain, and every 30-day password rotation forces a cold
              # start. Without a startup probe the liveness budget is
              # initialDelay + failureThreshold x period = ~110s; the kubelet kills
              # the pod mid-migration and the restart replays it from the top. A
              # startup probe suspends liveness AND readiness until it passes, so
              # 60 x 10s buys ten minutes and costs nothing on a normal boot, which
              # answers /ping on the first or second check.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 3Gi

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [0, 1, 44, 109, 303, 568, 10000]
        seccompProfile: { type: RuntimeDefault }

    # -- Configures service settings for the chart.
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media/downloads
            subPath: downloads
          - path: /media/movies
            subPath: movies
    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  # Network gate only; Radarr does the SSO itself.
                  name: local-user
---
