---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: &path ./kubernetes/apps/equestria/media/radarr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # Rotating credential. The Deployment reads RADARR__POSTGRES__PASSWORD
    # out of the radarr-env Secret via envFrom and carries
    # reloader.stakater.com/auto, so the 30-day rotation restarts it. The
    # startup probe in helmrelease.yaml is what makes that restart survivable:
    # without it the liveness budget is ~110s, and a cold boot that has to
    # replay the migration chain can exceed it.
    # See docs/runbooks/media-stack-postgres-migration.md.
    - ../../../../components/postgres
    # radarr-log, the second half of the <app>-main/<app>-log pair the
    # Servarr wiki documents. Required from the moment
    # RADARR__LOG__DBENABLED is "True": the app connects to
    # PostgresLogDb at startup and will not create it. Manifest in
    # ./postgres-databases/; needs POSTGRES_APP_PATH below.
    - ../../../../components/postgres/databases
    - ../../../../components/tailscale
    - ../../../../components/tailscale/api-key
    # The same carve-out on the LAN route. See that component: the rule the
    # app used to hand-write in helmrelease.yaml lives there now.
    - ../../../../components/route/api-key
    - ../../../../components/volsync
    - ../../../../components/failover/fast-node-eviction
  postBuild:
    substitute:
      # Browsers take the authentik chain, mirroring this app's internal
      # HTTPRoute. Requests carrying X-Api-Key/?apikey skip it via the
      # components/tailscale/api-key component above -- the same carve-out the
      # internal route makes, so API clients (nzb360, LunaSea, scripts) keep
      # working over the tailnet.
      TAILSCALE_MIDDLEWARE: tailscale-user
      APP: *app
      # Where components/postgres/databases looks for this app's extra
      # Database manifests -- it appends `/postgres-databases`. The anchor
      # means the path is written once, so moving this directory cannot
      # leave a stale path behind.
      POSTGRES_APP_PATH: *path
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 10Gi
