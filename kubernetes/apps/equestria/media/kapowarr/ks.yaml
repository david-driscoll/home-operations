---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kapowarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: ./kubernetes/apps/equestria/media/kapowarr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      # Mirrors this app's internal HTTPRoute, which gates every path behind
      # authentik with no API carve-out -- so the tailnet path does the same and
      # TAILSCALE_API_MIDDLEWARE is pinned rather than left at its
      # `tailscale-local` default.
      TAILSCALE_MIDDLEWARE: tailscale-user
      TAILSCALE_API_MIDDLEWARE: tailscale-user
      APP: *app
      NAMESPACE: *namespace
