---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Bazarr's PostgreSQL connection.
#
# The values come from `${APP}-postgres` in the `database` namespace -- the
# Secret `components/postgres` renders, whose password OpenBao owns and rotates
# every 30 days (kubernetes/components/postgres/AGENTS.md).
#
# ⚠️ DISCRETE VARIABLES, NOT `POSTGRES_URL`. Bazarr 1.6.0 added a `POSTGRES_URL`
# env var, and it does not work on its own: `bazarr/app/database.py` reads
# `os.getenv('POSTGRES_HOST', settings.postgresql.host)`, and `config.py` gives
# `postgresql.host` a `must_exist` default of `localhost` that `validate_all()`
# always materialises. That truthy default is then applied over the URL with
# `url.set()`, silently replacing the host -- and the port the same way. The URL
# form renders as `postgresql://bazarr:***@localhost:5432/bazarr` and the pod
# cannot connect. Use the six discrete variables below.
#
# ⚠️ `POSTGRES_ENABLED` MUST BE THE STRING "true". The check is
# `POSTGRES_ENABLED_ENV.lower() == 'true'`, so "1", "yes" and "on" all evaluate
# FALSE and Bazarr starts silently on the SQLite file in /config with no error
# at all. After cutover, confirm from the startup log line
# `Connecting to PostgreSQL database: ...` rather than assuming.
#
# ⚠️ BAZARR'S OWN BACKUP TASK IS NOT COVERED BY THIS. `bazarr/utilities/backup.py`
# branches on `settings.postgresql.enabled` -- the config.yaml key, NOT the env
# var that everything else honours. Enabling Postgres by environment alone
# leaves the backup path believing it is still on SQLite; it opens a
# non-existent `/config/db/bazarr.db` and logs an exception on every run. The
# runbook sets `postgresql.enabled: true` in `/config/config/config.yaml` once,
# by hand, during the cutover. Bazarr's backup is redundant here anyway -- the
# database is dumped nightly by the CNPG backup CronJob.
#
# The psycopg2 driver is NOT part of Bazarr's base requirements; it lives in a
# separate `postgres-requirements.txt` that many images skip. The
# ghcr.io/home-operations/bazarr image DOES install it (its Dockerfile passes
# `--requirement /app/bin/postgres-requirements.txt`), which is why this works
# here and would not on some other images.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is mounting.
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # The literal string, lower-cased at the comparison. See above.
        POSTGRES_ENABLED: "true"
        POSTGRES_HOST: "{{ .postgres_hostname }}"
        POSTGRES_PORT: "{{ .postgres_port }}"
        POSTGRES_DATABASE: "{{ .postgres_database }}"
        POSTGRES_USERNAME: "{{ .postgres_username }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        # A libpq variable, not a Bazarr one, and it is defensive rather than
        # functional. psycopg2 looks for a client certificate at
        # `$HOME/.postgresql/postgresql.crt`; the image sets no HOME and this
        # pod runs as uid 568, so the lookup resolves to /root/.postgresql and
        # fails with `could not open certificate file ... Permission denied`.
        # Pointing it at a path under /tmp that does not exist is the fix the
        # Bazarr wiki prescribes -- libpq ignores a missing cert, but not an
        # unreadable directory.
        PGSSLCERT: "/tmp/postgresql.crt"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        # Two steps, same as media/pulsarr. The first normalises the Secret's
        # hyphenated keys (`public-hostname`, `jdbc-uri`, `connection-string`)
        # into legal Go template identifiers.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
