---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Tracearr's runtime secrets and database connection.
#
# DATABASE_URL comes from `${APP}-postgres` in the `database` namespace -- the
# Secret components/postgres renders, whose password OpenBao owns and rotates
# every 30 days (kubernetes/components/postgres/AGENTS.md). `uri` is the
# `postgres://...?sslmode=disable` form from pgsql-user-template, which is what
# tracearr's compose passes.
#
# The three signing/encryption keys live at
# `clusters/equestria/apps/tracearr/secrets` and are created by hand before
# first boot, each `openssl rand -hex 32`:
#
#   bao kv put secrets/clusters/equestria/apps/tracearr/secrets \
#     jwt_secret="$(openssl rand -hex 32)" \
#     cookie_secret="$(openssl rand -hex 32)" \
#     encryption_key="$(openssl rand -hex 32)"
#
# ⚠️ ENCRYPTION_KEY IS SET EXPLICITLY, NOT LEFT TO DERIVE FROM JWT_SECRET.
# Notification-destination secrets are encrypted with it; if it is derived,
# rotating JWT_SECRET later makes every stored destination unreadable. It must
# be exactly 64 hex characters -- a malformed key refuses to start. Rotate it
# only with the intent of re-entering those destinations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is reading.
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        DATABASE_URL: "{{ .postgres_uri }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        COOKIE_SECRET: "{{ .cookie_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        # Two steps, same as media/pulsarr. The first normalises the Secret's
        # hyphenated keys (`public-hostname`, `jdbc-uri`, ...) into legal Go
        # template identifiers.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: jwt_secret
    - secretKey: cookie_secret
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: cookie_secret
    - secretKey: encryption_key
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: encryption_key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# SSO against authentik, as a SEPARATE Secret from ${APP}-env on purpose.
#
# The credential is written by stacks/applications once it has read this app's
# definition.yaml (`authentik.oauth2`) from the cluster -- necessarily after the
# first Flux apply. Folding it into ${APP}-env would leave that Secret
# unrenderable until then, and the pod stuck in CreateContainerConfigError
# rather than running without SSO. Separate, it simply fails to sync until the
# Pulumi run, and the pod mounts it `optional: true`.
#
# After `pulumi up` in stacks/applications, nudge it rather than waiting for the
# refresh:
#
#   kubectl -n equestria annotate externalsecret tracearr-oidc \
#     force-sync=$(date +%s) --overwrite
#
# `oidc_issuer` is authentik's per-application issuer
# (https://<authentik>/application/o/tracearr/); tracearr discovers the rest
# from its .well-known document. The redirect URI authentik must allow is
# /api/v1/auth/oauth2/callback/oidc, declared in definition.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
