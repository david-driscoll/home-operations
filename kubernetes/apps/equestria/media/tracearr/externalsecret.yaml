---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Tracearr's runtime secrets and database connection.
#
# DATABASE_URL comes from `${APP}-postgres` in the `database` namespace -- the
# Secret components/postgres renders, whose password OpenBao owns and rotates
# every 30 days (kubernetes/components/postgres/AGENTS.md). `uri` is the
# `postgres://...?sslmode=disable` form from pgsql-user-template, which is what
# tracearr's compose passes.
#
# The keys and the claim code live at `clusters/equestria/apps/tracearr/secrets`
# and are created by hand before first boot -- every property below is
# required, so a missing one leaves this ExternalSecret unsynced and the pod
# waiting on it:
#
#   bao kv put secrets/clusters/equestria/apps/tracearr/secrets \
#     jwt_secret="$(openssl rand -hex 32)" \
#     cookie_secret="$(openssl rand -hex 32)" \
#     better_auth_secret="$(openssl rand -hex 32)" \
#     encryption_key="$(openssl rand -hex 32)" \
#     claim_code="$(openssl rand -hex 6)"
#
# What each one does, per https://docs.tracearr.com/configuration/environment:
#
#   JWT_SECRET          signs auth tokens, including paired mobile devices
#   COOKIE_SECRET       signs cookies
#   BETTER_AUTH_SECRET  signs and encrypts web and mobile sessions
#   ENCRYPTION_KEY      encrypts every notification destination's stored
#                       config (SMTP passwords, webhook URLs) and signs the
#                       newsletter unsubscribe/browser-view links
#   CLAIM_CODE          gates creation of the first owner account
#
# ⚠️ BETTER_AUTH_SECRET AND ENCRYPTION_KEY ARE SET EXPLICITLY, NOT LEFT TO
# DERIVE FROM JWT_SECRET. Both default to an HKDF of JWT_SECRET
# (apps/server/src/lib/env.ts), which would make JWT_SECRET a single rotation
# that silently does three things: logs out every web session, unpairs every
# mobile device, and makes every stored destination secret unreadable ("Re-enter
# this destination's secret"). Explicit, each rotates alone. ENCRYPTION_KEY must
# be exactly 64 hex characters -- a malformed one refuses to start.
#
# ⚠️ CLAIM_CODE IS WHAT STOPS SOMEONE ELSE BECOMING THE OWNER. Tracearr has ONE
# owner, and the first account created -- local sign-up or the SSO button --
# becomes it (apps/server/src/lib/authGuards.ts). The docs recommend a claim code
# only for internet-exposed installs; it is set here anyway because this route
# admits the whole LAN and tailnet, and authentik's friends/family policy would
# otherwise let any of them press "Sign in with Authentik" on a fresh install
# and take ownership. It is only consulted while no owner exists, and it is also
# printed in a banner in the pod log at every boot. Case-insensitive; dashes
# and spaces are ignored.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is reading.
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        DATABASE_URL: "{{ .postgres_uri }}"
        JWT_SECRET: "{{ .jwt_secret }}"
        COOKIE_SECRET: "{{ .cookie_secret }}"
        BETTER_AUTH_SECRET: "{{ .better_auth_secret }}"
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        CLAIM_CODE: "{{ .claim_code }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        # Two steps, same as media/pulsarr. The first normalises the Secret's
        # hyphenated keys (`public-hostname`, `jdbc-uri`, ...) into legal Go
        # template identifiers.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: jwt_secret
    - secretKey: cookie_secret
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: cookie_secret
    - secretKey: better_auth_secret
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: better_auth_secret
    - secretKey: encryption_key
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: encryption_key
    - secretKey: claim_code
      remoteRef:
        key: clusters/equestria/apps/tracearr/secrets
        property: claim_code
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# SSO against authentik, as a SEPARATE Secret from ${APP}-env on purpose.
#
# The credential is written by stacks/applications once it has read this app's
# definition.yaml (`authentik.oauth2`) from the cluster -- necessarily after the
# first Flux apply. Folding it into ${APP}-env would leave that Secret
# unrenderable until then, and the pod stuck in CreateContainerConfigError
# rather than running without SSO. Separate, it simply fails to sync until the
# Pulumi run, and the pod mounts it `optional: true`.
#
# After `pulumi up` in stacks/applications, nudge it rather than waiting for the
# refresh:
#
#   kubectl -n equestria annotate externalsecret tracearr-oidc \
#     force-sync=$(date +%s) --overwrite
#
# How tracearr consumes these (apps/server/src/lib/auth.ts, Better Auth's
# genericOAuth plugin, provider id `oidc`):
#
#   - SSO is enabled only when all three are non-empty; one missing and the
#     button silently does not render.
#   - `oidc_issuer` is authentik's per-provider issuer,
#     https://<authentik>/application/o/<slug>/. Tracearr strips the trailing
#     slash and fetches `<issuer>/.well-known/openid-configuration`, so the
#     form the provider reports is used as-is.
#   - It requests `openid email profile` with PKCE; definition.yaml's property
#     mappings supply exactly those.
#   - The redirect URI is <origin>/api/v1/auth/oauth2/callback/oidc, built from
#     the request's own origin, which is why definition.yaml allows it on both
#     the root-domain and tailnet hostnames.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
