---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The whole of arr-mcp's `config.yaml`, rendered here.
#
# arr-mcp has no secret-manager integration by design -- its own security page
# says so plainly: "`config.yaml` is plaintext on disk ... filesystem
# permissions on the config volume are the real boundary." So the estate's
# usual shape (an ExternalSecret feeding env vars) does not apply; the file
# itself is the interface, and this renders it. ./helmrelease.yaml's
# `seed-config` init container copies it onto the PVC at every start, which is
# what makes GIT AND OPENBAO AUTHORITATIVE over anything typed into the config
# UI.
#
# WHICH SEERR THIS PAIRS WITH, and why it is not the obvious one. The estate
# runs two copies of `ghcr.io/seerr-team/seerr` whose manifests are identical
# apart from their names; which media server each fronts lives only in its own
# settings.json, on its own PVC. Read live from each instance's unauthenticated
# `/api/v1/settings/public` on 2026-09-06:
#
#   jellyseerr -> mediaServerType 1  = PLEX      <- this file
#   seerr      -> mediaServerType 2  = JELLYFIN  <- ../arr-mcp-jellyfin
#
# The names are INVERTED relative to what they look like. Do not "fix" the
# pairing below by reading the hostnames; re-check `/api/v1/settings/public`.
#
# WHAT IS NOT HERE:
#
#   - `transmission`. The only one of arr-mcp's ten services the estate does
#     not run. Omitting it is not a degradation -- an absent service is simply
#     absent (docs/configuration.md).
#   - `lidarr`, `mylar`, `kapowarr`, `tdarr`, ... arr-mcp supports ten service
#     ids and no others; `ServicesSchema` is strict, so an extra key fails at
#     startup rather than being ignored.
#   - `qbittorrent`'s username and password. Both are OPTIONAL in the schema,
#     and qBittorrent here sets
#     `QBT_Preferences__WebUI__AuthSubnetWhitelistEnabled: true` with
#     ${CLUSTER_NETWORK} and ${SERVICE_NETWORK} in the whitelist
#     (../../downloads/qbittorrent/helmrelease.yaml) -- so a pod in this
#     cluster is already authenticated by address. Adding a credential would
#     be a new secret buying nothing.
#   - `default_user` on `plex` and `seerr`. Optional, and NOT guessed: a user
#     that does not exist fails `get_library`, `get_media_details` and
#     `diagnose` outright rather than degrading. Add it under each of those two
#     services when you know which account you want the watch-state joins
#     answered for.
#   - `metadata.imdb`. Off by default; the only source of an IMDb rating for a
#     TV series, at the cost of ingesting a dataset. Enable deliberately.
#
# PERMISSIONS. `safe_write: true` on every service, `destructive: false`
# everywhere -- chosen 2026-09-06. safe_write covers adding media, triggering
# searches and retrying queue items; every one of those still needs arr-mcp's
# two-call confirm handshake, where the first call can only ever return a
# preview plus an HMAC bound to the exact resolved operation. `destructive`
# is the tier that deletes files, requests and torrents, and it is deliberately
# COARSE: turning it on for Radarr enables every destructive Radarr tool, not
# one. It stays off.
#
# `plex` carries the same block for uniformity, and it grants nothing today --
# arr-mcp exposes no Plex writes at all (no `set_watched`, no library scan).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-config
    creationPolicy: Owner
    # A provider blip must not empty the Secret the init container copies from
    # -- an empty config.yaml is a startup failure, not a degraded read.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yaml: |
          # MANAGED BY FLUX. Edits made in the config UI are reverted at the
          # next pod start -- change kubernetes/apps/equestria/media/
          # arr-mcp-plex/externalsecret.yaml instead.
          auth:
            # 32 random bytes, hex. The MCPRemoteProxy in
            # kubernetes/apps/agents/agent-tools-servers/arr-mcp.yaml presents
            # THIS value as a bearer token; the two halves read the same
            # OpenBao path, so a rotation reaches both.
            bearer_token: "{{ .bearer_token }}"
            username: admin
            # No `password_hash`, so this instance is UNCLAIMED: the config UI
            # serves its setup page until someone chooses a password in the
            # browser. That gates the UI only -- `/mcp` is gated by the bearer
            # token above and works from the first boot (src/app.ts). Claiming
            # it writes a hash into the copy on the PVC, which this file then
            # reverts at the next start, so set one here if you want it to
            # stick.
            #
            # Host allowlist for the WEB UI, and only that. Checked against
            # v1.21.2's source and its Hono registration order rather than
            # assumed, because the three paths behave differently:
            #
            #   /ui/*     GATED. An unlisted Host gets 403.
            #   /mcp      NOT GATED. The transport is mounted with
            #             `app.route('/', transport)` BEFORE this middleware is
            #             registered, so Hono answers from the transport and the
            #             host check never runs for it. The bearer token remains
            #             the only thing in front of the MCP surface.
            #   /healthz  Exempt upstream on purpose, so probes that send the
            #             pod IP as their Host keep passing.
            #
            # This therefore pins the config UI -- which renders every service
            # credential below into a form -- and changes nothing about MCP. It
            # also does NOT silence the SDK's "binding to 0.0.0.0 without DNS
            # rebinding protection" line at startup: arr-mcp deliberately never
            # hands allowedHosts to the adapter (its own comment explains why:
            # the adapter freezes the value at construction, so a hostname
            # pinned from the config UI would appear to apply and would not).
            # That warning describes how the transport is built, not this list.
            #
            # Matching is case-insensitive, and port-agnostic because the port
            # is stripped from the END of the Host header -- so a bare hostname
            # here also matches the :6060 form the gateway and proxy send.
            #
            # The svc.cluster.local entry is NOT redundant despite /mcp being
            # ungated today. It is the Host the MCPRemoteProxy in
            # kubernetes/apps/agents/agent-tools-servers/arr-mcp.yaml sends, and
            # upstream's own comments read as though /mcp were already gated --
            # so if that ordering is ever corrected, dropping this line turns
            # every tool call into a 403. Keep it.
            #
            # localhost keeps `kubectl port-forward` able to reach the config UI
            # when the gateway is not an option. It is not a rebinding hole: a
            # rebound browser sends the attacker's own hostname, never this one.
            allowed_hosts:
              - ${APP}.${ROOT_DOMAIN}
              - ${APP}.${NAMESPACE}.svc.cluster.local
              - localhost
          services:
            radarr:
              url: http://radarr.${NAMESPACE}.svc.cluster.local:7878
              api_key: "{{ .radarr_apikey }}"
              permissions:
                safe_write: true
                destructive: false
            sonarr:
              url: http://sonarr.${NAMESPACE}.svc.cluster.local:8989
              api_key: "{{ .sonarr_apikey }}"
              permissions:
                safe_write: true
                destructive: false
            bazarr:
              url: http://bazarr.${NAMESPACE}.svc.cluster.local:6767
              api_key: "{{ .bazarr_apikey }}"
              permissions:
                safe_write: true
                destructive: false
            prowlarr:
              url: http://prowlarr.${NAMESPACE}.svc.cluster.local:9696
              api_key: "{{ .prowlarr_apikey }}"
              permissions:
                safe_write: true
                destructive: false
            # This exact FQDN is one of SABNZBD__HOST_WHITELIST_ENTRIES
            # (see downloads/sabnzbd/helmrelease.yaml, which builds that list
            # from the CLUSTER_CNAME substitution -- the same namespace name
            # this URL carries). SABnzbd rejects an unlisted Host outright, so
            # this is not interchangeable with an arbitrary alias.
            #
            # No `$`-prefixed variable names in THESE comments: this block is a
            # string value, so it survives kustomize and Flux's postBuild
            # envsubst then substitutes anything shaped like a variable, right
            # inside the comment. The file-level comments above are stripped by
            # kustomize and are safe.
            sabnzbd:
              url: http://sabnzbd.${NAMESPACE}.svc.cluster.local:8080
              api_key: "{{ .sabnzbd_apikey }}"
              permissions:
                safe_write: true
                destructive: false
            qbittorrent:
              url: http://qbittorrent.${NAMESPACE}.svc.cluster.local:8080
              permissions:
                safe_write: true
                destructive: false
            plex:
              url: http://plex.${NAMESPACE}.svc.cluster.local:32400
              # `api_key` carries Plex's X-Plex-Token -- the name comes from
              # the schema every service here shares, not from Plex's own
              # vocabulary. Same server token kometa already reads.
              api_key: "{{ .plex_token }}"
              permissions:
                safe_write: true
                destructive: false
            # jellyseerr, NOT seerr -- see this file's header.
            seerr:
              url: http://jellyseerr.${NAMESPACE}.svc.cluster.local:5055
              api_key: "{{ .seerr_apikey }}"
              # Seerr issues one admin-scoped key that can answer for anybody,
              # which is what `allow_other_users` governs; it defaults to
              # false and stays there.
              permissions:
                safe_write: true
                destructive: false
  data:
    # arr-mcp's own bearer token -- 32 random bytes as 64 hex characters, which
    # is exactly what the schema requires. Created 2026-09-08; rotate with
    # `openssl rand -hex 32` at this path and both halves pick it up (see
    # kubernetes/apps/agents/agent-tools-servers/arr-mcp.yaml).
    - secretKey: bearer_token
      remoteRef:
        key: clusters/equestria/apps/arr-mcp-plex/bearer-token
        property: token
    # The four keys that ALREADY EXIST, read here from the same per-app paths
    # ../../shared/secrets/media-management.yaml reads for
    # `spike-management-credentials`. Reading the path rather than that Secret
    # keeps this namespace's consumers independent of a Secret whose key names
    # predate the KV reorganisation.
    - secretKey: radarr_apikey
      remoteRef:
        key: clusters/equestria/apps/radarr/api-key
        property: apikey
    - secretKey: sonarr_apikey
      remoteRef:
        key: clusters/equestria/apps/sonarr/api-key
        property: apikey
    - secretKey: prowlarr_apikey
      remoteRef:
        key: clusters/equestria/apps/prowlarr/api-key
        property: apikey
    - secretKey: plex_token
      remoteRef:
        key: clusters/equestria/apps/plex/token
        property: token
    # bazarr, sabnzbd and jellyseerr -- populated in OpenBao 2026-09-08 for this
    # app. Each already HAD a key (generated on first run, living in that app's
    # own config on its PVC); it had simply never been read from outside it, so
    # nothing had put it in OpenBao.
    - secretKey: bazarr_apikey
      remoteRef:
        key: clusters/equestria/apps/bazarr/api-key
        property: apikey
    - secretKey: sabnzbd_apikey
      remoteRef:
        key: clusters/equestria/apps/sabnzbd/api-key
        property: apikey
    - secretKey: seerr_apikey
      remoteRef:
        key: clusters/equestria/apps/jellyseerr/api-key
        property: apikey
