---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lidarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: &path ./kubernetes/apps/equestria/media/lidarr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # Rotating credential. The Deployment reads LIDARR__POSTGRES__PASSWORD
    # out of the lidarr-env Secret via envFrom and carries
    # reloader.stakater.com/auto, so the 30-day rotation restarts it. The
    # startup probe in helmrelease.yaml is what makes that restart survivable:
    # without it the liveness budget is ~110s, and a cold boot that has to
    # replay the migration chain can exceed it.
    # See docs/runbooks/media-stack-postgres-migration.md.
    - ../../../../components/postgres
    # lidarr-log, the second half of the <app>-main/<app>-log pair the
    # Servarr wiki documents. Required from the moment
    # LIDARR__LOG__DBENABLED is "True": the app connects to
    # PostgresLogDb at startup and will not create it. Manifest in
    # ./postgres-databases/; needs POSTGRES_APP_PATH below.
    - ../../../../components/postgres/databases
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      # Where components/postgres/databases looks for this app's extra
      # Database manifests -- it appends `/postgres-databases`. The anchor
      # means the path is written once, so moving this directory cannot
      # leave a stale path behind.
      POSTGRES_APP_PATH: *path
      NAMESPACE: *namespace
