---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.1.4@sha256:c0825c56238f7702e6572b64ef0f3e3f14be2d4ed10557794eaeb866daa15e34
              pullPolicy: IfNotPresent
            # -- environment variables.
            # See [image docs](https://github.com/dani-garcia/vaultwarden/blob/main/.env.template) for more details.
            env:
              PUID: ${PUID}
              PGID: ${PGID}
              UMASK: 002
              TZ: ${TIMEZONE}
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__APP__THEME: dark
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: spike-management-credentials
                    key: lidarr_apikey
              # "True" since the log database exists: see
              # ./postgres-databases/. This is what puts System > Logs back
              # in the UI. It is also what makes that database REQUIRED at
              # startup -- the app connects to PostgresLogDb and will not
              # create it, so flipping this back to "False" is the rollback
              # if the database is ever missing.
              LIDARR__LOG__DBENABLED: "True"
              LIDARR__LOG__LEVEL: info
              LIDARR__PORT: &port 8686
            # LIDARR__POSTGRES__{HOST,PORT,USER,PASSWORD,MAINDB}, from the
            # ExternalSecret next door. envFrom rather than five secretKeyRefs
            # so the whole connection moves as one unit, and because the
            # password rotates: the Secret changes under a running pod and
            # reloader.stakater.com/auto on the controller above is what turns
            # that into a restart.
            envFrom:
              - secretRef:
                  name: ${APP}-env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &spec
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              # Was failureThreshold: 3 -- 30s of grace. First boot against an
              # EMPTY Postgres database replays the entire migration chain, and
              # every 30-day password rotation forces a cold start, so this is
              # widened to ten minutes. A startup probe suspends liveness AND
              # readiness until it passes, and costs nothing on a normal boot.
              startup:
                <<: *probes
                spec:
                  <<: *spec
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 60
              readiness: *probes
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                # cpu: 2000m
                memory: 3Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 109, 10000]
        seccompProfile: { type: RuntimeDefault }

    # -- Configures service settings for the chart.
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config
      truenas-media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media/downloads
            subPath: downloads
          - path: /media/music
            subPath: music
    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user
---
