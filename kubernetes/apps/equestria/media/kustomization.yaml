---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Two arr-mcp instances, not one: its schema refuses a config naming both
  # `jellyfin` and `plex`, and the estate runs both. Each pairs with the Seerr
  # that actually front-ends its media server -- which is NOT the pairing the
  # two Seerr hostnames suggest. See each app's externalsecret.yaml header.
  - ./arr-mcp-jellyfin/ks.yaml
  - ./arr-mcp-plex/ks.yaml
  - ./bazarr/ks.yaml
  # - ./emby/ks.yaml
  - ./jellyfin/ks.yaml
  - ./jellyseerr/ks.yaml
  - ./radarr/ks.yaml
  - ./sonarr/ks.yaml
  - ./plex/ks.yaml
  - ./tautulli/ks.yaml
  - ./lidarr/ks.yaml
  - ./mylar/ks.yaml
  # - ./watchstate/ks.yaml
  # - ./tdarr/ks.yaml
  - ./kometa/ks.yaml
  - ./kapowarr/ks.yaml
  - ./maintainerr/ks.yaml
  - ./pulsarr/ks.yaml
  - ./seerr/ks.yaml
  # - ./stremio/ks.yaml
  - ./pinepods/ks.yaml
