---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Two arr-mcp instances, not one: its schema refuses a config naming both
  # `jellyfin` and `plex`, and the estate runs both. Each pairs with the Seerr
  # that actually front-ends its media server -- which is NOT the pairing the
  # two Seerr hostnames suggest. See each app's externalsecret.yaml header.
  - ./arr-mcp-jellyfin/ks.yaml
  - ./arr-mcp-plex/ks.yaml
  - ./aurral/ks.yaml
  - ./bazarr/ks.yaml
  # - ./emby/ks.yaml
  - ./jellyfin/ks.yaml
  # Throwaway PostgreSQL test instance -- see ./jellyfin-pg/ks.yaml and
  # docs/runbooks/jellyfin-postgres-migration.md. Remove this line to tear it down.
  - ./jellyfin-pg/ks.yaml
  - ./jellyseerr/ks.yaml
  - ./radarr/ks.yaml
  - ./sonarr/ks.yaml
  - ./plex/ks.yaml
  - ./tautulli/ks.yaml
  - ./tracearr/ks.yaml
  - ./streamystats/ks.yaml
  - ./lidarr/ks.yaml
  - ./mylar/ks.yaml
  - ./watchstate/ks.yaml
  - ./tdarr/ks.yaml
  - ./kometa/ks.yaml
  - ./kapowarr/ks.yaml
  - ./maintainerr/ks.yaml
  - ./pulsarr/ks.yaml
  - ./seerr/ks.yaml
  # - ./stremio/ks.yaml
  # Merges the TMDB addon and downloads/seedstrem into the one manifest
  # Gelato (Jellyfin plugin) reads. docs/runbooks/seedstrem-gelato.md
  # - ./aiostreams/ks.yaml
  - ./pinepods/ks.yaml
