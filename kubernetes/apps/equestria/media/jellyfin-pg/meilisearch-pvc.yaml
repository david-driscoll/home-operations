---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/persistentvolumeclaim-v1.json
#
# The Meilisearch sidecar's index, for the same reasons as production's
# (media/jellyfin/meilisearch-pvc.yaml): derived data, rewritten constantly,
# so it lives outside the config volume rather than inside it.
#
# 20Gi, grown from 5Gi after the index filled the claim (2026-10-25).
# Production's is 10Gi. This instance is a test, so check what is filling it
# before growing it again. Derived data: the plugin rebuilds the index from
# Jellyfin's database, so it needs no clearing when the instance is re-cloned.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}-meilisearch
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
