---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The test instance's PostgreSQL connection, from `jellyfin-pg-postgres` in the
# `database` namespace -- the Secret `components/postgres` renders, whose
# password OpenBao owns and rotates every 30 days.
#
# ⚠️ ONE FULL CONNECTION STRING, NOT THE LEGACY VARIABLES. The fork's entrypoint
# accepts either, but they are not equivalent:
#
#   POSTGRES_CONNECTION_STRING          preferred; used verbatim
#   JELLYFIN_POSTGRES_CONNECTION_STRING alias, LOWER precedence -- only read when
#                                       the above is unset
#   POSTGRES_HOST/PORT/DB/USER/PASSWORD legacy fallback; the entrypoint
#                                       CONCATENATES these into a connection
#                                       string itself, and only reaches for them
#                                       when both of the above are empty
#
# The legacy path gives no place to put pooling or SSL options except two extra
# variables (POSTGRES_SSLMODE, POSTGRES_TRUSTSERVERCERTIFICATE), so everything
# below would have to be spread across five values that the container then
# reassembles. One string keeps SSL, pooling and timeouts reviewable in one
# place, which is what the fork's README recommends.
#
# NOT built from the `connection-string` key the shared pgsql-user-template
# already renders: that one hardcodes `Trust Server Certificate=true;SSL
# Mode=Disable;` and carries no pool or timeout settings. This composes the same
# pieces with the options this workload wants. The template's hyphenated keys are
# normalised to Go identifiers by the two rewrites at the bottom, exactly as
# media/seerr and media/pulsarr do.
#
# ⚠️ DO NOT ALSO SET `Command Timeout` HERE. The provider reads
# POSTGRES_COMMAND_TIMEOUT (helmrelease.yaml) and applies it to the Npgsql
# command timeout itself; setting both is two sources of truth for one value.
#
# SSL Mode=Disable matches every other app on this cluster: the CNPG cluster is
# reached over the pod network at postgres-rw.database.svc.cluster.local, and no
# app here uses TLS to it. It is stated explicitly rather than left to Npgsql's
# default, which is `Prefer` and would silently negotiate TLS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is mounting.
    deletionPolicy: Retain
    template:
      data:
        POSTGRES_CONNECTION_STRING: >-
          Host={{ .postgres_hostname }};Port={{ .postgres_port }};Database={{ .postgres_database }};Username={{ .postgres_username }};Password={{ .postgres_password }};SSL Mode=Disable;Maximum Pool Size=20;Timeout=15
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        # Two steps, same as media/seerr. The first normalises the Secret's
        # hyphenated keys (`public-hostname`, `connection-string`) into legal Go
        # template identifiers; the second namespaces them.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
