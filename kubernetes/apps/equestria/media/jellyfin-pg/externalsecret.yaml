---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The clone's PostgreSQL connection, from `jellyfin-pg-postgres` in the
# `database` namespace -- the Secret `components/postgres` renders, whose
# password OpenBao owns and rotates every 30 days.
#
# ONE Npgsql connection string, consumed by the init container alone
# (resources/prepare.sh), which writes it into database.xml and into the
# plugin's settings on every start. It is also what to paste into the plugin's
# Configuration tab for the one-time migration.
#
# NOT the `connection-string` key the shared pgsql-user-template renders: that
# hardcodes `Trust Server Certificate=true` and carries no pool settings.
#
#  - SSL Mode=Disable, stated rather than left to Npgsql's `Prefer`: the CNPG
#    cluster is reached over the pod network and no app here uses TLS to it.
#  - Search Path=public: what the plugin itself writes into database.xml when
#    the string carries none (its Schema default), and the schema
#    components/postgres gives every database.
#  - Maximum Pool Size=50: explicit, because a key in the string beats the
#    plugin's own default of 100, and the CNPG cluster's max_connections (300)
#    is shared by ~30 databases. The retired fork idled at 17 of 20, so 20 was
#    too low; 50 leaves a library scan room without taking a sixth of the
#    cluster.
#  - No Command Timeout: the plugin applies its own (600s) from its settings.
#
# The template's hyphenated keys are normalised to Go identifiers by the two
# rewrites at the bottom, exactly as media/seerr does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is mounting.
    deletionPolicy: Retain
    template:
      data:
        POSTGRES_CONNECTION_STRING: >-
          Host={{ .postgres_hostname }};Port={{ .postgres_port }};Database={{ .postgres_database }};Username={{ .postgres_username }};Password={{ .postgres_password }};SSL Mode=Disable;Search Path=public;Maximum Pool Size=50;Timeout=15
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
