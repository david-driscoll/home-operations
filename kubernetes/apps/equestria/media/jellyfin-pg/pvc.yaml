---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/persistentvolumeclaim-v1.json
#
# The test instance's config/data volume. EMPTY on creation -- it is never
# pointed at production's config, production's data, or an existing jellyfin.db.
#
# A PLAIN PVC, NOT `components/volsync`, which is what every other app in this
# namespace uses. Three reasons, all specific to this being a throwaway:
#
#  1. The container writes the PostgreSQL connection string -- password included,
#     in the clear -- into /config/config/database.xml on this volume, on every
#     start. That is the image's design (docker/entrypoint.sh in the fork), not
#     something this repo can configure away. A volsync ReplicationSource would
#     copy that file into the restic repository on a schedule.
#  2. Nothing here is worth restoring. The whole point is that it can be deleted
#     and rebuilt from the runbook.
#  3. Teardown stays a `kubectl delete` rather than also pruning snapshots out of
#     a restic repository.
#
# Sized below production's 60Gi at first: most of production's allocation is
# regenerable (keyframes, extracted attachments, logs) and the migration only
# needs the config XMLs plus /config/data/jellyfin.db.
#
# This started at 20Gi and was expanded online to 40Gi on 2026-09-20, when the
# phase 3 restore turned out to need the room -- exactly the escape hatch the
# comment here used to describe. Then to 80Gi on 2026-10-03: usage doubled from
# 20 to 40 GB in a week, in overnight jumps, while production's /config sat flat
# at 3.7 GB, and Jellyfin refuses to start with under 2GiB free on /config/data
# (it crashlooped from 2026-10-02 11:17). It bought four days, not two weeks:
# 68 GB by 2026-10-07.
#
# WHAT WAS GROWING: the directories production keeps on NFS and this instance
# kept here -- artwork, extracted subtitles, trickplay. Growth tracked subtitle
# extraction hour for hour; how the total splits between the three was never
# measured. They are NFS mounts now (helmrelease.yaml), so this volume is back
# to holding what production's does. The old copies are still on it, hidden
# under those mounts, until someone reclaims them; see the runbook.
#
# THE DECLARED SIZE MUST TRACK THE VOLUME, in the same change. A PVC cannot be
# shrunk: a `storage` below `status.capacity` is rejected at admission, and
# because Flux dry-runs every apply, the stale 20Gi
# did not merely drift -- it failed the whole Kustomization on
#
#   PersistentVolumeClaim "jellyfin-pg" is invalid:
#   spec.resources.requests.storage: Forbidden:
#   field can not be less than status.capacity
#
# every two minutes, blocking the HelmRelease and ExternalSecret beside it from
# reconciling at all. If Longhorn expands this volume again:
#   kubectl -n equestria patch pvc jellyfin-pg \
#     -p '{"spec":{"resources":{"requests":{"storage":"<new size>"}}}}'
# then edit the value below to match, before the next reconcile.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-pg
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 80Gi
