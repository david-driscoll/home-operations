---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/persistentvolumeclaim-v1.json
#
# The clone's config volume: production jellyfin's /config as of its latest
# volsync snapshot, restored once through ./replicationdestination.yaml when
# this claim is first created. It boots as an exact SQLite copy of production --
# users, libraries, plugins, watch state -- and the plugin's Migration tab moves
# it onto PostgreSQL from there (docs/runbooks/jellyfin-postgres-migration.md).
#
# `dataSourceRef` is read at creation only and is immutable afterwards. To
# re-clone: bump the trigger in ./replicationdestination.yaml, scale the app to
# zero, delete this claim, and let Flux recreate it.
#
# A NEW NAME (`-config`), not the old `jellyfin-pg` claim: that one held the
# retired Nichols fork's config and cannot gain a dataSourceRef in place. Flux
# prunes it once the Deployment has let go of it.
#
# A PLAIN PVC, NOT `components/volsync`: once the provider is active,
# config/database.xml holds the PostgreSQL password in clear text, and a
# ReplicationSource would copy it into restic on a schedule. Nothing here is
# worth restoring that a re-clone does not give back.
#
# 60Gi = production's VOLSYNC_CAPACITY. It must not be smaller than the
# restored snapshot; it can be expanded online, and this value must follow.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}-config
spec:
  accessModes: ["ReadWriteOnce"]
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: ${APP}-seed
  storageClassName: longhorn
  resources:
    requests:
      storage: 60Gi
