---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# This instance's own Meilisearch master key, generated in-cluster. The full
# argument for a generator over OpenBao is in media/jellyfin/meilisearch-secret.yaml;
# the short version is that the key authenticates rather than encrypts, so
# losing it costs a pod restart and nothing else.
#
# ⚠️ A SEPARATE KEY FROM PRODUCTION'S, deliberately. These two instances
# already share a library and a restored database; they should not also share
# a credential, or tearing this one down would mean rotating production's.
#
# ⚠️ NOT COVERED BY THE TEARDOWN IN §5 of docs/runbooks/jellyfin-postgres-migration.md.
# Pruning the Kustomization removes this ExternalSecret and, through its
# ownerReference, the Secret with it -- but a manual teardown that only deletes
# the Deployment leaves both behind.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-meilisearch-key
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING: a Password generator mints a
# new value on every call, so `Periodic` would rotate Meilisearch's master key
# out from under it on a schedule. See media/jellyfin/meilisearch-secret.yaml.
#
# Note the OTHER ExternalSecret in this directory (./externalsecret.yaml, the
# PostgreSQL connection string) is deliberately the opposite -- `Periodic` on a
# 4m interval, because OpenBao rotates that password every 30 days and the pod
# has to follow it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-meilisearch
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-meilisearch
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # One value read by both containers: the server's master key in the
        # Meilisearch sidecar, the plugin's API key in Jellyfin.
        MEILI_MASTER_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-meilisearch-key
