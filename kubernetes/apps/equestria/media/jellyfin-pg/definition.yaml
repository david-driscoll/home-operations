---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Jellyfin (PGSQL)
  category: Applications
  description: Jellyfin is a media server software test running on PostgreSQL
  url: https://${APP}.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/jellyfin.svg
  access_policy:
    groups:
      - friends
      - family
  gatus:
    - url: https://${APP}.${ROOT_DOMAIN}
      method: GET
      conditions:
        - "[STATUS] == 200"
