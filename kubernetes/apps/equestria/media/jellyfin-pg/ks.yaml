---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# A CLONE OF PRODUCTION JELLYFIN, RUN ON POSTGRESQL. Not a second production.
#
# Stock Jellyfin -- the same image and digest production pins, so it moves when
# production moves -- plus the BORNIOS PostgreSQL Database Provider plugin
# (github.com/BORNIOS/Jellyfin-Database-Providers-Postgres). Its config volume
# is restored from production's latest volsync snapshot, so it starts as an
# exact SQLite copy; the plugin's own Migration tab then copies that onto
# PostgreSQL and switches the server over. Procedure and rollback:
# docs/runbooks/jellyfin-postgres-migration.md.
#
# This replaced the Nichols-HomeLab `jellyfin.pgsql` fork on 2026-10-31. That
# fork was a patched server image pinned to 12.0 that could not follow
# production to 12.1, which is what stalled the trial.
#
# Separate database, separate role, separate config volume, separate hostname
# -- BUT NOT SEPARATE STORAGE. Like the instance it replaced, it mounts
# production's library and production's metadata/subtitle/trickplay exports,
# writably (helmrelease.yaml has why).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin-pg
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # truenas-volumes owns the `truenas-media` PV/PVC this mounts.
    - name: truenas-volumes
      namespace: equestria
    # The ReplicationDestination that seeds the config volume, and the
    # `jellyfin-volsync-secret` it reads, which production's own volsync
    # component renders.
    - name: volsync
      namespace: volsync-system
    - name: jellyfin
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/equestria/media/jellyfin-pg
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  # 30m: a first apply restores production's config volume from Garage before
  # the pod can schedule, and `wait: true` blocks on it.
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # The database, the login role, and an OpenBao-owned password that rotates
    # every 30 days. Unchanged from the instance this replaced, so no new
    # OpenBao static role and no Pulumi race on this merge.
    #
    # ⚠️ The database still holds the retired fork's tables. Plugin 3.x will
    # not adopt a schema it did not create, so the runbook empties it before
    # the migration. Nothing in Flux does that, deliberately.
    - ../../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
