---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# A CLONE OF PRODUCTION JELLYFIN (../jellyfin/helmrelease.yaml) on PostgreSQL,
# through the BORNIOS PostgreSQL Database Provider plugin. Same stock image,
# same mounts, a config volume restored from production's own backup
# (./pvc.yaml). Where this file differs from production it says why; anything
# it does not mention is meant to match.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin-pg
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      # `app`, not `*app` as production spells it: the Deployment's selector
      # carries the controller name and is immutable, and this one has been
      # `app` since the instance was first created.
      app:
        annotations:
          # Restarts on a rotated database password (./externalsecret.yaml)
          # and on a changed init script (./resources/prepare.sh) -- both are
          # applied by the init container, so a restart is what applies them.
          reloader.stakater.com/auto: "true"
          # NO `downscaler/exclude`, unlike production: this instance is shed
          # nightly with the rest of the namespace. ./definition.yaml's Gatus
          # maintenance window matches.
        # Recreate: the config volume is RWO, and two Jellyfin processes on one
        # config directory is not a supported state even briefly.
        strategy: Recreate

        initContainers:
          # ./resources/prepare.sh carries the full account. In short: a
          # PostgreSQL client for the provider's pre-migration pg_dump, one-time
          # hostname fix-ups on the cloned config, and the rotating password
          # written into database.xml.
          #
          # The image's major must be >= the CNPG cluster's (18), or pg_dump
          # refuses the server -- and Renovate never proposes a Postgres major,
          # so this moves by hand, with the cluster. Its Debian release must
          # match the Jellyfin image's (trixie): the copied binaries run against
          # Jellyfin's glibc.
          prepare:
            image:
              repository: docker.io/library/postgres
              tag: 18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
              pullPolicy: IfNotPresent
            command: ["/bin/sh", "/scripts/prepare.sh"]
            env:
              # Whole-hostname rewrites applied ONCE to the cloned config: the
              # copy names production in network.xml's published server URI and
              # in several plugins' settings (Webhook, Moonfin, Jellyfin
              # Enhanced at the time of writing).
              HOST_REWRITES: >-
                jellyfin.${ROOT_DOMAIN}=${APP}.${ROOT_DOMAIN}
                jellyfin.equestria.svc.cluster.local=${APP}.equestria.svc.cluster.local
            # POSTGRES_CONNECTION_STRING. Required: without it the script stops
            # the pod rather than start Jellyfin with a stale password.
            envFrom:
              - secretRef:
                  name: ${APP}-env
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

        containers:
          app:
            image:
              # ⚠️ THE SAME IMAGE AS PRODUCTION, tag AND digest -- that is the
              # point of this instance. Renovate bumps both HelmReleases in one
              # PR (same package, same rule in .github/renovate.json5), so the
              # clone always runs the Jellyfin version production does.
              #
              # The plugin's own docs claim 12.1.x. 12.1 -> 12.4 was checked
              # (2026-10-31): the provider interface only gained a method with a
              # default body, and the one new EF schema migration
              # (MakeOwnerIdIndexesPartial) is index-only. A future bump can
              # break that; this instance is where it should break first.
              repository: ghcr.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            env:
              JELLYFIN_CACHE_DIR: /cache
              JELLYFIN_CONFIG_DIR: /config/config
              JELLYFIN_DATA_DIR: /config
              JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
              JELLYFIN_LOG_DIR: /logs
              JELLYFIN_PublishedServerUrl: "https://${APP}.${ROOT_DOMAIN}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              # This pod's OWN Meilisearch sidecar. The plugin prefers these
              # over its stored config -- which the clone copied from
              # production -- so it cannot write into production's index.
              MEILI_URL: http://127.0.0.1:7700
              PUID: ${PUID}
              PGID: ${PGID}
              TZ: ${TIMEZONE}
            # MEILI_MASTER_KEY; optional for the same reason as production's.
            # The database connection is NOT here: the provider reads it from
            # database.xml, which the init container keeps current.
            envFrom:
              - secretRef:
                  name: ${APP}-meilisearch
                  optional: true
            probes:
              # httpGet, unlike production's exec probes. Those exist only
              # because production carries an ipvlan interface on the LAN
              # (jellyfin-lan-net) that a kubelet-dialed probe cannot reach
              # back through. This pod has no such interface -- its discovery
              # broadcasts would answer for a second server at production's
              # address -- so the ordinary path works.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              # Production has none. Here a boot can carry far more than a
              # normal start: a version bump's migrations run against
              # PostgreSQL after a full pg_dump, and the first start after
              # activation applies the provider's own EF migrations. Ten
              # minutes, and nothing on a normal boot.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                # Production's limit: this holds the whole library, and the
                # plugin's SQLite -> PostgreSQL copy runs inside this process.
                memory: 8Gi

          # Its own Meilisearch, same shape as production's sidecar -- read the
          # comments there for the readiness coupling and for why the two
          # MEILI_MAX_INDEXING_* values are required rather than tuning.
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
              pullPolicy: IfNotPresent
            env:
              MEILI_HTTP_ADDR: 127.0.0.1:7700
              MEILI_DB_PATH: /meili_data/data.ms
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: "true"
              MEILI_MAX_INDEXING_MEMORY: 512Mb
              MEILI_MAX_INDEXING_THREADS: "2"
              MEILI_UPGRADE_DB: "true"
            envFrom:
              - secretRef:
                  name: ${APP}-meilisearch
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - curl -fsS --max-time 8 http://127.0.0.1:7700/health >/dev/null
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: ${PUID}
        runAsGroup: ${PGID}
        # fsGroup, which production avoids for its 60Gi volume. Here the
        # volume is restored by a mover that already runs as 568, so the
        # OnRootMismatch check finds nothing to re-own.
        fsGroup: ${PGID}
        fsGroupChangePolicy: OnRootMismatch
        # 10000 is the media group, to read the NFS share. No 44/109: no GPU.
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
      # NO GPU and no GPU node affinity, unlike production. The iGPUs are
      # shared between the production media apps and this instance must not
      # take a slice from them. Production's encoding.xml -- which this
      # copies -- has hardware acceleration off anyway.

    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
        # No gethomepage.dev annotations: one Jellyfin on the dashboard.

    persistence:
      # Restored from production's latest volsync snapshot when first created.
      config:
        existingClaim: ${APP}-config
        globalMounts:
          - path: /config

      # Written by ./resources/prepare.sh, read by the provider as
      # /usr/lib/postgresql/<major>/bin. Rebuilt on every start.
      pgclient:
        type: emptyDir
        advancedMounts:
          app:
            prepare:
              - path: /pgclient
            app:
              - path: /usr/lib/postgresql
                readOnly: true

      scripts:
        type: configMap
        name: ${APP}-scripts
        defaultMode: 0555
        advancedMounts:
          app:
            prepare:
              - path: /scripts
                readOnly: true

      meilisearch:
        existingClaim: ${APP}-meilisearch
        advancedMounts:
          app:
            meilisearch:
              - path: /meili_data

      cache:
        type: emptyDir
        advancedMounts:
          app:
            app:
              - path: /cache

      transcode:
        type: emptyDir
        advancedMounts:
          app:
            app:
              - path: /transcode

      logs:
        type: emptyDir
        advancedMounts:
          app:
            app:
              - path: /logs

      # ⚠️ PRODUCTION'S LIBRARY AND PRODUCTION'S METADATA, WRITABLE -- this
      # claim and the three NFS exports below are the same ones
      # ../jellyfin/helmrelease.yaml mounts, at the same paths. The cloned
      # database stores absolute paths, so they have to resolve identically.
      #
      # The price is isolation: a refresh, a prune or a removed item here
      # changes what production serves. NEVER clear /metadata,
      # /config/data/subtitles or /config/data/trickplay from inside this pod.
      media:
        existingClaim: truenas-media
        advancedMounts:
          app:
            app:
              - path: /media

      metadata:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin
        advancedMounts:
          app:
            app:
              - path: /metadata

      subtitles:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/subtitles
        advancedMounts:
          app:
            app:
              - path: /config/data/subtitles

      trickplay:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/trickplay
        advancedMounts:
          app:
            app:
              - path: /config/data/trickplay
