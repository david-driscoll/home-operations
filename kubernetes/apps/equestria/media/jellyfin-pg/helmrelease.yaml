---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin-pg
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          # The password rotates every 30 days and the pod only picks up a new
          # one by restarting -- the entrypoint rewrites database.xml from the
          # environment on each start.
          reloader.stakater.com/auto: "true"
        # Recreate, not RollingUpdate: the config volume is RWO, and two
        # Jellyfin processes against one config directory is not a supported
        # state even briefly.
        strategy: Recreate
        containers:
          app:
            image:
              # ⚠️ A SELF-HOSTED GITEA REGISTRY, not ghcr or Docker Hub, and not
              # one of the mirrors in talos/patches/global/machine-registries.yaml
              # -- containerd pulls this one directly. Anonymous pull verified
              # from inside the cluster: token endpoint, tag list, manifest and
              # blob ranges all answer without credentials.
              #
              # ⚠️ NOT A STOCK JELLYFIN IMAGE. This is a patched Jellyfin 12
              # server bundled with the PostgreSQL provider that matches it; the
              # two are upgraded as a unit. Do not mix this image with a stock
              # jellyfin 12 image or a stock plugin, and do not point the
              # production jellyfin HelmRelease at it.
              #
              # PINNED TO A VERSIONED TAG *AND* DIGEST because the project says
              # not to track `latest` for upgrades -- and `latest` currently
              # resolves to this same digest, while `main` is a different, newer
              # build. The digest is the manifest index; its amd64 child is
              # sha256:8db41e42..., built 2026-09-10, carrying Jellyfin server
              # 12.0.0 and Npgsql 10.0.3.
              #
              # Renovate is not wired up for this registry, so bumps are manual:
              # list tags with
              #   TOK=$(curl -s "https://git.nicholstech.org/v2/token?service=container_registry&scope=repository:nichols-homelab/jellyfin.pgsql:pull" | jq -r .token)
              #   curl -s -H "Authorization: Bearer $TOK" https://git.nicholstech.org/v2/nichols-homelab/jellyfin.pgsql/tags/list
              repository: git.nicholstech.org/nichols-homelab/jellyfin.pgsql
              tag: 12.0-nichols.68@sha256:cd825748c2ea6f5dc1242d3e1326db26ca6de31bfe22447d7f8f59d50d8da96c
            env:
              # The container's own defaults already point JELLYFIN_DATA_DIR at
              # /config and JELLYFIN_CONFIG_DIR at /config/config, which is what
              # the entrypoint and the pgloader load file both assume
              # (sqlite:///config/data/jellyfin.db). They are restated here so a
              # base-image change cannot move them silently.
              JELLYFIN_CACHE_DIR: /cache
              JELLYFIN_CONFIG_DIR: /config/config
              JELLYFIN_DATA_DIR: /config
              JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
              JELLYFIN_LOG_DIR: /logs
              JELLYFIN_PublishedServerUrl: "https://${APP}.${ROOT_DOMAIN}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              # Provider command timeout in seconds; 0 would mean unlimited.
              # 30 is the provider's own default, stated explicitly because a
              # library scan against a cold database is where a too-low value
              # would surface. See externalsecret.yaml for why it is NOT also
              # spelled into the connection string.
              POSTGRES_COMMAND_TIMEOUT: "30"
              # Points the Meilisearch plugin at this instance's OWN sidecar,
              # over the pod's loopback. The plugin prefers MEILI_URL from the
              # environment over its stored config, so this wins over the
              # settings page (src/MeilisearchClientHolder.cs).
              #
              # The plugin itself is installed out of band through Jellyfin's
              # plugin UI, as on production -- this HelmRelease configures it
              # but does not put it on disk. On a rebuilt config volume it has
              # to be installed again; these variables need no such step.
              #
              # ⚠️ ITS OWN, not production's. The plugin names its index after
              # the server when `Meilisearch Index Name` is blank, and both
              # servers restored from the same database answer to the same
              # name -- so a shared Meilisearch would have had the two
              # instances writing the same index. A sidecar each makes that
              # unreachable rather than merely unlikely.
              MEILI_URL: http://127.0.0.1:7700
              PUID: ${PUID}
              PGID: ${PGID}
              TZ: ${TIMEZONE}
            # The whole connection string, as one unit, from the ExternalSecret
            # next door -- plus MEILI_MASTER_KEY from ./meilisearch-secret.yaml,
            # which the plugin reads as its API key.
            #
            # The two refs differ on purpose. The connection string is required:
            # without it there is no database and no server. The Meilisearch key
            # is `optional: true` so a briefly absent Secret degrades search
            # instead of stopping the container from being created; the pod's
            # `reloader.stakater.com/auto` restarts it once the Secret lands.
            envFrom:
              - secretRef:
                  name: ${APP}-env
              - secretRef:
                  name: ${APP}-meilisearch
                  optional: true
            probes:
              # httpGet, unlike production jellyfin's exec probes. Those are exec
              # ONLY because that pod carries an ipvlan interface on the LAN and
              # a kubelet-dialed probe cannot reach an ipvlan child from its own
              # parent. This pod has no such interface -- no lan-nad.yaml, no
              # k8s.v1.cni.cncf.io/networks annotation -- so the ordinary path
              # works and there is nothing to work around.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              # ⚠️ LOAD-BEARING ON FIRST BOOT. Against an empty PostgreSQL
              # database the provider runs its entire EF migration chain before
              # anything answers /health. Without a startup probe the liveness
              # budget is initialDelay + failureThreshold x period = ~110s, and
              # the kubelet would kill the pod mid-migration, then replay it from
              # the top on restart. 60 x 10s buys ten minutes and costs nothing
              # on a normal boot. Same reasoning as media/seerr.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                # No GPU on this pod (see defaultPodOptions), so a transcode
                # falls back to software and is CPU-bound. 4Gi is well clear of
                # the ~2.6GiB peak Prometheus recorded for a production jellyfin
                # pod, and this one serves one viewer at most.
                memory: 4Gi

          # This instance's own Meilisearch. Same shape and same trade as
          # production jellyfin's -- read the comment there for why a sidecar
          # couples this pod's readiness to it, and why that is kept survivable
          # rather than argued away.
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
              pullPolicy: IfNotPresent
            env:
              # Loopback only -- nothing outside this pod can reach it. The
              # master key below is the second layer, not the only one.
              MEILI_HTTP_ADDR: 127.0.0.1:7700
              MEILI_DB_PATH: /meili_data/data.ms
              # `production`: every route requires the master key, and
              # Meilisearch refuses to start without one of at least 16 bytes.
              # See media/jellyfin/helmrelease.yaml for why that refusal is
              # survivable here -- the key is generated in-cluster, created
              # once and retained, so it does not depend on OpenBao being
              # reachable when this pod starts.
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: "true"
              # In-place format migration on startup instead of a refusal to
              # boot after an image bump; see production jellyfin and
              # equestria/home/meilisearch (vault#102).
              MEILI_UPGRADE_DB: "true"
            # MEILI_MASTER_KEY. REQUIRED here -- `production` will not boot
            # without it, so an optional ref would only convert a clear
            # "missing Secret" into a crashloop.
            envFrom:
              - secretRef:
                  name: ${APP}-meilisearch
            probes:
              # Liveness only, and exec rather than httpGet: the kubelet cannot
              # dial a loopback bind from outside the pod. `curl` ships in the
              # image alongside tini.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - curl -fsS --max-time 8 http://127.0.0.1:7700/health >/dev/null
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: ${PUID}
        runAsGroup: ${PGID}
        fsGroup: ${PGID}
        fsGroupChangePolicy: OnRootMismatch
        # 44/109 are video/render on the nodes -- GPU groups, and this pod has no
        # GPU. 10000 is the media group, needed to READ the NFS share.
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
      # NO nodeAffinity ON GPU, DELIBERATELY. Production jellyfin pins itself to
      # intel.feature.node.kubernetes.io/gpu nodes and requests an i915 device.
      # This instance asks for none: the iGPUs are already shared between the
      # production media apps, and a throwaway test must not take a slice away
      # from them. The trade-off is that anything needing a transcode here is
      # done in software -- fine for the single playback check the runbook does,
      # and a reason not to read performance numbers off this instance.

    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
        # NO gethomepage.dev ANNOTATIONS, deliberately: a throwaway instance has
        # no business appearing on the dashboard next to the real one. For the
        # same reason there is no definition.yaml in this directory, so it gets
        # no Authentik application, no access policy and no Gatus check.

    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

      # advancedMounts, not globalMounts: the index belongs to Meilisearch
      # alone. Jellyfin reaches it over HTTP, not over the filesystem.
      meilisearch:
        existingClaim: ${APP}-meilisearch
        advancedMounts:
          app:
            meilisearch:
              - path: /meili_data

      # /cache, /transcode and /logs are emptyDir: all three are regenerable, and
      # keeping them off the config volume keeps its 20Gi for data that matters.
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache

      transcode:
        type: emptyDir
        globalMounts:
          - path: /transcode

      logs:
        type: emptyDir
        globalMounts:
          - path: /logs

      # ⚠️ READ-ONLY, AND THE ONLY THING SHARED WITH PRODUCTION JELLYFIN.
      #
      # `truenas-media` is ReadWriteMany, so a second mount is safe, and
      # readOnly: true means a scan here can never write to the library --
      # no .nfo, no artwork, no trickplay, nothing.
      #
      # The FULL claim rather than a small subset, and that is a consequence of
      # migrating rather than starting empty: the library rows that pgloader
      # copies carry production's absolute paths, so the same paths have to
      # resolve here or every item lands "missing". Mount path must stay /media,
      # matching production, for the same reason.
      #
      # This does NOT mount production's /mnt/stash/data/jellyfin metadata,
      # subtitles or trickplay NFS paths. Those are writable, shared, and a scan
      # here would corrupt what production reads.
      media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media
