---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: jellyfin-lan-net
  namespace: equestria
  annotations:
    # Purpose: gives the Jellyfin pod a real interface (net1) on the flat Home
    # LAN so that Jellyfin's *native* client auto-discovery works.
    #
    # Jellyfin does NOT use mDNS. Server discovery is a UDP broadcast to
    # 255.255.255.255:7359 ("Who is JellyfinServer?"), and the port is not
    # configurable upstream. A pod on the Cilium overlay never sees that
    # broadcast, which is why no client on the LAN has ever auto-discovered
    # this server. Per the kernel IPVLAN docs, an L2-mode slave will RX/TX
    # multicast and broadcast, so an ipvlan child on the LAN parent does.
    #
    # This does NOT change how traffic reaches Jellyfin. JELLYFIN_PublishedServerUrl
    # is https://jellyfin.${ROOT_DOMAIN}, so the discovery reply hands clients
    # the normal Traefik URL -- the HTTPRoute and its `local-user` middleware
    # still front every actual request. The LAN address answers discovery only.
    #
    # ipvlan rather than macvlan for the same reason as technitium-dns-net:
    # some nodes are Proxmox KVM VMs, and macvlan would require promiscuous
    # mode on the Proxmox vmbr bridge. ipvlan L2 shares the parent MAC.
    #
    # `master` is deliberately OMITTED. The ipvlan CNI plugin documents it as
    # optional, defaulting to the default route interface, and every node in
    # this cluster routes default via its own LAN NIC and gateway 10.10.0.1:
    #   fluttershy, kerfuffle, hard-hat -> enp2s0
    #   milky-way, othalla, pegasus     -> enp3s0
    #   shining-armor                   -> ens18
    # So one NAD resolves to the correct parent on every node, and the workload
    # is free to schedule anywhere its other constraints allow -- here, any
    # Intel GPU node. This replaced a hardcoded `master: enp2s0` plus a
    # `lan-nic` node label, which pinned the pod to two of the five GPU nodes
    # purely to match the NIC name.
    #
    # The assumption this rests on: the default route stays on the LAN NIC. If
    # a node ever takes its default route via another interface, its ipvlan
    # child follows that interface instead. Nothing here does that today --
    # Tailscale runs as a subnet router, not a default gateway.
    #
    # The address must dodge BOTH allocators: the Cilium pool
    # (10.10.206.100-200, .202-252) and UniFi DHCP (10.10.0.5-10.10.254.254).
    # Technitium's 10.10.206.202 sits inside the Cilium block and survives only
    # because Cilium allocates upward from .100 -- do not copy that. Pick from
    # outside both and add a UniFi reservation. See docs/lan-attach/README.md.
    #
    # Kubelet probes stay on the primary Cilium pod IP: a node cannot reach its
    # own ipvlan child, so a probe aimed at this address would always fail.
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "jellyfin-lan-net",
      "type": "ipvlan",
      "mode": "l2",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "${JELLYFIN_LAN_IP}/16"
          }
        ]
      }
    }
