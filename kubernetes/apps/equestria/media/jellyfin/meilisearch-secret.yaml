---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# The Meilisearch master key, GENERATED IN-CLUSTER rather than read out of
# OpenBao -- the one place in this namespace where that is the better answer,
# for two reasons specific to what this key is:
#
#  1. It is not protecting anything that outlives it. The key authenticates
#     requests; it does not encrypt the index. If this Secret were lost the
#     replacement works immediately -- both containers read the same Secret and
#     `reloader.stakater.com/auto` restarts the pod when it changes -- and
#     nothing has to be recovered. A key in OpenBao would buy durability that
#     nothing here needs, at the cost of a new entry in bootstrap/INVENTORY.md
#     and a boot-time dependency on OpenBao being unsealed.
#  2. The pod cannot start without it (see the ExternalSecret below), so the
#     shorter the path between "Secret required" and "Secret exists", the
#     better. A generator resolves inside the cluster with no provider call at
#     all; the estate's shared Meilisearch key reaches equestria through
#     ClusterSecretStore/openbao, which is one more thing that can be down at
#     the moment production Jellyfin is trying to come back up.
#
# NOT the shared `clusters/equestria/apps/meilisearch/secret-key` either. That
# one belongs to the standalone Meilisearch that karakeep also reads; handing
# the same key to three unrelated workloads is how a rotation there becomes an
# outage here.
#
# 48 characters, alphanumeric. Meilisearch requires >=16 bytes in production
# and refuses to boot below that. Symbols are excluded deliberately: the key
# travels in an Authorization header and through two container environments,
# and nothing is gained by making it awkward to paste into a curl.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-meilisearch-key
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING, NOT TIDINESS. A Password
# generator mints a NEW value every time it is called, so the default
# `Periodic` policy would hand Meilisearch a different master key every
# refreshInterval. `CreatedOnce` creates the Secret if it is absent and never
# touches it again. `refreshInterval: 0` says the same thing through the older
# field, so neither path can start a rotation.
#
# That is also why this carries no `secretStoreRef`: a generator is the whole
# source. Same shape as kube-system/secrets/github-app-token.
#
# `deletionPolicy: Retain` keeps the live Secret if this object ever stops
# rendering -- a regenerated key is harmless but a pod that cannot start is
# not, and Retain means a bad reconcile cannot take Jellyfin down.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-meilisearch
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-meilisearch
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # Read by BOTH containers under this exact name: it is the server's
        # master key in the Meilisearch sidecar, and the plugin's API key in
        # Jellyfin (the plugin reads `MEILI_MASTER_KEY` from the environment
        # and prefers it over its stored config). One value, one Secret, so
        # the two cannot drift apart.
        MEILI_MASTER_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-meilisearch-key
