---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
    # New with the Meilisearch sidecar: ./meilisearch-secret.yaml generates its
    # master key through an ESO Password generator, and the sidecar will not
    # boot without it (`MEILI_ENV: production`). The generator resolves inside
    # the cluster -- no OpenBao, no network -- but the controller and CRDs still
    # have to exist before this Kustomization applies either object.
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/media/jellyfin
  prune: true
  wait: true
  interval: 1h
  timeout: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 60Gi
      VOLSYNC_STORAGECLASS: longhorn
