---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        containers:
          jellyfin:
            image:
              repository: jellyfin/jellyfin
              tag: 12.0-rc3
            env:
              JELLYFIN_CACHE_DIR: /cache
              JELLYFIN_CONFIG_DIR: /config/config
              JELLYFIN_DATA_DIR: /config
              JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
              JELLYFIN_LOG_DIR: /logs
              JELLYFIN_PublishedServerUrl: "https://${APP}.${ROOT_DOMAIN}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              PUID: ${PUID}
              PGID: ${PGID}
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: false
            #   capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 4
                memory: 1Gi
                gpu.intel.com/i915: 1
              limits:
                memory: 8Gi
                # cpu: 4
                gpu.intel.com/i915: 1

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 109, 10000]
        seccompProfile: { type: RuntimeDefault }

      affinity:
        nodeAffinity:
          # HARD: must land on a node with an Intel iGPU. Both the media workers
          # and the control planes carry this label, so this constrains the app
          # to GPU-bearing nodes without deciding which tier.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: In
                values:
                - "true"
          # SOFT: prefer the media workers, whose iGPU is far stronger (Iris Xe,
          # 96 EU) than the control planes' (Alder Lake-N, 24 EU).
          #
          # 46a6 is the worker device ID; the control planes are 46d4. This must
          # stay PREFERRED and never become required -- the whole point is that
          # when both media workers are shed overnight the preference becomes
          # unsatisfiable and the pod schedules on a control plane anyway. A
          # required term here would leave it Pending until 09:00.
          #
          # It is also what brings the pod home. The descheduler runs
          # RemovePodsViolatingNodeAffinity with
          # nodeAffinityType: preferredDuringSchedulingIgnoredDuringExecution,
          # so once the workers return the pod is violating this preference and
          # gets evicted back onto one. Without this block there is nothing to
          # violate, and the pod would squat on a scarce control-plane GPU slot
          # indefinitely. The two halves are a pair -- see
          # kubernetes/apps/kube-system/descheduler/helmrelease.yaml.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: gpu.intel.com/device-id.0300-46a6.present
                  operator: In
                  values:
                  - "true"
      # Required for the overnight relocation: the control planes carry the
      # NoSchedule taint from piece 20 §4, and a toleration only PERMITS
      # placement -- it does not attract it. The soft affinity above is what
      # keeps this on a worker while one is available.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    service:
      app:
        controller: jellyfin
        type: ClusterIP
        ports:
          http:
            port: *port
    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
        annotations:
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.url: "http://${APP}.${INTERNAL_CLUSTER_SERVICE}:8096"
          # gethomepage.dev/widget.key: "${jellyfin_token}"
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "true"
          gethomepage.dev/widget.enableUser: "true"
          gethomepage.dev/widget.showEpisodeNumber: "true"
          gethomepage.dev/widget.expandOneStreamToTwoRows: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: jellyfin.svg
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/namespace: "{{ .Release.Namespace }}" # The kubernetes namespace the app resides in
          gethomepage.dev/app: "${APP}"


    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

      transcode:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcode

      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache

      logs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /logs

      metadata:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin

      subtitles:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/subtitles
        globalMounts:
          - path: /config/data/subtitles

      trickplay:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/trickplay
        globalMounts:
          - path: /config/data/trickplay

      media:
        existingClaim: truenas-media
