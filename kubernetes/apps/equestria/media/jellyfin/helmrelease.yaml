---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        pod:
          annotations:
            # Attaches net1 on the flat Home LAN so Jellyfin's own client
            # auto-discovery works -- it broadcasts on UDP 255.255.255.255:7359
            # and never uses mDNS, so a pod on the Cilium overlay is invisible
            # to it. Serving is unchanged: requests still arrive through the
            # HTTPRoute and its `local-user` middleware, because
            # JELLYFIN_PublishedServerUrl hands clients the Traefik URL.
            # NAD and address constraints: ./lan-nad.yaml.
            k8s.v1.cni.cncf.io/networks: jellyfin-lan-net
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        containers:
          jellyfin:
            image:
              # ghcr, not Docker Hub. The Jellyfin project publishes the same
              # build to both -- verified rather than assumed: for 12.0-rc7 the
              # two registries hand back different manifest-list AND per-arch
              # manifest digests, but an IDENTICAL image config blob
              # (sha256:c5a9986e...), which is what carries the rootfs diff_ids
              # and the runtime config. Same extracted filesystem, same
              # entrypoint; the layer blobs differ only because the two pushes
              # gzipped independently (739,564,695 vs 740,568,681 bytes, same
              # mediaType, same count). What ghcr buys is not being metered
              # against Docker Hub's anonymous pull budget for the cluster's
              # egress IP.
              repository: ghcr.io/jellyfin/jellyfin
              # Renovate could not see past 12.0-rc3 until #1429: the default
              # `docker` versioning reads `-rc3` as an image VARIANT, so the tag
              # was only ever comparable with itself and this pin sat five
              # release candidates behind while the dashboard rendered it as
              # tracked. Do not drop the digest -- every other image in this
              # namespace carries one, and jellyfin was the sole exception.
              tag: 12.0-rc7@sha256:2e7590493748ef56b50b7e2fe1fcda1319c10697f02d933101c784e7b28177d6
            env:
              JELLYFIN_CACHE_DIR: /cache
              JELLYFIN_CONFIG_DIR: /config/config
              JELLYFIN_DATA_DIR: /config
              JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
              JELLYFIN_LOG_DIR: /logs
              JELLYFIN_PublishedServerUrl: "https://${APP}.${ROOT_DOMAIN}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              PUID: ${PUID}
              PGID: ${PGID}
              TZ: ${TIMEZONE}
            probes:
              # exec probes on purpose, and NOT tunable back to httpGet while
              # this pod carries the jellyfin-lan-net ipvlan interface.
              #
              # A kubelet-dialed httpGet sources from the node's LAN IP. The
              # pod's net1 carries 10.10.206.20/16, whose connected route is
              # more specific than the eth0 default, so the reply is routed out
              # net1 -- and an ipvlan child cannot reach its own parent. The
              # probe times out, the pod never goes Ready, the Service loses its
              # endpoints and the HTTPRoute has no backend.
              #
              # This is the exact trap technitium's helmrelease already
              # documents; it was missed when the LAN attachment landed and took
              # jellyfin and plex down until this fix. Curling 127.0.0.1 from
              # inside the container never leaves the pod, so no return path is
              # involved. `port` is still anchored for the Service and route.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - bash
                      - -c
                      - curl -fsS --max-time 8 http://127.0.0.1:8096/health >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: false
            #   capabilities: { drop: ["ALL"] }
            resources:
              requests:
                # 1 CPU requested, and deliberately NO cpu limit.
                #
                # The old 4-core request was sized against the wrong bottleneck:
                # the iGPU was shared 5 ways rather than 3, so transcodes
                # contended for GPU time and it read as a CPU shortage. Observed
                # steady state is single-digit millicores.
                #
                # This survives the 2026-08-22 revert of the media relocation
                # even though the memory cut made in the same PR did not. The
                # two had different causes: the memory limit was cut only to fit
                # a 16GB control plane, which is no longer a requirement,
                # whereas the CPU request was measured against the wrong
                # bottleneck and is equally wrong on a 64GB worker. CPU is also
                # compressible, so unlike a memory limit this cannot OOM
                # anything.
                #
                # No cpu limit on purpose: CPU is compressible, so without a
                # ceiling this takes whatever the node has spare and throttles
                # back proportionally under contention rather than being capped
                # while cores sit idle. The request is what sets that
                # proportional share, and what the scheduler reserves.
                cpu: 1
                memory: 1Gi
                gpu.intel.com/i915: 1
              limits:
                # ⚠️  8Gi, restored to its original value. It was cut to 4Gi on
                # 2026-08-22 to fit a 16GB control plane for the (now reverted)
                # overnight media relocation, on a steady-state reading of
                # ~1.8Gi. That sizing was wrong: plex, cut the same way and on
                # the same reasoning, was OOMKilled that evening (exit 137,
                # 2026-08-22T18:52:15Z), and Prometheus
                # `max_over_time(container_memory_working_set_bytes[6h])` put a
                # jellyfin pod at 2.62 GiB -- already two thirds of the way to a
                # 4Gi ceiling, before a library scan. Size media memory limits
                # off peak, never off idle.
                memory: 8Gi
                gpu.intel.com/i915: 1

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 109, 10000]
        seccompProfile: { type: RuntimeDefault }

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: In
                values:
                - "true"

    service:
      app:
        controller: jellyfin
        type: ClusterIP
        ports:
          http:
            # `&port` used to live on the probe's httpGet; it moved here when the
            # probes became exec (see the probes block above). This is now the
            # first occurrence, so it must stay ahead of the route's `*port`.
            port: &port 8096
    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
        annotations:
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.url: "http://${APP}.${INTERNAL_CLUSTER_SERVICE}:8096"
          # gethomepage.dev/widget.key: "${jellyfin_token}"
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "true"
          gethomepage.dev/widget.enableUser: "true"
          gethomepage.dev/widget.showEpisodeNumber: "true"
          gethomepage.dev/widget.expandOneStreamToTwoRows: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: jellyfin.svg
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/namespace: "{{ .Release.Namespace }}" # The kubernetes namespace the app resides in
          gethomepage.dev/app: "${APP}"


    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

      transcode:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcode

      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache

      logs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /logs

      metadata:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin

      subtitles:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/subtitles
        globalMounts:
          - path: /config/data/subtitles

      trickplay:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/trickplay
        globalMounts:
          - path: /config/data/trickplay

      media:
        existingClaim: truenas-media
