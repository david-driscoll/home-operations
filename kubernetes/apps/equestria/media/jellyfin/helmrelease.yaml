---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        pod:
          annotations:
            # Attaches net1 on the flat Home LAN so Jellyfin's own client
            # auto-discovery works -- it broadcasts on UDP 255.255.255.255:7359
            # and never uses mDNS, so a pod on the Cilium overlay is invisible
            # to it. Serving is unchanged: requests still arrive through the
            # HTTPRoute and its `local-user` middleware, because
            # JELLYFIN_PublishedServerUrl hands clients the Traefik URL.
            # NAD and address constraints: ./lan-nad.yaml.
            k8s.v1.cni.cncf.io/networks: jellyfin-lan-net
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        initContainers:
          # Longhorn hands out a freshly formatted ext4 volume owned root:root
          # 0755, and this pod runs as 568 with NO pod-level `fsGroup` -- so
          # nothing would give 568 a way into the Meilisearch claim.
          #
          # `fsGroup: 568` on defaultPodOptions is the usual fix and is what
          # every other media app here does, but it applies to EVERY volume in
          # the pod. With `fsGroupChangePolicy: OnRootMismatch` the kubelet
          # tests the root of each one and treats "no setgid bit, group not
          # rwx" as a mismatch -- which the 60Gi config volume is -- and then
          # recursively chowns it before any container starts. That is minutes
          # of downtime on the next reconcile, paid by production Jellyfin, for
          # a search index. Chowning one empty directory here costs nothing and
          # touches nothing else.
          #
          # NOT `chown -R`: only the mount point has to change hands, and
          # Meilisearch creates everything beneath it as 568 itself. A
          # recursive chown would re-walk the whole index on every pod start.
          meilisearch-chown:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
              pullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args: ["chown 568:568 /meili_data"]
            securityContext:
              # Overrides the pod's `runAsNonRoot: true`. Changing the owner of
              # a root-owned directory needs CAP_CHOWN, and only uid 0 has it.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"], add: ["CHOWN"] }

        containers:
          jellyfin:
            image:
              # ghcr, not Docker Hub. The Jellyfin project publishes the same
              # build to both -- verified rather than assumed: for 12.0-rc7 the
              # two registries hand back different manifest-list AND per-arch
              # manifest digests, but an IDENTICAL image config blob
              # (sha256:c5a9986e...), which is what carries the rootfs diff_ids
              # and the runtime config. Same extracted filesystem, same
              # entrypoint; the layer blobs differ only because the two pushes
              # gzipped independently (739,564,695 vs 740,568,681 bytes, same
              # mediaType, same count). What ghcr buys is not being metered
              # against Docker Hub's anonymous pull budget for the cluster's
              # egress IP.
              repository: ghcr.io/jellyfin/jellyfin
              # Renovate could not see past 12.0-rc3 until #1429: the default
              # `docker` versioning reads `-rc3` as an image VARIANT, so the tag
              # was only ever comparable with itself and this pin sat five
              # release candidates behind while the dashboard rendered it as
              # tracked. Do not drop the digest -- every other image in this
              # namespace carries one, and jellyfin was the sole exception.
              tag: 12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
            env:
              JELLYFIN_CACHE_DIR: /cache
              JELLYFIN_CONFIG_DIR: /config/config
              JELLYFIN_DATA_DIR: /config
              JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
              JELLYFIN_LOG_DIR: /logs
              JELLYFIN_PublishedServerUrl: "https://${APP}.${ROOT_DOMAIN}"
              DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
              # Configures the Meilisearch plugin. The plugin reads MEILI_URL
              # and MEILI_MASTER_KEY straight out of the environment and
              # PREFERS them over whatever is stored in its own config XML, so
              # these two win over the settings page and cannot drift from the
              # sidecar they describe. src/MeilisearchClientHolder.cs, Set().
              #
              # THE PLUGIN ITSELF IS INSTALLED OUT OF BAND, through Jellyfin's
              # own plugin UI. Nothing in this HelmRelease puts it on disk or
              # keeps it at a version -- it lives on the config volume, which
              # is volsync-backed, and it updates the way any other Jellyfin
              # plugin does. Only its configuration is declared here.
              #
              # 127.0.0.1 because the sidecar binds loopback only. The plugin's
              # other settings -- index name, matching strategy -- are not
              # environment-driven and their defaults are what we want: the
              # index is named after the server, and each Jellyfin here has its
              # own Meilisearch anyway.
              MEILI_URL: http://127.0.0.1:7700
              PUID: ${PUID}
              PGID: ${PGID}
              TZ: ${TIMEZONE}
            # MEILI_MASTER_KEY, the same value the sidecar boots with. From
            # ./meilisearch-secret.yaml, which generates it in-cluster.
            #
            # `optional: true`, unlike the sidecar's copy of this. If the
            # Secret is briefly absent -- a first reconcile, a rebuilt
            # namespace -- Jellyfin's container still starts and search simply
            # falls back; a required ref would make the kubelet refuse to
            # create the container at all. The pod carries
            # `reloader.stakater.com/auto`, so when the Secret does land the
            # pod is restarted and both containers pick it up together.
            envFrom:
              - secretRef:
                  name: ${APP}-meilisearch
                  optional: true
            probes:
              # exec probes on purpose, and NOT tunable back to httpGet while
              # this pod carries the jellyfin-lan-net ipvlan interface.
              #
              # A kubelet-dialed httpGet sources from the node's LAN IP. The
              # pod's net1 carries 10.10.206.20/16, whose connected route is
              # more specific than the eth0 default, so the reply is routed out
              # net1 -- and an ipvlan child cannot reach its own parent. The
              # probe times out, the pod never goes Ready, the Service loses its
              # endpoints and the HTTPRoute has no backend.
              #
              # This is the exact trap technitium's helmrelease already
              # documents; it was missed when the LAN attachment landed and took
              # jellyfin and plex down until this fix. Curling 127.0.0.1 from
              # inside the container never leaves the pod, so no return path is
              # involved. `port` is still anchored for the Service and route.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - bash
                      - -c
                      - curl -fsS --max-time 8 http://127.0.0.1:8096/health >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            # securityContext:
            #   allowPrivilegeEscalation: false
            #   readOnlyRootFilesystem: false
            #   capabilities: { drop: ["ALL"] }
            resources:
              requests:
                # 1 CPU requested, and deliberately NO cpu limit.
                #
                # The old 4-core request was sized against the wrong bottleneck:
                # the iGPU was shared 5 ways rather than 3, so transcodes
                # contended for GPU time and it read as a CPU shortage. Observed
                # steady state is single-digit millicores.
                #
                # This survives the 2026-08-22 revert of the media relocation
                # even though the memory cut made in the same PR did not. The
                # two had different causes: the memory limit was cut only to fit
                # a 16GB control plane, which is no longer a requirement,
                # whereas the CPU request was measured against the wrong
                # bottleneck and is equally wrong on a 64GB worker. CPU is also
                # compressible, so unlike a memory limit this cannot OOM
                # anything.
                #
                # No cpu limit on purpose: CPU is compressible, so without a
                # ceiling this takes whatever the node has spare and throttles
                # back proportionally under contention rather than being capped
                # while cores sit idle. The request is what sets that
                # proportional share, and what the scheduler reserves.
                cpu: 1
                memory: 1Gi
                gpu.intel.com/i915: 1
              limits:
                # ⚠️  8Gi, restored to its original value. It was cut to 4Gi on
                # 2026-08-22 to fit a 16GB control plane for the (now reverted)
                # overnight media relocation, on a steady-state reading of
                # ~1.8Gi. That sizing was wrong: plex, cut the same way and on
                # the same reasoning, was OOMKilled that evening (exit 137,
                # 2026-08-22T18:52:15Z), and Prometheus
                # `max_over_time(container_memory_working_set_bytes[6h])` put a
                # jellyfin pod at 2.62 GiB -- already two thirds of the way to a
                # 4Gi ceiling, before a library scan. Size media memory limits
                # off peak, never off idle.
                memory: 8Gi
                gpu.intel.com/i915: 1

          # The search engine the plugin offloads /Items queries to, in this
          # pod rather than as its own Deployment so that it shares a network
          # namespace with Jellyfin and can be bound to loopback.
          #
          # ⚠️ THIS COUPLES JELLYFIN'S AVAILABILITY TO MEILISEARCH'S. A pod is
          # Ready only when every container in it is, endpoints follow pod
          # readiness, and the HTTPRoute follows the endpoints -- so a
          # crashlooping or unpullable sidecar takes Jellyfin off the network
          # even though Jellyfin itself is fine. That is the price of a sidecar
          # and it is why this one is kept boring: a digest-pinned image,
          # IfNotPresent so a restart needs no registry, no Secret it must have
          # to start, and MEILI_UPGRADE_DB below to stop a version bump from
          # being a refusal to boot. If that trade ever looks wrong, the fix is
          # to move it to its own controller with a Service -- the plugin only
          # needs MEILI_URL to point somewhere else.
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.2@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
              pullPolicy: IfNotPresent
            env:
              # 127.0.0.1, NOT the image's 0.0.0.0 default. Containers in a pod
              # share a network namespace, so Jellyfin reaches this over
              # loopback while nothing outside the pod can reach it at all --
              # there is no Service for it and nothing listening on the pod IP.
              # Note this pod also carries an ipvlan interface on the Home LAN
              # (jellyfin-lan-net); loopback is per-namespace, so that changes
              # nothing here, but a 0.0.0.0 bind would have put a search index
              # of the whole library on the flat LAN.
              MEILI_HTTP_ADDR: 127.0.0.1:7700
              MEILI_DB_PATH: /meili_data/data.ms
              # `production`, which means two things: every route requires the
              # master key below, and Meilisearch REFUSES TO START without one
              # of at least 16 bytes. That refusal is the thing to understand
              # before changing anything here -- this is a sidecar, so a
              # Meilisearch that will not start makes the pod unready and takes
              # Jellyfin's endpoints with it.
              #
              # That risk is why the key is generated in-cluster rather than
              # fetched from OpenBao: the Secret resolves with no provider call
              # and is created once and kept (`CreatedOnce` + `Retain`), so the
              # window where it could be missing is the moment it is first
              # applied, inside a rollout this pod was taking anyway --
              # `strategy` is Recreate here.
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: "true"
              # Migrates the on-disk format in place on startup rather than
              # refusing to boot after an image bump. One-way -- the previous
              # binary will not read the store afterwards -- which is the right
              # trade here twice over: the index is derived data that can be
              # rebuilt from Jellyfin, and a sidecar that will not start takes
              # Jellyfin's endpoints with it. Same setting and same reasoning
              # as equestria/home/meilisearch (vault#102).
              MEILI_UPGRADE_DB: "true"
            # MEILI_MASTER_KEY. REQUIRED here -- no `optional: true`, unlike
            # Jellyfin's copy of the same ref: `MEILI_ENV: production` will not
            # boot without it, so letting the container start with the variable
            # unset would only turn a clear "missing Secret" into a crashloop.
            envFrom:
              - secretRef:
                  name: ${APP}-meilisearch
            probes:
              # Liveness only. A readiness probe here would add nothing -- a
              # container with no readiness probe is Ready as soon as it is
              # running, which is already what pod readiness keys off -- while
              # giving a slow index one more way to pull Jellyfin's endpoints.
              # Restarting a wedged process is worth having; `curl` is in the
              # image (the final stage installs it alongside tini), and it has
              # to be an exec probe because the kubelet cannot dial a loopback
              # bind from outside the pod.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - curl -fsS --max-time 8 http://127.0.0.1:7700/health >/dev/null
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # Meilisearch memory-maps its store and will happily use what
                # it is given; the limit is what stops an index rebuild from
                # competing with Jellyfin's 8Gi on the same node.
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 109, 10000]
        seccompProfile: { type: RuntimeDefault }

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: In
                values:
                - "true"

    service:
      app:
        controller: jellyfin
        type: ClusterIP
        ports:
          http:
            # `&port` used to live on the probe's httpGet; it moved here when the
            # probes became exec (see the probes block above). This is now the
            # first occurrence, so it must stay ahead of the route's `*port`.
            port: &port 8096
    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
        annotations:
          gethomepage.dev/widget.type: jellyfin
          gethomepage.dev/widget.url: "http://${APP}.${INTERNAL_CLUSTER_SERVICE}:8096"
          # gethomepage.dev/widget.key: "${jellyfin_token}"
          gethomepage.dev/widget.enableBlocks: "true"
          gethomepage.dev/widget.enableNowPlaying: "true"
          gethomepage.dev/widget.enableUser: "true"
          gethomepage.dev/widget.showEpisodeNumber: "true"
          gethomepage.dev/widget.expandOneStreamToTwoRows: "true"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: jellyfin.svg
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/namespace: "{{ .Release.Namespace }}" # The kubernetes namespace the app resides in
          gethomepage.dev/app: "${APP}"


    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config

      # advancedMounts, not globalMounts: the index belongs to Meilisearch and
      # the init container that has to hand it over, and to nothing else.
      # Jellyfin has no business seeing it -- it talks to Meilisearch over
      # HTTP, not over the filesystem.
      meilisearch:
        existingClaim: ${APP}-meilisearch
        advancedMounts:
          jellyfin:
            meilisearch:
              - path: /meili_data
            meilisearch-chown:
              - path: /meili_data

      transcode:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /transcode

      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /cache

      logs:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /logs

      metadata:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin

      subtitles:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/subtitles
        globalMounts:
          - path: /config/data/subtitles

      trickplay:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/jellyfin/trickplay
        globalMounts:
          - path: /config/data/trickplay

      media:
        existingClaim: truenas-media
