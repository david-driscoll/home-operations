---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Sonarr's PostgreSQL connection, in the shape Sonarr reads it.
#
# The values come from `${APP}-postgres` in the `database` namespace -- the
# Secret `components/postgres` renders, whose password OpenBao owns and rotates
# every 30 days (kubernetes/components/postgres/AGENTS.md). Reading it here
# through ClusterSecretStore/database is the same contract every other
# postgres-backed app uses; see media/pulsarr and games/questarr.
#
# WHY THE KEYS ARE SPELLED OUT INSTEAD OF `dataFrom`-ed STRAIGHT THROUGH:
# Sonarr takes its configuration from `SONARR__SECTION__KEY` environment
# variables, which do NOT match the credential Secret's key names, and the
# prefix is not derivable from `${APP}` (kustomize has no upper-case
# function). So each app spells its own five out. The mapping is
# https://wiki.servarr.com/sonarr/environment-variables.
#
# TWO DATABASES, `${APP}` and `${APP}-log`, which is what every Servarr wiki
# page describes. Sonarr opens both at startup and creates neither -- so
# `${APP}-log` has to exist first. It is declared in ./postgres-databases/ and
# rendered by `components/postgres/databases`; the ks.yaml wiring is what puts
# it in the `database` namespace.
#
# `${APP}` is renamed from the wiki's `<app>-main` because
# `components/postgres` names an app's database after the app; `-log` keeps the
# wiki's name because nothing constrains it. Both are just what
# `PostgresMainDb`/`PostgresLogDb` say.
#
# Both connections share this ONE credential: `ConnectionStringFactory` builds
# them from the same `PostgresUser`, `PostgresPassword`, `PostgresHost` and
# `PostgresPort` and varies only the database name. So there is no second role,
# no second OpenBao static role, and nothing else to add here.
#
# Setting `SONARR__POSTGRES__HOST` is also the ON SWITCH: Sonarr-family apps
# use Postgres if and only if `PostgresHost` is non-empty
# (NzbDrone.Core/Datastore/ConnectionStringFactory.cs). Removing this
# ExternalSecret and the `envFrom` that reads it drops the app straight back
# onto the SQLite file that is still sitting in its config PVC -- which is the
# rollback, and why that file is not deleted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A
  # rotated password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is mounting.
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        SONARR__POSTGRES__HOST: "{{ .postgres_hostname }}"
        SONARR__POSTGRES__PORT: "{{ .postgres_port }}"
        SONARR__POSTGRES__USER: "{{ .postgres_username }}"
        SONARR__POSTGRES__PASSWORD: "{{ .postgres_password }}"
        SONARR__POSTGRES__MAINDB: "{{ .postgres_database }}"
        # A literal, not a Secret key: the credential Secret describes ONE
        # database and the log one is derived from it by convention. Must
        # match `spec.name` in ./postgres-databases/sonarr-log.yaml.
        SONARR__POSTGRES__LOGDB: "${APP}-log"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        # Two steps, same as media/pulsarr. The first normalises the Secret's
        # hyphenated keys (`public-hostname`, `jdbc-uri`, `connection-string`)
        # into legal Go template identifiers -- `.postgres_connection_string`
        # rather than something only `index` can reach. Only the five plain
        # keys are used above, but normalising all of them means adding a
        # sixth later needs no thought.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
