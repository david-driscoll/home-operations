---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sonarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: &path ./kubernetes/apps/equestria/media/sonarr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  # TEMPORARY 30m to wait out the Sonarr 5 first-boot migrations (#2629),
  # with the HelmRelease; back to 10m after.
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # Rotating credential. The Deployment reads SONARR__POSTGRES__PASSWORD
    # out of the sonarr-env Secret via envFrom and carries
    # reloader.stakater.com/auto, so the 30-day rotation restarts it. The
    # startup probe in helmrelease.yaml is what makes that restart survivable:
    # without it the liveness budget is ~110s, and a cold boot that has to
    # replay the migration chain can exceed it.
    # See docs/runbooks/media-stack-postgres-migration.md.
    - ../../../../components/postgres
    # sonarr-log, the second half of the <app>-main/<app>-log pair the
    # Servarr wiki documents. Required from the moment
    # SONARR__LOG__DBENABLED is "True": the app connects to
    # PostgresLogDb at startup and will not create it. Manifest in
    # ./postgres-databases/; needs POSTGRES_APP_PATH below.
    - ../../../../components/postgres/databases
    # No api-key carve-outs (components/tailscale/api-key, route/api-key):
    # both routes are already on the network-only chain, since Sonarr does
    # its own SSO and checks API keys itself.
    - ../../../../components/tailscale
    - ../../../../components/volsync
    - ../../../../components/failover/fast-node-eviction
  postBuild:
    substitute:
      # Network gate only, mirroring the internal HTTPRoute's `local-user`:
      # Sonarr's native OIDC is the login, and API clients (nzb360, LunaSea,
      # scripts) authenticate with their key.
      TAILSCALE_MIDDLEWARE: tailscale-local
      APP: *app
      # Where components/postgres/databases looks for this app's extra
      # Database manifests -- it appends `/postgres-databases`. The anchor
      # means the path is written once, so moving this directory cannot
      # leave a stale path behind.
      POSTGRES_APP_PATH: *path
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 10Gi
