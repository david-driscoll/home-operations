---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Seerr's PostgreSQL connection.
#
# The values come from `${APP}-postgres` in the `database` namespace -- the
# Secret `components/postgres` renders, whose password OpenBao owns and rotates
# every 30 days (kubernetes/components/postgres/AGENTS.md).
#
# ⚠️ `DB_TYPE` MUST BE EXACTLY `postgres`. `server/datasource.ts` is
# `export const isPgsql = process.env.DB_TYPE === 'postgres'` -- a strict,
# case-sensitive comparison with no validation and no warning. `postgresql`,
# `Postgres` or a missing value all select SQLite silently, and the app comes up
# looking healthy on an empty local database. Verify after cutover by querying
# Postgres, not by loading the UI.
#
# ⚠️ DO NOT OVERRIDE THE CONTAINER COMMAND. Migrations run at boot only when
# `NODE_ENV === 'production'`, and nothing in the image environment sets it --
# it comes from the `start` script (`NODE_ENV=production node dist/index.js`),
# which the default `pnpm start` command invokes. Replacing `command:`/`args:`
# without carrying NODE_ENV forward gives a pod that connects to Postgres and
# then skips its migrations.
#
# `DB_NAME` is set explicitly even though the code default (`seerr`) already
# matches: `components/postgres` owns that name, and an app that silently
# depended on a hard-coded default matching a component's naming convention
# would be a trap the first time either side changed.
#
# `CONFIG_DIRECTORY` is unchanged and the config PVC stays: `settings.json`,
# the logs and the image cache live there regardless of `DB_TYPE`. That file
# holds the API key and every service pairing, which is why a cutover here does
# not mean re-pairing with Plex/Jellyfin/Sonarr/Radarr.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Matches the rotation ExternalSecret next to the credential itself. A rotated
  # password has to reach the pod before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    # A provider blip must not empty the Secret the pod is mounting.
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        DB_TYPE: "postgres"
        DB_HOST: "{{ .postgres_hostname }}"
        DB_PORT: "{{ .postgres_port }}"
        DB_NAME: "{{ .postgres_database }}"
        DB_USER: "{{ .postgres_username }}"
        DB_PASS: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        # Two steps, same as media/pulsarr. The first normalises the Secret's
        # hyphenated keys (`public-hostname`, `jdbc-uri`, `connection-string`)
        # into legal Go template identifiers.
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
