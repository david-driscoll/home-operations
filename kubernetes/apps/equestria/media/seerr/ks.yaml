---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seerr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: ./kubernetes/apps/equestria/media/seerr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # Rotating credential. The Deployment reads DB_PASS out of the
    # seerr-env Secret via envFrom and carries reloader.stakater.com/auto,
    # so the 30-day rotation restarts it. The startup probe in
    # helmrelease.yaml is what makes that restart survivable.
    # See docs/runbooks/media-stack-postgres-migration.md.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
