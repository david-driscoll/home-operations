---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app navidrome
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The music library is the `music` subPath of truenas-media -- the same
    # directory lidarr writes into.
    - name: truenas-volumes
      namespace: equestria
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: ./kubernetes/apps/equestria/media/navidrome
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # No components/postgres: Navidrome is SQLite-only. The database lives in
    # /data on the volsync PVC below, which is what gets backed up.
    - ../../../../components/tailscale
    # NOT components/tailscale/api-key or components/route/api-key. Subsonic
    # clients authenticate with `u`/`t`/`s` query params, not X-Api-Key, so the
    # carve-out this app needs is a PATH (/rest) -- see ./tailnet-subsonic.yaml
    # and the internal route in ./helmrelease.yaml.
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # Browsers take the authentik chain, matching the internal HTTPRoute.
      # Subsonic API calls skip it via ./tailnet-subsonic.yaml.
      TAILSCALE_MIDDLEWARE: tailscale-user
      # SQLite DB plus navidrome.toml. Artwork/transcode caches are on an
      # emptyDir (ND_CACHEFOLDER) precisely so they stay out of this.
      VOLSYNC_CAPACITY: 5Gi
