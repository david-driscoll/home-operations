---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa
spec:
  # One remoteRef per value, since the nineteen-field
  # `shared/media-management-secrets` blob was split (§G of
  # docs/openbao-shared-secrets-reorg.md). Kometa wanted seven of the nineteen.
  #
  # The old "EMPTY IS NOT MISSING" hazard is gone with the `dataFrom.extract`
  # that caused it: a template referencing a field absent from the extracted map
  # failed the WHOLE ExternalSecret under missingkey=error. A `data:` entry
  # naming a path that does not exist fails too — but it fails naming the path,
  # not the template variable.
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kometa-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KOMETA_PLEX_APIKEY: "{{ .plex_token }}"
        KOMETA_TAUTULLI_APIKEY: "{{ .tautulli_token }}"
        KOMETA_TMDB_APIKEY: "{{ .tmdb_apikey }}"
        KOMETA_OMDB_APIKEY: "{{ .omdb_apikey }}"
        KOMETA_MDBLIST_APIKEY: "{{ .mdblist_apikey }}"
        KOMETA_RADARR_APIKEY: "{{ .radarr_apikey }}"
        KOMETA_SONARR_APIKEY: "{{ .sonarr_apikey }}"
  data:
    - secretKey: plex_token
      remoteRef:
        key: clusters/equestria/apps/plex/token
        property: token
    - secretKey: tautulli_token
      remoteRef:
        key: clusters/equestria/apps/tautulli/api-key
        property: token
    - secretKey: radarr_apikey
      remoteRef:
        key: clusters/equestria/apps/radarr/api-key
        property: apikey
    - secretKey: sonarr_apikey
      remoteRef:
        key: clusters/equestria/apps/sonarr/api-key
        property: apikey
    # The blob's own `tmdb_apikey` is dropped rather than moved: it duplicated
    # third-party-tokens/tmdb/api-key, which xcproxy already reads. Two homes
    # for one vendor key means no way to tell which one a rotation updated.
    - secretKey: tmdb_apikey
      remoteRef:
        key: third-party-tokens/tmdb/api-key
        property: password
    - secretKey: omdb_apikey
      remoteRef:
        key: third-party-tokens/omdb/api-key
        property: apikey
    - secretKey: mdblist_apikey
      remoteRef:
        key: third-party-tokens/mdblist/api-key
        property: apikey
