---
# Default values for pinepods.
# This is a YAML-formatted file.

## Number of pinepods pods to run
replicaCount: 1

## Container image configuration
image:
  repository: madeofpendletonwool/pinepods
  tag: 0.9.0@sha256:ebc258bb0c62cdb69e5fb726b247c885dac19b50d06fed68fa8d37197b88ace4

## Ingress configuration for exposing the application to external traffic
ingress:
  # -- Enable ingress resource
  enabled: false

## Persistence configuration
persistence:
  # -- Enable persistent storage
  enabled: true
  downloads:
    # -- Use existing PVC for downloads
    # If set, a new PVC will not be created
    existingClaim: "spike-media-downloads-${APP}"
  backups:
    # -- Use existing PVC for backups
    existingClaim: "${APP}"

## PostgreSQL configuration
postgresql:
  # -- Enable PostgreSQL deployment
  # Set to false if using external database
  enabled: false

# External database configuration
# Only used when postgresql.enabled is false
externalDatabase:
  type: postgresql
  host: "{{ .postgres_hostname }}"
  port: "{{ .postgres_port }}"
  user: "{{ .postgres_username }}"
  password: "{{ .postgres_password }}"
  database: "{{ .postgres_database }}"

## Valkey configuration
valkey:
  # -- Enable Valkey deployment
  enabled: false

## Application environment variables
env:
  # -- Search API URL for podcast search functionality - Change these only if you're hosting the backend and the podcast people database yourself
  SEARCH_API_URL: "https://search.pinepods.online/api/search"
  PEOPLE_API_URL: "https://people.pinepods.online/api/hosts"
  # User Configuration
  # -- Default admin username
  USERNAME: "{{ .pinepods_admin_username }}"
  # -- Default admin password
  PASSWORD: "{{ .pinepods_admin_password }}"
  # -- Admin full name
  FULLNAME: "{{ .pinepods_admin_name }}"
  # -- Admin email address
  EMAIL: "{{ .pinepods_admin_email }}"

  VALKEY_HOST: "valkey.database.svc.cluster.local"
  VALKEY_PORT: "6379"

  # SSO via authentik. The provider and its credential come from
  # ../definition.yaml, through the oidc_* extract in ../externalsecret.yaml.
  # PinePods reads these at every boot but only inserts a provider row when
  # none exists for this client id, and never updates it: a later edit here
  # needs the row fixed in Settings (or deleted) first. The first six must all
  # be non-empty, or the API refuses to start ("Incomplete OIDC configuration").
  # Standard login stays enabled: it is the admin's way back in.
  #
  # The two button colours are NOT cosmetic. init_oidc_from_env inserts the row
  # only when OIDCConfig::is_configured(), which also demands a non-empty
  # button_color and button_text_color (rust-api/src/config.rs, 0.9.0). The code
  # defaults them (#000000 / #FFFFFF) only when the variable is ABSENT, but
  # startup/startup.sh `export`s every OIDC_* -- unset ones as "" -- so leaving
  # them out makes the init skip silently (a debug line, in a log file, not
  # stdout). That left OIDCProviders empty and SSO missing until 2026-10-03.
  OIDC_PROVIDER_NAME: "authentik"
  OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
  OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  OIDC_AUTHORIZATION_URL: "{{ .oidc_authorization_url }}"
  OIDC_TOKEN_URL: "{{ .oidc_token_url }}"
  OIDC_USER_INFO_URL: "{{ .oidc_userinfo_url }}"
  OIDC_BUTTON_TEXT: "Sign in with authentik"
  OIDC_BUTTON_COLOR: "#fd4b2d"
  OIDC_BUTTON_TEXT_COLOR: "#ffffff"
  OIDC_SCOPE: "openid email profile"
  OIDC_NAME_CLAIM: "name"
  OIDC_EMAIL_CLAIM: "email"
  OIDC_USERNAME_CLAIM: "preferred_username"
  # The role gate. Left unset these default to roles / user / admin, and since
  # authentik sends no `roles` claim every login would bounce with
  # error=no_access&details=invalid_roles (handlers/auth.rs in 0.9.0). The
  # `profile` scope carries authentik's `groups`, so family may sign in and
  # admins become PinePods admins. An existing account matched by email is
  # re-synced on each login, including losing admin if not in `admins`.
  OIDC_ROLES_CLAIM: "groups"
  OIDC_USER_ROLE: "family"
  OIDC_ADMIN_ROLE: "admins"

  # Application Configuration
  # -- Debug mode
  # Set to true for additional logging
  DEBUG_MODE: "false"
  # -- Container timezone
  # startup.sh points /etc/localtime at it; the image default is UTC. The
  # background scheduler is UTC regardless, so no job moves.
  TZ: "${TIMEZONE}"
