---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pinepods
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/media/pinepods
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: valkey
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/postgres
    # TRANCHE 7, and the close of group C/D. Second of two PRs: #1161 added
    # the startup probe first, because pinepods had the narrowest margin in
    # the boot-budget sweep.
    #
    # That rollout justified itself. The boot came in at 156s, not the 144s
    # measured beforehand -- an 8% spread across two runs against what used
    # to be a 210s liveness budget. The margin was never the 66s it looked
    # like, and a slower boot under load could have crossed it. Now 600s,
    # a 3.8x margin, 0 restarts.
    #
    # Other gates: reloader is on the Deployment (via post-render patch --
    # this chart has no value for it), and the password arrives through
    # envFrom on pinepods-env.
    - ../../../../components/postgres/rotate
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
