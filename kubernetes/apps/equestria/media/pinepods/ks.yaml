---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pinepods
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/media/pinepods
  prune: true
  wait: true
  interval: 1h
  timeout: 10m
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: valkey
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # Rotating credential, and the 600s startup probe below is a prerequisite:
    # pinepods had the narrowest margin in the boot-budget sweep, and #1161
    # widened it before the first rotation forced a restart. The boot came in
    # at 156s, not the 144s measured beforehand -- an 8% spread across two runs
    # against what had been a 210s budget, so that 66s margin was never real.
    #
    # Other gates: reloader is on the Deployment (via post-render patch -- this
    # chart has no value for it), and the password arrives through envFrom on
    # pinepods-env.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
