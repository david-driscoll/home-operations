---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pinepods
spec:
  interval: 1h
  url: http://helm.pinepods.online
---
# HelmRelease for PinePods
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
spec:
  chart:
    spec:
      chart: pinepods
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: pinepods
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: Secret
      name: ${APP}-values
      valuesKey: values.yaml
  # pinepods reads its database password from the `pinepods-env` Secret via
  # envFrom, so a rotated password does not reach the running pod unless
  # something restarts it. Stakater Reloader does that, but only when the
  # annotation is on the WORKLOAD -- and this chart offers no value for
  # Deployment-level annotations, so it goes on with a post-render patch (the
  # same mechanism network/crowdsec and network/cloudflare-tunnel already use).
  #
  # This becomes load-bearing at phase 4 of docs/postgres-credentials/PLAN.md,
  # when OpenBao's database secrets engine starts rotating these passwords on a
  # schedule. Without it the first rotation is an outage that looks like a
  # database fault.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              group: apps
              kind: Deployment
              name: pinepods
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pinepods
                annotations:
                  reloader.stakater.com/auto: "true"
          # The startup probe has to come the same way as the annotation above:
          # this chart exposes no probe values at all, so there is nothing to set
          # in `values`.
          #
          # Why it is needed. Measured boot is 144s (the pod's own
          # Initialized -> ContainersReady). The liveness probe allows
          # initialDelaySeconds 120 + 3 x periodSeconds 30 = 210s, so today the
          # app finishes with about 66s to spare and succeeds on its second
          # liveness attempt. That is the narrowest margin of any app in the
          # boot-budget sweep, and it is about to be handed a credential that
          # rotates on a schedule -- every rotation is a forced restart.
          #
          # Tandoor (#1142) is the precedent: 160s of boot against a 40s budget,
          # killed mid-collectstatic, and because each restart began the work
          # again it crash-looped six times rather than converging. Romm (#1148)
          # was the same shape caught before rotating instead of after.
          #
          # A startup probe removes the class of failure rather than widening
          # the margin: while it is pending, liveness and readiness do not run at
          # all, so a slow boot simply takes longer. 600s is ~4x the measured
          # boot. Steady-state behaviour is untouched.
          - target:
              version: v1
              group: apps
              kind: Deployment
              name: pinepods
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pinepods
              spec:
                template:
                  spec:
                    containers:
                      - name: pinepods
                        startupProbe:
                          httpGet:
                            path: /api/pinepods_check
                            port: http
                          periodSeconds: 10
                          timeoutSeconds: 5
                          failureThreshold: 60
  values:
    backend:
      # -- Enable backend deployment
      enabled: false

    ## PodPeople DB configuration
    ## Podpeople is a publicly available website in which you can get details on guests and hosts for podcasts that don't maintain podcast 2.0 in their feeds.
    ## If you do want to maintain it yourself you'll probably want to download a copy of the database here: https://podpeople.pinepods.online
    podpeople:
      # -- Enable PodPeople DB deployment
      enabled: false
      environment: {}
