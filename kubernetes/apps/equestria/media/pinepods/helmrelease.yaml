---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pinepods
spec:
  interval: 1h
  url: http://helm.pinepods.online
---
# HelmRelease for PinePods
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
spec:
  chart:
    spec:
      chart: pinepods
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: pinepods
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: Secret
      name: ${APP}-values
      valuesKey: values.yaml
  # pinepods reads its database password from the `pinepods-env` Secret via
  # envFrom, so a rotated password does not reach the running pod unless
  # something restarts it. Stakater Reloader does that, but only when the
  # annotation is on the WORKLOAD -- and this chart offers no value for
  # Deployment-level annotations, so it goes on with a post-render patch (the
  # same mechanism network/crowdsec and network/cloudflare-tunnel already use).
  #
  # This becomes load-bearing at phase 4 of docs/postgres-credentials/PLAN.md,
  # when OpenBao's database secrets engine starts rotating these passwords on a
  # schedule. Without it the first rotation is an outage that looks like a
  # database fault.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              group: apps
              kind: Deployment
              name: pinepods
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pinepods
                annotations:
                  reloader.stakater.com/auto: "true"
  values:
    backend:
      # -- Enable backend deployment
      enabled: false

    ## PodPeople DB configuration
    ## Podpeople is a publicly available website in which you can get details on guests and hosts for podcasts that don't maintain podcast 2.0 in their feeds.
    ## If you do want to maintain it yourself you'll probably want to download a copy of the database here: https://podpeople.pinepods.online
    podpeople:
      # -- Enable PodPeople DB deployment
      enabled: false
      environment: {}
