---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Plex
  category: &category Applications
  url: https://${APP}.${ROOT_DOMAIN}/web/
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/plex.svg
  access_policy:
    groups:
      - friends
      - family
  gatus:
    - url: https://${APP}.${ROOT_DOMAIN}/connections?X-Plex-Token=ref+openbao://secrets/clusters/equestria/apps/plex/token#/credential
      group: *category
      method: GET
      conditions:
      - "[STATUS] == 200"
