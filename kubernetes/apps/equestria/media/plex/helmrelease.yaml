---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        pod:
          annotations:
            # Attaches net1 on the flat Home LAN so GDM -- Plex's own client
            # discovery, confirmed bound to UDP 32410/32412/32413/32414 in the
            # running pod -- actually reaches LAN clients. Also carries Plex's
            # SSDP/DLNA multicast (239.255.255.250), which it had already
            # joined. NAD, evidence and caveats: ./lan-nad.yaml.
            k8s.v1.cni.cncf.io/networks: plex-lan-net
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        containers:
          *app :
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.3@sha256:4f1d88882a9883cc525e7c84b22c67c57416b7d3b35c3412329eeb07786433a7
            env:
              TZ: ${TIMEZONE}
              PUID: ${PUID}
              PGID: ${PGID}
              PLEX_ADVERTISE_URL: https://${APP}.${ROOT_DOMAIN}:443,https://plex.${CLUSTER_DOMAIN}:443,https://${APP}.${TAILSCALE_DOMAIN}:443,http://${APP}.${INTERNAL_CLUSTER_SERVICE}:32400
              PLEX_NO_AUTH_NETWORKS: 172.16.0.0/12,10.10.0.0/16,10.69.0.0/16,10.96.0.0/16,192.168.0.0/16,100.64.0.0/10
              PLEX_PURGE_CODECS: "true"
              # PLEX_PREFERENCE_FriendlyName: "Eris Plex"
              # PLEX_PREFERENCE_AcceptedEULA: "1"
              # PLEX_PREFERENCE_PublishServerOnPlexOnlineKey: "1"
              # PLEX_PREFERENCE_PlexOnlineHome: "1"
              # PLEX_PREFERENCE_DlnaEnabled: "1"
              # PLEX_PREFERENCE_PlexOnlineUsername:
              #   secretKeyRef:
              #     name: plex-token
              #     key: username
              # PLEX_PREFERENCE_PlexOnlineMail:
              #   secretKeyRef:
              #     name: plex-token
              #     key: email
              # PLEX_CLAIM_TOKEN:
              #   secretKeyRef:
              #     name: spike-management-credentials
              #     key: claim
            probes:
              # exec probes on purpose, and NOT tunable back to httpGet while
              # this pod carries the plex-lan-net ipvlan interface.
              #
              # A kubelet-dialed httpGet sources from the node's LAN IP. The
              # pod's net1 carries 10.10.206.21/16, whose connected route is
              # more specific than the eth0 default, so the reply is routed out
              # net1 -- and an ipvlan child cannot reach its own parent. The
              # probe times out, the pod never goes Ready, the Service loses its
              # endpoints and the HTTPRoute has no backend.
              #
              # This is the exact trap technitium's helmrelease already
              # documents; it was missed when the LAN attachment landed and took
              # plex and jellyfin down until this fix. Curling 127.0.0.1 from
              # inside the container never leaves the pod, so no return path is
              # involved.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - bash
                      - -c
                      - curl -fsS --max-time 8 http://127.0.0.1:32400/identity >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # capabilities: { drop: ["ALL"] }
            resources:
              requests:
                gpu.intel.com/i915: 1
                # 1 CPU requested, and deliberately NO cpu limit.
                #
                # The old 6-core request was sized against the wrong bottleneck:
                # the iGPU was shared 5 ways rather than 3, so transcodes
                # contended for GPU time and it read as a CPU shortage. Observed
                # steady state is single-digit millicores.
                #
                # This survives the 2026-08-22 revert of the media relocation
                # even though the memory cut made in the same PR did not. The
                # two had different causes: the memory limit was cut only to fit
                # a 16GB control plane, which is no longer a requirement,
                # whereas the CPU request was measured against the wrong
                # bottleneck and is equally wrong on a 64GB worker. CPU is also
                # compressible, so unlike a memory limit this cannot OOM
                # anything.
                #
                # No cpu limit on purpose: CPU is compressible, so without a
                # ceiling this takes whatever the node has spare and throttles
                # back proportionally under contention rather than being capped
                # while cores sit idle. The request is what sets that
                # proportional share, and what the scheduler reserves.
                cpu: 1
                # ⚠️  4Gi request / 8Gi limit, BOTH restored to their original
                # values. Both were cut on 2026-08-22 (to 1Gi / 4Gi) for one
                # reason only: to make this pod fit alongside etcd on a 16GB
                # control plane during the overnight media relocation. That
                # relocation is reverted -- plex stays on the media workers,
                # which have 64GB -- so the constraint that forced the cut is
                # gone.
                #
                # The 4Gi limit was sized from IDLE usage (~482Mi) rather than
                # PEAK, and plex was OOMKilled in production the same evening:
                # exit 137 at 2026-08-22T18:52:15Z, ~65 minutes after start.
                # Plex spikes hard during library scans and transcodes, so a
                # steady-state reading says nothing about the ceiling it needs.
                # Do not size a media memory limit off idle again.
                memory: 4Gi
              limits:
                gpu.intel.com/i915: 1
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 109, 303, 568, 10000]
        seccompProfile: { type: RuntimeDefault }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: In
                values:
                - "true"

    service:
      app:
        controller: plex
        type: ClusterIP
        ports:
          http:
            # `&port` used to live on the probe's httpGet; it moved here when the
            # probes became exec (see the probes block above). This is now the
            # first occurrence, so it must stay ahead of the route's `*port`.
            port: &port 32400

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
          - "plex.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      media:
        existingClaim: truenas-media
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      nfs-data:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/plex
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Metadata
            subPath: metadata
          - path: /config/Library/Application Support/Plex Media Server/Media
            subPath: media
          - path: /config/Library/Application Support/Plex Media Server/Scanners
            subPath: scanners
