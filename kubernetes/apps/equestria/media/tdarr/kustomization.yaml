---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./cronjob.yaml
  - ./definition.yaml
  - ./tailnet-service.yaml
# The volsync component this app's ks.yaml adds uses `commonLabels`, which
# also writes `driscoll.dev/name` and `kustomize.toolkit.fluxcd.io/force` into
# every Service SELECTOR. The chart's pods carry neither, so
# ./tailnet-service.yaml selected nothing
# and the operator stopped advertising svc:tdarr-server (2026-10-15). Patches
# run after the components' labels, so this takes the key back out.
patches:
  - target:
      kind: Service
      name: tdarr-server-tailnet
    patch: |-
      - op: remove
        path: /spec/selector/driscoll.dev~1name
      - op: remove
        path: /spec/selector/kustomize.toolkit.fluxcd.io~1force
