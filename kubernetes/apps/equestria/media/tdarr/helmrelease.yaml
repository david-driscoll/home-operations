---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tdarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 15m
  driftDetection:
    mode: enabled
  values:
    controllers:
      *app :
        type: deployment
        annotations:
          # Always up: excluded from the nightly 01:00-07:00 shed.
          downscaler/exclude: "true"
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 2.93.01@sha256:7a992a0f1e0e6b16a7514b498ee4072d238ede079f4f472d6c0130b438ed63ac
            env:
              TZ: ${TIMEZONE}
              PUID: 568
              PGID: 568
              serverURL: http://tdarr-server.${CLUSTER_CNAME}.svc.cluster.local:8266
              webUIPort: &web-port 8265
              internalNode: "false"
              inContainer: "true"
              nodeName:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              capabilities:
                add: ["SETGID", "SETUID"]
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v2/status
                    port: *web-port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
      tdarr-node:
        type: deployment
        annotations:
          # Always up: excluded from the nightly 01:00-07:00 shed.
          downscaler/exclude: "true"
        replicas: 2
        containers:
          app:
            image: &nodeImage
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 2.93.01@sha256:848a09b3d30a318a60fb1a87feeaa25b41b478dda62ad610595842bf235a96a9
            env:
              TZ: ${TIMEZONE}
              serverURL: http://tdarr-server.${CLUSTER_CNAME}.svc.cluster.local:8266
              inContainer: true
              nodeName:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
                gpu.intel.com/i915: 1
              limits:
                memory: 2Gi
                gpu.intel.com/i915: 1
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values:
                    - "true"
      # One extra encoder on each control plane (milky-way, othalla, pegasus:
      # Intel N150s with a UHD iGPU, 46d4). Stateless -- media is NFS and the
      # node registers itself by spec.nodeName -- so none of the relocation
      # pain behind the #1051 revert (volumes, descheduler) applies.
      #
      # The control plane is the one thing here that must not starve: the
      # hard CPU limit keeps a CPU-decoded job (Hi10P, Xvid, MPEG-2) to half
      # of an N150's four cores, so etcd and the API server keep the rest.
      # QSV encodes barely touch the CPU either way.
      tdarr-node-cp:
        type: deployment
        annotations:
          # Always up: excluded from the nightly 01:00-07:00 shed.
          downscaler/exclude: "true"
        replicas: 3
        containers:
          app:
            image: *nodeImage
            env:
              TZ: ${TIMEZONE}
              serverURL: http://tdarr-server.${CLUSTER_CNAME}.svc.cluster.local:8266
              inContainer: true
              nodeName:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              # Seed the worker limits on first registration: one GPU
              # encoder, nothing else. Flow jobs are CPU-class tasks, so the
              # node also needs allowGpuDoCpu (not settable by env) -- set it
              # once with tdarr_update_node after the node first appears.
              transcodegpuWorkers: 1
              transcodecpuWorkers: 0
              healthcheckgpuWorkers: 0
              healthcheckcpuWorkers: 0
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
                gpu.intel.com/i915: 1
              limits:
                cpu: "2"
                memory: 2Gi
                gpu.intel.com/i915: 1
        pod:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                  - key: intel.feature.node.kubernetes.io/gpu
                    operator: In
                    values:
                    - "true"
            # One per control plane: three replicas, three N150s.
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: tdarr-node-cp
    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [568]
    service:
      tdarr-server:
        forceRename: tdarr-server
        controller: *app
        ports:
          http:
            port: &server-port 8266
        annotations:
          tailscale.com/expose: "true"
          tailscale.com/hostname: tdarr-server
          tailscale.com/tags: tag:observability
          tailscale.com/proxy-group: tailnet-outbound
      *app :
        controller: *app
        ports:
          http:
            port: *web-port
    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *web-port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
      server:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}-server.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: tdarr-server
                port: *server-port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          tdarr:
            app:
              - path: /app/configs
                subPath: config
              - path: /app/server
                subPath: server
      media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media/
