---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &name tdarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *name
    driscoll.dev/name: *name
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *name
      driscoll.dev/name: *name
  dependsOn:
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/equestria/media/tdarr
  prune: true
  wait: true
  force: false
  interval: 1h
  timeout: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/volsync
  postBuild:
    substitute:
      # Phase 3, batch 2 (docs/plans/host-owned-backups.md): the restic repository
      # lives in Garage. Its NFS history is copied across by
      # volsync-system/garage-history-copy.
      VOLSYNC_BACKEND: garage
      APP: *name
      NAMESPACE: *namespace
