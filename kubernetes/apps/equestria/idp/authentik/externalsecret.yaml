---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# authentik's credentials, from the SAME OpenBao records the alpha-site copy
# resolves. Two sites, one secret key, one database role:
#
#   - The secret key stays filed under alpha-site, where it has lived since doc
#     07. It signs sessions and encrypts secrets at rest in the shared database,
#     so a different value here would silently break every stored secret for
#     BOTH sites. eso-equestria reads every clusters/* subtree.
#   - The database role is the one stacks/system mints for authentik-pg.
#
# Only secrets live here; behaviour settings are plain env in helmrelease.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        AUTHENTIK_POSTGRESQL__USER: "{{ .pg_username }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .pg_password }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: clusters/alpha-site/apps/authentik/secret-key
        property: credential
    - secretKey: pg_username
      remoteRef:
        key: clusters/equestria/apps/authentik-pg/app
        property: username
    - secretKey: pg_password
      remoteRef:
        key: clusters/equestria/apps/authentik-pg/app
        property: password
