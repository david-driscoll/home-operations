---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dawarich
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    # Rails cache, the Sidekiq queue and ActionCable all live in the shared
    # Valkey -- three separate database indices, claimed in ./helmrelease.yaml.
    - name: valkey
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/dawarich
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # ⚠️ BRAND-NEW DATABASE, so the new-app ordering trap in
    # components/postgres/ks.yaml applies exactly as it did for `reitti` on
    # 2026-09-20: `stacks/system` creates `database/static-roles/dawarich`,
    # which runs `ALTER ROLE ... PASSWORD` immediately and fails with
    #   ERROR: role "dawarich" does not exist (SQLSTATE 42704)
    # if CNPG has not applied the DatabaseRole yet. Expect the `system` stack
    # to stall ONCE; recovery is the four commands in that file's ORDER OF
    # OPERATIONS block. In practice reitti won the race because Flux applied
    # the role well before the next Pulumi run -- but do not count on it.
    #
    # The database needs postgis AND pgcrypto, neither of which this app's
    # login role can create; ./kustomization.yaml patches the Database CR.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # Imports land in /var/app/storage (Active Storage) and the watched-import
      # folder; `ARCHIVE_RAW_DATA` is left at its `false` default so the raw
      # upload is not kept a second time. 10Gi is sized for a household's
      # history plus one Google Takeout in flight, and longhorn can expand it.
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
