---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
#
# Prometheus picks this up without any further wiring: the operator runs with
# `serviceMonitorSelectorNilUsesHelmValues: false`
# (apps/observability/prometheus/values.yaml), so ServiceMonitors are selected
# from every namespace.
#
# WHAT IS SCRAPED: the Sidekiq container's Yabeda exporter on :9394, the
# Service's `metrics` port -- NOT Rails' /metrics on :3000.
#
# WHY. Upstream's intended target is the web container's /metrics, which
# concatenates its own series with the ones it fetches from :9394. But that is
# a Rails route (config/routes.rb mounts it), so it sits behind
# ActionDispatch::SSL, and APPLICATION_PROTOCOL=https turns `force_ssl` on. A
# plain-HTTP scrape gets a 301 to https://...:3000/metrics, Prometheus follows
# it into Puma's plain-HTTP port, the TLS handshake fails, and TargetDown
# fires. The kubelet probes dodge this with an X-Forwarded-Proto header; a
# ServiceMonitor endpoint cannot set arbitrary request headers
# (proxyConnectHeader is only for a CONNECT proxy). The exporter on :9394 is a
# bare WEBrick + Rack app with no Rails middleware, so force_ssl never sees it.
#
# WHAT THAT COSTS. Only series recorded in the Sidekiq process arrive:
# sidekiq_* (jobs, queue depth/latency, process counts) and dawarich_archive_*.
# Everything the WEB process records is gone -- rails_* request timings,
# puma_*, dawarich_map_* (tile and point-move timings) and the web side's
# activerecord_*. Accepted trade-off. Undo this if Dawarich ever gains a way to
# exempt /metrics from force_ssl, or to serve it on a plain-HTTP port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${APP}
spec:
  selector:
    matchLabels:
      # This comes from app-template's own Service template, NOT from ks.yaml's
      # `commonMetadata` -- that only labels the objects the Kustomization
      # applies (this ServiceMonitor, the HelmRelease, the ExternalSecrets),
      # and the Service is created afterwards by Helm. The rendered Service
      # carries app.kubernetes.io/{name,instance,service}, managed-by,
      # helm.sh/chart and the two helm.toolkit labels; `name` is the one that
      # is both stable and unique here.
      #
      # Checked against `flate build hr` output rather than assumed. See the
      # sablier ServiceMonitor for what getting this wrong costs: a silently
      # absent target, indistinguishable from a dead app, which also disarms
      # whatever alert was watching it.
      app.kubernetes.io/name: ${APP}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 1m
      scrapeTimeout: 30s
      # ⚠️ REQUIRED. config/initializers/sidekiq.rb wraps the exporter in
      # Dawarich::MetricsBasicAuth, the same middleware as the Rails route, with
      # no anonymous mode -- an unauthenticated scrape gets 401. Same Secret the
      # containers read, so the credentials cannot drift.
      #
      # No relabeling: the old rewrite of __address__ to the Service FQDN
      # existed only to satisfy Rails host authorization. The exporter is not
      # Rails, so the plain pod-IP target is fine.
      basicAuth:
        username:
          name: ${APP}-metrics
          key: METRICS_USERNAME
        password:
          name: ${APP}-metrics
          key: METRICS_PASSWORD
