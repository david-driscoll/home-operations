---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# FOUR Secrets, and the split is deliberate -- every `extract` in an
# ExternalSecret must resolve or the WHOLE object fails, taking its Secret and
# therefore the pod with it:
#
#   ${APP}-env      Postgres credential. Available as soon as
#                   components/postgres reconciles.
#   ${APP}-secrets  SECRET_KEY_BASE, minted in-cluster. Never rotates.
#   ${APP}-metrics  The /metrics basic-auth pair, minted in-cluster.
#   ${APP}-oidc     The authentik credential, which does NOT exist until
#                   `stacks/applications` has read ./definition.yaml -- i.e.
#                   after this app's first Flux apply. Mounted `optional: true`
#                   in ./helmrelease.yaml so the pod boots without SSO instead
#                   of sitting in CreateContainerConfigError.
#
# Nothing here needs seeding in OpenBao by hand, unlike ../outline: the two
# app-owned secrets come from Password generators.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Dawarich's entrypoints read these five discretely (they only parse
        # DATABASE_URL when it is set, and then re-derive exactly these), so the
        # individual fields are what is wanted here rather than a URI spelling.
        DATABASE_HOST: "{{ .postgres_hostname }}"
        DATABASE_PORT: "{{ .postgres_port }}"
        DATABASE_NAME: "{{ .postgres_database }}"
        DATABASE_USERNAME: "{{ .postgres_username }}"
        DATABASE_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Rails' SECRET_KEY_BASE. Generated in-cluster rather than seeded into OpenBao
# because it is this instance's own secret with no other consumer -- the same
# call media/jellyfin makes for its Meilisearch key.
#
# No symbols: this value is interpolated into a shell environment by the
# entrypoint and read back by Rails, and a 96-character alphanumeric secret has
# far more entropy than anything that derives from it needs.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-secret-key-base
spec:
  length: 96
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. A Password generator mints a
# NEW value on every call, so `Periodic` would silently rotate SECRET_KEY_BASE
# on a schedule. Rails derives its cookie signing and encryption keys from it:
# a rotation logs every session out and invalidates outstanding password-reset
# and confirmation tokens. Same reasoning, and same spelling, as
# media/jellyfin-pg/meilisearch-secret.yaml.
#
# `deletionPolicy: Retain` keeps the Secret if the provider call ever fails.
# It does NOT survive this ExternalSecret being pruned -- `creationPolicy:
# Owner` puts an ownerReference on the Secret, so deleting this object
# garbage-collects the key and the next boot mints a different one. That costs
# logged-out sessions, not data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secrets
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-secret-key-base
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-metrics-password
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The /metrics basic-auth pair. Dawarich REQUIRES it -- the endpoint answers
# 401 without credentials, there is no anonymous mode -- and the same pair is
# used twice: once by ./servicemonitor.yaml to authenticate Prometheus, and
# once by the web container to fetch the Sidekiq container's exporter over
# localhost (SIDEKIQ_METRICS_URL in ./helmrelease.yaml).
#
# `CreatedOnce` again, for a duller reason than SECRET_KEY_BASE: a rotation
# here would only break scraping until both pods caught up, but there is no
# reason to churn it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-metrics
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-metrics
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        METRICS_USERNAME: prometheus
        METRICS_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-metrics-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # PASSED THROUGH WITH ITS TRAILING SLASH, deliberately -- the same call
        # ../reitti/externalsecret.yaml documents at length and which was
        # proven correct in production on 2026-09-20.
        #
        # authentik's per-provider issuer is
        # https://<authentik>/application/o/<slug>/ WITH a trailing slash
        # (components/authentik.ts builds openid_configuration_url as
        # `${issuerUrl}.well-known/...`, relying on it). Ruby's openid_connect
        # gem, like Spring, appends `/.well-known/openid-configuration` by
        # concatenation AND then validates the issuer claim against the
        # configured string -- Dawarich even has a dedicated error branch for
        # it ("Issuer mismatch" in users/omniauth_callbacks_controller.rb).
        # Trimming the slash tidies the URL and breaks the validation instead.
        # authentik collapses the resulting duplicate slash; verified.
        OIDC_ISSUER: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
