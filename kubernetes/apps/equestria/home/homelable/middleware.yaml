---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# The live-view block, referenced by the first HTTPRoute rule in
# ./helmrelease.yaml. See that rule's comment for what is blocked and why.
#
# HOW IT BLOCKS. Traefik has no "return a fixed status" middleware, and Gateway
# API has no equivalent filter. What it does have is an ipAllowList, so this
# allows exactly one source range -- 192.0.2.0/24, RFC 5737 TEST-NET-1, which is
# reserved for documentation and can never be a real client. Nothing matches, so
# every request on these paths gets a 403 and never reaches the backend.
#
# The `errors` hop is first so it wraps the ipAllowList and dresses that 403 in
# the estate's error page, the same way `local-user` chains them for the
# catch-all rule. Ordering matters: Traefik's error middleware only sees status
# codes produced by handlers BELOW it in the chain.
#
# MUST live in this namespace. An HTTPRoute's ExtensionRef resolves middleware in
# the ROUTE's own namespace with no way to name another -- the trap documented at
# length in kubernetes/components/common/middleware.yaml. The `errors` reference
# inside the chain is a different lookup and may cross namespaces
# (providers.kubernetesCRD.allowCrossNamespace).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${APP}-liveview-block
spec:
  chain:
    middlewares:
      - name: error-pages
        namespace: network
      - name: ${APP}-liveview-deny
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  # Distinct from the chain above for the reason the crowdsec alias in
  # components/common/middleware.yaml spells out: a chain whose entry shares its
  # own name resolves to itself and Traefik drops every router carrying it with
  # "recursion detected".
  name: ${APP}-liveview-deny
spec:
  ipAllowList:
    sourceRange:
      - 192.0.2.0/24
