---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
#
# The MCP server's tailnet router. Hand-written rather than supplied by
# components/tailscale because that component emits exactly one host per app,
# and it is already spending it on ${APP}.${TAILSCALE_DOMAIN} for the UI.
# ./mcp-tailnet-ks.yaml is the other half -- the Ingress that gives this
# hostname a tailnet VIP.
#
# TAILNET ENTRYPOINT ONLY -- deliberately no HTTPRoute on the `internal`
# Gateway. MCP clients authenticate with a static X-API-Key header and cannot
# complete an interactive OIDC redirect, so authentik forward-auth would *break*
# this service rather than protect it. The boundary therefore has to be
# network-level: an endpoint whose only credential is a static key must not be
# reachable from the flat /16 this app is about to scan.
#
# MCP_SERVICE_KEY (mcp -> backend) also bypasses OIDC by design, but only over
# the pod's loopback, and the backend has no Service of its own at all.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${APP}-mcp-tailnet
  annotations:
    # providers.kubernetesCRD.ingressClass is `internal` in
    # apps/network/traefik/values.yaml, so Traefik only picks up CRs with this.
    kubernetes.io/ingress.class: internal
spec:
  entryPoints:
    - tailscale
  routes:
    - kind: Rule
      # Explicit, matching the 10 that components/tailscale/ingressroute.yaml
      # pins, so rule LENGTH never gets to decide ordering between them.
      priority: 10
      match: Host(`${APP}-mcp.${TAILSCALE_DOMAIN}`)
      middlewares:
        # Network gate, no SSO -- the counterpart of `local-user`. NOT
        # `tailscale-user`: this app's definition has no authentik `proxy:`
        # block, so the outpost has no application for this hostname and would
        # answer 400 "no app for hostname".
        - name: tailscale-local
          namespace: network
      services:
        - name: ${APP}-mcp
          port: http
