---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Everything the Dockge stack's `.env` resolved through `ref+openbao://`, minus
# the values that are plain configuration rather than secrets -- those moved to
# `env:` in ./helmrelease.yaml where they are visible in git.
#
# Both `extract` paths must exist before this lands. ESO fails the WHOLE
# ExternalSecret on one missing path, so a half-done OpenBao move leaves the
# Secret empty and the pod without a SECRET_KEY (the backend refuses to start
# in OIDC mode without one). See docs/runbooks/homelable-celestia-to-equestria.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # >= 32 bytes is a hard requirement when AUTH_MODE=oidc; the app refuses
        # to start otherwise (backend/app/core/config.py validate_auth_settings).
        SECRET_KEY: "{{ .homelable_secret_key }}"
        # homelable wants the *discovery document*, not the bare issuer. The
        # applications stack writes both to the generated credential
        # (components/authentik.ts `issuer` and `openid_configuration_url`);
        # this is the latter.
        OIDC_DISCOVERY_URL: "{{ .oidc_openid_configuration_url }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # Read-only canvas at /view?key=... -- tailnet-only, see ./middleware.yaml.
        LIVEVIEW_KEY: "{{ .homelable_live_view_key }}"
        # Enables GET /api/v1/stats/summary, authenticated by the X-API-Key
        # *header*. Consumed by dynacat; see dashboard/externalsecret.yaml,
        # which reads the same OpenBao item.
        HOMEPAGE_API_KEY: "{{ .homelable_homepage_api_key }}"
        # MCP_API_KEY:     AI client -> MCP server (X-API-Key)
        # MCP_SERVICE_KEY: MCP server -> backend, bypassing OIDC
        # Distinct values: they authenticate different hops, and reusing one
        # would collapse two trust boundaries.
        MCP_API_KEY: "{{ .homelable_mcp_api_key }}"
        MCP_SERVICE_KEY: "{{ .homelable_mcp_service_key }}"
  dataFrom:
    # Moved from clusters/celestia/apps/homelable/keys as part of this
    # migration -- the app no longer runs on celestia, and eso-equestria reads
    # its own cluster prefix without a policy change.
    - extract:
        key: clusters/equestria/apps/homelable/keys
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "homelable_$1"
    # Minted in this namespace by stacks/applications from ./definition.yaml.
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
