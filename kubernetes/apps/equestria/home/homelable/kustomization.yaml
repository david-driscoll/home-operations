---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./definition.yaml
  - ./externalsecret.yaml
  - ./middleware.yaml
  - ./ciliumnetworkpolicy.yaml
# No MCP route of any kind here. The MCP surface lives in the `agents`
# namespace as an MCPRemoteProxy joining the `agent-tools` group --
# kubernetes/apps/agents/agent-tools-servers/homelable.yaml -- which reaches
# the `homelable-mcp` Service in ./helmrelease.yaml over the cluster network. That replaced a
# hand-rolled tailnet hostname (its own IngressRoute plus a nested
# Kustomization rendering an Ingress into `network`, because
# components/tailscale emits only one host per app) whose only credential was
# a static X-API-Key.
configMapGenerator:
  # The frontend's nginx config: upstream's, plus the X-MCP-Service-Key strip.
  # See the file's header, and the `nginx` persistence in ./helmrelease.yaml.
  - name: homelable-nginx
    files:
      - homelable.conf.template=./resources/homelable.conf.template
    options:
      # The HelmRelease names it; Reloader restarts the pod when it changes.
      disableNameSuffixHash: true
      annotations:
        # An nginx template: Flux's postBuild substitution would empty its
        # ${BACKEND_UPSTREAM}, which the image's entrypoint renders itself.
        kustomize.toolkit.fluxcd.io/substitute: disabled
