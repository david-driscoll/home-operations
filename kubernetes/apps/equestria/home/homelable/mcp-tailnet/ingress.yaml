---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/ingress.json
#
# The MCP server's tailnet front door, rendered into `network` by
# ../mcp-tailnet-ks.yaml.
#
# The Tailscale operator turns this into a VIP service on the tailnet-outbound
# ProxyGroup, terminates TLS with the tailnet cert, and reverse-proxies cleartext
# to the backend. The backend is TRAEFIK, which then dispatches on the Host
# header (tailscaled preserves it) to ../ingressroute-mcp.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP}-mcp-tailscale-ingress
  annotations:
    tailscale.com/proxy-group: tailnet-outbound
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
    tailscale.com/tags: "tag:apps"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      # Traefik's real Service, which is why this manifest has to be rendered
      # into `network` -- see ../mcp-tailnet-ks.yaml.
      name: traefik
      port:
        name: tailscale
  tls:
    - hosts:
        - ${APP}-mcp
