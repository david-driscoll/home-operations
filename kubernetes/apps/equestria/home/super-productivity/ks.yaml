---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app super-productivity
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/home/super-productivity
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/tailscale
  postBuild:
    substitute:
      # Mirrors this app's internal HTTPRoute, which gates every path behind
      # authentik with no API carve-out -- so the tailnet path does the same and
      # TAILSCALE_API_MIDDLEWARE is pinned rather than left at its
      # `tailscale-local` default.
      TAILSCALE_MIDDLEWARE: tailscale-user
      TAILSCALE_API_MIDDLEWARE: tailscale-user
      APP: *app
      NAMESPACE: *namespace
