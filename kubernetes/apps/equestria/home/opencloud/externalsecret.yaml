---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# TWO Secrets, not one, and the split is load-bearing -- the same reasoning
# ./..//reitti/externalsecret.yaml spells out.
#
# `${APP}-env` carries values that exist before this app ever reconciles: one
# OpenBao document seeded by hand. `${APP}-oidc` carries the authentik
# credential, which does NOT exist until `stacks/applications` has read
# ./definition.yaml and created the provider -- necessarily AFTER this app's
# first Flux apply. Folding the two together would leave `${APP}-env`
# unrenderable until that Pulumi run, and the pod stuck in
# CreateContainerConfigError rather than running: every `extract`/`data` entry
# in an ExternalSecret must resolve or the WHOLE object fails, taking its Secret
# with it.
#
# Separate, `${APP}-oidc` simply fails to sync until the Pulumi run,
# ./helmrelease.yaml mounts it `optional: true`, and OpenCloud boots without an
# issuer configured. Reloader restarts the pod when the Secret lands.
#
# ⚠ SEED BEFORE FIRST RECONCILE. `${APP}-env` reads one OpenBao document that
# nothing creates automatically:
#
#   bao kv put secrets/clusters/${CLUSTER_CNAME}/apps/opencloud/config \
#     idm_admin_password="$(openssl rand -base64 30)" \
#     collabora_admin_password="$(openssl rand -base64 30)"
#
# ⚠ There is a STALE, UNREFERENCED `opencloud` entry under `secrets/shared/`
# left over from the original op-to-bao migration (docs/openbao-shared-secrets-reorg.md).
# It is not this app's. Do not reuse it, and do not be reassured by finding it --
# check `bao kv list secrets/clusters/${CLUSTER_CNAME}/apps/opencloud` instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # The built-in IDM's `admin` account. OpenCloud REQUIRES this on first
        # start -- without it the container restart-loops -- even though nobody
        # logs in with it here: ./helmrelease.yaml excludes the `idp` service,
        # so there is no local login form to type it into. It exists because
        # `idm` is kept as the user directory (see the OC_EXCLUDE_RUN_SERVICES
        # note there), and this is the password on the directory's own admin
        # bind identity.
        #
        # Upstream is explicit that the value is consumed on FIRST START ONLY
        # and ignored afterwards; rotating it here does not change the stored
        # credential, which lives in the config subPath of the PVC.
        IDM_ADMIN_PASSWORD: "{{ .opencloud_idm_admin_password }}"
  data:
    - secretKey: opencloud_idm_admin_password
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/config
        property: idm_admin_password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Collabora's admin console (https://collabora.${ROOT_DOMAIN}/browser/dist/admin/admin.html),
# which lists live documents, memory and per-document CPU. A separate Secret
# from `${APP}-env` because it is consumed by a DIFFERENT controller -- the
# collabora Deployment -- and `envFrom` is per-container: folding them together
# would put the IDM admin password into Collabora's environment for no reason.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-collabora
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-collabora
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Lowercase, and that is not a typo -- the collabora/code image reads
        # literally `username` and `password` from the environment, not
        # COLLABORA_* or anything upper-cased.
        username: "admin"
        password: "{{ .opencloud_collabora_admin_password }}"
  data:
    - secretKey: opencloud_collabora_admin_password
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/config
        property: collabora_admin_password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Written by `stacks/applications` from ./definition.yaml. After `pulumi up`,
# nudge it rather than waiting for the refresh:
#
#   kubectl -n equestria annotate externalsecret opencloud-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # PASSED THROUGH WITH ITS TRAILING SLASH, deliberately -- the same trap
        # ../reitti/externalsecret.yaml documents at length, reached through a
        # different library.
        #
        # OpenCloud's proxy uses coreos/go-oidc, which (a) fetches
        # `<issuer> + "/.well-known/openid-configuration"` by string
        # concatenation with no path normalisation, and (b) then asserts the
        # discovery document's `issuer` claim equals the configured string
        # EXACTLY. authentik's per-provider issuer is
        # https://<authentik>/application/o/<slug>/ -- WITH a trailing slash --
        # so (a) produces a double slash and trimming the slash to tidy that up
        # breaks (b) with "oidc: issuer did not match".
        #
        # (a) is harmless: authentik's Go front-end collapses duplicate slashes
        # before Django routing. So the unmodified value satisfies both halves,
        # and `oidc_openid_configuration_url` (which tududi uses instead) is NOT
        # usable here -- go-oidc wants the issuer and appends the well-known
        # path itself.
        OC_OIDC_ISSUER: "{{ .oidc_issuer }}"
        # Should resolve to `web`, because ./definition.yaml pins `clientId`.
        # Read from the credential rather than hardcoded so that a change there
        # cannot silently desynchronise the two.
        WEB_OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
