# Radicale configuration, mounted at /etc/radicale/config in the sidecar.
#
# Reduced from opencloud-eu/opencloud-compose's config/radicale/config to the
# settings this deployment actually changes; everything omitted is upstream's
# default. The file is named radicale.conf here only so kustomize's
# configMapGenerator has a sane key -- ../helmrelease.yaml mounts it with a
# subPath onto the extensionless path Radicale expects.

[server]
# Bound on all interfaces because that is the only thing that works inside a
# container, NOT because anything outside this pod can reach it: Radicale is a
# sidecar and no Service publishes 5232. See the security note in ./proxy.yaml.
hosts = 0.0.0.0:5232

[auth]
# Radicale performs NO authentication. It reads the username straight out of the
# X-Remote-User header that OpenCloud's proxy sets after it has authenticated
# the request against authentik, which is what makes a single sign-on session
# work for CalDAV clients.
#
# ⚠ This means anything able to reach port 5232 can act as ANY user by setting
# one header. The containment is that the port is pod-local. Read ./proxy.yaml
# before changing how Radicale is reached.
type = http_x_remote_user

[web]
# No web UI. Clients talk CalDAV/CardDAV; the browser UI is OpenCloud's.
# Upstream's config documents an optional /caldav/.web/ passthrough for the
# internal UI -- deliberately not enabled, because it is `unprotected: true` in
# the proxy and asks for its own password, which there is none of here.
type = none

[storage]
# Give every user a calendar and an address book the first time they sync,
# rather than an empty account that most clients render as a silent failure.
predefined_collections = {
    "def-addressbook": {
       "D:displayname": "Personal Address Book",
       "tag": "VADDRESSBOOK"
    },
    "def-calendar": {
       "C:supported-calendar-component-set": "VEVENT,VJOURNAL,VTODO",
       "D:displayname": "Personal Calendar",
       "tag": "VCALENDAR"
    }
  }
