---
# What the `holm-config` Kustomization (./holm-config.yaml) may do, since it
# applies whatever the setup guide's `deploy/holm` branch holds: create
# ConfigMaps, and change only holm-config. kustomize-controller impersonates
# this ServiceAccount for the apply, the health check and the inventory.
#
# `create` cannot be limited by name (the object has no name to check until it
# exists), so a bad push could add ConfigMaps to equestria, which nothing
# reads. Changing any existing one but holm-config is refused, as is every
# other kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holm-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: holm-config
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["holm-config"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: holm-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: holm-config
subjects:
  - kind: ServiceAccount
    name: holm-config
