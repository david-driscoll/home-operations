---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# The holm-config ConfigMap, from the setup guide's `deploy/holm` branch
# (../source.yaml): config.yml plus the kustomization.yaml the guide's CI
# writes beside it. It re-applies when CI pushes a new config, and Holm rereads
# the file within seconds.
#
# Acts as the `holm-config` ServiceAccount (./rbac.yaml) and has no postBuild
# substitution, because it is rendered by `holm-guide` rather than cluster-apps
# (../ks.yaml says why both matter). Every dollar-brace variable in config.yml
# is Holm's own, expanded at startup from its container's environment.
#
# This took over the holm-config ConfigMap from `holm`, which used to generate
# it from a copy of the file in this repo (same name, so the mount is
# unchanged). The `dependsOn` that `holm` gained in the same commit did NOT
# protect that hand-over: on 2026-11-05 `holm` reconciled the new revision
# with its old spec, before cluster-apps applied the dependsOn, and pruned
# the ConfigMap. It was re-created by hand with this Kustomization's owner
# labels and adopted on the next apply. Moving ownership of a live object
# between Kustomizations needs two PRs, or a prune-disabled annotation on the
# old owner first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: holm-config
  labels:
    app.kubernetes.io/name: holm
    driscoll.dev/name: holm
spec:
  serviceAccountName: holm-config
  targetNamespace: equestria
  path: ./
  # Never prune: removing the ConfigMap stops Holm, and a config that is wrong
  # is better than none.
  prune: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: setup-guide
