---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # The connection string carries NO credentials on purpose. yarr logs
        # the whole -db value at startup ("using db file ..."), so a URI with
        # the password in it would put the password in Loki on every start.
        # lib/pq fills the user and password in from PGUSER / PGPASSWORD.
        YARR_DB: "postgres://{{ .postgres_hostname }}:{{ .postgres_port }}/{{ .postgres_database }}?sslmode=disable"
        PGUSER: "{{ .postgres_username }}"
        PGPASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
