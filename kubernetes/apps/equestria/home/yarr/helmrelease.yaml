---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app yarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          # yarr reads PGPASSWORD once, at process start, so the 30-day
          # rotation only reaches it through this restart.
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          *app :
            image:
              repository: ghcr.io/nkanaev/yarr
              tag: v2.9@sha256:804f15f7eaa8669e839aa420d584174a0566fee7c28ef4448b0468f4110f3c16
            # The image's CMD is `-addr 0.0.0.0:7070 -db /data/yarr.db`, and a
            # flag beats its environment variable -- so leaving CMD alone would
            # silently run on SQLite inside the container and ignore YARR_DB.
            # Restating the args without -db is what makes PostgreSQL apply.
            args:
              - -addr
              - 0.0.0.0:7070
            env:
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: ${APP}-env
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            probes:
              # /manifest.json is served without touching the database, so a
              # PostgreSQL outage leaves the pod Ready; yarr has no health
              # endpoint that opens a connection.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: &port 7070
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault

    persistence:
      # OPML imports are buffered to the temp dir; the root filesystem is
      # read-only.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user
