---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
#
# Every credential below that is NOT owned by another system is generated
# in-cluster rather than seeded into OpenBao by hand, so nothing has to exist
# before the first reconcile. Each ExternalSecret that references this generator
# gets its OWN value. No symbols: the values pass through shell and PHP.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-password
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The break-glass LOCAL admin, created by the image's installer on first boot.
# It is the one account that works when authentik does not:
#
#   https://cloud.${ROOT_DOMAIN}/login?direct=1     user: ncadmin
#   kubectl -n equestria get secret nextcloud-admin \
#     -o jsonpath='{.data.NEXTCLOUD_ADMIN_PASSWORD}' | base64 -d
#
# The installer reads this ONCE; afterwards the password lives (hashed) in the
# database. CreatedOnce + Retain keep this Secret stable, but if it is ever
# regenerated the stored password does NOT change with it -- reset it with
# `occ user:resetpassword ncadmin` from inside the pod.
#
# `ncadmin`, not an authentik username, and zz-app.config.php sets
# user_oidc.soft_auto_provision=false so an OIDC login cannot adopt it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-admin
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_ADMIN_USER: ncadmin
        NEXTCLOUD_ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The serverinfo token. ./resources/10-configure.sh writes it into Nextcloud
# (NC_METRICS_TOKEN) and the exporter sidecar presents it (NEXTCLOUD_AUTH_TOKEN)
# -- one value under the two names each side expects. Regenerable: a new value
# is re-applied by the hook on the restart Reloader triggers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-metrics
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-metrics
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        NC_METRICS_TOKEN: "{{ .password }}"
        NEXTCLOUD_AUTH_TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Collabora's admin console (https://collabora.${ROOT_DOMAIN}/browser/dist/admin/admin.html).
# Separate from the Nextcloud Secrets because it is consumed by a different
# controller, and envFrom is per-container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-collabora
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-collabora
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Lowercase on purpose: the collabora/code image reads literally
        # `username` and `password` from the environment.
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The rotating Postgres credential from components/postgres. POSTGRES_* are the
# names the image's installer reads on first boot AND the names
# ./resources/zz-db.config.php reads on every request afterwards, which is what
# makes the 30-day rotation safe. Refreshed every 4m like the other rotating
# consumers, so a rotation reaches the pod (via Reloader) within minutes.
#
# On first deploy this fails until the Pulumi `system` stack has created the
# static role -- see the ORDER OF OPERATIONS block in
# components/postgres/ks.yaml, including its last step (force-sync this
# ExternalSecret if it stays stuck on "Secret does not exist").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        POSTGRES_HOST: "{{ .postgres_hostname }}:{{ .postgres_port }}"
        POSTGRES_DB: "{{ .postgres_database }}"
        POSTGRES_USER: "{{ .postgres_username }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Written by `stacks/system` from ./definition.yaml, so it cannot exist
# on the first Flux apply. Kept apart from every other Secret for that reason
# (a single unresolvable extract fails a whole ExternalSecret), and mounted
# `optional: true`: Nextcloud boots with the local login until this lands, then
# Reloader restarts it and ./resources/10-configure.sh configures user_oidc.
# Reloader does NOT fire on Secret CREATION, only on change -- if SSO is still
# missing after the Pulumi run, delete the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # The full discovery URL, which is what user_oidc's --discoveryuri
        # wants (unlike go-oidc in OpenCloud, it does not append the
        # well-known path itself).
        OIDC_DISCOVERY_URL: "{{ .oidc_openid_configuration_url }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
