; Mounted at /usr/local/etc/php/conf.d/zz-nextcloud.ini, sorting after the
; image's opcache-recommended.ini so these win. Sized for a family (<10 users).
;
; memory_limit and upload_max_filesize come from PHP_MEMORY_LIMIT and
; PHP_UPLOAD_LIMIT in ../helmrelease.yaml, which the image turns into its own
; nextcloud.ini.
opcache.memory_consumption=256
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=20000
opcache.revalidate_freq=60
opcache.save_comments=1

; APCu is memcache.local (zz-redis.config.php). enable_cli is required or every
; occ and cron.php run logs "Memcache \OC\Memcache\APCu not available".
apc.shm_size=128M
apc.enable_cli=1
