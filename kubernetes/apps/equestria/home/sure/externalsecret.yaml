---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# TWO Secrets, and the split is deliberate -- every `extract` in an
# ExternalSecret must resolve or the WHOLE object fails, taking its Secret and
# therefore the pod with it:
#
#   <app>-env   The four Rails keys (OpenBao) and the Postgres credential
#               (components/postgres). This is the chart's
#               `rails.existingSecret`, so both Deployments and the migrate
#               Job hard-require it.
#   <app>-oidc  The authentik credential, which does NOT exist until
#               `stacks/system` has read ./definition.yaml -- i.e. after
#               this app's first Flux apply. Mounted `optional: true` in
#               ./helmrelease.yaml so the pod boots without SSO instead of
#               sitting in CreateContainerConfigError. Same split as
#               ../dawarich.
#
# ⚠ `clusters/<cluster>/apps/sure/keys` MUST BE SEEDED IN OPENBAO before this
# app first reconciles. It is one KV document with four fields:
#
#   secret_key_base       openssl rand -hex 64
#   primary_key           openssl rand -hex 16   (32 chars, what
#   deterministic_key     openssl rand -hex 16    `rails db:encryption:init`
#   key_derivation_salt   openssl rand -hex 16    emits)
#
# OpenBao rather than an in-cluster Password generator (../dawarich's choice
# for SECRET_KEY_BASE), because of what the three ACTIVE_RECORD_ENCRYPTION_*
# values protect. Sure encrypts provider credentials, API keys and bank-sync
# access URLs at rest with them. A generator-minted Secret is garbage-collected
# with its ExternalSecret and the next boot mints different keys -- for
# SECRET_KEY_BASE that costs logged-out sessions, for these it makes every
# encrypted column permanently unreadable. NEVER ROTATE THEM CASUALLY, and
# never regenerate the document: Rails supports key rotation only by keeping
# the old key in the list.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # The chart reads these four by `secretKeyRef` out of
        # `rails.existingSecret` (templates/_env.tpl), under exactly these
        # names. The key names are the chart's contract, not a choice.
        SECRET_KEY_BASE: "{{ .sure_secret_key_base }}"
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "{{ .sure_primary_key }}"
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "{{ .sure_deterministic_key }}"
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "{{ .sure_key_derivation_salt }}"

        # PostgreSQL. Discrete variables rather than DATABASE_URL: they are
        # what config/database.yml reads natively, and the password is
        # OpenBao's and rotates every 30 days -- inside a URL it would have to
        # be percent-encoded, here it is taken verbatim. The chart's stock
        # migrate Job derives its host by parsing DATABASE_URL, which is why
        # ./helmrelease.yaml overrides that script.
        DB_HOST: "{{ .postgres_hostname }}"
        DB_PORT: "{{ .postgres_port }}"
        POSTGRES_DB: "{{ .postgres_database }}"
        POSTGRES_USER: "{{ .postgres_username }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/keys
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "sure_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # Passed through WITH its trailing slash, deliberately -- authentik's
        # per-provider issuer ends in one, and Ruby's openid_connect gem
        # validates the `iss` claim against this exact string. Same gem and
        # same call as ../dawarich, where trimming was shown to break login.
        OIDC_ISSUER: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
