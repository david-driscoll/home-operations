---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Both processes read the same database: SuperSync through Prisma (a URL), the
# coordinator through Npgsql (a key=value connection string). The password
# rotates under components/postgres; Reloader restarts both on change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # `uriql` already ends in `?sslmode=disable`, hence `&`. The pool bounds
        # are REQUIRED, not tuning: the migrate initContainer runs with
        # REQUIRE_DATABASE_POOL_LIMITS=true and refuses a URL without both, and
        # without them Prisma sizes its pool from the NODE's core count and can
        # take a large bite of the shared cluster's max_connections.
        DATABASE_URL: "{{ .postgres_uriql }}&connection_limit=10&pool_timeout=10"
        COORDINATOR_DB: "{{ .postgres_connection_string }}Maximum Pool Size=5;"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# JWT_SECRET signs every SuperSync access token -- SuperSync verifies with it and
# the coordinator mints with it. Generated in-cluster rather than seeded into
# OpenBao because nothing outside this namespace ever needs it, the same call
# dawarich makes for SECRET_KEY_BASE.
#
# Losing it costs no data. Every issued token stops verifying, and each person
# fetches a new one from the coordinator page and pastes it into their devices.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-jwt-secret
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. The Password generator mints
# a new value on every call; `Periodic` would rotate JWT_SECRET on a schedule
# and sign every device out each time.
#
# `deletionPolicy: Retain` keeps the Secret if the provider call ever fails. It
# does NOT survive this ExternalSecret being pruned: `creationPolicy: Owner`
# garbage-collects the Secret with it, and the next reconcile mints a new one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-jwt
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-jwt
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-jwt-secret
