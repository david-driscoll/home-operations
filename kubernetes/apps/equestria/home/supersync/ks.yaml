---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app supersync
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/supersync
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # ⚠️ BRAND-NEW DATABASE. Expect the `system` Pulumi stack to go
    # Stalled/UpdateFailed once on merge day -- it races CNPG creating the
    # login role. Recovery is the ORDER OF OPERATIONS block in
    # components/postgres/ks.yaml.
    - ../../../../components/postgres
    # No components/volsync: every byte SuperSync keeps is in Postgres (backed
    # up by the nightly pg_dump). DATA_DIR only ever holds optional legal pages,
    # and JWT_SECRET is regenerable -- see ./externalsecret.yaml.
    #
    # No components/tailscale either. The internal gateway already admits the
    # tailnet (internal-network allows 100.64.0.0/10), and the sync API must not
    # sit behind the tailnet's authentik chain.
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
