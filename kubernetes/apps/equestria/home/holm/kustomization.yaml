---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./definition.yaml
# resources/config.yml is Holm's whole configuration. Flux substitution is OFF
# for it: every dollar-brace variable in that file is Holm's own, expanded at
# startup from the container's environment (OIDC_* from the ExternalSecret, ROOT_DOMAIN from
# helmrelease.yaml). With Flux substitution on, the OIDC variables would be
# blanked before Holm ever saw them.
configMapGenerator:
  - name: holm-config
    files:
      - config.yml=./resources/config.yml
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
      disableNameSuffixHash: true
