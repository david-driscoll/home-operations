---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app holm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          # Restarts the pod when the OIDC or secret-key Secret, or the
          # holm-config ConfigMap, changes. Holm rereads most of config.yml on
          # its own, but `auth.oidc` and `database` are read once at startup.
          reloader.stakater.com/auto: "true"
          # Always up: this is the family's home page, the way into every
          # other app, and it should answer at 7am like the apps it links to.
          downscaler/exclude: "true"
        replicas: 1
        # Single replica on one ReadWriteOnce volume holding a SQLite file.
        strategy: Recreate
        containers:
          *app :
            image:
              repository: ghcr.io/man15h/holm
              tag: 0.11.0@sha256:8cfe413920f02df68ce42fc58b595c8302949b181dea5f133971b8cb3ff6d1d5
              pullPolicy: IfNotPresent
            envFrom:
              # OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET
              - secretRef:
                  name: ${APP}-oidc
              # HOLM_SECRET_KEY
              - secretRef:
                  name: ${APP}-secret-key
            env:
              TZ: "${TIMEZONE}"
              CONFIG_PATH: /config/config.yml
              DATABASE_PATH: /app/data/holm.db
              # Read by resources/config.yml, which builds every address from
              # it (https://<name>.<root domain>). Flux fills it in here, and
              # Holm expands it in the config at startup.
              ROOT_DOMAIN: "${ROOT_DOMAIN}"
              # adapter-node behind Traefik sees plain http, so without this
              # url.origin (the OpenSearch descriptor, the logout fallback)
              # would say http://. Same host as `redirect_base` in config.yml.
              ORIGIN: "https://apps.${ROOT_DOMAIN}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # Unauthenticated, cheap, and built from the loaded
                    # config, so a config Holm cannot read fails it.
                    path: /manifest.json
                    port: &port 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # Holm writes only to /app/data (holm.db, via holm.db.tmp and a
              # rename); /tmp is an emptyDir below for anything Node needs.
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      # The image's USER is `node` (uid 1000), and the data directory must be
      # writable by it or Holm refuses to start.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /app/data
      # A directory mount rather than a subPath onto /app/config.yml, so an
      # edit reaches the running pod: Holm polls CONFIG_PATH every 2s and
      # reloads apps, integrations, onboarding and branding without a restart.
      config:
        type: configMap
        name: ${APP}-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        # Keeps the HTTPRoute named `holm`. With a second route below,
        # app-template would otherwise suffix it to `holm-internal`, deleting
        # and recreating the live route (and churning its DNS record).
        forceRename: *app
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          # The family-facing address, not the app name: also redirect_base in
          # resources/config.yml, ORIGIN above and the redirect URI in
          # definition.yaml. Change all four together.
          - "apps.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  # Network gate only: Holm signs people in itself over OIDC.
                  name: local-user
      # holm.<root domain> -> apps.<root domain>, the app's own name kept as
      # an alias. A REDIRECT, not a second hostname on the route above:
      # Holm's /auth/login keeps its OIDC state and PKCE cookies on the host
      # it was opened on, but authentik always returns to `redirect_base`
      # (the apps host). Served under both names, a sign-in started on holm.*
      # would land on apps.* without those cookies and fail, and the session
      # cookie would never reach holm.* anyway. Path and query are kept.
      legacy:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  hostname: "apps.${ROOT_DOMAIN}"
                  # 302, not 301: browsers cache a 301 indefinitely.
                  statusCode: 302
