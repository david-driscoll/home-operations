---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The authentik credential. REQUIRED by the pod: Holm refuses to start when
# config.yml names an unset variable, so it could not run without these anyway.
#
# `holm-oidc-credentials` does not exist until `stacks/system` has read
# ./definition.yaml and created the provider, which is after this app's first
# Flux apply. Until then this ExternalSecret fails to sync and the pod sits in
# CreateContainerConfigError. After `stacks/system` has run, nudge it:
#
#   kubectl -n equestria annotate externalsecret holm-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # authentik's issuer, trailing slash included, exactly as its
        # discovery document states it. Holm discovers the endpoints from it.
        OIDC_ISSUER: "{{ .oidc_issuer }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Seed for HOLM_SECRET_KEY. Generated in-cluster rather than seeded into
# OpenBao because nothing outside this pod ever needs it -- the same call
# supersync makes for JWT_SECRET.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-secret-key
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# HOLM_SECRET_KEY encrypts each person's integration logins (Immich API keys,
# Nextcloud app passwords, Navidrome tokens...) in the SQLite database and signs
# every session cookie. Set but malformed, Holm will not start; it must be 32
# bytes as hex or base64. sha256sum of the generated password is exactly 64
# hex characters, so the format is guaranteed whatever the generator emits.
#
# Without it Holm writes `.integrations-key` next to holm.db, so the volsync
# backup would carry the key alongside the ciphertext it protects.
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. The generator mints a new
# value on every call; `Periodic` would rotate the key on a schedule, signing
# everyone out and orphaning every stored integration login each time.
#
# Losing it costs no layouts or bookmarks: everyone signs in again and
# reconnects their integrations. `deletionPolicy: Retain` keeps the Secret if
# the provider call fails, but pruning this ExternalSecret garbage-collects the
# Secret with it (`creationPolicy: Owner`), and the next reconcile mints a new
# key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secret-key
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-secret-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        HOLM_SECRET_KEY: "{{ .password | sha256sum }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-secret-key
