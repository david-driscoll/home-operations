---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Tiny Tiny RSS
  category: Applications
  description: Web-based news feed (RSS/Atom) reader and aggregator
  url: &url https://${APP}.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/tinytinyrss.png
  access_policy:
    groups:
      - family
  authentik:
    oauth2:
      clientType: confidential
      # The auth_oidc plugin sends tt-rss's own detected base URL as the
      # redirect URI: scheme and Host header of the request, no port and no
      # trailing slash (Config::get_self_url() ends in rtrim '/'). Both
      # spellings are registered so a slash appearing upstream does not turn
      # into a redirect_uri mismatch.
      allowedRedirectUris:
        - url: https://${APP}.${ROOT_DOMAIN}
        - url: https://${APP}.${ROOT_DOMAIN}/
        - url: https://${APP}.${TAILSCALE_DOMAIN}
        - url: https://${APP}.${TAILSCALE_DOMAIN}/
      propertyMappings:
        - email
        - openid
        - profile
  gatus:
    - group: "Applications"
      url: *url
      method: GET
      conditions:
        # tt-rss answers an anonymous request with its own login form and a
        # 200, so the status cannot tell the form from the reader. The title
        # can: include/login_form.php hardcodes this one, while index.php
        # serves a bare "Tiny Tiny RSS" once login_sequence() lets a request
        # through -- which SINGLE_USER_MODE would do for everybody.
        #
        # Not the 401 that ./freshrss expects, although both sit behind
        # `local-user`. That chain is an IP allow-list with no forward-auth in
        # it; FreshRSS's 401 is its own mod_auth_openidc refusing a client
        # that sends no Accept header, and nothing in this pod does that.
        - "[STATUS] == 200"
        - "[BODY] == pat(*<title>Tiny Tiny RSS : Login</title>*)"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      # This service is scaled to 0 between 01:00 and 07:00, so a failed check in
      # that window is expected rather than an incident. Gatus keeps checking and
      # keeps the history; it just does not alert.
      maintenance-windows:
        - start: "01:00"
          duration: 6h
          timezone: ${TIMEZONE}
