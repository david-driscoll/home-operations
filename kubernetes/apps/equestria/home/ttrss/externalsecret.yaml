---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Every TTRSS_* variable overrides the config.php define of the same
        # name. tt-rss reads them from the environment on each request, so
        # nothing is baked onto the PVC the way FreshRSS's config.php is.
        TTRSS_DB_HOST: "{{ .postgres_hostname }}"
        TTRSS_DB_PORT: "{{ .postgres_port }}"
        TTRSS_DB_NAME: "{{ .postgres_database }}"
        TTRSS_DB_USER: "{{ .postgres_username }}"
        TTRSS_DB_PASS: "{{ .postgres_password }}"
        # Only a fallback for the CLI (the feed updater); web requests detect
        # their own URL, which is what lets the tailnet hostname work too.
        TTRSS_SELF_URL_PATH: "https://${APP}.${ROOT_DOMAIN}"
        # auth_internal stays enabled: it is what the mobile/API clients and
        # the built-in `admin` account log in through.
        TTRSS_PLUGINS: "auth_internal, auth_oidc, note, nginx_xaccel"
        # auth_oidc is pinned by the install-oidc-plugin initContainer; without
        # this the image would `git pull` every plugins.local checkout at boot.
        TTRSS_NO_STARTUP_PLUGIN_UPDATES: "true"
        TTRSS_CHECK_FOR_UPDATES: "false"
        TTRSS_CHECK_FOR_PLUGIN_UPDATES: "false"
        # OIDC (plugin: github.com/tt-rss/tt-rss-plugin-auth-oidc)
        TTRSS_AUTH_OIDC_NAME: "authentik"
        TTRSS_AUTH_OIDC_URL: "{{ .oidc_issuer }}"
        TTRSS_AUTH_OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        TTRSS_AUTH_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        TTRSS_AUTH_OIDC_CLIENT_USERNAME_CLAIM: "preferred_username"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
---
# The built-in `admin` account's password. Users created by an OIDC login are
# ordinary users, so this account is the only way to promote one to admin:
#
#   kubectl -n equestria get secret ttrss-admin -o jsonpath='{.data.ADMIN_USER_PASS}' | base64 -d
#
# Without ADMIN_USER_PASS the image generates a password on first start and
# prints it to the container log, which would leave it in Loki. Generated once
# and never refreshed; the image re-applies it on every start, so a lost Secret
# costs nothing but a new password.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-admin-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-admin
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ADMIN_USER_PASS: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-admin-password
