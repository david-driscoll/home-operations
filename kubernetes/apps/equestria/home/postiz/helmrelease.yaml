---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# Deliberately app-template rather than the upstream chart at
# gitroomhq/postiz-helmchart. That chart bundles its own PostgreSQL and Redis
# subcharts, exposes the app through an Ingress, and pins `image.tag: latest` --
# every one of which fights a convention this repo enforces elsewhere
# (components/postgres, the shared valkey, Gateway API, digest-pinned images).
# Adopting it would mean overriding all four and still inheriting its release
# cadence, so the container is wired up directly instead.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postiz
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          # On the controller, which is the only place it does anything. This
          # is what makes the 30-day OpenBao password rotation reach the pod --
          # DATABASE_URL comes from postiz-env via envFrom and is read once at
          # boot. See components/postgres/AGENTS.md.
          reloader.stakater.com/auto: "true"
          # ⚠️ Low Power keep-list -- NOT optional for this app. `equestria` is
          # the shed-list namespace: `downscaler/force-downtime` scales every
          # non-excluded workload to 0, and the scheduled shed runs 02:00-09:00.
          # This pod is the scheduler (RUN_CRON) and the Temporal worker, so a
          # shed window is not a pause -- it is seven hours in which every post
          # due to publish silently does not, and a missed publish window
          # cannot be recovered by waking back up.
          # Per-workload exclude beats the namespace toggle (scaler.py
          # define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        replicas: 1
        # Single replica, and not only because of the ReadWriteOnce volume:
        # RUN_CRON is true in postiz-env, so this process owns the scheduler.
        # A second one would double-fire every scheduled post.
        #
        # Recreate for the same reason -- a rolling update would briefly run
        # two schedulers, and would deadlock on the PVC regardless.
        strategy: Recreate
        containers:
          *app :
            image: &image
              repository: ghcr.io/gitroomhq/postiz-app
              # v2.24.0. Anything from v2.12.0 onward requires the Temporal
              # cluster this app dependsOn; v2.11.x was the last
              # BullMQ-on-Redis release. Do not roll back across that line
              # without also reading apps/database/temporal.
              #
              # ⚠️ Runtime-patched (patch-media-url, in initContainers below).
              # Bumps automerge like any other image (decided 2026-09-29): the
              # patch fails open, and a bump that moves the matched text turns
              # the Funnel canary red (definition.yaml) and fires
              # PostizMediaPatchNotApplied. Then fix the sed pattern -- or, if
              # upstream now has its own UPLOAD_PUBLIC_URL, delete the patch.
              tag: v2.25.0@sha256:7eb4a553507ce3f200deff2ec0211ab3cf834ba19eb44dd68e83ccc236509feb
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: ${APP}-env
            securityContext:
              allowPrivilegeEscalation: false
              # The image builds and serves a Next.js app and runs pm2, both of
              # which write outside the volumes (.next caches, pm2's runtime
              # directory, nginx's temp paths).
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                # ⚠️ RUNNING AS UID 0 IS NOT ENOUGH ON ITS OWN. Dropping ALL
                # takes CAP_DAC_OVERRIDE away from root too, and root without it
                # is subject to ordinary file permission checks. The image
                # chowns /var/lib/nginx to the `www` user, so the nginx master
                # -- which runs as root because nginx.conf says `user www;` --
                # could not create its own temp directories and died instantly
                # on every start:
                #
                #   [emerg] mkdir() "/var/lib/nginx/body" failed (13: Permission denied)
                #
                # That was 81 CrashLoopBackOff restarts on the first deploy.
                #
                # These four are what a root-master nginx that drops to an
                # unprivileged worker actually needs, and nothing more:
                #   DAC_OVERRIDE  create/write under www-owned /var/lib/nginx
                #   CHOWN         ngx_create_paths() chowns those temp dirs to
                #                 the worker user so workers can buffer uploads
                #                 (client_max_body_size is 2G, so they will)
                #   SETGID/SETUID fork the workers as www; without these the
                #                 master fails at setuid() instead, one step
                #                 further along than the mkdir did
                #
                # NET_BIND_SERVICE is deliberately absent: nginx listens on
                # 5000, which is unprivileged.
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - SETGID
                  - SETUID
            resources:
              requests:
                cpu: 200m
                # Three Node processes -- frontend (Next.js SSR), backend
                # (NestJS) and orchestrator (Temporal worker) -- under one pm2.
                memory: 1Gi
              limits:
                # Video uploads stream rather than buffer as of v2.23.0, which
                # is what makes 3Gi enough; on an older tag the worker held
                # whole files in memory.
                memory: 3Gi
            probes:
              # `/` on the nginx port. There is no dedicated health endpoint --
              # the upstream compose healthcheck is exactly this request, and
              # treats any status below 500 as healthy.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  # Generous on purpose, and load-bearing for the credential
                  # rotation above: the pm2 entrypoint runs
                  # `pnpm run prisma-db-push` before any process listens, so a
                  # cold boot includes a schema migration. The upstream compose
                  # file allows 120s of start_period for the same reason; 10
                  # minutes here means a rotation restart cannot be probe-killed
                  # part-way through a migrate.
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
        # After `containers`, not before: YAML needs the &image anchor above
        # to precede the *image alias used here.
        initContainers:
          # ---- UPLOAD_PUBLIC_URL, a runtime patch -------------------------
          #
          # postiz builds every stored media URL as
          # `process.env.FRONTEND_URL + '/uploads' + path` (upload/
          # local.storage.ts: newFilePath and removeFile), and FRONTEND_URL has
          # to stay postiz.<root domain> -- the OIDC redirect is built from it,
          # and a ts.net FRONTEND_URL puts the login cookie on a public suffix
          # that browsers drop. So postiz needs a SEPARATE public media base,
          # which upstream does not have yet. This rewrites that expression to
          # `(process.env.UPLOAD_PUBLIC_URL || <the original>)` in the backend's
          # and the orchestrator's compiled copy, into an emptyDir the main
          # container mounts over the image's files. Plan §E2
          # (docs/plans/cloudflare-tunnel-to-funnel.md).
          #
          # FAILS OPEN, always exit 0: unless each file has exactly the two
          # expected matches before AND after, the original is copied through
          # unchanged and the log says POSTIZ_MEDIA_PATCH_NOT_APPLIED. Failing
          # closed would turn a mismatched image bump into hours of scheduler
          # outage (Recreate, 15m timeout, 7 rollback retries); failing open
          # only sends new media URLs back to the internal-only FRONTEND_URL.
          # A Loki rule alerts on the marker (./loki-rules.yaml).
          #
          # Same image as the app via the anchor, so one Renovate bump moves
          # both. Bumps automerge; the canary and the Loki rule are what catch
          # one that no longer matches.
          #
          # It also writes /uploads/funnel-canary.txt, which Gatus fetches
          # through the public Funnel path (./definition.yaml): "ok" only when
          # BOTH files were patched, "patch-not-applied" otherwise. So the
          # Gatus probe stays red for as long as the patch is off, where
          # ./loki-rules.yaml only sees the one log line per start.
          #
          # `$$` is Flux's escape for a literal dollar: this file goes through
          # postBuild envsubst, which would otherwise eat every shell variable.
          patch-media-url:
            image: *image
            command:
              - sh
              - -c
              - |
                patch_one() {
                  src="$${1}"; out="$${2}"
                  n="$$(grep -cF "process.env.FRONTEND_URL + '/uploads'" "$${src}" 2>/dev/null)"
                  if [ "$${n}" = 2 ]; then
                    sed "s#process\.env\.FRONTEND_URL + '/uploads'#(process.env.UPLOAD_PUBLIC_URL || process.env.FRONTEND_URL + '/uploads')#g" "$${src}" > "$${out}.tmp"
                    m="$$(grep -cF 'process.env.UPLOAD_PUBLIC_URL' "$${out}.tmp")"
                    if [ "$${m}" = 2 ]; then
                      mv "$${out}.tmp" "$${out}"
                      echo "POSTIZ_MEDIA_PATCH_APPLIED $${src}"
                      return 0
                    fi
                  fi
                  rm -f "$${out}.tmp"
                  cp "$${src}" "$${out}" || : > "$${out}"
                  echo "POSTIZ_MEDIA_PATCH_NOT_APPLIED $${src} (matched $${n:-0}, want 2)"
                  return 1
                }
                d=/app/apps
                f=dist/libraries/nestjs-libraries/src/upload/local.storage.js
                canary=ok
                patch_one "$${d}/backend/$${f}" /patched/backend-local.storage.js || canary=patch-not-applied
                patch_one "$${d}/orchestrator/$${f}" /patched/orchestrator-local.storage.js || canary=patch-not-applied
                echo "$${canary}" > /uploads/funnel-canary.txt || echo POSTIZ_FUNNEL_CANARY_NOT_WRITTEN
                exit 0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

      # The public half of this app, and the ONLY thing on it the internet is
      # allowed to reach. A read-only static file server over the same volume
      # postiz writes uploads into.
      #
      # WHY THIS EXISTS AT ALL. TikTok and Meta do not accept an uploaded byte
      # stream -- they fetch the media from a URL, so that URL has to be public.
      # postiz records it as UPLOAD_PUBLIC_URL + path (patch-media-url above),
      # which is postiz-media.<tailnet>.ts.net/uploads: Tailscale Funnel, in
      # the funnel component in ./ks.yaml. The app itself stays on the internal gateway only.
      #
      # A separate controller rather than a sidecar on `postiz`: this one is
      # reachable from the internet and that one is not, so they get separate
      # pods, separate blast radii, and a `replicas` count that can move without
      # touching the scheduler. It holds no secret -- no envFrom, no database,
      # no write path.
      cdn:
        annotations:
          # Same keep-list reasoning as the app: a shed window here means every
          # media URL already handed to a provider 404s until 09:00.
          downscaler/exclude: "true"
        replicas: 1
        # RollingUpdate, not Recreate: this controller only ever READS the
        # volume, so two of them overlapping during a rollout is fine, and the
        # media URLs stay answerable throughout.
        strategy: RollingUpdate
        pod:
          # Overrides defaultPodOptions, which runs as ROOT for postiz's sake
          # (its nginx.conf needs it). Nothing about this controller does, and
          # it is the one pod here exposed to the internet, so it must not
          # inherit that. 568 is the estate's standard non-root app uid.
          #
          # It can still read what postiz writes: postiz creates upload dirs
          # 0755 and files 0644 as root, so world-read is enough and no shared
          # fsGroup is needed between the two pods.
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            seccompProfile: { type: RuntimeDefault }
        containers:
          cdn:
            image:
              repository: ghcr.io/static-web-server/static-web-server
              tag: 2.44.1@sha256:94618e3d17802265a21926217e6f9e7832b311b6fbf5933684001739fafed06a
              pullPolicy: IfNotPresent
            env:
              # Serves /srv, and the claim's `uploads` subPath is mounted at
              # /srv/uploads -- so the URL path /uploads/<y>/<m>/<d>/<file> maps
              # straight onto disk with NO prefix rewriting. That is deliberate:
              # Gateway API does not strip a PathPrefix match, and postiz's
              # recorded URLs already contain /uploads.
              SERVER_ROOT: /srv
              # >1024 because this runs non-root. The image's own EXPOSE 80 is
              # not usable here.
              SERVER_PORT: &cdn-port 8080
              SERVER_HOST: "0.0.0.0"
              # ⚠️ Off, and load-bearing. Upload paths are date-foldered with
              # 32-hex random filenames, which is the only thing keeping one
              # public media URL from enumerating every other. A directory index
              # would hand the whole library to anyone who trims the filename.
              SERVER_DIRECTORY_LISTING: "false"
              # No symlink following: the volume is written by another pod.
              SERVER_IGNORE_HIDDEN_FILES: "true"
              SERVER_LOG_LEVEL: info
              # Adds a /health endpoint returning 200 and writing no log line.
              # REQUIRED for the probes below, and the reason is worth stating:
              # with SERVER_DIRECTORY_LISTING off and no index.html at the root,
              # `/` returns 404 -- and the kubelet counts ONLY 200-399 as a
              # probe success, so probing `/` fails forever. That is exactly
              # what happened on the first deploy: 121 restarts, readiness never
              # true, liveness killing the container every couple of minutes.
              SERVER_HEALTH: "true"
            securityContext:
              allowPrivilegeEscalation: false
              # A single static Rust binary serving a read-only mount -- it
              # needs nothing writable anywhere.
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            probes:
              liveness: &cdn-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # `/health` (SERVER_HEALTH above), NOT `/`. A bare `/` is a
                    # 404 here -- no index.html, listing off -- and the kubelet
                    # treats anything outside 200-399 as a failed probe.
                    # Checking a real media path is not an option either: the
                    # filenames are random and the directory is empty on a
                    # fresh install.
                    path: &cdn-health /health
                    port: *cdn-port
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                <<: *cdn-probe
                spec:
                  httpGet:
                    path: *cdn-health
                    port: *cdn-port
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6

    defaultPodOptions:
      securityContext:
        # ⚠️ Root, deliberately. The published image declares no USER (verified
        # against its OCI config: `"User": null`) and its command is
        # `nginx && pnpm run pm2`. The bundled nginx.conf opens with `user www;`,
        # which only a root master process can act on -- as a non-root user
        # nginx fails to switch user and the reverse proxy on :5000 never comes
        # up, taking both the UI and /api with it.
        #
        # The container drops ALL capabilities and cannot escalate (see above),
        # so this is root-in-a-box rather than root on the node.
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    persistence:
      # One claim, two mount points -- the same split the upstream compose file
      # makes with its `postiz-config` and `postiz-uploads` volumes. subPath
      # keeps them apart inside the single volsync PVC so both are covered by
      # one backup schedule.
      #
      # advancedMounts, NOT globalMounts: the claim is mounted into both
      # controllers and they must not see the same thing. `cdn` is internet-
      # facing, so it gets `uploads` only, read-only, and never /config.
      data:
        existingClaim: ${APP}
        advancedMounts:
          ${APP}:
            ${APP}:
              - path: /config
                subPath: config
              # Must agree with UPLOAD_DIRECTORY in externalsecret.yaml. This is
              # the half of the volume that grows.
              - path: /uploads
                subPath: uploads
            # Only for the canary file (patch-media-url). The image has no
            # /uploads of its own.
            patch-media-url:
              - path: /uploads
                subPath: uploads
          cdn:
            cdn:
              # Mounted UNDER the server root (SERVER_ROOT=/srv) so the on-disk
              # layout reproduces the URL path: /uploads/<y>/<m>/<d>/<file>.
              #
              # readOnly is belt-and-braces on top of the container's
              # readOnlyRootFilesystem -- this pod is the internet-facing one
              # and has no reason to be able to write a byte.
              - path: /srv/uploads
                subPath: uploads
                readOnly: true

      # patch-media-url's output: the two patched local.storage.js files,
      # mounted read-only over the image's own by subPath. The init container
      # always writes both (the original on a mismatch), so a subPath mount
      # never meets a missing entry.
      media-patch:
        type: emptyDir
        advancedMounts:
          ${APP}:
            patch-media-url:
              - path: /patched
            ${APP}:
              - path: /app/apps/backend/dist/libraries/nestjs-libraries/src/upload/local.storage.js
                subPath: backend-local.storage.js
                readOnly: true
              - path: /app/apps/orchestrator/dist/libraries/nestjs-libraries/src/upload/local.storage.js
                subPath: orchestrator-local.storage.js
                readOnly: true

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          # nginx, not the app. 5000 fronts both the Next.js frontend and
          # /api/ -> localhost:3000; 3000 and 4200 are internal to the pod and
          # deliberately not exposed.
          http:
            port: *port
      cdn:
        controller: cdn
        type: ClusterIP
        ports:
          http:
            port: *cdn-port

    # Internal only. The media is public through Tailscale Funnel instead,
    # on its own hostname (the funnel component in ./ks.yaml, plan step 5 of
    # docs/plans/cloudflare-tunnel-to-funnel.md): the Funnel door routes only
    # /uploads/ of postiz-media.<tailnet>.ts.net to the `cdn` Service, and
    # postiz stamps that base on new media URLs (UPLOAD_PUBLIC_URL).
    #
    # Until 2026-09-29 an `external` route here put /uploads/ of THIS hostname
    # on the Cloudflare tunnel. Media stored before then carries
    # postiz.<root domain>/uploads/... URLs, which stop resolving publicly once
    # that route is gone; posts already published are unaffected (the
    # platforms keep their own copy).
    #
    # Verify from outside after any change to the Funnel side: `/`, `/api/`,
    # `/auth` and `--path-as-is /uploads/../api/` on postiz-media must 404;
    # only `/uploads/...` may reach the cdn pod.
    route:
      # The app. Internal gateway, network-gated, exactly like every other app
      # in this namespace.
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  # Network gate only, no authentik outpost -- postiz does its
                  # own OIDC against authentik (POSTIZ_GENERIC_OAUTH in
                  # externalsecret.yaml), and a forward-auth layer in front of
                  # it would intercept the /settings callback before the app
                  # ever saw the authorization code. Same shape freshrss uses.
                  name: local-user
