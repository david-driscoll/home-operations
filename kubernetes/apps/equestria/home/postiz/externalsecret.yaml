---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        TZ: "${TIMEZONE}"

        # --- persistence -------------------------------------------------
        # `uriql` and not `uri`: both are rendered by
        # apps/database/postgres/app/user-template.yaml and differ only in
        # scheme -- `postgresql://` vs `postgres://`. Prisma accepts either,
        # but its own docs and error messages use `postgresql://`, so the
        # matching one is the one to hand it.
        #
        # The `?sslmode=disable` this carries is correct here, unlike the
        # degoog case next door: that app's driver is postgres.js, which
        # coerces any non-empty sslmode into a truthy `ssl` option and opens
        # TLS against CNPG's self-signed CA. Prisma parses sslmode properly, so
        # `disable` means the plaintext connection every other app in this
        # namespace already makes to postgres-rw.
        DATABASE_URL: "{{ .postgres_uriql }}"

        # The shared valkey in `database`, which sets no password.
        #
        # Database 10: 9 is degoog, 8 is searxng, 6 is dispatcharr. Postiz uses
        # Redis for rate limiting and short-lived caches only -- since v2.12.0
        # the job queue is Temporal, not BullMQ -- but a distinct index still
        # keeps a stray FLUSHDB from taking two apps down.
        REDIS_URL: "redis://valkey.database.svc.cluster.local:6379/10"

        # --- durable execution -------------------------------------------
        # Postiz's `orchestrator` process is a Temporal worker, and every
        # publish goes through a workflow. This is the whole reason
        # apps/database/temporal exists; see that app's ks.yaml.
        #
        # No TEMPORAL_NAMESPACE: both Postiz and the Temporal SDK default to
        # `default`, which is the namespace auto-setup creates on first boot.
        TEMPORAL_ADDRESS: "temporal.database.svc.cluster.local:7233"

        # --- urls ---------------------------------------------------------
        # ⚠️ These must be EXACTLY the URL the browser uses, scheme included.
        # Postiz builds absolute links and CORS/cookie origins from them, and a
        # mismatch shows up as a login loop rather than an error.
        #
        # FRONTEND_URL is load-bearing twice over: the OIDC redirect_uri is
        # built as `${FRONTEND_URL}/settings` in
        # auth/providers/oauth.provider.ts, so it has to agree character for
        # character with the allowedRedirectUris in definition.yaml or
        # authentik rejects the authorization request.
        #
        # /api is not a second Service: nginx inside the image listens on 5000
        # and proxies /api/ to the backend on localhost:3000
        # (var/docker/nginx.conf).
        MAIN_URL: &url "https://${APP}.${ROOT_DOMAIN}"
        FRONTEND_URL: *url
        NEXT_PUBLIC_BACKEND_URL: "https://${APP}.${ROOT_DOMAIN}/api"
        # The SSR server reaching the backend inside its own pod, so localhost
        # rather than the Service -- they are the same container.
        BACKEND_INTERNAL_URL: "http://localhost:3000"

        # --- behaviour -----------------------------------------------------
        JWT_SECRET: "{{ .jwt_password }}"
        IS_GENERAL: "true"
        # ⚠️ MUST stay "false". It reads like the right setting for a private
        # instance, but DISABLE_REGISTRATION also disables OIDC/OAuth sign-in
        # outright -- turning it on would lock out the authentik login wired
        # below. Registration is gated by authentik at the door instead: only
        # members of the `family` group in definition.yaml can reach a signup
        # form at all.
        DISABLE_REGISTRATION: "false"
        # Runs the scheduled-task workers in this process. Single replica, so
        # exactly one instance owns the cron -- see the replicas note in
        # helmrelease.yaml.
        RUN_CRON: "true"
        API_LIMIT: "90"
        DISALLOW_PLUS: "true"
        NX_ADD_PLUGINS: "false"

        # --- storage -------------------------------------------------------
        # `local`, backed by the volsync PVC mounted at /uploads. The image's
        # nginx serves /uploads/ straight off that path with nosniff and a
        # locked-down CSP already set, so no second Service is involved.
        #
        # ⚠️ READ THIS BEFORE CONNECTING TikTok, Facebook or Instagram. Those
        # providers do not accept an uploaded byte stream -- they fetch the
        # media from a URL you hand them, which must therefore be reachable
        # from the public internet over HTTPS. This app is on the `internal`
        # gateway behind the `local-user` middleware (helmrelease.yaml), so it
        # is NOT, and media posts to those three will fail even though the
        # OAuth connection itself succeeds.
        #
        # ⚠️ THE MEDIA HOST CANNOT BE A DIFFERENT ORIGIN FROM THE APP. Under
        # `local` storage the stored media URL is built as
        # `process.env.FRONTEND_URL + '/uploads' + path`, hard-coded in both
        # uploadSimple() and uploadFile() (upload/local.storage.ts), and that
        # absolute URL is what posts.service.ts hands the providers verbatim
        # (it only falls back to rebuilding a URL when the stored path does not
        # already start with `http`, which for this provider it always does).
        #
        # So a CDN on its own hostname does not work, however the bytes are
        # shared -- postiz would still tell TikTok the old URL. What DOES work,
        # and what helmrelease.yaml implements, is ONE hostname across TWO
        # gateways: the app on the internal gateway behind local-user, and
        # /uploads/ alone on the external gateway, served by the read-only `cdn`
        # controller off this same volume. The app has no public route at all.
        #
        # That split depends on the `--gateway-name` scoping added to all three
        # external-dns instances; see apps/network/external-dns/technitium.
        #
        # The alternative, if that scoping is ever reverted, is
        # STORAGE_PROVIDER=cloudflare, where
        # upload/cloudflare.storage.ts returns `${CLOUDFLARE_BUCKET_URL}/<id>`
        # -- an arbitrary URL, decoupled from FRONTEND_URL, so the app could
        # stay internal and only an R2 bucket would be public. That is why
        # Postiz's own .env.example says Cloudflare "is currently required to
        # save things like social media avatars". Its S3 WRITE endpoint is
        # hard-coded to `https://<account>.r2.cloudflarestorage.com`, so the
        # estate's Garage cannot be substituted without patching the image.
        #
        # Tailscale Funnel was evaluated and rejected for two independent
        # reasons: it answers only on `<node>.<tailnet>.ts.net` with no custom
        # domain support, so it can never serve the host postiz emits; and
        # TikTok requires media URLs to sit under a domain whose ownership is
        # verified in its console, which `ts.net` cannot be.
        #
        # YouTube is unaffected by all of this: it takes a resumable upload.
        STORAGE_PROVIDER: "local"
        # The filesystem path the backend writes to (upload.factory.ts ->
        # LocalStorage). Must agree with the `data` mount in helmrelease.yaml.
        UPLOAD_DIRECTORY: "/uploads"
        # Compose parity. Not read by the backend; kept because the maintained
        # upstream compose file sets it and a future frontend build may.
        NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
        # ⚠️ NO leading slash. posts.service.ts concatenates this as
        # `FRONTEND_URL + '/' + NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY + path`, so
        # "/uploads" here would produce a double slash. That fallback branch is
        # unreachable today (local storage stores absolute URLs, see above),
        # which is exactly why the value has to be right now rather than when
        # something starts depending on it.
        NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: "uploads"

        # --- authentik sign-in ---------------------------------------------
        # Postiz calls this "generic OAuth" and documents authentik as the
        # worked example. Discovery is NOT supported -- all three endpoints are
        # named explicitly -- so these come from the ${APP}-oidc-credentials
        # Secret the Pulumi `applications` stack writes from definition.yaml,
        # rather than being typed in. A future authentik move needs no edit here.
        POSTIZ_GENERIC_OAUTH: "true"
        POSTIZ_OAUTH_URL: "{{ .oidc_issuer }}"
        POSTIZ_OAUTH_AUTH_URL: "{{ .oidc_authorization_url }}"
        POSTIZ_OAUTH_TOKEN_URL: "{{ .oidc_token_url }}"
        POSTIZ_OAUTH_USERINFO_URL: "{{ .oidc_userinfo_url }}"
        POSTIZ_OAUTH_CLIENT_ID: "{{ .oidc_client_id }}"
        POSTIZ_OAUTH_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # Stated for the record, not because it changes anything today:
        # auth/providers/oauth.provider.ts hard-codes `openid profile email`
        # into the authorize URL and never reads this variable. It is set to
        # the identical value so that a future version which does honour it
        # cannot silently narrow the scopes definition.yaml grants.
        POSTIZ_OAUTH_SCOPE: "openid profile email"
        NEXT_PUBLIC_POSTIZ_OAUTH_DISPLAY_NAME: "Authentik"
        NEXT_PUBLIC_POSTIZ_OAUTH_LOGO_URL: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/authentik.svg"

        # --- social providers -----------------------------------------------
        # Credentials for the four channels this instance posts to. Each one is
        # an OAuth app registered with that platform; postiz only stores the
        # client id/secret and drives the flow. The redirect URI to register is
        # `https://${APP}.${ROOT_DOMAIN}/integrations/social/<provider>`.
        #
        # ONE OpenBao document PER SERVICE, under `third-party-tokens/`, not a
        # single postiz-owned blob. That follows the estate convention for
        # credentials issued by somebody else's console -- the same shape as
        # `third-party-tokens/twitch/developer` (romm, questarr),
        # `third-party-tokens/pushover/gatus` and
        # `third-party-tokens/tailscale/oauth-operator`: `<service>/<consumer>`,
        # with the fields named `username` (the client/app id) and `credential`
        # (the secret). These apps are not postiz's property -- if something
        # else ever posts to the same Meta app, it reads the same document
        # rather than a copy filed under another app's name.
        #
        # ESO can read them: the `eso-equestria` policy grants read+list on
        # `secrets/{data,metadata}/third-party-tokens/*`
        # (bootstrap/openbao/equestria-init.sh), so no policy change was needed.
        #
        # ⚠️ ALL FOUR DOCUMENTS MUST EXIST, even unconfigured. A dataFrom
        # extract against a missing path fails the WHOLE ExternalSecret, which
        # would take the database and OIDC values down with it -- so they are
        # seeded with empty placeholder fields. An empty value is exactly how
        # postiz spells "this provider is not configured": the channel simply
        # does not appear in its UI, and the app boots fine.

        # Facebook Pages. Also covers Instagram when the account is linked to a
        # Facebook Business page (the "Login for Business" path), in which case
        # the INSTAGRAM_* pair below is not needed at all.
        FACEBOOK_APP_ID: "{{ .facebook_username }}"
        FACEBOOK_APP_SECRET: "{{ .facebook_credential }}"

        # Instagram standalone -- "Instagram Business Login", with no Facebook
        # page in the middle. Requires a professional (Business or Creator)
        # account, and its callback path is the only one that does not match
        # the provider name: /integrations/social/instagram-standalone.
        INSTAGRAM_APP_ID: "{{ .instagram_username }}"
        INSTAGRAM_APP_SECRET: "{{ .instagram_credential }}"

        # YouTube. A Google Cloud OAuth 2.0 "Web application" client, on a
        # project with the YouTube Data v3, Analytics and Reporting APIs enabled.
        YOUTUBE_CLIENT_ID: "{{ .youtube_username }}"
        YOUTUBE_CLIENT_SECRET: "{{ .youtube_credential }}"

        # TikTok. Login Kit + Content Posting API with Direct Post enabled.
        # Until the app clears TikTok's audit, published posts are forced to
        # private visibility and capped at 5 users per 24h -- that is TikTok's
        # rule for unaudited clients, not a postiz limitation.
        TIKTOK_CLIENT_ID: "{{ .tiktok_username }}"
        TIKTOK_CLIENT_SECRET: "{{ .tiktok_credential }}"
  dataFrom:
    # Signs every session JWT. Rotating it logs everyone out; it is otherwise
    # opaque and never leaves the app.
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/postiz/jwt-secret
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "jwt_$1"

    # One document per service -- see the block above for why these live under
    # third-party-tokens/ rather than under this app. Each holds `username`
    # (client/app id) and `credential` (secret), the same two fields
    # third-party-tokens/twitch/developer uses.
    - extract:
        key: third-party-tokens/facebook/postiz
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "facebook_$1"

    - extract:
        key: third-party-tokens/instagram/postiz
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "instagram_$1"

    - extract:
        key: third-party-tokens/youtube/postiz
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "youtube_$1"

    - extract:
        key: third-party-tokens/tiktok/postiz
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "tiktok_$1"

    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"

    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
