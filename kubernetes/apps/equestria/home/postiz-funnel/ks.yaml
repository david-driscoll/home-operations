---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# postiz's media on Tailscale Funnel: /uploads/ of the read-only `postiz-cdn`
# Service, public at postiz-media.<tailnet>.ts.net. Step 5 of
# docs/plans/cloudflare-tunnel-to-funnel.md. postiz stamps that base onto every
# stored media URL (UPLOAD_PUBLIC_URL in ../postiz/externalsecret.yaml), and
# the platforms that pull media by URL (Instagram, Facebook, TikTok photos)
# fetch it from here.
#
# Its own Kustomization rather than a component on postiz's: the consumer
# inherits the nested ks's dependsOn (tailscale-system, funnel-gateway) and
# health, and postiz's readiness must not be hostage to the Funnel door.
# Nothing depends on this one.
#
# THE PATH. Funnel proxy (mounts /uploads/ only) -> Traefik's `funnel`
# entrypoint (header strip, throttles, CrowdSec bouncer + AppSec) -> HTTPRoute
# equestria/funnel-postiz-media -> postiz-cdn:8080 (static-web-server over the
# uploads PVC, read-only). The mount is not a boundary (plan §C2): every route
# on the door is reachable from every Funnel device, so the route list in
# funnel-policy is.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postiz-funnel
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # postiz-cdn is rendered by postiz's HelmRelease.
    - name: postiz
      namespace: equestria
  path: ./kubernetes/apps/equestria/home/postiz-funnel
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  # Above the nested ks's 5m, so a failure there is reported as that ks's own
  # message rather than this one timing out first.
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/funnel
  postBuild:
    substitute:
      APP: postiz
      # The HTTPRoute's namespace (the Ingress always lands in `network`).
      NAMESPACE: *namespace
      # Literal, and on both funnel-policy allow-lists verbatim.
      FUNNEL_HOST: postiz-media
      FUNNEL_PATH: uploads
      # LITERAL, not APP-cdn: cluster-apps' own postBuild has no APP, so the
      # templated form renders "-cdn" there and fails the whole apply
      # (plan §C3).
      FUNNEL_SERVICE: postiz-cdn
      # postiz-cdn's port, as a NUMBER and quoted: HTTPRoute backendRefs take
      # no port names, and substitute values are strings.
      FUNNEL_PORT: "8080"
