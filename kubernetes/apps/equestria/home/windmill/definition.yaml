---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Windmill
  category: Development
  description: Workflow Automation Platform
  url: &url https://${APP}.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/windmill.svg
  access_policy:
    groups:
      - friends
      - family
  authentik:
    oauth2:
      clientType: confidential
      # Fixed rather than generated: OAuthClient.id in Windmill's instance
      # config is a plain string (only `secret` takes a secretKeyRef), so the
      # operator's instanceSpec in ./helmrelease.yaml has to name it literally.
      # A client id is not a secret -- it travels in every authorize redirect.
      clientId: windmill
      allowedRedirectUris:
        - url: "https://${APP}.${ROOT_DOMAIN}/user/login_callback/authentik"
        - url: "https://${APP}.${TAILSCALE_DOMAIN}/user/login_callback/authentik"
      propertyMappings:
        - email
        - openid
        - profile
      includeClaimsInIdToken: true
      subMode: user_email

  gatus:
    - group: "Applications"
      url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      # This service is scaled to 0 between 01:00 and 07:00, so a failed check in
      # that window is expected rather than an incident. Gatus keeps checking and
      # keeps the history; it just does not alert.
      maintenance-windows:
        - start: "01:00"
          duration: 6h
          timezone: ${TIMEZONE}
