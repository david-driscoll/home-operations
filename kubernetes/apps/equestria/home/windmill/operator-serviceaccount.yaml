---
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/v1.18.0-standalone-strict/serviceaccount-v1.json
#
# The Windmill operator's OWN identity. The chart (4.0.267, templates/rbac.yaml)
# binds its `windmill-operator` Role -- get/list/watch on every ConfigMap and
# every SECRET in the release namespace -- to the chart's single shared
# ServiceAccount, which windmill-app and every worker group also run as.
# Workers execute arbitrary user scripts, and equestria is a shared namespace,
# so taken as shipped that would let any Windmill script read every app's
# Secrets here. The post-render patches in ./helmrelease.yaml move the operator
# Deployment and the RoleBinding onto this account instead; the shared one keeps
# no permissions at all, as before the operator existed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-operator
