---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: windmill
spec:
  interval: 1h
  url: https://windmill-labs.github.io/windmill-helm-charts/
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app windmill
spec:
  interval: 30m
  chart:
    spec:
      chart: windmill
      version: 4.0.256
      sourceRef:
        kind: HelmRepository
        name: windmill
  maxHistory: 2
  # 15m, not helm-controller's 5m default. An appVersion bump rolls seven pods
  # (app x2, extra, workers-default x3, workers-native) onto freshly-pulled
  # windmill images, and 4.0.246 (1.792.2 -> 1.794.0) could not finish inside
  # 5m: it burned all four attempts on
  #   `timeout waiting for: [Deployment/windmill-{app,extra,workers-native,workers-default} InProgress]`
  # then rolled back to 4.0.245 and stalled on RetriesExceeded, which is a
  # not-Ready HelmRelease and so a dirty §6.0 check 7 in
  # docs/cluster-consolidation/20-low-power-tier.md. Both 1.794.0 images were
  # confirmed present upstream (HTTP 200) -- this was slowness, not the missing
  # windmill-extra image that pinned an earlier bump to 4.0.231.
  timeout: 15m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    windmill:
      baseDomain: ${APP}.${ROOT_DOMAIN}
      baseProtocol: https
      appReplicas: 2
      # `lspReplicas` was here until 2026-08-26 and is a DEAD KEY -- it appears
      # nowhere in the chart at 4.0.231, 4.0.246 or 4.0.249 (grepped, all three).
      # The windmill-extra Deployment reads `windmill.extraReplicas`, which
      # defaults to 1, so the behaviour was accidentally right and nothing ever
      # surfaced the mistake. Named correctly now so intent matches what renders.
      extraReplicas: 1
      multiplayerReplicas: 0
      windmillExtra:
        # PIN, NOT A PREFERENCE -- and the fix for a defect that has now broken
        # this app three times (1.782.0, then 1.795.0/1.796.0).
        #
        # windmill-extra.yaml renders its image as
        #   {{ default "ghcr.io/windmill-labs/windmill-extra" .image }}:{{ default .Chart.AppVersion .tag }}
        # so with `tag` empty the extra image tag is ASSUMED equal to the chart's
        # appVersion. Upstream does not honour that assumption: they ship
        # windmill-labs/windmill at every release but publish windmill-extra only
        # sometimes. Verified live 2026-08-26 against ghcr.io --
        #   windmill:1.796.0        200      windmill-extra:1.796.0   404
        #   windmill:1.794.0        200      windmill-extra:1.795.0   404
        #                                    windmill-extra:1.794.0   200  <- newest published
        # So chart 4.0.247/4.0.249 (appVersion 1.796.0) can never pull, exactly as
        # 4.0.232/4.0.233 could not at 1.782.0.
        #
        # Pinning `tag` replaces that assumption with a value validated against the
        # registry, which is why this is the durable fix rather than another chart
        # pin: a future chart bump now moves the app image only, and the extra image
        # stays on a tag that provably exists. Raise this when -- and only when --
        # a newer windmill-extra tag actually returns 200.
        # renovate: datasource=docker depName=ghcr.io/windmill-labs/windmill-extra
        tag: "1.803.0"
      # Read the connection URI from the Secret at runtime instead of baking it
      # into the rendered manifests. Three things were wrong with the old
      # `valuesFrom -> windmill.databaseUrl` mapping, and this fixes all three:
      #
      #   1. DATABASE_URL landed as a LITERAL VALUE in every pod spec, so the
      #      Postgres password was readable from `kubectl get deploy -o yaml`.
      #   2. Because no pod referenced the Secret, Reloader had nothing to watch
      #      -- it cannot restart on a change it cannot see.
      #   3. A rotated password therefore only reached the app when Flux
      #      re-rendered the HelmRelease, on its 30m interval. With the 4m
      #      ExternalSecret refresh in front of it that is up to ~34 minutes of
      #      running on a dead credential, every rotation.
      #
      # With a secretKeyRef the pod references the Secret directly, so Reloader
      # restarts it within seconds and the URI never appears in a manifest.
      databaseUrlSecretName: ${APP}-pguser-secret
      databaseUrlSecretKey: uri
      app:
        # NOTE: `app.annotations` renders onto the POD TEMPLATE, not the
        # Deployment. Reloader only honours the annotation on the workload, so
        # this one has never done anything -- verified live: the Deployment had
        # no reloader annotation and the pod template had one. The working copy
        # is applied by the post-render patch at the bottom of this file. This
        # is left in place because it is harmless and the chart offers no
        # `deploymentAnnotations` for the app component (worker groups do).
        annotations:
          reloader.stakater.com/auto: "true"
        volumes: &volumes
          - name: media
            persistentVolumeClaim:
              claimName: truenas-media
        volumeMounts: &volumeMounts
          - name: media
            mountPath: /media
      workerGroups:
        - name: default
          # The chart exposes deploymentAnnotations for worker groups
          # (but not for the app), so these land on the Deployment --
          # the only placement Reloader acts on.
          deploymentAnnotations:
            reloader.stakater.com/auto: "true"
          replicas: 3
          volumes: *volumes
          volumeMounts: *volumeMounts
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
        - name: native
          # The chart exposes deploymentAnnotations for worker groups
          # (but not for the app), so these land on the Deployment --
          # the only placement Reloader acts on.
          deploymentAnnotations:
            reloader.stakater.com/auto: "true"
          replicas: 1
          volumes: *volumes
          volumeMounts: *volumeMounts
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
    ingress:
      enabled: false
    postgresql:
      enabled: false
    minio:
      enabled: false
  # No valuesFrom any more. It existed only to inline the URI into
  # windmill.databaseUrl, which is exactly the behaviour being removed above.
  postRenderers:
    - kustomize:
        patches:
          # The app component has no deploymentAnnotations value, so its
          # Reloader annotation has to arrive by patch -- the same route
          # network/crowdsec and equestria/pinepods already use.
          - target:
              version: v1
              group: apps
              kind: Deployment
              name: windmill-app
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: windmill-app
                annotations:
                  reloader.stakater.com/auto: "true"
