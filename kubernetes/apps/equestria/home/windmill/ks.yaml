---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app windmill
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  # Anchored so ./postgres-roles can be reached without writing the path
  # twice; see POSTGRES_APP_PATH below.
  path: &path ./kubernetes/apps/equestria/home/windmill
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # Rotating credential, and this app needed #1168 before it could take one:
    # DATABASE_URL was a literal in every pod spec, so no pod referenced the
    # Secret and Reloader had nothing to watch. It arrives by secretKeyRef now,
    # the annotations are on the Deployments rather than the pod templates, and
    # the boot fits easily inside the chart's 600s startup probe.
    #
    # Windmill holds ~51 pooled connections, but its cutover was 4 auth
    # failures in 3ms: PostgreSQL does not terminate live sessions when a
    # role's password changes, so the burst tracks reconnect RATE, not pool
    # size. See docs/postgres-credentials/PLAN.md.
    - ../../../../components/postgres
    # windmill_user and windmill_admin -- the NOLOGIN row-security principals
    # Windmill's migrations and RLS policies name. They existed in the cluster
    # and in no manifest until this line. Manifests in ./postgres-roles/;
    # needs POSTGRES_APP_PATH below.
    - ../../../../components/postgres/roles
  # The `windmill` LOGIN role must be a member of both RLS principals: every
  # user_db transaction starts with `SET LOCAL ROLE windmill_admin` (or
  # windmill_user) inside set_session_context(), and PostgreSQL only allows
  # SET ROLE to a role you are a member of. Upstream grants this itself --
  # migration 20241127171723_apply_windmill_roles runs
  #   GRANT windmill_user TO CURRENT_USER; GRANT windmill_admin TO CURRENT_USER;
  # -- but components/postgres renders DatabaseRole/windmill with no `inRoles`,
  # and CNPG enforces that empty list, so the membership could be revoked and
  # nothing in git would put it back. That happened on 2026-10-21: every
  # workspace/script/folder API call failed with 42501
  # `permission denied to set role "windmill_admin"`.
  #
  # Two levels of patch, the same route as components/postgres/superuser: this
  # one patches the nested `windmill-postgres` Kustomization, which then
  # patches the DatabaseRole it renders. JSON6902 append, so it composes with
  # any sibling component that also adds to `spec.patches`.
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        # A regex, as in components/postgres/superuser: patches run BEFORE
        # postBuild substitution, so the object is still `${APP}-postgres`
        # here, and `$` keeps `${APP}-postgres-roles` out of it.
        name: .*-postgres$
      patch: |-
        - op: add
          path: /spec/patches/-
          value:
            target:
              group: postgresql.cnpg.io
              kind: DatabaseRole
            patch: |-
              apiVersion: postgresql.cnpg.io/v1
              kind: DatabaseRole
              metadata:
                name: not-used
              spec:
                inRoles:
                  - windmill_user
                  - windmill_admin
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # Where components/postgres/roles looks for this app's extra
      # DatabaseRoles -- it appends `/postgres-roles`. The anchor means the
      # path is written once, so moving this directory cannot leave a stale
      # roles path behind.
      POSTGRES_APP_PATH: *path
