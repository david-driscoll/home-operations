---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app windmill
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/home/windmill
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/postgres
    # TRANCHE 8. Second of two PRs: #1168 had to come first, because until
    # it landed a rotated password could not reach this app at all.
    #
    # DATABASE_URL used to be a literal in every pod spec, so no pod
    # referenced the Secret and Reloader had nothing to watch; propagation
    # depended on Flux re-rendering the HelmRelease on its 30m interval.
    # It now arrives by secretKeyRef, the workload annotations are on the
    # Deployments rather than the pod templates, and the boot fits easily
    # inside the chart's 600s startup probe.
    #
    # Expect the loudest cutover of the migration. Windmill holds ~51
    # pooled connections against Postgres -- coder, the previous high
    # water mark, held 4 and logged 8 failures over 8 seconds. Every one of
    # those dies the instant OpenBao rotates and before Reloader has
    # restarted the pods. That is the documented rotate-then-propagate gap,
    # not a fault, but it will be visible in the Postgres log.
    - ../../../../components/postgres/rotate
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
