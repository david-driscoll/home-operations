---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app freshrss
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        replicas: 1
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: OnRootMismatch

        containers:
          *app :
            image: &image
              repository: freshrss/freshrss
              tag: 1.29.1@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
            env:
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: ${APP}-env
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1024Mi
            probes:
              # Neither probe may target `/`. FreshRSS serves `/` from p/index.php,
              # which 302s to `/i/?rid=...`, and the image's own Apache config puts
              # `/i/` behind mod_auth_openidc (`<Directory /var/www/FreshRSS/p/i>`
              # with `AuthType openid-connect` inside `<IfDefine OIDC_ENABLED>`, and
              # the container does run with `-D OIDC_ENABLED`), so hop 2 redirects to
              # authentik.driscoll.tech. The kubelet follows same-host redirects but
              # returns the last response on a cross-host one, so it lands on that
              # 3xx: the probe PASSES but emits `ProbeWarning: Probe terminated
              # redirects` every cycle, and drives ~1080 mod_auth_openidc warnings
              # per 5 minutes into the pod log (requests arriving through Traefik
              # produce none, because they carry X-Forwarded-*).
              #
              # Liveness and readiness deliberately do NOT share a path. They answer
              # different questions, so they used to share an anchor and should not.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # greader.php short-circuits on `exit('OK')` BEFORE
                    # initSystem(), so it proves Apache + mod_php + the autoloader
                    # and deliberately nothing else. That is exactly what liveness
                    # should assert: restarting is the right remedy for a wedged
                    # PHP, and the wrong remedy for a bad config or a down database.
                    # The path must stay exactly this -- `/api/greader.php/` with a
                    # trailing slash returns 400, which at failureThreshold 3 would
                    # put the pod into CrashLoopBackOff.
                    path: /api/greader.php
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # p/api/index.php DOES call initSystem() and returns 500
                    # "Invalid system init!" if data/config.php cannot be read, so
                    # readiness keeps proving the Longhorn PVC is mounted and
                    # readable -- coverage `/` used to provide and that greader.php
                    # does not. Kept on readiness only: on liveness a bad config
                    # would become a restart loop instead of an unready pod.
                    #
                    # NOTE: neither path can detect a database failure. There is no
                    # unauthenticated FreshRSS endpoint that opens a connection, so
                    # a DB outage leaves the pod Ready and serving 500s. That needs
                    # a log-based alert, not a probe.
                    path: /api/
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

        # Copy the ESO-rendered system config onto the PVC before Apache starts.
        #
        # It is a COPY rather than a subPath mount on purpose. FreshRSS's
        # Minz_Configuration::save() writes config.php.tmp.php and then
        # rename()s it over config.php -- and that rename is error-suppressed
        # (@rename) with save() returning true regardless. Over a read-only
        # bind-mount the rename fails EBUSY, so the admin "System configuration"
        # page would report success while changing nothing and leaving a stray
        # .tmp.php behind. Copying keeps config.php a real writable file, so
        # FreshRSS behaves normally; git still wins, because this overwrites the
        # file on every start.
        #
        # Reuses the app image via the &image anchor so there is exactly one
        # digest pin for Renovate to bump, and no second image to pull.
        initContainers:
          sync-config:
            image: *image
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                mkdir -p /var/www/FreshRSS/data
                # Write THROUGH the existing file rather than replacing it, and do
                # not chmod. The PVC copy is owned by uid 568 (FreshRSS's own
                # install wrote it) while this container runs as uid 0 with
                # `capabilities: drop: ALL`. Dropping ALL removes CAP_FOWNER, and
                # chmod on a file you do not own needs CAP_FOWNER -- so `chmod`
                # here fails with EPERM even as root, and under `set -e` that
                # crash-loops the pod in Init. Redirection only needs write
                # permission, which we have because the file is mode 0664 with
                # group root and our gid is 0; it also preserves the owner and
                # mode instead of fighting them. On a first install the file does
                # not exist yet and is created 0644 root:root, which is equally
                # fine because every process in this pod runs as root.
                cat /config-src/config.php > /var/www/FreshRSS/data/config.php
                echo "sync-config: config.php written from freshrss-env"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /var/www/FreshRSS/data
      extensions:
        type: emptyDir
        globalMounts:
          - path: /var/www/FreshRSS/extensions
      # Mounted ONLY into the initContainer. The app container gets its
      # credentials through envFrom and must not also see the rendered config.
      config-src:
        type: secret
        name: ${APP}-env
        advancedMounts:
          *app :
            sync-config:
              - path: /config-src
                readOnly: true

    service:
      app:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port
            targetPort: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
