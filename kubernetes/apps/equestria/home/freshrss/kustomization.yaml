---
# kustomization.yaml
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./definition.yaml
# resources/config.php is FreshRSS's SYSTEM config, slurped whole and rendered as
# a Go text/template by the ExternalSecret (templateFrom / templateAs: Values).
# disableNameSuffixHash keeps the name stable so the ExternalSecret can reference
# it by name; ESO re-reads the ConfigMap on its 4m refresh, so an edit here lands
# within one interval and reloader then restarts the pod.
configMapGenerator:
  - name: freshrss-config-tpl
    files:
      - ./resources/config.php
generatorOptions:
  disableNameSuffixHash: true
