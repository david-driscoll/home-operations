---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app freshrss
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/freshrss
  prune: true
  force: false
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # CORRECTION (2026-08-27): the preflight note that used to sit here said the
    # pod "reads its credential from the freshrss-env Secret, so the 30-day
    # rotation actually reaches it". That was wrong, and it is why this app was
    # cleared as rotation-safe. FreshRSS reads DB_PASSWORD from the environment
    # exactly once -- at first install, when it writes data/config.php onto the
    # PVC. After that the PVC copy is authoritative. The rotation reached the
    # Secret and the pod's env and stopped there; FreshRSS served HTTP 500s
    # ("password authentication failed for user freshrss") for hours while the
    # pod sat 1/1 Ready with both probes green and Gatus passing on a 401 that
    # Traefik produces at the edge without ever reaching the pod.
    #
    # It is true NOW, for a different reason: the system config is rendered from
    # git by the ExternalSecret and copied onto the PVC by the sync-config
    # initContainer on every start. See resources/config.php.
    #
    # FreshRSS is PHP and connects per request, so it holds no pooled
    # connection to be invalidated at the cutover -- proof came from
    # pg_stat_database.xact_commit advancing, not from pg_stat_activity.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
