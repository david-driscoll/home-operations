---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app freshrss
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/freshrss
  prune: true
  force: false
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/postgres
    # TRANCHE 2. Same one-line opt-in grafana took in tranche 1: drops
    # passwordSecret from the DatabaseRole, repoints the credential
    # ExternalSecret at the OpenBao static-creds generator, and makes the
    # Pulumi system stack create a static role -- which ROTATES THE PASSWORD
    # IMMEDIATELY and puts this app on a 30-day restart cycle.
    #
    # Preflighted: reloader.stakater.com/auto is on the DEPLOYMENT (not the pod
    # template), and the pod reads its credential from the freshrss-env Secret,
    # so a rotation actually reaches it.
    - ../../../../components/postgres/rotate
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
