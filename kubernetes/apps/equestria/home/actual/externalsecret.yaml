---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The authentik credential. REQUIRED by the pod, not `optional: true` -- the
# opposite of aurral, on purpose.
#
# `${APP}-oidc-credentials` does not exist until `stacks/system` has read
# ./definition.yaml and created the provider, which is after this app's first
# Flux apply. Until then this ExternalSecret fails to sync and the pod sits in
# CreateContainerConfigError. That wait is the point:
#
#   - A server started without these variables is unbootstrapped, and its
#     /account/bootstrap endpoint lets whoever reaches it first set the server
#     password. Once a password exists, the first OpenID login has to supply it.
#   - Reloader does not restart a pod when a Secret behind an optional
#     secretRef goes from absent to created, so the optional form needs a
#     manual pod delete anyway. The kubelet retries a missing required Secret on
#     its own.
#
# Nothing to seed by hand: the server keeps no app-owned secret (sessions live
# in account.sqlite).
#
# After `stacks/system` has run, nudge it rather than waiting out the interval:
#
#   kubectl -n equestria annotate externalsecret actual-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # The full /.well-known/openid-configuration URL. openid-client v5's
        # Issuer.discover() takes it as is, and the issuer it then validates ID
        # tokens against is the one in that document, so authentik's trailing
        # slash needs no handling here.
        ACTUAL_OPENID_DISCOVERY_URL: "{{ .oidc_openid_configuration_url }}"
        ACTUAL_OPENID_CLIENT_ID: "{{ .oidc_client_id }}"
        ACTUAL_OPENID_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
