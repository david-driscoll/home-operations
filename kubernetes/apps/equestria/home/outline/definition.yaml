---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: "Outline"
  category: Applications
  description: "Outline — collaborative knowledge base"
  url: &url https://${APP}.${ROOT_DOMAIN}
  icon: https://raw.githubusercontent.com/outline/outline/main/public/logos/outline-logo-light.png
  access_policy:
    groups:
      - family
  authentik:
    oauth2:
      clientType: confidential
      allowedRedirectUris:
        - url: "https://${APP}.${ROOT_DOMAIN}/auth/oidc.callback"
        - url: "https://${APP}.${TAILSCALE_DOMAIN}/auth/oidc.callback"
      propertyMappings:
        - email
        - openid
        - profile
      includeClaimsInIdToken: true
      subMode: user_email
  gatus:
    - group: "Applications"
      url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      # This service is scaled to 0 between 01:00 and 07:00, so a failed check in
      # that window is expected rather than an incident. Gatus keeps checking and
      # keeps the history; it just does not alert.
      maintenance-windows:
        - start: "01:00"
          duration: 6h
          timezone: ${TIMEZONE}
