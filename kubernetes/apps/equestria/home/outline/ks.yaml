---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app outline
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn: []
  path: ./kubernetes/apps/equestria/home/outline
  prune: true
  force: false
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # DROPPED APP (group E, 2026-08-25). Commented out, not deleted, because
    # this whole ks.yaml is parked -- the parent kustomization has it commented
    # out too. The Database CR, the database and the role were all removed, so
    # re-enabling this line does NOT just restore the old state: the Pulumi
    # `system` stack discovers this component and creates
    # `database/static-roles/${APP}`, which fails outright until CNPG has
    # recreated the login role. See the ORDER OF OPERATIONS block in
    # components/postgres/ks.yaml.
    # - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
