---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Four backends feed one env Secret:
#
#   openbao   -- SECRET_KEY and UTILS_SECRET, this app's own long-lived secrets
#   database  -- the rotating Postgres credential from components/postgres
#   cluster   -- the OIDC credential Pulumi writes after reading ./definition.yaml,
#                AND the Garage credential the operator writes from ./bucket.yaml
#                (both land as plain Secrets in `equestria`, which is exactly
#                what ClusterSecretStore/cluster reads)
#
# The previous revision of this file read `Outline Secret Key` from
# `onepassword-connect`. That store is the legacy path; app-owned secrets live
# in OpenBao now, under clusters/${CLUSTER_CNAME}/apps/<app>/<name>.
#
# ⚠ Every `extract` below must resolve or the WHOLE ExternalSecret fails, taking
# the Secret -- and therefore the pod -- with it. The two OpenBao documents must
# be seeded before this app first reconciles; see the runbook section in the PR
# description. The other three are written by controllers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Outline requires both, and they are NOT interchangeable: SECRET_KEY
        # encrypts data at rest, UTILS_SECRET signs internal utility requests.
        # Rotating SECRET_KEY makes existing encrypted columns unreadable, so
        # these are two separate documents that can move independently.
        SECRET_KEY: "{{ .outline_secret_key }}"
        UTILS_SECRET: "{{ .outline_utils_secret }}"

        # `uriql` is the postgresql:// spelling, which is what Sequelize wants.
        # It carries `?sslmode=disable` -- correct here, the hop to
        # postgres-rw never leaves the pod network and CNPG's CA is self-signed.
        DATABASE_URL: "{{ .postgres_uriql }}"

        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        OIDC_AUTH_URI: "{{ .oidc_authorization_url }}"
        OIDC_TOKEN_URI: "{{ .oidc_token_url }}"
        OIDC_USERINFO_URI: "{{ .oidc_userinfo_url }}"
        # `end_session_url`, NOT `logout_url`. components/authentik.ts writes
        # the field as `end_session_url`; the parked values.yaml asked for
        # `.oidc_logout_url`, which does not exist and rendered empty -- which
        # is precisely the "users cannot log out" case upstream warns about.
        OIDC_LOGOUT_URI: "{{ .oidc_end_session_url }}"

        # The GarageKey operator writes `access-key-id`, `secret-access-key`,
        # `endpoint`, `host`, `region` and `scheme`; the rewrite below turns the
        # dashes into underscores and prefixes them. `endpoint` already carries
        # the http:// scheme, which is the form AWS_S3_UPLOAD_BUCKET_URL wants.
        #
        # AWS_S3_UPLOAD_BUCKET_NAME is deliberately NOT here. The operator does
        # not write a `bucket` key for this key's shape -- see the long note on
        # `includeBucketName` in ./bucket.yaml -- and a template referencing a
        # key the Secret does not have fails the ENTIRE ExternalSecret with
        # `could not update secret`, which names neither the key nor the
        # template. The bucket name is not a secret; it is an env literal in
        # ./helmrelease.yaml.
        AWS_ACCESS_KEY_ID: "{{ .garage_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_secret_access_key }}"
        AWS_REGION: "{{ .garage_region }}"
        AWS_S3_UPLOAD_BUCKET_URL: "{{ .garage_endpoint }}"
  data:
    - secretKey: outline_secret_key
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/secret-key
        property: password
    - secretKey: outline_utils_secret
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/utils-secret
        property: password
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"

    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"

    - extract:
        key: '${APP}-garage-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "garage_$1"
