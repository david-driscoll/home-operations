---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/home/immich
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: valkey
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/postgres
    # immich needs a superuser role -- it installs extensions (vectors/vchord)
    # into its own database at startup. This was `superuser: true` in the
    # generated `cluster.roles` block, and it has to be restated because a
    # DatabaseRole ADOPTS an existing role and forces every attribute to match
    # the manifest, so leaving it out would silently demote the live role.
    #
    # A component, not a substitution: booleans cannot pass through
    # postBuild.substitute. See components/postgres/superuser.
    #
    # ROTATION PRESERVES THIS. immich was the last app migrated (tranche 9)
    # precisely to prove the interaction: OpenBao rotates by issuing
    # `ALTER ROLE ... PASSWORD`, which touches no other attribute, so
    # `rolsuper` stayed true through the cutover and all 8 extensions --
    # `vector` included -- survived it.
    - ../../../../components/postgres/superuser
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_ACCESSMODES: ReadWriteMany
      TAILSCALE_HOST: photos
