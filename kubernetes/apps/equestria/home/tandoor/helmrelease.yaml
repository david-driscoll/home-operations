---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tandoor
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        pod:
          securityContext:
            runAsNonRoot: false

        containers:
          *app :
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.6.13@sha256:f6c58afdea7a721d079ebd6ee5483f2c9da77dd1e709e16d60a82c218e80a451
            env:
              DEBUG: "0"
              ALLOWED_HOSTS: "*"
              GUNICORN_MEDIA: "0"
              TANDOOR_PORT: &port 8888
            envFrom:
              - secretRef:
                  name: ${APP}-env
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1024Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  # 1s was too tight. Django's first request after a boot can
                  # take several seconds, and a timed-out probe is a FAILED
                  # probe -- that is what the `499` in the access log was, and
                  # three of them killed the container.
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # A cold boot is nginx -> wait for DB -> migrate -> collectstatic
              # -> gunicorn, and collectstatic re-hashes every static file on
              # every start. Measured at ~2m40s. Liveness allows 40s, so without
              # this the container is killed mid-collectstatic, and because the
              # next boot starts collectstatic over again it can crash-loop
              # rather than converge.
              #
              # Observed for real on 2026-08-25: the tranche-3 password rotation
              # triggered the first restart in days and tandoor took 6 restarts
              # to come up. The credential was never the problem -- every
              # attempt logged `Database is ready` and `No migrations to apply`.
              #
              # While a startup probe is pending, liveness and readiness are
              # both suppressed, so this only widens the boot window and leaves
              # steady-state behaviour untouched.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # 10 minutes, ~4x the measured cold boot.
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/recipes/mediafiles
            subPath: mediafiles
          - path: /opt/recipes/staticfiles
            subPath: staticfiles
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /opt/recipes/cookbook/static/django_js_reverse
            subPath: django_js_reverse
          - path: /tmp
            subPath: tmp

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user
