---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tandoor
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/tandoor
  prune: true
  force: false
  wait: true
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # POSTGRES_PASSWORD is owned by OpenBao and rotates on a 30-day period.
    # Preflighted in tranche 3: the Deployment carries
    # reloader.stakater.com/auto and reads the password through `envFrom` on
    # ${APP}-env, so the forced restart actually reaches the app.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      # Mirrors this app's internal HTTPRoute, which gates every path behind
      # authentik with no API carve-out -- so this app deliberately does NOT add
      # components/tailscale/api-key.
      TAILSCALE_MIDDLEWARE: tailscale-user
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_ACCESSMODES: ReadWriteMany
