---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Four backends feed one env Secret, every key a DT_* override that Donetick's
# viper loader (config/config.go: SetEnvPrefix("DT"), "." -> "_") lays over
# the non-secret /config/selfhosted.yaml rendered by ./helmrelease.yaml:
#
#   openbao   -- the JWT signing secret and the dedicated Pushover app token
#   database  -- the rotating Postgres credential from components/postgres
#   cluster   -- the OIDC credential Pulumi writes from ./definition.yaml, and
#                the Garage credential the operator writes from ./bucket.yaml
#
# ⚠ Every source below must resolve or the WHOLE ExternalSecret fails and the
# pod never starts. Seed both OpenBao documents before first reconcile.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # >= 32 chars and not on the weak list, or the binary panics at boot
        # (validateJWTSecret). Rotating it signs every user out.
        DT_JWT_SECRET: "{{ .donetick_jwt_secret }}"
        # The application token of the dedicated Pushover app. Each user then
        # adds their own Pushover user key under Settings -> Notifications.
        DT_PUSHOVER_TOKEN: "{{ .donetick_pushover_token }}"

        # Donetick builds its own DSN from these (internal/database/database.go,
        # `sslmode=disable` hardcoded -- fine, the hop to postgres-rw stays on
        # the pod network).
        DT_DATABASE_HOST: "{{ .postgres_hostname }}"
        DT_DATABASE_PORT: "{{ .postgres_port }}"
        DT_DATABASE_NAME: "{{ .postgres_database }}"
        DT_DATABASE_USER: "{{ .postgres_username }}"
        DT_DATABASE_PASSWORD: "{{ .postgres_password }}"

        DT_OAUTH2_CLIENT_ID: "{{ .oidc_client_id }}"
        DT_OAUTH2_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        DT_OAUTH2_AUTH_URL: "{{ .oidc_authorization_url }}"
        DT_OAUTH2_TOKEN_URL: "{{ .oidc_token_url }}"
        DT_OAUTH2_USER_INFO_URL: "{{ .oidc_userinfo_url }}"

        # Only the credential and region come from the GarageKey Secret. The
        # endpoint is deliberately NOT its in-cluster `endpoint` -- see
        # `storage.endpoint` in ./helmrelease.yaml.
        DT_STORAGE_ACCESS_KEY: "{{ .garage_access_key_id }}"
        DT_STORAGE_SECRET_KEY: "{{ .garage_secret_access_key }}"
        DT_STORAGE_REGION: "{{ .garage_region }}"
  data:
    - secretKey: donetick_jwt_secret
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/jwt-secret
        property: password
    - secretKey: donetick_pushover_token
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/pushover
        property: token
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"

    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"

    - extract:
        key: '${APP}-garage-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "garage_$1"
