---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# FOUR Secrets, and the split is deliberate -- every `extract` in an
# ExternalSecret must resolve or the WHOLE object fails, taking its Secret and
# therefore the pod with it:
#
#   ${APP}-env         Postgres credential. Available as soon as
#                      components/postgres reconciles.
#   ${APP}-secret-key  PAPERLESS_SECRET_KEY, minted in-cluster. Never rotates.
#   ${APP}-admin       The break-glass superuser's password, minted in-cluster.
#   ${APP}-oidc        The authentik credential, which does NOT exist until
#                      `stacks/system` has read ./definition.yaml -- i.e. after
#                      this app's first Flux apply. Mounted `optional: true` in
#                      ./helmrelease.yaml so the pod boots with local login
#                      only instead of sitting in CreateContainerConfigError.
#
# Nothing here needs seeding in OpenBao by hand, unlike ../outline: the two
# app-owned secrets come from Password generators.
#
# After `pulumi up` in stacks/system, nudge the OIDC one rather than waiting
# for the refresh:
#
#   kubectl -n equestria annotate externalsecret paperless-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Must be stated: Paperless only infers `postgresql` from DBHOST being
        # set, and an explicit engine beside the credential it needs means the
        # two can never half-apply.
        PAPERLESS_DBENGINE: postgresql
        # Paperless reads these discretely; it has no DATABASE_URL.
        #
        # No sslmode: psycopg's `prefer` default negotiates TLS without
        # verifying it, and the hop to postgres-rw never leaves the pod
        # network. (PAPERLESS_DBSSLMODE was removed in v3 anyway --
        # PAPERLESS_DB_OPTIONS is its replacement.)
        PAPERLESS_DBHOST: "{{ .postgres_hostname }}"
        PAPERLESS_DBPORT: "{{ .postgres_port }}"
        PAPERLESS_DBNAME: "{{ .postgres_database }}"
        PAPERLESS_DBUSER: "{{ .postgres_username }}"
        PAPERLESS_DBPASS: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# Django's SECRET_KEY. Generated in-cluster rather than seeded into OpenBao
# because it is this instance's own secret with no other consumer, and because
# Paperless only SIGNS with it -- it encrypts nothing at rest (contrast
# ../outline, whose SECRET_KEY does, and so lives in OpenBao). Losing it costs
# sessions, password-reset links and the classifier model, which is an
# HMAC-signed pickle (paperless/signed_pickle.py) that is rejected and simply
# retrained by the next scheduled train task. No document is affected.
#
# No symbols: the value goes through s6's container environment and a shell
# before Django reads it, and 64 alphanumerics are plenty.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-secret-key
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. A Password generator mints a
# NEW value on every call, so `Periodic` would silently rotate the key on a
# schedule and log everyone out each time. Same spelling as
# ../dawarich/externalsecret.yaml.
#
# `deletionPolicy: Retain` keeps the Secret if the provider call ever fails.
# It does NOT survive this ExternalSecret being pruned -- `creationPolicy:
# Owner` garbage-collects the Secret with it, and the next boot mints a
# different key. That costs the sessions described above, not data.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-secret-key
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-secret-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PAPERLESS_SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-secret-key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-admin-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The password for PAPERLESS_ADMIN_USER (./helmrelease.yaml). It exists to
# close a window, not to be used day to day: with no users and no documents,
# Paperless redirects every visitor's sign-in page to a "create superuser"
# form (FIRST_INSTALL in documents/context_processors.py), and SSO cannot
# close that window because ${APP}-oidc does not exist yet on first boot.
# Seeding a superuser at start means there is never a moment where the first
# person on the LAN or tailnet to load the page owns the archive.
#
# It then stays as the break-glass login for when authentik is down. Read it
# with:
#
#   kubectl -n equestria get secret paperless-admin \
#     -o jsonpath='{.data.PAPERLESS_ADMIN_PASSWORD}' | base64 -d
#
# Paperless only USES it to create the user (manage_superuser never resets an
# existing password). So once someone changes the password in the UI, or this
# Secret is pruned and re-minted, the value here is stale and the UI's one is
# authoritative.
#
# CreatedOnce for the same reason as ${APP}-secret-key above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-admin
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PAPERLESS_ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-admin-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # django-allauth's provider config, as one JSON document because that
        # is the only shape Paperless accepts. It is here and not in
        # ./helmrelease.yaml because the client secret is inside it.
        #
        # `server_url` takes the DISCOVERY DOCUMENT, not the issuer. allauth
        # appends "/.well-known/openid-configuration" to any URL that does not
        # already contain "/.well-known/" (openid_connect/provider.py,
        # `wk_server_url`), and components/authentik.ts writes the issuer WITH
        # a trailing slash -- so `.oidc_issuer` here would fetch
        # `.../<slug>//.well-known/openid-configuration`. Same choice as
        # ../mealie, for a different library's reason.
        #
        # `provider_id` is part of the callback path registered in
        # ./definition.yaml; `name` is the label on the sign-in button.
        #
        # SCOPE must carry `groups` or PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
        # sees no claim and demotes every admin on login (see ./definition.yaml).
        #
        # PKCE is opt-in for allauth's OIDC provider (it inherits
        # pkce_enabled_default = False) and authentik supports S256.
        #
        # The values are interpolated raw, without JSON escaping, which is safe
        # only because components/helpers.ts `clientIdPair` mints both as
        # lowercase alphanumerics (`upper: false, special: false`). A
        # hand-supplied clientId/clientSecret in ./definition.yaml would void
        # that.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
          { "openid_connect": {
            "SCOPE": ["openid", "profile", "email", "groups"],
            "OAUTH_PKCE_ENABLED": true,
            "APPS": [ {
              "provider_id": "authentik",
              "name": "authentik",
              "client_id": "{{ .oidc_client_id }}",
              "secret": "{{ .oidc_client_secret }}",
              "settings": { "server_url": "{{ .oidc_openid_configuration_url }}" }
            } ]
          } }
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
