---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app degoog
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          # On the controller, which is the only place it does anything -- this
          # is what makes the 30-day OpenBao password rotation reach the pod.
          # See components/postgres/AGENTS.md.
          reloader.stakater.com/auto: "true"
        replicas: 1
        # Single replica against one ReadWriteOnce volume: a rolling update
        # would deadlock on the PVC.
        strategy: Recreate
        containers:
          *app :
            image:
              repository: ghcr.io/degoog-org/degoog
              tag: 0.25.0@sha256:a90a6e66765b7c05ec25c7bccaef55da3fc4e52ac0108abaebef81a3f6c1b4ba
              pullPolicy: IfNotPresent
            # The image's ENTRYPOINT is deliberately bypassed. entrypoint.sh
            # runs `mkdir -p /app/data`, `chown -R $PUID:$PGID /app/data` and
            # then `su-exec` -- all three of which need to start as root, and
            # the image config sets no USER, so the container would run as uid
            # 0 until su-exec dropped it.
            #
            # `fsGroup` below already makes the mounted PVC group-writable by
            # 1000, so the chown has nothing left to do. Calling bun directly
            # is the same command entrypoint.sh ends on, minus the privilege
            # dance -- the same shape apps/agents/toolhive-valkey uses to skip
            # its image's gosu wrapper.
            #
            # Safe to run without a writable HOME: the image sets
            # BUN_RUNTIME_TRANSPILER_CACHE_PATH=0, so bun writes no cache.
            command:
              - bun
              - run
              - src/server/index.ts
            envFrom:
              - secretRef:
                  name: ${APP}-env
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 4444
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # /readyz, not /healthz: degoog answers /healthz as soon as
                    # the HTTP server binds, and only flips /readyz once
                    # markReady() runs at the end of boot -- which is after the
                    # Postgres indexer adapter has connected.
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
            securityContext:
              allowPrivilegeEscalation: false
              # Extensions, engines and themes are installed by cloning into
              # ${DEGOOG_DATA_DIR}, and git wants a writable working area
              # outside the volume too.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

          # A degoog TRANSPORT backend -- how the server makes an outgoing
          # request for engines that block plain fetch. FlareSolverr runs a
          # real Chrome and solves Cloudflare's interstitial.
          #
          # A sidecar rather than its own app, deliberately: degoog is the only
          # consumer in the estate (nothing else here has ever had a
          # FlareSolverr), and same-pod means the transport URL is
          # `http://127.0.0.1:8191/v1` with no Service, no route and no way in
          # from outside the pod. A container OOM restarts only this container.
          #
          # ⚠️ THE EXTENSION IS NOT DEPLOYED BY THIS FILE. degoog transports are
          # Store extensions installed at runtime into ${DEGOOG_DATA_DIR}. This
          # only provides the backend; installing "FlareSolverr" from the Store
          # and pasting the URL above into its settings is a settings-page step.
          flaresolverr:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
              pullPolicy: IfNotPresent
            # Plain env, NOT `envFrom: degoog-env`. That Secret carries
            # DEGOOG_POSTGRES with the database password in it, and there is no
            # reason for a browser sandbox to hold a credential it never uses.
            env:
              TZ: "${TIMEZONE}"
              LOG_LEVEL: info
              LOG_HTML: "false"
              HOST: "0.0.0.0"
              # Quoted, and deliberately NOT the YAML anchor the probes below
              # use. An env value must be a string, while `httpGet.port` is an
              # IntOrString where a STRING means a named port -- so one shared
              # anchor cannot be correct for both, and whichever type it took
              # would silently break the other end.
              PORT: "8191"
              # Explicit. The default is already none, but a captcha solver is
              # the one setting here that would send page content to a third
              # party, so it is worth being unambiguous about.
              CAPTCHA_SOLVER: none
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # No dedicated health route -- `/` is the readiness
                    # endpoint and answers {"msg":"FlareSolverr is ready!"}.
                    path: /
                    port: &flaresolverr-port 8191
                  # Chrome takes a while to come up on first start.
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *flaresolverr-port
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 12
            securityContext:
              allowPrivilegeEscalation: false
              # Chrome writes profiles and crash dumps under /app.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                # Chrome is the whole workload here; a challenge-solving run
                # spikes well above idle.
                memory: 1536Mi

    defaultPodOptions:
      # 1000 suits BOTH containers, which is luck worth writing down rather
      # than relying on: degoog's base is oven/bun (user `bun`, uid 1000) and
      # FlareSolverr's Dockerfile runs a bare `useradd flaresolverr` on
      # python:3.11-slim, which takes the first free id -- also 1000. The
      # numeric value is load-bearing for a second reason: FlareSolverr's image
      # declares USER by NAME, and with `runAsNonRoot: true` and no numeric
      # override the kubelet refuses to start it ("has non-numeric user
      # (flaresolverr), cannot verify user is non-root").
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          # Must agree with DEGOOG_DATA_DIR in externalsecret.yaml. Everything
          # degoog persists -- server-settings.json (which holds the API
          # secret and the instance identifier that namespaces the shared
          # valkey cache), plugin settings, installed extensions, the
          # blocklist, the indexer config -- lives under here.
          - path: /app/data

      # Kubernetes gives a container 64Mi of /dev/shm, and Chrome uses shared
      # memory for its renderer surfaces. Past that it does not degrade, it
      # crashes -- the classic mid-challenge tab death that reads as a
      # FlareSolverr timeout rather than an out-of-space error. This is the
      # `shm_size: 2gb` line every FlareSolverr compose file carries.
      #
      # 512Mi, not 2Gi: `medium: Memory` counts against the CONTAINER's memory
      # limit, so a larger one could be filled to push flaresolverr past its
      # 1536Mi and OOM it. 512Mi is far above what a single Chrome needs and
      # still leaves the limit headroom.
      dev-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        # advancedMounts, not globalMounts: degoog has no use for it, and a
        # tmpfs on degoog's /dev/shm would count against ITS limit too.
        advancedMounts:
          degoog:
            flaresolverr:
              - path: /dev/shm

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          # `search`, not `degoog`. TAILSCALE_HOST in ks.yaml carries the same
          # name onto the tailnet.
          - "search.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  # Network gate only, no authentik outpost -- see the note in
                  # definition.yaml. A browser's address-bar search and the
                  # OpenSearch descriptor cannot follow an auth redirect.
                  name: local-user
