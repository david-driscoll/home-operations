---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app degoog
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: valkey
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/degoog
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # DEGOOG_POSTGRES puts the indexer on Postgres instead of its bundled
    # SQLite file, which is the documented way to run a busy instance.
    #
    # Rotating credential, preflighted the way freshrss was:
    # reloader.stakater.com/auto sits on the controller in helmrelease.yaml,
    # and the pod reads its credential out of the degoog-env Secret, so the
    # 30-day rotation actually reaches it.
    #
    # ⚠️ This was the app that found the new-app ordering trap in #1180 --
    # `stacks/system` raced Flux to the merge commit and died on
    # `role "degoog" does not exist`. Read the ORDER OF OPERATIONS block in
    # components/postgres/ks.yaml before adding this component to a NEW app.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # The app is `degoog`; the address is `search`. Same split immich has
      # between its name and `photos`. This names the tailnet device, which the
      # component otherwise defaults to ${APP}.
      TAILSCALE_HOST: search
