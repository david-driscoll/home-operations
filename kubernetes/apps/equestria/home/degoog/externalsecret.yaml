---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TZ: "${TIMEZONE}"
        LOG_LEVEL: "info"

        # --- server ------------------------------------------------------
        DEGOOG_PORT: "4444"
        # 0 = TRUST the proxy. The variable is named for the negative, so this
        # reads backwards: the default of 1 makes degoog ignore X-Forwarded-For
        # and X-Real-IP, which behind the internal gateway means every client
        # looks like the Traefik pod -- collapsing degoog's own rate limiting
        # and IP blocklist onto a single source address.
        #
        # Safe here specifically because nothing reaches this Service except
        # through that gateway: the HTTPRoute is the only ingress path, and the
        # `local-user` filter is a network gate in front of it.
        DEGOOG_DISTRUST_PROXY: "0"

        # --- data --------------------------------------------------------
        # Explicit rather than inherited from the working directory. Everything
        # else on disk (plugins, engines, themes, server-settings.json, the
        # indexer directory) derives from this one path -- see paths.ts -- so
        # this is the single value that has to agree with the volsync PVC's
        # mount point in helmrelease.yaml.
        DEGOOG_DATA_DIR: /app/data

        # --- indexer -----------------------------------------------------
        # DELIBERATELY NOT `{{ .postgres_uri }}`. That key carries
        # `?sslmode=disable`, and degoog's driver is postgres.js 3.4.9, which
        # does `query.sslmode && (query.ssl = query.sslmode)` -- so the string
        # "disable" lands in `ssl` as a TRUTHY value and the client opens a TLS
        # connection, with rejectUnauthorized left at its default because
        # "disable" is not one of require/allow/prefer. Against CNPG's
        # self-signed CA that fails certificate verification, and the indexer
        # would silently fall back with `adapter boot failed` in the log.
        #
        # Omitting the query string entirely leaves postgres.js at its
        # documented default of `ssl: false`, which is the plaintext connection
        # every other app in this namespace already makes to postgres-rw.
        DEGOOG_POSTGRES: "postgres://{{ .postgres_username }}:{{ .postgres_password }}@{{ .postgres_hostname }}:{{ .postgres_port }}/{{ .postgres_database }}"

        # --- cache -------------------------------------------------------
        # The shared valkey in `database`, which sets no password (see
        # apps/agents/toolhive-valkey/helmrelease.yaml for why that is
        # deliberate and why toolhive got its own instead).
        #
        # Database 9: 8 is searxng, 6 is dispatcharr. degoog already namespaces
        # its keys by a per-instance identifier, so a distinct index is
        # tidiness rather than correctness -- but it keeps a stray FLUSHDB from
        # taking two apps down.
        DEGOOG_VALKEY_URL: "redis://valkey.database.svc.cluster.local:6379/9"

        # --- settings gate -----------------------------------------------
        # Read ONLY from the environment -- there is no settings UI and no
        # on-disk file for it. Left unset, degoog mints a throwaway password per
        # process and prints it to the log, which on a restarting pod means the
        # admin panel's password changes without warning. The panel installs
        # extensions, and extensions run code on the server.
        DEGOOG_SETTINGS_PASSWORDS: "{{ .settings_password }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/degoog/settings-password
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "settings_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
