---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        TUDUDI_SESSION_SECRET: "{{ .tududi_session_secret }}"
        ENCRYPTION_KEY: "{{ .tududi_encryption_key }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # Authentik issuer URL — openid-client's Issuer.discover() accepts both
        # the issuer base URL and the full /.well-known/openid-configuration URL
        OIDC_ISSUER_URL: "{{ .oidc_openid_configuration_url }}"
        # PostgreSQL. Discrete variables rather than DATABASE_URL: the password
        # is OpenBao's and rotates every 30 days, and inside a URL it would have
        # to be percent-encoded (docs/16-postgresql.md) -- DB_PASSWORD is taken
        # verbatim. DB_DIALECT is what selects the engine without a URL.
        DB_DIALECT: postgres
        DB_HOST: "{{ .postgres_hostname }}"
        DB_PORT: "{{ .postgres_port }}"
        DB_NAME: "{{ .postgres_database }}"
        DB_USER: "{{ .postgres_username }}"
        DB_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        # was: Tududi
        key: clusters/equestria/apps/tududi/keys
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "tududi_$1"
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
