---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tududi
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/home/tududi
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # ⚠️ BRAND-NEW DATABASE (tududi ran on SQLite until now), so the new-app
    # ordering trap in components/postgres/ks.yaml applies: `stacks/system`
    # creates `database/static-roles/tududi`, which fails with
    #   ERROR: role "tududi" does not exist (SQLSTATE 42704)
    # if CNPG has not applied the DatabaseRole yet. Expect the `system` stack
    # to stall ONCE; recovery is the four commands in that file's ORDER OF
    # OPERATIONS block.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    # Still needed with the database in Postgres: the PVC holds attachments
    # (/app/uploads) and the per-user exports from Profile > Backup
    # (/app/backups), neither of which the nightly pg_dump sees.
    - ../../../../components/volsync
    - ../../../../components/sablier
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
