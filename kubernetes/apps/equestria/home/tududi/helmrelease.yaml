---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tududi
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        containers:
          *app :
            image:
              repository: docker.io/chrisvel/tududi
              tag: 1.7.3@sha256:ba5ab5dea7a763dc4ee6ab6453b044b2df448f3483e9e337e3f894bdcd68e116
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: ${APP}-env
            env:
              TZ: "${TIMEZONE}"
              NODE_ENV: production
              PORT: &port 3002
              HOST: "0.0.0.0"
              # Reverse proxy
              TUDUDI_TRUST_PROXY: "true"
              TUDUDI_ALLOWED_ORIGINS: "https://${APP}.${ROOT_DOMAIN}"
              # OIDC/SSO — credentials injected via ExternalSecret
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: "Authentik"
              OIDC_PROVIDER_SLUG: "authentik"
              OIDC_SCOPE: "openid profile email"
              OIDC_AUTO_PROVISION: "true"
              # tududi only creates (or links) an account when the provider
              # reports `email_verified: true`, and authentik's built-in `email`
              # mapping hardcodes it to False -- so on an empty database every
              # first login failed with "Your identity provider has not verified
              # this email address". This is upstream's documented opt-out for a
              # provider whose registrations you control (docs/10-oidc-sso.md),
              # which authentik here is. RomM has no such flag and gets the
              # claim from the `groups` mapping instead
              # (components/authentik/property-mappings.ts).
              OIDC_TRUST_UNVERIFIED_EMAIL: "true"
              CALDAV_ALLOW_PRIVATE_HOSTS: "true"
              # BASE_URL constructs the OIDC redirect URI: ${BASE_URL}/api/oidc/callback/authentik
              BASE_URL: "https://${APP}.${ROOT_DOMAIN}"
              # CalDAV — clients connect to https://${APP}.${ROOT_DOMAIN}/caldav/
              CALDAV_ENABLED: "true"
              FF_ENABLE_CALDAV: "true"
              # Database: PostgreSQL (components/postgres). DB_DIALECT and the
              # connection parts come from the ExternalSecret. Plaintext to
              # postgres-rw like every other app here.
              DB_SSL: "false"
              # Sized for the scheduler, not for users. On PostgreSQL every cron
              # job holds one pooled connection for its advisory lock for as long
              # as it runs (services/jobLock.js) and takes a SECOND one for its
              # own queries; the telegram-poller leader holds one more for the
              # life of the process. Five jobs share every quarter-hour tick and
              # up to ten share midnight, so a small pool fills with lock holders
              # that are each waiting for a connection: at 5 the first :00 tick
              # logged SequelizeConnectionAcquireTimeoutError after the 60s
              # acquire timeout, with requests queued behind it. 11 held at
              # worst, plus room for the job bodies and the API. The pool's
              # minimum is 0, so this is a ceiling, not a standing cost.
              DB_POOL_MAX: "20"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              readOnlyRootFilesystem: false
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        existingClaim: ${APP}
        advancedMounts:
          *app :
            *app :
              # The image sets TUDUDI_UPLOAD_PATH=/app/uploads and
              # TUDUDI_BACKUP_PATH=/app/backups. The mount used to sit at
              # /app/backend/uploads, which nothing wrote to, so attachments
              # landed in the container layer and died with the pod.
              #
              # The `db` subPath is no longer mounted: the retired SQLite file
              # (and start.sh's own db-backup-*.sqlite3 copies) stay on the PVC
              # as the way back, until someone deletes them.
              - path: /app/uploads
                subPath: uploads
              - path: /app/backups
                subPath: backups

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: *app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: sablier-${APP}
