---
# The sandbox's three shared secrets, minted in-cluster -- nothing to seed in
# OpenBao. Only these three components ever hold them:
#
#   api       SANDBOX_API_KEYS on the API, and N8N_SANDBOX_SERVICE_API_KEY on
#             n8n (../helmrelease.yaml reads this Secret directly).
#   register  SANDBOX_*_RUNNER_REGISTRATION_TOKEN on both API and runner.
#   runner    the key the API presents to the runner (runner-api-key) and the
#             set the runner accepts (runner-api-keys): one value, both keys.
#
# The chart reads this through `auth.existingSecret`, so the Secret's key names
# are the chart's `auth.secretKeys` defaults. CreatedOnce: rotating means
# deleting the Secret and then restarting the API and runner by hand -- the
# chart has no workload-annotation value for reloader. n8n restarts itself.
#
# Each generatorRef runs the generator once, so the same Password yields three
# independent values; the rewrites only rename its `password` key apart.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-sandbox-auth
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-sandbox-auth
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-sandbox-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        api-keys: "{{ .api }}"
        runner-registration-token: "{{ .register }}"
        runner-api-key: "{{ .runner }}"
        runner-api-keys: "{{ .runner }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-sandbox-auth
      rewrite:
        - regexp:
            source: "^password$"
            target: api
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-sandbox-auth
      rewrite:
        - regexp:
            source: "^password$"
            target: register
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-sandbox-auth
      rewrite:
        - regexp:
            source: "^password$"
            target: runner
