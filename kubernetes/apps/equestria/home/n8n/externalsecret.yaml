---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        DB_TYPE: postgresdb
        DB_POSTGRESDB_PORT: "{{ .postgres_port }}"
        DB_POSTGRESDB_DATABASE: "{{ .postgres_database }}"
        DB_POSTGRESDB_HOST: "{{ .postgres_hostname }}"
        DB_POSTGRESDB_USER: "{{ .postgres_username }}"
        DB_POSTGRESDB_PASSWORD: "{{ .postgres_password }}"
        N8N_ENCRYPTION_KEY: "{{ .n8n_password }}"
        N8N_LICENSE_ACTIVATION_KEY: "{{ .n8n_license_key }}"
  dataFrom:
    - extract:
        # was: N8N
        key: clusters/equestria/apps/n8n/credentials
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "n8n_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# n8n Assistant's model key (N8N_INSTANCE_AI_MODEL_API_KEY). Its own Secret,
# mounted `optional: true` in ./helmrelease.yaml: an `extract` above that
# fails to resolve takes ${APP}-env -- and the database password -- down with
# it, while a missing model key should only leave the assistant unconfigured.
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-ai
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: N8N_INSTANCE_AI_MODEL_API_KEY
      remoteRef:
        key: clusters/equestria/apps/n8n/ai-apikey
        property: token
