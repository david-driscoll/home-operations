---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./immich/ks.yaml
  - ./n8n/ks.yaml
  - ./dynacat/ks.yaml
  - ./obsidian-sync/ks.yaml
  # Super Productivity's web app is retired: the family's to-do list is ./tududi
  # now, and the setup guide's Tasks page points there. Unlisting it makes Flux
  # prune the app (it kept no data server-side; tasks lived in each browser) and
  # the next `stacks/system` run removes its authentik app. ./supersync stays
  # for the installed apps that still sync through it.
  # - ./super-productivity/ks.yaml
  - ./supersync/ks.yaml
  - ./windmill/ks.yaml
  - ./rustdesk/ks.yaml
  # - ./tandoor/ks.yaml
  - ./freshrss/ks.yaml
  # On trial, to compare against FreshRSS.
  - ./yarr/ks.yaml
  - ./ttrss/ks.yaml
  - ./searxng/ks.yaml
  - ./degoog/ks.yaml
  # - ./karakeep/ks.yaml
  - ./meilisearch/ks.yaml
  - ./tududi/ks.yaml
  - ./homelable/ks.yaml
  - ./postiz/ks.yaml
  - ./outline/ks.yaml
  - ./mealie/ks.yaml
  - ./dawarich/ks.yaml
  - ./sure/ks.yaml
  # OpenCloud is replaced by ./nextcloud at the same hostname
  # (docs/plans/nextcloud-migration.md). Unlisting it makes Flux prune the whole
  # app -- pods, routes, the tailnet device and the PVC; the next
  # `stacks/system` run removes its authentik app. The directory stays for
  # four weeks so rollback is re-adding this one line: the PVC re-seeds from the
  # restic repo (/repository/opencloud), which pruning does not touch.
  # - ./opencloud/ks.yaml
  - ./nextcloud/ks.yaml
  - ./actual-budget/ks.yaml
