---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: "Reitti"
  category: Applications
  description: "Reitti — personal location tracking, visit detection and trip analysis"
  url: &url https://${APP}.${ROOT_DOMAIN}
  # No dashboard-icons entry for Reitti (checked 2026-09-20, both svg/ and
  # png/ 404), so this points at the upstream logo the app itself serves.
  icon: https://raw.githubusercontent.com/dedicatedcode/reitti/main/src/main/resources/static/img/logo.svg
  access_policy:
    groups:
      - family
  authentik:
    # oauth2, NOT proxy. Reitti speaks OIDC itself (Spring Security's
    # oauth2Login), so the forward-auth outpost in front of it would
    # authenticate twice and break the /login/oauth2/code/oauth hop. Same
    # reasoning as outline and tududi; ./helmrelease.yaml's route therefore
    # uses the `local-user` middleware rather than `authenticated-user`.
    oauth2:
      clientType: confidential
      allowedRedirectUris:
        # Spring's default redirect-uri template is
        # {baseUrl}/login/oauth2/code/{registrationId}, and Reitti registers
        # its client under the id `oauth`
        # (spring.security.oauth2.client.registration.oauth.* in
        # application-docker.properties). baseUrl comes from the request, which
        # is why both hostnames are listed --
        # server.forward-headers-strategy=framework means Traefik's
        # X-Forwarded-Host decides which one it is.
        - url: "https://${APP}.${ROOT_DOMAIN}/login/oauth2/code/oauth"
        - url: "https://${APP}.${TAILSCALE_DOMAIN}/login/oauth2/code/oauth"
        # The post-logout redirect, not a login callback. Reitti's
        # OidcSecurityConfiguration sets
        # `postLogoutRedirectUri = "{baseUrl}/login?logout"`, and authentik
        # validates post_logout_redirect_uri against this same list. Omit these
        # two and signing out fails at the end-session endpoint rather than at
        # login, which is the confusing half of getting this wrong. The query
        # string is part of the value because the default matching_mode is
        # `strict`.
        - url: "https://${APP}.${ROOT_DOMAIN}/login?logout"
        - url: "https://${APP}.${TAILSCALE_DOMAIN}/login?logout"
      propertyMappings:
        - email
        - openid
        - profile
      # Reitti resolves a username from `preferred_username` FIRST out of the
      # ID token, only then from the user object and the userinfo endpoint
      # (CustomOidcUserService). Putting the claims in the ID token means the
      # first lookup succeeds and the account is named after the authentik
      # username rather than falling through to the email address.
      includeClaimsInIdToken: true
      # Back-channel logout. Reitti enables the endpoint unconditionally when
      # OIDC is on -- `.oidcLogout(logout -> logout.backChannel(...))` in
      # SecurityConfig -- and Spring mounts it at
      # /logout/connect/back-channel/{registrationId}.
      #
      # FIRST USER OF THIS FIELD IN THE ESTATE. It is plumbed
      # (schemas/authentik/properties.json -> components/authentik.ts ->
      # sdks/authentik ProviderOauth2.logoutUri) but no other definition sets
      # it, so if `stacks/applications` ever rejects it, this line is the thing
      # to drop -- losing only authentik-initiated logout propagation, not
      # login. authentik's own default logout method is `backchannel`, which is
      # the method this URI expects.
      logoutUri: "https://${APP}.${ROOT_DOMAIN}/logout/connect/back-channel/oauth"
  gatus:
    - group: "Applications"
      # /actuator/health, not `*url`. It is the one path Reitti permits
      # anonymously by name (SecurityConfig: `.requestMatchers("/actuator/health").permitAll()`),
      # so it answers 200 with a real health verdict instead of the 302-to-login
      # that `/` gives. The body condition is what makes this a check of the
      # APP rather than of Traefik -- the gateway can serve 200 for a pod that
      # has lost its database.
      url: https://${APP}.${ROOT_DOMAIN}/actuator/health
      method: GET
      conditions:
        - "[STATUS] == 200"
        - "[BODY].status == UP"
