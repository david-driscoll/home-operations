---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# app-template: Reitti publishes no Helm chart, only the compose files in
# github.com/dedicatedcode/reitti. Those describe four services, and this is
# where each one went:
#
#   reitti       -> the `app` container below
#   postgis      -> the shared CNPG cluster, via components/postgres. The
#                   PostGIS extension itself is declared on the Database CR in
#                   ./kustomization.yaml, because the app's login role cannot
#                   create an untrusted extension.
#   redis        -> the shared Valkey in `database`, index 13 (see REDIS_* below)
#   tile-cache   -> the `tile-cache` container below, a sidecar
#
# docker-compose-dev.yml additionally runs rabbitmq, mosquitto and
# owntracks/recorder. Those are NOT omitted by accident: the published
# docker-compose.yml dropped RabbitMQ at v5 (ingestion batches in-process now),
# and the MQTT/OwnTracks pieces are that file's local harness for the device
# integrations, which Reitti configures per-device from its own settings UI
# rather than from the environment. Nothing in the production compose or in
# application-docker.properties references a broker.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reitti
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          # On the WORKLOAD, which is where Reloader looks. It matters more
          # than usual here: ${APP}-oidc does not exist on first boot (see
          # ./externalsecret.yaml), so the restart that turns SSO on is
          # entirely Reloader's job.
          reloader.stakater.com/auto: "true"
        replicas: 1
        # Recreate, not RollingUpdate. Two reasons, either sufficient: the data
        # volume is ReadWriteOnce, and Reitti runs its Flyway migrations at
        # boot -- two instances migrating one database concurrently is the one
        # thing that can corrupt it.
        strategy: Recreate
        containers:
          *app :
            image:
              repository: docker.io/dedicatedcode/reitti
              # Docker Hub is the only registry upstream publishes to; there is
              # no GHCR mirror. `5` and `latest` both resolve here today -- the
              # exact version is pinned instead so an upstream retag cannot move
              # this deployment.
              tag: 5.5.0@sha256:c971835b33144d0ae21ed6e2cbac98064f92befa7c7e68f7bb7f2ae674f3f181
              pullPolicy: IfNotPresent
            envFrom:
              # POSTGIS_* -- always present.
              - secretRef:
                  name: ${APP}-env
              # OIDC_ENABLED, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
              # OIDC_ISSUER_URI. OPTIONAL, and that is load-bearing: the
              # authentik credential only exists once stacks/applications has
              # read ./definition.yaml and created the provider, which is after
              # this pod first boots. With the Secret absent,
              # `reitti.security.oidc.enabled` falls back to false and Reitti
              # serves local login; Reloader restarts it when the Secret lands.
              - secretRef:
                  name: ${APP}-oidc
                  optional: true
            env:
              TZ: "${TIMEZONE}"
              SERVER_PORT: &port 8080
              BASE_PATH: /
              LOGGING_LEVEL: INFO
              # Used for the links Reitti hands out -- the mobile-app
              # integration panel under Settings > Integrations reads it, and
              # shared Memories are built from it. Not the OIDC redirect: that
              # comes from the request's forwarded headers
              # (server.forward-headers-strategy=framework is set upstream),
              # which is why ./definition.yaml registers the tailnet hostname
              # too and this only names the canonical one.
              ADVERTISE_URI: "https://${APP}.${ROOT_DOMAIN}"
              # A JVM with a container memory limit and no explicit heap sizing
              # takes 25% of it by default. 75% of the 4Gi limit below leaves
              # room for the H3 work and the import batches.
              JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"

              # ---- Redis / Valkey -------------------------------------------
              # The shared, passwordless Valkey in `database`. Index 13: 6, 9,
              # 10, 11 and 12 are taken (dispatcharr, degoog, postiz, tracearr,
              # outline) and 0 is where every host-only consumer lands by
              # default. A distinct index keeps a stray FLUSHDB from taking two
              # apps down. The prefix is belt-and-braces on top of that, and
              # makes a KEYS scan legible.
              REDIS_HOST: valkey.database.svc.cluster.local
              REDIS_PORT: 6379
              REDIS_DATABASE: 13
              REDIS_CACHE_PREFIX: "reitti:"

              # ---- Tile cache -----------------------------------------------
              # The sidecar, same pod, same network namespace. Server-side
              # only: TileProxyController fetches through this URL and streams
              # the result to the browser (/api/v1/tiles/...), so `localhost`
              # is correct and never reaches a client.
              TILES_CACHE: "http://localhost:80"

              # ---- Spatial coverage (H3) ------------------------------------
              # Requested explicitly. On first start after this is enabled,
              # Reitti downloads the Paikka global administrative-boundary
              # database (~4 GB, ~5 GB extracted) and then assigns an H3 cell
              # to every stored location point in the background.
              #
              # The location is the upstream default, stated rather than
              # inherited so it is visible that it sits UNDER /data -- i.e. on
              # the volsync-backed PVC, which is what was asked for. Moving it
              # off /data would silently take it out of the backup.
              SPATIAL_COVERAGE: "true"
              SPATIAL_COVERAGE_LOCATION: /data/h3

              # ---- Authentication --------------------------------------------
              # Comma-separated, not space-separated -- Spring splits
              # `spring.security.oauth2.client.registration.oauth.scope` on
              # commas. `email` is beyond the upstream default because
              # ./definition.yaml grants the mapping and Reitti falls back to
              # the email claim when preferred_username is missing.
              OIDC_SCOPE: "openid,profile,email"
              # New authentik users get a Reitti account on first login. The
              # gate is authentik's own: ./definition.yaml binds the app to the
              # `family` group, so nobody else reaches this point.
              OIDC_SIGN_UP_ENABLED: "true"
              # ⚠️ MUST STAY false, at least until an OIDC user has been made an
              # admin by hand. Reitti's only ADMIN is the `admin` account that
              # migration V7 seeds with the password `admin`; OIDC-created users
              # get Role.USER (UserService.createNewUser). Setting this to true
              # CLEARS stored passwords on next OIDC login, which would lock the
              # estate out of Reitti's admin surface entirely.
              #
              # The first thing to do after this app is reachable is log in as
              # admin/admin, change that password, then log in via authentik and
              # promote that user under Settings > Users. Flyway will not
              # re-apply V7, so the seeded password is not restored on restart
              # -- it just stays whatever it was left as.
              DISABLE_LOCAL_LOGIN: "false"

              # Background data-management endpoints (clean, purge). Off, which
              # is upstream's default, stated because the failure mode of the
              # other value is "the data is gone".
              DANGEROUS_LIFE: "false"
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # The one path Reitti permits anonymously by name
                    # (SecurityConfig `.requestMatchers("/actuator/health")`).
                    path: /actuator/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 4
              readiness: *probes
              # Generous on purpose: a cold boot is a JVM start plus every
              # Flyway migration, and against an empty database that is all
              # ~100 of them. 10 minutes before the pod is declared failed.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /actuator/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              # The image's entrypoint only needs root to honour APP_UID/APP_GID
              # and chown /data. Running as a fixed non-root uid takes the
              # else-branch, which execs java directly -- /app/app.jar is 0644
              # and the JRE is world-executable, so the baked-in `reitti` user
              # (uid 1000) is not needed. fsGroup below is what makes /data
              # writable.
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

          tile-cache:
            image:
              repository: docker.io/dedicatedcode/reitti-tile-cache
              tag: 5.5.0@sha256:0f1c6d9968b0762e2d7007a981e4bfd9a52dd493f8e9d240c55f548d3c495e3d
              pullPolicy: IfNotPresent
            # RESOLVER_IP is deliberately unset: the entrypoint takes the first
            # nameserver out of /etc/resolv.conf, which in a pod is kube-dns,
            # and CoreDNS forwards the upstream tile hostnames on. Pinning a
            # public resolver here would be the only thing in this pod that
            # bypasses cluster DNS.
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            probes:
              liveness: &tileProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *tileProbes
            securityContext:
              # ROOT, and there is no non-root spelling of this image. Its
              # nginx.conf.template is baked in with `listen 80` and
              # `pid /var/run/nginx.pid`, so the alternatives are a root master
              # process or a ConfigMap fork of upstream's config that would
              # drift silently. The blast radius is one cache directory: this
              # container holds no credential, mounts no app data, and its only
              # volume is the emptyDir below.
              #
              # The four capabilities are the standard nginx set -- NET_BIND
              # for :80, SET{UID,GID} and CHOWN for the master spawning workers
              # as the `nginx` user. Everything else is dropped.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              # nginx rewrites /etc/nginx/nginx.conf from the template on every
              # start (envsubst, for RESOLVER_IP) and writes its pid to
              # /var/run, so the root filesystem cannot be read-only.
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # 568/568 rather than the image's own 1000: it matches
        # VOLSYNC_PUID/VOLSYNC_PGID, so the restic mover and the app agree on
        # the ownership of every file on the PVC. A mismatch there is only
        # discovered at RESTORE time, which is the worst moment to find it.
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        existingClaim: ${APP}
        advancedMounts:
          *app :
            *app :
              # reitti.storage.path is /data/ and SPATIAL_COVERAGE_LOCATION is
              # /data/h3, so avatars, in-flight imports and the H3 boundary
              # database all land on this one volume -- which is the volsync
              # PVC, as asked.
              - path: /data
      # The app container's root filesystem is read-only; the JVM still needs
      # somewhere for hsperfdata and for multipart uploads that spill to disk.
      tmp:
        type: emptyDir
        sizeLimit: 2Gi
        advancedMounts:
          *app :
            *app :
              - path: /tmp
      # nginx's proxy_cache_path zones: /var/cache/nginx/custom (max_size 2g)
      # and /var/cache/nginx/panoramax (max_size 1g). emptyDir, not the PVC --
      # it is a cache of publicly re-fetchable map tiles, it must not be inside
      # anything restic snapshots, and it must not share a quota with the app's
      # data. The sizeLimit is above the 3g nginx will use so nginx's own
      # eviction trips first and node disk pressure never does.
      tile-cache:
        type: emptyDir
        sizeLimit: 4Gi
        advancedMounts:
          *app :
            tile-cache:
              - path: /var/cache/nginx

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: *app
                port: *port
            filters:
              # `local-user`, not `authenticated-user`: Reitti speaks OIDC
              # itself, so the authentik forward-auth outpost in front would
              # authenticate twice and break the /login/oauth2/code/oauth hop.
              # This gate is the LAN check only. Same reasoning as outline and
              # tududi.
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
