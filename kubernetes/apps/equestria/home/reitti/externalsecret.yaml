---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# TWO Secrets, not one, and the split is load-bearing.
#
# `${APP}-env` carries the Postgres credential, which exists as soon as
# components/postgres reconciles. `${APP}-oidc` carries the authentik
# credential, which does NOT exist until `stacks/applications` has read
# ./definition.yaml and created the provider -- necessarily after this app's
# first Flux apply. Folding the two together would leave `${APP}-env`
# unrenderable until that Pulumi run, and the pod in
# CreateContainerConfigError rather than running without SSO: every `extract`
# in an ExternalSecret must resolve or the WHOLE object fails, taking its
# Secret with it.
#
# Separate, `${APP}-oidc` simply fails to sync until the Pulumi run, and
# ./helmrelease.yaml mounts it `optional: true`. That is also why OIDC_ENABLED
# lives in THAT Secret rather than beside the other literals -- with the Secret
# absent the variable is absent, `reitti.security.oidc.enabled` falls back to
# its `false` default, and Reitti boots on local login instead of crashing on
# an empty issuer URI. When the Secret appears, reloader restarts the pod.
#
# Reitti has no app-owned secret of its own (no SECRET_KEY, no signing key --
# sessions live in Valkey and everything else in Postgres), so unlike outline
# there is nothing to seed in OpenBao before first boot.
#
# After `pulumi up` in stacks/applications, nudge it rather than waiting for
# the refresh:
#
#   kubectl -n equestria annotate externalsecret reitti-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Reitti builds its own JDBC URL from these four --
        # `jdbc:postgresql://${POSTGIS_HOST}:${POSTGIS_PORT}/${POSTGIS_DB}` in
        # application-docker.properties -- so the discrete fields are what is
        # needed here, not one of the `uri`/`uriql` spellings.
        #
        # The variables are named POSTGIS_* because upstream ships against the
        # `postgis/postgis` image. It is a plain PostgreSQL connection; the
        # PostGIS part is the extension, pre-created on the Database CR by the
        # patch in ./kustomization.yaml.
        #
        # No sslmode is appended and none is wanted: the pgjdbc default is
        # `prefer`, which negotiates TLS without verifying it, and the hop to
        # postgres-rw never leaves the pod network.
        POSTGIS_HOST: "{{ .postgres_hostname }}"
        POSTGIS_PORT: "{{ .postgres_port }}"
        POSTGIS_DB: "{{ .postgres_database }}"
        POSTGIS_USER: "{{ .postgres_username }}"
        POSTGIS_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Present only when the rest of this Secret is, which is the whole
        # point of the split above.
        OIDC_ENABLED: "true"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # PASSED THROUGH WITH ITS TRAILING SLASH, deliberately.
        #
        # Spring Boot maps `issuer-uri` to
        # ClientRegistrations.fromIssuerLocation(), which does two things that
        # pull in opposite directions:
        #
        #   1. It fetches `<issuer.path> + "/.well-known/openid-configuration"`
        #      by string concatenation, with no path normalisation. authentik's
        #      per-provider issuer is
        #      https://<authentik>/application/o/<slug>/ -- WITH a trailing
        #      slash (components/authentik.ts relies on it; it builds
        #      openid_configuration_url as `${issuerUrl}.well-known/...`), so
        #      the fetched URL contains a double slash.
        #   2. It then asserts the discovery document's `issuer` claim equals
        #      the configured string EXACTLY. Trimming the slash to tidy up (1)
        #      breaks (2) with "The Issuer ... did not match the requested
        #      issuer", which is the failure this comment exists to prevent
        #      someone from re-introducing.
        #
        # (1) is harmless here: authentik's Go front-end collapses duplicate
        # slashes before Django routing, verified 2026-09-20 against
        # authentik.equestria.driscoll.tech -- `/-//health/live/` and
        # `/api/v3//root/config/` both answer 200 with no redirect. So the
        # unmodified value satisfies both halves, and `openid_configuration_url`
        # (which several other apps in this estate use instead) is NOT usable
        # here -- Spring wants the issuer, and appends the well-known path
        # itself.
        OIDC_ISSUER_URI: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
