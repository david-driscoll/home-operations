---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app searxng
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/searxng
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/tailscale
    # NO components/volsync. Its PVC was mounted at /var/cache/searxng and
    # nothing in this deployment ever wrote there: every nightly mover since
    # 2026-03 logged "Directory is empty skipping backup", so the restic repo
    # never got a snapshot and the `VolSync: Celestia` / `VolSync: Luna` copy
    # jobs went red on a backup of nothing. The only runtime state SearXNG keeps
    # lives in Valkey (settings.yml, db 8), and the settings are a ConfigMap in git. The
    # cache is an emptyDir in helmrelease.yaml now; if a favicon resolver is
    # ever enabled its cache is rebuildable and still does not need a backup.
    - ../../../../components/sablier
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
