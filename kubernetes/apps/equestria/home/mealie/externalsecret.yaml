---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# TWO Secrets, not one, and the split is load-bearing.
#
# `${APP}-env` carries the Postgres credential, which exists as soon as
# components/postgres reconciles. `${APP}-oidc` carries the authentik
# credential, which does NOT exist until `stacks/applications` has read
# ./definition.yaml and created the provider -- necessarily after this app's
# first Flux apply. Folding the two together would leave `${APP}-env`
# unrenderable until that Pulumi run, and the pod in
# CreateContainerConfigError rather than running without SSO: every `extract`
# in an ExternalSecret must resolve or the WHOLE object fails, taking its
# Secret with it.
#
# Separate, `${APP}-oidc` simply fails to sync until the Pulumi run, and
# ./helmrelease.yaml mounts it `optional: true`. That is also why
# OIDC_AUTH_ENABLED lives in THAT Secret rather than beside the other OIDC_*
# literals in ./helmrelease.yaml -- with the Secret absent the variable is
# absent, Mealie's OIDC_AUTH_ENABLED falls back to its `False` default, and it
# boots on local login instead of failing its OIDC_FEATURE validation on an
# empty configuration URL. When the Secret appears, Reloader restarts the pod.
#
# Mealie has no app-owned secret to seed: the session-signing key is generated
# on first boot into data/.secret on the PVC (core/settings/settings.py,
# `determine_secrets`), so unlike outline there is nothing to put in OpenBao
# beforehand. It does mean the PVC, not just the database, is what a restore
# has to bring back -- losing it invalidates every session.
#
# After `pulumi up` in stacks/applications, nudge it rather than waiting for
# the refresh:
#
#   kubectl -n equestria annotate externalsecret mealie-oidc \
#     force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # `postgres` is the ONLY value besides `sqlite`, and it is what makes
        # the five POSTGRES_* below get read at all -- Mealie's db_provider
        # factory ignores them under the `sqlite` default. It lives in this
        # Secret rather than in ./helmrelease.yaml's plain env so that the
        # engine selection and the credential it needs can never half-apply.
        DB_ENGINE: postgres
        # Mealie builds its own SQLAlchemy URL from these four
        # (core/settings/db_providers.py), so the discrete fields are what is
        # needed here rather than one of the `uri`/`uriql` spellings.
        #
        # No sslmode is appended and none is wanted: psycopg's default
        # negotiates TLS without verifying it, and the hop to postgres-rw never
        # leaves the pod network.
        POSTGRES_SERVER: "{{ .postgres_hostname }}"
        POSTGRES_PORT: "{{ .postgres_port }}"
        POSTGRES_DB: "{{ .postgres_database }}"
        POSTGRES_USER: "{{ .postgres_username }}"
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Present only when the rest of this Secret is, which is the whole
        # point of the split above.
        OIDC_AUTH_ENABLED: "true"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # THE DISCOVERY DOCUMENT, not the issuer. Mealie passes this straight
        # to authlib as `server_metadata_url`, which fetches it verbatim -- it
        # appends no well-known path of its own. So this takes
        # `openid_configuration_url` (which components/authentik.ts builds as
        # `${issuerUrl}.well-known/openid-configuration`) and NOT `.oidc_issuer`.
        #
        # This is the opposite choice from reitti next door, and deliberately
        # so: Spring wants the issuer and appends the path itself, authlib wants
        # the finished URL. Swapping either one for the other fails at
        # discovery, not at login, which is the harder failure to read.
        OIDC_CONFIGURATION_URL: "{{ .oidc_openid_configuration_url }}"
  dataFrom:
    - extract:
        key: '${APP}-oidc-credentials'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
