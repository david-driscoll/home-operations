---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/home/mealie
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # ⚠️ BRAND-NEW DATABASE. Mealie has never had a role, a database or an
    # OpenBao static role, so the new-app ordering trap in
    # components/postgres/ks.yaml applies in full: `stacks/system` discovers
    # this component and creates `database/static-roles/mealie`, which issues
    # `ALTER ROLE ... PASSWORD` immediately and fails with
    #   ERROR: role "mealie" does not exist (SQLSTATE 42704)
    # if CNPG has not applied the DatabaseRole yet. The Pulumi operator
    # reliably wins that race on new-app day, so expect the `system` stack to
    # go Stalled/UpdateFailed ONCE. Recovery is the four commands in the ORDER
    # OF OPERATIONS block in components/postgres/ks.yaml -- read it before
    # merge, not after the stack stalls.
    #
    # No extension patch here, unlike reitti: Mealie is plain SQLAlchemy plus
    # alembic and creates everything it needs with its own login role.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # The recipes themselves live in Postgres; this volume holds the uploaded
      # images and assets, Mealie's own backups under data/backups, and
      # data/.secret. 10Gi rather than the 5Gi default because recipe images
      # accumulate and a full volume is how the .secret write fails -- which
      # logs out every session at once.
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
