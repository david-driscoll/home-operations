---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app questarr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/equestria/games/questarr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # Rotating credential. Boot measured at 51s against a 180s liveness budget
    # -- 3.5x headroom, so unlike romm and tandoor this one never needed a
    # startup probe widened first. Reads POSTGRES_PASSWORD from questarr-env
    # via envFrom, and the annotation is on the Deployment.
    - ../../../../components/postgres
    - ../../../../components/tailscale
    - ../../../../components/tailscale/api-key
    - ../../../../components/volsync
  postBuild:
    substitute:
      # Browsers take the authentik chain, mirroring this app's internal
      # HTTPRoute. Requests carrying X-Api-Key/?apikey skip it via the
      # components/tailscale/api-key component above -- the same carve-out the
      # internal route makes, so API clients (nzb360, LunaSea, scripts) keep
      # working over the tailnet.
      TAILSCALE_MIDDLEWARE: tailscale-user
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 10Gi
