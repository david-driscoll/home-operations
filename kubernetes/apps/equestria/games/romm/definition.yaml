---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/stargate-command-cluster/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Romm
  category: Applications
  description: Romm is a media management tool for organizing and managing your game library.
  url: &url https://${APP}.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/romm.svg
  access_policy:
    groups:
      - friends
      - family
  authentik:
    oauth2:
      clientType: confidential
      allowedRedirectUris:
      - url: "https://${APP}.${ROOT_DOMAIN}/api/oauth/openid"
      - url: "https://${APP}.${TAILSCALE_DOMAIN}/api/oauth/openid"
      propertyMappings:
        - email
        - openid
        - profile
        - romm
      includeClaimsInIdToken: true
      subMode: user_email
  gatus:
    - group: Applications
      url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
      # Nightly Low Power shed (docs/cluster-consolidation/24-power-states.md).
      # This service is scaled to 0 between 02:00 and 09:00, so a failed check in
      # that window is expected rather than an incident. Gatus keeps checking and
      # keeps the history; it just does not alert.
      maintenance-windows:
        - start: "02:00"
          duration: 7h
          timezone: America/New_York
