---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.1.0-beta.3@sha256:4db0ee137a0948d27fea20dafc217d7c09d3ffaef2bfb7da6e89320201a64a50
            env:
              ROMM_PORT: &port 80
            envFrom:
              - secretRef:
                  name: ${APP}-env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              # Widened from failureThreshold 3 (a 30s budget) ahead of putting
              # romm's password on OpenBao rotation. A rotation is a forced
              # restart, and 30s was not enough room to bet an irreversible
              # rotation on: this pod's own conditions show Initialized ->
              # Ready taking 49s on its last boot, which is longer than the
              # budget the startup probe allowed it.
              #
              # It has survived anyway, so the exact kubelet timing is doing
              # something more forgiving than failureThreshold x periodSeconds
              # suggests -- but tandoor (#1142) crash-looped six times on
              # precisely this shape, an app whose boot did not fit its probe
              # budget, and that was discovered by rotating it rather than by
              # measuring first. 300s is ~6x the observed boot.
              #
              # Startup probes suppress liveness and readiness while pending,
              # so this only widens the boot window; steady state is unchanged.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              runAsNonRoot: true
              runAsUser: 568
              runAsGroup: 568
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 3Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100, 1000]

    # -- Configures service settings for the chart.
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /romm/assets/
            subPath: assets
          - path: /romm/resources/
            subPath: resources
      config:
        type: configMap
        name: ${APP}-config
        defaultMode: 493
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yaml
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /romm/config
            subPath: config
          - path: /tmp
            subPath: tmp
      truenas-media:
        existingClaim: truenas-media
        globalMounts:
          - path: /media/downloads
            subPath: downloads
          - path: /romm/library
            subPath: games/roms
          - path: /media/games
            subPath: games

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
