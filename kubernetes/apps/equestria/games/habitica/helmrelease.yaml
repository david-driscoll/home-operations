---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app habitica
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/awinterstein/habitica-server
              tag: 5.50.6@sha256:964caa1adddda20b7e11116f0892339bd0c740e4c7d9e2253b7991a0a610d5f1
            env:
              BASE_URL: https://${APP}.${ROOT_DOMAIN}
              NODE_ENV: production
              TZ: "${TIMEZONE}"
              NODE_DB_URI: "mongodb://127.0.0.1:27017/habitica?replicaSet=rs&directConnection=true&readPreference=primary"
              INVITE_ONLY: "false"
            ports:
              - containerPort: 3000
            probes:
              # The server only answers once mongod's replica set is up and its
              # own boot is done, which on a cold start is longer than the
              # liveness probe below allows. Liveness waits for this.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          mongo:
            image:
              repository: mongo
              tag: 9.0.2@sha256:bac22ea7710d774103dcad3ec8ac13cba1eb378f488e3ce8a6b3a1adf2ba9dcc
            # Habitica needs a replica set (it uses transactions), which is why
            # NODE_DB_URI above says `replicaSet=rs`. Upstream's compose starts
            # mongod this way and has its healthcheck call rs.initiate(); with
            # neither here the app could never connect.
            args: ["--replSet", "rs", "--bind_ip_all", "--port", "27017"]
            ports:
              - containerPort: 27017
            probes:
              # Idempotent: reads the set's status, and initiates it the first
              # time. The member is named 127.0.0.1 ON PURPOSE -- a bare
              # rs.initiate() records the pod's hostname, which changes on
              # every restart and would leave the set pointing at a host that
              # no longer exists. The app shares this pod and connects with
              # directConnection=true, so loopback is the stable address.
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - mongosh
                      - --quiet
                      - --port
                      - "27017"
                      - --eval
                      - |
                        try { rs.status().ok } catch (e) {
                          rs.initiate({ _id: "rs", members: [{ _id: 0, host: "127.0.0.1:27017" }] }).ok
                        }
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["mongosh", "--quiet", "--port", "27017", "--eval", "db.hello().isWritablePrimary || quit(1)"]
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
          email:
            image:
              repository: hashicorp/http-echo
              tag: 1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
            args:
              - "-text=OK"
              - "-listen=:8080"
            ports:
              - containerPort: 8080
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: 3000

    persistence:
      data:
        existingClaim: ${APP}
        advancedMounts:
          app:
            mongo:
              - path: /data/db
                subPath: mongo
      # (An emptyDir used to be mounted at /etc/environment in every container.
      # That path is a FILE in the habitica-server and mongo images, so runc
      # refused to start them: "error mounting ... not a directory". Nothing
      # here needs it writable.)

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
