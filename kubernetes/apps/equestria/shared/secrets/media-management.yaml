---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The five *arr API keys, assembled from five per-app OpenBao paths.
#
# This used to be one `dataFrom.extract` of `shared/media-management-secrets` —
# a single path holding NINETEEN fields, read by six ExternalSecrets across two
# namespaces, most of which wanted one or two of them. The reorganisation
# (docs/openbao-shared-secrets-reorg.md §G) split it: each app's key now lives
# at `clusters/equestria/apps/<app>/api-key`, so rotating Sonarr's key touches a
# path only Sonarr reads.
#
# The SECRET keeps its name and its key names. Five HelmReleases reference
# `spike-management-credentials` by `secretKeyRef` with these exact keys
# (prowlarr, radarr, sonarr, lidarr on their own; kometa on plex_token), and
# rewriting those at the same time as the KV layout would have meant two
# unrelated failure modes in one change. They move on their own schedule.
#
# `data:` rather than `dataFrom:` on purpose — the explicit list IS the
# inventory of which keys are actually consumed, which is precisely what the
# nineteen-field blob could not tell anyone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spike-management-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: spike-management-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
  data:
    - secretKey: prowlarr_apikey
      remoteRef:
        key: clusters/equestria/apps/prowlarr/api-key
        property: apikey
    - secretKey: radarr_apikey
      remoteRef:
        key: clusters/equestria/apps/radarr/api-key
        property: apikey
    - secretKey: sonarr_apikey
      remoteRef:
        key: clusters/equestria/apps/sonarr/api-key
        property: apikey
    - secretKey: lidarr_apikey
      remoteRef:
        key: clusters/equestria/apps/lidarr/api-key
        property: apikey
    - secretKey: plex_token
      remoteRef:
        key: clusters/equestria/apps/plex/token
        property: token
