---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app equestria-garage-grants
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # Ordering only -- garage-system/cluster/ks.yaml is `wait: false`, so this
    # gates on the CRDs being installed, not on Garage being up.
    - name: garage
      namespace: garage-system
  path: ./kubernetes/apps/equestria/shared/garage
  prune: true
  # A GarageReferenceGrant is a policy object with nothing to become ready --
  # its only status condition is `InUse`, which is False until something
  # actually references through it, and that something is an app that reconciles
  # later. Waiting here would gate this Kustomization on a condition that is
  # correctly False at the moment it is applied. The consumers report their own
  # health: a denied reference shows up on the BUCKET, as
  # `PermissionsConfigured: False`.
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
