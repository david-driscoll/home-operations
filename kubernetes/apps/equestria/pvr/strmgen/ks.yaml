---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app strmgen
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
  path: ./kubernetes/apps/equestria/pvr/strmgen
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/volsync
    # DROPPED APP (group E, 2026-08-25). Commented out, not deleted, because
    # this whole ks.yaml is parked -- the parent kustomization has it commented
    # out too. The Database CR, the database and the role were all removed, so
    # re-enabling this line does NOT just restore the old state: the Pulumi
    # `system` stack discovers this component and creates
    # `database/static-roles/${APP}`, which fails outright until CNPG has
    # recreated the login role. See the ORDER OF OPERATIONS block in
    # components/postgres/ks.yaml.
    # - ../../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
