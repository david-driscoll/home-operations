---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The whole of STRMGen's config.json, rendered here. THIS FILE IS WHERE STRMGEN
# IS CONFIGURED.
#
# STRMGen reads settings ONLY from strmgen/core/config.json inside its image
# (strmgen/core/config.py; it refuses to import without it). Upstream's
# docker-compose env block is not read by the code at all. So the file is the
# interface, and this renders it -- same shape as media/arr-mcp-jellyfin.
# ./helmrelease.yaml's seed-config init container copies it into a writable
# volume on every start, so GIT AND OPENBAO WIN over anything saved from the
# settings page, and over `last_run`, which the scheduler writes back.
#
# Keys follow upstream's config.base.json
# (https://github.com/MercenaryJustice/Strmgen/blob/main/config.base.json);
# deviations from it are commented. JSON has no comments, so they live here.
#
# Secrets are passed through `toJson` so a quote or backslash in a password
# cannot break the document.
#
#   api_base          In-cluster Dispatcharr. Also the prefix of every URL
#                     written INTO the .strm files, and those are fetched by
#                     Jellyfin's pod -- so the Service name is right, and a
#                     public hostname would be wrong.
#   username/password Dispatcharr's existing account, the same OpenBao path
#                     the dispatcharr pod's streamwatchdog sidecar reads.
#   access/refresh    Runtime token cache; STRMGen fetches its own at startup.
#   database_url      The component-rendered `${APP}-postgres` credential.
#                     STRMGen copies it into postgres_dsn at startup when
#                     enable_testcontainers is false. db_user/db_name are used
#                     in its startup GRANTs; the role owns the database.
#   output_root       /media/strm on truenas-media. STRMGen writes
#                     "Movies/<group>/<Title (Year)>/" and
#                     "TV Shows/<group>/<Show>/Season NN/" beneath it.
#   movies_groups /   Dispatcharr stream-group name patterns. SET THESE to the
#   tv_series_groups  VOD group names your playlist actually uses.
#   process_tv_series_groups
#                     true (base: false): the playlist carries series too.
#   only_updated_streams
#                     false (base: true). With true, only streams Dispatcharr
#                     updated in the last `last_modified_days` are processed,
#                     which makes the first run skip nearly everything.
#   tmdb_create_not_found
#                     false (base: true): an item TMDB cannot match is skipped
#                     and listed on the Skipped page, instead of becoming a
#                     metadata-less entry in Jellyfin.
#   emby_*            Unused (empty key = the Emby lookup is skipped), but the
#                     URL must be a string: the HTTP client is built from it at
#                     import time.
#   scheduled_hour    22:00 in ${TIMEZONE}. Dispatcharr is on the Low Power
#                     keep-list but this app is not, so the run must land
#                     outside 02:00-09:00.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # Short, like every postgres-backed app: the database password rotates and
  # must reach the pod (via reloader) before the old one is refused.
  refreshInterval: 4m
  target:
    name: ${APP}-config
    creationPolicy: Owner
    # An emptied Secret would leave the init container nothing to copy, and
    # STRMGen will not start without config.json.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "api_base": "http://dispatcharr.${NAMESPACE}.svc.cluster.local:9191",
            "token_url": "/api/accounts/token/",
            "username": {{ .dispatcharr_username | toJson }},
            "password": {{ .dispatcharr_password | toJson }},
            "stream_base_url": "/proxy/ts/stream/",
            "access": null,
            "refresh": null,

            "enable_testcontainers": false,
            "database_url": {{ .postgres_uriql | toJson }},
            "postgres_dsn": {{ .postgres_uriql | toJson }},
            "db_user": {{ .postgres_username | toJson }},
            "db_pass": {{ .postgres_password | toJson }},
            "db_name": {{ .postgres_database | toJson }},

            "clean_output_dir": false,
            "output_root": "/media/strm",

            "process_movies_groups": true,
            "movies_groups": ["Movies-*", "Movie-*"],
            "movie_year_regex": "^(.+?)\\s*\\((\\d{4})\\)$",
            "process_tv_series_groups": true,
            "tv_series_groups": ["Series-*"],
            "tv_series_episode_regex": "(.+?)[ ._-][sS](\\d{2})[eE](\\d{2})",
            "process_groups_24_7": false,
            "groups_24_7": ["24/7*"],
            "remove_strings": [],

            "skip_stream_check": true,
            "update_stream_link": false,
            "only_updated_streams": false,
            "last_modified_days": 1,

            "tmdb_api_key": {{ .tmdb_apikey | toJson }},
            "tmdb_language": "en-US",
            "tmdb_download_images": true,
            "tmdb_image_size": "original",
            "tmdb_create_not_found": false,
            "check_tmdb_thresholds": true,
            "batch_size": 30,
            "batch_delay_seconds": 2.0,
            "concurrent_requests": 10,
            "tmdb_rate_limit": 200,
            "minimum_year": 1995,
            "minimum_tmdb_rating": 1.0,
            "minimum_tmdb_votes": 1,
            "minimum_tmdb_popularity": 2.0,

            "write_nfo": true,
            "write_nfo_only_if_not_exists": false,
            "update_tv_series_nfo": false,

            "opensubtitles_download": false,
            "opensubtitles_app_name": "strmgen v1.0.0",
            "opensubtitles_api_key": "",
            "opensubtitles_username": "",
            "opensubtitles_password": "",

            "emby_api_url": "http://jellyfin.${NAMESPACE}.svc.cluster.local:8096/emby",
            "emby_api_key": "",
            "emby_movie_library_id": 0,

            "enable_scheduled_task": true,
            "scheduled_hour": 22,
            "scheduled_minute": 0,
            "last_run": null
          }
  data:
    # Shared with the dispatcharr pod (../dispatcharr/secret.yaml).
    - secretKey: dispatcharr_username
      remoteRef:
        key: clusters/equestria/apps/dispatcharr/credentials
        property: username
    - secretKey: dispatcharr_password
      remoteRef:
        key: clusters/equestria/apps/dispatcharr/credentials
        property: password
    # The estate's one TMDB key; kometa and xcproxy read the same path.
    - secretKey: tmdb_apikey
      remoteRef:
        key: third-party-tokens/tmdb/api-key
        property: password
  dataFrom:
    # `${APP}-postgres` in `database`, rendered by components/postgres. Same
    # two-step rewrite as downloads/prowlarr: normalise hyphenated keys, then
    # prefix them.
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
