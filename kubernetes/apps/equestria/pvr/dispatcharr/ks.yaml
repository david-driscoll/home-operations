---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dispatcharr
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: truenas-volumes
      namespace: equestria
    - name: volsync
      namespace: volsync-system
    - name: tailscale-operator
      namespace: tailscale-system
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/equestria/pvr/dispatcharr
  prune: true
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/tailscale
    - ../../../../components/volsync
    # Phase 1 of moving Dispatcharr off its bundled Postgres (/data/db) onto
    # the shared CNPG cluster. This line alone creates the `dispatcharr` role,
    # database and rotating credential; the app keeps running in `aio` mode on
    # its bundled database until the data is restored and phase 2 switches it
    # to `DISPATCHARR_ENV: modular` (the only mode in which Dispatcharr honours
    # an external POSTGRES_HOST -- `aio` always starts the bundled server).
    #
    # ⚠️ BRAND-NEW-APP case: `stacks/system` may create the OpenBao static
    # role before CNPG applies the DatabaseRole and stall on
    # `role "dispatcharr" does not exist`. Expected; recovery is in
    # components/postgres/ks.yaml.
    - ../../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
