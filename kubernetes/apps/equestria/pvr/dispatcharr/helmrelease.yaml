---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        strategy: Recreate
        initContainers:
          chown-dbdir:
            image:
              repository: alpine
              tag: 3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
            args:
              - |
                chmod 0750 /data/db
            securityContext:
              runAsUser: 0
              # fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.29.0@sha256:df768adcb9993b58f5e67010cc802c8659b7f964cb1213ab7ff9bb9384db9145
              pullPolicy: IfNotPresent
            # -- environment variables.
            # See Dispatcharr documentation for environment variable details.
            env:
              PUID: ${PUID}
              PGID: ${PGID}
              UMASK: 002
              DISPATCHARR_ENV: aio
              REDIS_HOST: valkey.database.svc.cluster.local
              CELERY_BROKER_URL: redis://valkey.database.svc.cluster.local:6379/6
              DISPATCHARR_LOG_LEVEL: info
              TZ: ${TIMEZONE}
              DISPATCHARR_PORT: &port 9191
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 1
                memory: 2Gi
              limits:
                gpu.intel.com/i915: 1
                # amd.com/gpu: 1
                memory: 6Gi
                # cpu: 8
          streamwatchdog:
            image:
              repository: sergeantpanda/streamwatchdog
              tag: v2.2.1@sha256:0a778af10cbd11ebb38cbc280ebc77ef6d66799b285dcb66c7213ed1d7c55dbd
            env:
              SERVER_URL: http://127.0.0.1:9191
              USERNAME:
                secretKeyRef:
                  name: ${APP}
                  key: username
              PASSWORD:
                secretKeyRef:
                  name: ${APP}
                  key: password
              MODULE: Dispatcharr
              ERROR_THRESHOLD: "3"
              TZ: ${TIMEZONE}

    # -- Configures service settings for the chart.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          # HARD: must land on a node with an Intel iGPU. Both the media workers
          # and the control planes carry this label, so this constrains the app
          # to GPU-bearing nodes without deciding which tier.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: In
                values:
                - "true"
          # SOFT: prefer the media workers, whose iGPU is far stronger (Iris Xe,
          # 96 EU) than the control planes' (Alder Lake-N, 24 EU).
          #
          # 46a6 is the worker device ID; the control planes are 46d4. This must
          # stay PREFERRED and never become required -- the whole point is that
          # when both media workers are shed overnight the preference becomes
          # unsatisfiable and the pod schedules on a control plane anyway. A
          # required term here would leave it Pending until 09:00.
          #
          # It is also what brings the pod home. The descheduler runs
          # RemovePodsViolatingNodeAffinity with
          # nodeAffinityType: preferredDuringSchedulingIgnoredDuringExecution,
          # so once the workers return the pod is violating this preference and
          # gets evicted back onto one. Without this block there is nothing to
          # violate, and the pod would squat on a scarce control-plane GPU slot
          # indefinitely. The two halves are a pair -- see
          # kubernetes/apps/kube-system/descheduler/helmrelease.yaml.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: gpu.intel.com/device-id.0300-46a6.present
                  operator: In
                  values:
                  - "true"
      # Required for the overnight relocation: the control planes carry the
      # NoSchedule taint from piece 20 §4, and a toleration only PERMITS
      # placement -- it does not attract it. The soft affinity above is what
      # keeps this on a worker while one is available.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: ${APP}
        advancedMounts:
          app:
            app:
              - path: /data
            chown-dbdir:
              - path: /data
      media:
        existingClaim: truenas-media
      tmpfs:
        type: emptyDir
        globalMounts:
            - path: /tmp

    route:
      app:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
