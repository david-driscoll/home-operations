---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: -1
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        strategy: Recreate
        # The `chown-dbdir` init container is gone with the bundled Postgres:
        # it only fixed the mode of /data/db, which modular mode never opens.
        # /data/db is left on the PVC as the rollback copy -- revert this
        # change and `aio` starts on it again.
        containers:
          # ── Modular mode ─────────────────────────────────────────────────
          # `DISPATCHARR_ENV: modular` is the ONLY mode that uses an external
          # Postgres: `aio` always starts the bundled server from /data/db
          # (docker/entrypoint.sh). Modular also strips redis-server and every
          # Celery process out of uWSGI (docker/uwsgi.modular.ini), so Celery
          # -- beat, the default worker and the DVR worker -- runs in the
          # `celery` sidecar below. The two containers MUST agree on the
          # database and Redis settings; the database half comes from
          # ${APP}-postgres-env (postgres.yaml) for both.
          app:
            image: &image
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.33.0@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
              pullPolicy: IfNotPresent
            # -- environment variables.
            # See Dispatcharr documentation for environment variable details.
            env:
              PUID: ${PUID}
              PGID: ${PGID}
              UMASK: 002
              DISPATCHARR_ENV: &mode modular
              REDIS_HOST: &redisHost valkey.database.svc.cluster.local
              # ⚠️ REDIS_DB, NEVER CELERY_BROKER_URL. The entrypoint launches
              # uWSGI through `su -`, which wipes the environment, then rebuilds
              # it from a fixed list (docker/entrypoint.sh `variables=(...)`):
              # REDIS_DB is on it, CELERY_BROKER_URL is not. A broker URL set
              # here reaches the `celery` sidecar (no `su -`) but not the web
              # side, which falls back to redis://REDIS_HOST:6379/REDIS_DB --
              # so `.delay()` from the UI/API published to db 0 while the
              # workers listened on db 6, and every manual EPG/M3U refresh sat
              # unconsumed (beat-scheduled tasks still ran: beat is in the
              # sidecar). With only REDIS_DB set, broker, result backend, cache
              # and task locks all derive the same db 6 in both containers.
              REDIS_DB: &redisDb "6"
              DISPATCHARR_LOG_LEVEL: &logLevel info
              TZ: ${TIMEZONE}
              DISPATCHARR_PORT: &port 9191
            envFrom: &postgresEnv
              - secretRef:
                  name: ${APP}-postgres-env
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 20
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                gpu.intel.com/i915: 1
                # 300m, down from a full core. The full core was compensating for
                # the wrong bottleneck: the iGPU was being shared 5 ways
                # (sharedDevNum 5) rather than 3, so transcodes were contending
                # for GPU time and the symptom read as "needs more CPU". Fixing
                # the split is the actual remedy; see the intel-gpu feature.
                #
                # 300m is still ~13x the observed steady-state draw (22m), so it
                # is not a tight fit -- it is a request that reflects what this
                # container does rather than a placeholder. The memory limit
                # below is untouched, so a burst is still absorbed.
                #
                # The smaller request is also what lets this land on a control
                # plane: those nodes have ~2.3 cores free, so a 1-core request
                # made it a poor fit on the one tier that stays up overnight.
                cpu: 300m
                # Was 2Gi request / 6Gi limit for the whole stack, bundled
                # Postgres and Celery included (~1.7Gi observed 2026-11-02).
                # The pod-level request is unchanged: 1Gi here + 1Gi on celery.
                memory: 1Gi
              limits:
                gpu.intel.com/i915: 1
                # amd.com/gpu: 1
                memory: 4Gi
                # cpu: 8
          celery:
            image: *image
            # The modular-mode Celery entrypoint: waits for /data/jwt (written
            # by `app`) and for `manage.py migrate --check` to pass, then runs
            # beat plus the `celery` and `dvr` queue workers. EPG and M3U
            # refreshes run here, so this is where their memory goes.
            command:
              - /app/docker/entrypoint.celery.sh
            env:
              DISPATCHARR_ENV: *mode
              REDIS_HOST: *redisHost
              REDIS_DB: *redisDb
              DISPATCHARR_LOG_LEVEL: *logLevel
              TZ: ${TIMEZONE}
              # The DVR worker calls back into the web container; it defaults
              # to the compose service name `web`. Same pod, so loopback.
              DISPATCHARR_WEB_HOST: 127.0.0.1
              DISPATCHARR_PORT: *port
              DJANGO_SETTINGS_MODULE: dispatcharr.settings
              PYTHONUNBUFFERED: "1"
            envFrom: *postgresEnv
            # No GPU share: Celery does no transcoding, and a second i915
            # request would take another of the node's shared slots.
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
          streamwatchdog:
            image:
              repository: sergeantpanda/streamwatchdog
              tag: v2.2.1@sha256:0a778af10cbd11ebb38cbc280ebc77ef6d66799b285dcb66c7213ed1d7c55dbd
            env:
              SERVER_URL: http://127.0.0.1:9191
              USERNAME:
                secretKeyRef:
                  name: ${APP}
                  key: username
              PASSWORD:
                secretKeyRef:
                  name: ${APP}
                  key: password
              MODULE: Dispatcharr
              ERROR_THRESHOLD: "3"
              TZ: ${TIMEZONE}

    # -- Configures service settings for the chart.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: intel.feature.node.kubernetes.io/gpu
                operator: In
                values:
                - "true"
    service:
      app:
        # ⚠️ forceRename keeps this Service named `dispatcharr`. app-template
        # appends the identifier once a release has MORE THAN ONE service
        # (lib/common/_determineResourceNameFromValues.tpl), so adding
        # `multiview` below silently renamed it to `dispatcharr-app` -- which
        # broke ECM (http://dispatcharr:9191), the tailnet IngressRoute
        # (components/tailscale: TAILSCALE_SERVICE defaults to ${APP}) and the
        # dashboard's DISPATCHARR_URL.
        forceRename: *app
        controller: app
        type: ClusterIP
        ports:
          http:
            port: *port
      # Dispatcharr Multiview plugin (swvn-dispatch/dispatcharr-multiview).
      # The plugin runs its own gevent server inside the Dispatcharr process,
      # bound to 0.0.0.0 on a FIXED port (DEFAULT_SERVER_PORT, not a setting),
      # so it needs its own Service rather than a path on the web port. Only
      # the dashboard (`dash_path`, default /dash, enabled in the plugin's
      # settings) and its /api are reachable from here: /stream/* and
      # /internal/* answer loopback callers only, by design.
      multiview:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: &multiviewPort 9292

    persistence:
      config:
        existingClaim: ${APP}
        advancedMounts:
          app:
            app:
              - path: /data
            # Shared with `app`: /data/jwt (the Django secret key), logs,
            # plugins and DVR recordings all live here.
            celery:
              - path: /data
      media:
        existingClaim: truenas-media
      tmpfs:
        type: emptyDir
        globalMounts:
            - path: /tmp

    route:
      app:
        # Same rule as the Service above: keep the original HTTPRoute name.
        forceRename: *app
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
      # Hostname is published to DNS by external-dns from this route, like
      # every other `internal` gateway route. The dashboard logs in with
      # Dispatcharr credentials itself; local-user keeps it LAN-only.
      multiview:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}-multiview.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          # The server has nothing at `/`; send the bare hostname to the SPA.
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /dash/
                  statusCode: 302
          - backendRefs:
              - identifier: multiview
                port: *multiviewPort
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
