---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app traefik-whoami
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: certificates
      namespace: network
  path: ./kubernetes/apps/equestria/utils/whoami
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # ON-DEMAND SET. Scales to zero after 30m idle and wakes on request, instead
    # of go-kube-downscaler's nightly 02:00-09:00 window. The component sets both
    # `sablier.enable` and `downscaler/exclude` together -- see its header for
    # why a workload in both sets flaps every 30 seconds rather than degrading.
    #
    # whoami is the pilot deliberately: it is stateless, nothing else in the
    # estate calls it, and it already exists to produce loud single-route
    # breakage (see the crowdsec note in ./helmrelease.yaml).
    - ../../../../components/sablier
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
