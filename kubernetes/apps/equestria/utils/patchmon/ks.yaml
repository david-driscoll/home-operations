---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app patchmon
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: postgres
      namespace: database
    # Not optional: patchmon-server exits at startup if it cannot PING Redis.
    # Asynq (its job queue and scheduler), install bootstrap tokens, login
    # lockouts and agent presence all live there.
    - name: valkey
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/utils/patchmon
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # ⚠️ NEW APP. Read the ORDER OF OPERATIONS block in
    # components/postgres/ks.yaml: `stacks/system` usually beats Flux to the
    # merge commit and fails on `role "patchmon" does not exist`. The recovery
    # is in docs/runbooks/patchmon.md.
    - ../../../../components/postgres
    # patchmon.${TAILSCALE_DOMAIN} is the URL the agents use. Every Proxmox host
    # reaches it under the `default-apps-access` grant (tag:proxmox ->
    # tag:apps:443), including the off-site ones that have no LAN path here.
    - ../../../../components/tailscale
    # No volsync: the server writes nothing to disk that matters. Agent binaries
    # are served from the image, logos are stored in Postgres, and the only
    # file it writes (SSH-terminal known_hosts) goes to an emptyDir.
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
