---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# All three `extract` paths must exist before this goes Ready. ESO fails the
# WHOLE ExternalSecret on one missing path, so the OpenBao key below is created
# before merging -- see docs/runbooks/patchmon.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        # Straight to postgres-rw, never a transaction-mode pooler: the
        # embedded golang-migrate takes an advisory lock and pgx prepares
        # statements. `uri` already carries `?sslmode=disable`, which is what
        # the migrator assumes anyway when the URL names none -- spelling it out
        # keeps the migrator and the pool on the same plaintext connection.
        DATABASE_URL: "{{ .postgres_uri }}"

        # ⚠️ MUST be set, and MUST stay stable. Encrypts install bootstrap
        # tokens and notification-channel secrets at rest
        # (internal/util/encryption.go). Unset, the key falls back to a hash of
        # DATABASE_URL -- and components/postgres rotates that password every
        # 30 days, which would quietly make everything already encrypted
        # undecryptable. 64 hex characters are used as the raw AES key.
        #
        # Seeded in OpenBao, unlike JWT_SECRET below, because losing it loses
        # data rather than sessions.
        AI_ENCRYPTION_KEY: "{{ .patchmon_encryption_key }}"

        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # The bare issuer; PatchMon runs discovery itself.
        OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/patchmon/keys
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "patchmon_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
    # Minted in this namespace by stacks/system from ./definition.yaml.
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# JWT_SECRET signs session tokens. Generated in-cluster rather than seeded into
# OpenBao because nothing outside this namespace needs it -- the same call
# supersync and dawarich make. Losing it costs no data: every session ends and
# everyone signs in again. Agents are unaffected; they authenticate with their
# own API id/key, not a JWT.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-jwt-secret
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. The Password generator mints
# a new value on every call; `Periodic` would rotate JWT_SECRET on a schedule
# and sign everyone out each time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-jwt
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-jwt
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-jwt-secret
