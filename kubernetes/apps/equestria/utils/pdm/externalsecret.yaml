---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# root@pam's password. /etc/shadow is part of the image, not the volume, so the
# entrypoint in ./helmrelease.yaml sets it from here on every start -- the same
# job the image's own entrypoint did once, on first boot, on celestia.
#
# The item is a COPY of clusters/celestia/apps/pdm/root, made before the merge
# (docs/runbooks/arcane-pdm-celestia-to-equestria.md, step 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-root
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-root
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/pdm/root
