---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pdm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              # Community image (there is no upstream one): Debian trixie plus
              # the proxmox-datacenter-manager packages. The same digest
              # celestia ran under `latest`.
              repository: ghcr.io/longqt-sea/proxmox-datacenter-manager
              tag: 2026-11-01@sha256:8a5effea5b65a6d23b805a26d0cccd4bcf2a198566f575b24c052b7eeebec0e8
              pullPolicy: IfNotPresent
            # The image boots systemd (/sbin/init), which on Docker needed
            # `cgroup: host`, `cap_add: ALL` and seccomp/apparmor unconfined.
            # None of that is needed for what systemd actually did here: start
            # the two daemons from proxmox-datacenter-{privileged-,}api.service.
            # This runs them directly, with the units' own users, and exits if
            # either one dies so the kubelet restarts the pod.
            #
            # `$$` is Flux's escape for a literal dollar: this file goes through
            # postBuild envsubst, which would otherwise eat every shell variable.
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                cfg=/etc/proxmox-datacenter-manager
                # `privileged-api setup` refuses to start unless the config
                # directory is exactly root:www-data 1770 ("bad owner ...
                # (33 != 0)", "bad permissions ... (0o750 != 0o1770)"). The
                # owner check is what had both daemons crash-looping on
                # celestia, where the directory had ended up www-data-owned.
                # The tmpfs run dir gets the same check, and a fresh emptyDir
                # is root:root ("bad group ... (0 != 33)").
                run=/run/proxmox-datacenter-manager
                chown root:www-data "$${cfg}" "$${run}"
                chmod 1770 "$${cfg}" "$${run}"
                # The state dir is the other way round: www-data must own it
                # ("bad owner ... (0 != 33)"). Neither exists in the image --
                # on a host the package's postinst creates them.
                chown www-data:www-data /var/lib/proxmox-datacenter-manager
                # /etc/shadow is in the image, not the volume.
                echo "root:$${PASSWORD}" | chpasswd

                /usr/libexec/proxmox/proxmox-datacenter-privileged-api setup
                /usr/libexec/proxmox/proxmox-datacenter-privileged-api &
                # proxmox-datacenter-api.service orders itself After= the
                # privileged unit, which is Type=notify. Without systemd to
                # wait on, give it a moment to open its socket.
                sleep 2
                setpriv --reuid=www-data --regid=www-data --init-groups \
                  /usr/libexec/proxmox/proxmox-datacenter-api &
                trap 'kill -TERM $$(jobs -p) 2>/dev/null' TERM INT
                wait -n
                echo "a PDM daemon exited; restarting the pod" >&2
                exit 1
            envFrom:
              - secretRef:
                  name: ${APP}-root
            env:
              TZ: "${TIMEZONE}"
            probes:
              # /api2/json/ping is the one unauthenticated API endpoint (200),
              # so this checks the API daemon behind the listener, not just the
              # socket. An HTTP probe also keeps the log clean: a bare TCP
              # connect logs "failed to check for TLS handshake" every time.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &ping
                    path: /api2/json/ping
                    port: &port 8443
                    scheme: HTTPS
                  periodSeconds: 5
                  failureThreshold: 24
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ping
                  periodSeconds: 15
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *ping
                  periodSeconds: 30
                  failureThreshold: 3
            securityContext:
              # Root, as the privileged daemon must be: it owns the config,
              # does PAM auth against /etc/shadow, and the API daemon is
              # dropped to www-data from here. Only the capabilities that job
              # needs, all inside the baseline Pod Security profile.
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETUID
                  - SETGID
                  - KILL
                  - AUDIT_WRITE
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      # PDM names its local node after the hostname; celestia's container was
      # `hostname: pdm`.
      hostname: pdm
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    persistence:
      data:
        existingClaim: ${APP}
        globalMounts:
          - path: /etc/proxmox-datacenter-manager
            subPath: etc
          # RRD metrics history. Not migrated (it was never written on
          # celestia -- the API daemon never got far enough), but kept across
          # restarts from here on.
          - path: /var/lib/proxmox-datacenter-manager
            subPath: lib
      # The config version cache (shmem) refuses anything but tmpfs: "path
      # ... is not on tmpfs". systemd gave the units a tmpfs /run.
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /run/proxmox-datacenter-manager

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          https:
            port: *port
            # Traefik's Gateway provider picks the backend scheme from
            # appProtocol alone (since v3.7.15 the port name no longer counts).
            # The self-signed certificate is accepted by the global
            # serversTransport.insecureSkipVerify in network/traefik.
            appProtocol: https

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: *app
                port: *port
            filters:
              # PDM does its own login (root@pam), so `local-user` -- the
              # network gate without the authentik outpost hop, as on celestia,
              # where the router carried no forward-auth either.
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
