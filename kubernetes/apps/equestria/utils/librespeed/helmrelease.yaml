---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app librespeed
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  timeout: 10m
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      *app :
        containers:
          *app :
            image:
              repository: ghcr.io/librespeed/speedtest
              tag: latest@sha256:d13d30d39056c30c895d3237302a58bcb872542f82ccdde10c17810ee10b8163
            resources:
              requests:
                cpu: 50m
                memory: 32Mi
              limits:
                memory: 128Mi
            env:
              USE_NEW_DESIGN: true
              TELEMETRY: false
              ENABLE_ID_OBFUSCATION: false
              REDACT_IP_ADDRESSES: false
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

    service:
      *app :
        ports:
          http:
            port: &port 8080

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *port
            filters:
              # LAST in the chain by construction -- it is the only filter here.
              # `sablier-${APP}` comes from components/sablier, added to
              # ./ks.yaml. Attached by hand rather than patched in by the
              # component: see that component's header for the five ways a
              # generic JSON6902 filter patch breaks across this estate.
              #
              # Note this route carries no network or auth gate today, so
              # anything that can reach the internal Gateway can wake this app.
              # That matches its existing exposure; it is not a new hole.
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: sablier-${APP}
