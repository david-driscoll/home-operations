---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app librespeed
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/equestria/utils/librespeed
  prune: true
  wait: false
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # ON-DEMAND SET. Scales to zero after 30m idle and wakes on the next
    # request, instead of go-kube-downscaler's nightly 02:00-09:00 window. The
    # component sets `sablier.enable` and `downscaler/exclude` together -- see
    # its header for why a workload in both sets flaps rather than degrades.
    #
    # A pilot alongside whoami: stateless, no persistent volume, nothing else in
    # the estate calls it over ClusterIP DNS, and it is idle almost all the time
    # by its very nature.
    - ../../../../components/sablier
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
