---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app arcane
  namespace: &namespace equestria
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/equestria/utils/arcane
  prune: true
  force: false
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    # arcane.<tailnet>, for people on the tailnet.
    - ../../../../components/tailscale
    # The SQLite databases (arcane.db, arcane.francis.db) ARE the state:
    # environments, agent tokens, users, API keys, registries, settings. Moved
    # from celestia's `arcane_arcane-data` volume, not recreated.
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_ACCESSMODES: ReadWriteOnce
      # The manager runs as 1000:1000, as it did on celestia (PUID/PGID).
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
