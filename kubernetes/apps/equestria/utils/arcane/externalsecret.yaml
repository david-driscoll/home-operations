---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Both `extract` paths must exist before this goes Ready -- ESO fails the WHOLE
# ExternalSecret on one missing path. The credentials item is a COPY of
# clusters/celestia/apps/arcane/credentials, made before the merge
# (docs/runbooks/arcane-pdm-celestia-to-equestria.md, step 1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # ⚠️ ENCRYPTION_KEY MUST be the value celestia ran with. It encrypts
        # secrets at rest inside the migrated arcane.db (registry credentials,
        # git tokens, notification settings); a new key leaves them
        # undecryptable.
        ENCRYPTION_KEY: "{{ .arcane_encryption_key }}"
        # No JWT_SECRET: Arcane 2.17 logs "Deprecated environment variable is
        # set and no longer used" for it. `jwt_secret` stays in OpenBao.
        # Arcane only accepts `arc_<64 hex>`. OpenBao holds the bare 64 hex,
        # which celestia passed through as-is, so the key never worked there:
        # every boot logged "Failed to reconcile default admin API key:
        # invalid API key". The prefix makes it a working admin key.
        ADMIN_STATIC_API_KEY: "arc_{{ .arcane_api_key }}"
        AUTO_LOGIN_USERNAME: "{{ .arcane_username }}"
        AUTO_LOGIN_PASSWORD: "{{ .arcane_password }}"

        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # The bare issuer; Arcane runs discovery itself.
        OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/arcane/credentials
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "arcane_$1"
    # Minted in this namespace by stacks/system from ./definition.yaml.
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: cluster
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
