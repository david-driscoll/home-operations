---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
          downscaler/exclude: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: technitium-dns-net
        initContainers:
          # Gives the tailscale and netbird sidecars ONE path each to peers
          # inside the cluster.
          #
          # This pod has two interfaces: Cilium eth0 and the ipvlan net1 on
          # the LAN. tailscaled advertised and used both, so a peer such as
          # tailnet-inbound-0 had two direct paths here (pod IP to pod IP, and
          # net1 to that peer's masqueraded node IP). With near-equal latency,
          # magicsock flipped between them hundreds of times a day, and a UDP
          # query sent during a flip was lost: the ~1-in-100 dns-equestria
          # Do53 probe failure, with DoT/DoH unaffected because TCP retransmits.
          #
          # 1. tailscaled marks its own sockets with 0x80000/0xff0000 and
          #    installs its rules from priority 5210 up
          #    (wgengine/router/osrouter/router_linux.go). Rule 100 sends those
          #    packets through table 100, which holds only eth0's routes, so
          #    tailscale traffic never leaves via net1. LAN peers then reach
          #    this node through the node IP (Cilium masquerade) and stay direct.
          # 2. The DROP stops peers using the net1 address at all. Without it, a
          #    peer pinging the net1 address gets its pong back via eth0, and
          #    magicsock still credits the net1 address as a working path
          #    (wgengine/magicsock/endpoint.go handlePongConnLocked), so the
          #    second path would survive. It needs the fixed --port set on the
          #    sidecar below.
          #
          # The netbird sidecar has the same two paths, and gets the same fix:
          #
          # 3. NetBird marks its WireGuard and control sockets with 0x1BD00
          #    (client/net/fwmark.go, ControlPlaneMark) and installs its own
          #    rules at priority 105 (main, suppress_prefixlength 0) and 110
          #    (client/internal/routemanager/systemops/systemops_linux.go).
          #    Rule 105 would send tailscale's marked LAN traffic out net1
          #    again, so both marks go to table 100 BEFORE it, at 100 and 101.
          #    (Tailscale's rule was 5200; tailscaled only needs it below 5210.)
          # 4. The same DROP for NetBird's fixed WireGuard port, 51821
          #    (NB_WIREGUARD_PORT below). The sidecar also leaves net1 out of
          #    its ICE candidates (NB_EXTRA_IFACE_BLACKLIST), so peers are
          #    never offered that address in the first place.
          #
          # Fails open on purpose: every step logs and continues. A crashing
          # init container would keep the pod down and take LAN DNS with it,
          # which is far worse than the flap. The script avoids shell dollar
          # signs because Flux post-build substitution would rewrite them.
          tailscale-routing:
            image:
              repository: tailscale/tailscale
              tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            command:
              - /bin/sh
              - -c
              - |
                # Twice: the default route is listed before the link route to
                # its gateway, and cannot be added until that route exists.
                ip -4 route show table main dev eth0 | xargs -I{} sh -c 'ip route replace {} dev eth0 table 100 2>/dev/null'
                ip -4 route show table main dev eth0 | xargs -I{} sh -c 'ip route replace {} dev eth0 table 100' || echo "WARN: copying eth0 routes into table 100 failed"
                ip rule del priority 5200 2>/dev/null
                ip rule del priority 100 2>/dev/null
                ip rule add priority 100 fwmark 0x80000/0xff0000 lookup 100 || echo "WARN: ip rule 100 (tailscale) failed"
                ip rule del priority 101 2>/dev/null
                ip rule add priority 101 fwmark 0x1bd00 lookup 100 || echo "WARN: ip rule 101 (netbird) failed"
                # iptables-nft, not iptables: the image points `iptables` at
                # the legacy backend, and the Talos kernel has no legacy tables
                # ("can't initialize iptables table `filter'").
                iptables-nft -C INPUT -i net1 -p udp --dport 41641 -j DROP 2>/dev/null || iptables-nft -I INPUT 1 -i net1 -p udp --dport 41641 -j DROP || echo "WARN: net1 tailscale DROP failed"
                iptables-nft -C INPUT -i net1 -p udp --dport 51821 -j DROP 2>/dev/null || iptables-nft -I INPUT 1 -i net1 -p udp --dport 51821 -j DROP || echo "WARN: net1 netbird DROP failed"
                echo "table 100:"; ip -4 route show table 100
                echo "rules:"; ip rule show
                echo "INPUT:"; iptables-nft -S INPUT
                exit 0
            securityContext:
              allowPrivilegeEscalation: false
              # iptables takes its lock in /run.
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - NET_ADMIN
                  - NET_RAW
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          *app :
            image:
              repository: technitium/dns-server
              tag: 15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
            env:
              # First-start only (ignored once /etc/dns config exists) — kept in
              # lockstep with docker/_common/technitium/.env in home-operations.
              # After the node joins the Technitium cluster, cluster sync owns
              # most of these settings.
              DNS_SERVER_DOMAIN: dns.${ROOT_DOMAIN}
              DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS: "true"
              DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT: "true"
              DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
              DNS_SERVER_FORWARDERS: "9.9.9.9, 149.112.112.112"
              DNS_SERVER_FORWARDER_PROTOCOL: Tls
              DNS_SERVER_PREFER_IPV6: "false"
              DNS_SERVER_ENABLE_BLOCKING: "true"
              DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT: "false"
              DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
              DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS: "true"
              DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP: "true"
              DNS_SERVER_SSO_ENABLED: "true"
              DNS_SERVER_SSO_ALLOW_SIGNUP: "true"
              DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS: "true"
              DNS_SERVER_SSO_GROUP_MAP: "admins:Administrators"
              DNS_SERVER_SSO_SCOPES: "openid,profile,email"
              # Not one of the first-start settings above: the runtime reads it
              # on every start. It is what gives LOG_USING_LOCAL_TIME a local
              # time other than UTC to log in.
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: ${APP}-env
            probes:
              # exec probes on purpose: kubelet-dialed tcpSocket probes source
              # from the node's LAN IP and the pod replies via the ipvlan net1
              # interface (asymmetric) — they always time out, the pod never
              # goes Ready, and every Service loses its endpoints.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5380"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5380"]
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
          tailscale:
            # Same shape as docker/_common/technitium/compose.yaml: the pod IS
            # the tailnet node dns-<cluster>. technitium shares this network
            # namespace, so its listeners (53, 853, 443, 53443) are reachable on
            # the node's own tailscale IP — and, critically, its OUTBOUND
            # cluster traffic (zone refresh, config sync, heartbeats) sources
            # from that same registered IP. The operator's L3 ingress could only
            # ever serve inbound.
            image:
              repository: tailscale/tailscale
              tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            env:
              TS_STATE_DIR: /var/lib/tailscale
              # containerboot defaults to storing state in a kube Secret when it
              # detects kubernetes; we keep state on the volsync PVC instead, and
              # the pod has no service-account token mounted.
              TS_KUBE_SECRET: ""
              TS_USERSPACE: "false"
              TS_AUTH_ONCE: "true"
              # leave pod DNS alone — technitium resolves via its own engine and
              # the cluster resolver must stay intact for everything else
              TS_ACCEPT_DNS: "false"
              TS_HOSTNAME: dns-${CLUSTER_CNAME}
              # Fixed so the tailscale-routing init container can DROP this
              # port on net1. Change both together.
              TS_TAILSCALED_EXTRA_ARGS: "--port=41641"
              # The image points `iptables` at the legacy backend, which the
              # Talos kernel does not have. Left to choose, tailscaled picked
              # it and every router reconfig failed ("router config failed ...
              # iptables -t filter -N ts-input"), so its ts-input/ts-forward
              # rules were never installed and the node carried a standing
              # `router` health error.
              TS_DEBUG_FIREWALL_MODE: nftables
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-dns-authkey
                    key: authkey
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          netbird:
            # The NetBird twin of the tailscale sidecar (docs/plans/netbird-mirror.md
            # D30), as on every Dockge Technitium node
            # (docker/_common/technitium): the pod joins the NetBird overlay as
            # dns-<cluster>, so NetBird clients resolve through technitium's
            # listeners on its overlay address, with no home gateway in the path.
            image:
              repository: netbirdio/netbird
              tag: 0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
            # The image's entrypoint exits when `netbird up` fails (management
            # unreachable, say), and a crashlooping sidecar would take the pod
            # out of the dns Service. So it is rerun in place instead, and it
            # idles if there is no setup key yet. Neither line uses a shell
            # dollar sign: Flux post-build substitution would rewrite it.
            command:
              - /bin/bash
              - -c
              - |
                if ! printenv NB_SETUP_KEY | grep -q . && ! test -s /var/lib/netbird/default.json; then
                  echo "no NetBird setup key yet (secrets/third-party-tokens/netbird/setup-keys, property dns); idling"
                  exec sleep infinity
                fi
                while true; do
                  /usr/local/bin/netbird-entrypoint.sh || echo "netbird exited; restarting in 30s"
                  sleep 30
                done
            env:
              NB_MANAGEMENT_URL: https://netbird.${ROOT_DOMAIN}
              NB_HOSTNAME: dns-${CLUSTER_CNAME}
              # technitium owns :53 in this namespace; NetBird's resolver would
              # collide with it. Clients get Technitium from management.
              NB_DISABLE_DNS: "true"
              # ...but NB_DISABLE_DNS only stops NetBird rewriting the host's
              # resolver config. Its own DNS server still starts, and binds
              # <wt0 address>:53. On 2026-11-05 that bind (02:21:49Z, two
              # seconds after Technitium came up) left Technitium with no IPv4
              # :53 socket at all, only [::]:53 and the 0.0.0.0:853 DoT
              # listener, so the pod answered nothing over IPv4 on net1, the
              # tailnet or the pod IP (BlackboxProbeFailingCritical,
              # dns-equestria). Park the unused resolver on loopback, off :53.
              #
              # Not on 127.0.0.1, though: with its resolver off port 53,
              # NetBird 0.82 adds an nftables OUTPUT DNAT that sends this
              # namespace's 127.0.0.1:53 (UDP and TCP) to that resolver
              # (service_listener.go setupDNAT; logged as "added DNS DNAT
              # rules"). The resolver has no upstreams, so anything here
              # asking 127.0.0.1:53 got SERVFAIL instead of Technitium.
              # 127.0.0.153 is an address nothing in the pod queries, so the
              # redirect it brings is harmless.
              #
              # THIS ENV ONLY TAKES EFFECT ON A FRESH ENROLMENT. With a profile
              # already on the config PVC, `netbird service run` reconnects
              # from it and the entrypoint's `netbird up` prints "Already
              # connected" and applies nothing, NB_* settings included. An
              # existing peer takes a change like this only through a one-off
              #   netbird down; netbird up --dns-resolver-address 127.0.0.153:5053
              # in the netbird container, which writes CustomDNSAddress into
              # /var/lib/netbird/default.json. Then restart the technitium
              # container if it lost a :53 socket. 127.0.0.1:5053 was applied
              # this way on 2026-11-05; the move to 127.0.0.153 needs the same
              # one-off.
              NB_DNS_RESOLVER_ADDRESS: "127.0.0.153:5053"
              # A nameserver, not a client.
              NB_DISABLE_CLIENT_ROUTES: "true"
              # Fixed so the tailscale-routing init container can DROP it on
              # net1, and clear of tailscale's 41641. Change both together.
              NB_WIREGUARD_PORT: "51821"
              # Never offer the ipvlan LAN address as an ICE candidate: the
              # same dual-path flapping the init container fixes for tailscale.
              NB_EXTRA_IFACE_BLACKLIST: net1
              NB_LOG_LEVEL: info
              NB_LOG_FILE: console
            # NB_SETUP_KEY (netbird-setup-key.yaml). envFrom, because only it
            # takes `optional`: until stacks/netbird has written the key, the
            # pod still starts and the sidecar idles (above).
            envFrom:
              - secretRef:
                  name: ${APP}-netbird
                  optional: true
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      # Pin to the control planes via talconfig nodeLabel technitium-dns=true.
      # Moved off hard-hat 2026-08-19: the label now sits on milky-way/othalla/pegasus
      # and the ipvlan NAD binds their enp3s0, so the LAN resolver survives a
      # low-power window with every worker off — see
      # docs/cluster-consolidation/20-low-power-tier.md §0.3.
      # The toleration below is what makes that survive the §4 control-plane taint;
      # a nodeSelector matching only tainted nodes without it is an unschedulable pod.
      nodeSelector:
        technitium-dns: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    service:
      # LAN DNS traffic arrives directly on the ipvlan interface (see nad).
      admin:
        controller: *app
        ports:
          admin:
            port: 5380
            protocol: TCP
          cluster-https:
            port: 53443
            protocol: TCP

      # IN-CLUSTER DNS. CoreDNS forwards the <root domain> zone here (see the
      # `<root domain>` server block in apps/kube-system/coredns/helm/values.yaml),
      # so pods resolve internal names against the authoritative internal zone
      # rather than public DNS.
      #
      # A Service, NOT the ipvlan address above. CoreDNS runs on the control
      # planes and so does this pod, and ipvlan L2 blocks traffic between a host
      # and its own ipvlan children -- the CoreDNS replica sharing a node with
      # Technitium would time out on every forward to ${TECHNITIUM_VIP}. This is
      # the same asymmetry the exec probes above work around. Through a Service
      # the traffic reaches the pod's primary (Cilium) interface instead, and
      # because pod IPs are outside the LAN /16 the replies route back through
      # it too. The listeners are already bound on every interface -- `admin`
      # reaches 53443 exactly this way.
      #
      # clusterIP is PINNED because CoreDNS can only forward to an address, not
      # a name. ${TECHNITIUM_CLUSTER_IP} lives in cluster-secrets beside
      # CLUSTER_IP (kube-dns) and TAILSCALE_NAMESERVER_IP, the two existing
      # pinned DNS addresses.
      dns:
        controller: *app
        type: ClusterIP
        # The `:=` default is for OFFLINE rendering, not for the cluster. CI's
        # flate cannot decrypt cluster-secrets, so a bare substitution renders
        # empty, kustomize re-emits it as null, and app-template's schema
        # rejects the release (`/service/dns/clusterIP: got null, want string`)
        # -- that failed the first push of this change. In the cluster the
        # secret always resolves and the default is never used. It is the same
        # address as the secret; change both together.
        clusterIP: "${TECHNITIUM_CLUSTER_IP:=10.196.0.53}"
        ports:
          dns-udp:
            port: 53
            protocol: UDP
          dns-tcp:
            # TCP as well as UDP: CoreDNS retries over TCP on a truncated
            # answer, and a large response with no TCP listener would fail
            # rather than degrade.
            port: 53
            protocol: TCP

    persistence:
      config:
        existingClaim: ${APP}
        advancedMounts:
          technitium:
            technitium:
              - path: /etc/dns
            # tailscale node state lives on the same volsync-managed volume, so
            # the device identity (and its pinned IP) is covered by the nightly
            # restic backup and survives a restore — no second PVC to own.
            tailscale:
              - path: /var/lib/tailscale
                subPath: .tailscale-state
            # Same for the netbird peer: its key and overlay address survive
            # a restore, so the nameserver group keeps pointing at it.
            netbird:
              - path: /var/lib/netbird
                subPath: .netbird-state
      tls:
        type: secret
        name: technitium-tls
        globalMounts:
          - path: /etc/technitium/certs/${CLUSTER_CNAME}.dns.${ROOT_DOMAIN}

    route:
      admin:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - ${APP}.${CLUSTER_DOMAIN}
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: admin
                port: admin
