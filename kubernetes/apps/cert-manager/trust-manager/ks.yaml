---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app trust-manager
  namespace: &namespace cert-manager
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: cert-manager-controller
      namespace: cert-manager
  path: ./kubernetes/apps/cert-manager/trust-manager
  prune: true
  # Installs the trust-manager CRDs (`crds: CreateReplace`) -- bundles.trust.
  # cert-manager.io. Same reasoning as cert-manager/ks.yaml next door: a
  # Kustomization ownership change must never be able to cascade into a CRD.
  deletionPolicy: Orphan
  wait: true
  force: false
  interval: 1h
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: home-operations
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
