---
# No `yaml-language-server: $schema=` line -- see ../toolhive-docs/mcpserver.yaml.
#
# `MCPRemoteProxy` -- see ../toolhive-microsoft-docs/mcpremoteproxy.yaml's
# header for what that CRD is and why it applies here too.
#
# OUTGOING AUTH IS NOT WIRED UP YET, deliberately left incomplete rather
# than guessed. Home Assistant's MCP endpoint requires its own OAuth
# (this repo's own root .mcp.json authenticates to it with an interactive
# localhost-callback flow: clientId "http://localhost:12345"). Bridging
# that into an unattended server-to-server call needs `externalAuthConfigRef`
# -> a NEW MCPExternalAuthConfig configured for TOKEN EXCHANGE against Home
# Assistant's OAuth provider, which in turn needs a REAL OAuth client
# registered on the Home Assistant side (client id + secret) -- credentials
# this rollout does not have. Until that exists, requests through this
# proxy most likely 401 upstream at Home Assistant, not here.
#
# Two ways to close this gap, neither implemented here:
#   1. Register a proper confidential OAuth client in Home Assistant and
#      wire externalAuthConfigRef to it.
#   2. Skip the proxy for this one server and keep it a direct entry in
#      ../agentboard/resources/mcp.json (its original placement), so a
#      human can complete the interactive OAuth flow once through
#      agentboard's own terminal and have it persist on the PVC.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: ${APP}
spec:
  remoteUrl: https://home.driscoll.tech/api/mcp
  transport: streamable-http
  groupRef:
    name: agent-tools

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
