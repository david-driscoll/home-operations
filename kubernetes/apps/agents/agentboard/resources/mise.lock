# Named `mise.lock`, NOT `config.lock` -- verified empirically against the
# mise 2026.7.7 CLI, not assumed from the docs. `~/.config/mise/config.toml`
# (where ../kustomization.yaml's ConfigMap mounts ./mise.toml in the pod) is
# mise's special-cased GLOBAL config path, and the global lockfile is always
# named `mise.lock` regardless of the config file's own basename -- the
# basename-pairing rule (`mise.test.toml` <-> `mise.test.lock`, etc.) only
# holds for project-root configs discovered by walking up from a working
# directory, which this is not.
#
# Regenerate after any ../resources/mise.toml version bump:
#   mkdir -p /tmp/x/home/.config/mise && cd /tmp/x
#   cp <repo>/.../resources/mise.toml home/.config/mise/config.toml
#   HOME=/tmp/x/home mise trust home/.config/mise/config.toml
#   HOME=/tmp/x/home mise lock -g
# The `-g`/`--global` flag is REQUIRED: plain `mise lock` only locks "the
# active project config root" (its own --help text) and silently no-ops
# with "No tools configured to lock" against a global-only config -- it does
