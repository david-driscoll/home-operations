---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./definition.yaml
  - ./httproute.yaml
  - ./rbac.yaml
# Everything ./helmrelease.yaml's `command` needs and cannot get from a
# Dockerfile, because there isn't one -- see ./resources/entrypoint.sh's
# header. No lockfile: ./resources/mise.toml dropped `lockfile`/`locked` and
# the pinned mise.lock was deleted (dd2663ee), so tools resolve from the
# versions pinned in mise.toml alone. A `mise.lock` entry that outlived its
# file broke `kustomize build` for this whole Kustomization -- if a lockfile
# comes back, it has to return here AND as the subPath mount in
# ./helmrelease.yaml together. disableNameSuffixHash because
# ./helmrelease.yaml mounts these by literal name.
configMapGenerator:
  - name: ${APP}-mise-config
    files:
      - config.toml=./resources/mise.toml
      - entrypoint.sh=./resources/entrypoint.sh
      # Claude Code's own MCP client config -- mounted at /root/.mcp.json,
      # picked up when the tmux session in ./resources/entrypoint.sh starts
      # `claude` from $HOME AND THE SESSION STAYS THERE.
      #
      # THAT LAST CLAUSE IS THE WHOLE CAVEAT. Claude Code resolves `.mcp.json`
      # from the session's working directory only -- it does not fall back to
      # $HOME and does not walk parent directories. An agent here spends its
      # life inside the repo checkout, whose committed .mcp.json shadows this
      # mount entirely. That is why ./helmrelease.yaml also sets
      # TOOLPORT_<PROFILE>_URL, which the repo's .mcp.json expands -- read that
      # env block's comment. This file stays for sessions started from $HOME
      # or any directory with no .mcp.json of its own, and the two agree.
      #
      # Each `toolport-<profile>` entry points at that profile's in-cluster
      # remote proxy (../toolport-mcp), over plain http and with no token: the
      # proxy holds the profile's bearer, and ../toolport-mcp/networkpolicy.yaml
      # naming this pod is the whole of the access control -- read it before
      # widening anything. The OAuth doors need a browser this pod does not
      # have. JSON cannot carry a comment, hence this one.
      - mcp.json=./resources/mcp.json
      # Shell dotfiles, mounted at /root/.bashrc and /root/.bash_profile.
      # Not mise config despite this ConfigMap's name (neither is
      # entrypoint.sh or mcp.json) -- what it really holds is everything a
      # Dockerfile would have baked in, if this app had one. They exist
      # because Debian's /etc/profile resets root's PATH in login shells and
      # tmux only ever starts login shells; ./resources/bashrc has the full
      # story and the live evidence.
      - bashrc=./resources/bashrc
      - bash_profile=./resources/bash_profile
    options:
      disableNameSuffixHash: true
  # User-wide Claude Code skills, mounted under ~/.claude/skills/ by
  # ./helmrelease.yaml's `skills` persistence. Sourced straight from the repo's
  # own .claude/skills/ -- ONE copy, the one sessions in the checkout already
  # load, delivered at the deployed git revision rather than fetched at boot.
  #
  # The path leaves this directory; Flux's kustomize-controller builds with
  # LoadRestrictionsNone, and components/common's cluster-versions env file is
  # the precedent. A local `kubectl kustomize` needs
  # `--load-restrictor LoadRestrictionsNone` for the same reason.
  #
  # Substitution OFF: a skill is prose that may one day quote a dollar-brace
  # template, and Flux's envsubst must not rewrite (or, in strict mode, fail
  # on) it -- which also means the NAME must be literal, not ${APP}-based.
  # disableNameSuffixHash because ./helmrelease.yaml mounts it by name.
  # git over SSH to Forgejo as claude-code: the ssh_config.d drop-in and the
  # pinned host key. The key itself is the `${APP}-forgejo-ssh` ExternalSecret.
  #
  # Substitution ON, and load-bearing: the Host / HostKeyAlias lines and the
  # known_hosts entry name Forgejo's public host through ROOT_DOMAIN (SOPS, via
  # shared-secrets; see docs/plans/private-domain-scrub.md). It was OFF until
  # #2192 put that variable in, and a disabled ConfigMap renders the literal
  # placeholder -- ssh then matches neither the Host block nor the pinned key,
  # and git over SSH to Forgejo fails at the next restart. Neither file has any
  # other dollar sign, so envsubst has nothing else to touch.
  - name: agentboard-ssh
    files:
      - forgejo.conf=./resources/ssh_config
      - known_hosts=./resources/known_hosts
    options:
      disableNameSuffixHash: true
  - name: agentboard-skills
    files:
      - toolport-SKILL.md=../../../../.claude/skills/toolport/SKILL.md
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  # Helper commands for the pod, mounted as a directory at /opt/agentboard/bin
  # by ./helmrelease.yaml's `bin` persistence and put on PATH there and in
  # ./resources/bashrc.
  #
  # Substitution OFF, which is why these are not in the mise-config ConfigMap
  # beside entrypoint.sh: a script here is plain shell, with no doubled dollar
  # signs, and shellcheck reads what actually runs. The name is literal for the
  # same reason agentboard-skills' is.
  - name: agentboard-bin
    files:
      - agentboard-spawn=./resources/agentboard-spawn.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
