---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./definition.yaml
  - ./httproute.yaml
  - ./rbac.yaml
# Everything ./helmrelease.yaml's `command` needs and cannot get from a
# Dockerfile, because there isn't one -- see ./resources/entrypoint.sh's
# header. `mise.lock`, NOT `config.lock`: mise special-cases the global
# config path (`~/.config/mise/config.toml`, which is where this mounts --
# see ./resources/mise.lock's header) and always names ITS lockfile
# `mise.lock` regardless of the config file's own basename; that
# basename-pairing rule only holds for non-global project configs.
# disableNameSuffixHash because ./helmrelease.yaml mounts these by literal
# name.
configMapGenerator:
  - name: ${APP}-mise-config
    files:
      - config.toml=./resources/mise.toml
      - mise.lock=./resources/mise.lock
      - entrypoint.sh=./resources/entrypoint.sh
      # Claude Code's own MCP client config -- mounted at /root/.mcp.json,
      # picked up automatically since the tmux session in
      # ./resources/entrypoint.sh starts `claude` from $HOME. ${ROOT_DOMAIN}
      # inside it is substituted the same as anywhere else in this
      # Kustomization (components/common's substituteFrom patch, not
      # ./ks.yaml's own postBuild.substitute -- that one only carries
      # APP/NAMESPACE).
      - mcp.json=./resources/mcp.json
    options:
      disableNameSuffixHash: true
