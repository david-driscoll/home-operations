---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./definition.yaml
  - ./httproute.yaml
  - ./rbac.yaml
# Everything ./helmrelease.yaml's `command` needs and cannot get from a
# Dockerfile, because there isn't one -- see ./resources/entrypoint.sh's
# header. `mise.lock`, NOT `config.lock`: mise special-cases the global
# config path (`~/.config/mise/config.toml`, which is where this mounts --
# see ./resources/mise.lock's header) and always names ITS lockfile
# `mise.lock` regardless of the config file's own basename; that
# basename-pairing rule only holds for non-global project configs.
# disableNameSuffixHash because ./helmrelease.yaml mounts these by literal
# name.
configMapGenerator:
  - name: ${APP}-mise-config
    files:
      - config.toml=./resources/mise.toml
      - mise.lock=./resources/mise.lock
      - entrypoint.sh=./resources/entrypoint.sh
      # Claude Code's own MCP client config -- mounted at /root/.mcp.json,
      # picked up automatically since the tmux session in
      # ./resources/entrypoint.sh starts `claude` from $HOME.
      #
      # IT POINTS AT THE CLUSTER-INTERNAL Service, over plain http and with no
      # token: `vmcp-agent-tools-internal.agents.svc.cluster.local:4483`, which
      # is ../agent-tools-mcp/virtualmcpserver-internal.yaml. JSON cannot carry
      # a comment, hence this one.
      #
      # It used to be `https://agent-tools-mcp.agents.${ROOT_DOMAIN}/mcp`, the
      # authenticated door. That door works, but reaching it needs an OAuth
      # authorization-code flow, and this pod has no browser and no human at
      # it -- so the login could never be completed from here no matter how
      # sound the server side was. The external hostname keeps its
      # authentication for clients that CAN log in; this pod takes the internal
      # path instead.
      #
      # http, not https, and that is not an oversight: the internal Service
      # terminates no TLS and issues no certificate. Confidentiality here rests
      # on ../agent-tools-mcp/networkpolicy.yaml restricting the endpoint to
      # this pod, not on transport security -- read that file before widening
      # anything.
      #
      # No ${ROOT_DOMAIN} in it any more, so the substitution note that used to
      # live here no longer applies: an in-cluster Service DNS name is the same
      # on every cluster.
      - mcp.json=./resources/mcp.json
      # Shell dotfiles, mounted at /root/.bashrc and /root/.bash_profile.
      # Not mise config despite this ConfigMap's name (neither is
      # entrypoint.sh or mcp.json) -- what it really holds is everything a
      # Dockerfile would have baked in, if this app had one. They exist
      # because Debian's /etc/profile resets root's PATH in login shells and
      # tmux only ever starts login shells; ./resources/bashrc has the full
      # story and the live evidence.
      - bashrc=./resources/bashrc
      - bash_profile=./resources/bash_profile
    options:
      disableNameSuffixHash: true
