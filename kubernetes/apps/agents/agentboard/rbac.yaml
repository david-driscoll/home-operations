---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/clusterrolebinding.json
#
# `agent-debug` (../rbac/clusterrole.yaml), NOT `cluster-admin` -- David's
# own call, narrowed once it was clear what "enough to debug with" actually
# needs; see that file's header for exactly what this grants and why. Same
# role ../agent-mcp-tools/agent-tools-servers/kubernetes.yaml's own SA binds, deliberately -- one written
# security posture, not two that could quietly drift apart.
#
# NO ServiceAccount object here -- an earlier draft created one directly,
# which collided with ./helmrelease.yaml's own `values.serviceAccount.${APP}`
# (app-template creates it; the chart's schema rejects
# `controllers.*.pod.serviceAccountName`, which is what referencing an
# externally-created one would have needed). A binding's `subjects[].name`
# does not require the ServiceAccount to exist yet -- Kubernetes just leaves
# the binding inert until it does -- so there is no ordering hazard from the
# two halves living in different objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${APP}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-debug
subjects:
  - kind: ServiceAccount
    name: ${APP}
    namespace: ${NAMESPACE}
