---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Three ExternalSecrets (the third, `${APP}-forgejo-ssh`, is at the bottom and
# carries its own header). The Anthropic key is this app's own input, created
# once by hand -- but under `third-party-tokens/`, NOT `clusters/*/apps/*`:
# it is a vendor API credential with no relationship to any one cluster or
# app, same category as `third-party-tokens/tmdb/api-key` or
# `third-party-tokens/docker-hub/api-key`, not the "input, not output" idiom
# `clusters/*/apps/*` is for (kubernetes/apps/agents/toolhive/externalsecret.yaml's
# authserver keys). Per-review-comment correction -- an earlier draft of
# this file put it under `clusters/${CLUSTER_CNAME}/apps/${APP}/anthropic`.
#
#   bao kv put secrets/third-party-tokens/anthropic/api-key key="sk-ant-..."
#
# NO Tailscale auth key here any more -- this pod does not join the tailnet.
# An earlier draft gave it a Tailscale SSH sidecar (plus a Pulumi helper to
# mint the key, components/tailscale.ts's `createManagedAuthKey`); both are
# gone. See ./helmrelease.yaml's header for why: the cluster's own Tailscale
# Connector already routes tailnet devices into the service CIDR, so a
# second, per-pod route in was redundant, not additive.
#
# Below that is a SECOND ExternalSecret reusing the Pulumi credential bundle the
# `pulumi` namespace's own workspace pods already use (see
# kubernetes/apps/pulumi/home-operations/stack.yaml and
# kubernetes/apps/pulumi/secrets/) -- deliberately NOT re-minted under a new
# path, so rotating one Pulumi credential rotates it everywhere at once.
#
# NO GitHub token here, on either Secret -- deliberately. There already is
# one: `github-token`, the estate's own GitHub App installation token
# (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml),
# refreshed every 30m and reflected into EVERY namespace automatically
# (`reflection-auto-enabled: true`) -- including this one, with no per-consumer
# wiring required. Re-minting a second one under a new OpenBao path (an
# earlier draft of this file did) would have meant maintaining a bot
# credential this repo already solved once, estate-wide. ./helmrelease.yaml
# reads that Secret directly, by its real name, not through here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      data:
        anthropic-api-key: "{{ .anthropic_key }}"
  data:
    - secretKey: anthropic_key
      remoteRef:
        key: third-party-tokens/anthropic/api-key
        property: key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pulumi
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-pulumi
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .state_s3_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .state_s3_password }}"
        PULUMI_CONFIG_PASSPHRASE: "{{ .pulumi_passphrase }}"
        CONNECT_TOKEN: "{{ .connect_token }}"
        AUTHENTIK_TOKEN: "{{ .authentik_token }}"
        AUTHENTIK_URL: "{{ .authentik_url }}"
  data:
    # The Pulumi state backend key (Garage `pulumi-state` bucket), not the
    # Minio root credential it replaced.
    - secretKey: state_s3_username
      remoteRef:
        key: apps/pulumi/state-s3
        property: username
    - secretKey: state_s3_password
      remoteRef:
        key: apps/pulumi/state-s3
        property: password
    - secretKey: pulumi_passphrase
      remoteRef:
        key: apps/pulumi/passphrase
        property: password
    - secretKey: connect_token
      remoteRef:
        key: third-party-tokens/onepassword/eris-connect
        property: credential
    - secretKey: authentik_token
      remoteRef:
        key: clusters/alpha-site/apps/authentik/token
        property: credential
    - secretKey: authentik_url
      remoteRef:
        key: clusters/alpha-site/apps/authentik/token
        property: url
---
# The `claude-code` Forgejo account's SSH key, for plain `git` over SSH to the
# in-cluster forge. stacks/system (forgejo-renovate.ts) generates it, registers
# the public half on the account, and writes both halves to OpenBao. Mounted by
# ./helmrelease.yaml at /var/run/secrets/forgejo-ssh; ./resources/ssh_config
# points git.<root domain> at it.
#
# The helmrelease mounts this Secret `optional: true`, so a pod that starts
# before the Pulumi run has written the key still starts -- it just has no key
# until the next roll.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-forgejo-ssh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-forgejo-ssh
    creationPolicy: Owner
    template:
      data:
        id_ed25519: "{{ .ssh_private_key }}"
        id_ed25519.pub: "{{ .ssh_public_key }}"
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: clusters/equestria/apps/forgejo/claude-code
        property: ssh_private_key
    - secretKey: ssh_public_key
      remoteRef:
        key: clusters/equestria/apps/forgejo/claude-code
        property: ssh_public_key
