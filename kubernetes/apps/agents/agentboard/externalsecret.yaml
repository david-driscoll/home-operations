---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Two ExternalSecrets: this app's OWN inputs, created once by hand under
# clusters/${CLUSTER_CNAME}/apps/${APP}/* (same "input, not output" idiom as
# kubernetes/apps/agents/toolhive/externalsecret.yaml's authserver keys --
# nothing regenerates these):
#
#   bao kv put secrets/clusters/${CLUSTER_CNAME}/apps/${APP}/anthropic \
#     key="sk-ant-..."
#   bao kv put secrets/clusters/${CLUSTER_CNAME}/apps/${APP}/tailscale-authkey \
#     key="tskey-auth-..."
#
# and a SECOND ExternalSecret below reusing the Pulumi credential bundle the
# `pulumi` namespace's own workspace pods already use (see
# kubernetes/apps/pulumi/home-operations/stack.yaml and
# kubernetes/apps/pulumi/secrets/) -- deliberately NOT re-minted under a new
# path, so rotating one Pulumi credential rotates it everywhere at once.
#
# NO GitHub token here, on either Secret -- deliberately. There already is
# one: `github-token`, the estate's own GitHub App installation token
# (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml),
# refreshed every 30m and reflected into EVERY namespace automatically
# (`reflection-auto-enabled: true`) -- including this one, with no per-consumer
# wiring required. Re-minting a second one under a new OpenBao path (an
# earlier draft of this file did) would have meant maintaining a bot
# credential this repo already solved once, estate-wide. ./helmrelease.yaml
# reads that Secret directly, by its real name, not through here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        anthropic-api-key: "{{ .anthropic_key }}"
        tailscale-authkey: "{{ .tailscale_key }}"
  data:
    - secretKey: anthropic_key
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/anthropic
        property: key
    - secretKey: tailscale_key
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/tailscale-authkey
        property: key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pulumi
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-pulumi
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        AWS_ACCESS_KEY_ID: "{{ .minio_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .minio_password }}"
        PULUMI_CONFIG_PASSPHRASE: "{{ .pulumi_passphrase }}"
        CONNECT_TOKEN: "{{ .connect_token }}"
        AUTHENTIK_TOKEN: "{{ .authentik_token }}"
        AUTHENTIK_URL: "{{ .authentik_url }}"
  data:
    - secretKey: minio_username
      remoteRef:
        key: apps/minio/root
        property: username
    - secretKey: minio_password
      remoteRef:
        key: apps/minio/root
        property: password
    - secretKey: pulumi_passphrase
      remoteRef:
        key: apps/pulumi/passphrase
        property: password
    - secretKey: connect_token
      remoteRef:
        key: third-party-tokens/onepassword/eris-connect
        property: credential
    - secretKey: authentik_token
      remoteRef:
        key: clusters/alpha-site/apps/authentik/token
        property: credential
    - secretKey: authentik_url
      remoteRef:
        key: clusters/alpha-site/apps/authentik/token
        property: url
