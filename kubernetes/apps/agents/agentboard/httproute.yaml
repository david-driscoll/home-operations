---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "${APP}.agents.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          port: 4040
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # `local-user`, not `local-api` -- this is a browser app with no
            # login of its own (see ./definition.yaml), so the authentik
            # outpost forward-auth this middleware chains in is the ONLY
            # thing standing between the internet^Wtailnet and a root shell.
            name: local-user
