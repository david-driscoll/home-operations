---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "${APP}.agents.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          port: 4040
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # `authenticated-user`, NOT `local-user` -- this is a browser app
            # with no login of its own (see ./definition.yaml), so the
            # authentik outpost forward-auth this middleware chains in is the
            # ONLY thing standing between the internet^Wtailnet and a root
            # shell. `local-user` (network-gate only: error-pages +
            # internal-network, no outpost step at all -- see
            # network/traefik/middleware/authenticated-user.yaml) is what
            # this said until 2026-08-30, and every word of THIS comment was
            # already true then -- it just named the wrong middleware.
            # Confirmed live: an unauthenticated request answered 200 with
            # the app's own HTML, not a redirect to canterlot.driscoll.tech,
            # from the first moment agentboard ever actually served traffic
            # (its Kustomization sat blocked behind an unrelated Flux
            # health-check deadlock for hours before that -- see
            # ../agent-tools-mcp/ks.yaml's own header). Fixed the moment
            # this was noticed, not folded silently into an unrelated diff.
            name: authenticated-user
