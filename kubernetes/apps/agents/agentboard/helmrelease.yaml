---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# NO Tailscale sidecar here, despite an earlier draft carrying one -- this
# pod does not need to BE a tailnet node. It already lives inside the
# cluster, and kubernetes/apps/tailscale-system/resources/connector.yaml
# already advertises the cluster's service CIDR as a subnet route (`tag:
# ${CLUSTER_CNAME}`, `tag:exit-node`), so any tailnet device already has a
# route IN, and this pod already has a route OUT to anything the estate
# serves over `*.driscoll.tech` (Technitium's split-horizon DNS resolves the
# same for LAN/tailnet/cluster origins alike -- see the
# `technitium-split-horizon-standarddns` note). "Join the tailnet directly"
# would have been a second, redundant way to get access this pod already
# has through the Connector. Terminal-from-a-machine is `kubectl exec`
# only, per ./definition.yaml's Gatus URL and the app's own front door --
# both already reachable from the tailnet the same way every other
# `agents`-namespace app is.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    # NOT recreate -- see the Recreate strategy note below: a rolling update
    # would try to run two pods against the same ReadWriteOnce PVC.
    recreate: false
  uninstall:
    keepHistory: false
  values:
    # Referenced below by controllers.agentboard.serviceAccount.identifier --
    # app-template's own object, not ./rbac.yaml's ClusterRoleBinding subject
    # by coincidence: `pod.serviceAccountName` (an earlier draft's field name)
    # is not in this chart's schema at all --
    # kubernetes/apps/volsync-system/restore-cleanup/helmrelease.yaml has the
    # working pattern this now matches.
    serviceAccount:
      *app : {}
    controllers:
      *app :
        # NOT `reloader.stakater.com/auto: "true"`, which is what this was
        # and which made the pod restart EVERY 30 MINUTES. `auto` watches
        # every ConfigMap and Secret the pod references -- including
        # `github-token`, whose ExternalSecret carries `refreshInterval: 30m`
        # (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml).
        # A fresh token is a changed Secret, so reloader rolled the
        # Deployment on every mint. Confirmed live 2026-09-05 from the
        # namespace's own events: `Changes detected in 'github-token' of type
        # 'SECRET' ... Updated 'agentboard' of type 'Deployment'`.
        #
        # That defeated the entire reason `github-token` is a VOLUME here
        # rather than an env var (see `persistence.github-token` below and
        # ./resources/entrypoint.sh's credential.helper): the volume was
        # chosen SO THAT the token could rotate under a session running for
        # days without a restart -- and then `auto` restarted the pod on that
        # very rotation anyway. It also gave the pod a hard 30-minute ceiling
        # on any agent session, which is the other half of why every restart
        # looked like a brand-new Claude session.
        #
        # Listing the two by name instead. These are the only referenced
        # objects a restart is actually the right response to:
        #   - the mise-config ConfigMap holds entrypoint.sh, mise.toml/lock,
        #     bashrc and mcp.json -- all read once, at container start.
        #   - the -pulumi Secret arrives via `envFrom`, and env is resolved
        #     once at start and never again.
        # `github-token` and `sops-age` are deliberately absent: both are
        # volume mounts whose file contents update in place, which is the
        # whole point of mounting them that way.
        annotations:
          configmap.reloader.stakater.com/reload: ${APP}-mise-config
          secret.reloader.stakater.com/reload: ${APP}-pulumi
        # One ReadWriteOnce PVC carries the whole home directory (tmux
        # history, agentboard's sqlite db, the Claude Code session and the
        # working checkout) -- a second pod could never attach it.
        strategy: Recreate
        serviceAccount:
          identifier: *app
        pod:
          securityContext:
            # mise, tmux and a `git`-driven working checkout all expect to
            # write into $HOME freely; running as root here is the same
            # trade-off ../coder/coder's workspaces make, not a new one.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          # Confirmed live 2026-08-30: `shining-armor` is the one node in
          # this cluster without AVX2 (`kubectl get node shining-armor -o
          # jsonpath='{.metadata.labels}'` -- every cpu-cpuid.* label present
          # tops out at X86_64_V2, and every OTHER node in the cluster
          # carries `cpu-cpuid.AVX2: "true"`). `@gbasin/agentboard`'s
          # published `-linux-x64` native binary needs it: scheduled there,
          # the pod gets past `mise install` and straight into a SIGILL
          # crash loop (`Command failed: .../agentboard --port 4040
          # --hostname 0.0.0.0 ... signal: 'SIGILL'`) -- not a config error
          # of this rollout's own making, an unlisted hardware requirement
          # of an upstream prebuilt binary. Excluding by the actual
          # capability (node-feature-discovery's own AVX2 label) rather than
          # by hostname survives shining-armor's hardware changing, or
          # another AVX2-less node joining later, with no edit needed here.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: feature.node.kubernetes.io/cpu-cpuid.AVX2
                        operator: In
                        values: ["true"]
        containers:
          *app :
            image:
              # STOCK Debian, not an agentboard-specific build -- there is no
              # Dockerfile or CI pipeline for this app (see
              # ./resources/entrypoint.sh's header). `command`/`args` below
              # install mise, tmux and everything else at pod start instead.
              repository: debian
              tag: 13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
            # Overrides the image's own bash-shell default CMD. The script
            # is the ConfigMap ../kustomization.yaml generates from
            # ./resources/entrypoint.sh, mounted below -- run via `bash
            # <path>` rather than relying on the mount's executable bit,
            # which a ConfigMap volume does not reliably carry.
            command: ["/bin/bash", "/opt/agentboard/entrypoint.sh"]
            env:
              MISE_DATA_DIR: /root/.local/share/mise
              MISE_CONFIG_DIR: /root/.config/mise
              MISE_CACHE_DIR: /root/.cache/mise
              MISE_INSTALL_PATH: /usr/local/bin/mise
              # Debian's stock default PATH, with the mise shims dir
              # prepended -- env: REPLACES the image's PATH rather than
              # extending it, so the standard entries have to be spelled out
              # here too or nothing on the base image resolves any more.
              PATH: /root/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # ANTHROPIC_API_KEY:
              #   valueFrom:
              #     secretKeyRef:
              #       name: *app
              #       key: anthropic-api-key
              # NO `GITHUB_TOKEN` env var, deliberately -- this used to be a
              # `secretKeyRef` on `github-token`, and it was the last thing in
              # this pod still holding a token that could go stale.
              # `secretKeyRef` resolves ONCE at container start; the token
              # behind it is re-minted every 30m against a 60m life, so `gh`
              # started failing about an hour in while `git` sailed on (its
              # credential helper re-reads the mounted file every invocation
              # -- see ./resources/entrypoint.sh). Until now that was masked
              # by an accident: `reloader.stakater.com/auto` restarted the pod
              # on every rotation, re-resolving the var as a side effect. That
              # restart loop is gone (see the controller annotations above),
              # so the staleness would have become real.
              #
              # `gh` has no GITHUB_TOKEN_FILE or any other file-based token
              # input -- verified against gh 2.100.0, which silently ignores
              # such a variable and reports "not logged into any GitHub
              # hosts". Its only file-based credential is its own hosts.yml,
              # so point it at one. The `github-token` Secret now renders
              # `hosts.yml` and `config.yml` alongside `token`
              # (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml),
              # and `persistence.github-token` below already mounts that whole
              # Secret -- as a DIRECTORY, not a subPath, which is what makes
              # the files update in place as the Secret rotates. (subPath
              # mounts never receive updates; that is why this could not be
              # done by mounting a single key.)
              #
              # Net effect: `gh` now gets a fresh credential per INVOCATION,
              # the same guarantee `git` already had, with no shell wrapper
              # and no env var to go stale. The stray `token`/`access_token`
              # keys sharing that directory are inert -- confirmed live, gh
              # ignores files it does not recognise.
              #
              # Anything that genuinely needs the raw value can still read
              # /var/run/secrets/github-token/token, which is fresher than the
              # env var ever was.
              GH_CONFIG_DIR:
                value: /var/run/secrets/github-token
              # The `pulumi` MCP server (../agent-tools-servers/pulumi.yaml) and any `pulumi`
              # the agent runs directly from its own tmux pane both need this
              # whole bundle -- same env var names the `pulumi` namespace's
              # own workspace pods use (kubernetes/apps/pulumi/*/stack.yaml),
              # sourced from the SAME OpenBao paths via ./externalsecret.yaml.
              AWS_REGION:
                value: home
              # Points `sops`/`age` (../resources/mise.toml) at the estate's
              # own identity, mounted below -- the SAME `sops-age` Secret
              # Flux itself uses to decrypt every *.sops.yaml in this repo
              # (kubernetes/flux/meta/sops-age.sops.yaml is what CREATES it;
              # this is not a new grant this PR introduces -- that Secret
              # already carries `reflection-auto-enabled: true` and is
              # already mirrored into every namespace, this one included).
              # This is the estate's single most sensitive credential
              # (bootstrap/INVENTORY.md: "Not in any repo, not in OpenBao,
              # not recoverable. Losing it means re-keying the estate from
              # the surviving plaintext.") -- giving an agent session decrypt
              # access to it is a deliberate, explicit call, not a default.
              SOPS_AGE_KEY_FILE:
                value: /var/run/secrets/sops-age/age.agekey
              # What the repo-root .mcp.json (4 levels up) expands its
              # `agent-tools` URL to INSIDE THIS POD. That file is committed
              # with an env-templated URL whose DEFAULT is the authenticated
              # external door, so every client that does NOT set this var -- a
              # laptop, CI, a Codespace -- is completely unchanged by it. This
              # pod sets it, and only this pod, so it takes the internal one:
              # ../agent-tools-mcp/virtualmcpserver-internal.yaml.
              #
              # WHY THIS EXISTS AT ALL, given ./resources/mcp.json already
              # mounts the same internal URL at /root/.mcp.json. That mount
              # only wins while the session's working directory IS $HOME.
              # Claude Code resolves `.mcp.json` from the CWD, not from $HOME
              # and not by walking parents, and an agent on this pod spends
              # its life inside the repo checkout (/root/home-operations) --
              # where the repo's own committed .mcp.json shadows the mounted
              # one completely. Verified live: `claude mcp get agent-tools`
              # from /root reports the internal URL and "Connected", from
              # /root/home-operations it reported the external URL and "Needs
              # authentication". So the fallback that was supposed to make
              # agent-tools work here was silently inert in the one directory
              # that matters.
              #
              # An env var is what fixes that rather than editing the repo's
              # .mcp.json to hardcode the Service DNS name, because the same
              # file has to keep working off-cluster, where that name does not
              # resolve. Claude Code expands shell-style env templates with a
              # default (dollar-brace VAR colon-dash default) in .mcp.json
              # values -- verified live against this endpoint, both branches.
              # Spelled out in words rather than punctuation on purpose: Flux
              # runs envsubst over this whole file (./ks.yaml `postBuild`),
              # comments included, so the literal syntax would be REWRITTEN
              # here and this comment would end up describing something else.
              #
              # NOT https, and no token: see ./kustomization.yaml's mcp.json
              # comment and ../agent-tools-mcp/networkpolicy.yaml. That policy
              # naming THIS pod is the whole of the access control.
              AGENT_TOOLS_MCP_URL:
                value: http://vmcp-agent-tools-internal.agents.svc.cluster.local:4483/mcp
            envFrom:
              - secretRef:
                  name: ${APP}-pulumi
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 4Gi

    persistence:
      # $HOME for the main container: agentboard's sqlite db
      # (~/.agentboard), the Claude Code session/config (~/.claude), the mise
      # install this pod provisions at start, and the working checkout the
      # agent operates against.
      home:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: longhorn
        globalMounts:
          - path: /root
      mise-config:
        type: configMap
        name: ${APP}-mise-config
        advancedMounts:
          *app :
            *app :
              - path: /root/.config/mise/config.toml
                subPath: config.toml
                readOnly: true
              # `mise install` resolves through this at strict-lockfile
              # confidence rather than a live "latest" lookup. Named
              # `mise.lock`, NOT paired to `config.toml`'s own basename --
              # see ./resources/mise.lock's header for why: this path is
              # mise's special-cased GLOBAL config location, and the global
              # lockfile is always `mise.lock` regardless of the config
              # file's name.
              - path: /root/.config/mise/mise.lock
                subPath: mise.lock
                readOnly: true
              # ./resources/entrypoint.sh -- see ./helmrelease.yaml's
              # `command` above. Deliberately NOT under /root: it is
              # image/config, not state, and has no business on the
              # persistent home-dir PVC.
              - path: /opt/agentboard/entrypoint.sh
                subPath: entrypoint.sh
                readOnly: true
              # ./resources/mcp.json -- see ./kustomization.yaml's comment.
              # /root, not /opt, because Claude Code only auto-loads
              # .mcp.json from a session's working directory, and $HOME is
              # where entrypoint.sh's tmux session starts one.
              - path: /root/.mcp.json
                subPath: mcp.json
                readOnly: true
              # ./resources/bash_profile and ./resources/bashrc -- what puts
              # the mise shims dir back on PATH for the LOGIN shells tmux
              # hands every agentboard terminal, after Debian's /etc/profile
              # has hard-reassigned root's PATH and thrown this pod's own
              # `env: PATH` above away. Read ./resources/bashrc before
              # touching either: `claude` typed into an agentboard pane
              # resolves through these.
              - path: /root/.bash_profile
                subPath: bash_profile
                readOnly: true
              - path: /root/.bashrc
                subPath: bashrc
                readOnly: true
      github-token:
        type: secret
        # NOT `${APP}` -- the real, estate-wide Secret name, reflected into
        # this namespace automatically. See ./externalsecret.yaml's header
        # and ./resources/entrypoint.sh's credential.helper comment for why
        # this is a volume mount (live-updating as the token rotates) rather
        # than the env var most other consumers of this Secret use.
        name: github-token
        advancedMounts:
          *app :
            *app :
              - path: /var/run/secrets/github-token
                readOnly: true
      sops-age:
        type: secret
        # Same shape as `github-token` above -- NOT `${APP}`, the real,
        # already-estate-wide-reflected Secret name. See the `env` block's
        # SOPS_AGE_KEY_FILE comment for what this actually grants.
        name: sops-age
        advancedMounts:
          *app :
            *app :
              - path: /var/run/secrets/sops-age
                readOnly: true

    service:
      *app :
        controller: *app
        ports:
          http:
            port: 4040
