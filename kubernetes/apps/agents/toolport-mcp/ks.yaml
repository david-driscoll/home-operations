---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# The doors to ../toolport, one per profile. toolport itself only speaks
# static bearer tokens and picks the profile from which one it is shown; these
# turn that into one URL per profile, with the token held server-side:
#
#   laptop    --OAuth--> vmcp-toolport-<p>-mcp  (toolport-<p>.agents.<root domain>)
#                          \
#   agentboard ------------> MCPRemoteProxy toolport-<p> --Bearer <p>-->
#                              toolport:8765 --> ToolHive backends
#
# The vMCPs are on the internal gateway (LAN + Tailscale), each with its own
# OAuth server federated to authentik. The remote proxies are anonymous and
# ClusterIP-only, gated by ./networkpolicy.yaml. ./kustomization.yaml has the
# per-profile shape.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolport-mcp
  namespace: &namespace agents
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The shared auth-server keys and toolhive-oidc client secret.
    - name: toolhive
      namespace: *namespace
    # The `toolport` Secret the MCPExternalAuthConfigs read.
    - name: toolport
      namespace: *namespace
  path: ./kubernetes/apps/agents/toolport-mcp
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Same reasoning as ../agent-tools-mcp/ks.yaml: `Degraded` (some profile
  # unreachable) is a normal serving state for this CRD; only `Failed` blocks.
  healthCheckExprs:
    - apiVersion: toolhive.stacklok.dev/v1beta1
      kind: VirtualMCPServer
      failed: status.phase == 'Failed'
      current: status.phase == 'Ready' || status.phase == 'Degraded'
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
