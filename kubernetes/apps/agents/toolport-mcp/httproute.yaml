---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# The same shape as ../agent-tools-mcp/httproute.yaml: the internal gateway,
# whose `local-api` chain admits the LAN and the tailnet (100.64.0.0/10), so
# this is reachable over Tailscale on its ROOT_DOMAIN name. The hostname must
# match ./virtualmcpserver.yaml's issuer/resourceUrl and the redirect URI in
# ../toolhive/definition.yaml exactly.
#
# Backend is the operator-created `vmcp-<VirtualMCPServer name>` Service on
# 4483.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "toolport-mcp.agents.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: vmcp-toolport
          port: 4483
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # `local-api`, not `local-user`: error-pages would rewrite the
            # JSON-RPC and OAuth error bodies MCP clients depend on.
            name: local-api
