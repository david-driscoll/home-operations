---
# One MCPRemoteProxy per toolport profile, each presenting that profile's
# bearer. The Secret `toolport` (../toolport/externalsecret.yaml) carries the
# values pre-formatted as `Bearer <token>`, because these are headerInjection
# configs: the vMCP has no bearerToken converter (ToolHive 0.51.1) and silently
# drops any backend that uses one.
#
# The auth is applied by the VIRTUAL server's outgoingAuth
# (./virtualmcpserver.yaml), not by the proxy -- a direct call to one of these
# proxy Services reaches toolport with no token and gets a 401. That is also
# why every name here must appear in that file's `outgoingAuth.backends`.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: toolport-postgres
spec:
  type: headerInjection
  headerInjection:
    headerName: Authorization
    valueSecretRef:
      name: toolport
      key: authorization-postgres
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: toolport-postgres
spec:
  remoteUrl: http://toolport.${NAMESPACE}.svc.cluster.local:8765/mcp
  allowPrivateEndpoint: true
  transport: streamable-http
  groupRef:
    name: toolport
  externalAuthConfigRef:
    name: toolport-postgres
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
---
