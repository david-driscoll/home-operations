---
# No `yaml-language-server: $schema=` line -- see ../agent-tools-servers/docs.yaml.
#
# Validates tokens minted by ./virtualmcpserver.yaml's own embedded auth
# server. One per auth server: an embedded ToolHive auth server registers
# exactly one audience (see ../agent-tools-mcp/mcpoidcconfig.yaml).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: toolport
spec:
  type: inline
  inline:
    issuer: https://toolport-mcp.${TAILSCALE_DOMAIN}
    jwksAllowPrivateIP: true
