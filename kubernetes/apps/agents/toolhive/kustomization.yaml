---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./mcpoidcconfig.yaml
  - ./httproute.yaml
  - ./definition.yaml
# ./resources/values.yaml is the Go template the `-values` ExternalSecret
# renders; it reaches ESO as this ConfigMap. disableNameSuffixHash because the
# ExternalSecret references it by literal name.
configMapGenerator:
  - name: ${APP}-values
    files:
      - values.yaml=./resources/values.yaml
    options:
      disableNameSuffixHash: true
