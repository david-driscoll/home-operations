---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
#
# ONE ApplicationDefinition for the whole ToolHive front door, not one per MCP
# server. `metadata.name` is load-bearing well beyond the dashboard: the
# `applications` Pulumi stack derives the authentik application slug from it,
# and components/bao.ts derives `clusters/<cluster>/apps/<name>/oidc` from it --
# so this name is what makes ./externalsecret.yaml's path resolve.
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: ToolHive
  category: Applications
  description: MCP servers, and the OAuth front door in front of them
  access_policy:
    groups:
      - admins
  authentik:
    # `oauth2`, and specifically NOT `proxy`. Forward-auth would put an
    # interactive authentik redirect in front of every JSON-RPC call, which no
    # MCP client can follow. This provider is not consumed by a browser session
    # either -- it is the UPSTREAM leg of ToolHive's own authorization server
    # (./helmrelease.yaml), so ToolHive is the only client that ever
    # uses it.
    oauth2:
      clientType: confidential
      # PINNED rather than generated, so ./resources/values.yaml can carry
      # it as a literal -- that CRD has no secret-ref form for clientId.
      # components/authentik.ts's `clientIdPair` prefers this over a generated
      # value. Change it here and there in the same commit.
      clientId: ${APP}
      allowedRedirectUris:
        # ONE URI, and it is ToolHive's, not a client's. Every MCP client
        # registers its own redirect with ToolHive's embedded server via DCR;
        # authentik never sees them.
        - url: https://${APP}.${ROOT_DOMAIN}/oauth/callback
        # On the tailnet this service is `mcp`, not `toolhive` -- the flat
        # namespace is the chance to name the two apps for what they are, and
        # the human-facing UI next door takes the plain `toolhive` name there.
        # Deliberately NOT ${APP}: the ${ROOT_DOMAIN} hostname above is also this
        # server's OAuth `issuer` (see ./mcpoidcconfig.yaml) and renaming it
        # would invalidate every token and client registration in flight, so the
        # driscoll.tech side stays exactly as it is.
        - url: https://mcp.${TAILSCALE_DOMAIN}/oauth/callback
      propertyMappings:
        - email
        - openid
        - profile
      # `profile` carries `groups`, and includeClaimsInIdToken is what puts it
      # in the token ToolHive reads -- the hook any future Cedar authorization
      # policy would key off.
      includeClaimsInIdToken: true
      subMode: user_email
  gatus:
    # `/health` is the proxy runner's own endpoint and answers without a token,
    # which is what makes it usable as a check at all -- every MCP path is
    # authenticated now. NOT `/mcp`, which is a JSON-RPC POST target and answers
    # a bare GET with an error.
    #
    # This one does NOT exercise the OAuth flow -- the three below do.
    - name: ToolHive MCP
      group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/health
      method: GET
      conditions:
        - "[STATUS] == 200"
        - "[BODY].status == healthy"

    # THE THREE CHECKS BELOW EXIST BECAUSE OF WHAT SHIPPING THIS COST.
    #
    # Every failure on the way in was invisible to flate, to CRD schema
    # validation and to CI, because all of those check SHAPE and none of them
    # dials anything: a signing key encoded with explicit EC parameters, an
    # issuer literal that could never be right, an SSRF guard refusing a
    # split-horizon address, a Helm waiter deadlocking on its own CR. Each one
    # surfaced only as a pod that would not start, hours later.
    #
    # /health alone would not have caught the last of them either: the proxy can
    # serve /health perfectly while the OAuth surface behind it is broken. These
    # assert the parts a client actually depends on.

    # RFC 9728. The document an MCP client fetches FIRST, and the one that tells
    # it where to authenticate. The `authorization_servers` assertion is the
    # load-bearing half: if it ever points somewhere other than this host, every
    # client silently walks off to the wrong issuer.
    - name: ToolHive MCP protected-resource metadata
      group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/.well-known/oauth-protected-resource/mcp
      method: GET
      conditions:
        - "[STATUS] == 200"
        - "[BODY].resource == https://${APP}.${ROOT_DOMAIN}/mcp"
        - "[BODY].authorization_servers[0] == https://${APP}.${ROOT_DOMAIN}"

    # RFC 8414, served by the embedded authorization server. `registration_endpoint`
    # is the assertion that matters: its presence IS the anonymous-DCR capability
    # this whole architecture exists to provide, and it is the one thing authentik
    # could not give us. If the embedded server ever fails to start, this document
    # disappears and the check goes red while /health stays green.
    - name: ToolHive MCP authorization server
      group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/.well-known/oauth-authorization-server
      method: GET
      conditions:
        - "[STATUS] == 200"
        - "[BODY].issuer == https://${APP}.${ROOT_DOMAIN}"
        - "[BODY].registration_endpoint == https://${APP}.${ROOT_DOMAIN}/oauth/register"

    # A NEGATIVE CHECK, and the most important one here: it asserts the endpoint
    # is still CLOSED. The CRD is explicit that an MCPServer without an
    # `oidcConfigRef` "accepts every request that can reach its port" -- it fails
    # OPEN, with a healthy pod and a green /health. Nothing else in this file
    # would notice. A 200 here means authentication has silently been lost.
    - name: ToolHive MCP rejects unauthenticated
      group: "Applications"
      url: https://${APP}.${ROOT_DOMAIN}/mcp
      method: POST
      headers:
        Content-Type: application/json
      body: '{}'
      conditions:
        - "[STATUS] == 401"
