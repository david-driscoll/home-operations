---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive
  namespace: &namespace agents
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The operator, for two different reasons at once: it owns the CRDs these
    # manifests instantiate, and it is what turns them into a running auth
    # server. Not the CRDs Kustomization directly -- that is already the
    # operator's own dependency.
    - name: toolhive-operator
      namespace: *namespace
    - name: external-secrets
      namespace: kube-system
    # The session store, for its password Secret as much as for the server:
    # `aclUserConfig.passwordSecretRef` in ./mcpexternalauthconfig.yaml resolves
    # against a Secret that ../toolhive-valkey's ExternalSecret creates.
    - name: toolhive-valkey
      namespace: *namespace
  path: ./kubernetes/apps/agents/toolhive
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
