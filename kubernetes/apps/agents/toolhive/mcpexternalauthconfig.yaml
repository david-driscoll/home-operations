---
# No `yaml-language-server: $schema=` line: toolhive.stacklok.dev is not
# published by CRDs-catalog or kubernetes-schemas. Same as ../toolhive-docs.
#
# ToolHive's own OAuth 2.0 authorization server, federating login to authentik.
#
# WHY THIS EXISTS AT ALL, rather than pointing MCP clients straight at
# authentik. Two things about authentik 2026.8.0 (what alpha-site runs) rule
# that out, and both were checked against its source, not its docs:
#
#   1. DCR IS GATED. authentik gained RFC 7591 in exactly this release, but
#      DynamicClientRegistrationView requires a Bearer AccessToken carrying the
#      `goauthentik.io/oidc/dcr` scope and 401s without one. MCP clients
#      register anonymously, so every one of them would have to be
#      pre-registered by hand.
#   2. `aud` IS ALWAYS THE CLIENT ID. id_token.py and utils.py both set
#      `aud = provider.client_id` unconditionally, and there is no RFC 8707
#      `resource` handling anywhere in the authorize or token views. ToolHive
#      needs ONE static audience per MCP server, so more than one client can
#      never satisfy it -- and under DCR the client id is not even knowable in
#      advance.
#
# The embedded server sidesteps both: it accepts DCR from anyone with no
# configuration, and it issues its own tokens, so the audience is its own
# business. authentik drops back to being an ordinary confidential OIDC app
# with one fixed redirect URI -- which is precisely what ./definition.yaml and
# the `applications` Pulumi stack already automate.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: ${APP}
spec:
  type: embeddedAuthServer
  embeddedAuthServer:
    # Must equal the hostname clients actually reach, because it goes into the
    # `iss` claim and into every URL the discovery document advertises. No
    # trailing slash -- the CRD pattern rejects one (RFC 8414).
    #
    # The auth server's routes (/oauth/*, /.well-known/oauth-authorization-server,
    # /.well-known/openid-configuration, /.well-known/jwks.json) are served by
    # the SAME process as the MCP proxy, on the same port, so ./httproute.yaml's
    # single `/` rule already carries all of them. There is nothing extra to
    # route.
    issuer: https://${APP}.${ROOT_DOMAIN}

    upstreamProviders:
      - name: authentik
        type: oidc
        oidcConfig:
          # LITERAL, and the one value in this tree that a human has to supply.
          # `issuerUrl` and `clientId` are plain strings on this CRD -- only the
          # client SECRET has a secret-ref form -- so neither can be read from
          # the ExternalSecret next door.
          #
          # AUTHENTIK_ISSUER is set in ks.yaml's postBuild.substitute map and
          # ships pointing at .invalid ON PURPOSE, so a merge before that edit
          # fails loudly at OIDC discovery instead of half-working. See the
          # comment there for how to find the real value.
          issuerUrl: ${AUTHENTIK_ISSUER}
          # Pinned rather than generated, so it can be a literal here.
          # ./definition.yaml sets the same string, and components/authentik.ts
          # honours it (`clientIdPair` prefers `oauth2.clientId` over a
          # generated one). The two must change together.
          clientId: ${APP}
          clientSecretRef:
            name: ${APP}-oidc
            key: client-secret
          # Where authentik sends the browser back. This is ToolHive's default
          # ({resourceUrl}/oauth/callback) written out, because the same string
          # has to appear in ./definition.yaml's allowedRedirectUris and a
          # silent default on one side of a pair that must match is worse than
          # a repeated literal.
          redirectUri: https://${APP}.${ROOT_DOMAIN}/oauth/callback
          # No `subjectClaim`: authentik's `sub` is stable per user (it is not
          # Entra, whose sub rotates per application), so the default is
          # correct. Worth knowing before anyone changes it -- the CRD warns
          # that it resolves to the internal user ID, so editing it re-keys
          # every existing user.
          #
          # `offline_access` is what gets a refresh token out of authentik, so
          # a ToolHive session outlives the upstream access token instead of
          # bouncing the user back to a login every few minutes.
          scopes:
            - openid
            - profile
            - email
            - offline_access

    # Deliberately NARROW. Every client that registers through /oauth/register
    # gains the right to request everything listed here, whatever it asked for
    # -- the CRD spells out that a privileged scope here would be handed to
    # Claude Code, Cursor and VS Code alike. openid + offline_access is the
    # baseline the spec needs and nothing more.
    baselineClientScopes:
      - openid
      - offline_access

    storage:
      # NOT the `memory` default. In memory, DCR registrations and live
      # sessions die with the pod, so every MCP client silently re-registers
      # and re-authorises on any restart -- which on this cluster is every
      # Low Power window (docs/cluster-consolidation/24-power-states.md).
      type: redis
      redis:
        # ../toolhive-valkey, this namespace's own instance -- NOT the shared
        # `database/valkey`. That one has no password, and `aclUserConfig` below
        # is a REQUIRED field on this CRD, so it could not be used even setting
        # aside that seven other apps can read it. See that HelmRelease's header.
        addr: toolhive-valkey.${NAMESPACE}.svc.cluster.local:6379
        aclUserConfig:
          # Password only, no `usernameSecretRef`: valkey 9 accepts the legacy
          # AUTH form, and a second ACL user would be one more thing to keep in
          # step for no isolation gained on a single-tenant instance.
          passwordSecretRef:
            name: toolhive-valkey
            key: password

    # See ./externalsecret.yaml for why neither of these may be omitted, and
    # for the two commands that create them.
    signingKeySecretRefs:
      - name: ${APP}-authserver-keys
        key: signing.pem
    hmacSecretRefs:
      - name: ${APP}-authserver-keys
        key: hmac
