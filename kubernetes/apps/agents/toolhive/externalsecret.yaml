---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The embedded authorization server's two long-lived keys.
#
# NEITHER OF THESE MAY BE LEFT TO THE DEFAULT. With `signingKeySecretRefs`
# unset ToolHive generates an ephemeral signing key and the CRD's own wording is
# "JWTs will be invalid after restart"; with `hmacSecretRefs` unset it does the
# same for authorization codes and refresh tokens. The failure mode is not a
# crash -- the auth server comes up perfectly, works, and then silently
# invalidates every issued token and every client session the next time the pod
# moves. That is a nightly event on this cluster once Low Power sheds the
# workers.
#
# Create them ONCE, before merging (they are inputs, not outputs -- nothing
# regenerates them):
#
#   bao kv put secrets/clusters/equestria/apps/toolhive/authserver-signing-key \
#     key="$(openssl genpkey -algorithm EC \
#              -pkeyopt ec_paramgen_curve:P-256 \
#              -pkeyopt ec_param_enc:named_curve)"
#   bao kv put secrets/clusters/equestria/apps/toolhive/authserver-hmac \
#     password="$(openssl rand -hex 32)"
#
# BOTH `-pkeyopt` flags are load-bearing, and the second one cost a crash loop
# on 2026-08-26 when it was missing:
#
#   * `ec_param_enc:named_curve` makes OpenSSL record the curve as an OID.
#     Without it OpenSSL embeds EXPLICIT curve parameters, which Go's x509
#     rejects -- `failed to parse signing key: x509: failed to parse EC private
#     key embedded in PKCS#8: x509: unknown elliptic curve`. OpenSSL itself
#     reads such a key back perfectly, so `openssl pkey -noout` is NOT a
#     sufficient check. Verify with `openssl pkey -noout -text` and require
#     BOTH `ASN1 OID: prime256v1` and `NIST CURVE: P-256` in the output; their
#     ABSENCE is what explicit parameters look like.
#   * `genpkey`, NOT `ecparam -genkey`: ecparam emits an `EC PARAMETERS` block
#     ahead of the key, and ToolHive's loader
#     (pkg/authserver/server/crypto/keys.go) calls pem.Decode once and takes the
#     FIRST block -- so that key fails the same way while looking valid in an
#     editor.
#
# P-256 gives ES256. RSA avoids the curve-encoding question entirely and the
# loader accepts it, subject to a 2048-bit floor.
#
# The HMAC secret must be at least 32 bytes (crypto.MinSecretLength); 32 hex
# bytes is 64 characters, comfortably over.
#
# Both live under the `clusters/*` prefix the `eso-equestria` role already
# grants, so this needs no root ceremony -- same as the Garage identity in
# kubernetes/apps/garage-system/cluster/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-authserver-keys
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-authserver-keys
    creationPolicy: Owner
    # Retain: an ExternalSecret hiccup must not take the signing key out from
    # under a running auth server, because losing it invalidates every live
    # token rather than just pausing issuance.
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # `signing.pem` is the key NAME inside this Secret, which is what
        # `signingKeySecretRefs[].key` points at. The operator mounts it as
        # key-0.pem regardless (AuthServerKeyFilePattern), so the name here is
        # only for readers.
        signing.pem: "{{ .signing_key }}"
        hmac: "{{ .hmac }}"
  # One remoteRef per value rather than a `dataFrom.extract` of a single blob:
  # a missing path then fails naming the path, not a template variable. Same
  # reasoning as kubernetes/apps/garage-system/cluster/externalsecret.yaml.
  data:
    - secretKey: signing_key
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/authserver-signing-key
        property: key
    - secretKey: hmac
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/authserver-hmac
        property: password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The authentik client secret, for the UPSTREAM leg of the flow.
#
# Unlike the two keys above this one is an OUTPUT, not an input: the
# `applications` Pulumi stack mints it when it reconciles ./definition.yaml's
# `authentik.oauth2` block, and writes it to this path itself (see
# `oidcBaoPath` in components/bao.ts). Do not create it by hand -- a hand-made
# value is overwritten on the next stack run, and the mismatch shows up as a
# 401 from authentik's token endpoint rather than anything naming this file.
#
# Only the SECRET comes through here. `clientId` and `issuerUrl` are plain
# string fields on MCPExternalAuthConfig with no secret-ref form, so they are
# literals -- see the notes on both in ./mcpexternalauthconfig.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-oidc
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        client-secret: "{{ .oidc_client_secret }}"
        # Not consumed by any CR -- carried so that `kubectl get secret
        # toolhive-oidc -o jsonpath='{.data.issuer}' | base64 -d` answers "what
        # should AUTHENTIK_ISSUER be?" without a trip to OpenBao. See ks.yaml.
        issuer: "{{ .oidc_issuer }}"
        client-id: "{{ .oidc_client_id }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The Helm values fragment carrying the one value that cannot be a literal.
#
# Same shape as coder/renovate-operator's `-values` ExternalSecret, for the same
# reason it gives: authentik mints the client id, and the issuer carries a
# GENERATED application slug (components/authentik.ts appends a RandomPet), so
# neither is knowable at commit time. MCPExternalAuthConfig takes `issuerUrl` as
# a plain string with no secret-ref form, and a per-app
# `postBuild.substituteFrom` cannot help -- the blanket patch replaces that list
# outright, verified by rendering it. A values fragment is the only way in, and
# it is why ./helmrelease.yaml exists rather than a bare CR manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-values
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      templateFrom:
        - target: Data
          configMap:
            # Generated from ./resources/values.yaml by the configMapGenerator in
            # ./kustomization.yaml.
            name: ${APP}-values
            items:
              - key: values.yaml
                templateAs: Values
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
