---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: ToolHive UniFi Protect MCP
  category: Applications
  description: UniFi Protect camera system access for agents, via ToolHive
  url: https://unifi-protect-mcp.agents.${ROOT_DOMAIN}/mcp
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/unifi-protect.svg
  access_policy:
    groups:
      - admins
  gatus:
    - name: ToolHive UniFi Protect MCP rejects unauthenticated
      group: "Applications"
      url: https://unifi-protect-mcp.agents.${ROOT_DOMAIN}/mcp
      method: POST
      headers:
        Content-Type: application/json
      body: '{}'
      conditions:
        - "[STATUS] == 401"
