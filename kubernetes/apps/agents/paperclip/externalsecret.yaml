---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠ `clusters/<cluster>/apps/paperclip/keys` MUST BE SEEDED IN OPENBAO before
# this app first reconciles. It is one KV document with four fields, each
# `openssl rand -hex 32`:
#
#   better_auth_secret           signs browser sessions
#   agent_jwt_secret             signs the bearer tokens handed to agents
#   secrets_master_key           encrypts the secrets stored in Paperclip
#   tool_action_signing_secret   signs tool-action approvals
#
# OpenBao rather than an in-cluster Password generator because of
# secrets_master_key. Paperclip encrypts every provider key and token saved in
# its UI with it. A generator-minted Secret is garbage-collected with its
# ExternalSecret and the next boot would mint a different key, leaving every
# stored secret unreadable. NEVER REGENERATE THE DOCUMENT. Supplying the key
# from here also keeps it off the PVC, where the server would otherwise write
# its own master.key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        BETTER_AUTH_SECRET: "{{ .paperclip_better_auth_secret }}"
        PAPERCLIP_AGENT_JWT_SECRET: "{{ .paperclip_agent_jwt_secret }}"
        PAPERCLIP_SECRETS_MASTER_KEY: "{{ .paperclip_secrets_master_key }}"
        PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "{{ .paperclip_tool_action_signing_secret }}"
        # Paperclip takes its database only as a URL. The password is
        # OpenBao's and rotates every 30 days, so it is percent-encoded here
        # rather than trusted to stay URL-safe. No sslmode: the client
        # defaults to a plain connection, which is what the cluster serves
        # in-cluster.
        DATABASE_URL: "postgres://{{ .postgres_username }}:{{ .postgres_password | urlquery }}@{{ .postgres_hostname }}:{{ .postgres_port }}/{{ .postgres_database }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/keys
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "paperclip_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
