---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# One password, rendered into two shapes because two different consumers need
# it in two different forms:
#
#   valkey.conf   the server's own config file, mounted by ./helmrelease.yaml
#   password      the bare value, which ../toolhive's MCPExternalAuthConfig
#                 points `aclUserConfig.passwordSecretRef` at
#
# Keeping them in ONE Secret from ONE OpenBao path is what stops the two
# drifting -- a rotation that updated only one side would leave the auth server
# unable to reach a store that is up and healthy.
#
# Create it once, before merging:
#
#   bao kv put secrets/clusters/equestria/apps/toolhive/valkey \
#     password="$(openssl rand -hex 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        password: "{{ .valkey_password }}"
        # A whole config file rather than `--requirepass` on the command line.
        # An arg would put the password in the container's process table and in
        # `kubectl describe pod`; a file keeps it in the Secret it came from.
        #
        # `appendonly yes` is the point of this instance existing: the auth
        # server's DCR client registrations and refresh tokens have to survive a
        # pod restart, and this cluster restarts pods nightly when Low Power
        # sheds the workers.
        valkey.conf: |
          requirepass {{ .valkey_password }}
          appendonly yes
          dir /data
  data:
    - secretKey: valkey_password
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/toolhive/valkey
        property: password
