---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The registry's Postgres credential, in the one shape the registry-api wants: a
# pgpass file.
#
# The database, the login role and this credential are all created by the
# `postgres` + `postgres/rotate` components in ./ks.yaml -- there is nothing to
# provision by hand, and NO sops document to add. `rotate` is what makes that
# true: it drops `passwordSecret` from the DatabaseRole and hands the password
# to OpenBao's database secrets engine, so the hand-maintained
# `${APP}-postgres-password` document that the base component still expects is
# never read. See kubernetes/components/postgres/AGENTS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-postgres
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # The component already assembles a correctly formatted pgpass line;
        # this only carries it across into the app's namespace.
        pgpass: "{{ .postgres_pgpass }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
