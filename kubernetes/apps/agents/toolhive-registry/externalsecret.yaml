---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The registry's Postgres credential, in the one shape the registry server
# wants: a pgpass file under a key named literally `.pgpass`.
#
# The leading dot is REQUIRED, not stylistic -- ./helmrelease.yaml's init
# container copies `/pgpass-secret/.pgpass`, which is the file name a Secret
# volume derives from the key. Rename the key and the copy fails with "No such
# file or directory" and the pod never starts.
#
# The database, the login role and this credential are all created by the
# `postgres` component in ./ks.yaml -- there is nothing to provision by hand,
# and NO sops document to add. The component renders a DatabaseRole with no
# `passwordSecret` and hands the password to OpenBao's database secrets engine,
# so nothing here ever reads passwords.sops.yaml. See
# kubernetes/components/postgres/AGENTS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-postgres
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # The component already assembles a correctly formatted pgpass line;
        # this only carries it across into the app's namespace under the name
        # the chart's init container expects.
        .pgpass: "{{ .postgres_pgpass }}"
  dataFrom:
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
