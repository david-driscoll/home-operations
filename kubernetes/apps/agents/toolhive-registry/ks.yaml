---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-registry
  namespace: &namespace agents
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The operator owns the MCPRegistry CRD and builds the registry-api
    # Deployment and Service from the CR.
    - name: toolhive-operator
      namespace: *namespace
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/agents/toolhive-registry
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # Postgres is NOT optional for the registry server -- its own docs are
    # explicit that PostgreSQL is "the only supported database option, there is
    # no alternative non-Postgres mode". This one line gives the app a database,
    # a login role and a rotating credential, with no sops document to add.
    #
    # There is no `postgres/rotate` sibling any more: #1188 folded it into the
    # base once every consumer had cut over, and the directory is gone. Adding
    # it back is not a no-op -- its patch removes `/spec/passwordSecret` from a
    # DatabaseRole that no longer has one, which fails the whole build with
    # "Unable to remove nonexistent key".
    - ../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
