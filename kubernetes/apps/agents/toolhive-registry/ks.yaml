---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-registry
  namespace: &namespace agents
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    # The operator owns the MCPRegistry CRD and builds the registry-api
    # Deployment and Service from the CR.
    - name: toolhive-operator
      namespace: *namespace
    - name: external-secrets
      namespace: kube-system
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/agents/toolhive-registry
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    # Postgres is NOT optional for the registry server -- its own docs are
    # explicit that PostgreSQL is "the only supported database option, there is
    # no alternative non-Postgres mode". This one component gives the app a
    # database, a login role and a rotating OpenBao-owned credential with no
    # further edits and no sops document.
    - ../../../components/postgres
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
