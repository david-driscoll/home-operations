---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# `mcp.agents.${ROOT_DOMAIN}` -- the catalogue API.
#
# The backend Service comes from ./helmrelease.yaml now, not from the operator.
# It was `<registry-name>-registry-api` while this was an MCPRegistry; the chart
# names it after the release, pinned to `${APP}` by `fullnameOverride`. Unlike
# the operator-built Services elsewhere in this namespace, this one IS in Git.
#
# This route is the ONLY way anything reaches the registry now -- there is no
# in-cluster consumer left. (There used to be: a Cloud UI, toolhive-ui, read it
# over the in-cluster Service via API_BASE_URL. Retired 2026-08-29; its
# upstream chart was archived and never shipped a way to create better-auth's
# Postgres schema on Kubernetes.) The actual consumers today are `thv` CLI and
# ToolHive Desktop, pointed here with:
#
#   thv config set-registry https://mcp.agents.${ROOT_DOMAIN}/registry/default \
#     --allow-private-ip
#
# `--allow-private-ip` is required, not optional: this hostname only resolves
# on the LAN/tailnet (Technitium split-horizon), so it always answers a private
# IP and thv refuses that by default. Desktop shares the same on-disk config
# store as the CLI (~/Library/Application Support/ToolHive on macOS), so
# setting it once covers both.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    # Needs the `*.agents.${ROOT_DOMAIN}` SAN on le-production -- a wildcard
    # matches exactly one label, so the estate-wide `*.${ROOT_DOMAIN}` does not
    # cover a name two labels deep. Added alongside this in
    # kubernetes/apps/network/certificates/{production,staging}.yaml.
    - "mcp.agents.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          port: 8080
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # `local-api`, not `local-user`: this serves JSON to clients, and
            # the error-pages middleware would replace a non-200 body with HTML.
            #
            # AND IT IS THE ONLY ACCESS CONTROL HERE. The registry runs
            # `auth.mode: anonymous` (see ./helmrelease.yaml), so anything that
            # can reach this hostname can read the whole catalogue. That is a
            # deliberate trade rather than an oversight -- the contents are a
            # mirror of the PUBLIC upstream ToolHive catalogue, re-synced from
            # git every 30m, so there is nothing here that is not already
            # public. Revisit the moment a private source is added to
            # `sources:`.
            name: local-api
