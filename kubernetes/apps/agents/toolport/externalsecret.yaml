---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# toolport's CLIENT tokens are minted in-cluster, not seeded in OpenBao: they
# authenticate callers to a gateway whose only callers are in this namespace
# (agentboard) or are this namespace's own MCPRemoteProxies (../toolport-mcp).
# Losing one costs a pod restart on each side and nothing else, so there is
# nothing a vault copy would protect. Same argument as
# apps/equestria/media/jellyfin/meilisearch-secret.yaml.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-token
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# One token per toolport PROFILE. toolport serves a single /mcp and picks the
# profile from which bearer the caller presents (`httpClients[]` in
# ./resources/registry.json) -- so "which tools can this client see" is
# entirely "which of these keys was it handed".
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING: each generatorRef call below
# mints a NEW value, so `Periodic` would rotate every client out from under
# itself on a schedule. To rotate on purpose, delete the Secret `${APP}`: ESO
# re-mints every value, and Reloader restarts toolport and every workload that
# reads them (agentboard via secretKeyRef, the ../toolport-mcp proxies via
# their MCPExternalAuthConfig).
#
# ADDING A PROFILE needs that same delete. CreatedOnce never re-renders, so a
# new TOKEN_<PROFILE> key added here does not reach an existing Secret, and
# the registry below then fails to render (its template references a key that
# does not exist) and keeps serving the previous registry.
#
# The registry is NOT rendered here, deliberately: a CreatedOnce Secret would
# freeze it on first creation and ignore every later git change. It is the
# separate, Periodic `${APP}-registry` ExternalSecret at the end of this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # Plaintext client tokens -- agentboard reads these into
        # TOOLPORT_TOKEN_<PROFILE> and its mcp.json sends them as a bearer.
        TOKEN_POSTGRES: "{{ .postgres }}"
        TOKEN_INFRASTRUCTURE: "{{ .infrastructure }}"
        TOKEN_NETWORKING: "{{ .networking }}"
        TOKEN_HOME: "{{ .home }}"
        TOKEN_MEDIA: "{{ .media }}"
        TOKEN_RESEARCH: "{{ .research }}"
        # The same tokens pre-formatted as a header value, for the
        # headerInjection MCPExternalAuthConfigs in ../toolport-mcp. vMCP has
        # no bearerToken converter (ToolHive 0.51.1), so the `Bearer ` prefix
        # has to be part of the value.
        authorization-postgres: "Bearer {{ .postgres }}"
        authorization-infrastructure: "Bearer {{ .infrastructure }}"
        authorization-networking: "Bearer {{ .networking }}"
        authorization-home: "Bearer {{ .home }}"
        authorization-media: "Bearer {{ .media }}"
        authorization-research: "Bearer {{ .research }}"
        # Switches toolport's secret store to its encrypted FILE backend
        # (secrets.enc under TOOLPORT_DATA_DIR). Nothing is ever written there
        # -- backend tokens come from TOOLPORT_SECRET_<KEY> env vars, which
        # win over every store -- but without it the lookup that follows an
        # env miss (`__http_auth__`, checked first for every HTTP server) falls
        # through to the OS keychain, which a container has no D-Bus session
        # to reach. See src-tauri/src/secrets.rs get_secret_result_raw.
        TOOLPORT_SECRET_KEY: "{{ .secret_key }}"
  dataFrom:
    - sourceRef: &generator
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-token
      rewrite: [{regexp: {source: "^password$", target: "postgres"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "infrastructure"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "networking"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "home"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "media"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "research"}}]
    - sourceRef: *generator
      rewrite: [{regexp: {source: "^password$", target: "secret_key"}}]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Backend credentials, for the remote servers toolport calls DIRECTLY rather
# than through their ToolHive MCPRemoteProxy.
#
# WHY DIRECT: an MCPRemoteProxy does NOT apply its MCPExternalAuthConfig to a
# caller that reaches its Service directly -- only a VirtualMCPServer's
# outgoingAuth does. Verified 2026-09-24 from agentboard: `initialize` straight
# at mcp-toolhive-{arr-mcp-plex,ecm,home-assistant,homelable}-remote-proxy:8080
# is a 401 from the BACKEND every time. The stdio/HTTP MCPServer proxies carry
# their credentials inside their own pod and answer fine, which is why every
# other server in ./resources/registry.json still goes through ToolHive.
#
# The SAME OpenBao items the ToolHive proxies read in
# ../agent-tools-servers/{arr-mcp,ecm,home-assistant}.yaml -- not new
# credentials, so a rotation reaches both paths at once.
#
# toolport resolves a server's `{"key": "<K>", "secret": true}` env entry from
# process env `TOOLPORT_SECRET_<K>` and sends it as `Authorization: Bearer`.
# The lookup is by KEY NAME ONLY, not by server id -- so each backend needs a
# distinct key, and nothing here may be named `__http_auth__`, which would
# apply to every server at once.
#
# homelable is absent on purpose: it authenticates with `X-API-Key`, and
# toolport can only send `Authorization: Bearer`. It stays on agent-tools.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-backends
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-backends
    creationPolicy: Owner
  data:
    - secretKey: TOOLPORT_SECRET_ARR_PLEX_TOKEN
      remoteRef:
        key: clusters/equestria/apps/arr-mcp-plex/bearer-token
        property: token
    - secretKey: TOOLPORT_SECRET_ARR_JELLYFIN_TOKEN
      remoteRef:
        key: clusters/equestria/apps/arr-mcp-jellyfin/bearer-token
        property: token
    - secretKey: TOOLPORT_SECRET_ECM_TOKEN
      remoteRef:
        key: clusters/equestria/apps/ecm/mcp-api-key
        property: password
    - secretKey: TOOLPORT_SECRET_HOME_ASSISTANT_TOKEN
      remoteRef:
        key: clusters/equestria/apps/home-assistant/eris-credentials
        property: apikey
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# toolport's registry, rendered by ESO. The template is ./resources/registry.json,
# which ships as the `${APP}-registry-template` ConfigMap (./kustomization.yaml).
# The ONLY templated values are `httpClients[].tokenSha256`, each written as
# the sprig `sha256sum` of the matching TOKEN_<PROFILE>. Everything else is
# literal JSON, so git stays the source of truth for servers and profiles, and
# only the hash of a token ever reaches toolport's config.
#
# WHY A SECOND ExternalSecret: the tokens above are CreatedOnce (a generator
# re-mints on every render), while this one must be Periodic so a git change to
# the template reaches the cluster. ESO allows one refresh policy per
# ExternalSecret, so this one reads the finished `${APP}` Secret back through
# the `agents` ClusterSecretStore -- a kubernetes-provider store scoped to this
# namespace (apps/kube-system/external-secrets/stores/kubernetes.yaml).
#
# ./helmrelease.yaml mounts the `registry.json` key via subPath into the
# /data emptyDir. The directory must be writable because toolport takes a
# `registry.json.lock` next to the file on every load. The file itself is
# never rewritten headless: the only save path is agent control, which is off.
# subPath mounts do not live-update, so Reloader restarts the pod when this
# Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: agents
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          configMap:
            name: ${APP}-registry-template
            items:
              - key: registry.json
                templateAs: Values
  dataFrom:
    - extract:
        key: ${APP}
