---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# The bearer door, for clients OFF the cluster: the repo's .mcp.json
# `toolport-<profile>` entries default here when TOOLPORT_URL is unset
# (agentboard sets it to the in-cluster Service and never comes this way).
#
# Not the same thing as ../toolport-mcp/httproute.yaml. That route fronts the
# OAuth vMCP and wants an authentik login; this one reaches the gateway itself,
# where the per-profile bearer token picks the profile, exactly as in-cluster.
#
# The internal gateway, whose `local-api` chain admits the LAN and the tailnet
# (100.64.0.0/10) -- so this answers on its ROOT_DOMAIN name over Tailscale and
# nowhere else. ./networkpolicy.yaml must admit Traefik for it to connect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "toolport.agents.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          port: 8765
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # `local-api`, not `local-user`: error-pages would rewrite the
            # JSON-RPC and 401 bodies MCP clients depend on.
            name: local-api
