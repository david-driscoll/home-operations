---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/networkpolicy-networking-k8s-io-v1.json
#
# Who may reach toolport at all: the six toolport-<profile> MCPRemoteProxies
# of ../toolport-mcp, and nothing else. Every client -- agentboard, the
# ws-david workspace, the OAuth doors -- now comes through one of those, which
# presents that profile's bearer on the caller's behalf. The bearer decides
# WHICH profile; this decides whether the connection is accepted. Plain http,
# no TLS -- confidentiality rests on this policy.
#
# There used to be a Traefik rule here for a LAN/tailnet bearer route
# (toolport.agents.<root domain>). It went when each profile got its own OAuth
# door; do not re-add it without a token story for off-cluster clients.
#
# Selecting the pod makes it deny-by-default for ingress, so any new client
# (monitoring included) has to be added here explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-allow-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ${APP}
      app.kubernetes.io/controller: ${APP}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ToolHive labels every proxy pod it runs this way.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [mcpremoteproxy]
              - key: toolhive-name
                operator: In
                values:
                  - toolport-postgres
                  - toolport-infrastructure
                  - toolport-networking
                  - toolport-home
                  - toolport-media
                  - toolport-research
      ports:
        - protocol: TCP
          port: 8765
