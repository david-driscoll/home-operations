---
# The `${APP}-registry` ExternalSecret (./externalsecret.yaml) reads the
# minted client tokens back out of the `${APP}` Secret, and needs a store to do
# that through. It is a NAMESPACED SecretStore rather than a ClusterSecretStore
# like apps/kube-system/external-secrets/stores/kubernetes.yaml's, so only
# ExternalSecrets in this namespace can use it, and it can reach exactly one
# Secret.
#
# A namespaced store may only authenticate as a ServiceAccount in its own
# namespace; ESO mints that account's token through the TokenRequest API. The
# Role grants `get` on the single `${APP}` Secret, which is all `dataFrom.extract`
# does (one GET in providers/v1/kubernetes/client.go at ESO v2.11.0). The
# store's own validation passes with a resourceNames-restricted `get`: its
# SelfSubjectRulesReview check matches the resource and verb only
# (validate.go), and every authenticated account may create that review
# through system:basic-user.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}-eso
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP}-eso
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["${APP}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP}-eso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP}-eso
subjects:
  - kind: ServiceAccount
    name: ${APP}-eso
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ${APP}-tokens
spec:
  provider:
    kubernetes:
      remoteNamespace: ${NAMESPACE}
      server:
        # Every namespace carries this ConfigMap; a namespaced store may not
        # point at another namespace's.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ${APP}-eso
