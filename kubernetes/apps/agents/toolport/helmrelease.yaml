---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          # Rolls the pod when the registry ConfigMap, the seed script, the
          # client-token Secret or the backend-token Secret changes. The
          # registry is only read at pod start (the initContainer copies it),
          # so without this a git change would sit unused until a reschedule.
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          securityContext:
            # The image's USER is the NAME `toolport` (useradd --uid 10001 in
            # upstream's Dockerfile); runAsNonRoot cannot verify a name, so
            # the uid has to be spelled out.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          seed-registry:
            image: &image
              repository: ghcr.io/btsouth/toolport-gateway
              tag: v1.20.0@sha256:7e3bb4f8b53fc10c12d81b77c90d4a07f123cd76a3be20ae45b7ecbb0b6c6d95
            command: ["/bin/sh", "/opt/toolport/seed-registry.sh"]
            envFrom:
              - secretRef:
                  name: ${APP}
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          *app :
            image: *image
            # No command/args: the image's ENTRYPOINT is already
            # `toolport-gateway --http 8765`. Use the flag, not TOOLPORT_HTTP --
            # the env form is ignored whenever stdin is a pipe.
            env:
              TOOLPORT_HTTP_HOST: 0.0.0.0
              TOOLPORT_REGISTRY: /data/registry.json
              TOOLPORT_DATA_DIR: /data
              HOME: /data
              # Four meta-tools (status / search / call / fetch_result) plus
              # run_script, instead of every backend's catalogue.
              TOOLPORT_DISCOVERY: lazy
              # Prometheus text at GET /metrics -- behind the same bearer as
              # everything else, so no ServiceMonitor until one carries a token.
              TOOLPORT_METRICS: "1"
            envFrom:
              # TOOLPORT_SECRET_KEY (and the client tokens, unused by the
              # gateway itself -- it only compares hashes from the registry).
              - secretRef:
                  name: ${APP}
              # TOOLPORT_SECRET_<KEY> bearer tokens for the backends toolport
              # calls directly. See ./externalsecret.yaml.
              - secretRef:
                  name: ${APP}-backends
            probes:
              # tcpSocket, not HTTP: every route, `/` included, sits behind the
              # bearer check and answers 401 to an anonymous probe.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8765
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext: *securityContext

    persistence:
      # The live registry, audit log, integrity pins and secrets.enc. An
      # emptyDir on purpose: git (./resources/registry.json) is the source of
      # truth and ./resources/seed-registry.sh re-seeds it every start, so
      # nothing here is worth a PVC or a backup.
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      registry:
        type: configMap
        name: ${APP}-registry
        advancedMounts:
          *app :
            seed-registry:
              - path: /config
                readOnly: true
      seed:
        type: configMap
        name: ${APP}-seed
        defaultMode: 0555
        advancedMounts:
          *app :
            seed-registry:
              - path: /opt/toolport
                readOnly: true

    service:
      *app :
        controller: *app
        ports:
          http:
            port: 8765
