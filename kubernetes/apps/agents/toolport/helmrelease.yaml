---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          # Rolls the pod when the rendered registry Secret, the client-token
          # Secret or the backend-token Secret changes. The registry is a
          # subPath mount, which never live-updates, so without this a git
          # change would sit unused until a reschedule.
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          securityContext:
            # The image's USER is the NAME `toolport` (useradd --uid 10001 in
            # upstream's Dockerfile); runAsNonRoot cannot verify a name, so
            # the uid has to be spelled out.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
        containers:
          *app :
            image:
              repository: ghcr.io/btsouth/toolport-gateway
              tag: v1.23.5@sha256:f5cc8219d9b1e4b508da492b97bbbc9cbf8195245d94e61acdc5e54c3b0b9dd0
            # No command/args: the image's ENTRYPOINT is already
            # `toolport-gateway --http 8765`. Use the flag, not TOOLPORT_HTTP --
            # the env form is ignored whenever stdin is a pipe.
            env:
              TOOLPORT_HTTP_HOST: 0.0.0.0
              TOOLPORT_REGISTRY: /data/registry.json
              TOOLPORT_DATA_DIR: /data
              HOME: /data
              # Four meta-tools (status / search / call / fetch_result) plus
              # run_script, instead of every backend's catalogue.
              TOOLPORT_DISCOVERY: lazy
              # Prometheus text at GET /metrics -- behind the same bearer as
              # everything else, so no ServiceMonitor until one carries a token.
              TOOLPORT_METRICS: "1"
              # Switches secret lookups to the file backend; see
              # ./externalsecret.yaml. Only this key: the gateway never needs
              # the plaintext client tokens, just their hashes in the registry.
              TOOLPORT_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOOLPORT_SECRET_KEY
            envFrom:
              # TOOLPORT_SECRET_<KEY> bearer tokens for the backends toolport
              # calls directly. See ./externalsecret.yaml.
              - secretRef:
                  name: ${APP}-backends
            probes:
              # LIVENESS ASKS THE WATCHDOG SIDECAR, not toolport. toolport never
              # re-initializes a backend session the backend has forgotten
              # (see the watchdog container below), and nothing it serves
              # anonymously can show that -- every route sits behind the bearer
              # check, and toolport_status reads only its own cache. The
              # watchdog calls a canary on every backend through toolport and
              # answers 503 here only for what a restart fixes: a stale
              # session, a backend that failed at startup and is up now, or
              # toolport not accepting connections for 5 minutes. A backend
              # that is merely down is not one of those.
              #
              # 3 x 60s is under the watchdog's 240s fail window, and the 120s
              # initial delay outlasts what is left of that window after the
              # restart, so one verdict costs exactly one restart.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8766
                  initialDelaySeconds: 120
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 3
              # tcpSocket, not HTTP: every route, `/` included, sits behind the
              # bearer check and answers 401 to an anonymous probe.
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8765
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  failureThreshold: 5
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

          # SESSION WATCHDOG. toolport keeps one MCP session per backend and,
          # when a backend answers `404 Session not found`, never
          # re-initializes: every later call to that backend fails until
          # toolport restarts (btsouth/toolport downstream.rs -- the 404 is a
          # Fatal transport error, not a health failure, so its reconnect path
          # never runs). ToolHive proxies forget sessions after 2h idle, and on
          # restart unless ../toolhive-operator's defaultRedis is set; the
          # github, pulumi, openbao and tailscale backends restart every
          # 20-60 minutes by design, as their short-lived tokens rotate.
          #
          # Every 10 minutes ./resources/watchdog.mjs calls one read-only canary
          # per backend THROUGH toolport (./resources/watchdog-canaries.json),
          # as the profile that owns it. That keeps every session warm, and
          # finds the states only a restart fixes, which it reports on
          # :8766/healthz -- toolport's liveness probe above. One restart per
          # 30 minutes at most.
          #
          # Talks to toolport on localhost, so it needs no NetworkPolicy
          # change, and reads the same registry toolport does. It needs each
          # profile's plaintext client token, which toolport itself never
          # holds (it only has their hashes).
          watchdog:
            image:
              # The same pin as agent-tools-servers/tdarr.yaml's MCPServer.
              repository: oven/bun
              tag: 1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
            command: ["bun", "/watchdog/watchdog.mjs"]
            env:
              HOME: /tmp
              REGISTRY_PATH: /data/registry.json
              CANARIES_PATH: /watchdog/canaries.json
              TOKEN_POSTGRES:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOKEN_POSTGRES
              TOKEN_INFRASTRUCTURE:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOKEN_INFRASTRUCTURE
              TOKEN_NETWORKING:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOKEN_NETWORKING
              TOKEN_HOME:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOKEN_HOME
              TOKEN_MEDIA:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOKEN_MEDIA
              TOKEN_RESEARCH:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: TOKEN_RESEARCH
            probes:
              # Only whether the watchdog itself is serving: its verdict about
              # toolport is toolport's probe, not this one.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8766
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    persistence:
      # The audit log, integrity pins, secrets.enc and the registry lock. An
      # emptyDir on purpose: the registry comes from git by way of ESO, and
      # nothing toolport writes here is worth a PVC or a backup.
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # The ESO-rendered registry (`${APP}-registry`, ./externalsecret.yaml),
      # mounted as a single FILE inside the writable /data emptyDir rather
      # than as its own directory. toolport creates `registry.json.lock` next
      # to the registry on every load, so the directory must be writable;
      # nothing rewrites the file itself.
      registry:
        type: secret
        name: ${APP}-registry
        globalMounts:
          - path: /data/registry.json
            subPath: registry.json
            readOnly: true
      # The watchdog's script and canaries (./kustomization.yaml); the
      # registry it reads is the /data/registry.json mount above, which is
      # global and so reaches the sidecar too.
      watchdog:
        type: configMap
        name: toolport-watchdog
        advancedMounts:
          *app :
            watchdog:
              - path: /watchdog
                readOnly: true

    service:
      *app :
        controller: *app
        ports:
          http:
            port: 8765
