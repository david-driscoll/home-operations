---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Sources from ./vaultdynamicsecret.yaml's Generator, not a plain OpenBao
# path -- see that file's header. `refreshInterval` here is what actually
# keeps OPENBAO_TOKEN alive: the generator mints a 1h token
# (./vaultdynamicsecret.yaml's `ttl: 1h`), so this refreshes well inside
# that window and `reloader.stakater.com/auto` rolls the pod on each
# change, same mechanism every other reloader-annotated Secret in this
# rollout already relies on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshPolicy: Periodic
  refreshInterval: 20m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        OPENBAO_URL: http://openbao-active.kube-system.svc.cluster.local:8200
        OPENBAO_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: ${APP}
      rewrite:
        - regexp:
            source: "^client_token$"
            target: token
