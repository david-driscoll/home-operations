---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./definition.yaml
configMapGenerator:
  - name: ${APP}-ssh
    files:
      - forgejo.conf=./resources/ssh_config
      - known_hosts=./resources/known_hosts
    options:
      disableNameSuffixHash: true
