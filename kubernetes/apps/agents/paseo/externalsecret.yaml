---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/password_v1alpha1.json
#
# PASEO_PASSWORD guards the daemon's API and WebSocket -- the web UI's static
# files are public on the same origin, the control plane is not. Generated
# in-cluster rather than seeded into OpenBao: nothing else needs it, and losing
# it costs nothing but re-entering the new one in each client.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-password
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING. The generator mints a new
# value on every call; `Periodic` would rotate the password on a schedule and
# disconnect every client each time. Read it with:
#
#   kubectl -n agents get secret paseo -o jsonpath='{.data.PASEO_PASSWORD}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PASEO_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# SSH key for the Forgejo `claude-code` account -- the same key agentboard
# reads (../agentboard/externalsecret.yaml). stacks/system writes it to
# OpenBao; mounted `optional` in ./helmrelease.yaml so the pod still starts if
# it is ever missing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-forgejo-ssh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-forgejo-ssh
    creationPolicy: Owner
    template:
      data:
        id_ed25519: "{{ .ssh_private_key }}"
        id_ed25519.pub: "{{ .ssh_public_key }}"
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: clusters/equestria/apps/forgejo/claude-code
        property: ssh_private_key
    - secretKey: ssh_public_key
      remoteRef:
        key: clusters/equestria/apps/forgejo/claude-code
        property: ssh_public_key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/sshkey_v1alpha1.json
#
# The SSH key paseo signs commits with. Minted in-cluster, like the password
# above: nothing outside this pod uses the private half. The public half is a
# Signing Key on David's GitHub account (Settings -> SSH and GPG keys -> Key
# type "Signing Key"), added by hand -- the estate's GitHub App cannot add
# keys to a user. Read it with:
#
#   kubectl -n agents get secret paseo-commit-signing -o jsonpath='{.data.id_ed25519\.pub}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: ${APP}-commit-signing
spec:
  keyType: ed25519
  comment: paseo commit signing
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The signing key, plus the git config that turns signing on.
#
# ⚠️ `refreshPolicy: CreatedOnce` IS LOAD-BEARING, as for the password above:
# every generator call mints a NEW key, and a key GitHub does not know signs
# commits that show as Unverified. `deletionPolicy: Retain` keeps the Secret
# if this ExternalSecret is ever deleted. If the Secret itself is lost, the
# next sync mints a new key; swap it on GitHub. Commits already verified stay
# Verified, since GitHub records the verification when it sees the commit.
#
# The config rides in this Secret, pulled in by `include.path` in
# ./helmrelease.yaml, so signing is on exactly when the key is there: git
# skips an include whose file is missing, where a `commit.gpgsign` set in the
# environment would fail every commit on a pod that started keyless.
#
# No `tag.gpgsign`: it turns every `git tag <name>` into an annotated tag that
# opens an editor.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-commit-signing
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: ${APP}-commit-signing
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        id_ed25519: "{{ .privateKey }}"
        id_ed25519.pub: "{{ .publicKey }}"
        # Lets `git log --show-signature` check paseo's own commits locally.
        allowed_signers: |
          ${OWNER_EMAIL} namespaces="git" {{ .publicKey | trim }}
        gitconfig: |
          [gpg]
            format = ssh
          [gpg "ssh"]
            allowedSignersFile = /var/run/secrets/commit-signing/allowed_signers
          [user]
            signingkey = /var/run/secrets/commit-signing/id_ed25519
          [commit]
            gpgsign = true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: ${APP}-commit-signing
