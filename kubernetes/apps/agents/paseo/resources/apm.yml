# Paseo's user-scope agent skills, instructions and MCP servers.
#
# ./install-tools.sh copies this to ~/.apm/apm.yml and runs `apm install -g`
# on each start, so anything added here lands on the next rollout and anything
# already on the home volume is refreshed to its latest upstream ref. Distinct
# from the repo-root apm.yml, which is project scope for home-operations.
name: paseo
version: 1.0.0
description: User-scope agent packages for the paseo pod
# NOT `codex`: apm 0.34.0's Codex integration crashes on microsoft/azure-skills
# ("Object of type mappingproxy is not JSON serializable"), and one failed
# package rolls back the whole install. `agent-skills` writes ~/.agents/skills,
# which Codex reads natively, so it still gets every skill -- just not the
# instructions, agents, hooks or MCP servers.
targets:
  - claude
  - agent-skills
dependencies:
  apm:
    - github/awesome-copilot/skills/acquire-codebase-knowledge
    - github/awesome-copilot/skills/lsp-setup
    - github/awesome-copilot/instructions/agents.instructions.md
    - github/awesome-copilot/instructions/context-engineering.instructions.md
