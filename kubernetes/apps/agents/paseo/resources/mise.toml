# Paseo's agent tooling. Renovate's mise manager bumps this file.
#
# Installed by ./install-tools.sh (the `tools` init container) onto the home
# volume and reached through the mise shims on PATH. The shims come AFTER the
# system dirs there (../helmrelease.yaml), so the image's own node -- the one
# the daemon and its native modules were built against -- still runs Paseo;
# `node` below is for the `npm:` tools.
[tools]
node = "24.22.1"
python = "3.15.0"
gh = "2.102.0"
kubectl = "1.37.1"
pulumi = "3.270.0"
jq = "1.8.2"
yq = "4.54.1"
sops = "3.13.3"
age = "1.3.2"
bun = "1.4.3"
# uv is what mise's pipx backend installs `pipx:` tools with.
uv = "0.13.3"
# APM, from PyPI rather than the repo's `github:microsoft/apm`: that release
# binary needs glibc 2.38 and this image is bookworm (2.36). Installs
# ./apm.yml at user scope -- see ./apm-refresh.sh.
"pipx:apm-cli" = "0.34.0"
"npm:@anthropic-ai/claude-code" = { version = "2.1.306", allow_builds = true }
"npm:@openai/codex" = "0.163.0"

[settings]
experimental = true
# /workspace too: agents run inside clones that carry their own mise configs
# (home-operations' .config/mise.toml), and an untrusted one is skipped
# silently, which looks exactly like a missing tool.
trusted_config_paths = ["/home", "/workspace"]

[settings.npm]
shell_out = true
