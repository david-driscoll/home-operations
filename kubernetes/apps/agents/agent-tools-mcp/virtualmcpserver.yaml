---
# No `yaml-language-server: $schema=` line -- see ../agent-tools-servers/docs.yaml.
#
# ONE endpoint aggregating every backend in ./mcpgroup.yaml's MCPGroup
# (currently ../agent-tools-servers/{kubernetes,pulumi,unifi-network,unifi-protect,unifi-access}.yaml),
# rather than one hostname/HTTPRoute/MCPOIDCConfig per backend. An earlier
# draft of this rollout gave each server its own -- reversed once it was
# clear ToolHive's own VirtualMCPServer CRD (toolhive-operator-crds 0.46.0,
# verified live against this cluster: `mcpgroups.toolhive.stacklok.dev` and
# `virtualmcpservers.toolhive.stacklok.dev` both exist) solves exactly this,
# and is what Stacklok's own docs recommend once you're managing "5+" MCP
# servers, which this namespace now is.
#
# Field shapes below are verified against the LIVE CRD schema
# (kubectl get crd virtualmcpservers.toolhive.stacklok.dev -o json), not
# assumed from documentation -- the summarized docs consulted while
# designing this were wrong about at least one adjacent field shape
# elsewhere in this rollout (see ../agentboard/resources/mise.lock's header
# for that story), so this one was checked directly.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: agent-tools
spec:
  groupRef:
    name: agent-tools

  # incomingAuth.oidcConfigRef has the EXACT SAME shape
  # (name/audience/resourceUrl/scopes) individual MCPServers' oidcConfigRef
  # already used -- so this reuses ../toolhive's existing embedded auth
  # server (MCPExternalAuthConfig `toolhive`) and its MCPOIDCConfig `toolhive`
  # directly. No second auth server (spec.authServerConfig, which would
  # stand up an INDEPENDENT embedded OIDC issuer) is needed or wanted here.
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: toolhive
      # Own hostname -> own audience, same rule every individual MCPServer
      # in this namespace already follows.
      audience: https://agent-tools-mcp.agents.${ROOT_DOMAIN}/mcp
      resourceUrl: https://agent-tools-mcp.agents.${ROOT_DOMAIN}/mcp

  # Backends carry no oidcConfigRef/authServerRef of their own any more (see
  # each's mcpserver.yaml) -- there is nothing for vMCP to discover or
  # authenticate against on the way out, only cluster-internal
  # Streamable-HTTP/stdio-proxy traffic to Services this route never exposes
  # externally.
  outgoingAuth:
    source: inline

  serviceType: ClusterIP

  # NO trustProxyHeaders -- unlike the individual MCPServer's own field
  # (../toolhive/mcpserver.yaml's, for why it exists at all), VirtualMCPServer
  # has no field by this name or any other spelling in its live schema
  # (checked: nothing matching /proxy|trust|header/i except
  # `passthroughHeaders`, a different concept -- which incoming headers get
  # forwarded to backends, not how this server reports its own scheme/host
  # in URLs it hands back). Possibly vMCP always honours X-Forwarded-* the
  # way individual MCPServers only do when told to; possibly it just isn't
  # exposed as a field yet. Verify the OAuth discovery documents at
  # https://agent-tools-mcp.agents.${ROOT_DOMAIN}/.well-known/oauth-authorization-server
  # actually advertise https:// URLs once this reconciles, before trusting it.
  config:
    aggregation:
      # Default, made explicit: kubernetes/pulumi/unifi-* tool names don't
      # collide today, but a workload-prefixed name is a cheap guarantee
      # against a future one doing so silently.
      conflictResolution: prefix
