---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./mcpgroup.yaml
  # Ahead of ./virtualmcpserver.yaml, which references it by name. Kustomize
  # does not order the apply, but keeping the accepting side first matches how
  # ../toolhive lists its own.
  - ./mcpoidcconfig.yaml
  - ./virtualmcpserver.yaml
  # The anonymous in-cluster twin, and the policy that contains it. Keep the
  # two adjacent: ./networkpolicy.yaml is the only thing keeping
  # ./virtualmcpserver-internal.yaml from being reachable cluster-wide, and
  # dropping it from this list is silent.
  - ./virtualmcpserver-internal.yaml
  - ./networkpolicy.yaml
  - ./httproute.yaml
  - ./definition.yaml
