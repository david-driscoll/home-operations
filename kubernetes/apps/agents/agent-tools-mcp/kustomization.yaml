apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # All that is left of agent-tools. Its two VirtualMCPServers (the OAuth door
  # at agent-tools-mcp.agents.<root domain> and the anonymous in-cluster twin)
  # were retired in favour of toolport (../toolport, ../toolport-mcp). The
  # MCPGroup stays because every backend in ../agent-tools-servers names it in
  # `groupRef`, and toolport calls those same backends.
  - ./mcpgroup.yaml
