---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Reuses the SAME Proxmox API token this cluster's own `ProxmoxHost` Pulumi
# component already uses for luna (components/ProxmoxHost.ts:123,
# `apiToken: interpolate\`${username}=${credential}\``) -- no new token
# minted. That interpolation proves the stored `username` field is the FULL
# token id `USER@REALM!TOKENID`, not just the user -- ProxmoxMCP-Plus wants
# `PROXMOX_USER` (`USER@REALM`) and `PROXMOX_TOKEN_NAME` (`TOKENID`) as
# SEPARATE fields, so this splits `username` on `!` via Sprig's `splitn`
# (engineVersion: v2, precedent: kubernetes/apps/garage-system/cluster/externalsecret.yaml).
# NOT live-verified that `splitn` behaves as expected against this cluster's
# actual ESO build -- check the rendered Secret (`kubectl -n agents get secret
# ${APP} -o jsonpath='{.data.PROXMOX_USER}' | base64 -d`) once this reconciles.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        PROXMOX_USER: '{{ (.username | splitn "!" 2)._0 }}'
        PROXMOX_TOKEN_NAME: '{{ (.username | splitn "!" 2)._1 }}'
        PROXMOX_TOKEN_VALUE: "{{ .credential }}"
  data:
    - secretKey: username
      remoteRef:
        key: apps/proxmox/api-key
        property: username
    - secretKey: credential
      remoteRef:
        key: apps/proxmox/api-key
        property: credential
