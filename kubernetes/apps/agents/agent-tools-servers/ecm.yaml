---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ECM's MCP client key. Human-minted, NOT generated here: ECM creates the key
# itself and never displays or logs the value, so the only way to learn it is
# to issue a new one from the UI. To (re)seed it:
#
#   1. Sign in to https://ecm.<root domain> as an ECM admin ->
#      Settings -> MCP Integration -> Regenerate Key. Copy the key it shows.
#      This is ECM's MCP key, NOT the Dispatcharr API key.
#   2. bao kv put secrets/clusters/equestria/apps/ecm/mcp-api-key \
#        password="<the key>"
#
# Any Regenerate or Revoke in the ECM UI invalidates the seeded copy
# immediately -- every ECM tool call is a 401 until step 2 is repeated. A
# restart does not: the key lives on ECM's config claim (the `mcp-secrets`
# subPath), not in an emptyDir.
#
# Deleting that OpenBao item is not a soft failure either. ./ks.yaml carries
# `wait: true`, so an MCPRemoteProxy whose Secret cannot resolve blocks every
# server here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-ecm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-ecm
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The WHOLE header value, prefix included -- see the auth config below.
        authorization: "Bearer {{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: clusters/equestria/apps/ecm/mcp-api-key
        property: password

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# `headerInjection` carrying a literal `Authorization: Bearer <key>`, NOT
# `type: bearerToken`: ToolHive 0.51.1's vMCP has no bearerToken converter and
# silently drops such a backend from agent-tools. See ./arr-mcp.yaml's auth
# config for the full account.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: ecm
spec:
  type: headerInjection
  headerInjection:
    headerName: Authorization
    valueSecretRef:
      name: toolhive-ecm
      key: authorization

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# `MCPRemoteProxy` -- see ./microsoft-docs.yaml's header for what that CRD is.
# ECM's MCP server is a sidecar in ECM's own pod (it shares a credential
# directory with the backend), so ToolHive only fronts it.
#
# In-cluster Service on the sidecar's port, plain HTTP. The sidecar's
# DNS-rebinding guard only accepts Host headers on its allowlist; the proxy
# rewrites Host to this URL's host, which is why the HelmRelease sets
# MCP_ALLOWED_HOSTS to exactly `ecm.equestria.svc.cluster.local`. Change one,
# change the other -- a mismatch is a 421 on every call.
#
# `allowPrivateEndpoint` is REQUIRED for a `cluster.local` host -- see
# ./homelable.yaml.
#
# EXPECTED TO BE UNREACHABLE 02:00-09:00: ECM sheds nightly with the rest of
# `equestria` (docs/cluster-consolidation/24-power-states.md), exactly like
# ./arr-mcp.yaml's backends.
#
# `metadata.name` is the tool-name prefix: clients see
# `mcp__agent-tools__toolhive-ecm_<tool>`.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: toolhive-ecm
spec:
  remoteUrl: http://ecm.equestria.svc.cluster.local:6101/mcp
  allowPrivateEndpoint: true
  transport: streamable-http
  groupRef:
    name: agent-tools
  externalAuthConfigRef:
    name: ecm

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
