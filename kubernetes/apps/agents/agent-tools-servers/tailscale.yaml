---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp,
# @hexsleeves/tailscale-mcp-server on npm) authenticates with a STATIC
# `TAILSCALE_API_KEY` -- confirmed live via its own README, which documents
# no OAuth-client-credentials support at all.
#
# That is NOT the credential this estate already has. The one Tailscale
# credential in OpenBao today (third-party-tokens/tailscale/pulumi-oauth,
# used by components/tailscale.ts against
# https://api.tailscale.com/api/v2/oauth/token) is an OAuth CLIENT
# ID/SECRET pair, a materially different credential type from a
# `tskey-api-...` API key -- Tailscale has no API to self-mint the latter
# (that would be circular), it has to be created once by hand in the
# admin console (Settings -> Keys -> Generate API access token).
#
#   bao kv put secrets/third-party-tokens/tailscale/api-key key="tskey-api-..."
#
# Same "input, not output, created once by hand" idiom as
# ../agentboard/externalsecret.yaml's anthropic_key. Flagged the same way
# ./home-assistant.yaml flags its own outgoing-auth
# gap -- this server has NO working credential until that manual step runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-tailscale
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-tailscale
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TAILSCALE_API_KEY: "{{ .api_key }}"
        # ${ROOT_DOMAIN} is this estate's Tailscale tailnet name, per its
        # use throughout components/tailscale.ts -- not independently
        # re-verified against Tailscale's own admin console for this file.
        TAILSCALE_TAILNET: ${ROOT_DOMAIN}
  data:
    - secretKey: api_key
      remoteRef:
        key: third-party-tokens/tailscale/api-key
        property: key

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp) -- list/manage
# tailnet devices, ACLs, routes. npm package
# `@hexsleeves/tailscale-mcp-server`, run via `npx`, same shape as
# ./context7.yaml (stock `node` image, no custom
# Dockerfile). Docker images also exist
# (hexsleeves/tailscale-mcp-server, ghcr.io/hexsleeves/tailscale-mcp-server)
# but npx-on-node matches this rollout's existing convention for npm-native
# MCP packages better than pulling a second, less-established image.
#
# See ./externalsecret.yaml's header: TAILSCALE_API_KEY has NO working value
# until a credential is created by hand and put into OpenBao. This server
# will not authenticate against Tailscale's API until that manual step runs.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-tailscale
spec:
  image: node:22-alpine
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@hexsleeves/tailscale-mcp-server"]
          envFrom:
            - secretRef:
                name: toolhive-tailscale
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
