---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp,
# @hexsleeves/tailscale-mcp-server on npm) authenticates with an OAuth
# client: since 1.3.x it takes TAILSCALE_OAUTH_CLIENT_ID/_SECRET, exchanges
# them at /api/v2/oauth/token itself, and re-mints the access token a
# minute before it expires.
#
# It used to read a TAILSCALE_API_KEY that stacks/unifi-network minted
# every 5 minutes (third-party-tokens/tailscale/api-key, ~1h lifetime).
# That tied this server to the health of an unrelated stack: on 2026-11-09
# unifi-network stalled on a GitHub outage, the token expired an hour later,
# and every API call failed. The failure surfaced only as the CLI fallback's
# "spawn tailscale ENOENT" (see TAILSCALE_TAILNET below).
#
# The credential is the same OAuth client unifi-network minted from
# (third-party-tokens/tailscale/pulumi-oauth, also read by
# ../../database/network-map/externalsecret.yaml), so its reach is
# unchanged. The server's own TAILSCALE_ALLOWED_TOOL_RISK default ("read")
# still gates its write tools. The api-key path keeps being minted for
# ../../coder/setup-status.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-tailscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: toolhive-tailscale
    creationPolicy: Owner
    template:
      data:
        TAILSCALE_OAUTH_CLIENT_ID: "{{ .client_id }}"
        TAILSCALE_OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
        # "-" is Tailscale's alias for "the default tailnet of whatever
        # credential is presenting", NOT a placeholder left unfilled.
        #
        # THIS WAS THE ROOT_DOMAIN SUBSTITUTION, AND THAT IS WHAT BROKE THIS
        # SERVER. That value carried its own disclaimer -- "not independently
        # re-verified against Tailscale's own admin console" -- and it did not
        # survive the check. Confirmed live 2026-09-05: every API-backed
        # call came back empty or failed, `get_tailnet_info` returned no
        # name and no organization, and `list_devices` surfaced
        # "Failed to execute tailscale: spawn tailscale ENOENT".
        #
        # THAT ENOENT IS NOT THE BUG, and it is worth saying so because it is
        # the only part that is visible. Reading the published package
        # (@hexsleeves/tailscale-mcp-server 1.3.4, dist/index.js): its
        # `listDevices` calls the REST API FIRST and only shells out to the
        # `tailscale` binary when that call fails --
        #
        #   let t = await this.api.listDevices(...);
        #   if (t.success) return ...
        #   this.logger.warn("API device listing failed; trying CLI", t.error);
        #
        # -- so the missing CLI on node:22-alpine is the FALLBACK failing, and
        # its message replaces the API error that actually mattered. Anyone
        # reading only the tool output concludes the image needs a Tailscale
        # binary. It does not; `get_version` reports `cliAvailable: false`
        # and is perfectly happy.
        #
        # "-" is what this estate's own working Tailscale code already uses
        # against the SAME endpoint this server calls --
        # stacks/unifi-network/tailscale-drop-firewall-rule.ts does
        # `client.GET("/tailnet/{tailnet}/devices", { path: { tailnet: "-" } })`
        # -- against a credential minted from the same OAuth client. Taking
        # the estate's proven value over a second, unverified guess at the
        # literal name.
        TAILSCALE_TAILNET: "-"
  data:
    - secretKey: client_id
      remoteRef:
        key: third-party-tokens/tailscale/pulumi-oauth
        property: username
    - secretKey: client_secret
      remoteRef:
        key: third-party-tokens/tailscale/pulumi-oauth
        property: credential

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp) -- list/manage
# tailnet devices, ACLs, routes. npm package
# `@hexsleeves/tailscale-mcp-server`, run via `npx`, same shape as
# ./context7.yaml (stock `node` image, no custom
# Dockerfile). Docker images also exist
# (hexsleeves/tailscale-mcp-server, ghcr.io/hexsleeves/tailscale-mcp-server)
# but npx-on-node matches this rollout's existing convention for npm-native
# MCP packages better than pulling a second, less-established image.
#
# See this file's own ExternalSecret header (above): the server reads the
# OAuth client and mints its own tokens; no manual step required.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-tailscale
spec:
  image: node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      # Same npm-cache fix as ./context7.yaml's own header explains --
      # confirmed live, this one fails the exact same way (ENOENT: mkdir
      # '/home/node/.npm') without it.
      volumes:
        - name: npm-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@hexsleeves/tailscale-mcp-server"]
          envFrom:
            - secretRef:
                name: toolhive-tailscale
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: npm-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
