---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp,
# @hexsleeves/tailscale-mcp-server on npm) authenticates with a STATIC-
# looking `TAILSCALE_API_KEY` -- confirmed live via its own README, which
# documents no OAuth-client-credentials support of its own.
#
# No manual step: stacks/unifi-network/tailscale-api-token.ts mints one
# automatically, every run of that stack (every 5 minutes --
# kubernetes/apps/pulumi/unifi-network/stack.yaml's
# resyncFrequencySeconds), by exchanging this estate's existing Tailscale
# OAuth client credential (third-party-tokens/tailscale/pulumi-oauth) for a
# short-lived access token and writing it to THIS path
# (third-party-tokens/tailscale/api-key). Tailscale's REST API accepts an
# OAuth-exchanged access token as a Bearer credential exactly like a
# `tskey-api-...` key, so the swap is transparent to this MCP server --
# see that file's header for why it lives in stacks/unifi-network
# specifically (its 5-minute cadence is what keeps this inside the
# token's ~1h lifetime; stacks/vault's 30 min and stacks/system's 24h
# were both considered and rejected).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-tailscale
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-tailscale
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TAILSCALE_API_KEY: "{{ .api_key }}"
        # "-" is Tailscale's alias for "the default tailnet of whatever
        # credential is presenting", NOT a placeholder left unfilled.
        #
        # THIS WAS THE ROOT_DOMAIN SUBSTITUTION, AND THAT IS WHAT BROKE THIS
        # SERVER. That value carried its own disclaimer -- "not independently
        # re-verified against Tailscale's own admin console" -- and it did not
        # survive the check. Confirmed live 2026-09-05: every API-backed
        # call came back empty or failed, `get_tailnet_info` returned no
        # name and no organization, and `list_devices` surfaced
        # "Failed to execute tailscale: spawn tailscale ENOENT".
        #
        # THAT ENOENT IS NOT THE BUG, and it is worth saying so because it is
        # the only part that is visible. Reading the published package
        # (@hexsleeves/tailscale-mcp-server 1.3.4, dist/index.js): its
        # `listDevices` calls the REST API FIRST and only shells out to the
        # `tailscale` binary when that call fails --
        #
        #   let t = await this.api.listDevices(...);
        #   if (t.success) return ...
        #   this.logger.warn("API device listing failed; trying CLI", t.error);
        #
        # -- so the missing CLI on node:22-alpine is the FALLBACK failing, and
        # its message replaces the API error that actually mattered. Anyone
        # reading only the tool output concludes the image needs a Tailscale
        # binary. It does not; `get_version` reports `cliAvailable: false`
        # and is perfectly happy.
        #
        # "-" is what this estate's own working Tailscale code already uses
        # against the SAME endpoint this server calls --
        # stacks/unifi-network/tailscale-drop-firewall-rule.ts does
        # `client.GET("/tailnet/{tailnet}/devices", { path: { tailnet: "-" } })`
        # -- against a credential minted from the same OAuth client. Taking
        # the estate's proven value over a second, unverified guess at the
        # literal name.
        TAILSCALE_TAILNET: "-"
  data:
    - secretKey: api_key
      remoteRef:
        key: third-party-tokens/tailscale/api-key
        property: key

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp) -- list/manage
# tailnet devices, ACLs, routes. npm package
# `@hexsleeves/tailscale-mcp-server`, run via `npx`, same shape as
# ./context7.yaml (stock `node` image, no custom
# Dockerfile). Docker images also exist
# (hexsleeves/tailscale-mcp-server, ghcr.io/hexsleeves/tailscale-mcp-server)
# but npx-on-node matches this rollout's existing convention for npm-native
# MCP packages better than pulling a second, less-established image.
#
# See this file's own ExternalSecret header (above): TAILSCALE_API_KEY is
# auto-minted by stacks/unifi-network/tailscale-api-token.ts, no manual
# step required.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-tailscale
spec:
  image: node:22-alpine
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    spec:
      # Same npm-cache fix as ./context7.yaml's own header explains --
      # confirmed live, this one fails the exact same way (ENOENT: mkdir
      # '/home/node/.npm') without it.
      volumes:
        - name: npm-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@hexsleeves/tailscale-mcp-server"]
          envFrom:
            - secretRef:
                name: toolhive-tailscale
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: npm-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
