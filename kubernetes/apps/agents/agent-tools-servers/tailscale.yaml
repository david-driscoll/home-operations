---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp,
# @hexsleeves/tailscale-mcp-server on npm) authenticates with a STATIC-
# looking `TAILSCALE_API_KEY` -- confirmed live via its own README, which
# documents no OAuth-client-credentials support of its own.
#
# No manual step: stacks/unifi-network/tailscale-api-token.ts mints one
# automatically, every run of that stack (every 5 minutes --
# kubernetes/apps/pulumi/unifi-network/stack.yaml's
# resyncFrequencySeconds), by exchanging this estate's existing Tailscale
# OAuth client credential (third-party-tokens/tailscale/pulumi-oauth) for a
# short-lived access token and writing it to THIS path
# (third-party-tokens/tailscale/api-key). Tailscale's REST API accepts an
# OAuth-exchanged access token as a Bearer credential exactly like a
# `tskey-api-...` key, so the swap is transparent to this MCP server --
# see that file's header for why it lives in stacks/unifi-network
# specifically (its 5-minute cadence is what keeps this inside the
# token's ~1h lifetime; stacks/vault's 30 min and stacks/system's 24h
# were both considered and rejected).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-tailscale
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-tailscale
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TAILSCALE_API_KEY: "{{ .api_key }}"
        # ${ROOT_DOMAIN} is this estate's Tailscale tailnet name, per its
        # use throughout components/tailscale.ts -- not independently
        # re-verified against Tailscale's own admin console for this file.
        TAILSCALE_TAILNET: ${ROOT_DOMAIN}
  data:
    - secretKey: api_key
      remoteRef:
        key: third-party-tokens/tailscale/api-key
        property: key

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp) -- list/manage
# tailnet devices, ACLs, routes. npm package
# `@hexsleeves/tailscale-mcp-server`, run via `npx`, same shape as
# ./context7.yaml (stock `node` image, no custom
# Dockerfile). Docker images also exist
# (hexsleeves/tailscale-mcp-server, ghcr.io/hexsleeves/tailscale-mcp-server)
# but npx-on-node matches this rollout's existing convention for npm-native
# MCP packages better than pulling a second, less-established image.
#
# See this file's own ExternalSecret header (above): TAILSCALE_API_KEY is
# auto-minted by stacks/unifi-network/tailscale-api-token.ts, no manual
# step required.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-tailscale
spec:
  image: node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    spec:
      # Same npm-cache fix as ./context7.yaml's own header explains --
      # confirmed live, this one fails the exact same way (ENOENT: mkdir
      # '/home/node/.npm') without it.
      volumes:
        - name: npm-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@hexsleeves/tailscale-mcp-server"]
          envFrom:
            - secretRef:
                name: toolhive-tailscale
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: npm-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
