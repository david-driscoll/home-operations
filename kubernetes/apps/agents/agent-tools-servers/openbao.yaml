---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# openbao-mcp (knuckles-team.github.io/openbao-mcp,
# github.com/Knuckles-Team/openbao-mcp) -- typed OpenBao secrets/system/
# auth/ssh tools. Image confirmed live via web search of the project's own
# docs: `knucklessg1/openbao-mcp:mcp` is the slim MCP-only image (`:latest`
# bundles a Pydantic-AI agent and epistemic-graph engine this rollout has
# no use for). Pinned to the digest `:mcp` pointed at on 2026-09-25 -- the
# newest MCP image upstream has published (2026-07-09, openbao-mcp 1.0.1,
# fastmcp 3.4.4, mcp 1.28.1) and the one the transport below was verified on.
#
# WHY streamable-http AND NOT stdio. Under stdio this server answered every
# request from both aggregators with -32602 "Invalid request parameters"
# (toolport: `'openbao' failed`; vMCP: `Backend unavailable`) while its
# MCPServer sat Ready. The backend's own log names the cause: `Failed to
# validate request: Received request before initialization was complete`.
# Three things combine to produce it:
#   1. ToolHive's stdio proxy fans every client onto ONE backend session, so
#      it forwards `initialize` to the backend once and answers every later
#      handshake from a cache (toolhive v0.51.2,
#      pkg/transport/proxy/streamable/initialize_cache.go). That cache is
#      never reset -- not even when the proxy re-attaches to a NEW backend
#      process after the container restarts (pkg/transport/stdio.go,
#      attemptReattachment).
#   2. This backend restarts every 20 minutes: each ExternalSecret refresh
#      below mints a new token, and Reloader rolls the pod on the change.
#   3. The Python MCP SDK, unlike the Go and TypeScript ones, refuses every
#      request on a session that has not seen `initialize`, with exactly that
#      -32602. (vMCP's `server/discover` probe also gets a -32602 from this
#      SDK, but only for that one request -- that part is harmless here.)
# So after any restart the proxy re-attached, answered `initialize` from its
# cache, and the fresh process rejected everything until the proxy itself
# happened to restart. The Go/Node stdio servers in this group (github,
# pulumi, tailscale) restart the same way and survive it only because their
# SDKs do not check.
#
# Serving HTTP from the process itself takes the stdio multiplexer, and its
# cache, out of the path. FASTMCP_STATELESS_HTTP makes each request
# self-contained, so the 20-minute restart does not strand the sessions
# vMCP and toolport hold -- `tools/list` with no handshake at all returns
# 200. The image reads TRANSPORT/HOST/PORT, not the operator-injected
# MCP_TRANSPORT/MCP_PORT, so they are set explicitly below (HOST already
# defaults to 0.0.0.0 in the image).
#
# David's explicit scope answer: "Secrets only, read+write" ->
# SECRETSTOOL=True, everything else off. Confirmed exact env var names
# live via web search of the project's own docs.
#
# OPENBAO_URL/OPENBAO_TOKEN come from ./externalsecret.yaml, which mints a
# live, auto-renewing token via ./vaultdynamicsecret.yaml rather than a
# static one this package has no way to refresh itself -- see that file's
# header, and stacks/system/openbao-mcp.ts's, for the full design.
# stacks/system/openbao-mcp.ts's ENABLED gate is on -- the Kubernetes-auth
# Role + Policy it needs exist once that stack next applies.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-openbao
spec:
  image: knucklessg1/openbao-mcp:mcp@sha256:33ad5f9c58657f6bf5abf523e903544e3097be7ffdde8c1681d646720b78128a
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  groupRef:
    name: agent-tools

  env:
    - name: TRANSPORT
      value: streamable-http
    # Must match `mcpPort` above.
    - name: PORT
      value: "8000"
    - name: FASTMCP_STATELESS_HTTP
      value: "true"
    - name: SECRETSTOOL
      value: "True"
    - name: SYSTOOL
      value: "False"
    - name: AUTHTOOL
      value: "False"
    - name: SSHTOOL
      value: "False"

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: toolhive-openbao
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/generators.external-secrets.io/vaultdynamicsecret_v1alpha1.json
#
# Mints a fresh, short-lived OpenBao token for openbao-mcp instead of a
# static one it could never renew on its own -- see
# stacks/system/openbao-mcp.ts's header for the full design (why
# this authenticates AS `external-secrets`/`kube-system`, and why there
# are two hops: a Kubernetes-auth login, then a separate `auth/token/create`
# call to mint the token this ExternalSecret actually hands to the pod).
#
# No `serviceAccountRef` -- deliberately, and the ORIGINAL version of this
# file having one was a real bug that broke this Generator entirely.
# `VaultDynamicSecret` is a NAMESPACED resource, and a cross-namespace
# `serviceAccountRef` (this used to point at `external-secrets`/
# `kube-system`, matching who the login role is bound to) is NOT honored
# for security reasons -- the lookup happens IN THIS GENERATOR'S OWN
# namespace (agents), where no `external-secrets` ServiceAccount exists,
# so every attempt failed with `ServiceAccount "external-secrets" not
# found` (confirmed live via the external-secrets controller's own logs).
# The CRD's own field doc says exactly what to do instead: "If the
# service account selector is not supplied... the one bound to the
# controller will be used" -- which already IS `external-secrets`/
# `kube-system` (ESO's own pod identity), the same one every other
# OpenBao consumer in this cluster (openbao-store.yaml's `eso-equestria`
# role) already authenticates as. Omitting the field is what makes this
# work, not adding it.
#
# Field shapes ARE live-verified against this cluster's actual
# VaultDynamicSecret CRD (`kubectl explain vaultdynamicsecret.spec` /
# `.spec.provider.auth.kubernetes`) -- the specific COMBINATION of
# `path: auth/token/create` + `resultType: Auth` to mint a plain token
# (rather than read a database/pki/aws-style dynamic secret) is NOT
# live-exercised, only reasoned from OpenBao/Vault's own documented
# pattern for this exact scenario. Verify the rendered ExternalSecret
# actually produces a non-empty OPENBAO_TOKEN before trusting it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: toolhive-openbao
spec:
  path: auth/token/create
  method: POST
  resultType: Auth
  parameters:
    policies:
      - agent-openbao-mcp
    ttl: 1h
    no_default_policy: true
  provider:
    server: http://openbao-active.kube-system.svc.cluster.local:8200
    path: secrets
    version: v2
    auth:
      kubernetes:
        mountPath: kubernetes
        role: agent-openbao-mcp

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Sources from ./vaultdynamicsecret.yaml's Generator, not a plain OpenBao
# path -- see that file's header. `refreshInterval` here is what actually
# keeps OPENBAO_TOKEN alive: the generator mints a 1h token
# (./vaultdynamicsecret.yaml's `ttl: 1h`), so this refreshes well inside
# that window and `reloader.stakater.com/auto` rolls the pod on each
# change, same mechanism every other reloader-annotated Secret in this
# rollout already relies on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-openbao
spec:
  refreshPolicy: Periodic
  refreshInterval: 20m
  target:
    name: toolhive-openbao
    creationPolicy: Owner
    template:
      data:
        OPENBAO_URL: http://openbao-active.kube-system.svc.cluster.local:8200
        OPENBAO_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: toolhive-openbao
      rewrite:
        - regexp:
            source: "^client_token$"
            target: token
