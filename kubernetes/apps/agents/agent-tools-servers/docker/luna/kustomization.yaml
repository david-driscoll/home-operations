---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # See ../celestia/kustomization.yaml's comment for why target.name is
  # omitted and why /metadata/name is patched explicitly, and for the full
  # dockge-<host> DNS name / egress-Service / ACL story DOCKER_HOST below
  # relies on.
  #
  # `${TAILSCALE_DOMAIN}` here, not `${ROOT_DOMAIN}` like ../celestia and
  # ../alpha-site use -- luna has no internal LAN IP recorded anywhere in
  # this repo (stacks/gulf-of-mexico/index.ts), only a tailscale one, so
  # its DNS should match that reality rather than resolve through the
  # driscoll.tech split-horizon zone. Same
  # `getContainerHostnames`-generated name either way
  # (components/helpers.ts's `tailscaleHostname` field, not `hostname`) --
  # already an established pattern elsewhere in this repo (e.g.
  # kubernetes/apps/tailscale-system/services/tailscale.yaml).
  - target:
      kind: MCPServer
    patch: |-
      - op: replace
        path: /metadata/name
        value: toolhive-docker-luna
      - op: replace
        path: /spec/env/0/value
        value: tcp://dockge-luna.${TAILSCALE_DOMAIN}:2375
