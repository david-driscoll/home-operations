---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # See ../celestia/kustomization.yaml's comment for why target.name is
  # omitted and why /metadata/name is patched explicitly, and for the full
  # dockge-<host> DNS name / egress-Service / ACL story DOCKER_HOST below
  # relies on. `dockge-as`, not `dockge-alpha-site` -- alpha-site's
  # ProxmoxHost carries `shortName: "as"`
  # (stacks/home/index.ts), and getContainerHostnames uses
  # `host.shortName ?? host.name`. Confirmed live: `dockge-as.${ROOT_DOMAIN}`
  # resolves, `dockge-alpha-site.${ROOT_DOMAIN}` was never tried and would
  # likely not.
  - target:
      kind: MCPServer
    patch: |-
      - op: replace
        path: /metadata/name
        value: toolhive-docker-alpha-site
      - op: replace
        path: /spec/env/0/value
        value: tcp://dockge-as.${ROOT_DOMAIN}:2375
