---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # See ../celestia/kustomization.yaml's comment for why target.name is
  # omitted and why /metadata/name is patched explicitly, and for why
  # DOCKER_HOST uses an IP (alpha-site's internal LAN IP,
  # stacks/home/index.ts).
  - target:
      kind: MCPServer
    patch: |-
      - op: replace
        path: /metadata/name
        value: toolhive-docker-alpha-site
      - op: replace
        path: /spec/env/0/value
        value: tcp://10.10.10.200:2375
