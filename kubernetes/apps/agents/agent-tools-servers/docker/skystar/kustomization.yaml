---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # See ../celestia/kustomization.yaml's comment for why target.name is
  # omitted and why /metadata/name is patched explicitly, and for why
  # DOCKER_HOST uses an IP (skystar's tailscale IP -- it has no internal
  # LAN IP recorded anywhere in this repo, stacks/ocracoke/index.ts).
  - target:
      kind: MCPServer
    patch: |-
      - op: replace
        path: /metadata/name
        value: toolhive-docker-skystar
      - op: replace
        path: /spec/env/0/value
        value: tcp://100.111.10.105:2375
