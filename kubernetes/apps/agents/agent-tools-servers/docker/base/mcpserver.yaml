---
# No `yaml-language-server: $schema=` line -- see ../../docs.yaml.
#
# mcp-server-docker (github.com/ckreiling/mcp-server-docker, PyPI package
# `mcp-server-docker`) against a Dockge host's existing docker-socket-proxy
# (docker/_common/docker-socket-proxy/compose.yaml -- `tecnativa/docker-socket-proxy:v0.5.0`
# on port 2375, plain TCP, no auth -- already the estate's own trust boundary
# for that host's Docker daemon: EXEC/DELETE/POST/START/STOP/RESTART/PAUSE
# all enabled there today).
#
# David's explicit scope answer for Docker MCP: "inherit the proxy's existing
# scope" -- no additional restriction at the MCP layer, no credential needed
# here at all (the proxy itself is the only gate, and it is unauthenticated
# TCP by design already).
#
# One base, one overlay per host (../celestia, ../luna, ../skystar,
# ../alpha-site) -- the four MCPServers differed only in DOCKER_HOST, so a
# kustomize JSON6902 patch on that one field replaces what used to be four
# near-identical copies of this whole file. DOCKER_HOST below is a
# deliberately obvious placeholder; every overlay patches it, none use it
# as-is.
#
# Each host's DOCKER_HOST value is that host's `dockge-<host>.${ROOT_DOMAIN}`
# DNS name -- see any one overlay's own kustomization.yaml comment for the
# full story (getContainerHostnames's naming convention, the tailnet
# egress Service it resolves to, and the ACL grant that had to be added
# alongside it). Two earlier drafts got this wrong before landing here:
# first assuming `<host>.${ROOT_DOMAIN}` (a hostname that was never a real
# record at all -- confirmed live), then hardcoding each host's LAN/tailscale
# IP directly as a workaround, which would have worked but throws away the
# indirection DNS gives for free (an IP that changes would need every
# consumer updated by hand). `dockge-<host>.${ROOT_DOMAIN}` is the estate's
# own real, existing, purpose-built name for exactly this -- it should
# have been used from the start.
#
# Same uv-image pattern as ../../unifi-network.yaml --
# see its header for why podTemplateSpec overrides command/args explicitly.
#
# NO oidcConfigRef/authServerRef -- see
# ../../kubernetes.yaml's header. This server joins
# ../../../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: REPLACE-ME-name
spec:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  env:
    - name: DOCKER_HOST
      value: tcp://REPLACE-ME.invalid:2375

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      volumes:
        - name: uv-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["/usr/local/bin/uv"]
          args: ["tool", "run", "mcp-server-docker"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: uv-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
