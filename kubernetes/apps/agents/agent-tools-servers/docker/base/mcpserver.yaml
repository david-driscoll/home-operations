---
# No `yaml-language-server: $schema=` line -- see ../../docs.yaml.
#
# mcp-server-docker (github.com/ckreiling/mcp-server-docker, PyPI package
# `mcp-server-docker`) against a Dockge host's existing docker-socket-proxy
# (docker/_common/docker-socket-proxy/compose.yaml -- `tecnativa/docker-socket-proxy:v0.5.0`
# on port 2375, plain TCP, no auth -- already the estate's own trust boundary
# for that host's Docker daemon: EXEC/DELETE/POST/START/STOP/RESTART/PAUSE
# all enabled there today).
#
# David's explicit scope answer for Docker MCP: "inherit the proxy's existing
# scope" -- no additional restriction at the MCP layer, no credential needed
# here at all (the proxy itself is the only gate, and it is unauthenticated
# TCP by design already).
#
# One base, one overlay per host (../celestia, ../luna, ../skystar,
# ../alpha-site) -- the four MCPServers differed only in DOCKER_HOST, so a
# kustomize JSON6902 patch on that one field replaces what used to be four
# near-identical copies of this whole file. DOCKER_HOST below is a
# deliberately obvious placeholder; every overlay patches it, none use it
# as-is.
#
# Each host's DOCKER_HOST value is that host's `dockge-<host>.${ROOT_DOMAIN}`
# DNS name -- see any one overlay's own kustomization.yaml comment for the
# full story (getContainerHostnames's naming convention, the tailnet
# egress Service it resolves to, and the ACL grant that had to be added
# alongside it). Two earlier drafts got this wrong before landing here:
# first assuming `<host>.${ROOT_DOMAIN}` (a hostname that was never a real
# record at all -- confirmed live), then hardcoding each host's LAN/tailscale
# IP directly as a workaround, which would have worked but throws away the
# indirection DNS gives for free (an IP that changes would need every
# consumer updated by hand). `dockge-<host>.${ROOT_DOMAIN}` is the estate's
# own real, existing, purpose-built name for exactly this -- it should
# have been used from the start.
#
# Runs on Astral's `uv` image because the package publishes no container.
# `ghcr.io/astral-sh/uv` ships `ENTRYPOINT []` / `CMD ["/usr/local/bin/uv"]`,
# so the MCPServer's top-level `image`+`args` cannot produce a `uv tool run`
# -- podTemplateSpec below sets the container's `command`/`args` explicitly.
#
# WHY streamable-http AND NOT stdio. Read ../../openbao.yaml's header for the
# mechanism: ToolHive's stdio proxy answers `initialize` from a cache it never
# resets, including when it re-attaches to a restarted backend, and the Python
# MCP SDK refuses every request on a session that has not seen `initialize`.
# This package runs mcp 2.2.0, which moved that gate to
# mcp/server/runner.py (`ServerRunner._on_request`) and logs nothing when it
# fires -- the backend just answers -32602 "Invalid request parameters". So
# under stdio, any backend-only restart (node drain, OOM, eviction) broke
# every docker tool, old sessions and new, until the PROXY Deployment
# restarted too. Reproduced on 2026-09-26 against a copy of this server:
# 19 tools before deleting the `-0` pod, -32602 on both an existing and a
# brand-new session after it.
#
# The package's own CLI (`mcp-server-docker` -> `app.run()`) is stdio-only,
# but it exports the server object as `mcp_server_docker.app`, and the SDK's
# `MCPServer.run()` takes the transport directly. The args below call that,
# stateless: no session id, no handshake needed (`tools/list` with neither
# returns 200), and the Docker client lifespan is entered once per process,
# not per request. With no session to lose, a backend restart costs vMCP and
# toolport only the ~15s until tools answer again -- even when it takes the
# proxy down with it, which ../../unifi-network.yaml's header shows it often
# does. host 0.0.0.0 also leaves the SDK's DNS-rebinding check off; it only
# turns itself on for a localhost bind.
#
# The package is pinned because the args depend on its `app` export, which a
# later release could rename -- Renovate still bumps it through the inline
# annotation.
#
# NO oidcConfigRef/authServerRef -- see
# ../../kubernetes.yaml's header. This server joins
# ../../../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: REPLACE-ME-name
spec:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  groupRef:
    name: agent-tools

  env:
    - name: DOCKER_HOST
      value: tcp://REPLACE-ME.invalid:2375

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      volumes:
        - name: uv-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["/usr/local/bin/uv"]
          # port must match `mcpPort` above.
          args:
            - tool
            - run
            - --from
            # renovate: datasource=pypi depName=mcp-server-docker
            - mcp-server-docker==0.3.0
            - python
            - -c
            - from mcp_server_docker import app; app.run("streamable-http", host="0.0.0.0", port=8000, stateless_http=True)
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: uv-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
