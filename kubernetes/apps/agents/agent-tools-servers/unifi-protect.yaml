---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
# unifi-protect-mcp (github.com/sirkirby/unifi-mcp, apps/protect). Same shape
# as ./unifi-network.yaml -- see that file's header for why this is
# upstream's image over streamable-http rather than PyPI under stdio, why the
# command wraps `main()` to run stateless, and the DNS-rebinding setting. See
# ./kubernetes.yaml's for why there is no oidcConfigRef/authServerRef (this
# server joins ../agent-tools-mcp's MCPGroup instead).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-unifi-protect
spec:
  image: ghcr.io/sirkirby/unifi-protect-mcp:0.8.12@sha256:d44c7ee7fe35441327f1639cd0f7aa5218d72cff820439f6a869a37d094d0cd9
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  groupRef:
    name: agent-tools

  env:
    - name: UNIFI_PROTECT_HOST
      value: unifi.${ROOT_DOMAIN}
    - name: UNIFI_PROTECT_PORT
      value: "443"
    - name: UNIFI_PROTECT_VERIFY_SSL
      value: "false"
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    # Must match `mcpPort` above.
    - name: UNIFI_MCP_PORT
      value: "8000"
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # The stateless wrapper -- see ./unifi-network.yaml.
        - name: mcp
          command:
            - python
            - -c
            - >-
              import functools;
              from mcp.server.mcpserver import MCPServer;
              MCPServer.run_streamable_http_async = functools.partialmethod(MCPServer.run_streamable_http_async, stateless_http=True);
              from unifi_protect_mcp.main import main;
              main()
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: toolhive-unifi-protect
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Flagged by Codacy -- see ./unifi-network.yaml's
          # comment.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Same `Eris/unifipoller` credential, same shared OpenBao path, as
# ./unifi-network.yaml -- see that file's header for the full reasoning and
# the one `bao kv put` all three of these servers read from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-unifi-protect
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-unifi-protect
    creationPolicy: Owner
    template:
      data:
        UNIFI_PROTECT_USERNAME: "{{ .username }}"
        UNIFI_PROTECT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: third-party-tokens/unifi/unifipoller
        property: username
    - secretKey: password
      remoteRef:
        key: third-party-tokens/unifi/unifipoller
        property: password
