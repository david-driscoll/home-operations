---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
# Same shape as ./unifi-network.yaml -- see that file's
# header for the `uv` image / podTemplateSpec-command reasoning, and
# ./kubernetes.yaml's for why there is no
# oidcConfigRef/authServerRef (this server joins ../agent-tools-mcp's
# MCPGroup instead).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-unifi-protect
spec:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  env:
    - name: UNIFI_PROTECT_HOST
      value: unifi.${ROOT_DOMAIN}
    - name: UNIFI_PROTECT_PORT
      value: "443"
    - name: UNIFI_PROTECT_VERIFY_SSL
      value: "false"

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      volumes:
        - name: uv-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["/usr/local/bin/uv"]
          args: ["tool", "run", "unifi-protect-mcp"]
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: toolhive-unifi-protect
          volumeMounts:
            - name: uv-cache
              mountPath: /tmp
          # Flagged by Codacy -- see ./unifi-network.yaml's
          # comment.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Same `Eris/unifipoller` credential, same shared OpenBao path, as
# ./unifi-network.yaml -- see that file's header for the full reasoning and
# the one `bao kv put` all three of these servers read from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-unifi-protect
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-unifi-protect
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        UNIFI_PROTECT_USERNAME: "{{ .username }}"
        UNIFI_PROTECT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: third-party-tokens/unifi/unifipoller
        property: username
    - secretKey: password
      remoteRef:
        key: third-party-tokens/unifi/unifipoller
        property: password
