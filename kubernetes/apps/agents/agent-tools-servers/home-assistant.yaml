---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Home Assistant's own long-lived access token, reused -- NOT a new
# credential. Same OpenBao item the stargate-command HA deployment already
# reads (kubernetes/apps/stargate-command/secrets/home-assistant.yaml
# extracts the whole thing); this pulls the single `apikey` property out of
# it for the MCP proxy below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-home-assistant
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-home-assistant
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        token: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: clusters/equestria/apps/home-assistant/eris-credentials
        property: apikey

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# Bearer auth for the proxy below. An earlier revision of this file left
# outgoing auth unwired and recorded that closing it needed TOKEN EXCHANGE
# against Home Assistant's OAuth provider, plus a confidential OAuth client
# registered on the Home Assistant side -- credentials that rollout did not
# have.
#
# That turned out to be a bigger requirement than Home Assistant actually
# imposes. `/api/mcp` accepts an ordinary long-lived access token as a
# plain `Authorization: Bearer`, and the estate already holds one. Verified
# live before writing any of this, using the existing credential:
#
#   GET  /api/      -> 200   (token valid)
#   POST /api/mcp   -> 200   with a real MCP initialize result
#                            (protocolVersion 2025-06-18, capabilities,
#                             tools/prompts/resources advertised)
#
# versus HTTP 401 unauthenticated, which is what the proxy had been getting
# on every attempt (154 of them per start, then "initialize not successful,
# but continuing" -- it stays Running while serving nothing).
#
# So: no OAuth client registration, no token exchange, no new secret.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: home-assistant
spec:
  type: bearerToken
  bearerToken:
    tokenSecretRef:
      name: toolhive-home-assistant
      key: token

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# `MCPRemoteProxy` -- see ./microsoft-docs.yaml's header for what that CRD
# is and why it applies here too.
#
# Outgoing auth now wired via ../agent-tools-servers' MCPExternalAuthConfig
# above; see its header for why the token-exchange route the previous
# revision described is not needed. The CRD requires the
# MCPExternalAuthConfig to live in the same namespace, which it does.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: toolhive-home-assistant
spec:
  remoteUrl: https://home.${ROOT_DOMAIN}/api/mcp
  transport: streamable-http
  groupRef:
    name: agent-tools
  externalAuthConfigRef:
    name: home-assistant

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
