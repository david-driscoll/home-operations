---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# @upstash/context7-mcp (npm) has no prebuilt container of its own, so this
# runs it on the stock `node` image the same way the unifi-* servers run
# PyPI packages on `uv` -- podTemplateSpec overrides `command`/`args` to
# `npx -y @upstash/context7-mcp` explicitly rather than relying on the
# image's own ENTRYPOINT/CMD (unverified for this specific tag; the uv-based
# servers next door needed this same override once verified, so it is
# assumed rather than re-checked per image). No digest pin yet -- add one
# before merging.
#
# CONTEXT7_API_KEY comes from ./context7.yaml's own ExternalSecret below,
# sourced from David's existing `third-party-tokens/context7/apikey`
# OpenBao path (property `apikey`) -- no new top-level prefix, so no root
# ceremony needed (same `eso-equestria` grant every other third-party-tokens/
# consumer here already uses, e.g. ./unifi-access.yaml's
# `third-party-tokens/unifi/unifipoller`). Started out unauthenticated at
# Upstash's public rate limit; wired up once that turned out to be too low
# for this namespace's usage.
#
# `transport: stdio` because the package speaks stdio -- the operator's
# proxy-runner is what turns that into Streamable HTTP, same as every
# npx/uvx-wrapped server here.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-context7
spec:
  image: node:22-alpine
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    spec:
      # npm needs a writable HOME to hold its cache -- the operator's own
      # default pod spec runs containers with a read-only root filesystem
      # REGARDLESS of whether this override sets readOnlyRootFilesystem
      # itself, confirmed live: without this, npx fails immediately trying
      # to `mkdir /home/node/.npm` (ENOENT). Same emptyDir-at-HOME pattern
      # ../toolhive-unifi-network/mcpserver.yaml's own header already
      # documents for the uv-based servers -- an earlier draft of this file
      # assumed (wrongly) that omitting readOnlyRootFilesystem here would
      # negate that default; it does not.
      volumes:
        - name: npm-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@upstash/context7-mcp"]
          env:
            - name: HOME
              value: /tmp
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-context7
                  key: CONTEXT7_API_KEY
          volumeMounts:
            - name: npm-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# David's existing Upstash/Context7 API key, already stored in OpenBao at
# third-party-tokens/context7/apikey (property `apikey`) -- same
# ClusterSecretStore/`eso-equestria` path every other third-party-tokens/
# consumer in this directory uses (e.g. ./unifi-access.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-context7
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-context7
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        CONTEXT7_API_KEY: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: third-party-tokens/context7/apikey
        property: apikey
