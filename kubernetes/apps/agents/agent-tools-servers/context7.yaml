---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# @upstash/context7-mcp (npm) has no prebuilt container of its own, so this
# runs it on the stock `node` image the same way the unifi-* servers run
# PyPI packages on `uv` -- podTemplateSpec overrides `command`/`args` to
# `npx -y @upstash/context7-mcp` explicitly rather than relying on the
# image's own ENTRYPOINT/CMD (unverified for this specific tag; the uv-based
# servers next door needed this same override once verified, so it is
# assumed rather than re-checked per image). No digest pin yet -- add one
# before merging.
#
# No CONTEXT7_API_KEY -- works unauthenticated at Upstash's public rate
# limit for now. Add one via a new OpenBao path if that turns out to be too
# low for this namespace's usage.
#
# `transport: stdio` because the package speaks stdio -- the operator's
# proxy-runner is what turns that into Streamable HTTP, same as every
# npx/uvx-wrapped server here.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-context7
spec:
  image: node:22-alpine
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    spec:
      # npm needs a writable HOME to hold its cache -- the operator's own
      # default pod spec runs containers with a read-only root filesystem
      # REGARDLESS of whether this override sets readOnlyRootFilesystem
      # itself, confirmed live: without this, npx fails immediately trying
      # to `mkdir /home/node/.npm` (ENOENT). Same emptyDir-at-HOME pattern
      # ../toolhive-unifi-network/mcpserver.yaml's own header already
      # documents for the uv-based servers -- an earlier draft of this file
      # assumed (wrongly) that omitting readOnlyRootFilesystem here would
      # negate that default; it does not.
      volumes:
        - name: npm-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@upstash/context7-mcp"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: npm-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
