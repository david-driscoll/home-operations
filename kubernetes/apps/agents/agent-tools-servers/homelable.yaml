---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# homelable's OWN `MCP_API_KEY`, reused -- NOT a new credential. The same
# OpenBao item homelable's deployment reads
# (kubernetes/apps/equestria/home/homelable/externalsecret.yaml extracts the
# whole thing); this pulls the single `mcp_api_key` property out of it for the
# `X-API-Key` the proxy below adds.
#
# The two halves MUST stay equal. This is the value the MCP server compares
# against with `hmac.compare_digest`, so a rotation that reaches one side and
# not the other is a 401 on every call. They read the same field of the same
# item, so a rotation reaches both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-homelable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-homelable
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        apikey: "{{ .mcp_api_key }}"
  data:
    - secretKey: mcp_api_key
      remoteRef:
        key: clusters/equestria/apps/homelable/keys
        property: mcp_api_key

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# `MCPRemoteProxy`, not `MCPServer`: it fronts an EXISTING remote MCP HTTP
# server at `remoteUrl` rather than running a container ToolHive manages.
#
# WHY A REMOTE PROXY AND NOT AN MCPServer RUNNING THE IMAGE HERE, the way
# ./degoog.yaml runs degoog's own sidecar. The two look interchangeable and are
# not, because of what homelable-mcp talks to:
#
#   - It reaches the backend at `BACKEND_URL` with an `X-MCP-Service-Key`
#     header that BYPASSES OIDC by design (`app/backend_client.py`). On celestia
#     that hop lived on a stack-private Docker network; in Kubernetes it is a
#     loopback hop inside homelable's pod, because the mcp container is a
#     sibling of the backend there and the backend has NO Service at all.
#   - Running the image in `agents` instead would mean giving that backend a
#     ClusterIP so this namespace could reach it -- turning a pod-private,
#     OIDC-bypassing API into a cluster-wide one. degoog has no such hop to
#     protect: its search surface carries no key, so exposing it costs nothing.
#
# So the container stays next to the backend it privileges, and only the MCP
# SURFACE moves here. Clients arrive through toolport's `networking` profile
# (../toolport/resources/registry.json), which calls this proxy's Service
# directly -- instead of a bespoke tailnet hostname whose only credential was a
# static key. The static key survives as an internal detail of this proxy,
# which is the one place it was ever appropriate.
#
# `http://` and a `.svc.cluster.local` address, not the public name: this
# traffic never leaves the cluster network, same reasoning as ./degoog.yaml.
#
# `allowPrivateEndpoint` is REQUIRED to say that, and leaving it off is not a
# soft failure -- the proxy goes `Failed` outright, which is exactly what it
# did on the first rollout:
#
#   remote URL host is not allowed: hostname
#   "homelable-mcp.equestria.svc.cluster.local"
#   matches blocked internal hostname "cluster.local"
#
# MCPRemoteProxy runs an SSRF guard over `remoteUrl` that blocks RFC 1918
# addresses, IPv6 unique-local, and any hostname ending in `cluster.local`
# unless this flag is set. That is why the remote proxies predating this file
# (Home Assistant, Microsoft Learn -- both since retired) named PUBLIC URLs --
# a constraint, not a house style. An MCPServer's `env` carries no such guard,
# so ./degoog.yaml pointing at a ClusterIP with no flag is a misleading
# precedent to generalise from: the two CRDs differ here.
#
# Setting the flag is the honest form of the fix. A bare `.svc` host
# (`homelable-mcp.equestria.svc:8001`) also gets through -- the CRD documents
# that bare `.svc` is never blocked, since no DNS resolution is performed --
# but that evades the guard rather than declaring intent, and would leave the
# next reader unaware the guard exists at all. Loopback, link-local,
# cloud-metadata and kubernetes.default stay blocked either way.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: toolhive-homelable
spec:
  remoteUrl: http://homelable-mcp.equestria.svc.cluster.local:8001/mcp
  allowPrivateEndpoint: true
  transport: streamable-http
  groupRef:
    name: agent-tools
  # headerForward, NOT an MCPExternalAuthConfig. homelable-mcp mounts an
  # unconditional ASGI middleware (`app/auth.py`, `ApiKeyMiddleware`) that
  # demands `X-API-Key` on every path except `/health`, `/register` and
  # `/.well-known/*`, compared raw with `hmac.compare_digest` -- an
  # `Authorization: Bearer` is never looked at. And there is no switching it
  # off: `MCP_API_KEY` defaults to the literal `mcp_sk_changeme`
  # (`app/config.py`), public in the image (verified by extracting 3.3.5).
  #
  # It used to be an `externalAuthConfigRef` (headerInjection), but a proxy
  # applies that ONLY when a VirtualMCPServer's outgoingAuth calls it -- a
  # direct caller got a 401 from homelable (verified 2026-09-24), and toolport
  # is a direct caller. toolport itself can only send `Authorization: Bearer`
  # (upstream `remote.rs`, first_vaulted_secret), so the header has to be
  # added here. `addHeadersFromSecret` applies to every request the proxy
  # forwards -- the same mechanism ../toolport-mcp's profile proxies use.
  #
  # WHICH MAKES THIS SERVICE A CREDENTIAL. Anything that can reach it gets
  # homelable's MCP with the key already attached. The NetworkPolicy below is
  # what keeps that to toolport; it is not optional.
  headerForward:
    addHeadersFromSecret:
      - headerName: X-API-Key
        valueSecretRef:
          name: toolhive-homelable
          key: apikey

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
#
# Only toolport may reach the proxy above, which attaches homelable's API key
# to every request it forwards -- see its headerForward comment. Without this,
# any pod in the cluster that can resolve the Service has homelable's MCP.
# Same shape as ../toolport-mcp/networkpolicy.yaml; name the caller
# explicitly, never by a broad label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: toolhive-homelable-allow-toolport
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcpremoteproxy
      toolhive-name: toolhive-homelable
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agents
          podSelector:
            matchLabels:
              app.kubernetes.io/name: toolport
              app.kubernetes.io/controller: toolport
      ports:
        - protocol: TCP
          port: 8080
