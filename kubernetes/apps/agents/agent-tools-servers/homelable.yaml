---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# homelable's OWN `MCP_API_KEY`, reused -- NOT a new credential. The same
# OpenBao item homelable's deployment reads
# (kubernetes/apps/equestria/home/homelable/externalsecret.yaml extracts the
# whole thing); this pulls the single `mcp_api_key` property out of it for the
# header injection below.
#
# The two halves MUST stay equal. This is the value the MCP server compares
# against with `hmac.compare_digest`, so a rotation that reaches one side and
# not the other is a 401 on every call. They read the same field of the same
# item, so a rotation reaches both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-homelable
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-homelable
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        apikey: "{{ .mcp_api_key }}"
  data:
    - secretKey: mcp_api_key
      remoteRef:
        key: clusters/equestria/apps/homelable/keys
        property: mcp_api_key

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# Outgoing auth for the proxy below, and it is NOT optional the way an unwired
# `externalAuthConfigRef` usually is.
#
# homelable-mcp mounts an unconditional ASGI middleware (`app/auth.py`,
# `ApiKeyMiddleware`) that demands `X-API-Key` on every path except `/health`,
# `/register` and `/.well-known/*`. There is no flag to turn it off -- and the
# failure mode of simply not setting a key is worse than leaving it enforced,
# because `MCP_API_KEY` defaults to the literal `mcp_sk_changeme`
# (`app/config.py`), which ships in the public image. Verified by extracting
# 3.3.5 from ghcr.io, not inferred from docs.
#
# `headerInjection` rather than `bearerToken` (./home-assistant.yaml's type)
# because the middleware reads the `x-api-key` header specifically and does a
# constant-time compare against the raw key -- an `Authorization: Bearer` would
# never be looked at.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: homelable
spec:
  type: headerInjection
  headerInjection:
    headerName: X-API-Key
    valueSecretRef:
      name: toolhive-homelable
      key: apikey

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# `MCPRemoteProxy` -- see ./microsoft-docs.yaml's header for what that CRD is.
#
# WHY A REMOTE PROXY AND NOT AN MCPServer RUNNING THE IMAGE HERE, the way
# ./degoog.yaml runs degoog's own sidecar. The two look interchangeable and are
# not, because of what homelable-mcp talks to:
#
#   - It reaches the backend at `BACKEND_URL` with an `X-MCP-Service-Key`
#     header that BYPASSES OIDC by design (`app/backend_client.py`). On celestia
#     that hop lived on a stack-private Docker network; in Kubernetes it is a
#     loopback hop inside homelable's pod, because the mcp container is a
#     sibling of the backend there and the backend has NO Service at all.
#   - Running the image in `agents` instead would mean giving that backend a
#     ClusterIP so this namespace could reach it -- turning a pod-private,
#     OIDC-bypassing API into a cluster-wide one. degoog has no such hop to
#     protect: its search surface carries no key, so exposing it costs nothing.
#
# So the container stays next to the backend it privileges, and only the MCP
# SURFACE moves here. What that buys is the point of the move: clients now
# arrive through ../agent-tools-mcp's VirtualMCPServer -- one hostname, one OIDC
# surface -- instead of a bespoke tailnet hostname whose only credential was a
# static key. The static key survives as an internal detail of the hop above,
# which is the one place it was ever appropriate.
#
# `http://` and a `.svc.cluster.local` address, not the public name: this
# traffic never leaves the cluster network, same reasoning as ./degoog.yaml.
# The CRD allows it (`remoteUrl` pattern is `^https?://`).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: toolhive-homelable
spec:
  remoteUrl: http://homelable-mcp.equestria.svc.cluster.local:8001/mcp
  transport: streamable-http
  groupRef:
    name: agent-tools
  externalAuthConfigRef:
    name: homelable

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
