---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# GitHub's own official server, NOT a third-party wrapper --
# ghcr.io/github/github-mcp-server. No digest pin yet -- add one before
# merging.
#
# `args: ["stdio"]` because the image's own documented invocation is
# `docker run ... ghcr.io/github/github-mcp-server stdio` -- the top-level
# `args` field appends to whatever the image's own entrypoint already runs
# (confirmed working for ./kubernetes.yaml's `--read-write=true` the
# same way), so no podTemplateSpec command override is needed here, unlike
# the uv-based servers next door.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
#
# GITHUB_PERSONAL_ACCESS_TOKEN lives under podTemplateSpec, not the
# top-level `spec.env` -- confirmed live via `kubectl explain
# mcpserver.spec.env`: that field is `{name, value}` only, a literal
# string, with NO `valueFrom` in the CRD schema at all. An earlier draft
# of this file put it there and it dry-run failed on every apply
# (".spec.env[...].valueFrom: field not declared in schema"), which
# blocked this whole MCPGroup's Kustomization from ever going Ready.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-github
spec:
  image: ghcr.io/github/github-mcp-server:latest
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools
  args:
    - stdio

  podTemplateSpec:
    # WHAT KEEPS THIS SERVER AUTHENTICATED, and the only reason this
    # `metadata` block exists.
    #
    # THE PROBLEM. `secretKeyRef` below resolves ONCE, at container start.
    # `github-token` is a GitHub App INSTALLATION token, re-minted every 30m
    # against a 60m life
    # (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml),
    # so the value baked in at pod start dies ~60m later and this pod goes on
    # presenting it. Confirmed live 2026-09-05: `get_me` through the vMCP
    # returned `401 Bad credentials` on a pod that had been up 4h48m, while
    # every other backend answered fine.
    #
    # THE `gh` FIX DOES NOT TRANSFER. ../agentboard/helmrelease.yaml solves
    # the same staleness for `gh` by pointing GH_CONFIG_DIR at a
    # live-updating Secret DIRECTORY mount. github-mcp-server has no
    # file-based credential -- its own installation docs describe
    # GITHUB_PERSONAL_ACCESS_TOKEN as an environment variable and document no
    # token-file equivalent -- so a mount would have nothing to read it. The
    # pod has to be RESTARTED when the token rotates; there is no in-place
    # refresh available.
    #
    # RELOADER DOES THE RESTART, driven by this annotation. It watches
    # `github-token` and rolls the workload when the contents change, which
    # is the moment a fresh token lands rather than a point on a timer.
    #
    # WHY THE ANNOTATION IS HERE, ON THE POD TEMPLATE, rather than on the
    # StatefulSet where Reloader's docs put it. The StatefulSet is created
    # and owned by the ToolHive operator -- there is no manifest of ours to
    # annotate, `spec.resourceOverrides` reaches only `proxyDeployment` and
    # `proxyService` (checked against the CRD installed here, those are its
    # only two keys), and no mutating policy engine runs in this cluster.
    # For a while the workaround was a CronJob shelling out to `kubectl
    # annotate`. It is not needed:
    #
    #   RELOADER FALLS BACK TO THE POD TEMPLATE'S ANNOTATIONS when the
    #   workload itself carries none of the ones it looks for --
    #   internal/pkg/... `pkg/common/common.go`:
    #
    #     if !found && !foundAuto && !foundTypedAuto && !foundSearchAnn {
    #         annotations = podAnnotations
    #         reloaderEnabledValue = annotations[reloaderOpts.ReloaderAutoAnnotation]
    #
    # and the operator propagates what is written here onto that pod
    # template -- pkg/container/kubernetes/client.go:
    #
    #     if patchedSpec.ObjectMetaApplyConfiguration != nil && len(patchedSpec.Annotations) > 0 {
    #         baseTemplate = baseTemplate.WithAnnotations(patchedSpec.Annotations)
    #
    # So the declarative path exists on both sides and the two meet here. The
    # StatefulSet's own `metadata.annotations` stays empty, which is fine --
    # that is exactly the case the fallback is written for.
    #
    # NOTE FOR ANYONE DEBUGGING THIS: `github-token` ALSO carries
    # `reloader.stakater.com/auto: "true"` on the Secret itself. That does
    # nothing on its own -- Reloader keys off the WORKLOAD, and this pod sat
    # through nine rotations while that annotation was in place. It is the
    # annotation below that makes the difference, not that one.
    #
    # THERE IS NO 401 WINDOW IN STEADY STATE, despite the restart. A refresh
    # mints a NEW token and the previous one stays valid until its own expiry
    # (that ExternalSecret's header spells this out), so the outgoing pod is
    # still holding a working credential right up to the moment the new pod
    # takes over. The exposure is the few seconds of the roll itself, not an
    # authentication gap.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: mcp
          # `github-token`, the estate's own GitHub App installation
          # token, reflected into this namespace automatically -- see
          # ../agentboard/externalsecret.yaml's header. Takes precedence
          # over OAuth per the image's own docs. Read the `metadata` block
          # above for why this alone does not keep the server working.
          env:
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
