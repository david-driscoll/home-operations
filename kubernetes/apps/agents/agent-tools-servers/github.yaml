---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# GitHub's own official server, NOT a third-party wrapper --
# ghcr.io/github/github-mcp-server. No digest pin yet -- add one before
# merging.
#
# `args: ["stdio"]` because the image's own documented invocation is
# `docker run ... ghcr.io/github/github-mcp-server stdio` -- the top-level
# `args` field appends to whatever the image's own entrypoint already runs
# (confirmed working for ./kubernetes.yaml's `--read-write=true` the
# same way), so no podTemplateSpec command override is needed here, unlike
# the uv-based servers next door.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
#
# GITHUB_PERSONAL_ACCESS_TOKEN lives under podTemplateSpec, not the
# top-level `spec.env` -- confirmed live via `kubectl explain
# mcpserver.spec.env`: that field is `{name, value}` only, a literal
# string, with NO `valueFrom` in the CRD schema at all. An earlier draft
# of this file put it there and it dry-run failed on every apply
# (".spec.env[...].valueFrom: field not declared in schema"), which
# blocked this whole MCPGroup's Kustomization from ever going Ready.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-github
spec:
  image: ghcr.io/github/github-mcp-server:latest
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools
  args:
    - stdio

  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # `github-token`, the estate's own GitHub App installation
          # token, reflected into this namespace automatically -- see
          # ../agentboard/externalsecret.yaml's header. Takes precedence
          # over OAuth per the image's own docs, so this alone is
          # sufficient TO AUTHENTICATE. It does not STAY authenticated:
          #
          # ===================================================================
          # KNOWN BROKEN -- THIS SERVER 401s ABOUT AN HOUR AFTER EVERY START.
          # Confirmed live 2026-09-05: `get_me` through the vMCP returned
          # `401 Bad credentials` while every other backend answered fine.
          # toolhive-github-0 had been up 4h48m (started 13:00:58Z, probed at
          # 17:49Z).
          #
          # `secretKeyRef` resolves ONCE, at container start. `github-token`
          # is a GitHub App INSTALLATION token: re-minted every 30m against a
          # 60m life (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml).
          # So the value baked in at pod start dies ~60m later and this pod
          # keeps presenting it until something restarts it. Nothing does.
          #
          # This is the SAME failure ../agentboard/helmrelease.yaml documents
          # at length for `gh` -- but that fix does NOT transfer. It works by
          # pointing GH_CONFIG_DIR at a live-updating Secret DIRECTORY mount,
          # and github-mcp-server has no file-based credential to point
          # anywhere: its own installation docs describe
          # GITHUB_PERSONAL_ACCESS_TOKEN as an environment variable and
          # document no token-file equivalent. A directory mount would have
          # nothing to read it.
          #
          # The annotation on the `github-token` Secret is NOT the answer
          # either, and the evidence is this pod: that Secret already carries
          # `reloader.stakater.com/auto: "true"` and this workload still sat
          # unrestarted through nine rotations. Reloader keys off the
          # WORKLOAD, and the StatefulSet here is generated by the ToolHive
          # operator, not by this file.
          #
          # What the operator does offer is a restart annotation on the
          # MCPServer itself --
          # `mcpserver.toolhive.stacklok.dev/restarted-at: <timestamp>` (its
          # docs/operator/restart-annotation.md; deleting the StatefulSet by
          # hand is explicitly discouraged, the operator reads that as a
          # failure). That is a lever for a periodic bounce, not an automatic
          # refresh, so it needs something to drive it -- a CronJob patching
          # the timestamp inside the token's 60m window is the obvious shape.
          #
          # DELIBERATELY NOT FIXED HERE. Every candidate above needs live
          # verification this change was not able to do (no exec into the
          # namespace, no way to observe a rotation land), and a wrong guess
          # here restarts a shared backend on a timer for no reason. Diagnosis
          # recorded so the next person starts from evidence, not from
          # "GitHub tools are flaky".
          # ===================================================================
          env:
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
