---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# GitHub's own official server, NOT a third-party wrapper --
# ghcr.io/github/github-mcp-server. No digest pin yet -- add one before
# merging.
#
# `args: ["stdio"]` because the image's own documented invocation is
# `docker run ... ghcr.io/github/github-mcp-server stdio` -- the top-level
# `args` field appends to whatever the image's own entrypoint already runs
# (confirmed working for ./kubernetes.yaml's `--read-write=true` the
# same way), so no podTemplateSpec command override is needed here, unlike
# the uv-based servers next door.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
#
# GITHUB_PERSONAL_ACCESS_TOKEN lives under podTemplateSpec, not the
# top-level `spec.env` -- confirmed live via `kubectl explain
# mcpserver.spec.env`: that field is `{name, value}` only, a literal
# string, with NO `valueFrom` in the CRD schema at all. An earlier draft
# of this file put it there and it dry-run failed on every apply
# (".spec.env[...].valueFrom: field not declared in schema"), which
# blocked this whole MCPGroup's Kustomization from ever going Ready.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-github
spec:
  image: ghcr.io/github/github-mcp-server:latest
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools
  args:
    - stdio

  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # `github-token`, the estate's own GitHub App installation
          # token, reflected into this namespace automatically -- see
          # ../agentboard/externalsecret.yaml's header. Takes precedence
          # over OAuth per the image's own docs, so this alone is
          # sufficient TO AUTHENTICATE. It does not STAY authenticated,
          # which is what ./github-restart.yaml exists for:
          #
          # `secretKeyRef` resolves ONCE, at container start.
          # `github-token` is a GitHub App INSTALLATION token, re-minted
          # every 30m against a 60m life
          # (kubernetes/apps/kube-system/secrets/github-app-token/token/externalsecret.yaml).
          # So the value baked in at pod start dies ~60m later and this pod
          # goes on presenting it. Confirmed live 2026-09-05: `get_me`
          # through the vMCP returned `401 Bad credentials` on a pod that
          # had been up 4h48m, while every other backend answered fine.
          #
          # THE `gh` FIX DOES NOT TRANSFER. ../agentboard/helmrelease.yaml
          # solves this same staleness for `gh` by pointing GH_CONFIG_DIR
          # at a live-updating Secret DIRECTORY mount. github-mcp-server
          # has no file-based credential to point anywhere -- its own
          # installation docs describe GITHUB_PERSONAL_ACCESS_TOKEN as an
          # environment variable and document no token-file equivalent, so
          # a directory mount would have nothing to read it.
          #
          # NOR IS THE SECRET ANNOTATION THE ANSWER, and this pod is the
          # evidence: `github-token` ALREADY carries
          # `reloader.stakater.com/auto: "true"` and this workload still
          # sat unrestarted through nine rotations. Reloader keys off the
          # WORKLOAD, and the StatefulSet here belongs to the ToolHive
          # operator, not to this file -- there is nothing here to annotate.
          env:
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
