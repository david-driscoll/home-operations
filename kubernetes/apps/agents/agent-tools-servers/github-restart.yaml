---
# WHAT KEEPS ./github.yaml AUTHENTICATED. Read that file's env comment first:
# github-mcp-server takes its credential from an environment variable, an
# environment variable resolves once at container start, and `github-token` is
# an App installation token that dies ~60m later. Nothing in the image, the
# Secret, or Reloader can refresh it in place, so the only lever left is to
# restart the pod more often than the token expires. This is that.
#
# THE OPERATOR'S OWN MECHANISM, not a `kubectl rollout restart`. ToolHive
# publishes `mcpserver.toolhive.stacklok.dev/restarted-at` for exactly this
# (docs/operator/restart-annotation.md) and explicitly discourages deleting the
# StatefulSet by hand -- the operator reads a missing StatefulSet as a failure
# and fights you for it. So this patches the MCPServer and lets the operator
# roll the workload it owns.
#
# WHY */20 AND NOT */30. The Secret is re-minted every 30m against a 60m life,
# so a pod starting at an arbitrary moment picks up a token already up to 30m
# old. With a restart interval R the worst-case age it ever presents is 30 + R,
# and that must stay under 60 -- which puts R strictly below 30m, not at it.
# 20m leaves ~10m of margin for a slow mint or a late CronJob; 30m would leave
# none and would go stale on any jitter at all.
#
# THE COST IS REAL AND IS THE POINT OF THIS COMMENT: a shared backend bounces
# three times an hour, and an in-flight tool call landing inside that window
# fails and has to be retried. That is deliberately preferred over the status
# quo, where this backend is reliably dead an hour after every deploy. The way
# OUT of this trade is a credential that does not expire hourly -- a
# fine-grained PAT in OpenBao would remove the CronJob entirely -- but that
# swaps a short-lived App token for a long-lived static one, which is a
# security call for a human to make, not a fix to slip into a bug PR.
kind: ServiceAccount
apiVersion: v1
metadata:
  name: toolhive-github-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: toolhive-github-restart
rules:
  # `resourceNames` pins this to the ONE MCPServer it exists for. Without it
  # this ServiceAccount could bounce every backend in the group -- openbao,
  # kubernetes, proxmox and the rest -- on a timer, which is a much larger
  # grant than the problem needs.
  #
  # `get` accompanies `patch` because a merge patch against a missing object
  # should fail loudly as a NotFound rather than silently no-op. No `list` or
  # `watch`: this job addresses one object by name and never enumerates.
  - apiGroups: ["toolhive.stacklok.dev"]
    resources: ["mcpservers"]
    resourceNames: ["toolhive-github"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: toolhive-github-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: toolhive-github-restart
subjects:
  - kind: ServiceAccount
    name: toolhive-github-restart
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: toolhive-github-restart
spec:
  schedule: "*/20 * * * *"
  # A restart that did not happen is superseded by the next one 20m later, and
  # two of them overlapping would only fight over the same annotation, so:
  # never run concurrently, and do not let missed runs pile up.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: toolhive-github-restart
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              # Same pinned image the estate's other kubectl CronJobs use
              # (kubernetes/apps/equestria/media/jellyfin/restart.yaml).
              image: bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492
              command:
                - sh
                - -c
                # `date -Iseconds` is what the operator's own documented
                # examples show in this annotation. The VALUE does not matter
                # to the operator beyond being different from last time --
                # it compares against what it last saw -- so a timestamp is
                # chosen for being human-readable in `kubectl get mcpserver
                # -o yaml` when someone is working out why this pod is young.
                - |
                  set -eu
                  kubectl patch mcpserver toolhive-github \
                    --type=merge \
                    -p "{\"metadata\":{\"annotations\":{\"mcpserver.toolhive.stacklok.dev/restarted-at\":\"$(date -Iseconds)\"}}}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
