---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/secret.json
#
# Mirrored from the `database` namespace by emberstack reflector -- the
# source Secret (kubernetes/apps/database/postgres/app/cluster-users.yaml's
# `postgres-superuser` ExternalSecret) already carries
# `reflection-allowed: "true"`, so no change to that file was needed, only
# this pull-side stub. Same pattern as
# kubernetes/apps/equestria/dns/technitium/tailscale-authkey.yaml.
#
# This is the cluster's shared-superuser credential for the estate's one
# CNPG Postgres cluster -- every app's database lives under this one
# instance. Reusing it here (rather than minting a narrower role) means
# postgres-mcp below can read/write/drop ANY app's database, not just
# diagnose one. Granted with eyes open, matching ../agent-debug-rbac/clusterrole.yaml's
# own tone for its highest-risk grants -- David may want to narrow this to
# a purpose-built role on review.
#
# Key name is `uri` (kubernetes/apps/database/postgres/app/user-template.yaml),
# a full connection-string value -- exactly what postgres-mcp's DATABASE_URI
# wants.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: database/postgres-superuser

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# Postgres MCP Pro (github.com/crystaldba/postgres-mcp) -- query analysis,
# index tuning, health checks, and (in unrestricted mode) direct SQL
# execution against the estate's one shared CNPG Postgres cluster. Official
# image `crystaldba/postgres-mcp`, confirmed live via its own README --
# no digest pin yet, add one before merging.
#
# Native Streamable HTTP, NOT stdio -- and this is a workaround, not a
# preference. Under stdio this server crash-looped roughly every five
# minutes (168 restarts in 15h). The trigger is ../agent-tools-mcp's
# VirtualMCPServer: its backend health check probes with `server/discover`,
# the MCP 2026-07-28 ("Modern") method. postgres-mcp pins `mcp[cli]<2.0`
# (crystaldba/postgres-mcp@15c8e333, to dodge a breaking import), and that
# SDK has no such method, so `JSONRPCMessage.model_validate_json` raises a
# pydantic literal_error. Under stdio that exception reaches the lowlevel
# server through the read stream and escapes stdio_server's anyio task
# group, taking the PROCESS down -- the proxy then loses its pipe and
# restarts too. Every other stdio server here survives the same probe; this
# one is alone in being on a Python SDK old enough to die on it.
#
# Under Streamable HTTP the same unparsable request is confined to one
# ASGI request task and answered as a JSON-RPC error rather than killing
# the process. That is the reasoning, NOT a live-verified result -- see the
# PR. It cannot regress anything: the server is at zero availability today.
#
# The real bug is upstream in ToolHive -- vMCP treats `server/discover` as
# "inherently safe, since server/discover has no side effects"
# (pkg/vmcp/client/modern.go), which does not hold for a Legacy stdio
# backend that cannot parse it. Revert to `transport: stdio` once that is
# fixed.
#
# --transport/--streamable-http-host/--streamable-http-port are
# postgres-mcp's own flags (src/postgres_mcp/server.py:569-597); the host
# must be 0.0.0.0, as its default binds localhost only.
#
# --access-mode=unrestricted (full read-write, including arbitrary SQL) --
# matches this rollout's established "full read-write from day one" default
# for agent tooling (kubernetes MCP, pulumi MCP). See ./secret.yaml's header
# for the blast-radius caveat this carries: the credential behind
# DATABASE_URI is the cluster's shared superuser, not a scoped role.
# --access-mode=restricted (read-only, enforces query time limits) is the
# safer alternative if this needs narrowing later.
#
# NO oidcConfigRef/authServerRef -- see ./kubernetes.yaml's
# header. This server joins ../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-postgres
spec:
  image: crystaldba/postgres-mcp:latest
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  groupRef:
    name: agent-tools
  args:
    - "--access-mode=unrestricted"
    - "--transport=streamable-http"
    - "--streamable-http-host=0.0.0.0"
    - "--streamable-http-port=8000"

  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
