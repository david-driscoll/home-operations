---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/secret.json
#
# Mirrored from the `database` namespace by emberstack reflector -- the
# source Secret (kubernetes/apps/database/postgres/app/cluster-users.yaml's
# `postgres-superuser` ExternalSecret) already carries
# `reflection-allowed: "true"`, so no change to that file was needed, only
# this pull-side stub. Same pattern as
# kubernetes/apps/equestria/dns/technitium/tailscale-authkey.yaml.
#
# This is the cluster's shared-superuser credential for the estate's one
# CNPG Postgres cluster -- every app's database lives under this one
# instance. Reusing it here (rather than minting a narrower role) means
# postgres-mcp below can read/write/drop ANY app's database, not just
# diagnose one. Granted with eyes open, matching ../agent-debug-rbac/clusterrole.yaml's
# own tone for its highest-risk grants -- David may want to narrow this to
# a purpose-built role on review.
#
# Key name is `uri` (kubernetes/apps/database/postgres/app/user-template.yaml),
# a full connection-string value -- exactly what postgres-mcp's DATABASE_URI
# wants.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  annotations:
    reflector.v1.k8s.emberstack.com/reflects: database/postgres-superuser

---
# No `yaml-language-server: $schema=` line -- see ./docs.yaml.
#
# DBHub (github.com/bytebase/dbhub), replacing crystaldba/postgres-mcp.
#
# WHY THE SWAP. postgres-mcp could not be made to work in this stack at
# all, for structural reasons rather than a misconfiguration:
#
#   * Its published image is ABANDONED -- `:latest` was last pushed
#     2025-05-16, frozen at v0.3.0. Everything since (streamable-http in
#     Jan 2026, an `mcp[cli]<2.0` pin in Aug 2026) exists only in git and
#     has never shipped as an image.
#   * On stdio it DIED every ~5 minutes: ../agent-tools-mcp's
#     VirtualMCPServer health-checks backends with `server/discover` (MCP
#     2026-07-28), that image's MCP SDK cannot parse the method, and the
#     pydantic error escapes stdio_server's anyio task group and kills the
#     process. 168 restarts in 15h.
#   * On SSE it survived but could not be AGGREGATED: its proxy serves
#     /sse (200) and /messages (400) while vMCP only ever probes /mcp
#     (404). No override exists -- MCPGroup.spec carries nothing but
#     `description`, and vMCP per-workload config is tool filtering only.
#
# stdio dies on the probe, SSE cannot be aggregated, nothing bridges them.
#
# WHY DBHUB. It is the exact shape those failures call for, and both halves
# were checked against the RELEASE TAG rather than the default branch --
# the mistake that produced the SSE attempt:
#
#   * Serves streamable-http on `/mcp` -- literally `app.post("/mcp", ...)`
#     -- the one path vMCP probes.
#   * ADOPTED MCP spec 2026-07-28 in v1.0.0, the very revision whose
#     `server/discover` killed the old server, and serves 2025-era clients
#     on the same endpoint. Dual-era by design.
#   * Its image is alive: 1.2.3 published 2026-09-02, on a cadence of
#     0.24.0 -> 1.2.3 in about six weeks.
#   * MIT, ~3.5k stars, and the official example in Claude Code's own docs
#     for connecting to PostgreSQL over MCP.
#
# CONFIG, verified in src/config/env.ts at tag v1.2.3 (NOT main):
#   * `process.env.DSN` is read before any .env file, so the connection
#     string arrives as it always did -- from the reflected superuser
#     Secret, never in argv where it would surface in the pod spec.
#   * `--readonly` and `--max-rows` were REMOVED and now hard-error with a
#     pointer to a TOML config; do not reintroduce them as flags. Read-only
#     is `readonly = true` under `[[sources]]` in a TOML file. `readonly`
#     is optional in the config type, so omitting it keeps today's
#     read-write behaviour -- deliberate, see below.
#
# Access model is UNCHANGED and still wide: the Secret header above records
# that this is the cluster's shared superuser, so this server can
# read/write/drop ANY app's database. DBHub does make narrowing cheap --
# read-only mode, row limits and query timeouts are first-class -- but
# swapping the server and changing its blast radius are two decisions, and
# this file makes only the first.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-postgres
spec:
  # Pinned to the tag every claim in the header was checked against.
  image: bytebase/dbhub:1.2.3
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8080
  groupRef:
    name: agent-tools
  # `http` is DBHub's own spelling for streamable-http
  # (docs/installation.mdx). Nothing here reads the operator-injected
  # MCP_TRANSPORT, so there is no hyphen/underscore collision to work
  # around as there is for the proxmox servers.
  #
  # --allowed-hosts is REQUIRED here, and its absence is not a soft
  # failure. DBHub ships DNS-rebinding protection that accepts only
  # loopback plus its own pod name by default, and the toolhive proxy
  # reaches the backend through the ClusterIP Service -- so every request
  # arrives with `Host: mcp-toolhive-postgres` and is rejected:
  #
  #   HTTP 403 {"error":"Forbidden","message":"Host
  #   'mcp-toolhive-postgres' is not allowed. Only loopback is permitted
  #   by default; set --allowed-hosts ..."}
  #
  # while the pod sits 1/1 Running and logs a clean startup -- the same
  # "healthy but serving nothing" shape ../docs.yaml warns about.
  #
  # Named explicitly rather than using DBHub's `*` (ALLOW_ANY_HOST): the
  # rebinding threat it guards against is a browser one and does not
  # really apply to a pod-to-pod ClusterIP call, but there is no reason to
  # switch the control off when one hostname covers it. Both the Service
  # short name (what the proxy actually sends) and its FQDN are listed, so
  # this survives a caller that resolves the long form.
  args:
    - "--transport=http"
    - "--port=8080"
    - "--allowed-hosts=mcp-toolhive-postgres,mcp-toolhive-postgres.agents.svc.cluster.local,mcp-toolhive-postgres-headless,mcp-toolhive-postgres-headless.agents.svc.cluster.local"

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: mcp
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
