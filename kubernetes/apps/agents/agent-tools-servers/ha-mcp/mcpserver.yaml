---
# No `yaml-language-server: $schema=` line -- see ../docs.yaml.
#
# ha-mcp (github.com/homeassistant-ai/ha-mcp, ghcr.io/homeassistant-ai/ha-mcp)
# -- Home Assistant's ADMIN surface as MCP tools: integrations and config
# entries, the device/entity/area registries, automations, scripts, scenes,
# helpers, dashboards, history, logs, system health. Around 90 tools.
#
# ALONGSIDE `home-assistant`, NOT INSTEAD OF IT. That toolport server is Home
# Assistant's own /api/mcp, which is Assist: intents over the entities exposed
# to Assist and nothing else -- it can turn a lamp on but cannot say which
# integrations are installed. It stays as the narrow door for controlling
# things. This one is for looking at, and changing, how Home Assistant is set
# up. Both sit in toolport's `home` profile
# (../../toolport/resources/registry.json).
#
# AN MCPServer RUNNING THE IMAGE, same shape as ../teamarr.yaml: ha-mcp speaks
# Streamable HTTP natively at /mcp and keeps nothing that has to live next to
# Home Assistant. Upstream's preferred install is a HACS custom component
# running the whole server inside Home Assistant; that would be config in HA's
# volume rather than in git, so it is not used here.
#
# `ha-mcp-web`, NOT THE IMAGE'S DEFAULT. The image's CMD is `ha-mcp`, which is
# stdio. `ha-mcp-web` is the same server over Streamable HTTP, on 8086 unless
# MCP_PORT says otherwise -- which is also what the operator's own MCP_PORT
# injection says, from `mcpPort` below. It runs with `stateless_http`, so
# there is no session for the proxy to forget (docs/kubernetes/agentboard-mcp.md,
# "toolport never re-initializes"); it still needs its canary in
# ../../toolport/resources/watchdog-canaries.json like every other server.
#
# HOMEASSISTANT_URL is the in-cluster Service, not the public
# https://home.<root domain>: this traffic never leaves the cluster network,
# and it should not depend on the gateway being up. Home Assistant is a
# hostNetwork pod (kubernetes/apps/stargate-command/home-assistant), so the
# Service's endpoint is a node address -- that is expected.
#
# THE TOKEN (./externalsecret.yaml) is a long-lived access token, and ha-mcp
# drives Home Assistant's WebSocket admin commands with it, so THE USER THAT
# OWNS IT MUST BE AN ADMINISTRATOR. If it is not, the read-state tools still
# work and everything touching config entries or the registries answers
# "unauthorized": promote that user in Home Assistant, or seed a token from
# one that is.
#
# WRITES ARE ON, AND SO ARE TWO OF UPSTREAM'S BETA FEATURES, by decision:
#
#   ha_config_set_yaml -- edits configuration.yaml and packages/*.yaml, for
#     the integrations that have no UI or API path. Two-step: the first call
#     returns a diff and a confirm token and writes nothing. Most keys need a
#     Home Assistant restart to apply, and `command_line:` is on its allow-list
#     -- an entry there is a shell command Home Assistant will run.
#   ha_list_files / ha_read_file / ha_write_file / ha_delete_file -- www/,
#     themes/, custom_templates/ and dashboards/ read-write; config YAML, logs
#     and custom_components/ read-only. Writes and deletes have no undo.
#
#   BOTH ACT THROUGH THE `ha_mcp_tools` CUSTOM COMPONENT INSIDE HOME
#   ASSISTANT, which nothing in this repo installs (HACS, custom repository
#   homeassistant-ai/ha-mcp-integration, then add the integration). Until it
#   is installed and loaded these tools answer with install instructions.
#
#   ENABLE_BETA_FEATURES is the master switch: the two sub-flags are ignored
#   without it. It un-gates upstream's other beta sub-flags too (code mode,
#   dashboard screenshots, YAML-managed automations under packages/). Those
#   default to off; code mode, the one that would matter, is pinned off below
#   rather than left to that default.
#
#   IF A YAML EDIT BREAKS STARTUP, Home Assistant comes up in recovery mode
#   without the component, so ha-mcp cannot undo its own edit. The way back
#   in is the code-server sidecar in the Home Assistant pod (the `-code`
#   route), which mounts the same /config.
#
# STILL OFF: code mode (a Python sandbox that can call every other tool), and
# every full-snapshot action -- agents cannot list, create, restore or delete
# a Home Assistant backup. That is ENABLE_SNAPSHOT_ACTIONS and not
# BACKUP_READ_ONLY on purpose: read-only also blocks restoring the PER-EDIT
# backups, which is the undo for everything switched on above.
#
# THE SETTINGS UI IS OFF. ha-mcp serves a web page under the MCP path for
# toggling tools and flags; here it would be unauthenticated and would write
# to an emptyDir. Configuration is the env below.
#
# ha-mcp's OWN STATE DOES NOT PERSIST. ~/.ha-mcp is the /tmp emptyDir, which
# is where it keeps its pre-edit copies of automations, scripts, scenes and
# helpers. They survive until this pod restarts, not longer. The backups
# ha_config_set_yaml takes are different: the component writes those into
# Home Assistant's own config volume.
#
# THE ENDPOINT HAS NO AUTH OF ITS OWN -- upstream's model is a secret URL
# path, which is no secret in a manifest. Reaching either Service this
# creates is being a Home Assistant administrator who can also edit its
# config files, so ./networkpolicy.yaml admits toolport and nothing else.
#
# NO oidcConfigRef/authServerRef -- see ../kubernetes.yaml's
# header. This server joins ../../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-ha-mcp
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:8.6.0@sha256:7426fb169440aff789e4ee942012b03317ba0b68e1d463efa19c37088dddd8bc
  transport: streamable-http
  proxyPort: 8086
  mcpPort: 8086
  groupRef:
    name: agent-tools

  podTemplateSpec:
    # On the pod template, not the Secret: see ../pulumi.yaml for why that is
    # the only place Reloader acts on.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # `mcp` is the operator's fixed container name -- see ../docs.yaml.
        - name: mcp
          command: ["ha-mcp-web"]
          envFrom:
            # HOMEASSISTANT_TOKEN.
            - secretRef:
                name: toolhive-ha-mcp
          env:
            - name: HOMEASSISTANT_URL
              value: http://home-assistant-app.stargate-command.svc.cluster.local:8123
            # The operator runs this as uid 1000 on a read-only root, and the
            # image's home (/home/mcpuser) belongs to uid 999.
            - name: HOME
              value: /tmp
            - name: HA_MCP_DISABLE_SETTINGS_UI
              value: "true"
            # A PyPI lookup on every start, to tell a human to upgrade.
            # Renovate does that here.
            - name: HA_MCP_DISABLE_UPDATE_CHECK
              value: "true"
            # The master switch, then the two features it is on for.
            - name: ENABLE_BETA_FEATURES
              value: "true"
            - name: ENABLE_YAML_CONFIG_EDITING
              value: "true"
            - name: HAMCP_ENABLE_FILESYSTEM_TOOLS
              value: "true"
            # Upstream's defaults as of 8.6.0, pinned so an image bump cannot
            # move them: the diff-then-confirm step stays, code mode stays off.
            - name: ENABLE_YAML_EDIT_CONFIRM
              value: "true"
            - name: ENABLE_CODE_MODE
              value: "false"
            # Full Home Assistant backups: nothing at all, not even listing.
            # Per-edit backups are unaffected.
            - name: ENABLE_SNAPSHOT_ACTIONS
              value: "false"
            - name: ENABLE_SNAPSHOT_DELETE
              value: "false"
          volumeMounts:
            - name: tmp
              mountPath: /tmp

  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      memory: 512Mi
