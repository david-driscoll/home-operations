---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# ha-mcp's Home Assistant token (./mcpserver.yaml reads it with envFrom).
#
# The SAME item and property `toolport-backends` reads for /api/mcp
# (../../toolport/externalsecret.yaml) -- deliberately not a second token, so
# one rotation reaches every consumer. Reloader restarts the ha-mcp pod when
# this Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-ha-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: toolhive-ha-mcp
    creationPolicy: Owner
  data:
    - secretKey: HOMEASSISTANT_TOKEN
      remoteRef:
        key: clusters/equestria/apps/home-assistant/eris-credentials
        property: apikey
