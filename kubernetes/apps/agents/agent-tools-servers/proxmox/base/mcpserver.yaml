---
# No `yaml-language-server: $schema=` line -- see ../../docs.yaml.
#
# ProxmoxMCP-Plus (github.com/RekklesNA/ProxmoxMCP-Plus), one per
# hypervisor. Published image confirmed live:
# ghcr.io/rekklesna/proxmoxmcp-plus:latest -- no digest pin yet, add one
# before merging. Three transport modes exist (stdio via PyPI, native MCP
# HTTP on :8000, or an OpenAPI bridge on :8811 by default); this uses the
# native HTTP mode, same no-stdio-wrapper shape as ../../degoog.yaml -- see
# its header for why that needs no podTemplateSpec command override.
#
# TWO things are needed to start this image in native MCP HTTP mode, and
# the second is a workaround for a genuine incompatibility.
#
# 1. PROXMOX_MCP_MODE=mcp-http. The Dockerfile hardcodes
#    `ENV PROXMOX_MCP_MODE="openapi"` and docker_entrypoint.py picks the
#    process to exec purely from that variable -- it never reads
#    MCP_TRANSPORT. Without it every pod launched the OpenAPI bridge on
#    :8811, which exits without its own PROXMOX_API_KEY.
#
# 2. The command override below. ToolHive's operator sets MCP_TRANSPORT
#    from spec.transport with an unconditional map assignment --
#    `envVars["MCP_TRANSPORT"] = transportType`, in
#    pkg/environment/environment.go:65 -- so it OVERWRITES anything we put
#    in spec.env. The injected value is the CRD's hyphenated
#    `streamable-http`; loader.py upper()s that to `STREAMABLE-HTTP`, and
#    models.py's normalize_transport only maps the UNDERSCORED
#    `STREAMABLE_HTTP` back to `STREAMABLE`. So it fails
#    `Literal["STDIO", "SSE", "STREAMABLE"]` and the server exits.
#
#    This is the exact crash an earlier revision of this file blamed on
#    `PROXMOX_MCP_MODE=mcp-http` itself. It is not that variable's fault:
#    ToolHive's hyphen and ProxmoxMCP-Plus's accepted literals simply do
#    not agree, and NOTHING settable via spec.env can bridge them, because
#    the operator always wins. Exporting the value inside the container,
#    after kubelet has built the environment, is the one place we can.
#    MCP_HOST is exported too -- the operator sets it to the empty string,
#    which the entrypoint's setdefault will not replace.
#
# Worth an upstream issue either way: ProxmoxMCP-Plus normalizing
# `STREAMABLE-HTTP` alongside `STREAMABLE_HTTP` would remove the need for
# this override entirely.
#
# David's explicit scope answer: "Full VM/LXC lifecycle". The project has
# no built-in read-only/write-toggle flag of its own (checked its docs) --
# write scope is controlled entirely by what the underlying Proxmox API
# token itself permits, which is whatever `mainProxmoxCredentials`/
# `alphaSiteProxmoxCredentials` (components/ProxmoxHost.ts) were already
# granted on the Proxmox side. Nothing here narrows that further.
#
# One base, one overlay per hypervisor (../twilight-sparkle, ../celestia,
# ../luna, ../skystar, ../alpha-site) -- the five MCPServers differed only
# in PROXMOX_HOST, so a kustomize JSON6902 patch on that one field replaces
# what used to be five near-identical copies of this whole file.
# PROXMOX_HOST below is a deliberately obvious placeholder; every overlay
# patches it, none use it as-is. PROXMOX_VERIFY_SSL=false -- Proxmox's
# default self-signed cert, not live-verified any host uses anything else.
#
# NO oidcConfigRef/authServerRef -- see
# ../../kubernetes.yaml's header. This server joins
# ../../../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: REPLACE-ME-name
spec:
  image: ghcr.io/rekklesna/proxmoxmcp-plus:latest
  transport: streamable-http
  proxyPort: 8000
  mcpPort: 8000
  groupRef:
    name: agent-tools

  env:
    # Selects native MCP HTTP mode in docker_entrypoint.py. Without this the
    # image defaults to `openapi` and the pod crash-loops. Overlays patch
    # PROXMOX_HOST by index (/spec/env/2/value) -- keep it third.
    - name: PROXMOX_MCP_MODE
      value: mcp-http
    # Kept only so PROXMOX_HOST stays at index 2 for the overlays. The
    # operator overwrites this value; the command override below is what
    # actually sets the transport the app sees.
    - name: MCP_TRANSPORT
      value: STREAMABLE
    - name: PROXMOX_HOST
      value: "REPLACE-ME.invalid"
    - name: PROXMOX_PORT
      value: "8006"
    # true, and it costs nothing: every hypervisor already presents a valid
    # Let's Encrypt cert for its `*.opossum-yo.ts.net` name (verified live
    # 2026-09-04 -- issuers YE1/YE2, and curl from inside this namespace
    # reports ssl_verify_result=0 against all four reachable hosts). So the
    # overlays address hosts by that HOSTNAME rather than by IP: the certs
    # are issued for the name, and an IP would fail hostname verification
    # for no reason. Let's Encrypt is already in the image's trust store,
    # so there is no CA to mount.
    #
    # Upstream now REFUSES verify_ssl=false outright ("Insecure TLS
    # configuration blocked: set proxmox.verify_ssl=true. Only
    # dev_mode=true can allow verify_ssl=false"), and the only escape for
    # this single-host config shape is PROXMOX_DEV_MODE=true -- switching
    # off certificate verification against hosts holding full VM/LXC
    # lifecycle credentials. Not needed. The old `false` here rested on an
    # assumption that Proxmox's default self-signed cert was in play; it
    # is not.
    - name: PROXMOX_VERIFY_SSL
      value: "true"
    # JobStore opens this with sqlite3.connect() during __init__, and the
    # upstream default is the BARE RELATIVE name `proxmox-jobs.sqlite3`,
    # so it lands in the CWD. The operator runs MCP pods with
    # readOnlyRootFilesystem: true regardless of what this file's own
    # securityContext says (see ../../context7.yaml's header for the same
    # trap), so that write fails and the server exits before serving:
    #   sqlite3.OperationalError: unable to open database file
    # There is no flag to disable the job store, only to move it. Pointed
    # at the emptyDir mounted below. Appended LAST on purpose: the overlays
    # patch PROXMOX_HOST by index (/spec/env/2/value), so nothing may be
    # inserted above it.
    - name: PROXMOX_JOBS_SQLITE_PATH
      value: /tmp/proxmox-jobs.sqlite3

  podTemplateSpec:
    # WHY THIS IS ON THE POD TEMPLATE AND NOT THE SECRET. Read
    # ./github.yaml's podTemplateSpec comment for the long version; the
    # short one is that Reloader keys off the WORKLOAD, the StatefulSet
    # that workload refers to belongs to the ToolHive operator, and
    # Reloader falls back to the POD TEMPLATE's annotations when the
    # workload carries none -- which the operator propagates from here.
    #
    # The `reloader.stakater.com/auto` on this file's own ExternalSecret
    # and target Secret does NOT do this. Annotating a Secret is inert on
    # its own; it has been in place all along while every one of these
    # servers ran whatever its Secret held at pod start, forever.
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      # Writable scratch for the job store above. Same emptyDir-at-/tmp
      # pattern as ../../docs.yaml, for the same reason: the operator's
      # read-only root filesystem is not negotiable from here.
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # See point 2 in this file's header. Re-exports the transport
          # literal the app will actually accept, then hands off to the
          # image's own entrypoint so PROXMOX_MCP_MODE still selects the
          # mode.
          command: ["/bin/sh", "-c"]
          args:
            - |
              export MCP_TRANSPORT=STREAMABLE MCP_HOST=0.0.0.0
              exec python -m proxmox_mcp.docker_entrypoint
          envFrom:
            - secretRef:
                name: REPLACE-ME-name
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
