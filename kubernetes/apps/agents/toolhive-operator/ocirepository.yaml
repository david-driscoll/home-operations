---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolhive-operator
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.51.2
    digest: sha256:273b4bf2ce42ac1bfe0e5bc7507b3be0674a685997b0488ed8adf79f620a72c8
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  # Same two facts as ../toolhive-operator-crds/ocirepository.yaml: no cosign
  # signature exists for any chart digest, so there is no `verify:` block, and
  # the digest pin is the real protection.
  #
  # KEEP THIS TAG EQUAL TO THE CRD CHART'S. Upstream publishes the pair at one
  # version, and this chart's `operator.image` default is derived from it --
  # so a bump here without the matching bump next door runs an operator whose
  # controllers register kinds the installed definitions may not describe.
  # Renovate raises them as two separate updates; merge them together.
