---
# No `yaml-language-server: $schema=` line: neither the CRDs-catalog nor
# kubernetes-schemas publishes toolhive.stacklok.dev (both 404 as of 0.44.0 --
# kubernetes-schemas answers 200 with its SPA shell, which is worse than a
# miss). Same treatment as GarageCluster and RenovateJob elsewhere in this repo.
#
# The quickstart's MCP server: ToolHive's own documentation, searchable by an
# agent. It is here as the first real consumer of the operator next door -- an
# operator with no CR does nothing observable, so nothing would prove the
# install works.
#
# What the operator builds from this: a proxy-runner Deployment, a backend
# Deployment for the image below, and a `mcp-toolhive-docs-proxy` Service on
# `proxyPort`. That Service is the only routable surface in this namespace and
# is what ../../toolhive/httproute.yaml points at.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: toolhive-docs
spec:
  image: ghcr.io/stackloklabs/toolhive-doc-mcp:v0.0.18@sha256:92914acf3479a9ffebf3df55718b2478e00e54cdcb5713f2cda4cefa5c856c2b

  # The image speaks Streamable HTTP directly, so `proxyMode` does not apply --
  # that field is read only when transport is `stdio`.
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8080

  # AUTHENTICATION. Both refs are required and they are not interchangeable:
  # `authServerRef` is the ISSUING side (ToolHive's embedded OAuth server, which
  # accepts DCR from MCP clients and federates login to authentik), and
  # `oidcConfigRef` is the ACCEPTING side (how this proxy validates the tokens
  # that server hands back).
  #
  # Dropping `oidcConfigRef` is the dangerous one. The CRD's own words: without
  # it the proxy "runs UNAUTHENTICATED. It accepts every request that can reach
  # its port and forwards it to the MCP server under a synthetic local-user
  # identity." It fails open, quietly, with a healthy-looking pod.
  authServerRef:
    kind: MCPExternalAuthConfig
    name: toolhive
  oidcConfigRef:
    name: toolhive
    # MUST be unique per MCP server -- it is what stops a token minted for one
    # server being replayed against another. Deriving it from the public URL
    # makes that automatic: a second server lands on a different path and so
    # gets a different audience for free.
    audience: https://toolhive.${ROOT_DOMAIN}/mcp
    # The external URL, so the RFC 9728 metadata this proxy publishes names the
    # address clients actually reach rather than the ClusterIP it would default
    # to. Getting this wrong is what makes discovery loop.
    resourceUrl: https://toolhive.${ROOT_DOMAIN}/mcp

  # TLS terminates at Traefik, so without this the proxy would advertise its own
  # scheme and host (http://mcp-toolhive-docs-proxy:8080) in the URLs it hands back to
  # clients rather than the https:// name they actually connected to. Safe only
  # because the sole path to this Service is the Gateway in
  # ../../toolhive/httproute.yaml, which sets X-Forwarded-* itself and overwrites
  # anything a client sent.
  trustProxyHeaders: true

  # The operator runs MCP server pods with a read-only root filesystem, and this
  # image writes its search index under /tmp while answering a query. Without
  # the emptyDir every tool call fails on a read-only filesystem while the pod
  # stays happily Running and Ready.
  podTemplateSpec:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        # `mcp` is the operator's fixed name for the MCP server container; a
        # different name here appends a second container instead of patching
        # this one.
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp

  # Upstream's numbers. This is a small Go search server over a fixed corpus;
  # it does not grow with use.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
