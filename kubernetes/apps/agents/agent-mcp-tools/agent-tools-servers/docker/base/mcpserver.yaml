---
# No `yaml-language-server: $schema=` line -- see ../../docs.yaml.
# (toolhive-docs stayed at the agents/ top level -- see agent-mcp-tools/'s
# own header for why).
#
# mcp-server-docker (github.com/ckreiling/mcp-server-docker, PyPI package
# `mcp-server-docker`) against a Dockge host's existing docker-socket-proxy
# (docker/_common/docker-socket-proxy/compose.yaml -- `tecnativa/docker-socket-proxy:v0.5.0`
# on port 2375, plain TCP, no auth -- already the estate's own trust boundary
# for that host's Docker daemon: EXEC/DELETE/POST/START/STOP/RESTART/PAUSE
# all enabled there today).
#
# David's explicit scope answer for Docker MCP: "inherit the proxy's existing
# scope" -- no additional restriction at the MCP layer, no credential needed
# here at all (the proxy itself is the only gate, and it is unauthenticated
# TCP by design already).
#
# One base, one overlay per host (../celestia, ../luna, ../skystar,
# ../alpha-site) -- the four MCPServers differed only in DOCKER_HOST, so a
# kustomize JSON6902 patch on that one field replaces what used to be four
# near-identical copies of this whole file. DOCKER_HOST below is a
# deliberately obvious placeholder; every overlay patches it, none use it
# as-is.
#
# Each host's DOCKER_HOST value assumes `<host>.driscoll.tech` resolves to
# something reachable from inside the `equestria` cluster -- via the
# cluster's own Tailscale Connector LAN-subnet route, same path every other
# cross-cluster reference in this repo takes. NOT live-verified from inside
# a pod. If this turns out wrong per-host, the fallback is that host's
# internal/tailscale IP directly (see stacks/home/index.ts,
# stacks/gulf-of-mexico/index.ts, stacks/ocracoke/index.ts for the recorded
# addresses).
#
# Same uv-image pattern as ../../unifi-network.yaml --
# see its header for why podTemplateSpec overrides command/args explicitly.
#
# NO oidcConfigRef/authServerRef -- see
# ../../kubernetes.yaml's header. This server joins
# ../../../agent-tools-mcp's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: REPLACE-ME-name
spec:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  env:
    - name: DOCKER_HOST
      value: tcp://REPLACE-ME.invalid:2375

  podTemplateSpec:
    spec:
      volumes:
        - name: uv-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["/usr/local/bin/uv"]
          args: ["tool", "run", "mcp-server-docker"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: uv-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
