---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # target.name deliberately omitted -- kustomize treats it as a REGEX, and
  # a literal `${APP}`-style target breaks that (`$` anchors end-of-string
  # in regex, so it would never match, and the patch silently no-ops --
  # verified live via `kustomize build`), which is why every overlay here
  # matches by `kind` alone instead: exactly one MCPServer per overlay, so
  # it is unambiguous without a name selector.
  #
  # ../base/mcpserver.yaml's `metadata.name` is the literal placeholder
  # `REPLACE-ME-name` -- there is no longer a per-Kustomization `${APP}`
  # Flux substitution to rely on now that all instances share ONE
  # ../../ks.yaml (agent-tools-servers), so each overlay patches both the
  # per-host value AND the resource's own name explicitly.
  - target:
      kind: MCPServer
    patch: |-
      - op: replace
        path: /metadata/name
        value: toolhive-docker-celestia
      - op: replace
        path: /spec/env/0/value
        value: tcp://celestia.driscoll.tech:2375
