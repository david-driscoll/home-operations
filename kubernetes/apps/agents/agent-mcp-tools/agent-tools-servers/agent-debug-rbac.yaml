---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/clusterrole.json
#
# Replaces the `cluster-admin` binding both ../../agentboard/rbac.yaml and
# ./kubernetes.yaml carried when this rollout was first built
# (David's own call, "full read-write from the start" -- narrowed once the
# actual shape of "enough to debug with" was worked out, then widened once
# more through a deliberate item-by-item Q&A on what else that actually
# needs to cover -- see each rule below for what it's for).
#
# Two categories, deliberately asymmetric:
#
#   READ is broad on purpose. `apiGroups: ["*"], resources: ["*"]` covers
#   every CRD in this cluster (toolhive.stacklok.dev, external-secrets.io,
#   cert-manager.io, source/kustomize/helm/notification/image.toolkit.fluxcd.io,
#   pulumi.com, longhorn.io, cnpg.io, gateway.networking.k8s.io, traefik.io,
#   ...) without hand-maintaining a list that goes stale the day a new
#   operator lands. RBAC has no negation, so this ALSO grants read on
#   Secrets and every other core resource -- there is no rule that can carve
#   Secrets back out of a wildcard `resources: ["*"]` match. That is
#   accepted here, not overlooked: this SA already holds one of the most
#   sensitive credentials in the estate directly (../../agentboard's own
#   sops-age mount), and "why is this pod's env wrong" is a routine
#   diagnostic question that needs to read the Secret it comes from.
#
#   WRITE is a curated, per-purpose list -- every rule below exists for a
#   specific, named reason, not a blanket grant on a resource type:
#
#     - pods: create/delete/exec/portforward/log. Debugging needs more than
#       observation -- exec is a live shell inside a running container
#       (functionally code execution as whatever that container runs as,
#       the single most powerful grant here) and create/delete cover
#       spinning up a one-off debug pod or forcing a stuck one's controller
#       to recreate it.
#
#     - Deployments/StatefulSets/DaemonSets: full patch/update, not just
#       their `/scale` subresource -- a real `kubectl rollout restart` or an
#       image-tag bump directly, not routed through git first. This is a
#       genuine GitOps-discipline tradeoff, made deliberately: Flux still
#       owns these objects and will overwrite an out-of-band change on its
#       next reconcile, so a live patch here is a TEMPORARY diagnostic or
#       mitigation action, not a substitute for committing the real fix.
#       No create/delete -- Flux creates and deletes these, and hand-doing
#       either would just have Flux immediately reverse it. ReplicaSets keep
#       the narrower `/scale`-only grant -- nothing manages their full spec
#       directly except their owning Deployment.
#
#     - ConfigMaps: full write, for the same "quick experiment before the
#       real fix lands in git" reasoning as the workload writes above -- and
#       the same caveat: Flux will revert it on the next reconcile.
#
#     - Flux's own CRDs (kustomize/helm/source/notification/image.toolkit.fluxcd.io):
#       patch/update only -- enough for `flux reconcile`/`suspend`/`resume`
#       (both are annotation/spec.suspend patches), not full replace, so
#       there is no path to hand-authoring a Kustomization/HelmRelease from
#       scratch through this grant.
#
#     - PodDisruptionBudgets: delete/patch/update -- the documented recovery
#       for a stuck per-node PDB blocking a Longhorn/Talos drain
#       (tuppr-talos-upgrade-longhorn-im-pdb-drain-block).
#
#     - Longhorn Volumes/Replicas/Engines (longhorn.io): patch/update/delete
#       -- attach/detach-level storage recovery. Higher risk, granted
#       anyway: this estate's own recovery procedures already require
#       operating on these objects directly (see the Longhorn iSCSI/VSC
#       notes), and the alternative is paging David for every one.
#
#     - CNPG Clusters/Backups/ScheduledBackups (postgresql.cnpg.io):
#       patch/update/delete/create -- what the `kubectl cnpg` plugin itself
#       needs for `destroy`/`promote`-style replica recovery, which is this
#       estate's own explicit convention over a manual PVC delete.
#
#     - Jobs (batch): create/delete -- manually re-triggering a stuck/failed
#       Job, or firing a CronJob's spec as a one-off run. CronJobs
#       themselves stay read-only; creating a Job modeled on one does not
#       need write access to the CronJob object.
#
#     - PersistentVolumeClaims: delete, plus the `/resize` subresource --
#       the actual fix for a "volume full" diagnosis, and occasionally
#       outright deletion. Granted with eyes open: this is exactly the class
#       of action that has caused real data loss in this estate before (the
#       StatefulSet PVC retention trap, a VolSync PVC deletion breaking a
#       dataSourceRef) -- there is no RBAC-level guard against repeating
#       either, only care at the point of use.
#
#     - Nodes: patch/update -- cordon/uncordon. Doesn't touch data or
#       running pods directly and is reversible, so it is granted even
#       though nothing above it required node-level access.
#
#   Still NOT granted: Secret writes (every Secret in this estate is either
#   ESO-managed from OpenBao or sops-encrypted in git -- a live write would
#   be silently overwritten or bypass the whole provenance model), RBAC
#   objects, Namespace create/delete, and writing the CRDs (as opposed to
#   their custom resources) themselves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-debug
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets/scale"]
    verbs: ["get", "patch", "update"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["patch", "update"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["delete", "patch", "update"]

  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "replicas", "engines"]
    verbs: ["patch", "update", "delete"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["create", "patch", "update", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/resize"]
    verbs: ["patch", "update"]

  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "update"]
