---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Same `Eris/unifipoller` credential as ../toolhive-unifi-network/externalsecret.yaml
# -- see that file's header for the full reasoning and the `bao kv put` this
# needs run once by hand at its own path before this ExternalSecret goes
# Ready:
#
#   bao kv put secrets/clusters/${CLUSTER_CNAME}/apps/${APP}/credentials \
#     username="..." password="..."
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        UNIFI_PROTECT_USERNAME: "{{ .username }}"
        UNIFI_PROTECT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: third-party-tokens/unifi/unifipoller
        property: username
    - secretKey: password
      remoteRef:
        key: third-party-tokens/unifi/unifipoller
        property: password
