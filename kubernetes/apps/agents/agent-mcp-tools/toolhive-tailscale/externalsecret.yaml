---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# tailscale-mcp-server (github.com/HexSleeves/tailscale-mcp,
# @hexsleeves/tailscale-mcp-server on npm) authenticates with a STATIC
# `TAILSCALE_API_KEY` -- confirmed live via its own README, which documents
# no OAuth-client-credentials support at all.
#
# That is NOT the credential this estate already has. The one Tailscale
# credential in OpenBao today (third-party-tokens/tailscale/pulumi-oauth,
# used by components/tailscale.ts against
# https://api.tailscale.com/api/v2/oauth/token) is an OAuth CLIENT
# ID/SECRET pair, a materially different credential type from a
# `tskey-api-...` API key -- Tailscale has no API to self-mint the latter
# (that would be circular), it has to be created once by hand in the
# admin console (Settings -> Keys -> Generate API access token).
#
#   bao kv put secrets/third-party-tokens/tailscale/api-key key="tskey-api-..."
#
# Same "input, not output, created once by hand" idiom as
# ../../agentboard/externalsecret.yaml's anthropic_key. Flagged the same way
# ../toolhive-home-assistant/mcpremoteproxy.yaml flags its own outgoing-auth
# gap -- this server has NO working credential until that manual step runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TAILSCALE_API_KEY: "{{ .api_key }}"
        # driscoll.tech is this estate's Tailscale tailnet name, per its
        # use throughout components/tailscale.ts -- not independently
        # re-verified against Tailscale's own admin console for this file.
        TAILSCALE_TAILNET: driscoll.tech
  data:
    - secretKey: api_key
      remoteRef:
        key: third-party-tokens/tailscale/api-key
        property: key
