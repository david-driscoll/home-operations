---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/serviceaccount.json
#
# `agent-debug` (../../rbac/clusterrole.yaml), NOT `cluster-admin` -- David's
# own call, narrowed once it was clear what "enough to debug with" actually
# needs; see that file's header for exactly what this grants and why. Same
# role ../../agentboard's own SA binds, deliberately -- one written security
# posture, not two that could quietly drift apart.
#
# `--read-write=true` on ./mcpserver.yaml is still set: it is the MCP
# server's own advertised-capability flag, separate from what this SA can
# actually do -- RBAC is what enforces the boundary now, the flag just
# decides whether the tool surface offers write calls at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${APP}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-debug
subjects:
  - kind: ServiceAccount
    name: ${APP}
    namespace: ${NAMESPACE}
