---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-postgres
  namespace: &namespace agents
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: toolhive-agent-tools
      namespace: agents
    # for ./secret.yaml's reflector pull to have something to pull from --
    # the "postgres" ks is the CNPG Cluster + cluster-users.yaml's
    # ExternalSecret that actually creates the source Secret, not the
    # separate CNPG-operator install.
    - name: postgres
      namespace: database
  path: ./kubernetes/apps/agents/agent-mcp-tools/toolhive-postgres
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
