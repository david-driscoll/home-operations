---
# No `yaml-language-server: $schema=` line -- see ../../toolhive-docs/mcpserver.yaml.
#
# Postgres MCP Pro (github.com/crystaldba/postgres-mcp) -- query analysis,
# index tuning, health checks, and (in unrestricted mode) direct SQL
# execution against the estate's one shared CNPG Postgres cluster. Official
# image `crystaldba/postgres-mcp`, confirmed live via its own README --
# no digest pin yet, add one before merging.
#
# stdio is the package's default transport (`--transport=sse` is the only
# documented alternative, not used here) -- the operator's proxy-runner
# turns it into Streamable HTTP, same as every other stdio-wrapped server
# here. No podTemplateSpec command override needed: the image's own
# ENTRYPOINT already speaks stdio MCP, same shape as
# ../toolhive-kubernetes/mcpserver.yaml's bare image+args.
#
# --access-mode=unrestricted (full read-write, including arbitrary SQL) --
# matches this rollout's established "full read-write from day one" default
# for agent tooling (kubernetes MCP, pulumi MCP). See ./secret.yaml's header
# for the blast-radius caveat this carries: the credential behind
# DATABASE_URI is the cluster's shared superuser, not a scoped role.
# --access-mode=restricted (read-only, enforces query time limits) is the
# safer alternative if this needs narrowing later.
#
# NO oidcConfigRef/authServerRef -- see ../toolhive-kubernetes/mcpserver.yaml's
# header. This server joins ../../toolhive-agent-tools's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ${APP}
spec:
  image: crystaldba/postgres-mcp:latest
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools
  args: ["--access-mode=unrestricted"]

  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
