---
# No `yaml-language-server: $schema=` line -- see ../toolhive-docs/mcpserver.yaml.
#
# NuGet.Mcp.Server (nuget.org/packages/NuGet.Mcp.Server) -- vulnerability
# remediation planning, package upgrade recommendations and supply-chain
# review for NuGet dependencies. Run via `dnx`, .NET 10's "run a tool
# without installing it" command -- NOT `dotnet tool install`, which would
# need a persistent install step this stateless pod has no use for.
#
# `mcr.microsoft.com/dotnet/sdk:10.0`, not the smaller `aspnet`/`runtime`
# images -- `dnx` ships with the SDK only. No digest pin yet -- add one
# before merging.
#
# `transport: stdio`: the package speaks stdio per its own docs (no HTTP
# mode documented) -- the operator's proxy-runner is what turns that into
# Streamable HTTP, same as every other stdio-wrapped server here.
# podTemplateSpec overrides `command`/`args` explicitly rather than relying
# on the SDK image's own ENTRYPOINT/CMD, same reasoning as
# ../toolhive-context7/mcpserver.yaml's header.
#
# No credentials -- per the package's own docs, it uses whatever NuGet
# feeds are configured (nuget.org by default, unmodified here) rather than
# requiring an API key.
#
# NO oidcConfigRef/authServerRef -- see ../toolhive-kubernetes/mcpserver.yaml's
# header. This server joins ../toolhive-agent-tools's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ${APP}
spec:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command: ["dnx"]
          # --yes: dnx prompts interactively to confirm running an
          # unrecognized tool on first use; there is no TTY here to answer it.
          args: ["NuGet.Mcp.Server", "--yes"]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
