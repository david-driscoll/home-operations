---
# No `yaml-language-server: $schema=` line -- see ../toolhive-docs/mcpserver.yaml.
#
# mcp-server-docker (github.com/ckreiling/mcp-server-docker, PyPI package
# `mcp-server-docker`) against skystar's existing docker-socket-proxy
# (docker/_common/docker-socket-proxy/compose.yaml -- `tecnativa/docker-socket-proxy:v0.5.0`
# on port 2375, plain TCP, no auth -- already the estate's own trust boundary
# for this host's Docker daemon: EXEC/DELETE/POST/START/STOP/RESTART/PAUSE
# all enabled there today).
#
# David's explicit scope answer for Docker MCP: "inherit the proxy's existing
# scope" -- no additional restriction at the MCP layer, no credential needed
# here at all (the proxy itself is the only gate, and it is unauthenticated
# TCP by design already).
#
# DOCKER_HOST=tcp://skystar.driscoll.tech:2375 assumes that hostname resolves to something
# reachable from inside the `equestria` cluster -- via the cluster's own
# Tailscale Connector LAN-subnet route, same path every other cross-cluster
# reference in this repo takes. NOT live-verified from inside a pod. If this
# turns out wrong, the fallback is skystar's internal/tailscale IP directly
# (see stacks/home/index.ts, stacks/gulf-of-mexico/index.ts,
# stacks/ocracoke/index.ts for the recorded addresses).
#
# Same uv-image pattern as ../toolhive-unifi-network/mcpserver.yaml -- see
# its header for why podTemplateSpec overrides command/args explicitly.
#
# NO oidcConfigRef/authServerRef -- see ../toolhive-kubernetes/mcpserver.yaml's
# header. This server joins ../toolhive-agent-tools's MCPGroup instead.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ${APP}
spec:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  transport: stdio
  proxyPort: 8080
  proxyMode: streamable-http
  groupRef:
    name: agent-tools

  env:
    - name: DOCKER_HOST
      value: tcp://skystar.driscoll.tech:2375

  podTemplateSpec:
    spec:
      volumes:
        - name: uv-cache
          emptyDir: {}
      containers:
        - name: mcp
          command: ["/usr/local/bin/uv"]
          args: ["tool", "run", "mcp-server-docker"]
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: uv-cache
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
