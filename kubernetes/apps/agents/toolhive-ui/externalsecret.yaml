---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# All six settings the Cloud UI needs, in one Secret consumed via envFrom.
#
# Worth contrasting with ../toolhive/externalsecret.yaml: THIS app is an
# ordinary confidential OIDC web client, so the authentik issuer can just be an
# environment variable and no values-fragment machinery is needed. The MCP proxy
# needed all that only because MCPExternalAuthConfig takes its issuer as a plain
# CRD string.
#
# One value has to be created by hand before this resolves:
#
#   bao kv put secrets/clusters/equestria/apps/toolhive-ui/auth \
#     better_auth_secret="$(openssl rand -base64 32)"
#
# The rest are generated: the `applications` Pulumi stack mints the OIDC client
# from ./definition.yaml and writes it to clusters/<cluster>/apps/toolhive-ui/oidc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-config
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # The authentik issuer, carrying the generated application slug. Same
        # unguessable value the MCP auth server needs -- but here it is just an
        # env var, so it comes straight through.
        OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # Signs better-auth's session cookies. Ephemeral if unset, which would
        # log everyone out on every pod restart -- nightly here, once Low Power
        # sheds this namespace.
        BETTER_AUTH_SECRET: "{{ .auth_better_auth_secret }}"
        # Must match the public origin exactly: better-auth builds its callback
        # URL from this, and a mismatch fails the OAuth exchange rather than the
        # page load, so it looks like an authentik problem.
        BETTER_AUTH_URL: "https://mcp.${ROOT_DOMAIN}"
        # The registry API in ../toolhive-registry. The operator names that
        # Service `<registry-name>-registry-api` and serves it on 8080
        # (RegistryAPIPort in the operator source); in-cluster, so plain HTTP.
        API_BASE_URL: "http://toolhive-registry-registry-api.${NAMESPACE}.svc.cluster.local:8080"
        # Session and account persistence. Optional per the chart, but without
        # it better-auth keeps state in memory and every restart is a forced
        # re-login. The `uri` key is assembled by the postgres component.
        DATABASE_URL: "{{ .postgres_uri }}"
  dataFrom:
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/oidc
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
    - extract:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/auth
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "auth_$1"
    - extract:
        key: '${APP}-postgres'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: database
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
