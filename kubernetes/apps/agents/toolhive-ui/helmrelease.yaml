---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
#
# The ToolHive Cloud UI -- a Next.js app, and the only human-facing surface in
# this namespace. Everything else here is machine-to-machine.
#
# It is a FRONTEND ONLY: all catalogue data comes from the registry API in
# ../toolhive-registry over API_BASE_URL, and it cannot start usefully without
# it. Hence the dependsOn in ks.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app toolhive-ui
spec:
  chartRef:
    kind: OCIRepository
    name: toolhive-cloud-ui
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    # REQUIRED. The chart's fullname helper would otherwise render
    # `toolhive-ui-toolhive-cloud-ui`, renaming the Service that
    # ./httproute.yaml points at.
    fullnameOverride: *app

    replicaCount: 1

    # Every one of the six settings the UI needs is an environment variable, so
    # unlike the auth server next door this app needs no values-fragment
    # gymnastics -- a plain Secret and envFrom is enough. See
    # ./externalsecret.yaml for where each value comes from.
    envFrom:
      - secretRef:
          name: toolhive-ui-config

    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        # Next.js server-side rendering; 256Mi requests is the floor and it can
        # spike on first render after a cold start.
        memory: 1Gi

    # The chart's probes hit `/` on the container port. Left at their defaults
    # except the startup allowance: a Next.js cold start on this cluster is
    # slower than the chart's default assumes, and a too-eager liveness probe
    # turns a slow boot into a crash loop.
    startupProbe:
      httpGet:
        path: /
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30

    # No priorityClassName and no control-plane toleration, matching the rest of
    # this namespace: the UI is developer tooling and sheds with Low Power
    # alongside the operator and the MCP servers it displays.
    tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
