---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
#
# `mcp.${ROOT_DOMAIN}`, deliberately NOT under toolhive.${ROOT_DOMAIN}.
#
# The two hostnames carry different audiences and must not be confused:
#
#   toolhive.<domain>   machines. The MCP endpoint and its OAuth server.
#                       Answers JSON-RPC and 401s with WWW-Authenticate.
#   mcp.<domain>        humans. This UI.
#
# Sharing one hostname would mean path-multiplexing a browser app and an MCP
# endpoint whose own /.well-known/ and /oauth/ paths already occupy the root --
# a collision waiting to happen for no gain, since a second single-label name
# costs nothing under the existing wildcard certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
spec:
  parentRefs:
    - name: internal
      namespace: network
      kind: Gateway
  hostnames:
    - "mcp.${ROOT_DOMAIN}"
  rules:
    - backendRefs:
        - name: ${APP}
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # `local-user`, not `local-api` -- the opposite of the MCP route
            # next door, and for the opposite reason. This app renders HTML to a
            # browser, so the error-pages middleware in this chain is an
            # improvement rather than a hazard. The app does its own authentik
            # login, so no forward-auth outpost here either.
            name: local-user
