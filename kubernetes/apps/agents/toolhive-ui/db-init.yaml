---
# ONE-TIME SCHEMA BOOTSTRAP for better-auth's Postgres tables.
#
# stacklok/toolhive-cloud-ui (the chart backing ./helmrelease.yaml, and now an
# ARCHIVED repo) ships no migration mechanism at all for a Kubernetes/Helm
# deployment: `helm/templates/` is only Deployment/Service/HPA/ServiceAccount,
# there is no initContainer or CLI baked into the production image (its
# node_modules is pruned to runtime deps -- no `@better-auth/cli`, no
# `.bin/better-auth`), and the app does not auto-create tables on boot; it just
# runs whatever queries better-auth issues against whatever already exists.
# The ONLY place this schema is defined anywhere upstream is
#   https://github.com/stacklok/toolhive-cloud-ui/blob/main/db/init.sql
# and that is wired exclusively into `docker-compose.yaml`'s local Postgres
# container via `/docker-entrypoint-initdb.d/` -- a stock-`postgres`-image
# first-run convention with no Kubernetes equivalent. Confirmed against
# upstream source; no GitHub issue acknowledges the gap.
#
# Discovered 2026-08-29: sign-in at toolhive.agents.${ROOT_DOMAIN} 500'd on
# every attempt with `relation "verification" does not exist`. The database
# ./externalsecret.yaml points DATABASE_URL at had sat with ZERO tables since
# this app was first deployed in PR #1186 -- whose own "what is not verified"
# section flagged that the first OIDC login was never actually exercised.
# `/signin` itself always answered 200 (Gatus's check, and Next.js serving the
# page needs no DB), which is why the pod looked perfectly healthy throughout.
#
# This Job applies that same upstream DDL by hand, verbatim, with
# `IF NOT EXISTS` on every statement so it is safe to leave in place forever --
# an ordinary Flux reconcile just finds an unchanged Job and does nothing.
# Two things it will NOT do:
#   - Re-run on a future edit to the SQL below: Job.spec.template is immutable,
#     so `kubectl delete job toolhive-ui-db-init -n agents` first, then let
#     Flux recreate it.
#   - Notice if this database is ever wiped and recreated: same fix, delete the
#     Job by hand to force a re-run.
#
# Connects as DATABASE_URL from ../externalsecret.yaml -- the `toolhive-ui` app
# role from components/postgres, which already owns the `public` schema here
# -- so, unlike the manual fix applied live on 2026-08-29 (which connected as
# the postgres superuser and needed a follow-up `ALTER TABLE ... OWNER TO`),
# tables created by this Job land correctly owned from the start.
apiVersion: batch/v1
kind: Job
metadata:
  name: toolhive-ui-db-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          # A psql CLIENT. NOT postgres:18-alpine (what upstream's own
          # docker-compose.yaml uses to serve this exact schema) -- that
          # digest 404'd pulling from docker.io on this cluster despite
          # resolving fine externally, worth another look if it recurs.
          # cloudnative-pg's own server image is already resident on every
          # node that runs Postgres, ships full client tools, and happens to
          # match the CNPG cluster's version exactly (18.6) -- see
          # ../../../database/postgres/*.yaml for where that pin lives.
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:c7266a7dcc2a0ae3f8089ff0361af07f57ab3bfe6822cc5633793a7139cc7cd6
          envFrom:
            - secretRef:
                name: toolhive-ui-config
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for the toolhive-ui database..."
              until psql "$DATABASE_URL" -c 'SELECT 1' >/dev/null 2>&1; do
                echo "Database not reachable yet, waiting..."
                sleep 5
              done

              echo "Applying better-auth schema (idempotent)..."
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              -- Verbatim from https://github.com/stacklok/toolhive-cloud-ui/blob/main/db/init.sql
              CREATE TABLE IF NOT EXISTS "user" (
                  "id" TEXT PRIMARY KEY,
                  "name" TEXT NOT NULL,
                  "email" TEXT NOT NULL UNIQUE,
                  "emailVerified" BOOLEAN NOT NULL DEFAULT FALSE,
                  "image" TEXT,
                  "createdAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  "updatedAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS "session" (
                  "id" TEXT PRIMARY KEY,
                  "expiresAt" TIMESTAMP NOT NULL,
                  "token" TEXT NOT NULL UNIQUE,
                  "createdAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  "updatedAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  "ipAddress" TEXT,
                  "userAgent" TEXT,
                  "userId" TEXT NOT NULL REFERENCES "user"("id") ON DELETE CASCADE
              );

              CREATE TABLE IF NOT EXISTS "account" (
                  "id" TEXT PRIMARY KEY,
                  "accountId" TEXT NOT NULL,
                  "providerId" TEXT NOT NULL,
                  "userId" TEXT NOT NULL REFERENCES "user"("id") ON DELETE CASCADE,
                  "accessToken" TEXT,
                  "refreshToken" TEXT,
                  "idToken" TEXT,
                  "accessTokenExpiresAt" TIMESTAMP,
                  "refreshTokenExpiresAt" TIMESTAMP,
                  "scope" TEXT,
                  "password" TEXT,
                  "createdAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  "updatedAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS "verification" (
                  "id" TEXT PRIMARY KEY,
                  "identifier" TEXT NOT NULL,
                  "value" TEXT NOT NULL,
                  "expiresAt" TIMESTAMP NOT NULL,
                  "createdAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  "updatedAt" TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );

              CREATE INDEX IF NOT EXISTS "session_userId_idx" ON "session"("userId");
              CREATE INDEX IF NOT EXISTS "account_userId_idx" ON "account"("userId");
              CREATE INDEX IF NOT EXISTS "account_providerId_idx" ON "account"("providerId");
              CREATE INDEX IF NOT EXISTS "verification_identifier_idx" ON "verification"("identifier");
              SQL

              echo "Schema present."
