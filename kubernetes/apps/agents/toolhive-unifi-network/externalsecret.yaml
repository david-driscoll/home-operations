---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The SAME `Eris/unifipoller` credential the repo's own .mcp.json already
# authenticates all three unifi-*-mcp servers with locally (`op run --
# uvx unifi-network-mcp`, etc.) -- copied once into OpenBao rather than
# re-derived, so this and every other consumer rotate together:
#
#   bao kv put secrets/clusters/${CLUSTER_CNAME}/apps/${APP}/credentials \
#     username="..." password="..."
#
# Reusing that account is the pragmatic default, not a forced one -- a
# dedicated cluster-only UniFi credential is a reasonable follow-up if the
# blast radius of extending it here is unwelcome.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        UNIFI_NETWORK_USERNAME: "{{ .username }}"
        UNIFI_NETWORK_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: clusters/${CLUSTER_CNAME}/apps/${APP}/credentials
        property: password
