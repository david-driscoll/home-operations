---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: toolhive-operator-crds
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.44.0
    digest: sha256:73d48d9343658ada84f99665b7539296a66a1bba5db3af3299c21512ff8610e1
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds
  # NO `verify:` BLOCK. Checked at 0.44.0 before writing this: the chart
  # repository carries 41 cosign `sha256-<digest>.sig` tags, but NONE of them
  # matches a chart digest -- 0.30.0, 0.40.0, 0.42.0, 0.43.0 and 0.44.0 are all
  # unsigned, and the referrers index for 0.44.0 is empty. A `verify:` block
  # would fail every pull with "no matching signatures" rather than protecting
  # anything.
  #
  # The digest pin above is what actually protects this pull: the tag can move,
  # the digest cannot. Renovate keeps it in step -- `flux.pinDigests` is false
  # in .github/renovate.json5 so it will never ADD a digest, but the flux
  # manager does rewrite an existing `ref.digest` alongside `ref.tag` on a
  # version bump. Re-check for a real signature when bumping.
