---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/clusterrole.json
#
# ITS OWN KUSTOMIZATION, moved out of ../agent-tools-servers 2026-08-30 --
# it used to be one resource bundled in there alongside every MCPServer. The
# problem that caused: ../agent-tools-servers's Kustomization is `wait:
# true`, which health-checks its ENTIRE inventory, so one perpetually
# crash-looping MCPServer (of two dozen -- a bad DNS name, an invalid config
# literal, a missing upstream credential, any one of them) kept the whole
# Kustomization from ever reporting Ready. ../agentboard depends on it
# SOLELY for this ClusterRole existing, so that one flaky backend was
# silently blocking agentboard from ever deploying at all -- confirmed live,
# for hours, alongside the near-identical ../agent-tools-mcp/ks.yaml
# `healthCheckExprs` fix landed in the same change. Splitting this out means
# agentboard's dependency is on an object that only two possible things can
# ever make unhealthy: a real RBAC schema problem, or the Kustomization
# controller itself -- not the operational health of every MCP server in
# the namespace.
#
# Replaces the `cluster-admin` binding both ../agentboard/rbac.yaml and
# ../agent-tools-servers/kubernetes.yaml carried when this rollout was first
# built (David's own call, "full read-write from the start" -- narrowed once
# the actual shape of "enough to debug with" was worked out, then widened
# once more through a deliberate item-by-item Q&A on what else that actually
# needs to cover -- see each rule below for what it's for).
#
# Two categories, deliberately asymmetric:
#
#   READ is broad on purpose. `apiGroups: ["*"], resources: ["*"]` covers
#   every CRD in this cluster (toolhive.stacklok.dev, external-secrets.io,
#   cert-manager.io, source/kustomize/helm/notification/image.toolkit.fluxcd.io,
#   pulumi.com, longhorn.io, cnpg.io, gateway.networking.k8s.io, traefik.io,
#   ...) without hand-maintaining a list that goes stale the day a new
#   operator lands. RBAC has no negation, so this ALSO grants read on
#   Secrets and every other core resource -- there is no rule that can carve
#   Secrets back out of a wildcard `resources: ["*"]` match. That is
#   accepted here, not overlooked: this SA already holds one of the most
#   sensitive credentials in the estate directly (../agentboard's own
#   sops-age mount), and "why is this pod's env wrong" is a routine
#   diagnostic question that needs to read the Secret it comes from.
#
#   WRITE is a curated, per-purpose list -- every rule below exists for a
#   specific, named reason, not a blanket grant on a resource type:
#
#     - pods: create/delete/exec/portforward/log. Debugging needs more than
#       observation -- exec is a live shell inside a running container
#       (functionally code execution as whatever that container runs as,
#       the single most powerful grant here) and create/delete cover
#       spinning up a one-off debug pod or forcing a stuck one's controller
#       to recreate it.
#
#     - Deployments/StatefulSets/DaemonSets: full patch/update, not just
#       their `/scale` subresource -- a real `kubectl rollout restart` or an
#       image-tag bump directly, not routed through git first. This is a
#       genuine GitOps-discipline tradeoff, made deliberately: Flux still
#       owns these objects and will overwrite an out-of-band change on its
#       next reconcile, so a live patch here is a TEMPORARY diagnostic or
#       mitigation action, not a substitute for committing the real fix.
#       No create/delete -- Flux creates and deletes these, and hand-doing
#       either would just have Flux immediately reverse it. ReplicaSets keep
#       the narrower `/scale`-only grant -- nothing manages their full spec
#       directly except their owning Deployment.
#
#     - ConfigMaps: full write, for the same "quick experiment before the
#       real fix lands in git" reasoning as the workload writes above -- and
#       the same caveat: Flux will revert it on the next reconcile.
#
#     - Flux's own CRDs (kustomize/helm/source/notification/image.toolkit.fluxcd.io):
#       patch/update only -- enough for `flux reconcile`/`suspend`/`resume`
#       (both are annotation/spec.suspend patches), not full replace, so
#       there is no path to hand-authoring a Kustomization/HelmRelease from
#       scratch through this grant.
#
#     - PodDisruptionBudgets: delete/patch/update -- the documented recovery
#       for a stuck per-node PDB blocking a Longhorn/Talos drain
#       (tuppr-talos-upgrade-longhorn-im-pdb-drain-block).
#
#     - Longhorn Volumes/Replicas/Engines (longhorn.io): patch/update/delete
#       -- attach/detach-level storage recovery. Higher risk, granted
#       anyway: this estate's own recovery procedures already require
#       operating on these objects directly (see the Longhorn iSCSI/VSC
#       notes), and the alternative is paging David for every one.
#
#     - CNPG Clusters/Backups/ScheduledBackups (postgresql.cnpg.io):
#       patch/update/delete/create -- what the `kubectl cnpg` plugin itself
#       needs for `destroy`/`promote`-style replica recovery, which is this
#       estate's own explicit convention over a manual PVC delete.
#
#     - Jobs (batch): create/delete -- manually re-triggering a stuck/failed
#       Job, or firing a CronJob's spec as a one-off run. CronJobs
#       themselves stay read-only; creating a Job modeled on one does not
#       need write access to the CronJob object.
#
#     - Pulumi Updates/Workspaces (auto.pulumi.com): delete -- the only way
#       out of a Stack deadlocked on an Update whose Flux artifact no longer
#       exists (see the rule for the 2026-09-15 case). Both are operator-
#       created side effects rebuilt on the next reconcile, not desired
#       state.
#
#     - Pulumi Stacks (pulumi.com): patch/update, narrowed by
#       ./stack-reconcile-only.yaml to ONE annotation,
#       `pulumi.com/reconciliation-request` -- the documented way to re-run a
#       Stack the operator has marked Stalled. Everything else about a Stack
#       stays exactly as Flux rendered it.
#
#     - PersistentVolumeClaims: delete, plus the `/resize` subresource --
#       the actual fix for a "volume full" diagnosis, and occasionally
#       outright deletion. Granted with eyes open: this is exactly the class
#       of action that has caused real data loss in this estate before (the
#       StatefulSet PVC retention trap, a VolSync PVC deletion breaking a
#       dataSourceRef) -- there is no RBAC-level guard against repeating
#       either, only care at the point of use.
#
#     - Nodes: patch/update -- cordon/uncordon, and ONLY that since
#       2026-09-21: RBAC cannot say "only spec.unschedulable", so
#       ./node-cordon-only.yaml's ValidatingAdmissionPolicy does. See the
#       rule below.
#
#   Still NOT granted: Secret writes (every Secret in this estate is either
#   ESO-managed from OpenBao or sops-encrypted in git -- a live write would
#   be silently overwritten or bypass the whole provenance model), RBAC
#   objects, Namespace create/delete, and writing the CRDs (as opposed to
#   their custom resources) themselves.
#
#   One qualification on that first item, added with the ExternalSecret rule
#   below: patching an ExternalSecret is not a Secret write, but it is
#   adjacent, because an ExternalSecret's spec decides what ESO materialises.
#   See that rule for the reasoning and the bound.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-debug
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets/scale"]
    verbs: ["get", "patch", "update"]
  # `kubectl scale` and HPA-style clients go through the /scale subresource,
  # which is a separate RBAC resource from the object itself: the full
  # patch/update grant on Deployments above does NOT cover it. Added
  # 2026-09-15 when the authentik VIP failover test needed
  # `scale deploy authentik-server --replicas=0` and the MCP's SA got
  # "cannot ... deployments/scale". Same verbs as the ReplicaSet grant.
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["patch", "update"]

  # ExternalSecrets: patch/update only -- the `force-sync` annotation, which is
  # this estate's OWN documented recovery for a stuck credential
  # (kubernetes/components/postgres/ks.yaml, step 4 of the new-app runbook):
  #
  #   kubectl -n database annotate externalsecret ${APP}-postgres \
  #     force-sync=$(date +%s) --overwrite
  #
  # Same shape, and same narrow verbs, as the Flux CRD grant above: enough to
  # poke a controller into re-resolving, not enough to author an object from
  # scratch. No create/delete -- Flux renders these.
  #
  # WHY IT IS NEEDED. A brand-new app with `components/postgres` races Pulumi
  # for its OpenBao static role, and the loser is the app's `<app>-env`
  # ExternalSecret, which can sit on a cached `Secret does not exist` long after
  # the credential appears -- pod stuck in CreateContainerConfigError, and the
  # runbook's fix unavailable to the agent diagnosing it. That happened on
  # 2026-09-15 with `jellyfin-pg` (#1761): every other layer recovered on its
  # own and the app-side ExternalSecret did not.
  #
  # ⚠️ THIS IS A REAL, IF NARROW, PRIVILEGE INCREASE, and the file's own
  # "Secret writes are not granted" line deserves the qualification. Rewriting
  # an ExternalSecret's `spec` can point it at a different provider key and
  # materialise that value into a Secret -- so this is indirect read access to
  # whatever the referenced store's policy allows, not merely an annotation
  # poke. It is accepted for two reasons: the READ grant above already covers
  # every Secret in the cluster, so nothing already mirrored into Kubernetes
  # becomes newly visible; and the blast radius is bounded by the
  # ClusterSecretStore's own OpenBao policy rather than by this role. What it
  # deliberately still does NOT grant is writing a Secret directly -- ESO
  # remains the only writer, and provenance still runs back to OpenBao.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["patch", "update"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["delete", "patch", "update"]

  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "replicas", "engines"]
    verbs: ["patch", "update", "delete"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["create", "patch", "update", "delete"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]

  # Pulumi Operator Updates/Workspaces: delete. The documented way out of a
  # stuck stack, and the reason this rule exists -- on 2026-09-15 the
  # `equestria` Stack deadlocked with `currentUpdate` pinned to a commit whose
  # Flux artifact source-controller no longer served, so the Workspace's
  # `fetch` init container failed `unable to fetch flux artifact: file not
  # found` on a loop while the Stack controller waited for a Workspace that
  # could never become ready. Nothing but deleting the Update breaks that, and
  # an agent that can diagnose it in full could not act on it.
  #
  # Narrow on purpose. An Update is a RECORD OF AN ATTEMPT, not desired state:
  # the operator recreates one from the Stack on the next reconcile, so
  # deleting it re-plans against the current commit rather than discarding
  # configuration. Same for a Workspace, which is a pod-shaped side effect the
  # Stack owns. Deleting one that IS mid-`pulumi up` cancels that run -- the
  # cost is a partially-applied update the next run reconciles, which is the
  # same exposure as the pod delete grant above.
  #
  # No `create` -- the operator creates these.
  - apiGroups: ["auto.pulumi.com"]
    resources: ["updates", "workspaces"]
    verbs: ["delete"]

  # Pulumi Stacks: patch/update -- for the `pulumi.com/reconciliation-request`
  # annotation and NOTHING else, which ./stack-reconcile-only.yaml enforces;
  # this grant ships in the same Kustomization as its limit, like `nodes`.
  #
  # WHY IT IS NEEDED. After three failed `up`s the operator marks a Stack
  # Stalled -- "not retrying until the spec or source changes" -- and waits
  # for the next commit or for that annotation. The estate's own new-app
  # runbook depends on it: kubernetes/components/postgres/ks.yaml, step 3,
  #
  #   kubectl annotate stack -n pulumi system \
  #     pulumi.com/reconciliation-request=$(date +%s) --overwrite
  #
  # because the `system` stack reliably loses the race with CNPG for a new
  # app's login role and stalls. 2026-09-26, supersync (#2108): the agent
  # watching the rollout diagnosed exactly that, confirmed the DatabaseRole
  # had applied, and was then refused the one-line recovery -- "cannot update
  # resource stacks" -- and had to hand it back to David.
  #
  # WHY `update` AND NOT JUST `patch`. Same as `nodes` below: mkp 0.4.3's
  # apply_resource is a GET then a full PUT, so `update` is the only verb that
  # authorises an mkp annotation. `kubectl annotate` is a PATCH.
  #
  # WHY THE POLICY IS NOT OPTIONAL. Unnarrowed, `update` on `stacks` would let
  # this SA rewrite a Stack's spec: its program directory, its envRefs and
  # secretsRef (which Secrets the operator injects into a `pulumi up` running
  # with the estate's OpenBao AppRole, 1Password and cloud credentials), its
  # workspace image. That is "author a Pulumi run", which the header rules out
  # for the same reason it rules out authoring a Kustomization.
  - apiGroups: ["pulumi.com"]
    resources: ["stacks"]
    verbs: ["patch", "update"]

  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/resize"]
    verbs: ["patch", "update"]

  # Nodes: patch/update, for cordon/uncordon -- and narrowed to exactly that
  # by ./node-cordon-only.yaml, which ships in this same Kustomization so the
  # grant can never be live without its limit.
  #
  # WHY `update` AND NOT JUST `patch`. The agent's Kubernetes MCP is Stacklok
  # `mkp` 0.4.3 (../agent-tools-servers/kubernetes.yaml), which has no patch
  # tool, and whose `apply_resource` is not server-side apply: at
  # pkg/k8s/client.go @ v0.4.3 an existing object is written with
  # `dynamicClient...Update(ctx, obj, UpdateOptions{})` -- a full PUT. An mkp
  # cordon is therefore GET the Node, set spec.unschedulable, PUT the whole
  # object back, and `update` is the only verb that authorises it. `patch` is
  # for every other client (`kubectl cordon`/`uncordon` are strategic-merge
  # PATCHes).
  #
  # WHY IT NEEDED NARROWING. This rule dates from the 2026-08-30 split
  # (#1336), granted on the one-line reasoning in the header ("reversible,
  # doesn't touch data"). That is true of cordon; it is not true of what
  # `update` on `nodes` actually allows, which is rewriting the whole Node --
  # labels every nodeSelector and Longhorn's disk placement key off, taints
  # (a NoExecute taint evicts everything intolerant on the node at once),
  # podCIDR(s), providerID. RBAC has no field-level form, so the VAP compares
  # the request's object against the stored one and denies any difference
  # outside spec.unschedulable, for the two identities bound to this role.
  #
  # THE CASE THAT SURFACED IT. 2026-09-21: the agent diagnosed `shining-armor`
  # as a node whose pods cannot reach the apiserver ClusterIP 10.196.0.1:443
  # -- 9 of 9 nightly Job failures on that node, 0 of 7 anywhere else -- and
  # the zero-cost confirmation was cordoning it before the 02:30 UTC CronJob
  # run. Same argument as the auto.pulumi.com rule above: an agent that can
  # diagnose a fault in full should be able to take the one reversible action
  # that confirms it. Reaching for this grant to do that is what showed it
  # was "rewrite any Node", not "cordon one".
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "update"]
