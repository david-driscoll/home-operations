---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app matter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostNetwork: true
          # Tier 1: must survive a Battery window, when the workers are off and the
          # control planes carry the taint (§4). app-template renders
          # controllers.<name>.pod.tolerations into the pod spec.
          # Added after §8 Stage 2 found this workload Pending on a cordoned cluster.
          # See docs/cluster-consolidation/20-low-power-tier.md §4.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: 8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
              pullPolicy: IfNotPresent

            env:
              TZ: "${TIMEZONE}"
              MATTER_SERVER__INSTANCE_NAME: ${APP}
              MATTER_SERVER__PORT: &wsPort 5580
              MATTER_SERVER__APPLICATION_URL: &host matter.sgc.${ROOT_DOMAIN}
              MATTER_SERVER__LOG_LEVEL: debug

            resources:
              requests:
                cpu: 50m
                memory: "256Mi"
              limits:
                # cpu: 100m
                memory: "2Gi"

    defaultPodOptions:
      securityContext:
        runAsUser: 0 # Must be run as root user
        runAsGroup: 0
        runAsNonRoot: false # Must be run as root user
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups:
          - 34
      # hostNetwork is DELIBERATE and load-bearing. Do not "modernise" this to a
      # Multus ipvlan LAN attachment the way jellyfin and plex were -- that was
      # investigated for this workload and rejected on evidence. See
      # docs/lan-attach/README.md "Stage 2".
      #
      # Measured on the running pod, matter is joined on the LAN NIC to
      # 224.0.0.251 (mDNS v4) and ff02::fb (mDNS v6) and binds 5353 on both
      # stacks. Its IPv6 need is link-local only -- this network has no routable
      # IPv6 at all, every interface carries just fe80::/64 -- so link-local was
      # never the blocker.
      #
      # The blocker is that an ipvlan attachment ADDS a second interface rather
      # than replacing eth0, and the server then has to pick one. The documented
      # lever is `--primary-interface`, and the most recent report of it
      # (home-assistant/core#152848, Oct 2025) says plainly: "the parameter is
      # ignored and it still binds useless interface enp1s0". That issue was
      # closed `not_planned` by a stale bot, not fixed. Betting commissioned
      # Matter fabrics on an unproven flag is not worth the tidier pod spec.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    service:
      *app :
        controller: *app
        type: LoadBalancer
        # annotations:
        #   io.cilium/lb-ipam-ips: "${AUTOMATION_VIP}"
        externalIPs:
          - "${AUTOMATION_VIP}"
        ports:
          ws:
            protocol: TCP
            port: *wsPort
            primary: true
        externalTrafficPolicy: Cluster

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - *host
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: *app
                port: *wsPort

    persistence:
      data:
        existingClaim: ${APP}
