# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant

spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
          # critical-tier, not system-cluster-critical: this is an application pod,
          # and the Kubernetes system-reserved class let it preempt genuine
          # control-plane components on a 4-core node. See
          # docs/cluster-consolidation/20-low-power-tier.md §4.
          priorityClassName: critical-tier
          # Tier 1: must survive a Battery window, when the workers are off and the
          # control planes carry the taint (§4). app-template renders
          # controllers.<name>.pod.tolerations into the pod spec.
          # Added after §8 Stage 2 found this workload Pending on a cordoned cluster.
          # See docs/cluster-consolidation/20-low-power-tier.md §4.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        initContainers:
          fix-permissions:
            image:
              repository: alpine
              tag: 3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              pullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                echo "Resetting permissions on /config to 0777";
                if [ -d /config ]; then
                  chmod -R 0777 /config || true
                else
                  echo "/config not found";
                fi
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.0@sha256:f795a47fa14a5b109cc524b7f7e8b3d9ab95665d0482d9a11b794b6ad8425baa
              pullPolicy: IfNotPresent
            env:
              HASS_HTTP_TRUSTED_PROXY_1: "${CLUSTER_NETWORK}"
              HASS_HTTP_TRUSTED_PROXY_2: "${SERVICE_NETWORK}"
              HASS_EXTERNAL_URL: "https://home.${ROOT_DOMAIN}"
              TZ: "${TIMEZONE}"
            resources:
              requests:
                memory: 1Gi
                # Was 200m. cgroup CPU shares are proportional to the request,
                # so at 200m Home Assistant sat near the back of the queue on a
                # node that spikes to 95% during Pulumi runs -- which is exactly
                # when a HomeKit camera stream stalls and iOS gives up on it.
                # This is a floor that keeps it competitive under contention,
                # not a reservation of the peak.
                cpu: 2
              limits:
                # Still no cpu limit on purpose: CPU is compressible, so this
                # takes spare capacity and throttles proportionally under
                # contention rather than being capped while cores sit idle.
                memory: 2Gi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &app-port 8123
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *app-port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *app-port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3

          code:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
            env:
              TZ: ${TIMEZONE}
              HOME: /home/coder
              USER: coder
              GIT_SSH_COMMAND: ssh -i /home/coder/.ssh/id_rsa -o IdentitiesOnly=yes
            args:
              - --auth
              - none
              - --user-data-dir
              - /config/.vscode
              - --extensions-dir
              - /config/.vscode
              - --port
              - "8888"
              - /config
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      # hostNetwork is DELIBERATE and load-bearing. Do not "modernise" this to a
      # Multus ipvlan LAN attachment the way jellyfin and plex were -- that was
      # investigated for this workload and rejected on evidence. See
      # docs/lan-attach/README.md "Stage 3".
      #
      # Measured on the running pod, HA is joined on the LAN NIC to
      # 224.0.0.251 + ff02::fb (mDNS) and 239.255.255.250 + ff02::c (SSDP), and
      # binds 5353, 1900, 8123, 8888, the HomeKit bridges (21063-21065) and the
      # accessory-mode cameras (21070-21073).
      #
      # An ipvlan attachment cannot replace this, because it ADDS a second
      # interface rather than replacing eth0 -- Cilium stays the default CNI, so
      # the pod would hold both the pod network and the LAN. HA's zeroconf then
      # has to choose, and home-assistant/core#132288 closes with the reporter
      # confirming exactly the wrong choice: "it was indeed only using the eth0
      # by default instead of the other interface that is the macvlan". The
      # mitigation (`advertise_ip` / `ip_address` on the HomeKit entry) lives in
      # HA's own config, not in git, so it would not be reproducible from this
      # repo -- and getting it wrong re-advertises every HomeKit accessory and
      # camera on an unreachable 10.206.x.x.
      #
      # hostNetwork gives this pod ONE coherent view of the network, which is
      # why every upstream doc specifies host networking for HomeKit and SSDP.
      hostNetwork: true
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: true

    service:
      app:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *app-port
      code:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: &code-port 8888

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "home.${ROOT_DOMAIN}"
          - "${APP}.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *app-port

      code-internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}-code.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: code
                port: *code-port

    persistence:
      config:
        existingClaim: ${APP}
      deploy-key:
        type: secret
        name: home-assistant-ssh
        defaultMode: 256
        globalMounts:
          - path: /home/coder/.ssh/
            readOnly: true
      config-cache:
        type: emptyDir
        globalMounts:
          - path: /config/.venv
      config-logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      config-tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
