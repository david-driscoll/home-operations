---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant
  namespace: &namespace stargate-command
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/stargate-command/home-assistant
  prune: true
  # Kept deliberately, NOT migration-sweep scaffolding. This namespace runs the
  # live home-automation stack (Home Assistant, Mosquitto, Matter, chrony) and
  # its fate is decided in piece 22, not here. Until then a Kustomization
  # ownership change must never be able to cascade-delete it.
  # See docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: kube-system-priority-class
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
    - name: sgc-secrets
      namespace: *namespace
    - name: mosquitto
      namespace: *namespace
    - name: external-secrets
      namespace: kube-system
    - name: tailscale-operator
      namespace: tailscale-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/failover/fast-node-eviction
    - ../../../components/volsync
    - ../../../components/tailscale
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 40Gi
      # Tier-1 (piece 12 Group B): must survive low-power mode, so the PVC
      # lives on the critical tier -- 3 replicas, one per control plane.
      # Migrated from the component's `longhorn` default 2026-08-19 via the
      # piece-13 choreography (final sync -> RD restore -> PVC recreate).
      VOLSYNC_STORAGECLASS: longhorn-critical
      # Tier-1 scratch volumes stay on the control planes so backup and
      # restore still work with the workers powered down (D6). 1 replica
      # each; see storageclass/critical.yaml for why.
      VOLSYNC_STAGING_STORAGECLASS: longhorn-critical-snapshot
      VOLSYNC_CACHE_SNAPSHOTCLASS: longhorn-critical-cache
      TAILSCALE_SERVICE: home-assistant-app
      TAILSCALE_HOST: home
