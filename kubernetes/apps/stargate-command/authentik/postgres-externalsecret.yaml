---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# Chart values, templated with the barman object-store credential. Same shape
# as database/postgres's `postgres-values`: the chart renders the S3 credential
# Secret from `backups.s3.*`, so the values themselves carry it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-values
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: authentik-pg-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      templateFrom:
      - target: Data
        configMap:
          name: authentik-pg-values
          items:
          - key: values.yaml
            templateAs: Values
  dataFrom:
    # The same Minio credential database/postgres archives with. When that
    # cluster flips to Garage (docs/garage-offsite-s3.md) this one moves with
    # it -- one bucket, one key, two prefixes.
    - extract:
        key: clusters/equestria/apps/postgres/minio-backup
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "minio_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The `authentik` owner role. Minted by stacks/system (authentik-pg.ts) and
# read by the Pi's authentik from the same OpenBao path, so both sites log in
# with one credential. CNPG requires basic-auth shaped Secrets for both
# `initdb.secret` and managed-role `passwordSecret`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: authentik-pg-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/authentik-pg/app
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The replication role the alpha-site standby streams with.
#
# NOT named `authentik-pg-replication`: CNPG creates a Secret of that name
# itself (the streaming_replica client certificate, `<cluster>-replication`),
# and a managed role pointed at it finds no `username` key and never gets a
# password. Found live on 2026-09-13; the standby's auth failed until this.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-standby-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: authentik-pg-standby-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/authentik-pg/replication
