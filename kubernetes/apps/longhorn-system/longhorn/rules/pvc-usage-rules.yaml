---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# ============================================================================
# ⚠️  READ THIS BEFORE EDITING THE THREE `longhorn_volume_*` ALERTS BELOW.
#
# These rules started life as a copy of Longhorn's published example rules,
# written against the metric shape Longhorn exported at roughly v1.5. TWO
# things changed underneath them, and until 2026-08-22 nobody noticed, because
# the failure is silent: the rules evaluate cleanly (`health: ok`), return an
# empty vector every single time, and therefore sit `inactive` forever.
#
#   1. `longhorn_volume_robustness` IS NO LONGER AN ENUM. It used to be one
#      series per volume valued 0=unknown / 1=healthy / 2=degraded / 3=faulted,
#      which is what `== 2` and `== 3` below were testing. As of the Longhorn
#      running here (v1.12.1) it is ONE-HOT: FOUR series per volume carrying a
#      `state="unknown|healthy|degraded|faulted"` label, each valued 0 or 1.
#      Verified live: 196 volumes -> 784 series, of which exactly 196 are `1`.
#      `longhorn_volume_robustness == 2` can therefore never match ANYTHING.
#
#   2. THE PVC JOIN IS BROKEN INDEPENDENTLY, and would be broken even if (1)
#      were not true. The old expression reached the PVC name through
#      `kube_persistentvolume_info{volumename=~"pvc-.*"}`. `kube_persistentvolume_info`
#      HAS NO `volumename` LABEL — it is `persistentvolume` — so that selector
#      matches 0 of 200 series and collapses the whole join to empty. (The
#      outer `on(volume)` was equally unmatchable: nothing on the right-hand
#      side of that join carries a `volume` label either.)
#
# The join is now unnecessary as well as broken: Longhorn exports `pvc` and
# `pvc_namespace` directly on these metrics. So the rules below read the PVC
# straight off the Longhorn metric and never touch kube-state-metrics.
#
# ⚠️  LABEL RENAME. The alerts now carry `pvc` / `pvc_namespace` instead of
# `persistentvolumeclaim` / `namespace`. `namespace` is still present but is
# the SCRAPE namespace (`longhorn-system`), not the PVC's. Anything matching on
# the old label names — silences, dashboards, routes — must be updated. Nothing
# in this repo did, because these alerts had never fired.
#
# HOW TO CHECK THE SHAPE AGAIN AFTER A LONGHORN UPGRADE (30 seconds, and worth
# doing, because this class of breakage is invisible):
#
#   kubectl -n observability port-forward pod/prometheus-prometheus-0 9090:9090
#   curl -sG --data-urlencode 'match[]=longhorn_volume_robustness' #     localhost:9090/api/v1/labels
#   # expect `state`, `pvc`, `pvc_namespace`, `volume` in the label list
#   curl -sG --data-urlencode 'query=longhorn_volume_robustness{state="healthy"}==1' #     localhost:9090/api/v1/query | jq '.data.result|length'
#   # expect: roughly the number of ATTACHED volumes, not 0
#
# See docs/cluster-consolidation/30-longhorn-media-tier.md §11 for the write-up.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: longhorn
    role: alert-rules
  name: longhorn-pvc-usage-rules
  namespace: monitoring
spec:
  groups:
  - name: longhorn.rules
    rules:
    # ⚠️ STILL DEAD, DELIBERATELY, AND THIS IS THE ONE THAT NEEDS A DECISION.
    #
    # This rule has the same broken `kube_persistentvolume_info{volumename=...}`
    # join as the two below, and the same one-line fix applies: both
    # `longhorn_volume_actual_size_bytes` and `longhorn_volume_capacity_bytes`
    # already carry `pvc` and `pvc_namespace`, so the whole join can simply be
    # deleted, leaving:
    #
    #   (longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100 > 90
    #
    # IT IS NOT FIXED HERE ON PURPOSE. Run that expression against live
    # Prometheus today and it returns EIGHT volumes, three of them over 100%
    # (thin-provisioned volumes whose actual size has caught up with their
    # nominal capacity). Fixing it in this change would have shipped an
    # eight-alert pager storm attached to a storage-placement PR, which is not
    # a thing to do to someone at 22:00.
    #
    # So this is a REAL, KNOWN GAP, not an oversight: nothing currently warns
    # that a Longhorn volume is nearly full. It wants its own change — triage
    # the eight, decide whether `actual_size / capacity` is even the right
    # ratio for thin provisioning (it arguably is not; `longhorn_volume_actual_size_bytes`
    # counts allocated blocks, which never shrink after a delete), then enable.
    # Tracked in docs/cluster-consolidation/30-longhorn-media-tier.md §11.
    - alert: LonghornVolumeActualSpaceUsedWarning
      annotations:
        description: The actual space used by PVC {{$labels.persistentvolumeclaim}} in namespace {{$labels.namespace}} (Longhorn volume {{$labels.volume}} on {{$labels.node}}) is at {{$value}}% capacity for more than 5 minutes.
        summary: The actual used space of Longhorn volume is over 90% of the capacity.
      expr: ((longhorn_volume_actual_size_bytes / longhorn_volume_capacity_bytes) * 100) * on(volume) group_left(persistentvolumeclaim, namespace) (kube_persistentvolumeclaim_info * on(volumename) group_right(persistentvolumeclaim, namespace) kube_persistentvolume_info{volumename=~"pvc-.*"}) > 90
      for: 5m
      labels:
        issue: The actual used space of PVC {{$labels.persistentvolumeclaim}} in namespace {{$labels.namespace}} is high.
        severity: warning
    # FIXED 2026-08-22 — was `longhorn_volume_robustness == 3` through the dead
    # kube-state-metrics join (see the header). `faulted` means every replica is
    # unusable, i.e. the volume is DOWN. It is NOT gated by the low-power window
    # below and must never be: the media volumes going faulted overnight would
    # be real data loss, not the expected nightly degradation.
    #
    # Returns 0 series live at 2026-08-22, which is the correct answer and the
    # first time this alert has been able to give one.
    - alert: LonghornVolumeStatusCritical
      annotations:
        description: PVC {{$labels.pvc}} in namespace {{$labels.pvc_namespace}} (Longhorn volume {{$labels.volume}} on {{$labels.node}}) is Faulted for more than 5 minutes.
        summary: Longhorn volume {{$labels.volume}} is Faulted
      expr: longhorn_volume_robustness{state="faulted"} == 1
      for: 5m
      labels:
        issue: PVC {{$labels.pvc}} in namespace {{$labels.pvc_namespace}} is Faulted.
        severity: critical
    # FIXED 2026-08-22 (see header), AND SCOPED for the nightly Low Power window.
    #
    # ---------------------------------------------------------------------
    # WHY THERE IS AN `unless` CLAUSE ON THIS ONE ALERT.
    #
    # `longhorn-media` (kubernetes/apps/longhorn-system/storageclass/media.yaml)
    # deliberately keeps a replica of plex/jellyfin/dispatcharr's config volumes
    # on `fluttershy` and `kerfuffle`, so the pods get a LOCAL replica during the
    # seventeen hours a day the estate is awake. Those two nodes power off for
    # the nightly Low Power window, so those replicas fail and the three volumes
    # read `degraded` from ~02:00 to ~09:00 EVERY NIGHT, by design. Longhorn
    # defines degraded as "fewer healthy replicas than numberOfReplicas", so
    # this is unavoidable once a replica lives on a node that powers off — it is
    # the accepted cost of daytime locality, not a fault.
    #
    # WHY THIS IS A RULE EDIT AND NOT A `Silence` CR. The estate's declarative
    # silence mechanism is silence-operator (kubernetes/apps/observability/silences).
    # Its `Silence` CRD, `observability.giantswarm.io/v1alpha2`, has exactly ONE
    # field — `spec.matchers`. NO schedule, NO start/end, NO recurrence
    # (verified against the live CRD). A Silence here would be PERMANENT, and a
    # media volume genuinely degraded at 14:00 would be hidden. That is the one
    # thing this must not do, so a Silence is the wrong tool.
    #
    # Alertmanager `muteTimeIntervals` (the AlertmanagerConfig in
    # observability/alertmanager/config.yaml does support them) was the other
    # candidate and was rejected for two reasons: the prometheus-operator
    # `TimeInterval` schema has no `location` field, so the window would be UTC
    # and would drift an hour at every DST change against a `${TIMEZONE}`-driven
    # shed; and a muted alert still shows as FIRING, which breaks the estate's
    # zero-firing-alerts baseline and would leave three permanent false
    # positives in every nightly triage.
    #
    # WHY THE GATE IS NODE READINESS AND NOT A CLOCK. It suppresses exactly when
    # the media workers are actually down, so it needs no timezone, survives a
    # change to the shed schedule, and tracks a late wake or an early shed. And
    # a media volume degraded while both workers are UP still pages — which is
    # the case that matters.
    #
    # THE `[30m]` IS A POST-WAKE RESYNC GRACE. The gate must stay closed for a
    # while AFTER the workers return, because the returning replicas have to
    # catch up before the volume leaves `degraded`. `min_over_time(...)[30m] == 0`
    # is true from the moment a worker drops until 30 minutes after it is back.
    # The 02:00 leading edge needs no help: a node takes ~40s to report NotReady
    # while the volume degrades immediately, and `for: 5m` absorbs that gap.
    #
    # WHAT THIS DELIBERATELY DOES NOT SUPPRESS:
    #   * any volume that is not one of these three PVCs, at any hour;
    #   * these three PVCs while both media workers are up — i.e. all day;
    #   * anything at all, if kube-state-metrics is down or the Node objects are
    #     missing. The gate then produces an empty vector and suppresses
    #     NOTHING. It fails OPEN, on purpose.
    #
    # KNOWN RESIDUAL, stated so nobody is surprised by it:
    #   * A resync still running 30 minutes after wake WILL page at ~09:35. That
    #     is intended — a media volume that needs more than half an hour to come
    #     back is news. But note it is UNVERIFIED whether the 09:00 return is a
    #     fast resync or a full rebuild: `staleReplicaTimeout` on these volumes
    #     is "30" (MINUTES), so Longhorn may delete the failed replicas around
    #     02:30 and force a full ~170 GiB rebuild every morning instead. The
    #     first real night is the test. See 30 §11.
    #   * A media volume degraded for an UNRELATED reason inside the window is
    #     hidden. Same blast radius as any time-window silence would have had,
    #     and smaller in duration.
    #   * Node names are hardcoded. If the shed set ever changes, this regex and
    #     the `low-power-off` tag must change together. Nothing enforces that.
    #
    # Both halves were validated against live Prometheus on 2026-08-22: with the
    # gate open the expression returns the degraded volume; with the gate forced
    # closed it returns nothing, and a 63-series control set lost exactly the two
    # media PVCs and no others.
    # ---------------------------------------------------------------------
    - alert: LonghornVolumeStatusWarning
      annotations:
        description: PVC {{$labels.pvc}} in namespace {{$labels.pvc_namespace}} (Longhorn volume {{$labels.volume}} on {{$labels.node}}) is Degraded for more than 5 minutes.
        summary: Longhorn volume {{$labels.volume}} is Degraded
      expr: >-
        (longhorn_volume_robustness{state="degraded"} == 1)
        unless
        (
          longhorn_volume_robustness{state="degraded", pvc_namespace="equestria", pvc=~"plex|jellyfin|dispatcharr"}
          and on()
          count(
            min_over_time(
              kube_node_status_condition{node=~"fluttershy|kerfuffle", condition="Ready", status="true"}[30m]
            ) == 0
          ) > 0
        )
      for: 5m
      labels:
        issue: PVC {{$labels.pvc}} in namespace {{$labels.pvc_namespace}} is Degraded.
        severity: warning
    - alert: LonghornNodeStorageWarning
      annotations:
        description: The used storage of node {{$labels.node}} is at {{$value}}% capacity for
          more than 5 minutes.
        summary:  The used storage of node is over 80% of the capacity.
      expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 80
      for: 5m
      labels:
        issue: The used storage of node {{$labels.node}} is high.
        severity: warning
    - alert: LonghornNodeStorageWarning
      annotations:
        description: The used storage of node {{$labels.node}} is at {{$value}}% capacity for
          more than 5 minutes.
        summary:  The used storage of node is over 90% of the capacity.
      expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 90
      for: 5m
      labels:
        issue: The used storage of node {{$labels.node}} is high.
        severity: error
    - alert: LonghornNodeDown
      annotations:
        description: There are {{$value}} Longhorn nodes which have been offline for more than 5 minutes.
        summary: Longhorn nodes is offline
      expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
      for: 5m
      labels:
        issue: There are {{$value}} Longhorn nodes are offline
        severity: critical
    - alert: LonghornInstanceManagerCPUUsageWarning
      annotations:
        description: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is {{$value}}% for
          more than 5 minutes.
        summary: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} has CPU Usage / CPU request is over 300%.
      expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
      for: 5m
      labels:
        issue: Longhorn instance manager {{$labels.instance_manager}} on {{$labels.node}} consumes 3 times the CPU request.
        severity: warning
    - alert: LonghornNodeCPUUsageWarning
      annotations:
        description: Longhorn node {{$labels.node}} has CPU Usage / CPU capacity is {{$value}}% for
          more than 5 minutes.
        summary: Longhorn node {{$labels.node}} experiences high CPU pressure for more than 5m.
      expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
      for: 5m
      labels:
        issue: Longhorn node {{$labels.node}} experiences high CPU pressure.
        severity: warning
