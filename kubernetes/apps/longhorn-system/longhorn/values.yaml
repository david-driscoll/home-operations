---

# The dollars below are DOUBLED, which is the escape. configMapGenerator
# slurps this file whole and Flux postBuild envsubst then runs over the built
# output, comments included -- unescaped, this commented-out example put the
# real Spike IP and cluster name into the deployed ConfigMap. Halve them again
# when uncommenting.
# defaultBackupStore:
#   backupTarget: nfs://$${SPIKE_IP}:/mnt/stash/backup/$${CLUSTER_CNAME}/longhorn
  # backupTargetCredentialSecret: s3-secret
preUpgradeChecker:
  upgradeVersionCheck: false

# Tolerate the control-plane taint that arrives when
# `allowSchedulingOnControlPlanes` is flipped to false in
# talos/patches/controller/cluster.yaml. Longhorn splits its workloads in two
# and each half needs a DIFFERENT knob -- setting only one of them leaves the
# storage plane half-tainted:
#
#   * USER-DEPLOYED (longhorn-manager DaemonSet, longhorn-ui,
#     longhorn-driver-deployer) are rendered by this chart, so they take a
#     normal pod-spec toleration list. That is `global.tolerations` here, and
#     it applies on the next Helm upgrade with no preconditions.
#     Per-component `longhornManager.tolerations` etc. OVERRIDE rather than
#     merge with this (`default .Values.global.tolerations ...`), so setting
#     the global once is both sufficient and the safer shape.
#
#   * SYSTEM-MANAGED (instance-manager, engine-image, longhorn-csi-plugin,
#     backing-image-manager, share-manager) are created by longhorn-manager at
#     runtime, NOT by Helm. They are selected by the
#     `longhorn.io/managed-by: longhorn-manager` label and are reachable only
#     through the `taint-toleration` SETTING below -- a pod-spec toleration
#     here would never reach them.
#
# See the detach caveat on defaultSettings.taintToleration below; it is the
# operationally important half.
global:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

persistence:
  defaultDataLocality: best-effort
defaultSettings:
  createDefaultDiskLabeledNodes: false
  defaultDataLocality: best-effort
  defaultLonghornStaticStorageClass: longhorn
  defaultReplicaCount: 2
  guaranteedInstanceManagerCpu: 5
  nodeDownPoddeletionPolicy: Delete-both-statefulset-and-deployment-pod
  volumeAttachmentRecoveryPolicy: never
  # Chart key is orphanResourceAutoDeletion (chart 1.12.0) and the value is a
  # SEMICOLON-separated list of resource types, not a boolean. The old
  # `orphanAutoDeletion: true` matched no key in the chart, so it was dropped
  # silently and orphan-resource-auto-deletion has been empty -- nothing was
  # ever cleaned up. Valid items: `instance` (engine and replica runtime
  # instances) and `replica-data` (replica data directories on disk).
  #
  # Only `instance` is enabled. Every orphan on both clusters is an
  # engine-instance left behind by the VolSync movers, and those are what drive
  # the respawn loop on milky-way. `replica-data` deletes actual replica data
  # directories and has never been active on this estate, so turning it on is a
  # separate, deliberate decision -- not a side effect of this fix. See vault#123.
  orphanResourceAutoDeletion: instance
  orphanResourceAutoDeletionGracePeriod: 300
  replicaAutoBalance: best-effort

  # Chart default is 5. That is tuned for NVMe and is actively harmful on the
  # ex-SGC nodes, whose Longhorn disk is a Transcend TS1TMTS425S SATA
  # (milky-way/othalla/pegasus, /dev/sda). Five concurrent rebuilds onto one of
  # those drives saturates it -- measured 93.5% utilisation and 470 ms average
  # write latency during fluttershy's eviction on 2026-08-18 -- so the rebuild
  # data connections time out and drop (`Data server connection closed by
  # remote  error=EOF`), Longhorn marks the replicas failed, and retries all
  # five again. Each retry DISCARDS the progress: one 64 GiB volume fell from
  # 93% back to 3%, and the failed-replica count went 0 -> 3 -> 6 -> 9 in about
  # twenty minutes. It is a livelock, not a failing disk -- there were no
  # kernel I/O errors and no SMART errors on any of those drives.
  #
  # Two rebuilds that finish beat five that time out and restart. This matters
  # most on the remaining piece-19 rotations: kerfuffle holds ~80 replicas.
  # See docs/cluster-consolidation/19-rotate-equestria-control-planes.md
  # (Step 1b-bis) and 12-longhorn-critical-tier.md.
  concurrentReplicaRebuildPerNodeLimit: 2

  storageMinimalAvailablePercentage: 5
  storageReservedPercentageForDefaultDisk: 10
  autoCleanupSnapshotAfterOnDemandBackupCompleted: true
  autoCleanupSnapshotWhenDeleteBackup: true
  autoCleanupSystemGeneratedSnapshot: true
  autoCleanupRecurringJobBackupSnapshot: true
  removeSnapshotsDuringFilesystemTrim: true
  snapshotMaxCount: 5
  snapshotCountWarningThreshold: 4

  # backupTargetCredentialSecret: s3-secret
  defaultDataPath: /var/mnt/longhorn/
  storageOverProvisioningPercentage: 600
  upgradeChecker: true
  priorityClass: system-node-critical
  # Tolerations for the SYSTEM-MANAGED components only (instance-manager,
  # engine-image, longhorn-csi-plugin, backing-image-manager, share-manager).
  # The user-deployed half is `global.tolerations` at the top of this file --
  # read the comment there first, the two are not interchangeable.
  #
  # FORMAT: semicolon-separated `key=value:effect` or `key:effect`. A key with
  # no `=value` parses to operator Exists, which is what we want here; all
  # whitespace is stripped before parsing. Verified against parseToleration()
  # in types/setting.go @ v1.12.x, not just the docs.
  #
  # !! DETACH CAVEAT -- READ BEFORE FLIPPING THE TAINT !!
  # This setting is ACCEPTED but DEFERRED while any Longhorn volume is
  # attached. Longhorn <= 1.5 hard-rejected the change ("cannot modify
  # toleration setting before all volumes are detached"); since #7173 (1.6)
  # the Setting CR write succeeds and updateTaintToleration() in
  # controller/setting_controller.go instead gates on
  # AreAllVolumesDetachedState(), logging ErrorInvalidState and requeuing on
  # the one-hour settingControllerResyncPeriod until every volume is detached.
  #
  # So on a cluster with live volumes this half does NOT apply on merge, and
  # NOTHING SURFACES THE FAILURE: `helm upgrade` succeeds, the HelmRelease goes
  # Ready, and only longhorn-manager's log says otherwise. Adding a toleration
  # is not a special case -- any add/change/remove takes the same gate.
  #
  # This is survivable rather than urgent because the control-plane taint is
  # NoSchedule, which does not evict running pods: the existing csi-plugin and
  # engine-image pods keep running on the control planes. It bites on the next
  # pod RECREATE there (reboot, Talos upgrade, DaemonSet rollout), after which
  # they cannot come back and volumes attached via that node break.
  #
  # BEFORE flipping allowSchedulingOnControlPlanes, confirm this actually
  # landed rather than assuming:
  #   kubectl -n longhorn-system get ds longhorn-csi-plugin \
  #     -o jsonpath='{.metadata.annotations.longhorn\.io/last-applied-tolerations}'
  # If that does not contain node-role.kubernetes.io/control-plane, the
  # setting is still pending and needs a volumes-detached window.
  taintToleration: node-role.kubernetes.io/control-plane:NoSchedule
  # systemManagedComponentsNodeSelector: "label-key1:label-value1"
  # disableSchedulingOnCordonedNode: false
  # replicaZoneSoftAntiAffinity: false
  # replicaDiskSoftAntiAffinity: false

  allowEmptyDiskSelectorVolume: true
  # `block-for-eviction-if-contains-last-replica` deadlocks Talos upgrades on any
  # node holding a `longhorn-local` volume. That policy tells Longhorn to REBUILD
  # the last replica on another node before releasing the drain -- but those
  # volumes are `strict-local` with `numberOfReplicas: 1` and hard PV nodeAffinity,
  # so the rebuild can never be scheduled ("hard affinity cannot be satisfied").
  # Longhorn then holds the volume attached forever, keeps the per-node
  # instance-manager PDB at 0 allowed disruptions, and tuppr's drain retries until
  # it times out. Meanwhile the pinned workloads (valkey, postgres-3, technitium)
  # sit Pending because their PV only matches the cordoned node. See vault#TBD.
  #
  # `allow-if-replica-is-stopped` still refuses to drain a node whose last replica
  # is actively RUNNING, but lets the drain through once the workload is gone and
  # the replica has stopped -- which is exactly the upgrade case. Trade-off: if a
  # drained node never comes back, a single-replica volume on it is lost. That is
  # already true for every `longhorn-local` volume by construction.
  nodeDrainPolicy: allow-if-replica-is-stopped
ingress:
  enabled: true
  ingressClassName: internal
  host: "longhorn.${CLUSTER_DOMAIN}"
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: network-local-user@kubernetescrd
metrics:
  serviceMonitor:
    enabled: true
