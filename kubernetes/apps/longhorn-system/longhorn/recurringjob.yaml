---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn-system
spec:
  name: snapshot-cleanup
  groups:
    - default
  task: snapshot-cleanup
  cron: "0 10 * * *"
  retain: 0
  concurrency: 2
  labels: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete
  namespace: longhorn-system
spec:
  name: snapshot-delete
  groups:
    - default
  # snapshot-cleanup only removes system-generated snapshots. CSI snapshots
  # created by VolSync are userCreated=true, so nothing reclaimed them and they
  # accumulated at ~1 per volume per day. snapshot-delete trims user-created
  # snapshots beyond `retain` and purges, keeping the chain bounded.
  task: snapshot-delete
  cron: "0 11 * * *"
  # VolSync syncs daily at 14:00 and clones the snapshot before reading it, so
  # 3 days is well clear of any in-flight sync while staying under the
  # snapshot-max-count setting of 5.
  retain: 3
  concurrency: 2
  labels: {}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim
  namespace: longhorn-system
spec:
  name: filesystem-trim
  groups:
    - default
  # Nothing trimmed these volumes before this, so a replica only ever grew:
  # deleting files frees blocks in the filesystem, but Longhorn keeps them on
  # the node until the filesystem discards them. On 2026-10-08 jellyfin-pg went
  # from 68.7G to 1.1G used and its three replicas still held 86GiB each.
  #
  # With `removeSnapshotsDuringFilesystemTrim: true` (values.yaml) a trim also
  # marks the volume's snapshot chain removed, so the space held by snapshots
  # comes back too. That is why this must not run near a VolSync sync, which
  # snapshots and clones every volume at 14:00 and is done inside the hour.
  task: filesystem-trim
  # Fridays 18:00 UTC. Weekly, as fstrim.timer is. The hour is chosen for what
  # it avoids: VolSync at 14:00, snapshot-cleanup and snapshot-delete at 10:00
  # and 11:00, and above all the downscaler's 01:00-07:00 local window -- a
  # trim needs the filesystem MOUNTED, and with
  # `allow-recurring-job-while-volume-detached` off a detached volume is
  # skipped, so a slot inside that window would silently trim nothing that
  # sleeps at night.
  cron: "0 18 * * 5"
  retain: 0
  concurrency: 2
  labels: {}
