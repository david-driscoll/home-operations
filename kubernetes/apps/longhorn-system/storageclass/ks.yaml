---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app storageclass
  namespace: &namespace longhorn-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  path: ./kubernetes/apps/longhorn-system/storageclass
  prune: true
  wait: true
  # StorageClass `parameters` are IMMUTABLE. Without this, any change to a class
  # in this directory fails to apply — Flux reports the Kustomization not-Ready
  # with "updates to parameters are forbidden" and the live class silently keeps
  # its old values. `force` lets Flux delete and recreate on that conflict.
  #
  # Safe here specifically because this path contains ONLY StorageClasses: they
  # hold no data, and deleting one does not touch bound PVs or PVCs, which carry
  # their own copy of the parameters. The only gap is that a PVC created during
  # the recreate would fail to provision, which retries.
  force: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
