---
# CONFIG VOLUMES FOR THE MEDIA APPS — `plex`, `jellyfin`, `dispatcharr`.
#
# THE PROBLEM. Nightly low-power mode (02:00-09:00) sheds BOTH media workers,
# `fluttershy` and `kerfuffle`. All three apps are keep-list: they relocate onto
# the control planes (`milky-way`, `othalla`, `pegasus`), which have Intel iGPUs
# and never shut down. Originally all three config volumes ran 3 replicas on the
# `bulk` tier, and two of those three replicas lived on the shed pair — so every
# night the volumes would drop to one copy.
#
# ⚠️ THIS FILE HAS BEEN THROUGH THREE ANSWERS IN ONE DAY. If you are reading a
# comment further down that contradicts the one above the `parameters:` block,
# the one above `parameters:` wins. The history, because the trade is the whole
# point:
#
#   * plan C / `nodeSelector: critical` (#1051) — replicas on the three control
#     planes only. No spare eligible node; nothing to rebuild onto if one died.
#   * `nodeSelector: low-power`, 3 replicas (#1053) — replicas ONLY on the five
#     nodes that stay powered overnight (3 CPs + hard-hat + shining-armor).
#     NOTHING was degraded overnight, so no alert and no stalled tuppr drain.
#     Clean nights. But the pods run on fluttershy/kerfuffle for the seventeen
#     hours a day the estate is AWAKE, and none of those five nodes is one the
#     pods can run on, so EVERY DAYTIME READ AND WRITE CROSSED THE NETWORK.
#   * `nodeSelector: low-power-off`, 5 replicas (CURRENT) — replicas on the five
#     nodes with an Intel iGPU, which is exactly the set the apps can run on.
#     The pod ALWAYS has a local replica: a worker by day, a control plane by
#     night. The price is that the volumes ARE degraded 02:00-09:00 every night.
#
# THE TRADE, in one line: `low-power` bought clean nights at the cost of every
# daytime read; `low-power-off` buys daytime locality at the cost of a nightly
# degraded state that had to be made safe. It went that way because these are
# plex/jellyfin CONFIG volumes — SQLite — and daytime latency is what is
# actually felt.
#
# ⚠️ THE NIGHTLY DEGRADED STATE IS REAL AND EXPECTED. A replica on a node that
# powers off IS a failed replica. Longhorn defines `degraded` as "fewer healthy
# replicas than numberOfReplicas", so there is no way to have a replica on a
# shed node and not be degraded while it is shed. Two things had to be handled
# for that to be safe, and BOTH ARE SHIPPED — do not undo either without
# undoing this class:
#
#   1. `LonghornVolumeStatusWarning` would fire nightly, for three volumes,
#      forever. Handled in
#      kubernetes/apps/longhorn-system/longhorn/rules/pvc-usage-rules.yaml by
#      scoping the rule: the three media PVCs are excluded from it precisely
#      while `fluttershy` or `kerfuffle` is not Ready (plus a 30-minute
#      post-wake resync grace). NOT a silence-operator `Silence` — that CRD has
#      no time fields at all and would have hidden real daytime failures. The
#      full reasoning is in that file's comment.
#      (While fixing that rule it turned out the alert had NEVER been able to
#      fire: it tested `longhorn_volume_robustness == 2` against a metric that
#      is now one-hot with a `state=` label, through a kube-state-metrics join
#      that could not match. Both are fixed there.)
#   2. It BLOCKS TALOS UPGRADES CLUSTER-WIDE. The tuppr health check in
#      kubernetes/apps/system-upgrade/upgrades/talos.yaml is
#      `expr: status.robustness != "degraded"` over `longhorn.io/v1beta2 Volume`
#      in `longhorn-system` with `timeout: 15m`, and it NAMES NO VOLUME — any
#      degraded volume anywhere stalls the drain of the next node for the full
#      15 minutes and then fails the upgrade. Handled by ENABLING the tuppr
#      maintenance window in that file (11:00, 2h, `${TIMEZONE}`) so drains only
#      ever run inside the awake hours. That window must stay OUTSIDE
#      02:00-09:00 for as long as this class keeps replicas on the shed nodes.
#
# THE OTHER ACCEPTED COST: 5-way synchronous writes. Longhorn v1 acks a write
# only once every replica has it, so these volumes are as slow as their slowest
# replica, and at least three replicas are always on the control planes'
# Transcend TS1TMTS425S M.2 SATA disks (54-75 ms mean write latency over 7d)
# rather than the workers' Samsung 990 EVO Plus NVMe (0.5-11 ms). Measured
# 7-day load on the three volumes is 4.2 write IOPS / 52 KB/s combined with ~0
# reads, so that is affordable — but it is a LATENCY risk, not a throughput one,
# and `plex`'s SQLite config under a library scan is the thing to watch.
#
# WHY THIS IS A SEPARATE CLASS AND NOT JUST `longhorn-critical`.
# `longhorn-critical` (storageclass/critical.yaml) has `nodeSelector: critical`
# and `numberOfReplicas: "3"`, which is a strict SUBSET of this class's five
# eligible nodes. Two reasons not to reuse it:
#
#   1. DIFFERENT `dataLocality`. `longhorn-critical` is `best-effort`; this
#      class must be `disabled` (see below). That difference alone requires a
#      second class — the parameter is per-class, not per-volume.
#   2. AN INDEPENDENT KNOB, AND AN UNDILUTED TIER. `longhorn-critical` means
#      "Tier-0/1 data that must survive low-power mode". Media config volumes
#      are not Tier-1; they are Tier-2 data that happens to need the same
#      placement for an unrelated reason (their GPU-bound pods relocate to the
#      control planes). Folding them in would make the critical tier's replica
#      count, capacity budget and future placement changes hostage to media
#      config, and would make "what is Tier-1?" unanswerable from the class
#      name. Keeping them separate means either tier can be retuned — replica
#      count, disk selector, a move back to `bulk` when the media workers stop
#      being shed — without touching the other.
#
# WHY `dataLocality: disabled` AND NOT `best-effort`.
# With three replicas over five eligible nodes, two nodes hold no replica at any
# moment, so locality is likely but not guaranteed. `best-effort` looks like the
# fix and is not: every node the pod can run on is inside the tag, so whenever it
# CAN be satisfied it relocates a replica -- piling more rebuild traffic on top
# of the nightly churn described below, for a config volume whose working set is
# already in page cache. `replicaAutoBalance` already handles getting replicas
# back onto the workers each morning.
#
# Leaving it `disabled` also keeps a known failure mode off the table. When
# `best-effort` CANNOT be satisfied -- when the attached node is outside the tag
# -- Longhorn does not quietly do nothing. It mints a ghost replica
# (`spec.nodeID: ""`, `state: stopped`, `hardNodeAffinity` pinned to the node
# that rejected it, `rebuildRetryCount` capped at 5) and parks a permanent
# `Scheduled=False / LocalReplicaSchedulingFailure` condition on the volume.
# That is upstream's "tags not fulfilled" ghost (longhorn#7312, longhorn#11007).
# It does no I/O and cannot act as a replenishment slot, so it is cruft rather
# than damage -- but NO alert covers it, which is why it would go unnoticed
# forever.
#
# Not hypothetical: `teamarr` and `pinepods` are carrying exactly that ghost and
# exactly that condition right now, while reporting `robustness: healthy`.
#
# So if `numberOfReplicas` is ever dropped below the number of tagged nodes,
# this setting is the thing keeping that cruft from appearing.
#
# WHAT THE NIGHTLY WINDOW ACTUALLY COSTS. Two of the five `low-power-off` nodes
# — fluttershy and kerfuffle — power off during it, so two replicas of each
# volume fail and all three volumes read `degraded` from ~02:00 to ~09:00 every
# night. That is the DESIGNED behaviour of this class, not a fault, and both of
# its consequences are handled: see the two numbered items at the top of this
# file (alert-rule scoping, and the tuppr maintenance window).
#
# ⚠️ THE PREVIOUS REVISION OF THIS COMMENT SAID THE OPPOSITE — that "no replica
# ever fails, nothing goes degraded, no LonghornVolumeStatusWarning fires".
# That was true of `nodeSelector: low-power`, which this class no longer uses.
# It is recorded here because it is the single easiest thing to get backwards
# about the current design.
#
# NOTHING TO REBUILD ONTO, AND THAT IS THE POINT. With 5 replicas over exactly 5
# eligible nodes, when the two worker replicas fail at 02:00 Longhorn goes
# looking for somewhere to rebuild them and finds nowhere: the two shed nodes
# are unschedulable and the three control planes each already hold a replica
# (`replica-soft-anti-affinity` is false, so one per node). So it logs a
# scheduling failure, waits, and resyncs at 09:00. Drop this to 3 replicas and
# the two empty control planes become rebuild targets — ~170 GiB copied every
# night and unwound every morning. THE REPLICA COUNT AND THE TAG ARE A PAIR.
#
# COUPLING TO WATCH. `low-power-off` must remain exactly "the nodes that can run
# these apps", and `numberOfReplicas` must remain exactly its size. If a node
# gains or loses an Intel iGPU, or the app affinities change, both move
# together. Nothing enforces or alerts on this.
#
# The alert-rule gate in pvc-usage-rules.yaml ALSO hardcodes `fluttershy` and
# `kerfuffle` as the shed pair. If the shed set changes, that regex is a third
# place to update.
#
# NOTE THIS IS NOT `battery`. In a real Battery event more nodes go down — see
# docs/cluster-consolidation/24-power-states.md. Battery is an emergency, not a
# nightly routine, and this class is tuned for the nightly routine.
#
# ⚠️ CHANGING THE CLASS IN GIT DOES NOT MIGRATE ANYTHING, AND IS NOT SAFE TO
# POINT THE LIVE PVCs AT. All three PVCs carry
# `kustomize.toolkit.fluxcd.io/force: enabled` (a commonLabel from
# kubernetes/components/volsync), and `PersistentVolumeClaim.spec.
# storageClassName` is immutable — so editing the storage class of a live PVC in
# Git makes Flux hit the immutable-field conflict and, because `force` is on,
# DELETE AND RECREATE THE PVC, destroying the data. This class is safe to adopt
# only at a deliberate re-provision (VolSync restore, namespace rebuild, DR).
# Migrating the EXISTING volumes is done live on the `volumes.longhorn.io` CRs
# and is a genuine data relocation — see
# docs/cluster-consolidation/30-longhorn-media-tier.md §6.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-media
reclaimPolicy: Delete
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "3"
  # `low-power-off` = the five nodes with an Intel iGPU, i.e. every node that can
  # actually run plex/jellyfin/dispatcharr: fluttershy and kerfuffle (the daytime
  # workers) plus the three control planes (where the apps land overnight).
  #
  # WHY REPLICAS LIVE ON THE WORKERS, given they are shed nightly. Data locality.
  # The pods run on fluttershy/kerfuffle for the 17 hours a day the estate is
  # awake, and that is when the volumes are actually used. plex's config is
  # SQLite, which is a latency workload rather than a throughput one, so a local
  # replica is worth real money during the day. The previous `low-power` shape
  # kept nights spotless at the cost of every daytime read crossing the network.
  #
  # WHAT THIS COSTS, stated plainly. A replica on a node that powers off IS a
  # failed replica, so these volumes go `degraded` every night by definition.
  # That has two consequences, both of which need the companion changes shipped
  # alongside this:
  #   * `LonghornVolumeStatusWarning` would fire nightly -- handled by SCOPING
  #     THE RULE in longhorn/rules/pvc-usage-rules.yaml, not by a silence. The
  #     three media PVCs drop out of that alert exactly while a media worker is
  #     not Ready. Nothing else is suppressed, at any hour.
  #   * tuppr's Talos health gate is `status.robustness != "degraded"` and is
  #     CLUSTER-WIDE, so it would block every node drain for the whole window.
  #     The tuppr maintenance window in system-upgrade/upgrades/talos.yaml is
  #     enabled to keep upgrades inside the awake hours.
  #
  # WHY 3 REPLICAS STILL GUARANTEES ONE ON A CONTROL PLANE.
  # The tag covers five nodes, only TWO of which are workers (fluttershy,
  # kerfuffle). `replica-soft-anti-affinity` is false, so Longhorn places at most
  # one replica per node -- three replicas cannot fit on two workers, so at least
  # one MUST land on a control plane. Structural, not probabilistic, and it is
  # what guarantees a surviving copy overnight.
  #
  # ⚠️ THE COST OF 3 RATHER THAN 5: NIGHTLY REBUILD CHURN, IN BOTH DIRECTIONS.
  # Replenishment fires when a replica FAILS, not when a node is merely empty.
  # At 02:00 the two worker replicas fail, and with only three replicas there are
  # two EMPTY eligible control planes to rebuild onto. After
  # `replica-replenishment-wait-interval` (600s) Longhorn does exactly that.
  # Then at 09:00 the workers come back empty and `replicaAutoBalance:
  # best-effort` below moves replicas back onto them -- which is not incidental,
  # it is REQUIRED, because without it the replicas would stay on the control
  # planes and the daytime locality this whole tag exists for would be lost
  # after the first night.
  #
  # So the churn is inherent and bidirectional: roughly 170GiB rebuilt each way,
  # at the 26-33 MiB/s this cluster actually achieves onto the control-plane
  # disks. Budget it as real nightly and morning I/O, not a rounding error.
  #
  # Five replicas would have removed it entirely -- every eligible node holds one,
  # so there is nowhere to rebuild and nothing to rebalance, and Longhorn just
  # waits and fast-resyncs. Three was chosen for the lower write amplification;
  # the churn is the accepted trade. The other way out, if the I/O hurts, is to
  # narrow the tag to exactly three nodes (both workers plus ONE control plane),
  # which restores "nowhere to rebuild" while keeping three replicas.
  #
  # NOT tagged `low-power-off`: hard-hat and shining-armor. Neither has an Intel
  # iGPU, so the media apps can never run there and a replica would be
  # permanently remote. They keep `low-power`, which answers a DIFFERENT
  # question -- "does this node stay powered overnight?" -- and is still the
  # right tag for anything whose only requirement is power continuity.
  nodeSelector: "low-power-off"
  dataLocality: disabled
  replicaAutoBalance: best-effort
  staleReplicaTimeout: "30"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
