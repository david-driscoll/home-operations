---
# CONFIG VOLUMES FOR THE MEDIA APPS — `plex`, `jellyfin`, `dispatcharr`.
#
# THE PROBLEM. Nightly low-power mode (02:00-09:00) sheds BOTH media workers,
# `fluttershy` and `kerfuffle`. All three apps are keep-list: they relocate onto
# the control planes (`milky-way`, `othalla`, `pegasus`), which have Intel iGPUs
# and never shut down. Today all three config volumes run 3 replicas on the
# `bulk` tier, and two of those three replicas live on the shed pair — so every
# night the volumes would drop to one copy and sit `degraded` for seven hours.
#
# THE ANSWER: PUT THE REPLICAS ONLY ON NODES THAT NEVER SHUT DOWN.
# `nodeSelector: low-power` = the three control planes plus hard-hat and
# shining-armor; `numberOfReplicas: "3"`. Every one of those five stays powered
# through the window, so all three replicas stay up and the volume never leaves
# `healthy`.
#
# Why that framing won over "keep 4 replicas on the 4 `bulk` nodes" (the design
# this file used to carry). That design left the volumes DEGRADED every night,
# which is not a cosmetic state — it has two teeth:
#
#   1. `LonghornVolumeStatusWarning` fires on `longhorn_volume_robustness == 2`
#      `for: 5m` — three volumes, every night, forever.
#      (kubernetes/apps/longhorn-system/longhorn/rules/pvc-usage-rules.yaml)
#   2. It BLOCKS TALOS UPGRADES. The tuppr health check in
#      kubernetes/apps/system-upgrade/upgrades/talos.yaml is
#      `expr: status.robustness != "degraded"` over `longhorn.io/v1beta2 Volume`
#      in `longhorn-system` with `timeout: 15m`, and it is CLUSTER-WIDE — it
#      names no volume, so any degraded volume anywhere stalls the drain of the
#      next node for the full 15m and then fails the upgrade. A design that is
#      degraded 02:00-09:00 hands the cluster a nightly seven-hour window in
#      which node upgrades cannot run.
#
# Under this class there is nothing degraded, so neither tooth bites. There is
# also nowhere to rebuild TO and nothing to rebuild — the eligible set is
# exactly the set of nodes that stay up, so the shed cannot create a vacancy.
# That also disposes of the `replica-replenishment-wait-interval` (600s)
# churn problem the old design had to engineer around: the rule is "churn
# happens iff a tag-eligible node is AWAKE and holds no live replica", and here
# every eligible node is awake and holds one.
#
# THE ACCEPTED COST. By DAY the pods prefer the media workers (stronger Iris Xe
# iGPU — see the soft nodeAffinity in each app's helmrelease.yaml), so the pod
# runs on a worker while all three replicas sit on control planes and every
# read and write crosses the network. That shape is already proven in this
# cluster in mirror image: `teamarr` (pvc-8cfbf411-…) and `pinepods`
# (pvc-4f906258-…) are attached to `milky-way` and `othalla` with all three
# replicas on `bulk` workers, and both are `state: attached`,
# `robustness: healthy`, three replicas `RW`. Measured 7-day load on the three
# media volumes is 4.2 write IOPS / 52 KB/s combined and ~0 reads (page cache
# absorbs them), so there is very little traffic to make remote.
#
# The second half of the cost: the control-plane Longhorn disks are Transcend
# TS1TMTS425S M.2 SATA (54-75 ms mean write latency over 7d) against the
# workers' Samsung 990 EVO Plus NVMe (0.5-11 ms). Longhorn v1 acks a write only
# once every replica has it, so these volumes inherit the slower disk 24/7 —
# not just overnight. Affordable at 4.2 IOPS; it is the thing to watch during
# the soak, because Plex library scans and Jellyfin metadata refreshes are
# SQLite-fsync bursty and that is a latency workload, not a throughput one.
#
# WHY THIS IS A SEPARATE CLASS AND NOT JUST `longhorn-critical`.
# `longhorn-critical` (storageclass/critical.yaml) has `nodeSelector: critical`
# and `numberOfReplicas: "3"`, which is a strict SUBSET of this class's five
# eligible nodes. Two reasons not to reuse it:
#
#   1. DIFFERENT `dataLocality`. `longhorn-critical` is `best-effort`; this
#      class must be `disabled` (see below). That difference alone requires a
#      second class — the parameter is per-class, not per-volume.
#   2. AN INDEPENDENT KNOB, AND AN UNDILUTED TIER. `longhorn-critical` means
#      "Tier-0/1 data that must survive low-power mode". Media config volumes
#      are not Tier-1; they are Tier-2 data that happens to need the same
#      placement for an unrelated reason (their GPU-bound pods relocate to the
#      control planes). Folding them in would make the critical tier's replica
#      count, capacity budget and future placement changes hostage to media
#      config, and would make "what is Tier-1?" unanswerable from the class
#      name. Keeping them separate means either tier can be retuned — replica
#      count, disk selector, a move back to `bulk` when the media workers stop
#      being shed — without touching the other.
#
# WHY `dataLocality: disabled` AND NOT `best-effort`.
# `best-effort` asks Longhorn to keep a replica on the node the volume is
# attached to. By DAY the pod is on a media worker, which is OUTSIDE the
# `critical` tag, so that request is UNSATISFIABLE for most of every day — tags
# are a hard AND filter in the replica scheduler and `best-effort` cannot
# override them. What Longhorn does then is not "nothing": it mints a ghost
# replica — `spec.nodeID: ""`, `state: stopped`, `hardNodeAffinity` pinned to
# the node that rejected it, `rebuildRetryCount` capped at 5 — and parks a
# permanent `Scheduled=False / LocalReplicaSchedulingFailure` condition on the
# volume. That is upstream's "tags not fulfilled" ghost (longhorn#7312,
# longhorn#11007). It does no I/O and cannot act as a replenishment slot, so it
# is cruft rather than damage, and NO alert covers it — which is precisely why
# it would go unnoticed forever.
#
# It is not hypothetical here. `teamarr` and `pinepods` — same shape, reversed —
# are carrying exactly that ghost replica and exactly that
# `Scheduled=False (LocalReplicaSchedulingFailure)` condition right now, while
# reporting `robustness: healthy`.
#
# And `best-effort` buys nothing in exchange. OVERNIGHT, when the pod is on a
# control plane, locality is already satisfied — every control plane holds a
# replica — so `best-effort` has nothing left to ask for. So it is unsatisfiable
# by day and redundant by night: pure downside. `disabled` it is.
# (`longhorn-critical` keeps `best-effort` legitimately: its workloads run ON
# the control planes, so for them the request is satisfiable.)
#
# WHY THE NIGHTLY WINDOW COSTS NOTHING HERE. Every `low-power` node stays
# powered through it, so no replica ever fails, nothing goes `degraded`, no
# `LonghornVolumeStatusWarning` fires, and the cluster-wide tuppr gate
# (`status.robustness != "degraded"`) never stalls a Talos drain. That gate is
# what ruled out every design that kept a replica on fluttershy or kerfuffle.
#
# UNLIKE the earlier `critical`-only shape, three replicas across FIVE eligible
# nodes leaves two spare, so Longhorn CAN rebuild if a single node dies. That is
# a real improvement: a control-plane outage or Talos upgrade no longer strands
# these volumes degraded until the node returns.
#
# COUPLING TO WATCH. If the `low-power` tag ever shrinks to three nodes, this
# recovers the old no-spare-node behaviour silently — nothing alerts on it. And
# if hard-hat or shining-armor is ever added to the nightly shed, it must lose
# the tag at the same time, or the nightly-degraded problem returns.
#
# NOTE `low-power` IS NOT `battery`. In a real Battery event hard-hat does go
# down, so a replica there will fail and the volume will degrade. That is
# expected and acceptable — Battery is an emergency, not a nightly routine.
#
# ⚠️ CHANGING THE CLASS IN GIT DOES NOT MIGRATE ANYTHING, AND IS NOT SAFE TO
# POINT THE LIVE PVCs AT. All three PVCs carry
# `kustomize.toolkit.fluxcd.io/force: enabled` (a commonLabel from
# kubernetes/components/volsync), and `PersistentVolumeClaim.spec.
# storageClassName` is immutable — so editing the storage class of a live PVC in
# Git makes Flux hit the immutable-field conflict and, because `force` is on,
# DELETE AND RECREATE THE PVC, destroying the data. This class is safe to adopt
# only at a deliberate re-provision (VolSync restore, namespace rebuild, DR).
# Migrating the EXISTING volumes is done live on the `volumes.longhorn.io` CRs
# and is a genuine data relocation — see
# docs/cluster-consolidation/30-longhorn-media-tier.md §6.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-media
reclaimPolicy: Delete
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "3"
  # `low-power` = the nodes that stay powered through the nightly Low Power
  # window: the three control planes plus hard-hat and shining-armor. It is a
  # SEPARATE tag from `critical` on purpose -- `critical` means "Tier-0/1 storage
  # tier", and borrowing it here would both dilute that meaning and pile every
  # media config volume onto the same three disks that already serve the
  # registry, home-assistant, technitium, mosquitto and tsidp.
  #
  # Nodes carry more than one tag, so the control planes are
  # ["critical", "low-power"] and hard-hat/shining-armor are ["bulk", "low-power"].
  # fluttershy and kerfuffle are deliberately NOT tagged: they are the workers
  # that get shed, and a replica there is exactly what makes the volume degrade
  # every night.
  #
  # WHY 3 REPLICAS IS ENOUGH, and why at least one always lands on a control
  # plane: the tag covers five nodes, only TWO of which are not control planes
  # (hard-hat, shining-armor). `replica-soft-anti-affinity` is false, so Longhorn
  # places at most one replica per node -- three replicas therefore cannot fit on
  # the two non-control-plane nodes, and at least one MUST land on a control
  # plane. That is a structural guarantee, not a probability, and it is what
  # keeps a local replica available to the pod overnight.
  nodeSelector: "low-power"
  dataLocality: disabled
  replicaAutoBalance: best-effort
  staleReplicaTimeout: "30"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
