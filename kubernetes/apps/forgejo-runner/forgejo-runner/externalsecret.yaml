---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# The runner's identity. Both fields come from Forgejo's offline registration
# flow (`forgejo forgejo-cli actions register --secret <40 hex chars>`), which
# is the only registration method that does not require pasting a value out of
# the web UI on every rebuild:
#
#   token = the 40-character secret you chose
#   uuid  = the identifier that command prints, which is just the hex encoding
#           of the secret's first 16 characters -- so the pair is reproducible
#           and re-running the command with the same first 16 characters
#           rotates the secret in place rather than creating a second runner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-config
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      templateFrom:
        - target: Data
          configMap:
            name: ${APP}-config
            items:
              - key: config.yml
                templateAs: Values
  dataFrom:
    # Path within the `secrets` mount; the store pins `path: secrets`.
    - extract:
        key: clusters/equestria/apps/forgejo/runner
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "runner_$1"
