---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Region exits (docs/plans/region-exits.md, ADR 0005): exit nodes that leave
# through Mullvad, one privileged pod each (gluetun, tailscaled, NetBird and,
# later, the region picker sharing one network namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: region-exits
components:
  - ../../components/alerts
  - ../../components/common
  - ../../components/repos/app-template
resources:
  - ./app/ks.yaml
patches:
  # The pods create kernel interfaces and set routing rules and sysctls, so the
  # namespace is privileged (ADR 0005). A patch, not a top-level `labels:`:
  # that would label every object, and a `metadata.labels` on this file is
  # ignored by kustomize (`kubectl kustomize` drops it: the peers that use it,
  # e.g. netbird-system, render their Namespace unlabelled). Today the label
  # changes nothing -- talos/patches/controller/cluster.yaml deletes the
  # PodSecurity admission config, so nothing is enforced -- but it is what
  # keeps these pods running if enforcement ever comes back.
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
