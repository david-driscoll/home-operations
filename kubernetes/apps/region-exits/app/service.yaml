---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/service.json
#
# Every region exit's picker, for the overview at / on the wonderbolts route
# (helmrelease.yaml). Any picker builds the overview, from each region exit's
# own Service, so one region exit being down only takes its row down. It lives
# here because app-template pins each Service's selector to one controller.
apiVersion: v1
kind: Service
metadata:
  name: region-exits-pickers
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: region-exits
    app.kubernetes.io/instance: region-exits
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
