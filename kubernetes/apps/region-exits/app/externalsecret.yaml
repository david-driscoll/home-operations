---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# spitfire's Mullvad WireGuard key and tunnel address, written to OpenBao by
# stacks/netbird (region-exit-devices.ts, plan §C1). gluetun takes them as env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: region-exit-spitfire-mullvad
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: region-exit-spitfire-mullvad
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: third-party-tokens/mullvad/region-exits
        property: spitfire_private_key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: third-party-tokens/mullvad/region-exits
        property: spitfire_address
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# spitfire's NetBird setup key, written to OpenBao by stacks/netbird (plan
# §C2): ephemeral, reusable, auto-group `region-exit-spitfire`. The netbird
# container takes it as NB_SETUP_KEY and enrols with it on every pod start,
# since its state is an emptyDir.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: region-exit-spitfire-netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: region-exit-spitfire-netbird
    creationPolicy: Owner
  data:
    - secretKey: NB_SETUP_KEY
      remoteRef:
        key: third-party-tokens/netbird/setup-keys
        property: region_exit_spitfire
---
