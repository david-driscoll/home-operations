---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# The region exits (docs/plans/region-exits.md §D, ADR 0005). One controller
# per region exit; spitfire (United States) is the prototype. In its pod:
#
#   routing (init)  sysctls, the eth0 bypass for tailscaled's own packets, the
#                   kill switch (resources/routing.sh)
#   gluetun         Mullvad WireGuard on tun0; its firewall, its DNS-over-TLS on
#                   127.0.0.1:53 (resources/post-rules.txt)
#   tailscale       containerboot, advertising an exit node
#   netbird         the routing peer for the `region-spitfire` route (#3139)
#   picker          the region picker (#3140)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app region-exits
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    serviceAccount:
      spitfire: {}

    # containerboot keeps tailscaled's state in a Secret (TS_KUBE_SECRET), so a
    # restart keeps the node's identity. It needs create (which cannot be
    # scoped by name) and get/update/patch on its own Secret, and posts events.
    rbac:
      roles:
        spitfire:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["region-exit-spitfire-tailscale"]
              verbs: ["get", "update", "patch"]
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["get", "create", "patch"]
            # The picker (#3140) saves the picked region in its state
            # ConfigMap. create cannot be scoped by name (the name is in the
            # body, not the URL, when RBAC decides), so it is namespace-wide;
            # it can make a ConfigMap but not read or change any other.
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["region-exit-spitfire-state"]
              verbs: ["get", "patch"]
      bindings:
        spitfire:
          type: RoleBinding
          roleRef:
            identifier: spitfire
          subjects:
            - identifier: spitfire

    controllers:
      spitfire:
        replicas: 1
        # Two pods would be two exit nodes on one tailscaled identity and one
        # Mullvad key.
        strategy: Recreate
        # Named, not `reloader.stakater.com/auto`: auto would roll the pod
        # whenever the picker writes region-exit-spitfire-state, i.e. on every
        # region pick (reloadOnCreate is on, so even the first). The picker
        # switches gluetun live; the state ConfigMap only has to be read at the
        # next start. Without `auto`, Reloader watches exactly these lists
        # (Reloader 2.x, chart 2.2.19). A new ConfigMap or Secret the pod
        # reads goes here too.
        annotations:
          configmap.reloader.stakater.com/reload: "region-exit-spitfire-defaults,region-exit-routing,region-exit-picker"
          secret.reloader.stakater.com/reload: "region-exit-spitfire-mullvad,region-exit-spitfire-netbird,tailscale-region-exit-authkey"
        serviceAccount:
          identifier: spitfire
        pod:
          automountServiceAccountToken: true
          # Everything in the pod resolves through gluetun's DNS-over-TLS, over
          # the tunnel. tailscaled answers exit-node clients' DNS from this
          # resolver, so their DNS follows the region (§D2).
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - 127.0.0.1
        initContainers:
          routing:
            image:
              repository: tailscale/tailscale
              tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            command: ["/bin/sh", "/scripts/routing.sh"]
            securityContext:
              # sysctls under /proc/sys/net need a privileged container on Talos.
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          gluetun:
            image:
              repository: qmcgaw/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # A gluetun killed without its cleanup (OOMKilled, a failed liveness
            # probe) leaves its ip rule 101 and tun0 in the pod's namespace,
            # which outlives the container, and the restart then fails on
            # "adding IPv4 rule: file exists" in a loop. Clear both first; on a
            # fresh pod there is nothing to clear. (Busybox's ip, in the image.)
            command:
              - /bin/sh
              - -c
              - >-
                ip rule del priority 101 2>/dev/null;
                ip -6 rule del priority 101 2>/dev/null;
                ip link del tun0 2>/dev/null;
                exec /gluetun-entrypoint
            env:
              VPN_SERVICE_PROVIDER: mullvad
              VPN_TYPE: wireguard
              # The name routing.sh and post-rules.txt match on (gluetun's
              # WireGuard default is wg0).
              VPN_INTERFACE: tun0
              # DNS-over-TLS on 127.0.0.1:53, upstream over the tunnel.
              DNS_SERVER: "on"
              DNS_UPSTREAM_RESOLVER_TYPE: dot
              DNS_UPSTREAM_IPV6: "off"
              # No block lists. gluetun downloads and holds them in memory at
              # every start (BLOCK_MALICIOUS and BLOCK_SURVEILLANCE default on),
              # which OOMKilled it at 256Mi; and an exit node's clients expect
              # the region's answers, not a second filter on top of their own.
              BLOCK_MALICIOUS: "off"
              BLOCK_SURVEILLANCE: "off"
              BLOCK_ADS: "off"
              # Never off the pod. The picker (#3140) calls it on loopback.
              HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
              # Every route open to loopback, with no key: v3.41.3's built-in
              # role omits PUT /v1/vpn/settings, which the picker switches
              # with. Loopback is the boundary (internal/server/middlewares/auth).
              HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
              # Equestria's pods and Services, and its control planes: the
              # kubernetes Service is socket-load-balanced to a control-plane
              # address before routing, and containerboot needs the API for
              # TS_KUBE_SECRET. routing.sh's region-exit-out chain repeats these;
              # change both together.
              FIREWALL_OUTBOUND_SUBNETS: "10.206.0.0/16,10.196.0.0/16,10.10.206.0/24"
              # tailscaled's and NetBird's fixed WireGuard ports
              # (TS_TAILSCALED_EXTRA_ARGS, NB_WIREGUARD_PORT below), on eth0,
              # for peers dialling in directly. Only on the default interface:
              # gluetun opens these per default route.
              # And the picker's 8080, for the Gateway and the kubelet's
              # probes on eth0; routing.sh drops it on tailscale0 and wt0.
              FIREWALL_INPUT_PORTS: "41641,8080,51821"
            envFrom:
              # WIREGUARD_PRIVATE_KEY, WIREGUARD_ADDRESSES (IPv4 /32 only, so
              # the tunnel is IPv4 only).
              - secretRef:
                  name: region-exit-spitfire-mullvad
              # SERVER_COUNTRIES: the default region, then the picked one,
              # which wins because it comes later.
              - configMapRef:
                  name: region-exit-spitfire-defaults
              - configMapRef:
                  name: region-exit-spitfire-state
                  optional: true
            probes:
              # exec, not httpGet: gluetun's INPUT policy drops the kubelet.
              liveness: &gluetun-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *gluetun-probe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                # The block lists (off above) are what filled 256Mi; this is
                # headroom on top, not a measured need.
                memory: 512Mi
          tailscale:
            image:
              repository: tailscale/tailscale
              tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            env:
              TS_HOSTNAME: spitfire
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-region-exit-authkey
                    key: authkey
              TS_AUTH_ONCE: "true"
              TS_KUBE_SECRET: region-exit-spitfire-tailscale
              # Reach the API by KUBERNETES_SERVICE_HOST, not
              # kubernetes.default.svc: the pod resolves through gluetun's
              # DNS-over-TLS (dnsPolicy None), which knows no cluster names.
              # Read by containerboot and tailscaled's kube state store alike
              # (cmd/containerboot/kube.go, ipn/store/kubestore, v1.104.4).
              TS_KUBERNETES_READ_API_SERVER_ADDRESS_FROM_ENV: "true"
              TS_USERSPACE: "false"
              # The image points `iptables` at the legacy backend, which the
              # Talos kernel lacks (as for Technitium's sidecar).
              TS_DEBUG_FIREWALL_MODE: nftables
              # gluetun owns resolv.conf (127.0.0.1); tailscaled forwards
              # clients' DNS to it.
              TS_ACCEPT_DNS: "false"
              TS_EXTRA_ARGS: "--advertise-exit-node --accept-routes=false"
              # Fixed, for gluetun's FIREWALL_INPUT_PORTS. Change both together.
              TS_TAILSCALED_EXTRA_ARGS: "--port=41641"
              TS_ENABLE_HEALTH_CHECK: "true"
              TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
            probes:
              liveness: &tailscale-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *tailscale-probe
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          netbird:
            # The routing peer for `region-spitfire` (stacks/netbird, plan
            # §C2, §D2), in kernel mode on wt0. Its own packets carry mark
            # 0x1bd00 and leave over eth0 (routing.sh rule 91); its peers'
            # traffic is forwarded wt0 -> tun0 (post-rules.txt), and never to
            # eth0 (routing.sh's mangle kill switch).
            image:
              repository: netbirdio/netbird
              tag: 0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
            env:
              NB_MANAGEMENT_URL: https://netbird.${ROOT_DOMAIN}
              NB_SETUP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: region-exit-spitfire-netbird
                    key: NB_SETUP_KEY
              NB_HOSTNAME: spitfire
              # A routing peer, never a client: it must not pick up another
              # peer's exit route.
              NB_DISABLE_CLIENT_ROUTES: "true"
              # gluetun owns :53 in this namespace. NB_DISABLE_DNS alone still
              # binds <wt0 address>:53, so park NetBird's resolver on loopback
              # as Technitium's sidecar does. NB_* env applies only at
              # enrolment; the state below is an emptyDir and the key
              # ephemeral, so every pod enrols fresh and always takes it.
              NB_DISABLE_DNS: "true"
              NB_DNS_RESOLVER_ADDRESS: "127.0.0.1:5053"
              # Fixed for gluetun's FIREWALL_INPUT_PORTS, and clear of
              # tailscale's 41641. Change both together.
              NB_WIREGUARD_PORT: "51821"
              NB_LOG_LEVEL: info
              NB_LOG_FILE: console
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # The region picker (#3140, ./picker.ts): /spitfire on
          # wonderbolts.<root domain>, /status for in-cluster readers.
          picker:
            image:
              # The same pin as netbird-system/proxy-watchdog.
              repository: node
              tag: 24-alpine@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
            # Node strips the types itself.
            command: ["node", "/app/picker.ts"]
            env:
              REGION_EXIT_NAME: spitfire
              PORT: "8080"
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              NODE_EXTRA_CA_CERTS: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            probes:
              liveness: &picker-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &picker-port 8080
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *picker-probe
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault

    persistence:
      routing:
        type: configMap
        name: region-exit-routing
        advancedMounts:
          spitfire:
            routing:
              - path: /scripts/routing.sh
                subPath: routing.sh
                readOnly: true
            gluetun:
              - path: /iptables/post-rules.txt
                subPath: post-rules.txt
                readOnly: true
      # NetBird's peer state. An emptyDir on purpose: the setup key is
      # ephemeral, so each pod enrols a new peer and management removes the
      # old one, and enrolment is the only time NB_* env applies.
      netbird-state:
        type: emptyDir
        advancedMounts:
          spitfire:
            netbird:
              - path: /var/lib/netbird
      picker:
        type: configMap
        name: region-exit-picker
        advancedMounts:
          spitfire:
            picker:
              - path: /app
                readOnly: true
      # gluetun writes servers.json here; the picker reads the Mullvad
      # countries and cities from it.
      gluetun:
        type: emptyDir
        advancedMounts:
          spitfire:
            gluetun:
              - path: /gluetun
            picker:
              - path: /gluetun
                readOnly: true

    service:
      spitfire:
        controller: spitfire
        ports:
          http:
            port: *picker-port

    route:
      # The region picker. /spitfire only for now; / is the overview (#3143).
      wonderbolts:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "wonderbolts.${ROOT_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /spitfire
            backendRefs:
              - identifier: spitfire
                port: *picker-port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user
