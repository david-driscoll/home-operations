---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
#
# The region picker (GLOSSARY.md): family and admins only. Friends may use the
# region exits but not move them (ADR 0005).
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: wonderbolts
spec:
  name: Region exits
  category: Applications
  description: Choose where the region exits leave the internet from
  url: &url https://wonderbolts.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/mullvad.svg
  access_policy:
    groups:
      - family
      - admins
  authentik:
    proxy:
      mode: "forward_single"
      externalHost: *url
  gatus:
    - group: "Applications"
      # No page at / until the overview (#3143). Every path here is behind
      # forward auth, and the picker has no unauthenticated route through the
      # Gateway (its /healthz is for the kubelet only), so this checks the
      # door instead: the route is served and Authentik turns an anonymous
      # request away with its sign-in redirect. Following that redirect would
      # only test Authentik's own page. A 200 here means the picker answered
      # without a login -- forward auth is off the route.
      url: https://wonderbolts.${ROOT_DOMAIN}/spitfire
      method: GET
      client:
        ignore-redirect: true
      conditions:
        - "[STATUS] == 302"
