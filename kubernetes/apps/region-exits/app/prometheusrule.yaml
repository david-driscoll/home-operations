---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# A broken region exit alerts before family notice (docs/plans/region-exits.md
# §D5, #3142). The series come from each region picker's GET /metrics
# (metrics.ts, scraped by the HelmRelease's ServiceMonitor) and carry
# region_exit=<name>, so these rules cover all five region exits. Routing is
# Alertmanager's default (observability/alertmanager/config.yaml): critical
# and warning both go to Pushover.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: region-exits
spec:
  groups:
    - name: region-exits
      rules:
        # No picker answering /metrics for a region exit: its pod is gone,
        # Pending or crash-looping, or the picker in it is dead, so every
        # alert below is silent for it. One rule per region exit, as absent()
        # cannot group: the ServiceMonitor's job label is the app's name for
        # all five, and each target's `service` label is region-exits-<name>.
        # Like the peers' (coder, forgejo), `== 1` makes a failing scrape
        # count as absent, and 15m rides out a Recreate rollout. absent() of
        # a comparison has no labels, and annotations only see the result's,
        # so label_replace puts region_exit on it.
        - alert: RegionExitDown
          annotations: &down-annotations
            summary: Region exit {{ $labels.region_exit }} is down.
            description: >-
              Prometheus has not scraped region exit {{ $labels.region_exit }}'s picker for 15
              minutes: its pod is missing, Pending or crash-looping, or its picker is dead. Its
              clients may have no exit, and its other alerts cannot fire. Check
              `kubectl -n region-exits get pods -l app.kubernetes.io/controller={{ $labels.region_exit }}`.
          expr: |
            label_replace(absent(up{namespace="region-exits", service="region-exits-spitfire"} == 1), "region_exit", "spitfire", "", "")
          for: &down-for 15m
          labels: &down-labels
            severity: critical
        - alert: RegionExitDown
          annotations: *down-annotations
          expr: |
            label_replace(absent(up{namespace="region-exits", service="region-exits-soarin"} == 1), "region_exit", "soarin", "", "")
          for: *down-for
          labels: *down-labels
        - alert: RegionExitDown
          annotations: *down-annotations
          expr: |
            label_replace(absent(up{namespace="region-exits", service="region-exits-fleetfoot"} == 1), "region_exit", "fleetfoot", "", "")
          for: *down-for
          labels: *down-labels
        - alert: RegionExitDown
          annotations: *down-annotations
          expr: |
            label_replace(absent(up{namespace="region-exits", service="region-exits-misty-fly"} == 1), "region_exit", "misty-fly", "", "")
          for: *down-for
          labels: *down-labels
        - alert: RegionExitDown
          annotations: *down-annotations
          expr: |
            label_replace(absent(up{namespace="region-exits", service="region-exits-high-winds"} == 1), "region_exit", "high-winds", "", "")
          for: *down-for
          labels: *down-labels
        # gluetun's /v1/vpn/status is not "running", or gluetun does not
        # answer. Every client of this region exit is cut off meanwhile (the
        # kill switch fails closed), hence critical. 5m rides out a region
        # switch's reconnect.
        - alert: RegionExitTunnelDown
          annotations:
            summary: Region exit {{ $labels.region_exit }} has no Mullvad tunnel.
            description: >-
              gluetun on region exit {{ $labels.region_exit }} has not reported its WireGuard tunnel
              running for 5 minutes, so its clients' traffic is being dropped. Check the gluetun
              container's log (`kubectl -n region-exits logs -l app.kubernetes.io/controller={{ $labels.region_exit }} -c gluetun`).
          expr: |
            max by (namespace, region_exit) (region_exit_tunnel_up) == 0
          for: 5m
          labels:
            severity: critical
        # Traffic leaves from a country other than the one the region exit is
        # set to. The match series is absent while there is no egress IP (the
        # tunnel alert covers that), and a switch in progress clears within
        # the 15m window: gluetun's selection changes at once, its public-IP
        # lookup after the reconnect.
        - alert: RegionExitWrongCountry
          annotations:
            summary: Region exit {{ $labels.region_exit }} leaves from the wrong country.
            description: >-
              Region exit {{ $labels.region_exit }} is set to
              {{ with printf "region_exit_region_info{region_exit=%q}" $labels.region_exit | query }}{{ . | first | label "country" }}{{ else }}an unknown region{{ end }}
              but its traffic has left from
              {{ with printf "region_exit_egress_info{region_exit=%q}" $labels.region_exit | query }}{{ . | first | label "country" }}{{ else }}an unknown country{{ end }}
              for 15 minutes. Mullvad's IP geolocation may disagree with its server list; compare
              the picker's /status with the server gluetun connected to.
          expr: |
            max by (namespace, region_exit) (region_exit_egress_country_match) == 0
          for: 15m
          labels:
            severity: warning
        # One alert per overlay: tailscaled not Running with a live control
        # connection, or NetBird's wt0 gone or down (overlays.ts). Held back
        # while the tunnel is down: the pod resolves DNS through gluetun, so a
        # dead tunnel can take the overlays' control connections with it, and
        # RegionExitTunnelDown already says so.
        - alert: RegionExitOverlayOffline
          annotations:
            summary: Region exit {{ $labels.region_exit }} is offline on {{ $labels.overlay }}.
            description: >-
              Region exit {{ $labels.region_exit }} has not been connected to {{ $labels.overlay }}
              for 10 minutes, so {{ $labels.overlay }} clients cannot use it. Check the
              {{ $labels.overlay }} container's log in the region-exits namespace.
          expr: |
            (
              max by (namespace, region_exit, overlay) (region_exit_overlay_connected) == 0
            )
            unless on (namespace, region_exit)
            (
              max by (namespace, region_exit) (region_exit_tunnel_up) == 0
            )
          for: 10m
          labels:
            severity: warning
