# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-operator
spec:
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    crds:
      create: true
    monitoring:
      podMonitorEnabled: true
    grafanaDashboard:
      create: true
    # THIS VARIABLE DECIDES WHEN EVERY ScheduledBackup RUNS. The operator reads
    # a schedule in its own local time and there is no per-schedule zone (it
    # pins robfig/cron v1, which has no TZ= prefix), so the hours in
    # database/postgres/app/resources/values.yaml and
    # stargate-command/authentik/resources/postgres-values.yaml are local
    # times ONLY because of this line. Take it away and both base backups move
    # to those hours in UTC, four or five hours early.
    #
    # The image carries the zone files this needs (distroless static, checked
    # on 1.30.1). If a later image dropped them Go would fall back to UTC
    # without a word, with the same effect.
    additionalEnv:
      - name: TZ
        value: "${TIMEZONE}"
