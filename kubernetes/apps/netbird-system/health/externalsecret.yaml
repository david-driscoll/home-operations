---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The `automation` service user's PAT, the same token the operator reads
# (../operator/externalsecret.yaml). stacks/netbird mints and rotates it; this
# job only ever GETs with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-health-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-health-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: third-party-tokens/netbird/automation
        property: personal_access_token
