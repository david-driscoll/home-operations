---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
#
# Every five minutes: read management and post an Alertmanager alert for each
# problem (health.ts). Each alert lapses 15 minutes after the last run that
# posted it. No ServiceAccount token: the job never calls the Kubernetes API.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbird-health
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: health
              image: node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
              # Node strips the types itself.
              command: ["node", "/app/health.ts"]
              env:
                - name: NETBIRD_URL
                  value: https://netbird.${ROOT_DOMAIN}
                # A group or domain that does not exist is skipped, so these
                # can name what other PRs add (dns-servers in #3055, the app
                # domain in #3053).
                - name: NETBIRD_PEER_GROUPS
                  value: gateways,dns-servers
                - name: NETBIRD_CUSTOM_DOMAINS
                  value: nb.${ROOT_DOMAIN},nbidp.${ROOT_DOMAIN}
                # The proxy's cluster address, NB_PROXY_DOMAIN in ../nbidp
                # (components/netbird/nbidp.ts nbidpClusterAddress; D38).
                - name: NETBIRD_PROXY_CLUSTER
                  value: ek.${ROOT_DOMAIN}
                - name: ALERTMANAGER_URL
                  value: http://alertmanager-operated.observability.svc.cluster.local:9093
              envFrom:
                - secretRef:
                    name: netbird-health-api-key
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: app
              configMap:
                name: netbird-health
