---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# NetBird's in-cluster entry path (#2889, docs/plans/netbird-mirror.md §G):
# the operator, and the routing peers it runs; and nbidp (#2891, §K), the
# private reverse proxy and Dex behind "log in with NetBird"; and the failover
# watchdog (#3001, §E) that moves the server's DNS lease to the standby. Routing peers are privileged
# pods (NET_ADMIN, a WireGuard interface), hence the PodSecurity label.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbird-system
metadata:
  labels:
    pod-security.kubernetes.io/enforce: privileged
components:
  - ../../components/alerts
  - ../../components/common
  # nbidp's HelmRelease (#2891).
  - ../../components/repos/app-template
resources:
  - ./operator/ks.yaml
  - ./router/ks.yaml
  - ./nbidp/ks.yaml
  - ./failover-watchdog/ks.yaml
  # Health checks (D47): gateways, proxy domains, the nbidp proxy.
  - ./health/ks.yaml
