---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The proxy's account-scoped token, minted by stacks/netbird
# (dynamic/netbird/NetbirdProxyToken). It registers this proxy with management
# as a bring-your-own proxy (cluster address NB_PROXY_DOMAIN), and can serve this
# account's services and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nbidp-proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nbidp-proxy
    creationPolicy: Owner
  data:
    - secretKey: NB_PROXY_TOKEN
      remoteRef:
        key: third-party-tokens/netbird/nbidp-proxy
        property: proxy_token
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# Dex's whole config, rendered by stacks/authentik
# (components/netbird/nbidp.ts renderDexConfig) with the OAuth client it gave
# Authentik's "NetBird" source. A Secret, not a ConfigMap: it carries that
# client's secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nbidp-dex-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nbidp-dex-config
    creationPolicy: Owner
  data:
    - secretKey: config.yaml
      remoteRef:
        key: apps/nbidp/dex
        property: config_yaml
