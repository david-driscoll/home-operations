---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./certificate.yaml
  # *.app.<root domain> alone, copied to OpenBao by stacks/netbird, and the
  # one-Secret grant that lets it read it.
  - ./app-wildcard-certificate.yaml
  - ./app-wildcard-rbac.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./middleware.yaml
