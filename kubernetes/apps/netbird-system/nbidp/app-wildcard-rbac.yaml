---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/role-rbac-v1.json
#
# stacks/netbird (the Stack's `netbird` ServiceAccount in `pulumi`) copies
# ./app-wildcard-certificate.yaml's Secret into OpenBao. It may read that one
# Secret, by name, and nothing else in this namespace: not nbidp-tls, whose key
# covers Dex's issuer, and not the proxy token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbird-stack-app-wildcard
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [netbird-app-wildcard-tls]
    verbs: [get]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbird-stack-app-wildcard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netbird-stack-app-wildcard
subjects:
  - kind: ServiceAccount
    name: netbird
    namespace: pulumi
