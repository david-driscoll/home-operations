---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/pushsecret_v1alpha1.json
#
# ./app-wildcard-certificate.yaml's Secret, pushed to OpenBao at
# `secrets/apps/netbird/app-wildcard-tls` (`tls_crt`, `tls_key`), where hosts
# other than this proxy read the `*.app.<root domain>` certificate
# (docs/plans/netbird-mirror.md D39).
#
# Through ClusterSecretStore/openbao, whose `eso-equestria` policy is read-only
# EXCEPT for this one path: create/read/update on its data and metadata, and
# nothing else (bootstrap/openbao/equestria-init.sh). That is a deliberate
# exception to the read-only rule (stacks/system/applications.ts keeps its
# reasoning for every other case); a narrower identity would have been a second
# store and role for one certificate.
#
# ESO owns the path: it marks the KV secret as managed by external-secrets and
# will not overwrite one it does not own, so nothing else writes it. A renewal
# changes the Secret and ESO pushes it within refreshInterval. deletionPolicy
# None: removing this leaves the last copy in OpenBao for its readers.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: netbird-app-wildcard-tls
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: netbird-app-wildcard-tls
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: apps/netbird/app-wildcard-tls
          property: tls_crt
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: apps/netbird/app-wildcard-tls
          property: tls_key
