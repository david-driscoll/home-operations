---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
#
# The proxy's TLS certificate for the nbidp name, issued by DNS-01, so nothing
# about the name has to be reachable from the internet: there is no public
# record for it and no inbound path to the proxy. NetBird clients resolve it
# from the record management synthesizes for the private service, which points
# at the proxy's tunnel IP.
#
# Mounted as static certs (NB_PROXY_CERTIFICATE_DIRECTORY, tls.crt/tls.key).
# The proxy watches the files, so a renewal needs no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nbidp-tls
spec:
  secretName: nbidp-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  commonName: nbidp.${ROOT_DOMAIN}
  dnsNames:
    - nbidp.${ROOT_DOMAIN}
