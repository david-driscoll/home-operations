---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-failover-watchdog
---
# Its own state ConfigMap, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbird-failover-watchdog
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [netbird-failover-watchdog-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbird-failover-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netbird-failover-watchdog
subjects:
  - kind: ServiceAccount
    name: netbird-failover-watchdog
