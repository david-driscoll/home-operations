---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The estate's Cloudflare DNS token and zone id, the same OpenBao path
# external-dns and cert-manager read (network/secrets/cloudflare-default-domain.yaml).
# The watchdog reads the NetBird records and repoints the management one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-failover-watchdog-cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-failover-watchdog-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: third-party-tokens/cloudflare/dns-zone
        property: credential
    - secretKey: CF_ZONE_ID
      remoteRef:
        key: third-party-tokens/cloudflare/dns-zone
        property: zoneId
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The NetBird backup bucket's Garage key (stacks/system garage.ts writes it).
# Every NetBird host publishes its view of the others there
# (components/netbird/failoverView.ts), and the watchdog reads it as the
# second view a flip needs (ADR 0002, #3161). It is the bucket's read-write
# key, the only one there is; the watchdog only GETs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-failover-watchdog-garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-failover-watchdog-garage
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: apps/netbird/garage-backup
        property: endpoint
    - secretKey: S3_BUCKET
      remoteRef:
        key: apps/netbird/garage-backup
        property: bucket
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: apps/netbird/garage-backup
        property: username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: apps/netbird/garage-backup
        property: password
