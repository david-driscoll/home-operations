---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The estate's Cloudflare DNS token and zone id, the same OpenBao path
# external-dns and cert-manager read (network/secrets/cloudflare-default-domain.yaml).
# The watchdog reads the NetBird records and repoints the management one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-failover-watchdog-cloudflare
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-failover-watchdog-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: third-party-tokens/cloudflare/dns-zone
        property: credential
    - secretKey: CF_ZONE_ID
      remoteRef:
        key: third-party-tokens/cloudflare/dns-zone
        property: zoneId
