---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# The region picker (docs/plans/wonderbolts-nuxt.md, ADR 0006): the Nuxt app in
# apps/wonderbolts. Stateless, so two replicas; it asks each region exit's
# agent for its state on every request and keeps nothing.
#
# Not routed yet (phase 3). wonderbolts.<root domain> still goes to the region
# exits' own pages until phase 4 adds the route here and removes theirs; until
# then, reach it with `kubectl port-forward` and send the X-authentik-* headers
# by hand.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wonderbolts
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 7
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        replicas: 2
        strategy: RollingUpdate
        pod:
          # It never calls the Kubernetes API: the agents write the state
          # ConfigMaps with their own ServiceAccounts.
          automountServiceAccountToken: false
          imagePullSecrets:
            # ./externalsecret.yaml: the forge refuses anonymous pulls.
            - name: wonderbolts-image-pull
          securityContext:
            runAsNonRoot: true
            # The image's own user (node:24-alpine's `node`).
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        containers:
          app:
            image:
              # Built and pushed by .forgejo/workflows/wonderbolts-image.yml,
              # which prints this line when it is behind. Pinned by digest: a
              # tag in this registry can be overwritten by the push token.
              repository: git.${ROOT_DOMAIN}/estate-images/wonderbolts
              tag: 0.1.0-1d614c6d2a5c@sha256:af580e097eb9f3f37bcd95bfcfbb2efa8f98af711e3ca481e96f9829d03ed27d
            # The image's cmd is `node /app/server/index.mjs` with PORT=8080
            # and HOST=0.0.0.0; the runtime config is the app's
            # nuxt.config.ts runtimeConfig, overridden here.
            env:
              TZ: America/New_York
              NUXT_REGION_EXITS: "spitfire,soarin,fleetfoot,misty-fly,high-winds"
              # Each region exit's own Service (../region-exits/helmrelease.yaml).
              NUXT_AGENT_URL_TEMPLATE: "http://region-exits-{name}.netbird-system.svc.cluster.local:8080"
              # Who may move a region exit (ADR 0006); friends only look.
              NUXT_MOVER_GROUPS: "family,admins"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # Nitro writes nothing, but node and its libraries may want a /tmp on a
      # read-only root.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
