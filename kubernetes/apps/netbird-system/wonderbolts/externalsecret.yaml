---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The forge's `estate-images` read:package token as a dockerconfigjson, for
# the region picker's imagePullSecrets: the forge is REQUIRE_SIGNIN_VIEW, so an
# anonymous pull of git.<root domain>/estate-images/wonderbolts is refused.
#
# The same OpenBao key as ../../pulumi/workspace-image/externalsecret.yaml
# (minted by stacks/system/forgejo-github-mirror.ts, which names that file as
# its reader; this is a second one, reading the same `username` and `token`).
# One token for every estate image is the point of the `estate-images`
# account; a second token would only be a second thing to rotate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wonderbolts-image-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # As for the workspace pull secret: a rotated token is replaced before the
  # old one is deleted, and this is the gap a new node could not pull in.
  refreshInterval: 4m
  target:
    name: wonderbolts-image-pull
    creationPolicy: Owner
    # A node pulling the image while this is being recreated still finds it.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "git.${ROOT_DOMAIN}": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: clusters/equestria/apps/pulumi/workspace-image-pull
