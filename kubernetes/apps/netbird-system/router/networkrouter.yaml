---
# The second way into Equestria for NetBird clients (#2889,
# docs/plans/netbird-mirror.md §G): three routing peers, one per node, for the
# `internal` Gateway's address and the Authentik VIP, so cluster apps stay
# reachable while the home gateways (#2887) are down.
#
# WHO OWNS WHAT. The operator's own model cannot express this route. Its
# NetworkResource (v0.9.0) publishes a Service's ClusterIP and nothing else,
# while clients resolve <app>.<root domain> through Technitium to the Gateway's
# LoadBalancer IP and to the Authentik VIP, which Traefik's internal Service
# carries as an externalIP. An IP/CIDR target is upstream's open issue
# netbirdio/kubernetes-operator#305. So:
#
#   The operator always creates a network named after this object
#     (`equestria-routers`), with its own router, group and ephemeral setup
#     key; v0.9.0 cannot be pointed at an existing network. That network is
#     the Equestria entry's (#3163): stacks/netbird finds it by this name
#     (stacks/netbird/routerNetwork.ts, whose test pins it), so RENAMING OR
#     DELETING THIS OBJECT replaces the network and takes the entry down
#     until the next stacks/netbird run.
#   stacks/netbird (Pulumi) owns every NetBird object that carries meaning,
#     inside that network: the two /32 resources (resource group
#     `equestria-entry`) and a router whose peer group is `k8s-routers`; and
#     outside it the `k8s-router` setup key that enrols into that group, and
#     the DNS zone named below. The policy that lets users reach
#     `equestria-entry` is #2888.
#   This file owns only the routing-peer pods. The operator runs them as a
#     Deployment with a PDB, probes and restart-on-logout, and podTemplate
#     below swaps its generated setup key for stacks/netbird's, so the pods
#     sit in `k8s-routers` (which also serves `exit-home`) and the operator's
#     own router and group stay empty. Two routers, one network, no fight:
#     each side only ever writes its own router by id.
#
# No NetworkResource, ClusterProxy, SidecarProfile or NetworkEgress anywhere.
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: equestria-routers
spec:
  # Required: the operator refuses to reconcile until a NetBird DNS zone with
  # this NAME exists. stacks/netbird creates it; no records are ever written
  # to it, because there are no NetworkResources.
  dnsZoneRef:
    name: equestria.netbird.internal
  # The operator v0.9.0 default is 0.81.4. Pinned to the server's version
  # (components/netbird/compose.yaml) instead.
  image: ghcr.io/netbirdio/netbird:0.82.1@sha256:335e5df5bcf8a14be6a80b28d67da129a5b05c252641edb2e99380aa410e38c7
  logLevel: info
  workloadOverride:
    replicas: 3
    # A strategic merge patch over the operator's generated pod template
    # (internal/controller/networkrouter_controller.go): containers and env
    # merge by `name`, topologySpreadConstraints by `topologyKey`.
    podTemplate:
      # A PodTemplateSpec, so metadata merges too (workloadOverride.annotations
      # lands on the Deployment, not the pods).
      metadata:
        annotations:
          # The operator mounts four emptyDirs (netbird-run, netbird-lib,
          # ssh-etc, resolv-conf), so the descheduler's DefaultEvictor
          # (evictLocalStoragePods: false) counted these pods as local storage
          # and never evicted one, leaving two peers on one node after a
          # reschedule. Nothing in them outlives the pod: the peer re-enrols
          # from the reusable setup key. Opt in, so
          # RemovePodsViolatingTopologySpreadConstraint can respread them.
          descheduler.alpha.kubernetes.io/evict: "true"
      spec:
        topologySpreadConstraints:
          # The operator ships this constraint as ScheduleAnyway; hard here, so
          # the three peers never share a node. Honor taints, or the untolerated
          # control planes would count as empty domains and pin the skew.
          - topologyKey: kubernetes.io/hostname
            maxSkew: 1
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: networkrouter
                app.kubernetes.io/instance: equestria-routers
        containers:
          - name: netbird
            env:
              - name: NB_SETUP_KEY
                valueFrom:
                  secretKeyRef:
                    name: netbird-k8s-router
                    key: setup_key
