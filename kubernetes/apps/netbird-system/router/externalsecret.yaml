---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The `k8s-router` setup key stacks/netbird mints: reusable, ephemeral, never
# expires, auto-group `k8s-routers`. Peers that enrol with it land in the group
# that stacks/netbird's `equestria` network router names as its peer group, so
# they route that network's resources. networkrouter.yaml hands it to the
# routing-peer pods in place of the key the operator would generate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-k8s-router
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-k8s-router
    creationPolicy: Owner
  data:
    - secretKey: setup_key
      remoteRef:
        key: third-party-tokens/netbird/setup-keys
        property: k8s_router
