---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The operator's NetBird API token: the `k8s-operator` service user's PAT,
# which stacks/netbird mints (admin role, 365-day expiry; section 7 says why
# not network_admin) and writes to OpenBao. Its own identity, not the
# `automation` PAT stacks/netbird itself runs with, which it shared until
# 2026-11: the operator's 15-minute rewrites of its own network and router
# (operator v0.9.0, fixed upstream by #486, unreleased) then read as Pulumi's
# in the audit log. Until stacks/netbird has written the new path this
# ExternalSecret errors and the Secret keeps the old token. The
# chart reads it from Secret `netbird-mgmt-api-key`, key `NB_API_KEY`
# (values `netbirdAPI.keyFromSecret`, the chart default). Reloader restarts
# the operator when stacks/netbird rotates the token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: third-party-tokens/netbird/k8s-operator
        property: personal_access_token
