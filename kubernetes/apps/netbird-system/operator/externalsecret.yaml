---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The operator's NetBird API token: the `automation` service user's PAT, which
# stacks/netbird mints (admin role, 365-day expiry) and writes to OpenBao. The
# chart reads it from Secret `netbird-mgmt-api-key`, key `NB_API_KEY`
# (values `netbirdAPI.keyFromSecret`, the chart default). Reloader restarts
# the operator when stacks/netbird rotates the token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: third-party-tokens/netbird/automation
        property: personal_access_token
