---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# The region exits (docs/plans/region-exits.md §D, ADR 0005). One controller
# per region exit, one replica each: spitfire, soarin, fleetfoot, misty-fly and
# high-winds. spitfire's controller spells everything out and anchors what the
# five share; the others alias those anchors and name only their own Secrets,
# ConfigMaps and hostnames. Their default regions are in kustomization.yaml.
# In each pod:
#
#   routing (init)  sysctls, the eth0 bypass for tailscaled's own packets, the
#                   kill switch (resources/routing.sh)
#   gluetun         Mullvad WireGuard on tun0 and its firewall
#                   (resources/post-rules.txt); no resolver of its own
#   tailscale       containerboot, advertising an exit node
#   netbird         the routing peer for the `region-<name>` route (#3139)
#   picker          the region exit agent (#3140): JSON for the region picker
#                   app and Prometheus (ADR 0006)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app region-exits
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    serviceAccount:
      # spitfire's ServiceAccount and Deployment keep the names they had as
      # the only controller (see the controller).
      spitfire:
        forceRename: region-exits
      soarin: {}
      fleetfoot: {}
      misty-fly: {}
      high-winds: {}

    # containerboot keeps tailscaled's state in a Secret (TS_KUBE_SECRET), so a
    # restart keeps the node's identity. It needs create (which cannot be
    # scoped by name) and get/update/patch on its own Secret, and posts events.
    rbac:
      roles:
        spitfire:
          type: Role
          rules:
            - &create-secrets
              apiGroups: [""]
              resources: ["secrets"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["region-exit-spitfire-tailscale"]
              verbs: ["get", "update", "patch"]
            - &events
              apiGroups: [""]
              resources: ["events"]
              verbs: ["get", "create", "patch"]
            # The picker (#3140) saves the picked region in its state
            # ConfigMap. create cannot be scoped by name (the name is in the
            # body, not the URL, when RBAC decides), so it is namespace-wide;
            # it can make a ConfigMap but not read or change any other.
            - &create-configmaps
              apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["create"]
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["region-exit-spitfire-state"]
              verbs: ["get", "patch"]
        soarin:
          type: Role
          rules:
            - *create-secrets
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["region-exit-soarin-tailscale"]
              verbs: ["get", "update", "patch"]
            - *events
            - *create-configmaps
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["region-exit-soarin-state"]
              verbs: ["get", "patch"]
        fleetfoot:
          type: Role
          rules:
            - *create-secrets
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["region-exit-fleetfoot-tailscale"]
              verbs: ["get", "update", "patch"]
            - *events
            - *create-configmaps
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["region-exit-fleetfoot-state"]
              verbs: ["get", "patch"]
        misty-fly:
          type: Role
          rules:
            - *create-secrets
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["region-exit-misty-fly-tailscale"]
              verbs: ["get", "update", "patch"]
            - *events
            - *create-configmaps
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["region-exit-misty-fly-state"]
              verbs: ["get", "patch"]
        high-winds:
          type: Role
          rules:
            - *create-secrets
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["region-exit-high-winds-tailscale"]
              verbs: ["get", "update", "patch"]
            - *events
            - *create-configmaps
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["region-exit-high-winds-state"]
              verbs: ["get", "patch"]
      bindings:
        spitfire:
          type: RoleBinding
          roleRef:
            identifier: spitfire
          subjects:
            - identifier: spitfire
        soarin:
          type: RoleBinding
          roleRef:
            identifier: soarin
          subjects:
            - identifier: soarin
        fleetfoot:
          type: RoleBinding
          roleRef:
            identifier: fleetfoot
          subjects:
            - identifier: fleetfoot
        misty-fly:
          type: RoleBinding
          roleRef:
            identifier: misty-fly
          subjects:
            - identifier: misty-fly
        high-winds:
          type: RoleBinding
          roleRef:
            identifier: high-winds
          subjects:
            - identifier: high-winds

    controllers:
      spitfire:
        # `region-exits`, its name when it was the only controller, not
        # region-exits-spitfire: Helm creates a renamed Deployment before it
        # deletes the old one, so for a while two spitfire pods would share
        # the Mullvad key and the tailscaled state. Kept, the Deployment is
        # updated in place, and Recreate stops the old pod first. Its
        # Service, Role and RoleBinding take the -spitfire names like the
        # others': the region picker app finds Services by name, and neither runs a pod.
        forceRename: region-exits
        replicas: 1
        # Two pods would be two exit nodes on one tailscaled identity and one
        # Mullvad key.
        strategy: &strategy Recreate
        # Named, not `reloader.stakater.com/auto`: auto would roll the pod
        # whenever the picker writes region-exit-spitfire-state, i.e. on every
        # region pick (reloadOnCreate is on, so even the first). The picker
        # switches gluetun live; the state ConfigMap only has to be read at the
        # next start. Without `auto`, Reloader watches exactly these lists
        # (Reloader 2.x, chart 2.2.19). A new ConfigMap or Secret the pod
        # reads goes here too.
        annotations:
          configmap.reloader.stakater.com/reload: "region-exit-spitfire-defaults,region-exit-routing"
          secret.reloader.stakater.com/reload: "region-exit-spitfire-mullvad,region-exit-spitfire-netbird,tailscale-region-exit-authkey"
          # Region exits are always on: the nightly go-kube-downscaler window
          # (01:00-07:00) would otherwise scale every one to 0, as it did spitfire
          # after #3153. Technitium carries the same exclusion. Redundant
          # since #3158 excludes all of netbird-system, the region exits'
          # namespace, but harmless, and kept so the exclusion survives a
          # namespace move; the other four carry it for the same reason.
          downscaler/exclude: "true"
        serviceAccount:
          identifier: spitfire
        pod: &pod
          automountServiceAccountToken: true
          # The agent image (the picker container) is on the forge's registry,
          # which refuses anonymous pulls (./externalsecret.yaml).
          imagePullSecrets:
            - name: region-exits-image-pull
          # Nothing in the pod reads other Services' variables any more (the
          # overview that did moved to the region picker app, ADR 0006). The
          # kubelet still sets KUBERNETES_SERVICE_HOST/PORT, which the agent
          # reaches the API by.
          enableServiceLinks: false
          # Everything in the pod resolves through the cluster Technitium
          # (decided 2026-11-07, plan §D2, ADR 0005): gluetun, NetBird, the
          # picker, and tailscaled, which answers its exit-node clients' DNS
          # from the first nameserver here (net/dns/resolver/tsdns.go
          # HandleExitNodeDNSQuery and stubResolverForOS, v1.104.4). Home names
          # resolve on both meshes, and Technitium forwards everything else
          # upstream from the home WAN, so geo-DNS answers for home while the
          # region's IP still comes from Mullvad. Accepted trade-off.
          #
          # The pinned ClusterIP of Technitium's `dns` Service, the address
          # CoreDNS forwards the root domain to (equestria/dns/technitium).
          # Lookups leave by eth0, outside the tunnel: the Service CIDR is in
          # FIREWALL_OUTBOUND_SUBNETS (gluetun's rule 99 and its firewall) and
          # in routing.sh's region-exit-out chain. Technitium's recursion is
          # AllowOnlyForPrivateNetworks, and the pod IP is private. The default
          # after `:=` is for offline rendering only and is the same address as
          # cluster-secrets' TECHNITIUM_CLUSTER_IP; change both together.
          # dnsPolicy None, not ClusterFirst: CoreDNS would answer public names
          # from the node's resolver instead of Technitium. No search domains:
          # nothing here resolves a short name.
          dnsPolicy: None
          dnsConfig:
            nameservers:
              - "${TECHNITIUM_CLUSTER_IP:=10.196.0.53}"
        initContainers: &init-containers
          routing:
            image:
              repository: tailscale/tailscale
              tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            command: ["/bin/sh", "/scripts/routing.sh"]
            securityContext:
              # sysctls under /proc/sys/net need a privileged container on Talos.
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          gluetun: &gluetun
            image:
              repository: qmcgaw/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            # A gluetun killed without its cleanup (OOMKilled, a failed liveness
            # probe) leaves its ip rule 101 and tun0 in the pod's namespace,
            # which outlives the container, and the restart then fails on
            # "adding IPv4 rule: file exists" in a loop. Clear both first; on a
            # fresh pod there is nothing to clear. (Busybox's ip, in the image.)
            command:
              - /bin/sh
              - -c
              - >-
                ip rule del priority 101 2>/dev/null;
                ip -6 rule del priority 101 2>/dev/null;
                ip link del tun0 2>/dev/null;
                exec /gluetun-entrypoint
            env:
              VPN_SERVICE_PROVIDER: mullvad
              VPN_TYPE: wireguard
              # The name routing.sh and post-rules.txt match on (gluetun's
              # WireGuard default is wg0).
              VPN_INTERFACE: tun0
              # No resolver of its own: the pod resolves through Technitium
              # (pod dnsConfig above). DNS_SERVER off alone is not enough:
              # gluetun would then rewrite resolv.conf to its plaintext
              # fallback, Cloudflare's 1.1.1.1 (internal/dns/plaintext.go
              # useUnencryptedDNS, v3.41.3). DNS_KEEP_NAMESERVER leaves
              # resolv.conf as the kubelet wrote it, and its own Go lookups (the
              # public-IP APIs, the Mullvad API) read it too (internal/dns/run.go).
              DNS_SERVER: "off"
              DNS_KEEP_NAMESERVER: "on"
              # The DNS loop's 24h ticker would still download the block lists
              # (BLOCK_MALICIOUS and BLOCK_SURVEILLANCE default on) into memory
              # with no server to use them (internal/dns/ticker.go, update.go);
              # that is what once OOMKilled gluetun at 256Mi. Never run it.
              # The server-list updater (UPDATER_PERIOD) defaults to off, and
              # resolves through its own DoH to Cloudflare and Google by IP.
              DNS_UPDATE_PERIOD: "0"
              # What the healthcheck TLS-dials through the tunnel, by IP so it
              # tests the tunnel and not the resolver. The defaults
              # (cloudflare.com:443, github.com:443) resolve through the pod's
              # resolver first, so a resolver fault alone (gluetun's own, then;
              # a Technitium restart, now) failed the startup and periodic
              # checks, and HEALTH_RESTART_VPN (on) tore a working tunnel down
              # in a loop that a VPN restart can never clear. Both certificates
              # carry their IP as a SAN, which Go verifies when ServerName is an
              # IP (internal/healthcheck/checker.go tcpTLSCheck, v3.41.3). The
              # small check is already ICMP to 1.1.1.1 and 8.8.8.8, no DNS.
              HEALTH_TARGET_ADDRESSES: "1.1.1.1:443,8.8.8.8:443"
              # Never off the pod. The picker (#3140) calls it on loopback.
              HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
              # Every route open to loopback, with no key: v3.41.3's built-in
              # role omits PUT /v1/vpn/settings, which the picker switches
              # with. Loopback is the boundary (internal/server/middlewares/auth).
              HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
              # Equestria's pods and Services, and its control planes: the
              # kubernetes Service is socket-load-balanced to a control-plane
              # address before routing, and containerboot needs the API for
              # TS_KUBE_SECRET. routing.sh's region-exit-out chain repeats these;
              # change both together.
              FIREWALL_OUTBOUND_SUBNETS: "10.206.0.0/16,10.196.0.0/16,10.10.206.0/24"
              # tailscaled's and NetBird's fixed WireGuard ports
              # (TS_TAILSCALED_EXTRA_ARGS, NB_WIREGUARD_PORT below), on eth0,
              # for peers dialling in directly. Only on the default interface:
              # gluetun opens these per default route.
              # And the picker's 8080, for the Gateway and the kubelet's
              # probes on eth0; routing.sh drops it on tailscale0 and wt0.
              FIREWALL_INPUT_PORTS: "41641,8080,51821"
            envFrom:
              # WIREGUARD_PRIVATE_KEY, WIREGUARD_ADDRESSES (IPv4 /32 only, so
              # the tunnel is IPv4 only).
              - secretRef:
                  name: region-exit-spitfire-mullvad
              # SERVER_COUNTRIES: the default region, then the picked one,
              # which wins because it comes later.
              - configMapRef:
                  name: region-exit-spitfire-defaults
              - configMapRef:
                  name: region-exit-spitfire-state
                  optional: true
            probes:
              # exec, not httpGet: gluetun's INPUT policy drops the kubelet.
              liveness: &gluetun-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *gluetun-probe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/gluetun-entrypoint", "healthcheck"]
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
            securityContext: &privileged
              privileged: true
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                # gluetun's DNS block lists filled 256Mi; they are never loaded
                # now (above), and this is headroom, not a measured need.
                memory: 512Mi
          tailscale: &tailscale
            image:
              repository: tailscale/tailscale
              tag: v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
            env: &tailscale-env
              TS_HOSTNAME: spitfire
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-region-exit-authkey
                    key: authkey
              TS_AUTH_ONCE: "true"
              TS_KUBE_SECRET: region-exit-spitfire-tailscale
              # Reach the API by KUBERNETES_SERVICE_HOST, not
              # kubernetes.default.svc: the pod resolves through Technitium
              # (dnsPolicy None), which knows no cluster names.
              # Read by containerboot and tailscaled's kube state store alike
              # (cmd/containerboot/kube.go, ipn/store/kubestore, v1.104.4).
              TS_KUBERNETES_READ_API_SERVER_ADDRESS_FROM_ENV: "true"
              TS_USERSPACE: "false"
              # The image points `iptables` at the legacy backend, which the
              # Talos kernel lacks (as for Technitium's sidecar).
              TS_DEBUG_FIREWALL_MODE: nftables
              # Never rewrite resolv.conf: tailscaled answers exit-node
              # clients' DNS from its first nameserver, Technitium.
              TS_ACCEPT_DNS: "false"
              TS_EXTRA_ARGS: "--advertise-exit-node --accept-routes=false"
              # Fixed, for gluetun's FIREWALL_INPUT_PORTS. Change both together.
              TS_TAILSCALED_EXTRA_ARGS: "--port=41641"
              TS_ENABLE_HEALTH_CHECK: "true"
              TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
              # On the tailscale-socket emptyDir, where the picker reads
              # /localapi/v0/status for region_exit_overlay_connected. The
              # socket is 0666 and tailscaled grants the picker's uid 1000
              # read-only access (wonderbolts agent/overlays.ts).
              TS_SOCKET: /var/run/tailscale/tailscaled.sock
            probes:
              liveness: &tailscale-probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *tailscale-probe
            securityContext: *privileged
            resources: &overlay-resources
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          netbird: &netbird
            # The routing peer for `region-spitfire` (stacks/netbird, plan
            # §C2, §D2), in kernel mode on wt0. Its own packets carry mark
            # 0x1bd00 and leave over eth0 (routing.sh rule 91); its peers'
            # traffic is forwarded wt0 -> tun0 (post-rules.txt), and never to
            # eth0 (routing.sh's mangle kill switch).
            image:
              repository: netbirdio/netbird
              tag: 0.82.1@sha256:335e5df5bcf8a14be6a80b28d67da129a5b05c252641edb2e99380aa410e38c7
            # Each pod enrols as its own peer, `<NB_HOSTNAME>-<pod suffix>`
            # (spitfire-jjvlx): management refuses a hostname until its old
            # ephemeral peer is deleted (about 10 minutes offline, plan §F),
            # so a shared name kept a restarted region exit off NetBird that
            # long. Now the old peer just ages out. The base is NB_HOSTNAME,
            # never the pod name (spitfire's pods are
            # region-exits-<hash>-<suffix>). Still rerun in place, never
            # crashloop: a crashlooping container makes the pod NotReady and
            # empties the picker's Services (wonderbolts 503). Same loop as
            # Technitium's sidecar; no shell dollar signs (Flux post-build
            # substitution would rewrite them), hence the pipe into xargs.
            command:
              - /bin/bash
              - -c
              - |
                while true; do
                  { printenv NB_HOSTNAME; printenv POD_NAME | sed 's/.*-//'; } | paste -sd- | xargs -I{} env NB_HOSTNAME={} /usr/local/bin/netbird-entrypoint.sh || echo "netbird exited; restarting in 30s"
                  sleep 30
                done
            env: &netbird-env
              NB_MANAGEMENT_URL: https://netbird.${ROOT_DOMAIN}
              NB_SETUP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: region-exit-spitfire-netbird
                    key: NB_SETUP_KEY
              # The base name; the command appends the pod-name suffix.
              NB_HOSTNAME: spitfire
              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              # A routing peer, never a client: it must not pick up another
              # peer's exit route.
              NB_DISABLE_CLIENT_ROUTES: "true"
              # NB_DISABLE_DNS alone still binds <wt0 address>:53, so park
              # NetBird's resolver where nothing uses it. Never on 127.0.0.1:
              # off port 53, NetBird adds an OUTPUT DNAT
              # <listen IP>:53 -> <listen IP>:<port>, UDP and TCP, in its own
              # nftables table (client/internal/dns/service_listener.go
              # setupDNAT, v0.82.0). On 127.0.0.1 that took gluetun's old
              # resolver (then the pod's resolv.conf) over as soon as NetBird
              # enrolled, and NetBird's resolver, with no upstreams, answered
              # SERVFAIL. The pod now resolves through Technitium, so nothing
              # sends to 127.0.0.1:53 either; 127.0.0.153 is loopback too, and
              # nothing sends to 127.0.0.153:53, so the redirect matches nothing.
              # NB_* env applies only at enrolment; the state below is an
              # emptyDir and the key ephemeral, so every pod enrols fresh and
              # always takes it.
              NB_DISABLE_DNS: "true"
              NB_DNS_RESOLVER_ADDRESS: "127.0.0.153:5053"
              # Fixed for gluetun's FIREWALL_INPUT_PORTS, and clear of
              # tailscale's 41641. Change both together.
              NB_WIREGUARD_PORT: "51821"
              # The daemon's read-only Prometheus /metrics, for the picker's
              # region_exit_overlay_connected (plan §F, #3164):
              # netbird_management_connected and netbird_signal_connected.
              # `up` reads NB_<FLAG> for each of its flags
              # (client/cmd/root.go SetFlagsFromEnvVars, v0.82.1). Loopback
              # only, which gluetun's firewall accepts; nothing off the pod
              # can reach it, and NetBird warns if it is ever not loopback.
              NB_ENABLE_LOCAL_METRICS: "true"
              NB_LOCAL_METRICS_ADDRESS: "127.0.0.1:9191"
              NB_LOG_LEVEL: info
              NB_LOG_FILE: console
            securityContext: *privileged
            resources: *overlay-resources
          # The region exit agent (#3140): /status, /regions and POST /region
          # for the region picker app (../wonderbolts, ADR 0006), /metrics for
          # Prometheus. No pages, and no route through the Gateway. Its source
          # and image are the forge's home-operations/wonderbolts (agent/,
          # images.yml); Renovate bumps this pin (.github/renovate.json5,
          # "Estate images on the forge's registry").
          picker: &picker
            image:
              repository: git.${ROOT_DOMAIN}/estate-images/wonderbolts-agent
              tag: 0.1.2@sha256:4e90a8c2b5d7e506e6009941a909bfa414b695f09d7c9f0a8afce103f841f374
            # The image's own cmd, spelled out: Node strips the types itself.
            command: ["node", "/app/picker.ts"]
            env: &picker-env
              REGION_EXIT_NAME: spitfire
              PORT: "8080"
              # tailscale's TS_SOCKET. NetBird is read from wt0 in sysfs and,
              # from agents built for #3164, its local /metrics on
              # 127.0.0.1:9191 (NB_ENABLE_LOCAL_METRICS above), never its gRPC
              # socket, which has no read-only mode (wonderbolts agent/overlays.ts).
              TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              NODE_EXTRA_CA_CERTS: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            probes:
              liveness: &picker-probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &picker-port 8080
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *picker-probe
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              # Group 0, for /proc/net/nf_conntrack (0440 root:root), which
              # wonderbolts agent/activeClients.ts counts people from. No capability: NET_ADMIN
              # for netlink would also reach the kill switch (plan §G6).
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi

      # The other four: spitfire's shape, their own names. Each container is
      # spitfire's, merged (`<<:`) with what differs: gluetun's Secret and
      # ConfigMaps, and the name in tailscale's, netbird's and the picker's
      # env. Merge keys are shallow, so a changed env map repeats its anchor.
      soarin:
        replicas: 1
        strategy: *strategy
        annotations:
          configmap.reloader.stakater.com/reload: "region-exit-soarin-defaults,region-exit-routing"
          secret.reloader.stakater.com/reload: "region-exit-soarin-mullvad,region-exit-soarin-netbird,tailscale-region-exit-authkey"
          downscaler/exclude: "true"
        serviceAccount:
          identifier: soarin
        pod: *pod
        initContainers: *init-containers
        containers:
          gluetun:
            <<: *gluetun
            envFrom:
              - secretRef:
                  name: region-exit-soarin-mullvad
              - configMapRef:
                  name: region-exit-soarin-defaults
              - configMapRef:
                  name: region-exit-soarin-state
                  optional: true
          tailscale:
            <<: *tailscale
            env:
              <<: *tailscale-env
              TS_HOSTNAME: soarin
              TS_KUBE_SECRET: region-exit-soarin-tailscale
          netbird:
            <<: *netbird
            env:
              <<: *netbird-env
              NB_SETUP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: region-exit-soarin-netbird
                    key: NB_SETUP_KEY
              NB_HOSTNAME: soarin
          picker:
            <<: *picker
            env:
              <<: *picker-env
              REGION_EXIT_NAME: soarin
      fleetfoot:
        replicas: 1
        strategy: *strategy
        annotations:
          configmap.reloader.stakater.com/reload: "region-exit-fleetfoot-defaults,region-exit-routing"
          secret.reloader.stakater.com/reload: "region-exit-fleetfoot-mullvad,region-exit-fleetfoot-netbird,tailscale-region-exit-authkey"
          downscaler/exclude: "true"
        serviceAccount:
          identifier: fleetfoot
        pod: *pod
        initContainers: *init-containers
        containers:
          gluetun:
            <<: *gluetun
            envFrom:
              - secretRef:
                  name: region-exit-fleetfoot-mullvad
              - configMapRef:
                  name: region-exit-fleetfoot-defaults
              - configMapRef:
                  name: region-exit-fleetfoot-state
                  optional: true
          tailscale:
