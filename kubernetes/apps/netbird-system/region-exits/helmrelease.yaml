        annotations:
          configmap.reloader.stakater.com/reload: "region-exit-high-winds-defaults,region-exit-routing"
          secret.reloader.stakater.com/reload: "region-exit-high-winds-mullvad,region-exit-high-winds-netbird,tailscale-region-exit-authkey"
          downscaler/exclude: "true"
