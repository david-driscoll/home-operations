      misty-fly:
        replicas: 1
        strategy: *strategy
        annotations:
          configmap.reloader.stakater.com/reload: "region-exit-misty-fly-defaults,region-exit-routing"
          secret.reloader.stakater.com/reload: "region-exit-misty-fly-mullvad,region-exit-misty-fly-netbird,tailscale-region-exit-authkey"
          downscaler/exclude: "true"
        serviceAccount:
          identifier: misty-fly
        pod: *pod
        initContainers: *init-containers
        containers:
          gluetun:
            <<: *gluetun
            envFrom:
              - secretRef:
                  name: region-exit-misty-fly-mullvad
              - configMapRef:
