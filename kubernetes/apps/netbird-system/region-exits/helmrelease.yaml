              REGION_EXIT_NAME: high-winds

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault

    persistence:
      routing:
        type: configMap
        name: region-exit-routing
        advancedMounts:
          spitfire: &routing-mounts
            routing:
              - path: /scripts/routing.sh
                subPath: routing.sh
                readOnly: true
            gluetun:
              - path: /iptables/post-rules.txt
                subPath: post-rules.txt
                readOnly: true
          soarin: *routing-mounts
          fleetfoot: *routing-mounts
          misty-fly: *routing-mounts
          high-winds: *routing-mounts
      # NetBird's peer state. An emptyDir on purpose: the setup key is
      # ephemeral, so each pod enrols a new peer and management removes the
      # old one, and enrolment is the only time NB_* env applies.
      netbird-state:
        type: emptyDir
        advancedMounts:
          spitfire: &netbird-state-mounts
            netbird:
              - path: /var/lib/netbird
          soarin: *netbird-state-mounts
          fleetfoot: *netbird-state-mounts
          misty-fly: *netbird-state-mounts
          high-winds: *netbird-state-mounts
      # gluetun writes servers.json here; the picker reads the Mullvad
      # countries and cities from it.
      gluetun:
        type: emptyDir
        advancedMounts:
          spitfire: &gluetun-mounts
            gluetun:
              - path: /gluetun
            picker:
              - path: /gluetun
                readOnly: true
          soarin: *gluetun-mounts
          fleetfoot: *gluetun-mounts
          misty-fly: *gluetun-mounts
          high-winds: *gluetun-mounts
      # tailscaled's LocalAPI socket (TS_SOCKET). The picker connects as a
      # non-root peer, which tailscaled answers read-only; a read-only mount
      # still lets it connect.
      tailscale-socket:
        type: emptyDir
        advancedMounts:
          spitfire: &tailscale-socket-mounts
            tailscale:
              - path: /var/run/tailscale
            picker:
              - path: /var/run/tailscale
                readOnly: true
          soarin: *tailscale-socket-mounts
          fleetfoot: *tailscale-socket-mounts
          misty-fly: *tailscale-socket-mounts
          high-winds: *tailscale-socket-mounts

    # One per region exit, region-exits-<name>: how the region picker app
    # reaches each agent (NUXT_AGENT_URL_TEMPLATE in ../wonderbolts).
    service:
      spitfire:
        controller: spitfire
        ports:
          http:
            port: *picker-port
      soarin:
        controller: soarin
        ports:
          http:
            port: *picker-port
      fleetfoot:
        controller: fleetfoot
        ports:
          http:
            port: *picker-port
      misty-fly:
        controller: misty-fly
        ports:
          http:
            port: *picker-port
      high-winds:
        controller: high-winds
        ports:
          http:
            port: *picker-port

    # The picker's GET /metrics (wonderbolts agent/metrics.ts), which prometheusrule.yaml alerts
    # on. The series carry region_exit=<name> themselves. The CNP lets
    # Prometheus GET /metrics on 8080 and nothing else.
    serviceMonitor:
      spitfire:
        service:
          identifier: spitfire
        endpoints: &metrics-endpoints
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            # gluetun and tailscaled are each given 5s.
            scrapeTimeout: 15s
      soarin:
        service:
          identifier: soarin
        endpoints: *metrics-endpoints
      fleetfoot:
        service:
          identifier: fleetfoot
        endpoints: *metrics-endpoints
      misty-fly:
        service:
          identifier: misty-fly
        endpoints: *metrics-endpoints
      high-winds:
        service:
          identifier: high-winds
        endpoints: *metrics-endpoints

    # No route. wonderbolts.<root domain> belongs to the region picker app
    # (../wonderbolts/helmrelease.yaml, ADR 0006), which reaches each agent
    # through its Service above.
