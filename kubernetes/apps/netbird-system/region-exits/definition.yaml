---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
#
# The region picker (GLOSSARY.md): family, admins and friends may open it;
# only family and admins move a region exit, which the app itself enforces
# from forward auth's X-authentik-groups (ADR 0006). Friends could only be let
# in once the region exits' own pages, which had no group check, were gone.
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: wonderbolts
  annotations:
    # Step one of moving this file to ../wonderbolts (docs/plans/wonderbolts-nuxt.md,
    # phase 7). stacks/system reads ApplicationDefinitions live from the cluster
    # on every run, and every merge runs it: if this Kustomization pruned the
    # object before the wonderbolts one re-applied it, a run in between would
    # delete the Authentik application and lock the site. With this on the live
    # object first, the move's prune skips it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  name: Region exits
  category: Applications
  description: Choose where the region exits leave the internet from
  url: &url https://wonderbolts.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/mullvad.svg
  access_policy:
    groups:
      - family
      - admins
      - friends
  authentik:
    proxy:
      mode: "forward_single"
      externalHost: *url
  gatus:
    - group: "Applications"
      # The region picker app's overview at / (ADR 0006). Every path is behind
      # forward auth, and the app has no unauthenticated route through the
      # Gateway (its /healthz is for the kubelet only), so this checks the
      # door instead: the route is served and Authentik turns an anonymous
      # request away with its sign-in redirect. Following that redirect would
      # only test Authentik's own page. A 200 here means the app answered
      # without a login -- forward auth is off the route, and with it the
      # only thing that tells the app who may move a region exit.
      url: https://wonderbolts.${ROOT_DOMAIN}/
      method: GET
      client:
        ignore-redirect: true
      conditions:
        - "[STATUS] == 302"
