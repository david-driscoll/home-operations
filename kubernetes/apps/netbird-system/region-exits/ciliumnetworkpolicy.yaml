---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# Only Traefik and the region picker app may talk to the picker sidecar.
#
# The sidecar (picker.ts) trusts that every request on 8080 came through the
# wonderbolts route's forward auth (family and admins, ADR 0005) or from the
# region picker app, which checks who may move a region exit itself (ADR
# 0006): it has no login of its own. Without this policy any pod in the cluster, and anything
# the tailscale Connector routes onto the pod network, could POST a region
# switch straight to the Service. Same shape as
# ../../coder/setup-status/ciliumnetworkpolicy.yaml.
#
# The endpointSelector is the Flux Kustomization's commonMetadata label
# (ks.yaml), which only the region exits' objects carry: the other
# netbird-system pods (operator, routing peers, nbidp, the CronJobs) are
# labelled with their own names and are not selected. No other policy in
# netbird-system selects these pods (nbidp's selects only its Dex).
#
# Selecting the pods puts them into default-deny for ingress. Allowed:
#   - 8080/tcp from Traefik (traefik-network serves the internal Gateway the
#     route is on), L7: any GET, and POST only on /<name>/region, the sidecar
#     page's own move. Never the root POST /region: that is the region picker
#     app's (below), and the route's / reaches whichever sidecar
#     region-exits-pickers lands on, so a hand-made POST there would move a
#     region exit nobody picked and name its own mover. Cilium's path is a
#     full-match regex. Goes when the app owns the route
#     (docs/plans/wonderbolts-nuxt.md, phase 5).
#   - 8080/tcp from `host` for the kubelet's httpGet probes. The other
#     containers' probes are exec and need nothing.
#   - From the region picker app (wonderbolts, docs/plans/wonderbolts-nuxt.md,
#     ADR 0006), L7: GET /status, GET /regions and POST /region. The app
#     decides who may move a region exit; this is what keeps anything else
#     from asking the sidecar directly.
#   - The overlays' fixed WireGuard ports, 41641/udp (tailscaled) and
#     51821/udp (NetBird), from anywhere. Direct P2P is hole-punched: a peer's
#     first packet can arrive from an address the pod never sent to, which
#     conntrack would not treat as a reply, so without these the overlays fall
#     back to DERP and relays. These ports only carry WireGuard and disco/ICE,
#     which authenticate every packet, and gluetun's FIREWALL_INPUT_PORTS opens
#     the same two.
#   - 8080/tcp from Prometheus (observability, the operator's `prometheus`
#     instance), L7: `GET /metrics` only, for the ServiceMonitor (#3142).
#     Cilium's proxy answers any other method or path with 403, so the
#     scraper cannot reach the POST that switches region. Same L7 shape as
#     ../nbidp/ciliumnetworkpolicy.yaml.
#   - GET /status on 8080 from the region exits' own pods, for the overview
#     at / (#3143, overview.ts): whichever picker serves it reads every region
#     exit's /status, its own included. An L7 rule, never a plain port rule:
#     the same port takes the POST that switches region, and one picker must
#     not be able to move another. Cilium's path is a full-match regex.
# Everything else (gluetun's 8000 and 9999 are loopback or overlay-dropped
# anyway) is closed. Egress is untouched: the tunnel, the overlays' control
# planes and the Kubernetes API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: region-exits
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: region-exits
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-network
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
              - method: POST
                path: /[^/]+/region
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: netbird-system
            app.kubernetes.io/name: wonderbolts
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /status
              - method: GET
                path: /regions
              - method: POST
                path: /region
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
            operator.prometheus.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /metrics
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: netbird-system
            app.kubernetes.io/name: region-exits
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: /status
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "41641"
              protocol: UDP
            - port: "51821"
              protocol: UDP
