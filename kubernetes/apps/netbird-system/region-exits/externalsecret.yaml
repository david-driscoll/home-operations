# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The forge registry's estate-images read:package token as a dockerconfigjson,
# for the agent image (the picker container, helmrelease.yaml). The forge is
# REQUIRE_SIGNIN_VIEW, so an anonymous pull is refused. The same OpenBao key as
# the region picker app's pull secret (home-operations/wonderbolts deploy/) and
# ../../pulumi/workspace-image/externalsecret.yaml; this one belongs to the
# region exits so their pods never depend on another app's Kustomization.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: region-exits-image-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: region-exits-image-pull
    creationPolicy: Owner
    # A node pulling the image while this is being recreated still finds it.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "git.${ROOT_DOMAIN}": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: clusters/equestria/apps/pulumi/workspace-image-pull
