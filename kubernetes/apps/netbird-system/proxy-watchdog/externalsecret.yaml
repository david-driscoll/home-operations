---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The `automation` service user's PAT, the token netbird-health and the
# operator read (../health/externalsecret.yaml). Its own copy, so pruning one
# Kustomization never takes the other's token. Only ever GETs with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy-watchdog-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-proxy-watchdog-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: third-party-tokens/netbird/automation
        property: personal_access_token
