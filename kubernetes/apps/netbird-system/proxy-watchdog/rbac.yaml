---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-proxy-watchdog
---
# The one Deployment it may restart, and its own state ConfigMap. Nothing
# else: `patch` on nbidp-proxy is all a rollout restart needs, and `get` reads
# whether a rollout is already under way.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbird-proxy-watchdog
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [nbidp-proxy]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [netbird-proxy-watchdog-state]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbird-proxy-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netbird-proxy-watchdog
subjects:
  - kind: ServiceAccount
    name: netbird-proxy-watchdog
