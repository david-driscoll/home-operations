---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pulumi-history-pruner
  namespace: pulumi
spec:
  # Two trees under each backend root grow without bound:
  #
  # - history/: one full checkpoint copy per update. Left alone it also makes
  #   `pulumi stack history` (called by the operator after every up) slow or
  #   hang.
  # - backups/: the DIY backend's copy of the previous checkpoint, taken before
  #   it is overwritten -- another full copy per update, beside history/'s
  #   (system: ~10 MB every ~6 min). It was 6.8 GB of the bucket's 7.7 GB on
  #   2026-09-29. Every Stack CR and .config/mise.toml now set
  #   PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS, so nothing should write
  #   here any more; pruning it anyway drains what is left and catches a run
  #   that lacks the variable.
  #
  # Age is rclone's view of the object's mtime. Pulumi makes backups/ entries
  # with a server-side copy, which can carry the source's older mtime -- fine
  # for a tree whose contents are disposable anyway.
  #
  # Local time; this was "17 3 * * *" in UTC, the same moment in summer.
  schedule: "17 23 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: history-pruner
              # Same pin as the garage-sync / garage-mirror loops
              # (docker/_common/garage/compose.yaml).
              # renovate: datasource=docker depName=rclone/rclone
              image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              command: ["/bin/sh", "-c"]
              env:
                # An env-defined rclone remote named `garage`, the same shape the
                # dockge Garage stack's own rclone loops use. The endpoint is the
                # one every Stack CR's backend uses: celestia's bootstrap egress,
                # the only Garage S3 endpoint this cluster reaches.
                - name: RCLONE_CONFIG_GARAGE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_GARAGE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_GARAGE_ENDPOINT
                  value: http://dockge-celestia.${TAILSCALE_DOMAIN}:3900
                - name: RCLONE_CONFIG_GARAGE_REGION
                  value: garage
                - name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: pulumi-state-s3
                      key: username
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: pulumi-state-s3
                      key: password
              # Shell variables below are written $NAME, never with braces:
              # Flux substitutes the braced form cluster-wide (that is what
              # fills in the endpoint above) and leaves the bare form alone.
              args:
                - |
                  set -eu
                  # history/ is the per-update record, so it keeps longer.
                  # backups/ is no longer written (see the schedule comment); a
                  # day is plenty for anything that still lands there. Point-in-time
                  # copies of the state are the restic plan's job
                  # (stacks/backups/index.ts `pulumi-state`) and alpha-site's
                  # (docker/alpha-site/garage-backup).
                  KEEP_HISTORY=3d
                  KEEP_BACKUPS=1d
                  BUCKET=pulumi-state
                  # One prefix per Pulumi backend root. `backups` holds both the
                  # backups and system stacks.
                  PREFIXES="authentik backups gulf-of-mexico home ocracoke unifi-network vault"

                  prune() {
                    echo "  Pruning garage:$BUCKET/$1/.pulumi/$2/ older than $3"
                    rclone delete --min-age "$3" --s3-no-check-bucket "garage:$BUCKET/$1/.pulumi/$2/" \
                      || echo "  WARNING: prune of $1/$2 failed (will retry next run)"
                  }

                  echo "$(date -u): Pruning Pulumi history ($KEEP_HISTORY) and checkpoint backups ($KEEP_BACKUPS)"
                  for prefix in $PREFIXES; do
                    prune "$prefix" history "$KEEP_HISTORY"
                    prune "$prefix" backups "$KEEP_BACKUPS"
                  done
                  echo "$(date -u): Prune complete"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 256Mi
