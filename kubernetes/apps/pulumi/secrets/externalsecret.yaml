---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-ssh-credentials
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshInterval: 1m
  refreshPolicy: Periodic
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vault-ssh-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        identity: '{{ .private_key }}'
        known_hosts: '{{ .known_hosts }}'
  dataFrom:
    - extract:
        # was: GitHub david-driscoll/vault Deploy Key
        key: third-party-tokens/github/david-driscoll/vault/deploy-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      rewrite:
        - regexp:
            source: '[\W]'
            target: _
---
# `pulumi-operator-github` used to be assembled here from
# `shared/eris-github-access-token` — a static PAT. It is gone: every Stack CR
# in this directory now reads `github-token`, the GitHub App installation token
# the vault stack mints (stacks/vault/KubernetesGithubAppToken.ts) and
# emberstack reflects into every namespace, including this one.
#
# The PAT and the App were two credentials for the same access, and only one of
# them expires on its own. Keeping the PAT behind an ExternalSecret also pinned
# it to whatever value the last refresh saw, which is the wrong shape for a
# token that is supposed to rotate.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# Phase 6 — the convertible OnePasswordItem CRs that used to live in
# ./secret.yaml. Each keeps its Secret NAME and KEYS: the 1Password Operator
# wrote one Secret key per item field, and Phase 4 migrated those items
# field-for-field, so a bare `extract` reproduces the same Secret.
#
# `pulumi-operator-passphrase` is deliberately NOT here — see ./secret.yaml.
#
# Not circular, despite appearances: ESO talks to OpenBao directly with its own
# ServiceAccount token, so sourcing the 1Password Connect token from OpenBao
# introduces no cycle. (It does become pointless at Phase 11, when nothing reads
# Connect any more; deleting it then is simpler than converting it was.)
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulumi-operator-connect-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pulumi-operator-connect-token
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
  dataFrom:
    - extract:
        # was: vaults/Eris/items/Eris 1Password Connect Access Token
        key: third-party-tokens/onepassword/eris-connect
      # The item has a field literally named "valid from". A space is not a
      # legal Kubernetes Secret key, so without this the API server rejects the
      # entire Secret. The 1Password Operator sanitised the same way, which is
      # why the live Secret already reads `valid-from`.
      rewrite:
        - regexp:
            source: "[^-._a-zA-Z0-9]"
            target: "-"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# Named for its consumer, not its source: this is the Minio root credential on
# truenas, which the home-operations stacks use as the Pulumi state backend.
#
# ONE KEY IS DROPPED: `website`. The operator synthesised it from the item's URL
# field, which is not a field and so was never migrated. Nothing reads it —
# checked against every workload in the cluster before removing it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-home-operations
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: truenas-home-operations
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
  dataFrom:
    - extract:
        # was: vaults/Eris/items/minio root user
        key: apps/minio/root
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secret
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
  dataFrom:
    - extract:
        # was: vaults/Eris/items/Authentik Token
        key: clusters/alpha-site/apps/authentik/token
