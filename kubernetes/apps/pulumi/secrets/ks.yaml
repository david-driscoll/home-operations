---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pulumi-secrets
  namespace: &namespace pulumi
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn: []
  path: ./kubernetes/apps/pulumi/secrets
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: home-operations
    namespace: flux-system
  # Required for openbao-approle.sops.yaml. The components/common patch adds
  # decryption to the parent `pulumi` Kustomization but not to this child, so
  # without this block the SOPS ciphertext is applied verbatim and the operator
  # authenticates to OpenBao with the literal string "ENC[AES256_GCM,...]".
  # `sops-age` already exists in this namespace.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
