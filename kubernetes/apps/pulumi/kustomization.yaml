  - ./workspace-image/ks.yaml
  - ./kubeproxies/ks.yaml
  - ./unifi-network/ks.yaml
  - ./backups/ks.yaml
  - ./authentik/ks.yaml
  - ./home-operations/ks.yaml
  - ./gulf-of-mexico/ks.yaml
  - ./ocracoke/ks.yaml
  - ./netbird-edge/ks.yaml
