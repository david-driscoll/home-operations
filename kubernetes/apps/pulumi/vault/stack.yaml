---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/pulumi.com/stack_v1.json
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: ${APP}
spec:
  fluxSource:
    sourceRef:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: vault
    dir: stacks/vault
  serviceAccountName: ${APP}
  stack: vault
  resyncFrequencySeconds: 86400
  retryMaxBackoffDurationSeconds: 60
  backend: s3://home-operations/vault?endpoint=truenas.driscoll.tech:9000&s3ForcePathStyle=true&disableSSL=true
  continueResyncOnCommitMatch: true
  destroyOnFinalize: false
  workspaceReclaimPolicy: Delete
  prerequisites:
    - name: backups
  # refresh: true
  envRefs:
    # ⚠ TEMPORARY — REMOVE THIS ONCE THE STACK HAS GONE GREEN ONCE. ⚠
    #
    # SGC's nodes were wiped and rejoined to equestria in piece 18, so the
    # cluster behind `sgc-provider` does not exist. `clusters/sgc.yaml` went in
    # #1009 and `clusters/sgc/details` was hand-deleted from OpenBao (piece 22
    # phase 2 step 3), so the stack no longer BUILDS the sgc provider — but it
    # still holds four resources in state that it now wants to DELETE, and
    # deleting a `SecretPatch` needs the apiserver it was written to:
    #
    #   sgc-provider · sgc-tailscale-app-authkey · sgc-tailscale-dns-authkey
    #   sgc-github-github-app-token
    #
    #   error: configured Kubernetes cluster is unreachable. If the cluster was
    #   deleted, you can remove this resource from Pulumi state by rerunning the
    #   operation with the PULUMI_K8S_DELETE_UNREACHABLE environment variable
    #   set to "true"
    #
    # That is this. It drops those records from state without calling the dead
    # apiserver. Nothing live is touched — the cluster they describe is gone.
    #
    # WHY IT MUST NOT STAY: it applies to any unreachable cluster, not just this
    # one. Left on, a transient network blip while Pulumi happens to be deleting
    # a resource would silently drop it from state instead of failing — leaving
    # a live orphan nobody is tracking. One run, then delete this block.
    PULUMI_K8S_DELETE_UNREACHABLE:
      type: Literal
      literal:
        value: "true"
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: truenas-home-operations
        key: username
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: truenas-home-operations
        key: password
    AWS_USE_PATH_STYLE_ENDPOINT:
      type: Literal
      literal:
        value: "true"
    AWS_REGION:
      type: Literal
      literal:
        value: "home-operations"
    GITHUB_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-github
        key: credential
    CONNECT_HOST:
      type: Literal
      literal:
        value: "http://onepassword-connect.kube-system.svc.cluster.local:8080"
    CONNECT_VAULT:
      type: Literal
      literal:
        value: "Eris"
    CONNECT_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-connect-token
        key: credential
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: pulumi-operator-passphrase
        key: password
    # OpenBao (Phase 8a dual-write). Without these three,
    # GlobalResources.baoDualWriteEnabled is false and every dual-write is
    # silently skipped while the run still reports success.
    #
    # Set on EVERY stack, not just the ones that dual-write today: the getter
    # is lazy, so a stack that never touches OpenBao never builds the provider
    # and these are inert. Wiring them uniformly means the next stack to grow a
    # dual-write site just works, instead of failing the same silent way.
    #
    # openbao-active, not openbao: the general Service also routes to standbys,
    # which answer with a 307 redirect to the leader.
    BAO_ADDR:
      type: Literal
      literal:
        value: "http://openbao-active.kube-system.svc.cluster.local:8200"
    BAO_ROLE_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: role-id
    BAO_SECRET_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: secret-id
  secretsRef:
    github:token:
      type: Secret
      secret:
        name: pulumi-operator-github
        key: credential
    authentik:token:
      type: Secret
      secret:
        name: authentik-secret
        key: credential
    authentik:url:
      type: Secret
      secret:
        name: authentik-secret
        key: url
  workspaceTemplate:
    spec:
      # renovate: datasource=docker depName=ghcr.io/pulumi/pulumi-nodejs
      image: ghcr.io/pulumi/pulumi-nodejs:3.259.0
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: pulumi-operator-github
              key: credential
        # Cap V8's heap well under the 6Gi container limit so Node proactively GCs
        # instead of ballooning until the kernel OOM-kills the whole process tree.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # cpu: 1
          memory: 6Gi
      podTemplate:
        spec:
          volumes:
            - name: npm-cache
              hostPath:
                path: /var/lib/pulumi-npm-cache
                type: DirectoryOrCreate
          containers:
            - name: pulumi
              volumeMounts:
                - name: npm-cache
                  mountPath: /root/.npm
      # pulumiLogLevel: 11
