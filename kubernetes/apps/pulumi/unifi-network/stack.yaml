---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/pulumi.com/stack_v1.json
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: ${APP}
spec:
  fluxSource:
    sourceRef:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: home-operations
    dir: stacks/unifi-network
  serviceAccountName: ${APP}
  stack: unifi-network
  resyncFrequencySeconds: 300
  retryMaxBackoffDurationSeconds: 60
  backend: s3://home-operations/unifi-network?endpoint=truenas.driscoll.tech:9000&s3ForcePathStyle=true&disableSSL=true
  continueResyncOnCommitMatch: true
  destroyOnFinalize: false
  workspaceReclaimPolicy: Retain
  # refresh: true
  envRefs:
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: truenas-home-operations
        key: username
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: truenas-home-operations
        key: password
    AWS_USE_PATH_STYLE_ENDPOINT:
      type: Literal
      literal:
        value: "true"
    AWS_REGION:
      type: Literal
      literal:
        value: "home-operations"
    GITHUB_TOKEN:
      type: Secret
      secret:
        name: github-token
        key: token
    CONNECT_HOST:
      type: Literal
      literal:
        value: "http://onepassword-connect.kube-system.svc.cluster.local:8080"
    CONNECT_VAULT:
      type: Literal
      literal:
        value: "Eris"
    CONNECT_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-connect-token
        key: credential
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: pulumi-operator-passphrase
        key: password
    # OpenBao (Phase 8a dual-write). Without these three,
    # GlobalResources.baoDualWriteEnabled is false and every dual-write is
    # silently skipped while the run still reports success.
    #
    # Set on EVERY stack, not just the ones that dual-write today: the getter
    # is lazy, so a stack that never touches OpenBao never builds the provider
    # and these are inert. Wiring them uniformly means the next stack to grow a
    # dual-write site just works, instead of failing the same silent way.
    #
    # openbao-active, not openbao: the general Service also routes to standbys,
    # which answer with a 307 redirect to the leader.
    BAO_ADDR:
      type: Literal
      literal:
        value: "http://openbao-active.kube-system.svc.cluster.local:8200"
    BAO_ROLE_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: role-id
    BAO_SECRET_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: secret-id
  secretsRef:
    github:token:
      type: Secret
      secret:
        name: github-token
        key: token
    authentik:token:
      type: Secret
      secret:
        name: authentik-secret
        key: credential
    authentik:url:
      type: Secret
      secret:
        name: authentik-secret
        key: url
  workspaceTemplate:
    spec:
      # renovate: datasource=docker depName=ghcr.io/pulumi/pulumi-nodejs
      image: ghcr.io/pulumi/pulumi-nodejs:3.259.0
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        # Cap V8's heap well under the 6Gi container limit so Node proactively GCs
        # instead of ballooning until the kernel OOM-kills the whole process tree.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
        # Where the vals initContainer put the binary; the ref+openbao://
        # resolver spawns it (components/store/refs.ts). Locally VALS_BIN is
        # unset and vals comes from mise's PATH.
        - name: VALS_BIN
          value: /opt/vals/vals
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # cpu: 1
          memory: 6Gi
      podTemplate:
        spec:
          volumes:
            - name: npm-cache
              hostPath:
                path: /var/lib/pulumi-npm-cache
                type: DirectoryOrCreate
            - name: vals-bin
              emptyDir: {}
            - name: mise-data
              emptyDir: {}
            - name: mise-cache
              hostPath:
                path: /var/lib/pulumi-mise-cache
                type: DirectoryOrCreate
          # Installs the vals binary for the ref+openbao:// resolver
          # (components/store/refs.ts, PLAN §D.1). mise does the fetching so
          # the pin lives in the mise ecosystem — keep the version in step
          # with .config/mise.toml [tools]. Kubernetes `command:` replaces the
          # image's `mise` entrypoint, deliberately.
          #
          # The INSTALL dir is pod-local (emptyDir); only the DOWNLOAD cache
          # is shared — the expensive part, the extract is cheap. Any node's
          # old /var/lib/pulumi-mise-data is an abandoned predecessor — safe
          # to delete, never reuse.
          initContainers:
            - name: vals
              # renovate: datasource=docker depName=jdxcode/mise
              image: jdxcode/mise:2026.8.10
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  ok=""
                  for attempt in 1 2 3; do
                    if mise install vals@0.45.0; then ok=1; break; fi
                    echo "mise install failed (attempt $attempt); retrying" >&2
                    sleep 3
                  done
                  [ -n "$ok" ]
                  mise exec vals@0.45.0 -- /bin/sh -ec 'cp "$(command -v vals)" /opt/vals/vals'
              env:
                - name: MISE_DATA_DIR
                  value: /mise-data
                - name: MISE_CACHE_DIR
                  value: /mise-cache
                - name: MISE_YES
                  value: "1"
              # The workspace pod template pins runAsUser 1000/runAsNonRoot,
              # under which a root-owned hostPath is unwritable — every EACCES
              # in the first rollout was this, not an install race (the pods
              # that "worked" predated the vals init entirely). This one init
              # runs as root to use the shared cache; the binary it drops is
              # 0755 root-owned, which uid 1000 executes fine.
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                runAsNonRoot: false
              volumeMounts:
                - name: vals-bin
                  mountPath: /opt/vals
                - name: mise-data
                  mountPath: /mise-data
                - name: mise-cache
                  mountPath: /mise-cache
          containers:
            - name: pulumi
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 6Gi
              volumeMounts:
                - name: npm-cache
                  mountPath: /root/.npm
                - name: vals-bin
                  mountPath: /opt/vals
      # pulumiLogLevel: 11
