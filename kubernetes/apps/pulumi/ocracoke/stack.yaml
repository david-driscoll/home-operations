---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/pulumi.com/stack_v1.json
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: &stack ocracoke
spec:
  fluxSource:
    # The ExternalArtifact from ../../../components/pulumi-stack-artifact (plus
    # the paths this kustomization.yaml appends), not the home-operations
    # GitRepository: its revision moves only when a file this program reads
    # changes, so an unrelated commit to main no longer re-runs the Stack. The
    # operator reads any kind's status.artifact here, and gets get/list/watch on
    # externalartifacts from the HelmRelease's rbac.extraRules
    # (../pulumi-operator/helmrelease.yaml).
    sourceRef:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: ExternalArtifact
      name: ${APP}
    dir: stacks/ocracoke
  serviceAccountName: ${APP}
  stack: *stack
  resyncFrequencySeconds: 86400
  retryMaxBackoffDurationSeconds: 60
  # Pulumi state on the dockge Garage cluster (celestia/luna/skystar), one
  # prefix per Stack exactly as on the old TrueNAS Minio. Through the
  # garage-s3 Tailscale VIP (HTTPS, whichever node is up) rather than pinned
  # to celestia; the path is guarded by the `garage-s3-vip-egress` grant
  # (stacks/unifi-network/acl-manager.ts). system and unifi-network stay on
  # dockge-celestia:3900 because they own that path. Region `garage` is part
  # of every SigV4 signature. docs/garage-offsite-s3.md.
  backend: s3://pulumi-state/ocracoke?endpoint=garage-s3.${TAILSCALE_DOMAIN}&s3ForcePathStyle=true&region=garage
  continueResyncOnCommitMatch: true
  destroyOnFinalize: false
  workspaceReclaimPolicy: Delete
  prerequisites:
    - name: backups
  envRefs:
    # The estate's root domain, for the Pulumi code that used to spell it
    # out (docs/plans/private-domain-scrub.md, phase 4). Flux substitutes it
    # from shared-secrets (SOPS); components/domains.ts reads it and fails
    # closed when it is missing.
    ROOT_DOMAIN:
      type: Literal
      literal:
        value: "${ROOT_DOMAIN}"
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: pulumi-state-s3
        key: username
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: pulumi-state-s3
        key: password
    AWS_USE_PATH_STYLE_ENDPOINT:
      type: Literal
      literal:
        value: "true"
    AWS_REGION:
      type: Literal
      literal:
        value: "garage"
    # No copy of the previous checkpoint in .pulumi/backups/ per update: history/
    # already keeps one (see ../history-pruner/cronjob.yaml).
    PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS:
      type: Literal
      literal:
        value: "true"
    # gzip every state write: each checkpoint save is the WHOLE state (13 MiB
    # for home), repeated per resource step and per run. Same in
    # .config/mise.toml, so CLI and operator runs agree on the format.
    PULUMI_DIY_BACKEND_GZIP:
      type: Literal
      literal:
        value: "true"
    GITHUB_TOKEN:
      type: Secret
      secret:
        name: github-token
        key: token
    CONNECT_HOST:
      type: Literal
      literal:
        value: "http://onepassword-connect.kube-system.svc.cluster.local:8080"
    CONNECT_VAULT:
      type: Literal
      literal:
        value: "Eris"
    CONNECT_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-connect-token
        key: credential
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: pulumi-operator-passphrase
        key: password
    # OpenBao (Phase 8a dual-write). Without these three,
    # GlobalResources.baoDualWriteEnabled is false and every dual-write is
    # silently skipped while the run still reports success.
    #
    # Set on EVERY stack, not just the ones that dual-write today: the getter
    # is lazy, so a stack that never touches OpenBao never builds the provider
    # and these are inert. Wiring them uniformly means the next stack to grow a
    # dual-write site just works, instead of failing the same silent way.
    #
    # openbao-active, not openbao: the general Service also routes to standbys,
    # which answer with a 307 redirect to the leader.
    BAO_ADDR:
      type: Literal
      literal:
        value: "http://openbao-active.kube-system.svc.cluster.local:8200"
    BAO_ROLE_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: role-id
    BAO_SECRET_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: secret-id
  secretsRef:
    github:token:
      type: Secret
      secret:
        name: github-token
        key: token
    authentik:token:
      type: Secret
      secret:
        name: authentik-secret
        key: credential
    authentik:url:
      type: Secret
      secret:
        name: authentik-secret
        key: url
  workspaceTemplate:
    spec:
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        # Cap V8's heap well under the 6Gi container limit so Node proactively GCs
        # instead of ballooning until the kernel OOM-kills the whole process tree.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # cpu: 1
          memory: 6Gi
      podTemplate:
        spec:
          # The image, its pull secret and the workspace placement come from
          # kubernetes/components/pulumi-workspace. vals, the plugins and a warm
          # npm cache are baked into that image, so there is no init container
          # and no hostPath here any more (docs/kubernetes/pulumi-workspace-image.md).
          containers:
            - name: pulumi
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 6Gi
