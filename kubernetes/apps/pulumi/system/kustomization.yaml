---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./stack.yaml
components:
  # Workspace pod placement: off the SATA-/var nodes, spread across the rest.
  - ../../../components/pulumi-workspace
  # This Stack's own source: an ArtifactGenerator holding what every Stack
  # reads, and the ExternalArtifact that stack.yaml's fluxSource points at.
  - ../../../components/pulumi-stack-artifact
patches:
  # What only this Stack reads, appended to the component's copy list. Traced
  # from stacks/system/index.ts; docs/kubernetes/pulumi-stack-artifacts.md has
  # the method. A new runtime read of a repo path goes here, or edits to that
  # path will never trigger a run.
  - target:
      group: source.extensions.fluxcd.io
      kind: ArtifactGenerator
    patch: |-
      - op: add
        path: /spec/artifacts/0/copy/-
        value: {from: "@repo/stacks/system/", to: "@artifact/stacks/", exclude: ["*.md", "*.test.ts"]}
      # The whole of kubernetes/apps/, for two readers:
      #  - coder-templates.ts and components/coderTemplates.ts read
      #    kubernetes/apps/coder/coder/ (templates/, helmrelease.yaml,
      #    resources/pulumi-token-job.yaml);
      #  - postgres-rotation.ts runs globSync("kubernetes/apps/**/ks.yaml") and
      #    derives the set of apps with a database from what it finds.
      # Deliberately NOT a `kubernetes/apps/**/ks.yaml` copy. source-watcher
      # v2.2.4 matches non-Extract copies with Go's fs.Glob, where `**` is just
      # `*` (one path segment), so that pattern matched nothing and failed the
      # build (2026-10-20). Per-depth globs (`apps/*/*/ks.yaml`,
      # `apps/*/*/*/ks.yaml`) would work today, but an app whose ks.yaml sat at
      # a depth they missed would vanish from postgres-rotation's view, and its
      # OpenBao role with it. The cost is a run on any kubernetes/apps/ commit,
      # on a Stack that resyncs every 10 minutes anyway.
      - op: add
        path: /spec/artifacts/0/copy/-
        value: {from: "@repo/kubernetes/apps/", to: "@artifact/kubernetes/"}
