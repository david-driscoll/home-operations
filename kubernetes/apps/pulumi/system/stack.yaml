---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/pulumi.com/stack_v1.json
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: ${APP}
spec:
  fluxSource:
    # The ExternalArtifact from ../../../components/pulumi-stack-artifact (plus
    # the paths this kustomization.yaml appends), not the home-operations
    # GitRepository: its revision moves only when a file this program reads
    # changes, so an unrelated commit to main no longer re-runs the Stack. The
    # operator reads any kind's status.artifact here, and gets get/list/watch on
    # externalartifacts from the HelmRelease's rbac.extraRules
    # (../pulumi-operator/helmrelease.yaml).
    sourceRef:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: ExternalArtifact
      name: ${APP}
    dir: stacks/system
  serviceAccountName: ${APP}
  stack: system
  # Resyncs since stacks/applications moved in (stacks/system/applications.ts): a
  # new ApplicationDefinition gets its authentik app and OIDC Secret from the
  # next run, and the run a commit triggers usually races Flux applying the
  # ApplicationDefinition itself -- so it is the resync that picks it up.
  #
  # 600s, not the 300s it was. At 300s with workspaceReclaimPolicy: Delete,
  # every resync was a COLD workspace pod (fetch, npm install, plugins, vals)
  # on some node's /var, 288 times a day: the background churn under the
  # 2026-10-19 fluttershy/kerfuffle outage. Retain (below) removes the cold
  # start from same-commit resyncs. 600s halves the warm `pulumi up` too, at the
  # cost of a new app waiting up to 10 minutes for its OIDC Secret.
  resyncFrequencySeconds: 600
  retryMaxBackoffDurationSeconds: 60
  # Pulumi state on the dockge Garage cluster (celestia/luna/skystar), one
  # prefix per Stack exactly as on the old TrueNAS Minio. DELIBERATELY still
  # pinned to celestia's bootstrap egress, unlike the other Stacks, which use
  # the garage-s3 VIP: this stack owns `svc:garage-s3` (stacks/system/
  # garage.ts), and a run that broke the VIP must still reach its own state.
  # Region `garage` is part of every SigV4 signature. docs/garage-offsite-s3.md.
  backend: s3://pulumi-state/backups?endpoint=dockge-celestia.${TAILSCALE_DOMAIN}:3900&s3ForcePathStyle=true&disableSSL=true&region=garage
  continueResyncOnCommitMatch: true
  destroyOnFinalize: false
  # Retain, not Delete: this Stack resyncs on a timer (resyncFrequencySeconds
  # above), and under Delete every one of those runs was a cold workspace pod --
  # fetch, npm install, plugins, vals -- on some node's /var. Retain keeps the pod
  # between runs, so a same-commit resync reuses its installed node_modules and
  # plugins. A new commit still replaces the pod (the operator stamps the source
  # hash on the pod template), so commits are cold either way. An idle workspace
  # costs ~100-200Mi and ~1m CPU. pulumi-kubernetes-operator v2.9.3
  # stack_controller.go only deletes after a SUCCESSFUL update anyway.
  workspaceReclaimPolicy: Retain
  prerequisites: []
  # Deliberately none. This stack publishes clusters/<key>/details, which every
  # other stack reads — Flux cannot express "before
  # everything", so the ordering that matters is enforced where it can be: a
  # consumer reading a details path that does not exist fails loudly rather
  # than silently seeing no clusters. See BaoStore.getAllClusters.
  # refresh: true
  envRefs:
    # The estate's root domain, for the Pulumi code that used to spell it
    # out (docs/plans/private-domain-scrub.md, phase 4). Flux substitutes it
    # from shared-secrets (SOPS); components/domains.ts reads it and fails
    # closed when it is missing.
    ROOT_DOMAIN:
      type: Literal
      literal:
        value: "${ROOT_DOMAIN}"
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: pulumi-state-s3
        key: username
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: pulumi-state-s3
        key: password
    AWS_USE_PATH_STYLE_ENDPOINT:
      type: Literal
      literal:
        value: "true"
    AWS_REGION:
      type: Literal
      literal:
        value: "garage"
    # No copy of the previous checkpoint in .pulumi/backups/ per update: history/
    # already keeps one (see ../history-pruner/cronjob.yaml).
    PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS:
      type: Literal
      literal:
        value: "true"
    # gzip every state write: each checkpoint save is the WHOLE state (13 MiB
    # for home), repeated per resource step and per run. Same in
    # .config/mise.toml, so CLI and operator runs agree on the format.
    PULUMI_DIY_BACKEND_GZIP:
      type: Literal
      literal:
        value: "true"
    GITHUB_TOKEN:
      type: Secret
      secret:
        name: github-token
        key: token
    # Only for stacks/system/applications.ts: it still WRITES the per-app OIDC
    # credential items and the "Equestria Backup Plan" item to 1Password
    # (dynamic/1password/OnePasswordItem.ts). Nothing here reads 1Password, but
    # that provider builds an OPClient even to diff, so without these every
    # preview of those resources fails.
    CONNECT_HOST:
      type: Literal
      literal:
        value: "http://onepassword-connect.kube-system.svc.cluster.local:8080"
    CONNECT_VAULT:
      type: Literal
      literal:
        value: "Eris"
    CONNECT_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-connect-token
        key: credential
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: pulumi-operator-passphrase
        key: password
    # OpenBao (Phase 8a dual-write). Without these three,
    # GlobalResources.baoDualWriteEnabled is false and every dual-write is
    # silently skipped while the run still reports success.
    #
    # Set on EVERY stack, not just the ones that dual-write today: the getter
    # is lazy, so a stack that never touches OpenBao never builds the provider
    # and these are inert. Wiring them uniformly means the next stack to grow a
    # dual-write site just works, instead of failing the same silent way.
    #
    # openbao-active, not openbao: the general Service also routes to standbys,
    # which answer with a 307 redirect to the leader.
    BAO_ADDR:
      type: Literal
      literal:
        value: "http://openbao-active.kube-system.svc.cluster.local:8200"
    BAO_ROLE_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: role-id
    BAO_SECRET_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: secret-id
  secretsRef:
    github:token:
      type: Secret
      secret:
        name: github-token
        key: token
    authentik:token:
      type: Secret
      secret:
        name: authentik-secret
        key: credential
    authentik:url:
      type: Secret
      secret:
        name: authentik-secret
        key: url
  workspaceTemplate:
    spec:
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-token
              key: token
        # Cap V8's heap well under the 6Gi container limit so Node proactively GCs
        # instead of ballooning until the kernel OOM-kills the whole process tree.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # cpu: 1
          memory: 6Gi
      podTemplate:
        spec:
          # The image, its pull secret and the workspace placement come from
          # kubernetes/components/pulumi-workspace. vals, the plugins and a warm
          # npm cache are baked into that image, so there is no init container
          # and no hostPath here any more (docs/kubernetes/pulumi-workspace-image.md).
          containers:
            - name: pulumi
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 6Gi
      # pulumiLogLevel: 11
