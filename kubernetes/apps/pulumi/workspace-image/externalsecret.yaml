---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# `estate-images`' read:package token as a dockerconfigjson, for the workspace
# pods' imagePullSecrets (kubernetes/components/pulumi-workspace). Minted by
# stacks/system/forgejo-github-mirror.ts; the forge is REQUIRE_SIGNIN_VIEW, so
# an anonymous pull is refused.
#
# Keyed by the forge's host, which is what containerd matches against the
# image reference -- the same host whether the bytes then come from the forge
# or from a spegel peer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulumi-workspace-image-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  # Short, as for the other Forgejo tokens: a scope change mints a new token
  # and deletes the old one after (deleteBeforeReplace: false), so this is the
  # gap during which a new node could not pull.
  refreshInterval: 4m
  target:
    name: pulumi-workspace-image-pull
    creationPolicy: Owner
    # A node pulling the image while this is being recreated still finds it.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "git.${ROOT_DOMAIN}": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: clusters/equestria/apps/pulumi/workspace-image-pull
