---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: pulumi-operator
spec:
  interval: 1h
  url: oci://ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
  ref:
    tag: 2.9.0
    digest: sha256:f1f17fde843c00f37faa8026c085a28c398b3e6c9b19bd44f5e5b8bfd7410481
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulumi-operator
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: pulumi-operator
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    # Tier 1 per docs/cluster-consolidation/24-power-states.md §1 (`pulumi` stays up
    # during Battery). Top-level `tolerations` is the key
    # pulumi-kubernetes-operator reads, verified against its values.
    # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
    # NOTE: this covers the OPERATOR only. The `*-workspace-0` pods are created from
    # each Stack's `spec.workspaceTemplate.spec.podTemplate`, which lives in the
    # Pulumi program rather than here, and is tracked separately -- see §4.
    # See docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 256Mi
        cpu: 100m
    controller:
      metricsSecure: false
    serviceMonitor:
      enabled: true
    nameOverride: "pulumi-operator"
    fullnameOverride: "pulumi-operator"
