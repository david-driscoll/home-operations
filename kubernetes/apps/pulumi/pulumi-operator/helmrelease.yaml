---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: pulumi-operator
spec:
  interval: 1h
  url: oci://ghcr.io/pulumi/helm-charts/pulumi-kubernetes-operator
  ref:
    tag: 2.9.3
    digest: sha256:ad98a69295656d50e23d9ee334915f15b142bfe5528200b090485de3ba9ac19e
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pulumi-operator
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: pulumi-operator
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    # Tier 1 per docs/cluster-consolidation/24-power-states.md §1 (`pulumi` stays up
    # during Battery). Top-level `tolerations` is the key
    # pulumi-kubernetes-operator reads, verified against its values.
    # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
    # NOTE: this covers the OPERATOR only, deliberately. The `*-workspace-0` pods
    # come from each Stack's `spec.workspaceTemplate` in
    # kubernetes/apps/pulumi/<stack>/stack.yaml -- reachable from this tree, but
    # left untolerated on purpose: nine long-lived workspace pods (~1.1 GiB of
    # requests, `workspaceReclaimPolicy: Retain`, resyncing every 300s) are load a
    # Battery window exists to shed, and 24 §1 notes a `pulumi up` cannot usefully
    # run mid-outage anyway: its state backend is the dockge Garage cluster,
    # reached through celestia (bucket `pulumi-state`).
    # Keeping the operator placeable and letting the workspaces stay down is the
    # intended shape. See docs/cluster-consolidation/20-low-power-tier.md §4.
    # See docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      limits:
        memory: 1Gi
      requests:
        memory: 256Mi
        cpu: 100m
    # Caps how many workspaces run `pulumi install` and how many run `pulumi up`
    # at once, cluster-wide. The default is 25, so a commit to main runs every
    # Stack at once: they all share the home-operations GitRepository, and the
    # operator compares the artifact REVISION (the commit SHA), so no `ignore`
    # rule on the source can narrow that down. 2026-10-19 was 7 cold workspaces
    # at once, 6 of them on one SATA /var.
    #
    # Why it bites, from v2.9.3 source: cmd/main.go makes this the manager-wide
    # default, so it applies to the Stack, Workspace and Update controllers alike,
    # and the last two BLOCK for the whole operation -- Workspace on the Install
    # RPC (npm, plugins), Update on the Up stream. 3 means at most 3 installs and
    # 3 ups in flight. The rest queue: a commit's 7 runs finish in about three
    # waves instead of one. Workspace pods are still created together, but their
    # init containers (agent copy, artifact fetch, vals) are small. The heavy
    # /var I/O is in Install, and that is what this queues.
    #
    # Not lower: a wedged `pulumi up` holds its worker until it returns, so 1 or
    # 2 would let one stuck provider stall the vault token refresh and the
    # unifi-network DNS poll behind it.
    extraEnv:
      - name: MAX_CONCURRENT_RECONCILES
        value: "3"
    controller:
      metricsSecure: false
    serviceMonitor:
      enabled: true
    nameOverride: "pulumi-operator"
    fullnameOverride: "pulumi-operator"
