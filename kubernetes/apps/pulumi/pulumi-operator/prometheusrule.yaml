---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pulumi-stacks
spec:
  groups:
    - name: pulumi.stacks
      rules:
        - alert: PulumiStackFailed
          # Fires when a stack has accumulated failures (covers both "failed" and
          # "retryingAfterFailure" states). lastUpdate.failures is a reliable counter
          # that increments on every failed run regardless of which condition type is set.
          # The threshold must stay at or below 3: the operator gives up after the third
          # failed `up` ("up failed 3 times; not retrying until the spec or source
          # changes"), so the counter never climbs past 3 and the old `> 5` could not fire.
          # On 2026-11-09 a GitHub outage stalled authentik and unifi-network for ~18h
          # without a page.
          expr: kube_stack_last_update_failures >= 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pulumi Stack {{ $labels.name }} is failing"
            description: "Stack {{ $labels.namespace }}/{{ $labels.name }} has {{ $value }} consecutive failures. Check the stack logs for details."

        - alert: PulumiStackStalled
          # Fires when the operator has stopped retrying a failed update: the Stalled
          # condition with reason UpdateFailed. It stays stalled until the spec or
          # source changes or someone sets pulumi.com/reconciliation-request, even when
          # the cause was temporary (a GitHub provider download timing out). This
          # replaces `kube_stack_last_update_failures > 100`, which could never fire
          # because the counter stops at 3.
          expr: kube_stack_status_condition{type="Stalled", reason="UpdateFailed"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Pulumi Stack {{ $labels.name }} is stalled"
            description: "Stack {{ $labels.namespace }}/{{ $labels.name }} gave up after repeated failed updates and will not retry on its own. Read status.lastUpdate.message for the cause, fix it, then re-run with `kubectl annotate stack -n {{ $labels.namespace }} {{ $labels.name }} pulumi.com/reconciliation-request=$(date +%s) --overwrite`."

        - alert: PulumiStackPrerequisiteNotSatisfied
          # Reconciling condition has type="Reconciling" status="True" reason="PrerequisiteNotSatisfied"
          # booleanValueTrue="True" → metric value is 1 when status="True"
          expr: kube_stack_status_condition{type="Reconciling", reason="PrerequisiteNotSatisfied"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Pulumi Stack {{ $labels.name }} prerequisites not satisfied for 30m"
            description: "Stack {{ $labels.namespace }}/{{ $labels.name }} prerequisites have not been satisfied for 30 minutes."

        - alert: PulumiStackLocked
          # Fires when a Pulumi state lock blocks the stack. Two sources, because since
          # operator v2.9.3 the lock text often never reaches the Stack status:
          #   - status.lastUpdate.message quotes the lock ("locked by ...")
          #   - the lock-canceller CronJob found it in the workspace pod log behind the
          #     generic "up failed; see the workspace pod logs" message and recorded it
          #     as the pulumi-lock-canceller/locked-since annotation (exported by KSM).
          # The second leg is what the 2026-10-17 vault lock needed: its message never
          # said "locked by", so this alert stayed silent for 33h.
          # Stale locks occur when the workspace pod restarts mid-run without releasing the lock.
          # The auto-canceller CronJob (../lock-canceller) resolves locks held > 10m via
          # `pulumi cancel`, then sets pulumi.com/reconciliation-request so the stack re-runs
          # and this message is replaced -- without that re-run a Stalled stack keeps the old
          # "locked by" text forever and this alert never clears. The annotation is removed
          # by the same job once the stack's last run is no longer lock-blocked.
          expr: |
            max by (namespace, name) (kube_stack_last_update_info{message=~"(?s).*locked by.*"} == 1)
            or
            max by (namespace, name) (kube_stack_lock_created_timestamp_seconds > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pulumi Stack {{ $labels.name }} is lock-blocked"
            description: "Stack {{ $labels.namespace }}/{{ $labels.name }} is failing because the Pulumi state is locked (the lock text may only be in `kubectl -n {{ $labels.namespace }} logs {{ $labels.name }}-workspace-0 -c pulumi | grep 'locked by'`). The auto-canceller will resolve this after 10 minutes, or run `kubectl exec -n {{ $labels.namespace }} {{ $labels.name }}-workspace-0 -- pulumi cancel --yes` followed by `kubectl annotate stack -n {{ $labels.namespace }} {{ $labels.name }} pulumi.com/reconciliation-request=$(date +%s) --overwrite` to resolve immediately."

    - name: pulumi.stack-tokens
      rules:
        - alert: PulumiStackTokenExpiring
          # A credential a stack holds expires within 30 days (EXPIRY_WARNING_DAYS
          # in components/netbird/tokens.ts). The value comes from the stack's
          # tokenExpiresAtSeconds output via kube-state-metrics
          # (../../observability/prometheus/values.yaml). It is an absolute date,
          # so the countdown keeps going while the stack is not running. 0 means
          # the stack could not read the date, and fires at once. stacks/netbird
          # exports its automation and owner PATs. A warning still pages: the
          # root route's receiver is pushover.
          expr: (kube_stack_output_token_expires_timestamp_seconds{token!=""} - time()) < 30 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Pulumi Stack {{ $labels.name }}: the {{ $labels.token }} token expires within 30 days"
            description: "Stack {{ $labels.namespace }}/{{ $labels.name }} holds a {{ $labels.token }} token that expires in {{ $value | humanizeDuration }}. For NetBird, bump the token's generation in stacks/netbird/index.ts and merge; docs/plans/netbird-mirror.md (PATs and their rotation) has the steps."

        - alert: NetbirdTokenExpiryUnknown
          # Guards the alert above. stacks/netbird has succeeded, but its two
          # expiry series are not both there, so PulumiStackTokenExpiring could
          # never fire for it (a renamed output, a KSM config that did not load).
          expr: |
            max by (namespace, name) (kube_stack_last_update_state{name="netbird"} == 1)
            unless on (namespace, name)
            (count by (namespace, name) (kube_stack_output_token_expires_timestamp_seconds{name="netbird", token=~"automation|owner"}) == 2)
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "NetBird PAT expiry is not being watched"
            description: "Stack {{ $labels.namespace }}/{{ $labels.name }} succeeded, but kube_stack_output_token_expires_timestamp_seconds lacks its automation or owner series, so nothing will warn before those PATs expire. Check the Stack's status.outputs.tokenExpiresAtSeconds and the kube-state-metrics customResourceState config."
