---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./serviceaccount.yaml
  - ./stack.yaml
  - ./definition.yaml
components:
  # Workspace pod placement: off the SATA-/var nodes, spread across the rest.
  - ../../../components/pulumi-workspace
  # This Stack's own source: an ArtifactGenerator holding what every Stack
  # reads, and the ExternalArtifact that stack.yaml's fluxSource points at.
  - ../../../components/pulumi-stack-artifact
patches:
  # What only this Stack reads, appended to the component's copy list. Traced
  # from stacks/netbird-edge/index.ts (components/oci/ comes with the shared
  # components/ copy); docs/kubernetes/pulumi-stack-artifacts.md has the method.
  - target:
      group: source.extensions.fluxcd.io
      kind: ArtifactGenerator
    patch: |-
      - op: add
        path: /spec/artifacts/0/copy/-
        value: {from: "@repo/stacks/netbird-edge/", to: "@artifact/stacks/", exclude: ["*.md", "*.test.ts"]}
