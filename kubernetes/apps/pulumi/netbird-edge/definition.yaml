---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
# NetBird's login (#3000, docs/plans/netbird-mirror.md §F). stacks/system turns
# this into an Authentik OAuth2 provider + application and writes the client
# credentials to OpenBao at secrets/clusters/equestria/apps/netbird/oidc, which
# stacks/netbird (#2885) reads to add Authentik as a connector on NetBird's
# embedded Dex. The groups below are who may log in at all; NetBird's own JWT
# allow-list repeats them.
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: netbird
spec:
  name: NetBird
  category: Infrastructure
  description: Client VPN into the estate (self-hosted on OCI)
  url: &url https://netbird.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/netbird.svg
  access_policy:
    groups:
      - admins
      - family
      - friends
      - media-managers
  authentik:
    oauth2:
      clientType: confidential
      allowedRedirectUris:
        # Dex's callback is always <issuer>/callback, and NetBird's embedded
        # Dex issues at /oauth2.
        - url: "https://netbird.${ROOT_DOMAIN}/oauth2/callback"
      propertyMappings:
        - email
        - openid
        # profile carries the `groups` claim NetBird's JWT group sync reads.
        - profile
      includeClaimsInIdToken: true
      # Stable across email changes; Dex keys the user on `sub`.
      subMode: hashed_user_id
  gatus:
    - url: *url
      method: GET
      interval: 2m
      conditions:
        - "[STATUS] == 200"
