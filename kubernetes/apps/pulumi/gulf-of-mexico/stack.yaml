---
# yaml-language-server: $schema=https://schemas.budimanjojo.com/pulumi.com/stack_v1.json
apiVersion: pulumi.com/v1
kind: Stack
metadata:
  name: &stack gulf-of-mexico
spec:
  fluxSource:
    sourceRef:
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: home-operations
    dir: stacks/gulf-of-mexico
  serviceAccountName: ${APP}
  stack: *stack
  resyncFrequencySeconds: 3600
  retryMaxBackoffDurationSeconds: 60
  backend: s3://home-operations/gulf-of-mexico?endpoint=truenas.driscoll.tech:9000&s3ForcePathStyle=true&disableSSL=true
  continueResyncOnCommitMatch: true
  destroyOnFinalize: false
  workspaceReclaimPolicy: Delete
  prerequisites:
    - name: backups
  envRefs:
    AWS_ACCESS_KEY_ID:
      type: Secret
      secret:
        name: truenas-home-operations
        key: username
    AWS_SECRET_ACCESS_KEY:
      type: Secret
      secret:
        name: truenas-home-operations
        key: password
    AWS_USE_PATH_STYLE_ENDPOINT:
      type: Literal
      literal:
        value: "true"
    AWS_REGION:
      type: Literal
      literal:
        value: "home-operations"
    GITHUB_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-github
        key: credential
    CONNECT_HOST:
      type: Literal
      literal:
        value: "http://onepassword-connect.kube-system.svc.cluster.local:8080"
    CONNECT_VAULT:
      type: Literal
      literal:
        value: "Eris"
    CONNECT_TOKEN:
      type: Secret
      secret:
        name: pulumi-operator-connect-token
        key: credential
    PULUMI_CONFIG_PASSPHRASE:
      type: Secret
      secret:
        name: pulumi-operator-passphrase
        key: password
    # OpenBao (Phase 8a dual-write). Without these three,
    # GlobalResources.baoDualWriteEnabled is false and every dual-write is
    # silently skipped while the run still reports success.
    #
    # Set on EVERY stack, not just the ones that dual-write today: the getter
    # is lazy, so a stack that never touches OpenBao never builds the provider
    # and these are inert. Wiring them uniformly means the next stack to grow a
    # dual-write site just works, instead of failing the same silent way.
    #
    # openbao-active, not openbao: the general Service also routes to standbys,
    # which answer with a 307 redirect to the leader.
    BAO_ADDR:
      type: Literal
      literal:
        value: "http://openbao-active.kube-system.svc.cluster.local:8200"
    BAO_ROLE_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: role-id
    BAO_SECRET_ID:
      type: Secret
      secret:
        name: pulumi-operator-bao-approle
        key: secret-id
    # Phase 8 cutover: secret reads come from OpenBao (BaoStore) instead of
    # 1Password. Explicit, never inferred from credential presence — see
    # baoStoreReadsEnabled in components/store/bao.ts. The gate for setting
    # this was scripts/bao-store-parity.ts fully green, inventory included.
    BAO_STORE_READS:
      type: Literal
      literal:
        value: "1"
  secretsRef:
    github:token:
      type: Secret
      secret:
        name: pulumi-operator-github
        key: credential
    authentik:token:
      type: Secret
      secret:
        name: authentik-secret
        key: credential
    authentik:url:
      type: Secret
      secret:
        name: authentik-secret
        key: url
  workspaceTemplate:
    spec:
      # renovate: datasource=docker depName=ghcr.io/pulumi/pulumi-nodejs
      image: ghcr.io/pulumi/pulumi-nodejs:3.254.0
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: pulumi-operator-github
              key: credential
        # Cap V8's heap well under the 6Gi container limit so Node proactively GCs
        # instead of ballooning until the kernel OOM-kills the whole process tree.
        - name: NODE_OPTIONS
          value: "--max-old-space-size=4096"
        # Where the vals initContainer put the binary; the ref+openbao://
        # resolver spawns it (components/store/refs.ts). Locally VALS_BIN is
        # unset and vals comes from mise's PATH.
        - name: VALS_BIN
          value: /opt/vals/vals
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          # cpu: 1
          memory: 6Gi
      podTemplate:
        spec:
          volumes:
            - name: npm-cache
              hostPath:
                path: /var/lib/pulumi-npm-cache
                type: DirectoryOrCreate
            - name: vals-bin
              emptyDir: {}
            - name: mise-data
              hostPath:
                path: /var/lib/pulumi-mise-data
                type: DirectoryOrCreate
          # Installs the vals binary for the ref+openbao:// resolver
          # (components/store/refs.ts, PLAN §D.1). mise does the fetching so
          # the pin lives in the mise ecosystem — keep the version in step
          # with .config/mise.toml [tools] — and MISE_DATA_DIR is a hostPath
          # cache mirroring npm-cache, so after the first run on a node this
          # is a copy, not a download. Kubernetes `command:` replaces the
          # image's `mise` entrypoint, deliberately.
          initContainers:
            - name: vals
              # renovate: datasource=docker depName=jdxcode/mise
              image: jdxcode/mise:2026.8.3
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  mise install vals@0.45.0
                  mise exec vals@0.45.0 -- /bin/sh -ec 'cp "$(command -v vals)" /opt/vals/vals'
              env:
                - name: MISE_DATA_DIR
                  value: /mise-data
                - name: MISE_YES
                  value: "1"
              volumeMounts:
                - name: vals-bin
                  mountPath: /opt/vals
                - name: mise-data
                  mountPath: /mise-data
          containers:
            - name: pulumi
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 6Gi
              volumeMounts:
                - name: npm-cache
                  mountPath: /root/.npm
                - name: vals-bin
                  mountPath: /opt/vals
