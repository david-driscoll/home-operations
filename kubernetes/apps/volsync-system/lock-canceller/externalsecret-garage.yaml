---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lock-canceller-garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lock-canceller-garage-secret
    template:
      data:
        # restic, in the main container: the VolSync password (see
        # externalsecret.yaml) and the same repository root the component
        # builds for a moved app.
        RESTIC_PASSWORD: "{{ .credential }}"
        GARAGE_REPOSITORY_BASE: "s3:{{ .garage_endpoint }}/{{ .garage_bucket }}"
        AWS_ACCESS_KEY_ID: "{{ .garage_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_password }}"
        AWS_DEFAULT_REGION: "{{ .garage_region }}"
        # rclone, in the find container: the same key, as the defaults for
        # an on-the-fly `:s3:` remote. Path-style requests are rclone's default.
        GARAGE_BUCKET: "{{ .garage_bucket }}"
        RCLONE_S3_PROVIDER: Other
        RCLONE_S3_ENDPOINT: "{{ .garage_endpoint }}"
        RCLONE_S3_REGION: "{{ .garage_region }}"
        RCLONE_S3_ACCESS_KEY_ID: "{{ .garage_username }}"
        RCLONE_S3_SECRET_ACCESS_KEY: "{{ .garage_password }}"
  dataFrom:
    - extract:
        key: apps/volsync/password
    # The movers' key, bucket and endpoint (stacks/system, garage.ts). It needs
    # list and delete in the bucket, which the movers' rw key has.
    - extract:
        key: clusters/equestria/apps/volsync/garage
      rewrite:
        - regexp:
            source: "(.*)"
            target: "garage_$1"
