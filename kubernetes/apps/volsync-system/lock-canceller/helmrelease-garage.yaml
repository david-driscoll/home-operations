---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lock-canceller-garage
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      # The Garage half of helmrelease.yaml's lock canceller, for repositories
      # that moved with VOLSYNC_BACKEND: garage (docs/plans/host-owned-backups.md
      # phase 3). A release of its own, not a second controller there: that
      # release's NFS share is a global mount, and a TrueNAS outage must not
      # stop this one starting. No `volsync-` prefix, for the reason given in
      # helmrelease.yaml.
      *app :
        type: cronjob
        pod:
          # No API access is needed: both containers talk to Garage.
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            runAsNonRoot: true
        cronjob:
          # Hourly against the same 6h threshold, ten minutes after the NFS
          # canceller so the two never run at once.
          schedule: "35 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
        initContainers:
          # Finds the repositories holding a stale lock (find-stale-garage-locks.sh).
          find:
            image:
              # Same pin as the Docker hosts' rclone containers, so Renovate
              # moves one rclone version.
              repository: docker.io/rclone/rclone
              tag: 1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: lock-canceller-garage-secret
            env:
              # rclone looks for a config file under HOME; there is none to find.
              HOME: /work
            command:
              - /bin/sh
              - /script/find-stale-garage-locks.sh
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          # Unlocks them with restic (unlock-stale-garage-locks.sh).
          main:
            image:
              # The NFS canceller's pin, and etcd's.
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: lock-canceller-garage-secret
            command:
              - /bin/sh
              - /script/unlock-stale-garage-locks.sh
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    persistence:
      script:
        type: configMap
        name: lock-canceller-garage-script
        globalMounts:
          - path: /script
            readOnly: true
      # The find container's list of repositories, handed to restic.
      work:
        type: emptyDir
        globalMounts:
          - path: /work
