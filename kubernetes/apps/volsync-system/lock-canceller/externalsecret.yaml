---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lock-canceller
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: lock-canceller-restic-secret
    template:
      data:
        RESTIC_PASSWORD: "{{ .credential }}"
  dataFrom:
    # The SAME path components/volsync/externalsecret.yaml reads. Every
    # `${APP}-volsync-secret` in the estate is minted from this one credential,
    # which is what lets a single CronJob open all 60-odd repositories under
    # /repository instead of enumerating per-namespace secrets.
    #
    # /repository/etcd is covered too, despite reaching restic through a
    # differently-NAMED secret. kubernetes/apps/kube-system/etcd's ExternalSecret
    # is `talos-etcd-restic-keys`, but it reads this same `apps/volsync/password`
    # / `credential` pair -- structurally the same value, not coincidentally
    # equal, and confirmed identical by hash on 2026-08-28. The name is the only
    # thing that differs, so do not read it as a second credential.
    - extract:
        key: apps/volsync/password
