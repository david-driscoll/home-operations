---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lock-canceller
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      # NOT named `volsync-lock-canceller`. The `volsync-mover-nfs` and
      # `volsync-mover-jitter` MutatingAdmissionPolicies in ../volsync match
      # every batch/v1 Job in the cluster and then filter on a `volsync-` name
      # prefix; they also require `app.kubernetes.io/created-by: volsync`, which
      # this Job does not carry, so a prefixed name would not actually match --
      # but keeping the prefix off removes the question entirely, and matches the
      # sibling `restore-cleanup` CronJob.
      *app :
        type: cronjob
        pod:
          # No API access is needed -- this talks to the restic repository on
          # NFS, not to Kubernetes.
          automountServiceAccountToken: false
          securityContext:
            # Mandatory, not hygiene. Each repository's `config` and lock files
            # are mode 0400 owned by 568:568, so any other uid cannot even open
            # the repository, let alone remove a lock. (The `locks/` directory
            # itself is 0777, so deletion would succeed -- it is the read of
            # `config` that fails first.)
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            runAsNonRoot: true
        cronjob:
          # Hourly, against a 6h threshold -- so a stranded lock is cleared
          # within 7h of the mover dying rather than sitting until someone
          # notices. Offset off the hour to stay clear of the 14:00 backup
          # window's own start.
          schedule: "25 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 1
          activeDeadlineSeconds: 600
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          main:
            image:
              # Same pin as kubernetes/apps/kube-system/etcd/helmrelease.yaml,
              # deliberately -- one restic version in the repo for Renovate to
              # move. Newer than the mover's own 0.18.1, which is fine: `unlock`
              # only removes lock files and never rewrites the repository.
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: lock-canceller-restic-secret
            command:
              - /bin/sh
              # The script is a ConfigMap, not an inline `args` block, and that
              # is load-bearing: Flux postBuild envsubst runs over every manifest
              # in this Kustomization, so an inline `${STALE_MINUTES}` is read as a
              # substitution variable and fails the whole build in strict mode.
              # ../../pulumi/lock-canceller solves the same problem by stamping
              # `kustomize.toolkit.fluxcd.io/substitute: disabled` on its CronJob;
              # that annotation is per-resource and all-or-nothing, so it cannot go
              # here -- the persistence block below genuinely needs ${SPIKE_IP} and
              # ${CLUSTER_CNAME} substituted. Splitting the script into its own
              # annotated ConfigMap keeps both halves working, and keeps future
              # edits to the shell out of the substitution path for good.
              - /script/unlock-stale-locks.sh
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    persistence:
      script:
        type: configMap
        name: lock-canceller-script
        globalMounts:
          - path: /script
            readOnly: true
      repository:
        # The mover's own repository root, mounted the same way the
        # `volsync-mover-nfs` MutatingAdmissionPolicy mounts it into every mover
        # Job -- same server, same per-cluster path, same /repository mountpoint.
        # Note this is NOT the `volsync` PV in ../volsync/volume.yaml, which
        # points one level up at /mnt/stash/backup/volsync and holds no
        # repositories.
        type: nfs
        server: "${SPIKE_IP}"
        path: "/mnt/stash/backup/${CLUSTER_CNAME}/volsync"
        globalMounts:
          - path: /repository
