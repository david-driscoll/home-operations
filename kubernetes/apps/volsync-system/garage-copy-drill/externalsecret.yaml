---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-copy-drill
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-copy-drill-secret
    template:
      data:
        # Opens the copy, which holds the same repositories under the same
        # password (../lock-canceller/externalsecret.yaml).
        RESTIC_PASSWORD: "{{ .credential }}"
        # Only for printing Garage's newest snapshot beside the copy's.
        GARAGE_REPOSITORY_BASE: "s3:{{ .garage_endpoint }}/{{ .garage_bucket }}"
        AWS_ACCESS_KEY_ID: "{{ .garage_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_password }}"
        AWS_DEFAULT_REGION: "{{ .garage_region }}"
  dataFrom:
    - extract:
        key: apps/volsync/password
    - extract:
        key: clusters/equestria/apps/volsync/garage
      rewrite:
        - regexp:
            source: "(.*)"
            target: "garage_$1"
