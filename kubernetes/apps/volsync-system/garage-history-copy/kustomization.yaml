---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./job.yaml
configMapGenerator:
  # Same two options as ../lock-canceller/kustomization.yaml, for the same
  # reasons. job.yaml mounts the ConfigMap by its literal name. Flux's
  # strict envsubst would also read the script's shell ${...} as
  # substitution variables, while job.yaml needs ${SPIKE_IP} and
  # ${CLUSTER_CNAME} substituted, so the opt-out goes on the ConfigMap alone.
  - name: garage-history-copy-script
    files:
      - ./garage-history-copy.sh
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
