---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-history-copy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-history-copy-secret
    template:
      data:
        # One credential for both ends. Every VolSync repository, on NFS or in
        # Garage, is opened with it (lock-canceller/externalsecret.yaml).
        RESTIC_PASSWORD: "{{ .credential }}"
        RESTIC_FROM_PASSWORD: "{{ .credential }}"
        # The same repository root the component builds for a moved app
        # (kubernetes/components/volsync/externalsecret.yaml): the script
        # appends /<app>.
        GARAGE_REPOSITORY_BASE: "s3:{{ .garage_endpoint }}/{{ .garage_bucket }}"
        AWS_ACCESS_KEY_ID: "{{ .garage_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_password }}"
        AWS_DEFAULT_REGION: "{{ .garage_region }}"
  dataFrom:
    - extract:
        key: apps/volsync/password
    - extract:
        key: clusters/equestria/apps/volsync/garage
      rewrite:
        - regexp:
            source: "(.*)"
            target: "garage_$1"
