---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/mutatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: volsync-mover-jitter
spec:
  policyName: volsync-mover-jitter
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/mutatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: volsync-mover-jitter
  namespace: volsync-system
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  # EVERY EXPRESSION BELOW IS GUARDED, AND THAT IS NOT DEFENSIVE STYLE.
  #
  # `matchConstraints` selects EVERY batch/v1 Job in the cluster, and
  # `failurePolicy: Fail` means a matchCondition that ERRORS denies the request
  # rather than skipping the policy. Kubernetes admission objects are
  # unstructured maps, so reading an absent field is an error, not `null`:
  #
  #   object.metadata.name           absent on a `generateName` Job
  #   object.metadata.labels         absent on a Job with no labels
  #   object.spec.template.spec.volumes  absent on a pod spec with no volumes
  #
  # Unguarded, those three denied every ordinary Job in the cluster. Proven with
  # `kubectl create --dry-run=server` on a bare Job:
  #
  #   policy 'volsync-mover-nfs' denied request: [expression
  #   'object.metadata.name.startsWith("volsync-")' resulted in error:
  #   no such key: name, ...]
  #
  # It went unnoticed because nothing here used `generateName` until the
  # renovate-operator did (kubernetes/apps/coder/renovate), whose discovery and
  # executor Jobs are created that way. The conditions are also ALL evaluated --
  # the error above names all three -- so guarding only the first is not enough.
  #
  # An `objectSelector` on the binding would ALSO keep the policy off unrelated
  # Jobs, and looks like the tidier fix. It was deliberately not used: no mover
  # Job existed at the time to confirm volsync really stamps
  # `app.kubernetes.io/created-by: volsync` on them, and if it does not, the
  # selector would silently exclude every real mover -- the NFS mutation below
  # would stop applying and backups would lose /repository with nothing failing.
  # These guards change WHICH Jobs match not at all, so they carry no such risk.
  matchConditions:
    - name: has-volsync-job-name-prefix
      expression: >
        has(object.metadata.name) && object.metadata.name.startsWith("volsync-src-")
    - name: has-volsync-created-by-labels
      expression: >
        has(object.metadata.labels)
        && "app.kubernetes.io/created-by" in object.metadata.labels
        && object.metadata.labels["app.kubernetes.io/created-by"] == "volsync"
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add", path: "/spec/template/spec/initContainers",
              value: []
            },
            JSONPatch{
              op: "add", path: "/spec/template/spec/initContainers/-",
              value: Object.spec.template.spec.initContainers{
                name: "jitter",
                image: "docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616",
                imagePullPolicy: "IfNotPresent",
                command: ["sh", "-c", "sleep $(shuf -i 0-60 -n 1)"]
              }
            }
          ]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/mutatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: volsync-mover-nfs
spec:
  policyName: volsync-mover-nfs
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/mutatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: volsync-mover-nfs
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  # EVERY EXPRESSION BELOW IS GUARDED, AND THAT IS NOT DEFENSIVE STYLE.
  #
  # `matchConstraints` selects EVERY batch/v1 Job in the cluster, and
  # `failurePolicy: Fail` means a matchCondition that ERRORS denies the request
  # rather than skipping the policy. Kubernetes admission objects are
  # unstructured maps, so reading an absent field is an error, not `null`:
  #
  #   object.metadata.name           absent on a `generateName` Job
  #   object.metadata.labels         absent on a Job with no labels
  #   object.spec.template.spec.volumes  absent on a pod spec with no volumes
  #
  # Unguarded, those three denied every ordinary Job in the cluster. Proven with
  # `kubectl create --dry-run=server` on a bare Job:
  #
  #   policy 'volsync-mover-nfs' denied request: [expression
  #   'object.metadata.name.startsWith("volsync-")' resulted in error:
  #   no such key: name, ...]
  #
  # It went unnoticed because nothing here used `generateName` until the
  # renovate-operator did (kubernetes/apps/coder/renovate), whose discovery and
  # executor Jobs are created that way. The conditions are also ALL evaluated --
  # the error above names all three -- so guarding only the first is not enough.
  #
  # An `objectSelector` on the binding would ALSO keep the policy off unrelated
  # Jobs, and looks like the tidier fix. It was deliberately not used: no mover
  # Job existed at the time to confirm volsync really stamps
  # `app.kubernetes.io/created-by: volsync` on them, and if it does not, the
  # selector would silently exclude every real mover -- the NFS mutation below
  # would stop applying and backups would lose /repository with nothing failing.
  # These guards change WHICH Jobs match not at all, so they carry no such risk.
  matchConditions:
    - name: has-volsync-job-name-prefix
      expression: >
        has(object.metadata.name) && object.metadata.name.startsWith("volsync-")
    - name: has-volsync-created-by-labels
      expression: >
        has(object.metadata.labels)
        && "app.kubernetes.io/created-by" in object.metadata.labels
        && object.metadata.labels["app.kubernetes.io/created-by"] == "volsync"
    - name: repository-volume-does-not-exist
      expression: >
        !has(object.spec.template.spec.volumes)
        || !object.spec.template.spec.volumes.exists(item, item.name == "repository")
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add", path: "/spec/template/spec/containers/0/volumeMounts/-",
              value: Object.spec.template.spec.containers.volumeMounts{
                name: "repository",
                mountPath: "/repository"
              }
            },
            JSONPatch{
              op: "add", path: "/spec/template/spec/volumes/-",
              value: Object.spec.template.spec.volumes{
                name: "repository",
                nfs: Object.spec.template.spec.volumes.nfs{
                  server: "10.10.10.10",
                  path: "/mnt/stash/backup/${CLUSTER_CNAME}/volsync"
                }
              }
            }
          ]
