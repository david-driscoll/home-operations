---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
#
# ONE declaration, reconciled by the `observability-repositories` Kustomization
# next to it and consumed by alertmanager, grafana and prometheus.
# It used to be copy-pasted into the alertmanager, grafana and prometheus
# HelmReleases -- three documents with the same name in the same namespace, so
# three Kustomizations writing ONE object. They happened to be byte-identical,
# which is the only reason it never flapped; any drift between them would have
# made the object flip-flop on whichever reconciled last, and a version bump
# had to land in all three or do exactly that.
#
# It also produced Renovate's "Excess registryUrls found for datasource lookup"
# warning: the flux manager resolves a sourceRef by filtering every source in
# the repo on name + namespace, so three matches put the same URL in
# registryUrls three times. That warning is why .github/renovate.json5 used to
# suppress `dependencyLookupWarnings` wholesale, which in turn hid every
# genuine lookup failure behind it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 89.1.0
    digest: sha256:5233f829dbd03f3c47c618effe1ac2ceb44235b2a3b80a4abe9524b115c6c0bd
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
