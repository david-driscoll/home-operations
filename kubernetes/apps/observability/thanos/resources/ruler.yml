groups:
  - name: "PrometheusWatcher"
    rules:
      - alert: "PrometheusDown"
        annotations:
          summary: "Prometheus has disappeared from Thanos target discovery ({{ $labels.cluster }})"
          description: "Prometheus instance in cluster {{ $labels.cluster }} has been down for more than 5 minutes"
        expr: sum by (cluster) (up{job=~".*prometheus.*"}) == 0
        for: 5m
        labels:
          severity: critical
          component: observability
  - name: oom
    rules:
      - alert: OomKilled
        annotations:
          summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
        expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
        labels:
          severity: critical
  - name: node-filesystem
    rules:
      - alert: NodeRootFsFillingUp
        annotations:
          summary: Node {{ $labels.instance }} root filesystem is filling up (<15% free)
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|fuse.lxcfs|aufs"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|fuse.lxcfs|aufs"}) < 0.15
        for: 10m
        labels:
          severity: warning
      - alert: NodeRootFsCritical
        annotations:
          summary: Node {{ $labels.instance }} root filesystem is critically low (<5% free)
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|fuse.lxcfs|aufs"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|fuse.lxcfs|aufs"}) < 0.05
        for: 5m
        labels:
          severity: critical
  - name: imagefs-usage
    rules:
      - alert: NodeImageFSHighUsage
        annotations:
          summary: Node {{ $labels.instance }} image filesystem > 85% used
        expr: |
          (sum by (instance) (container_runtime_image_fs_used_bytes)
            / sum by (instance) (container_runtime_image_fs_capacity_bytes)) > 0.85
        for: 15m
        labels:
          severity: warning
      - alert: NodeImageFSCritical
        annotations:
          summary: Node {{ $labels.instance }} image filesystem > 95% used
        expr: |
          (sum by (instance) (container_runtime_image_fs_used_bytes)
            / sum by (instance) (container_runtime_image_fs_capacity_bytes)) > 0.95
        for: 5m
        labels:
          severity: critical
  - name: loki-pvc-usage
    rules:
      - alert: LokiPVCFillingUp
        annotations:
          summary: Loki PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} > 85% used
        expr: |
          (sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="observability", persistentvolumeclaim=~".*loki.*"})
            / sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="observability", persistentvolumeclaim=~".*loki.*"})) > 0.85
        for: 15m
        labels:
          severity: warning
      - alert: LokiPVCCritical
        annotations:
          summary: Loki PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} > 95% used
        expr: |
          (sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="observability", persistentvolumeclaim=~".*loki.*"})
            / sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="observability", persistentvolumeclaim=~".*loki.*"})) > 0.95
        for: 5m
        labels:
          severity: critical
  - name: loki-compactor
    rules:
      - alert: LokiCompactorFailures
        annotations:
          summary: Loki compactor is reporting failed compactions on {{ $labels.instance }}
        expr: increase(loki_compactor_compactions_failed_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
  # The netbird-edge hosts' metrics (components/netbird/metrics.ts) arrive by
  # remote-write only, so the in-cluster Prometheus never sees them and the
  # rule lives here. Every Azure host runs a relay whatever its lease, so the
  # relay's `up` is the one series that should always be there; management's
  # is down on a standby by design and is not alerted on. Warnings, so the
  # `Netbird.*` route sends them to pushover-quiet.
  - name: netbird-metrics
    rules:
      - alert: NetbirdMetricsMissing
        annotations:
          summary: No NetBird metrics from the netbird-edge hosts in 15 minutes.
          description: >-
            Nothing has remote-written up{cluster="netbird-edge", job="netbird-relay"}. Check the
            netbird-alloy container on each host (`docker logs netbird-alloy`) and the
            `netbird-edge-metrics` tailnet grant to svc:thanos-receive.
        expr: absent_over_time(up{cluster="netbird-edge", job="netbird-relay"}[15m])
        for: 5m
        labels:
          severity: warning
          component: netbird
      - alert: NetbirdRelayScrapeDown
        annotations:
          summary: "{{ $labels.host }}: Alloy cannot scrape the NetBird relay."
          description: >-
            up{job="netbird-relay"} has been 0 on {{ $labels.host }} ({{ $labels.cluster }}) for 15 minutes:
            the netbird-relay container is down or its metrics port moved. Gatus checks the relay's
            TLS separately (netbird-relays).
        expr: up{job="netbird-relay"} == 0
        for: 15m
        labels:
          severity: warning
          component: netbird

  # CrowdSec on the netbird-edge hosts (components/netbird/crowdsec.ts): an
  # agent and AppSec per host, reporting to Equestria's LAPI over the tailnet.
  # Their metrics arrive by remote-write as job="crowdsec" with `host` and
  # `lapi_name` (components/netbird/metrics.ts); the LAPI's per-machine counter
  # comes from the in-cluster Prometheus. Every one of these fails OPEN at the
  # edge -- nothing user-visible breaks -- so these are the only signal.
  # Warnings, like the rest of the `Netbird.*` route.
  - name: netbird-crowdsec
    rules:
      - alert: NetbirdCrowdsecDown
        annotations:
          summary: "{{ $labels.host }}: the edge CrowdSec container is down."
          description: >-
            Alloy has not scraped netbird-crowdsec on {{ $labels.host }} for 15 minutes. While it is
            down AppSec is unreachable, so the edge Traefik lets dashboard and /api requests through
            uninspected (fail-open), and the host's Traefik log goes unparsed. Check
            `docker compose -f /opt/netbird/compose.yaml ps crowdsec` and `docker logs netbird-crowdsec`
            on the host; a hub download failing at first start is the usual cause.
        expr: up{cluster="netbird-edge", job="crowdsec"} == 0
        for: 15m
        labels:
          severity: warning
          component: netbird
      - alert: NetbirdCrowdsecNotReporting
        annotations:
          summary: "{{ $labels.host }}: the edge CrowdSec agent is not talking to the LAPI."
          description: >-
            netbird-crowdsec on {{ $labels.host }} is running, but machine {{ $labels.lapi_name }} has
            made no request to Equestria's LAPI in 30 minutes, so its alerts never become bans. In
            order: the LAPI log for CROWDSEC_EDGE_REGISTER (the machine registered?), the
            crowdsec-netbird-edge Secret in `network`, the `netbird-edge-crowdsec` tailnet grant, and
            `docker logs netbird-crowdsec` on the host for the login error.
        # `exported_machine`, NOT `machine`. The crowdsec chart's ServiceMonitor
        # relabels __meta_kubernetes_pod_node_name into a target label called
        # `machine`, so Prometheus renames CrowdSec's own `machine` label (the
        # LAPI machine id) to `exported_machine`. Keyed on `machine`, every series
        # read as the LAPI pod's node and this fired for both edge hosts while
        # both were heartbeating (2026-11-10..11).
        expr: |
          up{cluster="netbird-edge", job="crowdsec"} == 1
            unless on (lapi_name)
          label_replace(sum by (exported_machine) (increase(cs_lapi_machine_requests_total[30m])) > 0, "lapi_name", "$1", "exported_machine", "(.+)")
        for: 30m
        labels:
          severity: warning
          component: netbird
      # Traefik's bouncer polls even with the middleware's kill switch off: the
      # plugin starts its stream ticker in New() whatever `enabled` says
      # (bouncer.go, v1.7.1), and only ServeHTTP checks it. So this holds in
      # rollout step 1 too. Keyed on the crowdsec container's `up` for the
      # host list; the bouncer itself lives in Traefik. A bouncer polling from a
      # new address gets a row named <name>@<ip> (api_key.go authPlain), hence
      # the regex. GET only: AppSec validates the same key with HEAD.
      #
      # Gated on the host's netbird-server being up, i.e. on the lease holder.
      # The plugin's New() only runs when a router uses the middleware, and the
      # only routers that do (netbird-api, netbird-dashboard) are labels on the
      # netbird-server and netbird-dashboard containers, which the fence keeps
      # stopped on a standby. So a standby's bouncer never polls, and has nothing
      # to protect: ungated, this fired for netbird-azure-cus permanently.
      - alert: NetbirdCrowdsecBouncerNotPolling
        annotations:
          summary: "{{ $labels.host }}: the edge Traefik bouncer is not fetching decisions."
          description: >-
            Bouncer {{ $labels.lapi_name }} has not fetched the decision stream from Equestria's LAPI
            in 30 minutes. It keeps enforcing its last copy (fail-open), so new bans are not reaching
            {{ $labels.host }}. Check `cscli bouncers list` in the LAPI pod (registered from
            BOUNCER_KEY_{{ $labels.lapi_name }} in the crowdsec-netbird-edge Secret), the
            `netbird-edge-crowdsec` tailnet grant, and `docker logs netbird-traefik` on the host for
            handleStreamTicker errors.
        expr: |
          up{cluster="netbird-edge", job="crowdsec"} == 1
            and on (host) up{cluster="netbird-edge", job="netbird-server"} == 1
            unless on (lapi_name)
          label_replace(sum by (bouncer) (increase(cs_lapi_bouncer_requests_total{route="/v1/decisions/stream", method="GET"}[30m])) > 0, "lapi_name", "$1", "bouncer", "([^@]+)(@.+)?")
        for: 30m
        labels:
          severity: warning
          component: netbird
      - alert: NetbirdCrowdsecAcquisitionStalled
        annotations:
          summary: "{{ $labels.host }}: the edge CrowdSec agent is reading no Traefik log."
          description: >-
            netbird-crowdsec on {{ $labels.host }} has read no line from netbird-traefik in an hour.
            Every public IP draws scanners within minutes, so this is the docker datasource failing:
            check the netbird-crowdsec-socket proxy (`docker logs netbird-crowdsec-socket`), and the
            agent's log for "failed to get docker info".
        expr: |
          up{cluster="netbird-edge", job="crowdsec"} == 1
            unless on (host)
          sum by (host) (rate(cs_dockersource_hits_total{cluster="netbird-edge"}[1h])) > 0
        for: 1h
        labels:
          severity: warning
          component: netbird
