---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thanos
  namespace: observability
spec:
  targetNamespace: observability
  path: ./kubernetes/apps/observability/thanos
  prune: true
  # See home-operations:docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: onepassword-connect
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
    - name: prometheus
      namespace: observability
  components:
    - ../../../components/failover/fast-node-eviction
    # Replaces a hand-written ./ingress.yaml that NOTHING reconciled: it carried
    # `ingressClassName: internal` (Traefik) together with tailscale.com/*
    # annotations, so the Tailscale operator ignored it for having the wrong
    # class and Traefik ignored the annotations. No `svc:thanos` was ever
    # created and https://thanos.${TAILSCALE_DOMAIN} did not resolve at all,
    # while `kubectl get ingress` showed it bound to the Traefik LB IP and
    # looking healthy.
    - ../../../components/tailscale
  postBuild:
    substitute:
      APP: thanos
      NAMESPACE: observability
      TAILSCALE_SERVICE: thanos-query-frontend
      TAILSCALE_PORT: http
      # thanos.driscoll.tech is `local-user` (network gate, no SSO) on the
      # internal route, and Thanos is queried by Grafana and by the Dockge
      # hosts' remote-write agents, not only by browsers.
      TAILSCALE_MIDDLEWARE: tailscale-local
