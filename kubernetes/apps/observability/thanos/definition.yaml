---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: thanos-query-observability
spec:
  name: Thanos Query
  category: Observability
  description: Thanos is a highly available, long term Prometheus setup with global query view.
  url: &url https://thanos.${ROOT_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/thanos.svg
  access_policy:
    groups:
      - admins
  authentik:
    proxy:
      mode: "forward_single"
      externalHost: *url
      skipPathRegex: "^/api([/?].*)?$"
  gatus:
    - url: https://thanos.${ROOT_DOMAIN}
      method: GET
      conditions:
        - "[STATUS] == 200"
