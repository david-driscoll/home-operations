---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/service.json
#
# THE TAILNET NAME `thanos-receive`, on the tailnet-outbound ProxyGroup. The
# Docker hosts' Prometheus and Alloy and the Proxmox hosts remote-write to
# thanos-receive.<tailnet>:19291.
#
# A separate LoadBalancer Service, not annotations on the chart's ClusterIP
# one, for the reason in kubernetes/apps/observability/loki/tailnet-service.yaml:
# the operator writes load-balancer status that a ClusterIP Service may not
# carry. No node ports, so remote-write is not opened on the LAN.
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-tailnet
  annotations:
    tailscale.com/hostname: thanos-receive
    tailscale.com/tags: tag:observability
    tailscale.com/proxy-group: tailnet-outbound
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/component: receive
    app.kubernetes.io/instance: thanos
    app.kubernetes.io/name: thanos
  ports:
    - name: http
      port: 10902
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 10901
      targetPort: grpc
      protocol: TCP
    - name: remote
      port: 19291
      targetPort: remote-write
      protocol: TCP
    - name: capnproto
      port: 19391
      targetPort: capnproto
      protocol: TCP
