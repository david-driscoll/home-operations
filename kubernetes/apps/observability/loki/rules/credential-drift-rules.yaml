---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# ============================================================================
# Loki ruler rules. This is NOT a PrometheusRule -- Loki's ruler reads rule
# FILES, and the loki-sc-rules sidecar on the loki StatefulSet watches for
# ConfigMaps labelled `loki_rule` in ANY namespace (LABEL=loki_rule,
# NAMESPACE=ALL, RESOURCE=both) and drops each key into /rules/fake, which is
# the ruler's local storage directory. The ruler is already pointed at
# alertmanager-operated:9093 with enable_alertmanager_v2, so a labelled
# ConfigMap is the whole integration.
#
# This is the FIRST such ConfigMap in the estate -- there were no other
# `loki_rule` objects when it was written. The plumbing is the Loki chart's
# standard sidecar pattern and the query below was verified against live Loki
# before committing, but the sidecar pickup itself cannot be proven until this
# is applied. Verify after merge, and do not assume silence means healthy:
#
#   kubectl -n observability exec sts/loki -c loki -- ls -R /rules/fake
#   kubectl -n observability logs sts/loki -c loki-sc-rules | tail
#   curl -s http://<loki>/loki/api/v1/rules
#
# An empty /rules/fake means the sidecar did not pick this up, and the alert
# will sit silent forever -- the same failure shape as the dead longhorn rules
# in longhorn-system/longhorn/rules/pvc-usage-rules.yaml.
#
# ---------------------------------------------------------------------------
# What it catches, and why a probe cannot.
#
# The complement to traefik-silent-failure-rules: that one sees an app that
# answers 5xx, this one sees the CAUSE class that produced the 2026-08-27
# FreshRSS outage, and would see it even in an app that degrades WITHOUT
# returning 5xx (a background sync worker, a cron job, a queue consumer).
#
# FreshRSS cached its database password in data/config.php on its PVC and read
# the environment only at first install, so the 30-day rotation reached the
# Secret, reached the pod's env, and never reached the application. The pod
# stayed 1/1 Ready with both probes green because no unauthenticated endpoint
# opens a database connection. The ONLY place the truth appeared was the log.
#
# Verified against live Loki over the 24h containing the incident: 63 non-zero
# 15m buckets, peaking at 23 occurrences per bucket.
#
# The selector is deliberately estate-wide rather than scoped to freshrss. This
# is a class of bug, not an app's bug -- any app that caches a credential on
# disk, or holds a pooled connection across a rotation, fails the same way.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-credential-drift-rules
  labels:
    loki_rule: "true"
data:
  credential-drift.yaml: |
    groups:
      - name: credential-drift
        rules:
          - alert: DatabaseAuthenticationFailing
            # `for: 15m` rather than firing immediately: a single failure is a
            # restart racing a rotation and self-heals. What is being detected
            # is a credential that has stopped working and is NOT being retried
            # into health -- which is what "the app has a stale copy" looks like.
            expr: |
              sum by (namespace, pod) (
                count_over_time({namespace=~".+"} |= "password authentication failed" [15m])
              ) > 0
            for: 15m
            labels:
              severity: warning
              issue: An application is failing to authenticate to PostgreSQL while its pod stays Ready.
            annotations:
              summary: Database authentication is failing for a running pod.
              description: >-
                {{$labels.namespace}}/{{$labels.pod}} has been logging PostgreSQL authentication
                failures for 15 minutes. Its probes are probably still green -- most apps here do
                not open a database connection on any unauthenticated endpoint, so neither the
                kubelet nor Gatus can see this. Suspect a credential the app cached at install
                and did not re-read after rotation.
