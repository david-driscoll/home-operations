---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: silence-operator
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.22.0
    digest: sha256:f8d727fe09855019235a7b98ea635006cc0b6ec12835015ab21d17f1de943738
  # Repointed off ghcr.io/home-operations/charts-mirror, which stopped serving
  # silence-operator on 2026-10-28 (anonymous pulls DENIED). Same pattern as the
  # intel charts; the upstream artifact has the same helm layer mediaType.
  url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: silence-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    alertmanagerAddress: http://alertmanager-operated.observability.svc.cluster.local:9093
    image:
      registry: quay.io
      name: giantswarm/silence-operator
      tag: 0.18.0
    networkPolicy:
      enabled: false
    # Stateless Deployment; placement flexibility only. Top-level key in this
    # chart, default [].
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
