---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app alertmanager-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: *app
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      data:
        pushover_user_key: "{{ .pushover_username }}"
        pushover_api_token: "{{ .pushover_credential }}"
  dataFrom:
    - extract:
        # was: 'shared/${CLUSTER_CNAME}-pushover-key'. One fixed path now — see
        # the matching note in dashboard/externalsecret.yaml for why the
        # per-cluster substitution went away.
        key: third-party-tokens/pushover/alert-manager
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "pushover_$1"
