---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: pushover
    groupBy: ["alertname", "job"]
    groupInterval: 10m
    groupWait: 1m
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: severity
            value: none
            matchType: '='
          - name: alertname
            value: InfoInhibitor|Watchdog
            matchType: "=~"
      # NetBird warnings (D47, docs/plans/netbird-mirror.md "Monitoring"): a
      # peer down for 10 minutes, a custom domain not validated, the health
      # job not running. Worth seeing, not worth a sound: Pushover priority -1
      # with no sound. NetBird critical alerts fall through to `pushover` and page as
      # before. Scoped by alertname on purpose; dropping the alertname matcher
      # would make every warning in the estate quiet.
      - receiver: pushover-quiet
        matchers:
          - name: severity
            value: warning
            matchType: '='
          - name: alertname
            value: Netbird.*
            matchType: "=~"
      - receiver: pushover
        continue: true
        matchers:
          - name: severity
            value: error
            matchType: '='
          - name: severity
            value: critical
            matchType: '='
  inhibitRules:
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: '='
      targetMatch:
        - name: severity
          value: warning
          matchType: '='
  receivers:
    - name: "null"
    - name: pushover
      pushoverConfigs:
        - html: true
          message: &pushoverMessage |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: pushover_api_token
          userKey:
            name: alertmanager-secret
            key: pushover_user_key
          urlTitle: View in Alertmanager
    # `pushover` turned down: same message, no sound, low priority.
    - name: pushover-quiet
      pushoverConfigs:
        - html: true
          message: *pushoverMessage
          priority: "-1"
          sendResolved: true
          sound: none
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: pushover_api_token
          userKey:
            name: alertmanager-secret
            key: pushover_user_key
          urlTitle: View in Alertmanager
