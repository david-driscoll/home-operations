---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/service.json
#
# THE TAILNET NAME `alertmanager`, on the tailnet-outbound ProxyGroup.
#
# A separate LoadBalancer Service, not annotations on the chart's ClusterIP
# one, for the reason in kubernetes/apps/observability/loki/tailnet-service.yaml:
# the operator writes load-balancer status that a ClusterIP Service may not
# carry. No node ports, so Alertmanager is not opened on the LAN.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-tailnet
  annotations:
    tailscale.com/hostname: alertmanager
    tailscale.com/tags: tag:observability
    tailscale.com/proxy-group: tailnet-outbound
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    alertmanager: alertmanager
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http-web
      port: 9093
      targetPort: 9093
      protocol: TCP
    - name: reloader-web
      port: 8080
      targetPort: reloader-web
      protocol: TCP
