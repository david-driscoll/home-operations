nameOverride: &name alertmanager
fullnameOverride: *name
ipFamilyPolicy: SingleStack
ipFamilies:
  - IPv4
cleanPrometheusOperatorObjectNames: true
alertmanager:
  annotations:
    reloader.stakater.com/auto: "true"
  priorityClassName: observability-critical
  service:
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: alertmanager
      tailscale.com/tags: tag:observability
      tailscale.com/proxy-group: tailnet-outbound
  route:
    main:
      enabled: true
      hostnames:
        - alertmanager.${ROOT_DOMAIN}
      parentRefs:
        - name: internal
          namespace: network
          kind: Gateway
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authenticated-user

  alertmanagerSpec:
    replicas: 1
    # Placement flexibility only. Alertmanager is a StatefulSet with a 1Gi
    # Longhorn PVC (below); a toleration widens where it MAY schedule but does
    # not move the volume, so the pod still follows its data.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    alertmanagerConfiguration:
      name: alertmanager
    # alertmanagerConfiguration:
    #   name: alertmanager
    #   global:
    #     resolvetimeout: 10m
    externalUrl: https://alertmanager.${ROOT_DOMAIN}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          resources:
            requests:
              storage: 1Gi

grafana:
  enabled: false

# This release is kube-prometheus-stack with everything but Alertmanager
# switched off below -- but `defaultRules` is not a subchart and was never in
# that list, so it kept rendering a full private copy of all ~120 chart alert
# rules. Verified 2026-09-20: the `kubernetes-apps` group was loaded three
# times (observability-alertmanager-*, observability-grafana-*,
# observability-prometheus-*), tripling rule evaluation for no benefit.
#
# It went unnoticed because the copies are identical: Alertmanager deduplicates
# alerts by label set, so three evaluations collapse into one notification. The
# cost only becomes visible when a rule is CUSTOMISED -- an override in one
# release fires alongside the other two originals, which is the trap this
# repo's app-identity work walked into.
#
# The prometheus release is the one that owns rules now.
defaultRules:
  create: false
kubeEtcd: &disabled
  enabled: false
crds: *disabled
kubernetesServiceMonitors: *disabled
kubeProxy: *disabled
kubeApiServer: *disabled
prometheus: *disabled
prometheus-node-exporter: *disabled
kube-state-metrics: *disabled
kubeControllerManager: *disabled
coreDns: *disabled
kubelet: *disabled
kubeScheduler: *disabled
kubeStateMetrics: *disabled
nodeExporter: *disabled
prometheusOperator: *disabled
