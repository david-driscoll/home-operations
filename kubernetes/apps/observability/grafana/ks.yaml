---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana
  namespace: &namespace observability
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: observability-repositories
      namespace: observability
  path: ./kubernetes/apps/observability/grafana
  components:
    # Rotating credential, and the first app in the estate to take one
    # (tranche 1) -- Stakater-covered with the annotation on the Deployment,
    # reading its credential from a Secret rather than a baked-in Helm value,
    # and on nothing else's critical path.
    - ../../../components/postgres
  prune: true
  # See home-operations:docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_ACCESSMODES: ReadWriteMany
