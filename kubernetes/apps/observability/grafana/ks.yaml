---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana
  namespace: &namespace observability
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: observability-repositories
      namespace: observability
  path: ./kubernetes/apps/observability/grafana
  components:
    - ../../../components/postgres
    # TRANCHE 1. Hands grafana's database password to OpenBao's database
    # secrets engine: drops passwordSecret from the DatabaseRole so CNPG stops
    # managing it, repoints the credential ExternalSecret at the
    # VaultDynamicSecret generator, and makes the Pulumi system stack create a
    # static role -- which ROTATES THE PASSWORD IMMEDIATELY.
    #
    # grafana first because it is Stakater-covered (the annotation is on the
    # Deployment, checked), reads its credential from a Secret rather than a
    # baked-in Helm value, and is not on anything else's critical path.
    - ../../../components/postgres/rotate
  prune: true
  # See home-operations:docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  wait: true
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_ACCESSMODES: ReadWriteMany
