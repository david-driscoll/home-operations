        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "description": "Response throughput, mostly layer blobs sent to peers.",
          "id": 15,
          "type": "timeseries",
          "title": "Bytes served",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
