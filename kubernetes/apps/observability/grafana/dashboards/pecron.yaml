                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "description": "Hourly rate derived from the cumulative kWh counters. Three of the four are integrated by pecron-monitor itself and persisted to disk, so losing that state file reads as a counter reset \u2014 rate() absorbs it, increase() across the gap under-reports.",
