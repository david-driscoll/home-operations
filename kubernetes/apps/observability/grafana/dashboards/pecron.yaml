---
# Pecron battery/UPS dashboard.
#
# Fed by the exporter in docker/alpha-site/pecron-monitor/, scraped by the
# alpha-site Prometheus and remote-written into Thanos. Grafana's default
# datasource IS Thanos Query, so nothing extra is needed to see it here.
# Filter to this fleet with `{cluster="alpha-site", job="pecron"}`.
#
# Datasource placeholders are written `$${DS_PROMETHEUS}` with a doubled `$`,
# matching gpu.yaml and flux.yaml. Inlined JSON is visible to Flux's post-build
# substitution, which runs in strict mode and aborts the whole
# observability/grafana Kustomization on any `${...}` it cannot resolve. The
# `$$` collapses to a single `$` during substitution, so grafana-operator still
# receives the `$${DS_PROMETHEUS}` it maps via the `datasources:` input below.
# Grafana's own template variable (`$device`) uses the bare-`$` form, which Flux
# leaves alone.
#
# NOT the `"uid": "prometheus"` form used by cadvisor.yaml: the Prometheus
# GrafanaDatasource sets no explicit uid, so the operator generates one and a
# hardcoded "prometheus" resolves to nothing.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: power
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  title: "Power"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: pecron-batteries
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: "power"
  resyncPeriod: 10m
  datasources:
    - datasourceName: Prometheus
      inputName: DS_PROMETHEUS
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "id": 1,
          "type": "row",
          "title": "At a glance",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "description": "State of charge per unit. Colours follow the rules-engine staging thresholds: 45%+ normal, under 25% low, under 12% critical.",
          "id": 2,
          "type": "stat",
          "title": "Charge",
          "gridPos": {
            "h": 5,
            "w": 7,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "pecron_battery_percent{device=~\"$device\"}",
              "legendFormat": "{{device}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 12
                  },
                  {
                    "color": "yellow",
                    "value": 25
                  },
                  {
                    "color": "green",
                    "value": 45
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "description": "Load each unit is currently supplying.",
          "id": 3,
          "type": "stat",
          "title": "Output power",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 7,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "pecron_output_power_watts{device=~\"$device\"}",
              "legendFormat": "{{device}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          }
        },
        {
