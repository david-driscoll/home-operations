              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$${DS_PROMETHEUS}"
          },
          "description": "Normal observed range is 27-33\u00b0C. Alerts fire at 45\u00b0C (advisory) and 55\u00b0C (critical). Charging below 2\u00b0C plates lithium and is alerted separately.",
          "id": 10,
          "type": "timeseries",
          "title": "Temperature",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "pecron_temperature_celsius{device=~\"$device\"}",
              "legendFormat": "{{device}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              },
