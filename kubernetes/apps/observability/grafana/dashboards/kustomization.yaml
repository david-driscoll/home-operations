---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./cadvisor.yaml
  - ./coder.yaml
  - ./flux.yaml
  - ./gpu.yaml
  - ./kubernetes.yaml
  - ./media.yaml
  - ./netbird.yaml
  - ./network.yaml
  - ./node-monitoring.yaml
  - ./pecron.yaml
  - ./services.yaml
  - ./thanos.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # NetBird's Management board, vendored (netbird.yaml). Flux would rewrite
  # every ${...} in it, the dashboard's own variables included, to empty.
  - name: netbird-management-dashboard
    files:
      - management.json=./netbird/management-v0.82.1.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
