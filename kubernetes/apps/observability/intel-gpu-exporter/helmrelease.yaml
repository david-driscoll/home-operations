# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app intel-gpu-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      intel-gpu-exporter:
        type: daemonset
        containers:
          app:
            image:
              repository: ghcr.io/clambin/intel-gpu-exporter
              tag: 0.7.4@sha256:d78761fef018834c759db154fe9dcf3dd9db5974703fa50ca21f6abc35221be1
            args:
              # Sampling interval handed to `intel_gpu_top -s`. The exporter
              # aggregates (medians) every sample it has seen since the last
              # scrape, so this is the resolution of the engine-busy signal,
              # not the scrape interval.
              - --interval=5s
            env:
              TZ: ${TIMEZONE}
            securityContext:
              # Least privilege, established empirically top-down (vault#110).
              # Three independent gates have to be satisfied to read the i915 PMU:
              #
              #  1. capability — intel_gpu_top calls perf_event_open(2) for
              #     system-wide (task == NULL) i915 PMU events. With
              #     kernel.perf_event_paranoid > 0 the kernel requires
              #     perfmon_capable(), which CAP_PERFMON satisfies (>= 5.8; nodes
              #     run 6.18.39-talos). CAP_SYS_ADMIN would also work and is
              #     strictly wider, so it is deliberately NOT used.
              #  2. seccomp — containerd's RuntimeDefault profile denies
              #     perf_event_open UNLESS the container holds CAP_PERFMON or
              #     CAP_SYS_ADMIN, in which case it is added to the allow list
              #     (containerd contrib/seccomp/seccomp_default.go). Since Talos
              #     sets defaultRuntimeSeccompProfileEnabled: true cluster-wide,
              #     RuntimeDefault applies whether or not it is declared here, so
              #     it is declared explicitly rather than left to look accidental.
              #     If the PMU ever returns EPERM with the capability present,
              #     the next step is seccompProfile: { type: Unconfined }, NOT a
              #     wider capability set.
              #  3. sysctl — kernel.perf_event_paranoid is 3 on every node
              #     (Talos default; not overridden in talos/patches). Verified
              #     the kernel is built WITHOUT
              #     CONFIG_SECURITY_PERF_EVENTS_RESTRICT, so there is no
              #     Debian/AOSP-style "paranoid > 2 blocks everyone" tier — the
              #     mainline gates are all `&& !perfmon_capable()` and CAP_PERFMON
              #     clears them. No Talos machine-config change is required.
              #
              # runAsUser 0 is required, not incidental: /dev/dri/card0 is
              # crw------- root:root on Talos, so only uid 0 can open the card
              # node. Running non-root would need CAP_DAC_OVERRIDE, which is
              # wider than staying root with everything else dropped.
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["PERFMON"]
              seccompProfile: { type: RuntimeDefault }
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: 9100
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 15m
                memory: 64Mi
              limits:
                memory: 128Mi
                # Grants /dev/dri access via the Intel device plugin, which runs
                # with -enable-monitoring. This resource hands the pod EVERY GPU
                # on the node and — unlike `gpu.intel.com/i915` — does not consume
                # one of the shared transcode slots (2 per control plane, 3 per
                # worker) that plex/jellyfin/tdarr/stremio/dispatcharr contend
                # for. That separation is structural, not a quirk of the
                # numbers: the plugin builds a distinct kubelet endpoint per
                # resource type, and registers the monitoring device once
                # OUTSIDE the sharedDevNum loop.
                #
                # NAME CHANGED at intel-device-plugins 0.36.0, which this repo
                # now pins. The old `gpu.intel.com/i915_monitoring` was derived
                # from the KMD; 0.36.0 defaults to a single combined
                # `gpu.intel.com/monitoring` covering i915 and xe alike, and
                # marks the per-KMD names Deprecated. The two device plugin
                # releases are pinned to `monitoringMode: single` to match —
                # see kube-system/features/intel-gpu/helmrelease.yaml.
                #
                # This edit and that version bump MUST ship together. On 0.36.0
                # nothing advertises i915_monitoring, so keeping the old name
                # here leaves these pods Pending on all five Intel nodes; on
                # 0.34.1 nothing advertises the combined name, so making this
                # edit alone does the same. Neither half is safe to land first.
                #
                # Capacity is exactly 1 per node — the plugin registers the
                # monitoring device once with id "all", regardless of card count
                # or sharedDevNum. So this pod is the ONLY GPU-telemetry
                # workload that can run per node; a second one requesting it
                # (an XPU Manager daemonset, say) would sit Pending forever
                # rather than sharing.
                gpu.intel.com/monitoring: 1
    defaultPodOptions:
      # Only the Intel Quick Sync nodes. All five are equestria nodes: the
      # workers fluttershy and kerfuffle (0x46a6 Alder Lake-P) and the control
      # planes milky-way, othalla and pegasus (0x46d4 Alder Lake-N). The label
      # is published by the Intel GPU plugin's NFD rules — verified present on
      # exactly those five and on neither AMD node (hard-hat, shining-armor).
      #
      # This previously read "equestria: ... ; sgc: ...", which described a
      # split that does not exist — equestria is the only Kubernetes cluster in
      # the estate (clusters/*.yaml: the other four are Dockge/Docker), and
      # "stargate-command" is a NAMESPACE in this same cluster, not a cluster.
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      # The nodeSelector above already confines this to the Intel Quick Sync
      # nodes; the toleration only stops the control-plane taint from
      # subtracting any of them once allowSchedulingOnControlPlanes is false.
      # It does not widen the node set.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # hostPID is deliberately NOT set, though upstream's README uses it.
      # It is only needed for the per-client breakdown (intel_gpu_top reads
      # /proc/*/fdinfo to attribute usage to processes), which powers
      # gpumon_clients_count. Engine busyness and frequency come from the i915
      # PMU and need no host PID namespace, so the trade is one cosmetic
      # breakdown against not exposing the host process table to a pod that
      # already runs as uid 0 with CAP_PERFMON. Worth it.
      #
      # Correction to what this note used to claim, both halves measured:
      #   * gpumon_clients_count is not merely 0 — the exporter does not emit
      #     the series AT ALL without hostPID. The Grafana panel that queried
      #     it has been removed rather than left permanently blank.
      #   * IMC bandwidth does NOT come from the i915 PMU and is not obtained
      #     here either. gpumon_imc_read/write read flat 0 on all five nodes
      #     across 20d, including windows where engine busyness hit 70%. Alder
      #     Lake client exposes uncore_imc_0 / uncore_imc_1 /
      #     uncore_imc_free_running_0/1, and igt looks up a plain `uncore_imc`
      #     event source that does not exist here. Not fixable from this repo.
      #
      # What this pod actually produces on this silicon: gpumon_engine_usage
      # (12 series), gpumon_frequency (2) and gpumon_power (2, sourced from
      # RAPL under /sys/class/powercap — the i915 PMU exposes no energy-* event
      # on an integrated part).
    service:
      metrics:
        controller: *app
        ipFamilyPolicy: PreferDualStack
        ports:
          metrics:
            port: 9100
    persistence:
      # readOnlyRootFilesystem: true — igt-gpu-tools scratch space.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
