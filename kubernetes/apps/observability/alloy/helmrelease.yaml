---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: alloy
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.14.1
    digest: sha256:c1429bdfe98921f96cc49ec7289f67743ef8357afcb175d67cc5e8cc5de8549c
  url: oci://ghcr.io/home-operations/charts-mirror/alloy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 1h
  # Not the 5m default. A DaemonSet rolls one node at a time (maxUnavailable 1)
  # and each pod costs an image pull plus readiness plus minReadySeconds, so
  # seven nodes take ~5-6 minutes on a fresh tag. At 5m Helm gave up with 6/7
  # updated, rolled back, and after the retries the release sat Stalled and
  # blocked loki and talos-logs behind it (2026-10-23/24).
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: alloy
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: alloy
    priorityClassName: observability-critical
    alloy:
      configMap:
        create: false
        name: &app alloy-configmap
        key: config.alloy
      enableReporting: false
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          cpu: 400m
          memory: 600Mi

    controller:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      # alloy runs as a DaemonSet and scrapes/collects from the node it is on,
      # so a control plane without it is an observability blind spot. Chart
      # default is [], so nothing is being replaced.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        external-dns.kubernetes.io/target: "${INTERNAL_DOMAIN}"
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.middlewares: network-authenticated-user@kubernetescrd
      hosts:
        - alloy.${CLUSTER_DOMAIN}
      faroPort: 12345
