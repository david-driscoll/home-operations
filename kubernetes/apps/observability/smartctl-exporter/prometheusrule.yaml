---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - alert: SmartDeviceHighTemperature
          annotations:
            summary:
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              has a temperature higher than 90°C.
          # `current` only. smartctl-exporter v0.15.0 also exports each drive's
          # fixed limits under the same metric (`op_limit_max`, `critical_limit_max`
          # = 95 on these NVMe), and an unfiltered `> 90` fires on the constant.
          expr: smartctl_device_temperature{temperature_type="current"} > 90
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceTestFailed
          annotations:
            summary:
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              did not pass its SMART test.
          expr: |
            (
              smartctl_device_smart_status != 1
            or
              smartctl_device_status != 1
            )
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceCriticalWarning
          annotations:
            summary:
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }}
              is in a critical state.
          expr: smartctl_device_critical_warning != 0
          for: 15m
          labels:
            severity: critical
        #
        # https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-smartctl-exporter/rules/rules.txt
        #
        #
        # Fires on NEW media errors, not on the lifetime count. The upstream
        # `> 10` is a counter compared to a constant, so once a drive crosses it
        # the alert fires for the rest of the drive's life: othalla's nvme0 sat
        # at 89 (flat since 2026-09-12) as a permanent critical that taught
        # everyone to ignore it. A drive whose count is still climbing is the
        # one to act on. A restarted exporter pod starts a new series, and
        # increase() never counts a series' first sample, so that cannot fire it.
        - alert: SmartDeviceMediaErrors
          annotations:
            description: "Mounted drive {{ $labels.device }} on device {{ $labels.instance }} logged {{ $value | humanize }} new media errors in the last day."
            summary: Device has new media errors
          expr: increase(smartctl_device_media_errors[1d]) > 0
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceAvailableSpareUnderThreshold
          annotations:
            summary:
              Device {{ $labels.device }} on instance {{ $labels.instance }}
              is under available spare threshold.
          expr: smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 15m
          labels:
            severity: critical
        - alert: SmartDeviceInterfaceSlow
          annotations:
            summary:
              Device {{ $labels.device }} on instance {{ $labels.instance }}
              interface is slower then it should be.
          expr: |
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          for: 15m
          labels:
            severity: critical
