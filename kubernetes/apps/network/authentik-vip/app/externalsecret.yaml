---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The VRRP PASS token, shared with the alpha-site keepalived. Minted by
# stacks/system (authentik-vip.ts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-vrrp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-vrrp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        VRRP_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: clusters/equestria/apps/authentik-vip/vrrp
