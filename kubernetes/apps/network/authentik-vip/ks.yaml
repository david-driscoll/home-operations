---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# authentik-vip -- keepalived holding authentik's VIP (10.10.255.10) on
# equestria. Phase 6 of docs/authentik-active-active/PLAN.md; the other half is
# docker/alpha-site/authentik-vip.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik-vip
  namespace: &namespace network
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: external-secrets
      namespace: kube-system
    - name: traefik
      namespace: network
  path: ./kubernetes/apps/network/authentik-vip/app
  prune: true
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
