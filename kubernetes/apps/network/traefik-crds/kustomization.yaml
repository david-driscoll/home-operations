---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_ingressroutes.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_ingressroutetcps.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_ingressrouteudps.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_middlewares.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_middlewaretcps.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_serverstransports.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_serverstransporttcps.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_tlsoptions.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_tlsstores.yaml
  # renovate: datasource=helm depName=traefik registryUrl=https://traefik.github.io/charts
  - https://raw.githubusercontent.com/traefik/traefik-helm-chart/v40.2.0/traefik/crds/traefik.io_traefikservices.yaml
patches:
  # Never let a Kustomization ownership change (e.g. the piece-21 redirect
  # flip) cascade-delete these CRDs -- deleting a CRD deletes every
  # instance of it cluster-wide, which is exactly the 2026-08-13 incident
  # (docs/cluster-consolidation/26-bootstrap-apps-to-pulumi.md). This is the
  # single highest-value place to apply prune:disabled in the whole tree.
  - patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: not-used
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
    target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
