---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
image:
  registry: ghcr.io
  repository: traefik/traefik
  tag: v3.7.12@sha256:5447d0eaf375d832b8f224f88db0e80c0a2d44554fc973e3ba72c3a52946cfcc
deployment:
  kind: Deployment
  replicas: 2
  priorityClassName: system-node-critical
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
# TOP-LEVEL, not `deployment.tolerations`. Verified against traefik 41.3.0 by
# rendering the chart with both keys set: only `.Values.tolerations` reaches the
# pod spec. The nested copy that used to live under `deployment:` was therefore
# silently dead -- the live pods carried the admission controller's DEFAULT
# not-ready/unreachable tolerations at tolerationSeconds 300, never the 60 the
# nested block asked for. Both entries are preserved here so that intent finally
# takes effect.
#
# The control-plane entry is Tier 1: traefik must survive a Battery window, when
# the workers are off and the control planes carry §4's taint. §8 Stage 2 found
# it among the 51 untolerated Tier-0/1 workloads.
# See docs/cluster-consolidation/20-low-power-tier.md §4.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
service:
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
    io.cilium/lb-ipam-ips: "${INTERNAL_IP}"
additionalArguments:
  - '--providers.file.filename=/config/store.yaml'
  - '--serversTransport.insecureSkipVerify=true'
  - --certificatesresolvers.tailscale.tailscale=true
  - --entryPoints.web.address=:80/tcp
  - --entryPoints.websecure.address=:443/tcp
  - --entryPoints.postgres.address=:5432/tcp
  - --entryPoints.mariadb.address=:3306/tcp
  - --entryPoints.bolt.address=:7687/tcp
volumes:
  # - name: le-staging-tls
  - name: le-production-tls
    mountPath: '/certs'
    type: secret
  - name: cluster-tls
    mountPath: '/cluster-certs'
    type: secret
  - name: traefik-tls-settings
    mountPath: '/config'
    type: configMap
  - name: crowdsec-secret
    mountPath: /etc/secrets/crowdsec
    type: secret
ports:
  traefik:
    expose:
      default: true
  # ---- forwardedHeaders / proxyProtocol: FIXED, see below -----------------
  #
  # Both used to sit under `http:` on `web` and `websecure`. The chart reads
  # `ports.<name>.forwardedHeaders` and `ports.<name>.proxyProtocol` ONE LEVEL UP
  # -- traefik/templates/_podtemplate.tpl renders `$config.forwardedHeaders`, not
  # `$config.http.forwardedHeaders` -- so neither had ever reached Traefik.
  # Rendering the chart and dumping the container args showed ZERO
  # `--entryPoints.*.forwardedHeaders.*` and ZERO `--entryPoints.*.proxyProtocol.*`.
  # Same silently-dead shape as the `deployment.tolerations` note at the top.
  #
  # What that cost: with no trusted proxy, Traefik STRIPS an inbound
  # X-Forwarded-For and rewrites it from the connection. Every external request
  # arrives through the in-cluster cloudflare-tunnel pods, so the "client" seen
  # downstream was a pod IP -- which is precisely the failure the crowdsec plugin's
  # `forwardedHeadersTrustedIPs` block says it exists to prevent
  # (middleware/crowdsec.yaml). Real client attribution for external traffic has
  # therefore been broken for as long as this has been mis-nested.
  #
  # `insecure: true` is NOT carried over. It means "believe a forwarded header from
  # ANY source", and crowdsec's `clientTrustedIPs` skips the bouncer entirely for
  # 10.0.0.0/8 -- so an external client that could forge `X-Forwarded-For: 10.x`
  # would opt itself out of CrowdSec. The trusted set is instead the only things
  # that are actually proxies here: the cluster's own pod and service networks,
  # which is where cloudflared runs (verified: 10.206.1.88 / 10.206.3.218).
  # Narrowing from "trust nobody" to "trust the cluster" is monotonic -- no request
  # that works today can start failing.
  #
  # proxyProtocol is DELETED rather than relocated. Nothing in the estate speaks
  # it -- the only mention anywhere was this file -- and turning it on when no
  # upstream sends a PROXY header changes how the connection itself is framed and
  # takes the ingress down. Dead config that is dangerous to revive is better
  # removed than moved.
  web:
    port: 80
    exposedPort: 80
    forwardedHeaders: &forwarded-headers
      trustedIPs:
        - "${CLUSTER_NETWORK}"
        - "${SERVICE_NETWORK}"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    exposedPort: 443
    forwardedHeaders: *forwarded-headers
    http:
      tls:
        enabled: true
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  # The tailnet entrypoint. Every name under the tailnet domain lands here, so that
  # tailnet traffic gets the same Traefik treatment as everything else instead of
  # being proxied straight at a pod. Modelled on the `tailscale` entrypoint in
  # docker/_common/traefik/config.yaml, which has been carrying the Dockge hosts'
  # tailnet routes on this same port for months.
  #
  # PLAIN HTTP ON PURPOSE -- no `http.tls` and no `redirections`. tailscaled owns
  # the TLS: `tailscale serve --https=443` terminates with the tailnet cert and
  # reverse-proxies cleartext here. Adding the websecure-style redirect would send
  # the client back to https://<same-host>, which tailscaled serves, which proxies
  # here again -- an infinite loop rather than a broken page.
  #
  # `expose.default: true` is load-bearing: the Tailscale operator resolves an
  # Ingress backend to `<ClusterIP>:<port>` and rejects a Service that does not
  # carry the port (cmd/k8s-operator/ingress.go), and the per-namespace
  # `traefik-tailnet` EndpointSlice in components/common targets this port on the
  # LoadBalancer address pinned by `service.annotations` above. Reaching it from
  # the LAN is the same posture as :443 -- every router on this entrypoint carries
  # the tailscale-user or tailscale-local chain.
  tailscale:
    port: 8443
    exposedPort: 8443
    protocol: TCP
    expose:
      default: true
    # Same key and same trusted set as web/websecure above, and load-bearing here:
    # tailscaled sets X-Forwarded-For to the CLIENT's tailnet address
    # (ipn/ipnlocal/serve.go), and network/tailscale-network reads it at
    # ipStrategy.depth 1 to assert the request came off the tailnet. Traefik only
    # preserves an inbound X-Forwarded-* header from a trusted source, so without
    # this the header is dropped and that middleware fails closed on every request.
    #
    # The tailnet-outbound proxy pods sit in the cluster pod network, so the
    # shared anchor already covers them exactly.
    forwardedHeaders: *forwarded-headers
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  postgres:
    expose:
      default: true
    port: 5432
    exposedPort: 5432
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  mariadb:
    expose:
      default: true
    port: 3306
    exposedPort: 3306
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  bolt:
    expose:
      default: true
    port: 7687
    exposedPort: 7687
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  # Forgejo's built-in Go SSH server (kubernetes/apps/coder/forgejo), on the
  # standard port so clone URLs are plain `git@git.driscoll.tech:owner/repo`.
  # Nothing collides: Talos nodes run no sshd, and this binds the Gateway's
  # LoadBalancer IP, not a node. Traefik takes 22 despite running as uid 65532
  # with all capabilities dropped, for the same reason it already takes 80 and
  # 443 -- Kubernetes sets net.ipv4.ip_unprivileged_port_start=0 in the pod
  # sandbox. `Tailscale.ports.git` in components/constants.ts grants tcp:22,
  # and note it is NOT the same grant as `ports.ssh`.
  #
  # The readTimeout override matters here for the same reason it does on
  # postgres: a long `git clone` over SSH is a single idle-then-bursty stream
  # and the default responding timeout would cut it.
  gitssh:
    expose:
      default: true
    port: 22
    exposedPort: 22
    protocol: TCP
    transport:
      respondingTimeouts:
        readTimeout: "0s"
ingressClass:
  enabled: true
  isDefaultClass: false
  name: internal
metrics:
  addInternals: true
  prometheus:
    disableAPICheck: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    # cpu: 400m
    memory: 512Mi
providers:
  kubernetesCRD:
    ingressClass: "internal"
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true
  kubernetesIngress:
    ingressClass: "internal"
    enabled: true
    allowExternalNameServices: true
  kubernetesGateway:
    enabled: true
    experimentalChannel: true
    statusAddress:
      ip: "${INTERNAL_IP}"
log:
  access:
    enabled: true
  general:
    # -- Set [logs format](https://doc.traefik.io/traefik/observability/logs/#format)
    format: common
    # -- Alternative logging levels are TRACE, DEBUG, INFO, WARN, ERROR, FATAL, and PANIC.
    level: "WARN"
ingressRoute:
  dashboard:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: internal
      external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
      external-dns.alpha.kubernetes.io/hostname: internal.${CLUSTER_DOMAIN}
    matchRule: Host(`internal.${CLUSTER_DOMAIN}`)
    services:
      - name: api@internal
        kind: TraefikService
    entryPoints:
      - "traefik"
      - "websecure"
    middlewares:
      # BREAK-GLASS: network-gated, NOT authentik-gated. `authenticated-user`
      # chains error-pages -> outpost -> internal-network; `local-user` is the
      # same chain without the outpost hop. The Traefik dashboard is one of the
      # tools used to diagnose an authentik outage, so it must not depend on
      # authentik being up. See docs/cluster-consolidation/07-authentik-to-alpha-site.md
      # section 3.3 -- a hard prerequisite of moving authentik off-cluster.
      - name: local-user
        namespace: network
    tls:
      secretName: "le-production-tls"
experimental:
  plugins:
    traefik-plugin-query-modification:
      moduleName: "github.com/kingjan1999/traefik-plugin-query-modification"
      version: "v1.0.0"
    fail2ban:
      moduleName: "github.com/tomMoulard/fail2ban"
      version: "v0.8.9"
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.7.1"
  fastProxy:
    enabled: true
  otlpLogs: true

tlsStore:
  default:
    certificates:
      - secretName: &default-certificate le-production-tls
    defaultCertificate:
      secretName: *default-certificate
gatewayClass:
  enabled: true
gateway:
  enabled: true
  annotations:
    external-dns.alpha.kubernetes.io/target: &hostname "${INTERNAL_DOMAIN}"
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/target: *hostname
  name: internal
  listeners:
    web:
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All

    websecure:
      port: 443
      protocol: HTTPS
      namespacePolicy:
        from: All
      mode: Terminate
      certificateRefs:
        - name: le-production-tls
          kind: Secret

    postgres:
      protocol: TCP
      port: 5432
      namespacePolicy:
        from: All

    mariadb:
      protocol: TCP
      port: 3306
      namespacePolicy:
        from: All

    bolt:
      protocol: TCP
      port: 7687
      namespacePolicy:
        from: All

    # Traefik matches a Gateway listener to an entryPoint BY PORT, so this and
    # the `gitssh` entrypoint above have to move together -- a listener with no
    # entrypoint on the same port is silently dropped.
    gitssh:
      protocol: TCP
      port: 22
      namespacePolicy:
        from: All
