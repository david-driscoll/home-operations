---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    external-dns.kubernetes.io/target: &hostname "${EXTERNAL_DOMAIN}"
spec:
  gatewayClassName: traefik
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      io.cilium/lb-ipam-ips: "${EXTERNAL_IP}"
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    - name: websecure
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: le-production-tls
            kind: Secret

    # The listener the Cloudflare tunnel actually reaches. Port 8444 maps to
    # Traefik's `tunnel` entrypoint, which no internal-Gateway listener shares, so
    # routes bound there are exactly the routes attached to this Gateway -- see
    # the `tunnel` entrypoint in values.yaml for the incident this closes.
    #
    # Routes attached without a `sectionName` (all of them today) bind to every
    # listener here, so they are served on 8444 as well as 80/443 with no change
    # to the routes. The web/websecure listeners above are now reachable only from
    # inside the network, carry nothing the tunnel needs, and are slated for
    # removal once the tunnel is confirmed on 8444.
    - name: tunnel
      protocol: HTTPS
      port: 8444
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: le-production-tls
            kind: Secret
