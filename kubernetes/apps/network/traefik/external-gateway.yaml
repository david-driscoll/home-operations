---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  annotations:
    external-dns.kubernetes.io/target: &hostname "${EXTERNAL_DOMAIN}"
spec:
  gatewayClassName: traefik
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      io.cilium/lb-ipam-ips: "${EXTERNAL_IP}"
  # ONE listener, on purpose. This Gateway exists only to be reached by the
  # Cloudflare tunnel, and the tunnel dials 8444.
  #
  # Port 8444 maps to Traefik's `tunnel` entrypoint, which no internal-Gateway
  # listener shares, so the routes bound there are exactly the routes attached
  # to this Gateway -- see the `tunnel` entrypoint in values.yaml for the
  # incident this closes (postiz's login and signup were public).
  #
  # ⚠️ Do NOT add a listener on 80 or 443 here. Traefik maps listeners to
  # entrypoints by port alone, so a listener on 443 would land on `websecure`
  # beside every INTERNAL route, and anything published here would be served on
  # the internal door as well. That is not an exposure by itself, but it is the
  # sharing that made the original one possible, and it buys nothing: the
  # tunnel is the only client. The web/websecure listeners that used to be here
  # were removed once the tunnel was confirmed on 8444 (2026-09-15: GitHub ping
  # 200 through ^/hook/, and internal-only paths 404 on 8444 directly).
  listeners:
    - name: tunnel
      protocol: HTTPS
      port: 8444
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: le-production-tls
            kind: Secret
