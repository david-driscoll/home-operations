---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app error-pages
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        pod:
          # Tier 1: must survive a Battery window, when the workers are off and the
          # control planes carry §4's taint. app-template renders
          # controllers.<name>.pod.tolerations into the pod spec.
          # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
          # See docs/cluster-consolidation/20-low-power-tier.md §4.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        podDisruptionBudget:
          maxUnavailable: 1
        containers:
          *app :
            image:
              repository: ghcr.io/tarampampam/error-pages
              tag: "4.2@sha256:6d42b5d6e1a014fa2373e3587f9e85c25589a089fd5f6fc4f2a496858f5e365d"
            env:
              # TEMPLATE_NAME: "ghost"
              # disabled/random-on-startup/random-on-each-request/random-hourly/random-daily
              TEMPLATES_ROTATION_MODE: random-hourly
              SEND_SAME_HTTP_CODE: true
              SHOW_DETAILS: true
            probes:
              liveness:
                enabled: false
    defaultPodOptions:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
    service:
      main:
        ports:
          http:
            port: 8080
