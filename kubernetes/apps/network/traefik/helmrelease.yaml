---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app traefik
  namespace: network
  annotations:
    # See kube-system/cilium/helmrelease.yaml for why. Traefik's L2
    # announcement getting orphaned during a HelmRelease delete/recreate is
    # the mechanism behind the 2026-08-13 traefik L2-election incident too
    # (docs/cluster-consolidation/27-migration-churn-failure-modes.md) --
    # keeping the release object continuous removes that trigger.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  chart:
    spec:
      chart: traefik
      version: 41.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    crds: Skip
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: Skip
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
