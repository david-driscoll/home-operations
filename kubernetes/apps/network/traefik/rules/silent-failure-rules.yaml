---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# ============================================================================
# The gap this exists to close.
#
# On 2026-08-27 FreshRSS served HTTP 500s to the browser for hours while every
# signal the estate had said it was fine:
#
#   * the pod was 1/1 Ready with 0 restarts, because its liveness and readiness
#     probes only prove Apache and PHP are up -- no unauthenticated FreshRSS
#     endpoint opens a database connection, so no kubelet probe can ever see a
#     credential failure (see the note in that app's resources/config.php);
#   * KubePodNotReady and friends key off readiness, which was passing;
#   * the Gatus check asserts `[STATUS] == 401`, and that 401 is produced by the
#     Traefik `local-user` middleware chain AT THE EDGE -- the request never
#     reaches the pod, so Gatus stayed green throughout.
#
# The class is "app is Ready and answering, but answering wrong". Nothing that
# probes liveness, readiness, or an edge-terminated status code can see it. What
# CAN see it is the proxy actually carrying user traffic, which is why this rule
# lives with Traefik rather than with any one app: it covers every service
# behind the gateway automatically, including ones added later.
#
# ---------------------------------------------------------------------------
# Reading `traefik_service_requests_total` correctly.
#
# GROUP BY `exported_service`, NOT `service`. Traefik's own `service` label
# collides with the label the ServiceMonitor attaches, so Prometheus renames
# Traefik's to `exported_service` and `service` becomes the constant
# "traefik-metrics" for every series. Grouping by `service` therefore silently
# collapses the entire estate into one meaningless bucket -- it evaluates fine
# and tells you nothing, the same shape of bug as the dead longhorn rules in
# longhorn-system/longhorn/rules/pvc-usage-rules.yaml.
#
# `exported_service` values look like
#   httproute-<ns>-<app>-gw-network-internal-ep-websecure-0-<hash>-svc-<ns>-<app>-0@kubernetesgateway
# which is ugly but is the only per-app identity available on this metric.
#
# ---------------------------------------------------------------------------
# Threshold, and why it is this low.
#
# 0.005 req/s is about one 5xx every 200 seconds. That sounds absurdly
# sensitive until you look at what the incident actually produced: a single
# browser tab retrying every ~40s, which peaked at 0.027 req/s over a 15m
# window. A "reasonable-looking" threshold like 1 req/s would have sat silent
# through the entire outage. The point of this alert is not volume, it is
# PERSISTENCE -- a healthy service sits at exactly zero.
#
# `for: 30m` is what makes that safe. A rollout, a node drain or a brief
# upstream blip produces a burst that decays out of the 15m rate window well
# inside 30 minutes. Only a service that keeps failing survives to fire.
#
# Verified against live data before this was committed, rather than assumed:
#   * the FreshRSS outage window peaks at 0.0270 req/s -- comfortably over.
#
# ---------------------------------------------------------------------------
# CORRECTED 2026-09-21: key on what the CLIENT got, per route.
#
# The first version of this rule alerted on four services (jellyseerr,
# identifiarr, seerr, toolhive-ui) and called them "real, pre-existing 502s"
# that Gatus happened to report as 200. That was wrong. Gatus is the client,
# and it did get a 200. The 502s were never sent to anyone.
#
# The Traefik access log shows it on one line, from `User-Agent: Gatus/1.0`:
# `DownstreamStatus:200, OriginStatus:502`, with a truncated
# OriginContentSize (seerr /login: 20474 bytes of a 53827-byte page), while the
# backend's own log shows the whole page sent. identifiarr sent 405 KB.
#
# MECHANISM, read from Traefik v3.7.13 source rather than guessed:
#   1. Gatus asserts only `[STATUS] == 200`, so it closes the connection as
#      soon as it has the headers.
#   2. `experimental.fastProxy` is on (values.yaml). Traefik has already
#      written `200` and part of the body when the write to the gone client
#      fails. pkg/proxy/fast/proxy.go gets that error back from roundTrip and
#      calls proxyhttputil.ErrorHandler, which does `WriteHeader(502)`
#      after the headers have already gone out.
#   3. Every metrics layer records status through its own
#      capture.captureResponseWriter, and `WriteHeader` there overwrites the
#      recorded status unconditionally (pkg/middlewares/capture). The
#      SERVICE-level capture sits directly around the proxy, so it records
#      502. That is `traefik_service_requests_total{code="502"}`, and it is
#      also the access log's OriginStatus.
#   4. The late 502 does not get further up. Two writers between the service
#      and the client drop a WriteHeader that arrives after the headers were
#      sent: the `errors` middleware's codeCatcher (our `error-pages`, which
#      is in the `local-user` and `authenticated-user` chains) and the
#      per-entrypoint recovery wrapper (pkg/server/router/router.go). So the
#      ENTRYPOINT capture, the access log's DownstreamStatus, and the ROUTER
#      capture on an error-pages route all record 200.
#
# The rate is one per Gatus check, about 0.0167/s. On these apps that check is
# nearly all the traffic, so a 15m rate of it sits over 0.005 and stays there.
# The pages are large, so the body is still being copied when Gatus hangs up.
# That is why the affected set looked arbitrary. The alert "starts firing" around
# 13:00 UTC every day because that is when the nightly Low Power shed ends and
# these apps scale back up. The 15m window refills and `for: 30m` elapses.
#
# The 2026-09-16 fix blamed a keep-alive race, which does not match the log
# (RetryAttempts:0, truncated OriginContentSize). It added
# `and on() sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[15m])) >
# 0.005`. Entrypoint metrics have no service or router label, so that gate
# was estate-wide. Any real 5xx anywhere, such as jellyfin-pg's 500s or
# dawarich's 503s on 2026-09-21, held it open, and all four artifacts fired
# alongside it. This happened every day.
#
# ---------------------------------------------------------------------------
# What the rule keys on now.
#
# Both halves are per-route and are joined on the route:
#
#   BACKEND half  traefik_service_requests_total{code=~"5.."}
#                 The backend was reached and a 5xx was recorded on that hop.
#                 This half keeps the rule's original meaning: the pod is up
#                 and answering, and answering wrong. A service with no ready
#                 endpoints has no series here, because a load balancer with no
#                 servers never reaches a per-server metrics handler. So the
#                 nightly shed and not-yet-running apps do not count.
#                 Without this half, a per-route client-status rule fires every
#                 night: over 7d, ~25 routes each served 400-1700 client 503s,
#                 almost all to Gatus probing scaled-to-zero apps.
#
#   CLIENT half   traefik_router_requests_total{code=~"5.."}
#                 The status recorded at the router, above its middleware chain.
#                 Needs `metrics.prometheus.addRoutersLabels` (values.yaml, cost
#                 noted there). For error-pages routes this is what the client
#                 got. A backend 5xx that error-pages renders still reaches the
#                 router as the original 5xx.
#
# The join key is `route`. On gateway-API routes the router is named
# `<base>@kubernetesgateway` and its backend services are
# `<base>-svc-<ns>-<name>-<idx>@kubernetesgateway`
# (pkg/provider/kubernetes/gateway/httproute.go). So the backend half derives
# `route` by stripping the `-svc-...` tail, and the client half uses `router`.
# Ingress-provider routes (`@kubernetes`) point straight at their service with
# no WRR hop, so there both halves fall back to `exported_service`. `service`
# is `exported_service` on BOTH metric families for the reason given at the
# top of this file.
#
# KNOWN LIMITATION. On a route with NO `errors` middleware (for example
# `local-api`, or a route with no filters), nothing between the router and the
# service drops the late 502. The router records it too, so the aborted-body
# artifact can still get through there. Nine routes use `local-api`. None of
# them showed the artifact at a sustained rate in the 7d checked below. The
# exact fix would be Loki: key on DownstreamStatus per RouterName. But the
# error-pages hop overwrites ServiceName and OriginStatus in the access log.
# Loki then cannot tell "backend answered 5xx" from "no endpoints", and it
# would fire on the shed every night. The Loki ruler has no Prometheus data to
# join against.
#
# Checked 2026-09-21, emulating over 7d at 5m steps. The backend half came from
# Thanos. The client half came from Loki DownstreamStatus by RouterName, standing in
# for router metrics, which do not exist on equestria until this merges:
#   * OLD rule firing minutes: postiz-internal 3780, identifiarr 1445,
#     jellyseerr 1445, seerr 1445, jellyfin 205. All of them are artifacts.
#   * NEW rule firing minutes: 0 for every route.
#   * NEW expression, before `for:`, still matches real client-visible 5xx:
#     jellyfin-pg (500s, longest run 25m), jellyfin (20m), plex (15m), reitti
#     and coder. None lasted the 30m that `for:` requires.
#
# After merge, confirm the client half is populated and the key lines up:
#   count by (router, exported_service) (traefik_router_requests_total{router=~"httproute-equestria-seerr-.*"})
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traefik-silent-failure-rules
spec:
  groups:
    - name: traefik.silent-failure.rules
      rules:
        - alert: ServiceSustained5xx
          annotations:
            description: >-
              Traefik service {{$labels.exported_service}} has returned 5xx continuously for
              30 minutes ({{$value | printf "%.3f"}} req/s), and clients of its route
              {{$labels.route}} are receiving 5xx too. The backend pod is probably Ready and
              passing its probes -- this alert exists because that is not evidence the app
              works. Check the pod's own logs, not its probe status.
            summary: A service behind Traefik is persistently returning 5xx to its clients.
          # Two per-route halves joined `on (route)`. See the block comment
          # above. Left: the backend was reached and answered 5xx. Right: the
          # route's clients received 5xx. The inner label_replace sets
          # `route` = exported_service (the ingress-provider fallback), and the
          # outer one overrides it for gateway-API names. A regex that does not
          # match leaves the series as it was, so the order matters.
          #
          # Both halves use the same 0.005 floor, for the reason in the
          # "Threshold" section. error-pages is still excluded from the backend
          # half: it serves 5xx on purpose. When it renders a real backend
          # error, that error already appears on the backend's own service
          # series and on the route's router series.
          expr: |
            (
              sum by (exported_service, route) (
                label_replace(
                  label_replace(
                    rate(
                      traefik_service_requests_total{
                        code=~"5..",
                        exported_service!="",
                        exported_service!~".*error-pages.*"
                      }[15m]
                    ),
                    "route", "$1", "exported_service", "(.+)"
                  ),
                  "route", "$1@kubernetesgateway", "exported_service", "(.+?)-svc-.+@kubernetesgateway"
                )
              ) > 0.005
            )
            and on (route)
            (
              sum by (route) (
                label_replace(
                  label_replace(
                    rate(
                      traefik_router_requests_total{
                        code=~"5..",
                        exported_service!=""
                      }[15m]
                    ),
                    "route", "$1", "exported_service", "(.+)"
                  ),
                  "route", "$1", "router", "(.+@kubernetesgateway)"
                )
              ) > 0.005
            )
          for: 30m
          labels:
            issue: Traefik service {{$labels.exported_service}} is persistently serving 5xx to clients while its pod looks healthy.
            severity: warning
        # error-pages is excluded above rather than filtered here: it is the
        # service Traefik forwards to IN ORDER TO render an error, so it serves
        # 5xx by design and runs two orders of magnitude hotter than anything
        # real (0.645 req/s over the last 24h). Left in, it would fire forever
        # and train the alert to be ignored.
