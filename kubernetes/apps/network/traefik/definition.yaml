---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: traefik
spec:
  name: Traefik Dashboard
  category: ${CLUSTER_TITLE}
  description: Access to the Traefik dashboard
  url: &url https://internal.${CLUSTER_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/traefik.svg
  access_policy:
    groups:
      - admins
  # No `authentik:` block by design -- the dashboard is deliberately not behind a
  # proxy provider (see values.yaml's middleware comment). Leaving one here would
  # keep minting a forward_single provider that nothing routes through.
  gatus:
    - url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
    # Short names (docs/plans/short-names.md C6). A dotless Host must get the
    # short-name redirect, a 302; the `web` entrypoint's own redirect is a 301,
    # so a 301 here means short-names.yaml stopped matching (a priority change,
    # a Traefik upgrade). The probe name need not be an app: any dotless host
    # is redirected.
    - name: short-name redirect
      url: http://internal.${CLUSTER_DOMAIN}/
      method: GET
      headers:
        Host: gatus-short-name
      client:
        ignore-redirect: true
      conditions:
        - "[STATUS] == 302"
    # The same on the tailnet doors' entrypoint (C2b): a request without
    # X-Forwarded-Proto: https came in on :80, so it must be redirected too.
    - name: short-name redirect (tailnet)
      url: http://internal.${CLUSTER_DOMAIN}:8443/
      method: GET
      headers:
        Host: gatus-short-name
      client:
        ignore-redirect: true
      conditions:
        - "[STATUS] == 302"
