---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
#
# ONLY THE NETBIRD PRIVATE PROXY MAY CONNECT TO TRAEFIK'S NETBIRD DOOR (:8446).
#
# The `netbird` entrypoint trusts X-Forwarded-For from the pod CIDR (values.yaml
# ports.netbird.forwardedHeaders), because the proxy is a pod, and
# network/netbird-network admits whatever 10.100.0.0/16 address that header
# names. So any other pod that reached :8446 could claim to be a NetBird peer,
# and could send its own X-NetBird-User / X-NetBird-Groups, which the proxy
# deletes and re-stamps from the tunnel peer on everything it forwards. This
# policy is what keeps those two things true on this port.
#
# DENY-ONLY, as apps/network/funnel-gateway/ciliumnetworkpolicy.yaml is, and
# for its reason: `enableDefaultDeny: false` both ways, so selecting Traefik
# does not put it into default-deny, and the rules below match port 8446 alone.
# Every other port on Traefik stays exactly as open as before.
#
# WHO IS ALLOWED, by what the deny rules leave out: a pod in netbird-system
# labelled app.kubernetes.io/name=nbidp and app.kubernetes.io/controller=proxy,
# the proxy controller of apps/netbird-system/nbidp. One rule per condition,
# because NotIn also matches a pod WITHOUT the label. The namespace label is
# Cilium's own and cannot be forged by a pod, so a copy of the two app labels
# elsewhere gets nowhere; nbidp's Dex and the NetBird routing peers in the same
# namespace carry other labels and are denied.
#
# Verify after rollout: `hubble observe --to-port 8446 --verdict DROPPED` shows
# `Policy denied by denylist` for any other source, and the proxy's
# connections are FORWARDED.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-netbird-door
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-network
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: NotIn
              values:
                - netbird-system
      toPorts:
        - ports:
            - port: "8446"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
            - key: app.kubernetes.io/name
              operator: NotIn
              values:
                - nbidp
      toPorts:
        - ports:
            - port: "8446"
              protocol: TCP
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
            - key: app.kubernetes.io/controller
              operator: NotIn
              values:
                - proxy
      toPorts:
        - ports:
            - port: "8446"
              protocol: TCP
    - fromEntities:
        - world
        - host
        - remote-node
        - kube-apiserver
        - unmanaged
        - health
        - init
        - ingress
      toPorts:
        - ports:
            - port: "8446"
              protocol: TCP
