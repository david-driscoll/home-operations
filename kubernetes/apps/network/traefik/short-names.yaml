---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# SHORT NAMES: `http://jellyfin/` -> `https://jellyfin.<root domain>/`.
#
# Every network hands out the root domain as a DNS search domain (UniFi DHCP,
# Tailscale, NetBird), so a client completes a short name to the app route and
# reaches this Traefik with `Host: jellyfin` (GLOSSARY.md "Short name", ADR 0003,
# docs/plans/short-names.md). No certificate can cover a dotless name, and the
# `web` entrypoint's own redirect keeps the host it was given (-> https://jellyfin/,
# the default certificate and a 404). So a dotless host on :80 is sent to its
# full name here instead, and the app's own router takes it from there.
#
# 302, ON PURPOSE AND FOR GOOD. Browsers cache a 301 indefinitely, and a renamed
# app would leave every device that had used its short name with a stale one.
#
# The `$$` keeps Traefik's capture groups away from Flux's postBuild
# substitution; only ROOT_DOMAIN is substituted. `(?i)` because the URL keeps
# the host as the client sent it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: short-name-redirect
spec:
  redirectRegex:
    regex: "^(?i)https?://([a-z0-9-]+)(:[0-9]+)?(/.*)?$"
    replacement: "https://$${1}.${ROOT_DOMAIN}$${3}"
    permanent: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
#
# Dotless hosts on `web` only. Every other router on this entrypoint is
# untouched: they all carry a dot in their host.
#
# PRIORITY 2147482647 IS THE HIGHEST A USER ROUTER MAY HAVE (MaxInt32 - 1000;
# Traefik reserves the range above for its internal routers). The entrypoint
# redirect is one of those internal routers, at MaxInt-1 unless told otherwise,
# so values.yaml pins it one below this (ports.web.http.redirections.entryPoint
# .priority). Without that pin this route never matches.
#
# `localhost` is left out in case anything on a node calls Traefik by it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: short-names
  annotations:
    kubernetes.io/ingress.class: internal
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: HostRegexp(`^[a-zA-Z0-9-]+$`) && !Host(`localhost`)
      priority: 2147482647
      middlewares:
        - name: short-name-redirect
      services:
        - name: noop@internal
          kind: TraefikService
