---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# Client-supplied forwarding headers that nothing upstream removes, blanked on
# the Tailscale Funnel door. Referenced only by traefik/values.yaml
# `ports.funnel.http.middlewares`, after the CrowdSec bouncer.
#
# tailscaled's proxy lets Go strip and then SETS only X-Forwarded-For, -Host
# and -Proto (ipn/ipnlocal/serve.go:1068-1076 @v1.102.5); everything below
# passes through from the internet. Traefik keeps inbound X-Forwarded-* from a
# TRUSTED peer -- and the funnel entrypoint trusts the pod CIDR, which is where
# the proxy is (pkg/middlewares/forwardedheaders/forwarded_header.go:130-133)
# -- and only fills X-Real-Ip and X-Forwarded-Port when they are empty (:143-183).
# So without this a Funnel client chooses what the backend reads there.
#
# An empty value deletes the header. Never add X-Forwarded-For here: it is the
# real client address, and the bouncer and the access log depend on it.
# Underscore aliases (X_Forwarded_For and friends) are handled by the
# entrypoint's `aliasHeadersStrategy: delete`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: funnel-strip-headers
spec:
  headers:
    customRequestHeaders:
      X-Real-Ip: ""
      X-Forwarded-Port: ""
      X-Forwarded-Prefix: ""
      X-Forwarded-Uri: ""
      X-Forwarded-Method: ""
      X-Forwarded-Tls-Client-Cert: ""
      X-Forwarded-Tls-Client-Cert-Info: ""
      # Client-IP headers other proxies and CDNs set, which neither tailscaled
      # nor Traefik touches. CF-Connecting-IP above all: behind the Cloudflare
      # tunnel it was authoritative, so an app that trusts it would take a
      # Funnel client's word for its address.
      CF-Connecting-IP: ""
      True-Client-IP: ""
      X-Client-IP: ""
      X-Cluster-Client-IP: ""
      X-Original-Forwarded-For: ""
      Fastly-Client-IP: ""
