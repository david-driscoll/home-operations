---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# The NetBird door's gate: the request came off the NetBird overlay.
#
# Same shape as ./tailscale-network.yaml. Traffic reaches the `netbird`
# entrypoint from the private proxy's POD, so the remote address is a pod IP
# and the client's tunnel address is in X-Forwarded-For, which the proxy SETS
# to exactly one entry (v0.82.0 setUntrustedForwardingHeaders), so depth 1 is
# that entry. Needs ports.netbird.forwardedHeaders in ../values.yaml, or the
# header is dropped and this fails closed.
#
# 10.100.0.0/16 is the account's overlay (stacks/netbird NETWORK_RANGE).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: netbird-network
spec:
  ipAllowList:
    sourceRange:
      - 10.100.0.0/16
    ipStrategy:
      depth: 1
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# THE NETBIRD COUNTERPARTS OF THE TAILNET CHAINS, one per value an app's ks
# gives TAILSCALE_MIDDLEWARE. components/tailscale/netbird-ingressroute.yaml
# names `netbird-as-${TAILSCALE_MIDDLEWARE:=tailscale-local}`, so an app's
# NetBird route always takes the same gate as its tailnet route without a
# second variable to keep in step. Each is the tailnet chain with
# tailscale-network swapped for netbird-network.
#
# netbird-as-tailscale-local: no SSO hop (the app logs people in itself).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: netbird-as-tailscale-local
spec:
  chain:
    middlewares:
      - name: error-pages
        namespace: network
      - name: netbird-network
        namespace: network
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# netbird-as-tailscale-user: the authentik outpost hop, as on the tailnet.
# The outpost answers only for a hostname one of its proxy providers is
# registered against, so `<app>.app.<root domain>` needs its own provider
# twin (components/authentik.ts), exactly as the tailnet name does. Until it
# has one this answers 400 "no app for hostname": closed, not open.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: netbird-as-tailscale-user
spec:
  chain:
    middlewares:
      - name: error-pages
        namespace: network
      - name: outpost
        namespace: network
      - name: netbird-network
        namespace: network
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# netbird-as-tailscale-network: the bare network gate, for the apps whose
# tailnet route uses tailscale-network directly (no error pages).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: netbird-as-tailscale-network
spec:
  chain:
    middlewares:
      - name: netbird-network
        namespace: network
