---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# THE OVERLAY NAMES SEND PEOPLE TO THE APP ROUTE (docs/adr/0004).
#
# The routers for every app's tailnet route (`<label>.<tailnet>`) and NetBird
# app service (`<label>.nb.<root domain>`) start with this middleware
# (components/tailscale). The request goes to `https://<label>.<root domain>`,
# path and query kept, before any gate runs. The authentik outpost never sees an
# overlay name, which is why the hidden "(Tailnet)"/"(NetBird)" twin apps are
# gone. Both overlays already reach every app route (Technitium answers it;
# the Tailscale subnet routes and NetBird gateways carry it).
#
# The label is the first DNS label of the host, which is the app route's label
# for every live app except crowdsec-ui and meilisearch, which have no app route
# (checked against Technitium, 2026-11-06). The regex is domain-agnostic, so one
# middleware serves both overlays. There is no opt-out: nobody uses the overlay
# names directly.
#
# 302, not 301: a renamed app must not leave a cached redirect behind. Traefik
# answers a non-GET with 307, which keeps the method and body for API clients.
# The `$$` keeps the capture groups away from Flux's postBuild substitution.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: app-route-redirect
spec:
  redirectRegex:
    regex: "^https?://([a-zA-Z0-9-]+)\\.[^/]*(/.*)?$"
    replacement: "https://$${1}.${ROOT_DOMAIN}$${2}"
    permanent: false
