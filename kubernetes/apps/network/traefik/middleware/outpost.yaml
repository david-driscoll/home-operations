---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: outpost
spec:
  forwardAuth:
    # stargate-command, not ${CLUSTER_CNAME}: the outpost moved out of the
    # nightly-shed `equestria` namespace (stacks/applications/kubernetes.ts,
    # OUTPOST_NAMESPACE), where go-kube-downscaler scaled it to 0 06:00-13:00 UTC
    # and every forwardAuth route timed out with it.
    address: http://authentik-outpost.stargate-command:9000/outpost.goauthentik.io/auth/traefik
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      - Remote-User
    authResponseHeadersRegex: ''
    trustForwardHeader: true
