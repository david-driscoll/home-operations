---
# The project moved from ori-edge to the k8s-gateway org. The old Helm repo
# (ori-edge.github.io) stopped at chart 2.4.0, whose default image
# quay.io/oriedge/k8s_gateway:v0.4.0 no longer pulls anonymously (401), so any
# pod rescheduled onto a node without it cached sat in ImagePullBackOff.
# This chart defaults to ghcr.io/k8s-gateway/k8s_gateway.
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.4.1
    digest: sha256:2dbb60de1f0bb24363a1abe3d59f83db0a6ce23b66776675f8a024fa4bbb7cb9
  url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    # Tier 1: must survive a Battery window, when the workers are off and the
    # control planes carry §4's taint. Verified this is the key the chart reads.
    # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
    # See docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    fullnameOverride: k8s-gateway
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "kubernetes.io/hostname"
        whenUnsatisfiable: "DoNotSchedule"
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: k8s-gateway
    domain: "${ROOT_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "${K8S_GATEWAY_IP}"
        io.cilium/lb-ipam-ips: "${K8S_GATEWAY_IP}"
      externalTrafficPolicy: Cluster
    watchedResources: ["Ingress", "Service", "HTTPRoute", "TLSRoute", "GRPCRoute", "DNSEndpoint"]
