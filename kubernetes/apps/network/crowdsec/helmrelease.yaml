---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.24.2
    digest: sha256:9078b83a6ba27a9a258cbdb4d8aefba6992a833041ba07317133fd61c5e6b446
  url: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: network
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  # ConfigMap, not Secret. values.yaml carries no secret material at all now --
  # the LAPI pulls every credential from the `crowdsec-secrets` Secret through
  # secretKeyRef env vars. That is what lets values.yaml be consumed raw, with
  # nothing rendering it as a Go template on the way here. See
  # externalsecret.yaml for the outage this replaced.
  valuesFrom:
    - kind: ConfigMap
      name: ${APP}-values
      valuesKey: values.yaml
  # Inline rather than in values.yaml on purpose. The chart hard-fails template
  # rendering when neither `acquisition` nor `additionalAcquisition` is set
  # (agent-daemonSet.yaml), and flate resolves NO valuesFrom reference at all --
  # not Secrets and not ConfigMaps, verified by rendering longhorn and traefik
  # through it and getting chart defaults back. Keeping this one key inline is
  # what lets `flate test` render this release instead of erroring. spec.values
  # deep-merges over valuesFrom, so the rest of `agent:` still comes from
  # values.yaml.
  #
  # Corollary, and the reason #2977 and #2980 both shipped broken: a green
  # `flate test` says nothing about whether this release's real values are
  # sound. It never sees them. `scripts/eso-values-lint` is the check that does.
  values:
    agent:
      acquisition:
        - namespace: network
          podName: traefik-*
          program: traefik
          # POLL, DO NOT WATCH. Without this the agents go silently blind on
          # every Traefik rollout and stay that way until someone restarts them.
          #
          # The chart renders this entry to a filenames glob under
          # /var/log/containers/ and sets `force_inotify: true` unconditionally
          # (acquis-configmap.yaml), leaving `poll_without_inotify` to default
          # false. But every path under /var/log/containers/ is a SYMLINK to the
          # pod's real log, and inotify watches the resolved inode: when Traefik
          # rolls, the symlink is repointed at a new file and the watch stays on
          # the dead pod's inode. CrowdSec says so itself, once per file, at
          # startup:
          #
          #   File /var/log/containers/traefik-*_network_traefik-*.log is a
          #   symlink, but inotify polling is enabled. Crowdsec will not be able
          #   to detect rotation. Consider setting poll_without_inotify to true
          #   in your configuration
          #
          # Measured cost of ignoring that advice, 2026-09-16: Traefik pods were
          # 5.1h old, the agents 77h, and `rate(cs_filesource_hits_total[30m])`
          # was 0 across the fleet -- the WAF/IPS had parsed nothing since the
          # previous Traefik rollout while every pod reported Ready and every
          # LAPI heartbeat returned 200. `cs_filesource_hits_total` was not
          # zero, it was FROZEN (24k-76k, unchanged over 6h and 24h), which is
          # why CrowdsecAcquisitionStalled (../crowdsec/prometheusrule.yaml) is
          # written against the rate rather than the value.
          #
          # Polling costs a stat() per file per interval, against four files.
          poll_without_inotify: true
  # ---- console-enrolment guard -------------------------------------------
  # Makes `cscli console enroll` unable to kill the LAPI.
  #
  # WHY A POSTRENDERER AND NOT A CHART VALUE: there is no chart value for this,
  # verified rather than assumed against chart 0.24.0 itself. The entrypoint is
  # embedded with `.Files.Get "files/docker-start-custom.sh"` into a fixed
  # ConfigMap name (templates/docker-start-configmap.yaml), the `command` below
  # is a hardcoded string in templates/lapi-deployment.yaml with no value hook,
  # and neither values.yaml nor values.schema.json exposes any enrol-related
  # toggle. 0.24.0 is also the newest published chart, and the call is still
  # unguarded on the chart's main branch, so there is no upgrade to wait for.
  # The only remaining lever is the command line, hence this.
  #
  # WHAT IT DOES: rewrites the one `cscli console enroll` line of the entrypoint
  # to append `|| echo ...` before running it, so a rejected key logs and the
  # script continues to bouncer registration instead of aborting under `set -e`.
  # The rewrite is a copy to /tmp; the ConfigMap mount stays read-only.
  #
  # FAILS OPEN: if a future chart changes that line so the pattern stops
  # matching, sed passes the script through untouched and behaviour is exactly
  # what it is today -- the guard can stop protecting, it cannot itself break
  # startup. Grep for CROWDSEC_CONSOLE_ENROLL_FAILED_NONFATAL in the LAPI log to
  # see the guard actually catch something.
  #
  # COUPLING TO WATCH: the `cp`/`ln` half of this command is copied verbatim
  # from templates/lapi-deployment.yaml (emitted only when
  # lapi.persistentVolume.config.enabled is true, which it is). The chart is
  # pinned by digest above, so a bump is a deliberate act -- re-diff this
  # command against the chart's own when you take one.
  #
  # Deliberately no dollar signs anywhere in the command: this file is subject
  # to Flux postBuild envsubst, and a bare or braced name would be eaten.
  # ---- re-registration guard ----------------------------------------------
  # Makes a node reboot unable to wedge an agent or the AppSec pod.
  #
  # THE TRAP (values.yaml, "KNOWN TRAP", above `appsec:`): the chart's
  # `wait-for-lapi-and-register` init container registers a machine named
  # after the pod and keeps the credentials in an emptyDir. A node that reboots
  # without a drain keeps the pod -- same name -- but not the emptyDir, so the
  # init container runs again, the LAPI answers 403 "user already exist", and
  # it crash-loops until someone deletes the pod. Seen on pegasus 2026-09-12,
  # then on fluttershy (546 restarts) and kerfuffle (179) after the 10-17..19
  # reboots: CrowdsecAgentsMissing, two nodes' logs unparsed for ~2 days.
  #
  # WHAT IT DOES: the chart's own command, except that a failed registration
  # retries ONCE under `<pod>-<epoch>`. A name nobody has used always
  # registers. Any failure takes that path, not just the 403; the cost of
  # taking it needlessly is one spare machine row. Each re-registration leaves
  # the old row behind, and `agents_autodelete` (values.yaml, `db_config`)
  # ages those out. Grep CROWDSEC_REREGISTER in the init logs to see it fire.
  #
  # COUPLING TO WATCH: the command is copied from chart 0.24.2
  # templates/agent-daemonSet.yaml and appsec-deployment.yaml (identical in
  # both, and unchanged on the chart's main branch). Re-diff it on a chart bump,
  # like the LAPI command above. The dollar signs are doubled because this
  # file goes through Flux postBuild envsubst; `$$` comes out as one `$`.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-lapi
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crowdsec-lapi
              spec:
                template:
                  spec:
                    containers:
                      - name: crowdsec-lapi
                        command:
                          - sh
                          - -c
                          - >-
                            cp -nR /staging/etc/crowdsec/* /etc/crowdsec_data/
                            && ln -s /etc/crowdsec_data /etc/crowdsec
                            && sed 's#^\( *\)cscli console enroll \(.*\)#\1cscli console enroll \2 || echo CROWDSEC_CONSOLE_ENROLL_FAILED_NONFATAL#' /docker_start.sh > /tmp/docker_start.sh
                            && bash /tmp/docker_start.sh
          - target:
              kind: DaemonSet
              name: crowdsec-agent
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: crowdsec-agent
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-lapi-and-register
                        command:
                          - sh
                          - -c
                          - >-
                            until nc "$${LAPI_HOST}" "$${LAPI_PORT}" -z; do echo waiting for lapi to start; sleep 5; done;
                            ln -s /staging/etc/crowdsec /etc/crowdsec
                            && { cscli lapi register --machine "$${USERNAME}" -u "$${LAPI_URL}" --token "$${REGISTRATION_TOKEN}"
                            || { M="$${USERNAME}-$$(date +%s)"; echo "CROWDSEC_REREGISTER: $${USERNAME} is taken (pod outlived its credentials), registering as $${M}";
                            cscli lapi register --machine "$${M}" -u "$${LAPI_URL}" --token "$${REGISTRATION_TOKEN}"; }; }
                            && cp /etc/crowdsec/local_api_credentials.yaml /tmp_config/local_api_credentials.yaml
          - target:
              kind: Deployment
              name: crowdsec-appsec
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crowdsec-appsec
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-lapi-and-register
                        command:
                          - sh
                          - -c
                          - >-
                            until nc "$${LAPI_HOST}" "$${LAPI_PORT}" -z; do echo waiting for lapi to start; sleep 5; done;
                            ln -s /staging/etc/crowdsec /etc/crowdsec
                            && { cscli lapi register --machine "$${USERNAME}" -u "$${LAPI_URL}" --token "$${REGISTRATION_TOKEN}"
                            || { M="$${USERNAME}-$$(date +%s)"; echo "CROWDSEC_REREGISTER: $${USERNAME} is taken (pod outlived its credentials), registering as $${M}";
                            cscli lapi register --machine "$${M}" -u "$${LAPI_URL}" --token "$${REGISTRATION_TOKEN}"; }; }
                            && cp /etc/crowdsec/local_api_credentials.yaml /tmp_config/local_api_credentials.yaml
