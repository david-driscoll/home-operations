---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The netbird-edge hosts' CrowdSec identities: one bouncer key and one machine
# password per host, generated and written by stacks/netbird-edge
# (components/netbird/crowdsec.ts CROWDSEC_EDGE_BAO_PATH). The keys already ARE
# the env var names the LAPI reads (lapi.envFrom in values.yaml):
#
#   BOUNCER_KEY_<name>            the chart entrypoint registers bouncer <name>
#   EDGE_MACHINE_PASSWORD_<name>  ./edge-register.sh registers machine <name>
#
# with <name> the host's tailnet name, dashes as underscores
# (crowdsecLapiName). A host added to that stack needs no change here.
#
# A Secret of its own, not another dataFrom entry on ${APP}-secrets, so it can
# be absent: before stacks/netbird-edge has written the path this ExternalSecret
# errors, the Secret does not exist, and the LAPI starts without it (the
# envFrom is optional). One missing extract in ${APP}-secrets would instead
# stop the database credentials refreshing. Reloader restarts the LAPI when it
# changes, which is what registers a new host.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-netbird-edge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshInterval: 1h
  target:
    name: ${APP}-netbird-edge
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: clusters/equestria/apps/crowdsec/netbird-edge
