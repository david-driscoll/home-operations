---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# ============================================================================
# What is and is not already covered.
#
# The chart's `lapi.metrics.serviceMonitor` and `agent.metrics.serviceMonitor`
# have been on for a while and they genuinely work -- verified live rather than
# assumed: 8 targets `up`, one LAPI plus one agent per node, scraped on
# :6060. The crowdsec docker image ships `prometheus.listen_addr: 0.0.0.0`
# (NOT the upstream source default of 127.0.0.1), which is the only reason the
# chart's Service port is reachable at all.
#
# So metrics arrive. Nothing looked at them. Every alert below exists because
# the corresponding failure is INVISIBLE to the probes and to Gatus: the LAPI's
# readiness probe proves the HTTP server answers, not that Traefik's bouncer is
# still fetching decisions from it, and crowdsec-ui's Gatus check hits
# `/api/health`, which upstream deliberately keeps independent of the LAPI.
#
# The class is the same one traefik/rules/silent-failure-rules.yaml was written
# for -- everything Ready, nothing working -- and it matters more here than for
# a normal app, because when CrowdSec stops enforcing, the estate does not go
# down. It just quietly stops being defended.
#
# ---------------------------------------------------------------------------
# Metrics deliberately NOT alerted on. All three would be permanently red.
#
#   cs_machines_last_heartbeat_timestamp
#     The obvious "an agent stopped checking in" signal, and a trap. Machine
#     names are POD names, and the LAPI never prunes a machine that goes away,
#     so the live series today include four ghost agents and a ghost LAPI from
#     earlier rollouts, all sitting at 9,400+ seconds of heartbeat age and
#     climbing forever. Any threshold on this fires immediately and never
#     clears. Agent liveness is covered by CrowdsecAgentsMissing below, which
#     counts scrape targets against the DaemonSet's own desired count. The
#     AppSec pod registers the same way (one machine per pod name), so every
#     crowdsec-appsec rollout leaves one more; CrowdsecAppsecAbsent covers it.
#
#   cs_papi_last_pull_timestamp
#     Flat 0 on every pod, because console enrolment is deliberately OFF
#     (Option B -- see the long note in values.yaml under `lapi.env`). PAPI is
#     the hosted-console polling API and is not the community blocklist; CAPI
#     is, and it is unaffected. Alerting on this would be alerting on a
#     decision we made on purpose.
#
#   cs_active_decisions{origin="crowdsec"}
#     Local decisions. There have never been any -- see the note on
#     CrowdsecTraefikLogsUnparsed. `absent()` on it would fire forever until
#     that is fixed AND something actually attacks the estate, which is not a
#     signal, it is a wish.
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ${APP}-rules
spec:
  groups:
    - name: crowdsec.rules
      rules:
        # ---- the LAPI itself -------------------------------------------
        - alert: CrowdsecLapiAbsent
          annotations:
            description: >-
              The CrowdSec LAPI has disappeared from Prometheus target discovery.
              It is the only decision source Traefik's bouncer has, so while it is
              gone nothing is enforced -- and because the bouncer fails open, every
              service behind the gateway keeps answering normally. There is no
              user-visible symptom to notice.
            summary: CrowdSec LAPI is down.
          expr: |
            absent(up{job="crowdsec-service"} == 1)
          for: 15m
          labels:
            severity: critical

        # ---- the agents ------------------------------------------------
        #
        # Compared against the DaemonSet's OWN desired count rather than a
        # hardcoded 7, so adding or draining a node does not turn this red.
        # `or vector(0)` is load-bearing: with every agent gone, `count()` over
        # an empty selector returns NO series, the comparison yields nothing,
        # and a total outage would be the one case that never alerts.
        #
        # The `max()` is not cosmetic either. Binary arithmetic between two
        # instant vectors only produces output where the label sets MATCH, and
        # kube_daemonset_status_desired_number_scheduled arrives carrying
        # kube-state-metrics' full label set (instance, pod, service, endpoint,
        # ...) while `count(...)`/`vector(0)` are label-less. Subtracting them
        # directly matches nothing and evaluates to empty forever -- it looks
        # correct, passes every render, and can never fire. `max()` with no `by`
        # collapses the left side to a label-less series so the two sides meet.
        - alert: CrowdsecAgentsMissing
          annotations:
            description: >-
              {{ $value }} CrowdSec agent(s) short of the DaemonSet's desired count.
              An agent is a DaemonSet because it tails logs from the node it runs on,
              so a node without one is a blind spot -- traffic through Traefik pods
              there is never inspected, and nothing else reports the gap.
            summary: Not every node is running a CrowdSec agent.
          expr: |
            max(kube_daemonset_status_desired_number_scheduled{namespace="network", daemonset="crowdsec-agent"})
              - (count(up{job="crowdsec-agent-service"} == 1) or vector(0))
              > 0
          for: 30m
          labels:
            severity: warning

        # ---- enforcement actually reaching Traefik ---------------------
        #
        # THE alert on this page. Traefik's bouncer polls
        # GET /v1/decisions/stream every 30s (live: 0.0333 req/s, dead steady).
        # If the API key is rotated without re-registering the bouncer -- the
        # exact failure the ROTATION CAVEAT in values.yaml warns about -- or the
        # plugin stops calling, the LAPI stays perfectly healthy, its probes stay
        # green, and enforcement is simply over. This is the only signal that
        # sees it.
        #
        # `sum()` across all bouncer instances on purpose: the `bouncer` label is
        # `traefik@<pod-ip>`, so it churns on every Traefik rollout and a
        # per-series rule would flap. Zero over a 15m window is unambiguous
        # against a 30-second poll.
        #
        # `or vector(0)` and the `count(up ...)` gate are both load-bearing, and
        # for opposite reasons. A bouncer that has NEVER polled produces no
        # `route="/v1/decisions/stream"` series at all -- `sum()` over an empty
        # selector returns no result, `== 0` then matches nothing, and the worst
        # case would be the one that stays silent. `vector(0)` supplies the zero.
        # The gate then stops this firing merely because the LAPI is down, which
        # CrowdsecLapiAbsent already owns. `count()` with no `by` returns a
        # label-less series, which is what lets it `and` against `vector(0)`.
        #
        # cs_lapi_BOUNCER_requests_total, not cs_lapi_route_requests_total. The
        # route counter is recorded by a router-wide middleware BEFORE the
        # API-key check (crowdsec v1.8.1 pkg/apiserver/controllers/controller.go:100),
        # so a bouncer polling with a rotated key -- 401/403 on every poll -- kept
        # it non-zero and this alert silent: the exact case it exists for. The
        # bouncer counter is recorded only after APIKey.Middleware
        # (controller.go:144). It matters more now that the Funnel door enforces
        # (traefik/middleware/crowdsec-funnel.yaml).
        #
        # method="GET", because AppSec shares the route. The Funnel door's WAF
        # validates the same `traefik` key with HEAD /v1/decisions/stream,
        # which the LAPI routes to the same handler and counts in this metric
        # as method="HEAD" (controller.go:148-149, v1/metrics.go:47-57).
        # Summed across methods, AppSec's key checks would keep this non-zero
        # while Traefik's stream poll -- the thing that actually delivers bans
        # -- was dead. HEAD creates no bouncer row and moves no last_pull
        # (middlewares/v1/api_key.go:149-164).
        - alert: CrowdsecBouncerNotPolling
          annotations:
            description: >-
              No bouncer has fetched the decision stream from the LAPI for 15 minutes.
              Traefik's CrowdSec middleware fails open, so bans have stopped being
              enforced while every service keeps serving normally. Check that the
              `traefik` bouncer is still registered -- `cscli bouncers list` -- because
              a rotated apikey_bouncer does NOT re-register itself.
            summary: Traefik's CrowdSec bouncer has stopped fetching decisions.
          expr: |
            (sum(rate(cs_lapi_bouncer_requests_total{route="/v1/decisions/stream", method="GET"}[15m])) or vector(0)) == 0
              and
            count(up{job="crowdsec-service"} == 1) > 0
          for: 15m
          labels:
            severity: critical

        # ---- the Funnel door blocking someone --------------------------
        #
        # The Funnel door is the first place the bouncer ENFORCES
        # (traefik/middleware/crowdsec-funnel.yaml), and a block there is
        # silent: the client gets a 403, nothing else notices. The likely
        # victims are legitimate fetchers -- GitHub is exempt, but Meta's and
        # TikTok's media crawlers (plan step 5) are not.
        #
        # Not noisy by construction: tailscaled 404s everything outside a
        # device's mount, so only requests to allow-listed paths reach Traefik
        # at all; scans of / never show up here. To see who was blocked:
        #   {namespace="network", container="traefik"} | json
        #     | entryPointName="funnel" | DownstreamStatus="403"
        # then `cscli alerts list --ip <ClientHost>` on the LAPI. FOUR causes,
        # and that one command tells three of them apart:
        #   - an IP-reputation ban: a decision (`cscli decisions list --ip`);
        #   - an AppSec (WAF) rule match: an alert "WAF block: <rule> from
        #     <ip>" with no decision -- and cs_appsec_block_total moved;
        #   - AppSec answering 401 or 404, which the plugin blocks whatever
        #     its fail-open flags say (bouncer.go:810-812 @v1.7.1): EVERY
        #     untrusted request 403s, no alert at all, and the crowdsec-appsec
        #     log says "Unauthorized request". A 401 means AppSec cannot vouch
        #     for the bouncer key: rotated, the LAPI answering non-200, or a
        #     freshly started AppSec that has not cached the key yet while the
        #     LAPI is down (crowdsec/values.yaml, auth_cache_duration);
        #   - the backend itself.
        # A deliberate one: plan §F step 2's `/hook/.env` probe fires this.
        # The door's throttles answer 429, not 403, and are not counted here
        # (traefik/middleware/funnel-throttle.yaml).
        - alert: FunnelDoorBlocked
          annotations:
            description: >-
              {{ $value | humanize }} requests on Traefik's funnel entrypoint got a 403 in
              the last 30 minutes, on a public Tailscale Funnel endpoint. Take the
              ClientHost from Traefik's access log and run `cscli alerts list --ip` on
              the LAPI: a ban decision means IP reputation; "WAF block: <rule>" means
              CrowdSec AppSec matched the request; nothing, with every untrusted request
              failing, means AppSec is answering 401 (the bouncer key is unknown to the
              LAPI, the LAPI's database is failing, or AppSec restarted and has not cached
              the key while the LAPI is down) -- see the crowdsec-appsec log.
              Otherwise the backend refused it. Kill switches in
              traefik/middleware/crowdsec-funnel.yaml: `crowdsecAppsecEnabled` for the
              WAF alone, `enabled` for the whole bouncer.
            summary: The Tailscale Funnel door is returning 403s.
          # Two halves, because increase() never counts a series' FIRST sample:
          # Traefik creates the (pod, method, protocol, code) series at value 1
          # on its first 403 and restarts it with every pod, so on a quiet door
          # a single block would otherwise be invisible (checked live: the
          # tailscale entrypoint's 403 series sat at 1 for days with increase()
          # 0). The `unless ... offset` half catches a series that did not exist
          # 30 minutes ago.
          expr: |
            (sum(increase(traefik_entrypoint_requests_total{entrypoint="funnel", code="403"}[30m])) > 0)
              or
            (count(
              traefik_entrypoint_requests_total{entrypoint="funnel", code="403"}
                unless
              traefik_entrypoint_requests_total{entrypoint="funnel", code="403"} offset 30m
            ) > 0)
          labels:
            severity: warning

        # ---- AppSec, the Funnel door's WAF -----------------------------
        #
        # The door's bouncer FAILS OPEN on AppSec: unreachable, slower than
        # httpTimeoutSeconds, or answering 5xx, and the request passes
        # uninspected (crowdsecAppsecUnreachableBlock/FailureBlock false in
        # traefik/middleware/crowdsec-funnel.yaml). So a dead AppSec has no
        # symptom at all: the door keeps serving, it just stops being a WAF.
        # IP-reputation enforcement is unaffected, which is why this is a
        # warning where CrowdsecLapiAbsent is critical.
        #
        # The job comes from the chart's appsec ServiceMonitor, off by default
        # and switched on in values.yaml. This sees the POD only. An AppSec that
        # is up but unreachable from Traefik (wrong host, Service, DNS) shows as
        # `appsecQuery:unreachable` in Traefik's log instead, and
        # ./loki-rules.yaml alerts on that.
        - alert: CrowdsecAppsecAbsent
          annotations:
            description: >-
              CrowdSec AppSec, the WAF behind the Tailscale Funnel door, has been missing
              from Prometheus for 15 minutes. The door's bouncer fails open on AppSec, so
              Funnel requests are reaching their backends without WAF inspection;
              IP-reputation blocking still works. Check
              `kubectl -n network get deploy crowdsec-appsec` and its
              wait-for-lapi-and-register init container, which waits on the LAPI. Stuck
              in Init:CrashLoopBackOff after a node reboot means its registration hit the
              machine it registered last time (not idempotent): delete the pod.
            summary: CrowdSec AppSec (the Funnel door's WAF) is down.
          expr: |
            absent(up{job="crowdsec-appsec-service"} == 1)
          for: 15m
          labels:
            severity: warning

        # The case neither CrowdsecAppsecAbsent (pod) nor ./loki-rules.yaml's
        # FunnelAppsecUnreachable (Traefik cannot reach it) can see: AppSec is
        # up and reachable, and Traefik simply never asks it. A door middleware
        # dropped from the entrypoint chain, `crowdsecAppsecEnabled` flipped
        # off and forgotten, or a trusted-IP list grown wide enough to cover
        # the public -- the door keeps serving, uninspected, and nothing is red.
        #
        # Only meaningful because of plan step 3's Gatus probe
        # (stacks/vault/KubernetesFluxWebhooks.ts): alpha-site fetches
        # flux-<cluster>-webhook's /hook/ through the public Funnel path every
        # 5 minutes, from an address that is NOT in the bouncer's
        # clientTrustedIPs, so a working door asks AppSec ~12 times an hour.
        # Tailnet and GitHub traffic are trusted and never reach AppSec, so
        # without the probe a zero here would be normal.
        #
        # Gated on the door carrying traffic at all, so a dead Funnel proxy or
        # a red probe -- which the probe's own Gatus alert owns -- does not
        # page twice. GitHub's pushes also pass that gate, so this can still
        # fire when ONLY the probe has stopped (alpha-site down): check Gatus
        # first.
        - alert: FunnelAppsecNotAsked
          annotations:
            description: >-
              Traefik's funnel entrypoint served requests in the last hour, but CrowdSec
              AppSec received none. The alpha-site Gatus probe of the webhook's /hook/
              is an untrusted client, so a working door asks AppSec about 12 times an
              hour. Check that the probe is green first; if it is, the WAF is being
              skipped: confirm `crowdsecAppsecEnabled: true` on
              network-crowdsec-bouncer-funnel and that the funnel entrypoint's
              middlewares still end in that bouncer (Traefik /api/entrypoints).
            summary: The Tailscale Funnel door is not asking its WAF.
          expr: |
            (sum(increase(cs_appsec_reqs_total[1h])) or vector(0)) == 0
              and
            sum(increase(traefik_entrypoint_requests_total{entrypoint="funnel"}[1h])) > 0
              and
            count(up{job="crowdsec-appsec-service"} == 1) > 0
          for: 30m
          labels:
            severity: warning

        # ---- the community blocklist -----------------------------------
        #
        # CAPI decisions are, today, the ONLY decisions this estate has (5,155
        # live, entirely origin="CAPI"). They carry a TTL, so if the CAPI pull
        # breaks the population does not freeze -- it drains. That decay is what
        # makes a static floor a usable signal: normal operation sits three
        # orders of magnitude above 100, and only a pull that has been broken for
        # hours gets anywhere near it.
        #
        # Scoped to origin="CAPI" so that local decisions, once they start
        # existing, cannot mask a dead community pull by padding the total.
        - alert: CrowdsecCapiBlocklistDraining
          annotations:
            description: >-
              Only {{ $value }} CAPI decisions remain, down from a normal several
              thousand. The community blocklist is currently the estate's entire
              source of bans, so this draining means the LAPI has stopped pulling
              from CAPI and existing bans are ageing out.
            summary: CrowdSec community blocklist is draining.
          expr: |
            (sum(cs_active_decisions{origin="CAPI"}) or vector(0)) < 100
              and
            count(up{job="crowdsec-service"} == 1) > 0
          for: 1h
          labels:
            severity: warning

        # ---- log acquisition -------------------------------------------
        #
        # Agent up, reading nothing. Distinct from CrowdsecAgentsMissing: this
        # fires when the pods are healthy and scraped but the file source has
        # gone silent -- a Traefik rollout that leaves the glob matching nothing,
        # a /var/log/containers mount that stops resolving. Live baseline is
        # ~30 lines/s; a true zero over 30m never happens while Traefik serves.
        #
        # `cs_filesource_hits_total` is labelled per source FILE, so a glob that
        # matches nothing produces no series rather than a zero -- hence
        # `or vector(0)`, for the same reason as CrowdsecBouncerNotPolling. The
        # agent-count gate keeps this from duplicating CrowdsecAgentsMissing.
        #
        # THE DESCRIPTION USED TO NAME THE WRONG CAUSE. It asserted the glob was
        # "probably matching nothing", and when this fired for real on
        # 2026-09-16 that was false in both halves: the glob matched four files
        # and their counters were non-zero (24k-76k). They were FROZEN, not
        # absent -- the agents held inotify watches on the inodes of Traefik
        # pods replaced hours earlier, because /var/log/containers entries are
        # symlinks and inotify follows the resolved inode. A responder trusting
        # the old text would have gone looking for a broken glob. The real fix
        # was `poll_without_inotify: true` (../crowdsec/helmrelease.yaml); a
        # frozen counter is what this rule actually catches, which is why the
        # expression is a rate and not a value.
        - alert: CrowdsecAcquisitionStalled
          annotations:
            description: >-
              CrowdSec agents are running and being scraped but have read zero log
              lines for 30 minutes. Most likely the file source is watching dead
              inodes after a Traefik rollout (check for "is a symlink, but inotify
              polling is enabled" in the agent logs, and that
              `poll_without_inotify` is still set); a glob
              (/var/log/containers/traefik-*_network_*.log) matching nothing does
              the same thing. Detection is off even though every pod is Ready.
            summary: CrowdSec has stopped reading Traefik logs.
          expr: |
            (sum(rate(cs_filesource_hits_total[30m])) or vector(0)) == 0
              and
            count(up{job="crowdsec-agent-service"} == 1) > 0
          for: 30m
          labels:
            severity: warning

        # ---- log PARSING, which is not the same thing -------------------
        #
        # This one was written because it was firing. Before the `accessLog`
        # block was added to traefik/values.yaml, Traefik emitted no access logs
        # at all, so the 30 lines/s above were Traefik's own coloured
        # deprecation warnings. They unwrap cleanly from the CRI envelope --
        # `crowdsecurity/cri-logs` succeeded on 100% of them -- and then die,
        # because `crowdsecurity/traefik-logs` filters on an access-log shape
        # that was not there. Live proof: `cs_node_hits_ok_total` had exactly two
        # node names, both cri-logs, and `cs_parser_hits_ok_total` had no series
        # at all while `cs_parser_hits_ko_total` ran at 100% of the line rate.
        #
        # Net effect for as long as that lasted: crowdsecurity/traefik,
        # base-http-scenarios and http-cve could never fire, no bucket ever
        # overflowed, and every one of the estate's bans came from CAPI. The
        # agents looked completely healthy throughout -- lines in, CPU spent,
        # metrics flowing.
        #
        # `for: 2h` rather than 30m: a real drought in access logs is possible
        # overnight on a homelab, and a Traefik rollout has to be able to
        # complete without tripping this.
        - alert: CrowdsecTraefikLogsUnparsed
          annotations:
            description: >-
              CrowdSec is reading Traefik logs but has not successfully parsed one as
              an access log in two hours. Every HTTP scenario (base-http-scenarios,
              http-cve, traefik) is inert while this is true, leaving only the CAPI
              community blocklist. Check that traefik's `accessLog` is still enabled
              and still emitting JSON.
            summary: CrowdSec is reading Traefik logs but parsing none of them.
          expr: |
            sum(rate(cs_filesource_hits_total[1h])) > 0
              and
            (sum(rate(cs_node_hits_ok_total{name="crowdsecurity/traefik-logs"}[1h])) or vector(0)) == 0
          for: 2h
          labels:
            severity: warning
