---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec
  namespace: &namespace network
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  # D5: previously absent. The LAPI keeps all of its state in the shared CNPG
  # cluster and its Helm values Secret is rendered by external-secrets, so both
  # have to be up before this can succeed.
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/network/crowdsec
  # D4 (superseded twice): this entry was once dropped on the grounds that
  # ../../../components/postgres was `resources: []` and only re-stamped labels
  # commonMetadata already applies. It was restored because the generator
  # discovered databases by scanning ks.yaml for exactly this reference, and
  # without it `task update` regenerated crowdsec's role, Database CR and
  # password Secret away (1056ef2) while its ExternalSecret went on extracting
  # `${APP}-postgres`.
  #
  # The generator is gone, but the entry is more load-bearing than ever: the
  # component now RENDERS the DatabaseRole, Database and credential
  # ExternalSecret directly. Dropping it stops crowdsec's database being
  # declared at all.
  components:
    - ../../../components/postgres
  prune: true
  # D5: wait: true so crowdsec-ui can dependsOn this and get a real readiness
  # signal instead of "the HelmRelease object exists".
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
