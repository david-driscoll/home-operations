---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  chart:
    spec:
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: onepassword-connect
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
  values:
    # Tier 1: must survive a Battery window, when the workers are off and the
    # control planes carry §4's taint. Verified this is the key the chart reads.
    # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
    # See docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    fullnameOverride: *app
    logLevel: debug
    interval: 10m
    triggerLoopOnEvent: true
    policy: sync
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-default-domain
            key: credential
    extraArgs:
      - --cloudflare-dns-records-per-page=5000
      # ---- SPLIT HORIZON: PUBLIC DNS PUBLISHES THE *EXTERNAL* GATEWAY ONLY --
      #
      # The counterpart of `--gateway-name=internal` on ../technitium and
      # ../unifi; read the long note in ../technitium for why one hostname on
      # two gateways is otherwise an unresolvable CNAME conflict, and which app
      # needs the split.
      #
      # SCOPE: gateway-* sources ONLY — `traefik-proxy`, `ingress`, `service`
      # and `crd` still publish here exactly as before.
      #
      # WHAT THIS DROPS, AND WHY IT IS SAFE: every internal-gateway hostname
      # loses its public record. Those records resolved to ${INTERNAL_DOMAIN},
      # an RFC1918 address, so nothing reachable is lost — and nothing depended
      # on them for access:
      #
      #   tailnet devices  stacks/unifi-network/acl-manager.ts sets
      #                    `overrideLocalDns: true` with the Technitium nodes as
      #                    nameservers, so they never consult public DNS for
      #                    this zone at all.
      #   LAN devices      resolve through UniFi, which keeps the internal
      #                    gateway (../unifi).
      #
      # Reverting this line restores the old records on the next sync.
      - --gateway-name=external
    sources:
      - "traefik-proxy"
      - "crd"
      - "ingress"
      - "service"
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
    txtPrefix: "${CLUSTER_CNAME}."
    txtOwnerId: "${CLUSTER_CNAME}"
    domainFilters: ["${ROOT_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      reloader.stakater.com/auto: "true"
