---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: unifi-dns
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.23.0
    digest: sha256:c7b8f2a30597547cde3008f2a1e3b5647a4ac0ea2dd3add0fffe2b84e0429aac
  url: oci://ghcr.io/home-operations/charts-mirror/external-dns
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-dns
spec:
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: onepassword-connect
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
  values:
    # Tier 1: must survive a Battery window, when the workers are off and the
    # control planes carry §4's taint. Verified this is the key the chart reads.
    # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
    # See docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # ---- AT MOST ONE WRITER: NEVER EVICTED OFF A SICK NODE -----------------
      #
      # No tolerationSeconds, on purpose: this pod is never evicted for its
      # node going NotReady or unreachable. The default is 300s, and after
      # that the taint-eviction controller marks the pod for deletion, which
      # is all the ReplicaSet waits for before it starts a replacement. But
      # a NotReady node is not a dead one. Its containers can keep running
      # and keep reaching the gateway, so for as long as the node is sick
      # there are TWO external-dns loops with the same owner ID writing to
      # one UniFi. external-dns has no leader election (the upstream proposal
      # is "not-planned", and v0.23.0 has no such flag). `Recreate` does not
      # help either: it only applies to rollouts, not to ReplicaSet
      # replacement.
      #
      # That happened on 2026-10-19. kerfuffle's containerd degraded and the
      # node went NotReady at 01:06:08. At 01:11:12 76mz4 was marked for
      # deletion and r6cgk started on pegasus, while 76mz4 kept running on
      # kerfuffle until about 01:43. Both loops planned the same creates. At
      # 01:15:10 UniFi's uniqueness check lost the race and stored
      # `listenarr` twice. A duplicate static-DNS name breaks the gateway's
      # dnsmasq config, so every gateway config commit failed for the next
      # 12 hours, until the duplicate was deleted by hand.
      #
      # The cost is that if the node really dies, UniFi DNS updates stop
      # until it comes back or someone runs `kubectl delete pod --force`.
      # Records already published keep resolving, and
      # KubeDeploymentReplicasMismatch fires after 15m. That trade is
      # deliberate: a stalled sync is visible and harmless, and a duplicate
      # record breaks the gateway silently. Planned moves are unaffected,
      # because the Battery runbook (§6.1 step 3 of 20-low-power-tier.md)
      # `rollout restart`s this Deployment off the workers before powering
      # them down, rather than relying on eviction.
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
    fullnameOverride: *app
    logLevel: debug
    interval: 10m
    triggerLoopOnEvent: true
    policy: sync
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.9.0@sha256:22f4106f44a0b9ac3c97cf29bbfef93026c1164492152dc797a1d6dc86ddfbb5
        env:
          - name: UNIFI_HOST
            value: "https://${DISCORD_DOMAIN}"
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: unifi-dns-secret
                key: credential
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    extraArgs:
      # ---- WHY THIS PROVIDER FILTERS BY REGEX AND THE OTHERS DO NOT --------
      #
      # UniFi's static-DNS API cannot store a wildcard record. It answers
      # `400 Invalid Hostname`, and not one of the 235 live entries is a
      # wildcard. That would be a small problem except that external-dns
      # applies a batch atomically: the webhook fails the WHOLE ApplyChanges
      # call on the first rejected record and returns 500, so a single
      # unstorable name stops every other write to this provider.
      #
      # That is not hypothetical. `*.code.${ROOT_DOMAIN}` (the coder-apps
      # HTTPRoute, for per-workspace app subdomains) appeared at
      # 2026-08-08T18:25:09Z and unifi-dns wrote NOTHING for the next two days
      # — silently, because the failure looks like ordinary provider flakiness
      # in the logs and nothing alerts on it.
      #
      # So the exclusion is stated as a property of the PROVIDER, not as a
      # named exception for Coder: any name containing an asterisk is
      # unstorable here, today and for whatever adds a wildcard route next.
      # Cloudflare and Technitium both accept the record and keep it, so
      # resolution is unaffected — only UniFi's copy omits it.
      #
      # `--regex-domain-filter` OVERRIDES `domainFilters`, which is why that
      # value is gone from below rather than left in place looking load-bearing
      # (external-dns/endpoint/domain_filter.go: Match() takes the regex path
      # whenever either regex is set, and ignores Filters entirely).
      #
      # Anchors are `\A`/`\z`, not `^`/`$`: MatchString is unanchored so the
      # anchors are required, and avoiding `$` keeps a regex metacharacter out
      # of reach of Flux's postBuild envsubst. Single-quoted so YAML leaves the
      # backslashes alone. The `.` inside ${ROOT_DOMAIN} expands unescaped and
      # so matches any character — harmless here, and worth less than
      # hardcoding the domain against the repo's convention.
      - '--regex-domain-filter=(\A|\.)${ROOT_DOMAIN}\z'
      - '--regex-domain-exclusion=\*'
      # ---- SPLIT HORIZON: THIS RESOLVER PUBLISHES THE *INTERNAL* GATEWAY ----
      #
      # Same flag and same reason as ../technitium, whose header carries the
      # full explanation: this is the LAN resolver, so it is one of the two
      # that must keep the internal gateway while ../cloudflare takes the
      # external one. Unrelated to the regex filters above — those scope the
      # NAMES this provider will accept, this scopes which Gateway's routes are
      # considered at all.
      #
      # SCOPE: gateway-* sources ONLY; the tailnet Ingress and the traefik-proxy
      # source are unaffected.
      - --gateway-name=internal
    sources:
      - "traefik-proxy"
      - "crd"
      - "ingress"
      - "service"
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
    txtPrefix: "${CLUSTER_CNAME}."
    txtOwnerId: "${CLUSTER_CNAME}"
    # domainFilters is deliberately absent — --regex-domain-filter in extraArgs
    # above replaces it and would silently override it if both were set. The
    # regex covers the same ${ROOT_DOMAIN} scope. (${TAILSCALE_DOMAIN} was
    # commented out here and remains excluded; add it as an alternation in the
    # regex if it is ever wanted.)
    serviceMonitor:
      enabled: true
    podAnnotations:
      # `/auto`, not `/reload`: there is no bare `reloader.stakater.com/reload`
      # annotation -- only the `configmap.`/`secret.`-prefixed forms, which take
      # a resource NAME rather than "true". This read as enabled and was inert.
      # Matches ../cloudflare and ../technitium, which had it right all along.
      reloader.stakater.com/auto: "true"
