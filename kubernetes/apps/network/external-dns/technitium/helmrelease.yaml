---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium-dns
  namespace: &namespace network
spec:
  chart:
    spec:
      chart: external-dns
      version: 1.21.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: onepassword-connect
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
  values:
    # Tier 1: must survive a Battery window, when the workers are off and the
    # control planes carry §4's taint. Verified this is the key the chart reads.
    # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
    # See docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    fullnameOverride: *app
    logLevel: debug
    interval: 10m
    triggerLoopOnEvent: true
    policy: sync
    provider:
      name: rfc2136
    extraArgs:
      # RFC2136 dynamic updates go to the Technitium cluster primary (dns-celestia),
      # via the tailscale-system egress Service generated by
      # kubernetes/apps/tailscale-system/services/Update.cs from tag:dns devices.
      - --rfc2136-host=dns-celestia.tailscale-system.svc.cluster.local
      - --rfc2136-port=53
      - --rfc2136-zone=${ROOT_DOMAIN}
      - --rfc2136-tsig-secret-alg=hmac-sha256
      # external-dns reads zone state via AXFR, which must also be TSIG-signed
      - --rfc2136-tsig-axfr
      # ---- SPLIT HORIZON: THIS RESOLVER PUBLISHES THE *INTERNAL* GATEWAY ----
      #
      # Scopes the gateway-httproute source to the `internal` Gateway only.
      # Paired with `--gateway-name=external` on ../cloudflare, which is what
      # makes it possible for ONE hostname to resolve to the internal gateway
      # in here and to the tunnel in public DNS.
      #
      # Without this the two cannot coexist. All three external-dns instances
      # run `policy: sync` over the same sources with no gateway or annotation
      # filter, so a hostname routed on BOTH gateways yields two desired
      # endpoints for one name with different CNAME targets (`internal` is
      # annotated ${INTERNAL_DOMAIN}, `external` is ${EXTERNAL_DOMAIN}) — and a
      # CNAME cannot hold both. postiz needs exactly that split: the app on the
      # internal gateway, and /uploads/ published publicly so TikTok and Meta
      # can fetch media. See apps/equestria/home/postiz/helmrelease.yaml.
      #
      # SCOPE: gateway-* sources ONLY. `traefik-proxy`, `ingress`, `service`
      # and `crd` are untouched, so the tailnet Ingress that components/
      # tailscale emits (kind: Ingress) still resolves here as before.
      #
      # WHAT THIS DROPS: external-gateway hostnames stop resolving on the
      # internal resolvers. Today that is only `flux-${CLUSTER_CNAME}-webhook`,
      # which is called from the internet and never from inside. Technitium is
      # authoritative for the zone, so such a name is NXDOMAIN internally
      # rather than falling through to public DNS.
      - --gateway-name=internal
    env:
      # TSIG key name + shared secret from the "Technitium TSIG Key" 1Password
      # item (username = key name, credential = shared secret). The key is
      # registered in Technitium under Settings → TSIG, and the driscoll.tech
      # zone allows updates + zone transfer for it.
      - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
        valueFrom:
          secretKeyRef:
            name: technitium-tsig-key
            key: username
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: technitium-tsig-key
            key: credential
    sources:
      - "traefik-proxy"
      - "crd"
      - "ingress"
      - "service"
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
    txtPrefix: "${CLUSTER_CNAME}."
    txtOwnerId: "${CLUSTER_CNAME}"
    domainFilters: ["${ROOT_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      reloader.stakater.com/auto: "true"
