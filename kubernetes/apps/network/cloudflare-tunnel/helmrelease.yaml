---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudflare
  namespace: network
spec:
  interval: 1h
  url: https://cloudflare.github.io/helm-charts
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-tunnel
  namespace: &namespace network
spec:
  chart:
    spec:
      chart: cloudflare-tunnel-remote
      version: 0.1.2
      sourceRef:
        kind: HelmRepository
        name: cloudflare
        namespace: *namespace
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: cloudflare-dns
      namespace: network
  valuesFrom:
    - kind: Secret
      name: cloudflare-tunnel
      valuesKey: credential
      targetPath: cloudflare.tunnel_token
  # Tier 1: must survive a Battery window, when the workers are off and the control
  # planes carry §4's taint (§8 Stage 2 found this among the 51 untolerated Tier-0/1
  # workloads).
  #
  # This has to be a postRenderer, NOT a chart value. cloudflare-tunnel-remote 0.1.2
  # documents `tolerations: []` in values.yaml but its templates/deployment.yaml has
  # no tolerations, nodeSelector or affinity block at all -- the key is inert.
  # Verified twice: rendering with `--set tolerations[0].key=SENTINEL` yields zero
  # occurrences, and the unpacked chart's only workload template has no such field.
  # Setting the value would have looked correct in review and done nothing.
  # See docs/cluster-consolidation/20-low-power-tier.md §4.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: cloudflare-tunnel-cloudflare-tunnel-remote
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cloudflare-tunnel-cloudflare-tunnel-remote
              spec:
                template:
                  spec:
                    tolerations:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
                        effect: NoSchedule
