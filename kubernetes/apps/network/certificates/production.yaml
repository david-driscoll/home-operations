---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
#
# TWIN of staging.yaml -- the `dnsNames` lists must stay identical. Adding a SAN
# here without adding it there means the name is never rehearsed against Let's
# Encrypt's staging endpoint before it is issued for real. Adding a SAN is a
# TWO-FILE change.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "le-production"
spec:
  secretName: "le-production-tls"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reloader.stakater.com/auto: "true"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "${ROOT_DOMAIN}"
  dnsNames:
    - "${ROOT_DOMAIN}"
    - "*.${ROOT_DOMAIN}"
    - "*.${CLUSTER_DOMAIN}"
    - "*.${CLUSTER_CNAME}.svc.${ROOT_DOMAIN}"
    # - "*.s3.${CLUSTER_DOMAIN}"
    # - "*.web.${CLUSTER_DOMAIN}"
    - "*.${INTERNAL_DOMAIN}"
    - "*.${EXTERNAL_DOMAIN}"
    # Coder per-workspace app subdomains (code.${ROOT_DOMAIN} itself is already
    # covered by the *.${ROOT_DOMAIN} wildcard above).
    - "*.code.${ROOT_DOMAIN}"
    # Forgejo's object store, s3.git.${ROOT_DOMAIN}. Same reason as the Coder
    # entry above: a wildcard matches exactly ONE label, so *.${ROOT_DOMAIN}
    # covers git.${ROOT_DOMAIN} but not anything under it.
    #
    # A SAN here rather than a Certificate in the `coder` namespace. The
    # `internal` Gateway lives in `network` and resolves `certificateRefs`
    # against its OWN namespace, so a cert next to the app would need both a
    # second certificateRefs entry on the listener and a ReferenceGrant in
    # `coder` -- two extra moving parts, an edit to the shared Traefik values
    # either way, and no isolation won: a public DNS name on a public CA is not
    # something the app namespace needs to hold.
    - "*.git.${ROOT_DOMAIN}"
    # The `agents` namespace publishes names under one label -- currently just
    # the MCP catalogue API (mcp.agents; toolhive.agents, the Cloud UI, was
    # retired 2026-08-29) -- and a wildcard matches exactly ONE label, so
    # `*.${ROOT_DOMAIN}` does not reach them. Same reason `*.code.` and
    # `*.git.` are listed above.
    #
    # A wildcard rather than two explicit SANs because this namespace is
    # expected to grow more MCP surfaces, and each one would otherwise be
    # another two-file certificate change plus an ACME re-issue.
    - "*.agents.${ROOT_DOMAIN}"
