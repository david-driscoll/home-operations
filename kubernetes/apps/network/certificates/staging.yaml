---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/cert-manager.io/certificate_v1.json
#
# TWIN of production.yaml -- the `dnsNames` lists must stay identical. Staging
# exists to rehearse issuance against Let's Encrypt's staging endpoint, so a
# name present on only one of them is a name whose issuance was never
# rehearsed, and the first time anyone finds out is a rate-limited failure
# against the real endpoint. Adding a SAN is a TWO-FILE change.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "le-staging"
spec:
  secretName: "le-staging-tls"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reloader.stakater.com/auto: "true"
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: "${ROOT_DOMAIN}"
  dnsNames:
    - "${ROOT_DOMAIN}"
    - "*.${ROOT_DOMAIN}"
    - "*.${CLUSTER_DOMAIN}"
    - "*.${CLUSTER_CNAME}.svc.${ROOT_DOMAIN}"
    # - "*.s3.${CLUSTER_DOMAIN}"
    # - "*.web.${CLUSTER_DOMAIN}"
    - "*.${INTERNAL_DOMAIN}"
    - "*.${EXTERNAL_DOMAIN}"
    # Coder per-workspace app subdomains (code.${ROOT_DOMAIN} itself is already
    # covered by the *.${ROOT_DOMAIN} wildcard above).
    - "*.code.${ROOT_DOMAIN}"
    # Forgejo's object store, s3.git.${ROOT_DOMAIN}. Same one-label wildcard
    # rule as the Coder entry above; the reasoning for putting it here rather
    # than in a per-namespace Certificate is on the production twin.
    - "*.git.${ROOT_DOMAIN}"
    # The `agents` namespace publishes two names under one label -- the MCP
    # catalogue API (mcp.agents) and the ToolHive UI (toolhive.agents) -- and a
    # wildcard matches exactly ONE label, so `*.${ROOT_DOMAIN}` does not reach
    # them. Same reason `*.code.` and `*.git.` are listed above.
    #
    # A wildcard rather than two explicit SANs because this namespace is
    # expected to grow more MCP surfaces, and each one would otherwise be
    # another two-file certificate change plus an ACME re-issue.
    - "*.agents.${ROOT_DOMAIN}"
