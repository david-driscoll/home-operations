---
localpv-provisioner:
  localpv:
    basePath: &basePath /var/mnt/extra/openebs/local
    # The provisioner is a Deployment, but the hostpath volumes it hands out
    # are node-local: if it cannot run on a control plane it cannot provision
    # openebs-hostpath PVCs for pods there. Key is
    # `localpv-provisioner.localpv.tolerations`, default [].
    #
    # Every other engine in this chart (zfs, lvm, mayastor, rawfile) is
    # disabled below, so this is the only openebs-system workload that needs
    # one.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  hostpathClass:
    enabled: true
    name: openebs-hostpath
    # NOT default. `longhorn` is the sole default StorageClass on this cluster.
    #
    # Both classes used to carry storageclass.kubernetes.io/is-default-class=true.
    # With two defaults the API server picks the most recently created one, so
    # which class an unqualified PVC binds to depended on cluster history and
    # could flip silently on any recreate (Helm upgrade, Flux prune-and-reapply,
    # cluster rebuild). openebs-hostpath is node-local: no replication, no
    # Longhorn snapshots, no VolSync coverage -- and the PVC still binds and the
    # pod still starts, so nothing surfaces the difference until a node is lost.
    #
    # Setting this false makes the chart omit the annotation entirely; Helm's
    # three-way merge removes it from the live StorageClass. The class itself
    # stays available for anything that asks for it by name.
    # See david-driscoll/vault#113.
    isDefaultClass: false
    basePath: *basePath
openebs-crds:
  csi:
    volumeSnapshots:
      enabled: true
      keep: true
zfs-localpv:
  enabled: false
lvm-localpv:
  enabled: false
mayastor:
  enabled: false
  csi:
    node:
      kubeletDir: /var/mnt/longhorn
  localpv-provisioner:
    enabled: false
  crds:
    enabled: false
engines:
  local:
    lvm:
      enabled: false
    zfs:
      enabled: false
  replicated:
    mayastor:
      enabled: false
loki:
  enabled: false
alloy:
  enabled: false
minio:
  enabled: false

# Fix for pre-upgrade hook image pull issues
preUpgradeHook:
  image:
    registry: docker.io
    repo: bitnami/kubectl
    tag: "1.25.15"
    pullPolicy: IfNotPresent
