---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app taildrive
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 15m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        # The PVC is RWO and Longhorn-backed, so two replicas could never both
        # mount it -- and two tailscaled processes sharing one state dir would
        # fight over the node key regardless. Recreate, not RollingUpdate.
        strategy: Recreate
        initContainers:
          # fsGroup alone is not enough. It sets GROUP ownership and adds group
          # write, but never changes the uid -- so the state dir stays owned by
          # root, and tailscaled's `chmod` on it fails with EPERM for nobody.
          # The failure is quiet and badly downstream-shifted: tailscaled falls
          # back to an in-memory store, never logs in, never receives a netmap,
          # and the drive share PUT then 403s with "taildrive sharing not
          # enabled ... add drive:share to nodeAttrs" -- which reads exactly
          # like an ACL problem and is not one.
          #
          # Same shape as tsidp's fix-permissions init container. Only the state
          # dir is walked: /shared is already setgid + group-writable from
          # fsGroup, which is all the file server needs, and -R over a 100Gi
          # share would be a real cost on every restart.
          fix-permissions:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -c
              - |
                chown -R 65534:65534 /var/lib/tailscale
                chown 65534:65534 /shared
            securityContext:
              # Must be explicit: the pod sets runAsNonRoot: true, and the
              # kubelet rejects a container that inherits it while asking for
              # uid 0.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - CHOWN
                  - FOWNER
        containers:
          app:
            image:
              repository: tailscale/tailscale
              tag: v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
            # NOTE: no `command:`/`args:` override. The image's entrypoint is
            # containerboot, and containerboot is what actually starts
            # tailscaled and runs `tailscale up`. Overriding the entrypoint with
            # `/bin/sh -c 'tailscale up ...'` -- the previous shape of this file
            # -- left no daemon for the CLI to talk to.
            env:
              TS_HOSTNAME: *app
              TS_STATE_DIR: &state /var/lib/tailscale
              # containerboot stores state in a kube Secret when it detects
              # Kubernetes; we keep it on the volsync PVC instead so the node
              # identity AND the Taildrive share list (both live in tailscaled
              # prefs) survive a restart and are covered by the nightly backup.
              TS_KUBE_SECRET: ""
              # Taildrive is served out of tailscaled's own peerapi, so there is
              # nothing here that needs a TUN device, NET_ADMIN, or a privileged
              # container. Userspace keeps this pod unprivileged.
              TS_USERSPACE: "true"
              TS_AUTH_ONCE: "true"
              TS_ACCEPT_DNS: "false"
              TS_ENABLE_HEALTH_CHECK: "true"
              # Load-bearing. Every drive grant in stacks/unifi-network/acl-manager.ts
              # targets tag:shared-drive, and the `drive:share` + `drive:access`
              # nodeAttrs are granted only to tag:shared-drive and autogroup:admin.
              # A node registered under the shared tag:apps authkey has no
              # Taildrive capability at all and `drive share` fails silently.
              TS_EXTRA_ARGS: --advertise-tags=tag:shared-drive
              # OAuth rather than the shared `tailscale-authkey` Secret: that
              # Secret is hand-applied, untracked by Flux, and pre-tagged
              # tag:apps, so it cannot register this node under tag:shared-drive.
              # tag:operator owns tag:shared-drive (acl-manager.ts setTagOwner),
              # so the operator's OAuth client can mint the key, and OAuth
              # clients do not expire the way a 90-day authkey does.
              TS_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-oauth
                    key: username
              TS_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-oauth
                    key: credential
            # containerboot has no env var for Taildrive -- `drive share` is a
            # LocalAPI call, so it has to be made against a running tailscaled.
            # postStart runs concurrently with the entrypoint and the container
            # is not marked Running until it returns, so retrying the real
            # command until it succeeds is both the wait and the assertion.
            # It is idempotent: re-running it on every restart just re-asserts
            # a share that is already in prefs.
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      n=0
                      until tailscale drive share shared /shared; do
                        n=$((n + 1))
                        if [ "$n" -ge 60 ]; then
                          echo "taildrive: tailscaled never came up; giving up after 2m" >&2
                          exit 1
                        fi
                        sleep 2
                      done
                      tailscale drive list
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &health 9002
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              # postStart already gates Running on tailscaled being reachable.
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        # 65534/nobody, and both halves of that are load-bearing.
        #
        # NON-ROOT, because Taildrive refuses to serve as root. tailscaled runs
        # the file server as the share's owning UNIX account (Share.As), and
        # drive/driveimpl/remote_impl.go tries sudo, then su, then falls back to
        # running it in-process behind assertNotRoot() -- which hard-fails on
        # uid 0. This pod has no sudo in the image and no CAP_SETUID/CAP_SETGID
        # to su with, so the fallback is the only reachable branch and it must
        # not be root. Running as nobody puts us on that branch cleanly
        # ("starting taildrive file server as ourselves") with no capabilities.
        #
        # 65534 SPECIFICALLY, because assertNotRoot() calls user.Current(),
        # which resolves uid -> name out of /etc/passwd. The estate's usual 568
        # has no passwd entry in this image, so it would not fail open -- it
        # would fail differently, with "failed to find current user". nobody is
        # the only non-system account the image actually defines.
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # Makes the volume group-owned by 65534 so tailscaled can write its
        # state dir and clients can write the share. VOLSYNC_PUID/PGID in
        # ks.yaml match, so the restic mover reads what this pod writes.
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      # ClusterIP only, for the containerboot health endpoint. Taildrive itself
      # is reached over the tailnet at 100.100.100.100:8080 by each peer, never
      # through a cluster Service -- which is why this app has no tailscale
      # Ingress component.
      app:
        controller: app
        type: ClusterIP
        ports:
          health:
            port: *health

    persistence:
      # containerboot puts the real socket at /tmp/tailscaled.sock and symlinks
      # it to /run/tailscale/tailscaled.sock so the CLI finds it on its default
      # path. /run in this image is root-owned 0755, so as nobody we cannot
      # create that directory -- and without it the postStart hook's `tailscale`
      # invocation has no socket to talk to. An emptyDir supplies a writable one.
      run-tailscale:
        type: emptyDir
        globalMounts:
          - path: /run/tailscale
      data:
        existingClaim: *app
        globalMounts:
          # Both subPaths are load-bearing. Mounting the volume root at /shared
          # would put the tailscale state dir -- node key, machine key -- inside
          # the directory served over WebDAV to every peer with a drive grant.
          - path: /shared
            subPath: shared
          - path: *state
            subPath: .tailscale-state
