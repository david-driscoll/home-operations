---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tsidp
  namespace: &namespace tailscale-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: tailscale-operator
      namespace: tailscale-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/tailscale-system/idp
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/failover/fast-node-eviction
    - ../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
      # Tier-1 (piece 12 Group A): OIDC signing keys must survive low-power
      # mode — losing this PVC mints new keys and breaks every relying party.
      # Piece 12 landed 2026-08-19 (PR #960); migrated from the component's
      # `longhorn` default the same day via the piece-13 choreography.
      VOLSYNC_STORAGECLASS: longhorn-critical
      # Tier-1 scratch volumes stay on the control planes so backup and
      # restore still work with the workers powered down (D6). 1 replica
      # each; see storageclass/critical.yaml for why.
      VOLSYNC_STAGING_STORAGECLASS: longhorn-critical-snapshot
      VOLSYNC_CACHE_SNAPSHOTCLASS: longhorn-critical-cache
