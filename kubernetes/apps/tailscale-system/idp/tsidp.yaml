# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tsidp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn: []
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1 # cutover complete 2026-08-15 (runbook 14 step 4)
        pod:
          # Tier 1: must survive a Battery window, when the workers are off and the
          # control planes carry §4's taint. app-template renders
          # controllers.<name>.pod.tolerations into the pod spec.
          # Added after §8 Stage 2 found this among the 51 untolerated Tier-0/1 workloads.
          # NOTE: the nodeAffinity below still excludes `othalla` -- David confirmed
          # 2026-08-23 that exclusion stays, so this widens placement to two of the
          # three control planes, not all three. §9 item 7.
          # See docs/cluster-consolidation/20-low-power-tier.md §4.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values:
                          - othalla
        initContainers:
          fix-permissions:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -c
              - |
                chown -R 1000:1000 /data
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - CHOWN
                  - FOWNER

        containers:
          *app :
            nameOverride: *app
            image:
              repository: ghcr.io/tailscale/tsidp
              tag: v0.0.15@sha256:cae91835375efcbf75ecb8f9520e3472cda946e3ca9af1df3bce9540902f289e
            env:
              TS_HOSTNAME: &idp idp
              TS_STATE_DIR: /data
              TSIDP_HOSTNAME: *idp
              TSIDP_STATE_DIR: /data
              TAILSCALE_USE_WIP_CODE: "1"
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-authkey
                    key: authkey
              TSIDP_ENABLE_STS: "1"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000

    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: true

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
