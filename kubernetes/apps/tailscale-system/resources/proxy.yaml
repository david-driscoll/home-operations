---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: default
spec:
  statefulSet:
    annotations:
      reloader.stakater.com/auto: "true"
  metrics:
    enable: true
    serviceMonitor:
      enable: true
  # tailscale:
  #   acceptRoutes: true
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: control-plane-tolerant
spec:
  # A ProxyGroup exposes no pod-spec fields of its own; `spec.proxyClass` is the
  # only way to reach the generated StatefulSet's pod template. This class does
  # exactly one thing -- it does not carry `default`'s reloader annotation or
  # metrics, so attaching it to a ProxyGroup changes placement and nothing else.
  #
  # For Tier-1 proxies that must stay reachable once
  # allowSchedulingOnControlPlanes goes false. A toleration only widens where a
  # pod MAY schedule; it does not pin anything to the control planes.
  # See docs/cluster-consolidation/20-low-power-tier.md §4.
  statefulSet:
    pod:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
