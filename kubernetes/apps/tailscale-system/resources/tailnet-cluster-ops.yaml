---
# ClusterRole for devices impersonated as tailnet-cluster-ops (cluster connector tags via kubeproxy auth mode).
# Mirrors definition-crds permissions with additional notification.toolkit.fluxcd.io read access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailnet-cluster-ops
rules:
  - apiGroups: ["driscoll.dev"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autokuma.bigboot.dev"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # stacks/applications' garageBucketBackups lists GarageBuckets at CLUSTER
  # scope to find the ones annotated for backup. Without this the list returns
  # 403, and `kubernetes-backups.ts` rethrows anything that is not a 404 on
  # purpose -- a blanket catch there would turn an auth failure into "no Garage
  # buckets found" and leave every opted-in bucket quietly unprotected. So the
  # 403 aborts the whole applications stack, which also stops it writing the
  # OIDC credentials every app's ExternalSecret reads.
  #
  # `resources: ["*"]` rather than just `garagebuckets`, matching the three
  # groups above: the stack already reads GarageBucket and will read whatever
  # the operator grows next, and read-only on one operator's own API group is
  # not a boundary worth re-editing.
  - apiGroups: ["garage.rajsingh.info"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
  # stacks/unifi-network/tailnet-egress.ts creates and owns the per-device
  # egress Services in tailscale-system (dns-*, dockge-*, proxmox-*, pbs-*,
  # the garage-s3 VIP) plus a blackbox Probe and a PrometheusRule alongside
  # each one -- a ONE-TIME CUTOVER (see that file's header) from these being
  # hand-written Flux YAML, which never needed Pulumi write access to any of
  # the three kinds. Without this, `services is forbidden` fails Service
  # creation outright; Probe/PrometheusRule are children of the Service in
  # that module's resource graph, so they never even get attempted.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["probes", "prometheusrules"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailnet-cluster-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tailnet-cluster-ops
subjects:
  - kind: Group
    name: tailnet-cluster-ops
    apiGroup: rbac.authorization.k8s.io
