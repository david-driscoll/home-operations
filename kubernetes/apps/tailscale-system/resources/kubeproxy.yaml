---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: &name "${CLUSTER_CNAME}-kubeproxy"
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  type: kube-apiserver
  kubeAPIServer:
    mode: auth
  # Tier 1 -- this is how the tailnet reaches the Kubernetes API, so it has to be
  # placeable on a control plane during a low-power window. See ./proxy.yaml.
  proxyClass: control-plane-tolerant
  tags:
    - "tag:k8s"
    - "tag:${CLUSTER_CNAME}"
