---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
#
# PINS THE `proxies` SERVICEACCOUNT TO ITS OWN STATE SECRET. Every standalone
# tailscale proxy -- Services such as mosquitto, the Connector, PeerRelays, and
# now the internet-facing Funnel proxies (kubernetes/components/funnel) -- runs
# as system:serviceaccount:tailscale-system:proxies. The operator chart grants
# that account create/update/delete on EVERY Secret in tailscale-system
# (proxy-rbac.yaml, no resourceNames), where sops-age, cluster-secrets and
# shared-secrets -- the decryption key and substitution source of every
# tailscale-system Flux Kustomization -- and the operator's OAuth credentials
# live.
#
# THE RULE: for that one identity, the only Secret write allowed is an UPDATE
# (PATCH and server-side apply arrive as UPDATE) of the Secret named after the
# calling pod. That is exactly what a proxy writes: containerboot and kubestore
# keep their state in TS_KUBE_SECRET, which the operator sets to the pod name
# and pre-creates (sts.go provisionSecrets, operator 1.102.4). The pod name
# comes from the bound service-account token (userInfo.extra), not from
# anything the caller writes.
#
# WHY NOT A LABEL. The first version allowed any Secret labelled
# tailscale.com/managed=true. That label is written by the caller, so under
# Deny a compromised proxy could still CREATE a labelled
# kubernetes.io/service-account-token Secret for kube-apiserver-auth-proxy --
# which holds cluster-wide impersonate -- read back the token the controller
# fills in, and be cluster-admin. An envtest harness reproduced exactly that.
# The label is also on every proxy's state, so one tailnet-only proxy could
# rewrite the Funnel proxy's serve-config and publish any ClusterIP under the
# allow-listed name. A CREATE right in a namespace is a right to every
# ServiceAccount token in it; hence no CREATE, no DELETE, and only your own
# Secret.
#
# WHAT THIS CANNOT DO: stop READS. Admission never sees a GET, and the chart
# Role lets every proxies pod read every Secret in tailscale-system,
# operator-oauth included, whose client can mint tag:funnel. That is accepted
# residual risk (docs/plans/cloudflare-tunnel-to-funnel.md §H); narrowing the
# chart's Role is the fix for it.
#
# SHIPPED IN AUDIT, NOT DENY. If some proxy writes outside its own Secret --
# e.g. kubestore recreating a state Secret someone deleted -- Deny would break
# it. Switch the binding to Deny once Thanos shows no violations across a week
# that includes a restart of every proxies pod. A passing check emits no metric
# at all, so test for PRESENCE, not increase() (a series born inside the window
# loses its first increment), at
# http://thanos-query.observability.svc.cluster.local:9090
# (local Prometheus keeps one day):
#   gate, must be empty:
#     sum by (instance, error_type, enforcement_action) (max_over_time(
#       apiserver_validating_admission_policy_check_total{job="apiserver",
#       policy="tailscale-proxies-secret-scope"}[7d]))
#   liveness guard, must be > 0 (the policy was consulted at all):
#     sum by (operation) (increase(
#       apiserver_admission_match_condition_evaluation_seconds_count{
#       job="apiserver", kind="policy", name="tailscale-proxies-secret-scope"}[7d]))
# The apiserver audit log (Talos default, Metadata level) records the same
# violation as validation.policy.admission.k8s.io/validation_failure, but it
# is on-node, a few hours deep, and not shipped anywhere.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tailscale-proxies-secret-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: tailscale-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: is-proxies-serviceaccount
      expression: >
        request.userInfo.username == 'system:serviceaccount:tailscale-system:proxies'
  variables:
    # '' when the token is not pod-bound, which then matches no Secret name.
    - name: podName
      expression: >
        has(request.userInfo.extra)
        && 'authentication.kubernetes.io/pod-name' in request.userInfo.extra
        && size(request.userInfo.extra['authentication.kubernetes.io/pod-name']) == 1
        ? request.userInfo.extra['authentication.kubernetes.io/pod-name'][0] : ''
  validations:
    - expression: >
        request.operation == 'UPDATE'
        && variables.podName != ''
        && request.name == variables.podName
      messageExpression: >
        'the tailscale proxies ServiceAccount may only UPDATE its own state Secret, named after its pod; got '
        + request.operation + ' on ' + request.name
      message: >-
        the tailscale proxies ServiceAccount may only UPDATE its own state
        Secret, named after its pod
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tailscale-proxies-secret-scope
spec:
  policyName: tailscale-proxies-secret-scope
  # Audit first -- see the header. Deny is the goal.
  validationActions: ["Audit"]
