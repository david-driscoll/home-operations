# HAND-MAINTAINED, and it must stay that way.
#
# This is how a pod reaches the cluster's OWN API server over the tailnet.
# `generateTailscaleKubeConfig` (components/store/index.ts) points every Pulumi
# kubeconfig at https://<cluster>-kubeproxy.<tailnet>, so the in-cluster Pulumi
# operator's connection to Kubernetes runs through this Service -- including
# stacks/unifi-network, which generates every OTHER egress Service in this
# directory. Letting that stack own this one would be a stack that can delete the
# socket it is talking through, with no way back in to undo it.
#
# See stacks/unifi-network/tailnet-egress.ts and ./bootstrap.yaml.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/v1.34.2/service.json
apiVersion: v1
kind: Service
metadata:
  name: equestria-kubeproxy
  annotations:
    tailscale.com/tailnet-fqdn: "equestria-kubeproxy.${TAILSCALE_DOMAIN}"
    tailscale.com/proxy-group: tailnet-inbound
spec:
  type: ExternalName
  externalName: equestria-kubeproxy
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: equestria-kubeproxy
spec:
  interval: 2m
  module: http_2xx
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://equestria-kubeproxy.${TAILSCALE_DOMAIN}/healthz
