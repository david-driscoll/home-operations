---
# KEDA: scales a workload from an external signal. Installed for one consumer,
# kubernetes/apps/coder/forgejo-runner, which starts a runner pod for
# each Forgejo Actions job that is waiting.
#
# The chart is not published as an OCI artifact, hence a HelmRepository here
# where most of this namespace uses an OCIRepository.
#
# Two things this adds to the cluster beyond its own pods:
#
# - the `external.metrics.k8s.io` APIService, served by its metrics apiserver.
#   Nothing else here serves that API (metrics-server is `metrics.k8s.io`).
# - CRDs in `keda.sh`. go-kube-downscaler's `scaledobjects` include was left
#   out because those CRDs were absent; it is still not needed, and nothing
#   here creates a ScaledObject.
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keda
spec:
  interval: 1h
  url: https://kedacore.github.io/charts
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  chart:
    spec:
      chart: keda
      # The Forgejo scaler arrived in 2.18.
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: keda
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    # https://keda.sh/docs/2.21/integrations/prometheus/ -- all three
    # components expose metrics and get a ServiceMonitor. Prometheus here
    # selects every ServiceMonitor and PrometheusRule in the cluster, so no
    # extra labels are needed.
    prometheus:
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
        # The two that say the thing this was installed for has stopped
        # working: a scaler that cannot read its queue starts no runners, and
        # nothing else would say so.
        prometheusRules:
          enabled: true
          alerts:
            - alert: KedaScalerErrors
              expr: sum by (exported_namespace, scaledObject, scaler) (rate(keda_scaler_detail_errors_total[10m])) > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: >-
                  KEDA scaler {{ $labels.scaler }} on {{ $labels.exported_namespace }}/{{ $labels.scaledObject }} is failing
                description: >-
                  The scaler has been returning errors for 15 minutes, so the
                  workload it drives is not being scaled.
                  `kubectl -n kube-system logs deploy/keda-operator` has the
                  reason.
            - alert: KedaScaledJobErrors
              expr: sum by (exported_namespace, scaledJob) (rate(keda_scaled_job_errors_total[10m])) > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: >-
                  KEDA ScaledJob {{ $labels.exported_namespace }}/{{ $labels.scaledJob }} is failing
                description: >-
                  KEDA has been failing to reconcile this ScaledJob for 15
                  minutes.
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
      webhooks:
        enabled: true
        serviceMonitor:
          enabled: true
    # https://keda.sh/docs/2.21/integrations/opentelemetry/ (marked
    # experimental upstream). The operator also PUSHES its metrics over OTLP
    # to Alloy, which hands OTLP metrics to the same Prometheus. So the
    # operator's numbers arrive twice, under two naming schemes:
    # `keda_scaler_...` from the scrape above and the OpenTelemetry names
    # (dots turned into underscores) from this push.
    opentelemetry:
      collector:
        # Alloy's OTLP/HTTP receiver (observability/alloy).
        uri: http://alloy.observability.svc.cluster.local:4318
      operator:
        enabled: true
    # One consumer and a CI queue: a restart delays a scale-up by seconds, so
    # single replicas are enough.
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      webhooks:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
