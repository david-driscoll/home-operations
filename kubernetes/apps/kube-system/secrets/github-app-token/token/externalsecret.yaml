---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# `github-token`, reflected estate-wide. Same name, same two keys and the same
# reflector annotations the Pulumi SecretPatch produced, so every consumer --
# the Pulumi Stack CRs, dynacat, pulumi-secrets -- is untouched.
#
# 30m against a 60m token life: a refresh mints a NEW installation token and the
# previous one stays valid until its own expiry, so consumers always hold one
# with at least half its life left. The old design could not offer that, because
# nothing re-minted between Pulumi runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshInterval: 30m
  target:
    name: github-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          # Estate-wide fan-out, matching what Pulumi set.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reloader.stakater.com/auto: "true"
      data:
        # Both keys, because consumers use both names.
        token: "{{ .token }}"
        access_token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-token
