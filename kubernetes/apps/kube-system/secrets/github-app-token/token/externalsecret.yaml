---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# `github-token`, reflected estate-wide. Same name, same two keys and the same
# reflector annotations the Pulumi SecretPatch produced, so every consumer --
# the Pulumi Stack CRs, dynacat, pulumi-secrets -- is untouched.
#
# 30m against a 60m token life: a refresh mints a NEW installation token and the
# previous one stays valid until its own expiry, so consumers always hold one
# with at least half its life left. The old design could not offer that, because
# nothing re-minted between Pulumi runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshInterval: 30m
  target:
    name: github-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          # Estate-wide fan-out, matching what Pulumi set.
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reloader.stakater.com/auto: "true"
      data:
        # Both keys, because consumers use both names.
        token: "{{ .token }}"
        access_token: "{{ .token }}"
        # Two MORE renderings of the SAME token -- no extra mint, no second
        # generator call, just the one `.token` above written a third and
        # fourth way. They exist for the `gh` CLI, which cannot be pointed at
        # a token file: it reads `GH_TOKEN`/`GITHUB_TOKEN` from the
        # environment or its own hosts.yml and nothing else (there is no
        # GITHUB_TOKEN_FILE -- verified against gh 2.100.0, which silently
        # ignores it and reports "not logged into any GitHub hosts").
        #
        # An env var is resolved ONCE at container start while this token is
        # re-minted every 30m against a 60m life, so any long-lived pod's
        # `gh` goes stale about an hour in. Pointing GH_CONFIG_DIR at this
        # Secret's mount instead gives `gh` a hosts.yml that updates in place
        # as the Secret rotates -- freshness per INVOCATION, which is what
        # `git` already gets from its credential helper.
        # kubernetes/apps/agents/agentboard/helmrelease.yaml is the consumer.
        #
        # `config.yml` is not a credential -- it is 13 bytes of static marker,
        # and it is REQUIRED. Without it `gh` decides hosts.yml needs a
        # format migration and tries to write it back; on a Secret mount
        # (always read-only) every single gh command then dies with `failed
        # to write config after migration: ... permission denied`. With the
        # version marker present there is no migration and no write attempt.
        # Confirmed live 2026-09-05 in the agentboard pod, running gh as an
        # unprivileged uid against an unwritable dir: hosts.yml alone failed,
        # hosts.yml + config.yml succeeded.
        #
        # Dotted key names are deliberate (they must match gh's real
        # filenames) and safe: no workload in the estate consumes this Secret
        # via `envFrom` -- verified live against every running pod -- so
        # these never have to be valid environment-variable identifiers.
        # Keep it that way; an `envFrom` on this Secret would start logging
        # InvalidEnvironmentVariableNames for both.
        config.yml: |
          version: "1"
        hosts.yml: |
          github.com:
              users:
                  x-access-token:
                      oauth_token: {{ .token }}
              git_protocol: https
              user: x-access-token
              oauth_token: {{ .token }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-token
