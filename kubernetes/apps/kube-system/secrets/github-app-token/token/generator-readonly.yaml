---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
#
# A second installation token from the same App as ./generator.yaml, cut down
# to `metadata: read`. It exists for the forge's Actions jobs
# (kubernetes/apps/coder/forgejo-runner), which only need github.com to stop
# counting them against the anonymous API limit -- 60 requests an hour, shared
# by every runner pod behind the one egress address. `pulumi install` alone
# spends that downloading provider plugins from GitHub releases.
#
# NOT `github-token`. That one carries everything the App was granted, and the
# runner hands this file to every job on every forge repository, pull requests
# included. Public release assets need no permission at all; `metadata: read` is
# just the smallest grant GitHub will mint a token for.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-token-readonly
spec:
  # Same identifiers and key as ./generator.yaml; see there for why they come
  # from cluster-secrets.
  appID: "${GITHUB_APP_ID}"
  installID: "${GITHUB_APP_INSTALLATION_ID}"
  permissions:
    metadata: read
  auth:
    privateKey:
      secretRef:
        name: github-app
        key: github_app_private_key
