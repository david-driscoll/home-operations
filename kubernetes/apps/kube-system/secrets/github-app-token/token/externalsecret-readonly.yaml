---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# `github-token-readonly`: ./generator-readonly.yaml's token, reflected into the
# `coder` namespace only, where forgejo-runner mounts it for job containers.
# Refreshed like `github-token` (./externalsecret.yaml): every 30m against a
# 60m life, so a consumer that reads the FILE when it needs it always gets a
# token with at least half its life left. The runner pods wait up to six hours
# for a job, which is why they mount it rather than take it as an env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token-readonly
spec:
  refreshInterval: 30m
  target:
    name: github-token-readonly
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "coder"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "coder"
      data:
        token: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-token-readonly
