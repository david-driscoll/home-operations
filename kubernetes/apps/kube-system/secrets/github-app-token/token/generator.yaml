---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
#
# Mints the GitHub App installation token that used to come from Pulumi.
#
# WHY THIS REPLACED THE PULUMI PATH: an installation token lives ONE HOUR, and
# the old design minted it during a Pulumi run. Between runs it was simply
# expired -- the live `github-token` returned 401 when checked, and its Secret
# had last been written months earlier. A generator on a refresh interval is the
# right shape for a credential with that lifetime.
#
# appID and installID are plain strings in the CRD -- no secretRef -- so they
# arrive by Flux `postBuild.substituteFrom` on the `github-app` Secret next
# door, NOT hardcoded here. They are identifiers rather than credentials, but
# there is no reason to copy them into git when the mechanism to avoid it
# already exists (kubernetes/apps/equestria/home/dynacat uses the same trick).
#
# Post-renderers cannot do this job: they are a HelmRelease-only field and their
# patches are static, so they cannot read a value out of a Secret.
#
# Namespaced, not a ClusterGenerator: `auth.privateKey.secretRef` resolves in
# the invoking ExternalSecret's namespace, and both live here in kube-system. It
# is the cross-NAMESPACE case that forces cluster scope, and there isn't one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-token
spec:
  appID: "${github_app_id}"
  installID: "${github_app_installation_id}"
  auth:
    privateKey:
      secretRef:
        name: github-app
        key: github_app_private_key
