---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
#
# Mints the GitHub App installation token that used to come from Pulumi.
#
# WHY THIS REPLACED THE PULUMI PATH: an installation token lives ONE HOUR, and
# the old design minted it during a Pulumi run. Between runs it was simply
# expired -- the live `github-token` returned 401 when checked, and its Secret
# had last been written months earlier. A generator on a refresh interval is the
# right shape for a credential with that lifetime.
#
# Namespaced, not a ClusterGenerator: `auth.privateKey.secretRef` resolves in
# the invoking ExternalSecret's namespace, and both live here in kube-system. It
# is the cross-NAMESPACE case that forces cluster scope, and there isn't one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-token
spec:
  # LITERAL, and they have to be. Both identifiers are all digits, and the CRD
  # types them as string, so the only question is whether a value can reach this
  # field as a string. Flux substitutes AFTER `kustomize build`, and kustomize
  # drops any quoting a `${VAR}` scalar does not itself require -- so `"${X}"`
  # and `!!str ${X}` both emit bare `${X}`, and the digits that land there parse
  # as an int. The API then rejects the whole object at dry-run:
  #
  #   .spec.appID: expected string, got &value.valueUnstructured{Value:948548}
  #
  # Two earlier attempts died here (#1135 with substituteFrom, #1137 with the
  # !!str tag). This is the same trap as #1099, where a substituted `false`
  # reached a string field as a bool -- confirmed there for bool, here for int.
  # A literal is the one form that survives, because kustomize KEEPS quotes on a
  # scalar that would change type without them.
  #
  # Copying them into git costs nothing: GitHub treats an App ID and an
  # installation ID as identifiers, not credentials. The private key is the
  # secret, and it is still read through the secretRef below.
  appID: "948548"
  installID: "52936797"
  auth:
    privateKey:
      secretRef:
        name: github-app
        key: github_app_private_key
