---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
#
# Mints the GitHub App installation token that used to come from Pulumi.
#
# WHY THIS REPLACED THE PULUMI PATH: an installation token lives ONE HOUR, and
# the old design minted it during a Pulumi run. Between runs it was simply
# expired -- the live `github-token` returned 401 when checked, and its Secret
# had last been written months earlier. A generator on a refresh interval is the
# right shape for a credential with that lifetime.
#
# Namespaced, not a ClusterGenerator: `auth.privateKey.secretRef` resolves in
# the invoking ExternalSecret's namespace, and both live here in kube-system. It
# is the cross-NAMESPACE case that forces cluster scope, and there isn't one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-token
spec:
  # These resolve from `cluster-secrets`, NOT from the github-app Secret next
  # door, and the difference matters.
  #
  # components/common patches postBuild.substituteFrom onto EVERY Flux
  # Kustomization in the estate, and a strategic-merge patch on a plain list
  # REPLACES it. A per-ks `substituteFrom: [github-app]` is silently discarded --
  # the live object ends up with cluster-secrets/cluster-versions/shared-secrets
  # and nothing else. So the only names in scope here are the estate-wide ones,
  # and ${github_app_id} from the local Secret fails at render time with
  # `envsubst error: variable not set (strict mode)`, which reads like a missing
  # Secret rather than an overwritten field.
  #
  # An App ID and an installation ID are identifiers, not credentials -- GitHub
  # treats the private key as the secret, and that is still read through the
  # secretRef below. cluster-secrets is where the estate already keeps
  # non-secret configuration of exactly this kind.
  appID: "${GITHUB_APP_ID}"
  installID: "${GITHUB_APP_INSTALLATION_ID}"
  auth:
    privateKey:
      secretRef:
        name: github-app
        key: github_app_private_key
