---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
#
# Mints the GitHub App installation token that used to come from Pulumi.
#
# WHY THIS REPLACED THE PULUMI PATH: an installation token lives ONE HOUR, and
# the old design minted it during a Pulumi run. Between runs it was simply
# expired -- the live `github-token` returned 401 when checked, and its Secret
# had last been written months earlier. A generator on a refresh interval is the
# right shape for a credential with that lifetime.
#
# appID and installID are inline, and that is a considered choice rather than a
# shortcut. Neither is a credential -- they are the identifiers in the App's own
# URL and in every webhook payload GitHub sends. The PRIVATE KEY is the secret,
# and it stays in a secretRef.
#
# Two mechanisms were tried first and neither works here:
#
#   postBuild.substituteFrom  Reads the value from a Secret -- correct in
#                             principle, and this ks did exactly that. But
#                             components/common patches EVERY Kustomization with
#                             its own `substituteFrom` list, and a Flux
#                             Kustomization is a CRD with no Go schema, so
#                             kustomize applies a JSON merge patch and the list
#                             REPLACES rather than merges. The entry silently
#                             vanished and the render failed with
#                             `variable not set (strict mode): "github_app_id"`.
#                             equestria/home/dynacat carries the same dead
#                             config -- its extra entry is missing from the live
#                             object too.
#
#   postRenderers             A HelmRelease-only field, and its patches are
#                             static kustomize patches. It cannot read a Secret
#                             at all.
#
# Namespaced, not a ClusterGenerator: `auth.privateKey.secretRef` resolves in
# the invoking ExternalSecret's namespace, and both live here in kube-system. It
# is the cross-NAMESPACE case that forces cluster scope, and there isn't one.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-token
spec:
  appID: "948548"
  installID: "52936797"
  auth:
    privateKey:
      secretRef:
        name: github-app
        key: github_app_private_key
