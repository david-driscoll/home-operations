---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The GitHub App credential, in kube-system so the token generator next door can
# reach it. Same OpenBao item the Actions runners use -- one App, one identity.
#
# Split into its own Kustomization from the generator deliberately: the token ks
# reads github_app_id / github_app_installation_id through
# `postBuild.substituteFrom` on THIS Secret, and Flux resolves that at render
# time. If both lived in one Kustomization the first apply would fail with an
# unresolved variable, because the Secret it substitutes from is created by the
# same apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: github-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
  dataFrom:
    # Keys arrive as github_app_id / github_app_installation_id /
    # github_app_private_key -- the names the generator and the substitution
    # both expect, so no rewrite.
    - extract:
        key: third-party-tokens/github/actions-runner/david-driscoll
