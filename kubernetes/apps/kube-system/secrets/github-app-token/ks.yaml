---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app github-app-credentials
  namespace: &namespace kube-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/kube-system/secrets/github-app-token/credentials
  prune: true
  # `wait` plus a health check on the ExternalSecret, not just `wait: true`.
  # dependsOn only guarantees this Kustomization is Ready, and Ready would
  # otherwise mean "the ExternalSecret object was applied" -- not "ESO has
  # produced the Secret". The token ks substitutes from that Secret at RENDER
  # time, so it must genuinely exist first.
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: external-secrets
      namespace: kube-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app github-app-token
  namespace: &namespace kube-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/kube-system/secrets/github-app-token/token
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # Not optional: the generator reads the App private key out of the Secret
    # that ks produces, and its health check is what makes "Ready" mean the
    # Secret exists.
    - name: github-app-credentials
      namespace: kube-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
    # NO substituteFrom here. components/common patches one onto every
    # Kustomization and that patch REPLACES the list, so anything set locally is
    # dropped before it reaches the cluster. The generator carries its two
    # identifiers literally instead.
    #
    # The dependency below still earns its keep: the generator reads the PEM via
    # secretRef, so the credentials Kustomization must have produced that Secret
    # before this one applies.
