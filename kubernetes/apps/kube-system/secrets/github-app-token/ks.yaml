---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app github-app-credentials
  namespace: &namespace kube-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/kube-system/secrets/github-app-token/credentials
  prune: true
  # `wait` plus a health check on the ExternalSecret, not just `wait: true`.
  # dependsOn only guarantees this Kustomization is Ready, and Ready would
  # otherwise mean "the ExternalSecret object was applied" -- not "ESO has
  # produced the Secret". The token ks substitutes from that Secret at RENDER
  # time, so it must genuinely exist first.
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: external-secrets
      namespace: kube-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app github-app-token
  namespace: &namespace kube-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  path: ./kubernetes/apps/kube-system/secrets/github-app-token/token
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    # Not optional: the substituteFrom below reads the Secret that ks produces,
    # and its health check is what makes "Ready" mean the Secret exists.
    - name: github-app-credentials
      namespace: kube-system
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
    substituteFrom:
      # Supplies ${github_app_id} and ${github_app_installation_id} to the
      # generator, which takes them as plain strings with no secretRef. This is
      # the same mechanism equestria/home/dynacat uses to read github-token.
      #
      # It also exposes ${github_app_private_key} as a substitution variable.
      # Nothing references it -- the generator reads the PEM through a
      # secretRef, which is where a 1.6KB multi-line value belongs.
      - kind: Secret
        name: github-app
