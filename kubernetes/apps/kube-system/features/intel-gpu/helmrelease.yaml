---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: intel-device-plugins-gpu
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.34.1
  url: oci://ghcr.io/home-operations/charts-mirror/intel-device-plugins-gpu
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin
spec:
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    name: intel-gpu-plugin
    # Owned by the CONTROL-PLANE release below -- see the comment there for why
    # ownership sits on that side rather than this one.
    nodeFeatureRule: false
    # Three containers per GPU. Currently claimed on these nodes: jellyfin and
    # dispatcharr on fluttershy, plex on kerfuffle.
    sharedDevNum: 3
    allocationPolicy: balanced # Spread workloads evenly across available GPUs
    # Pinned to the WORKER iGPU by device ID. The control planes carry 46d4 and
    # are served by the separate release below at a lower sharing ratio; the two
    # device IDs are disjoint, so no node is ever claimed by both DaemonSets.
    #
    #   46a6 -> fluttershy, kerfuffle          (workers)
    #   46d4 -> milky-way, othalla, pegasus    (control planes)
    #
    # Quoting is load-bearing: node label values are strings, and an unquoted
    # `true` here is a YAML boolean that will not match the label.
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
      gpu.intel.com/device-id.0300-46a6.present: "true"
    # NOTE: this chart renders a GpuDevicePlugin CR, not a DaemonSet -- the
    # intel-device-plugin-operator turns the CR into the
    # intel-gpu-plugin-intel-gpu-plugin DaemonSet. `tolerations` is a passthrough
    # field on the CR spec (templates/gpu.yaml), so it does reach the pods, but
    # the operator is the thing that applies it: hand-patching the DaemonSet
    # would be reverted.
    #
    # No control-plane toleration here on purpose: this release's nodeSelector
    # can never match a control plane, so a toleration would be dead config.
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin-cp
spec:
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    name: intel-gpu-plugin-cp
    # This release owns the NodeFeatureRule for the whole cluster.
    #
    # The rule is a single cluster-scoped object with a FIXED name
    # (`intel-dp-gpu-device`) that does NOT derive from .Values.name, so exactly
    # one release may create it or the two fight over the same object. It is
    # what applies the `intel.feature.node.kubernetes.io/gpu` label that BOTH
    # releases select on -- including this one.
    #
    # Ownership belongs on the control-plane side because the control planes are
    # the always-on tier. The worker release is the one that gets suspended or
    # removed when the media workers are shed; if it owned the rule, Flux would
    # prune the rule with it, the gpu label would vanish from every node, and
    # this release would lose its own nodeSelector -- taking the control-plane
    # GPUs down at exactly the moment they are the only ones left. Owning it
    # from the tier that never goes away removes that failure mode entirely.
    nodeFeatureRule: true
    # Two containers per GPU across three control planes, so six slots.
    #
    # Three claims have to fit here when both media workers are shed overnight:
    # plex, jellyfin and dispatcharr. One slot per GPU would give exactly three
    # -- an exact fit with zero headroom, so a single control plane being down
    # for an upgrade would leave one of the three unschedulable. Two per GPU
    # keeps the whole set schedulable on any two of the three nodes.
    sharedDevNum: 2
    # Legal only because sharedDevNum is above 1. The operator's validating
    # webhook (vgpudeviceplugin.kb.io) rejects any policy at sharedDevNum 1 with
    #   PreferredAllocationPolicy is valid only when setting sharedDevNum > 1
    # and rejects an empty value too, so at 1 this must read `none` rather than
    # being omitted. Caught by a server-side dry run.
    allocationPolicy: balanced
    # 46d4 is the control-plane iGPU. Disjoint from the workers' 46a6.
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
      gpu.intel.com/device-id.0300-46d4.present: "true"
    # Required: the control planes carry the NoSchedule taint from piece 20 §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
