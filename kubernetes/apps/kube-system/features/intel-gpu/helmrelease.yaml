---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: intel-device-plugins-gpu
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.36.0
  # Repointed off ghcr.io/home-operations/charts-mirror for the same reason as
  # the operator — see the long note in ../intel/helmrelease.yaml. Short version:
  # home-operations deleted both intel charts from the mirror on 2025-12-11
  # ("Official OCI chart exists upstream"), the mirror tops out at 0.34.1, and
  # its prune window for the surviving tags is already overdue.
  #
  # 0.34.1 was also outside its supported Kubernetes window: upstream maps
  # release-0.34 to k8s 1.33-1.34, release-0.36 to 1.36, and this cluster runs
  # v1.36.4 (versions.env). So this is a support-alignment fix as much as a
  # feature bump.
  url: oci://ghcr.io/intel/helm-charts/intel-device-plugins-gpu
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# THE CONTROL-PLANE GPU PLUGIN.
#
# The generic name is deliberate and worth explaining, because the obvious
# reading -- that `intel-gpu-plugin` should be the workers and the control
# planes get the suffixed name -- is the expensive one.
#
# This release already exists and already OWNS the two NodeFeatureRules
# (`intel-dp-gpu-device` and `intel-gpu-platform-labeling`). Those rules are
# cluster-scoped with fixed names that do not derive from .Values.name, so only
# one release can create them. Handing the generic name to a new workers release
# would mean transferring Helm ownership of live objects -- and
# `intel-gpu-platform-labeling` is what emits the `gpu.intel.com/device-id.*`
# labels that BOTH releases below select on. A botched transfer takes out every
# GPU workload in the cluster, not just one node class.
#
# Keeping the rules with the release that already owns them makes the whole
# problem disappear: no adoption step, no `helm.sh/resource-policy: keep`, no
# ordering dependency between two Flux reconciles.
#
# Control planes are also the right long-term owner regardless: they are the
# always-on tier. The workers release is the one that gets suspended or removed
# when the media workers are shed, and a rule pruned along with it would strip
# the gpu labels from every node -- including the control planes that would then
# be the only GPUs left.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin
spec:
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  maxHistory: 3
  interval: 1h
  timeout: 10m
  # The real "is the plugin serving?" gate. It has to live HERE, not on
  # features/intel-gpu/ks.yaml, and the distinction is not academic.
  #
  # Flux evaluates a Kustomization's `wait` / `healthCheckExprs` only over the
  # objects in its own inventory. That inventory is exactly three entries --
  # these two HelmReleases and the OCIRepository (verified against the live
  # Kustomization status). The GpuDevicePlugin CR is rendered by HELM, so the
  # CEL expression in ks.yaml never matches anything and is silently inert.
  #
  # Falling back to HelmRelease readiness does not help either: this chart's
  # only object IS the GpuDevicePlugin CR, and Helm's ReadyChecker has no
  # waiter for an unknown custom kind, so the release reports Ready the instant
  # the CR is written -- before the operator has turned it into a DaemonSet,
  # before the pods roll onto the new image, and before kubelet has swapped the
  # advertised monitoring resource. Consumers gated on that would be released
  # into exactly the window they were gated to avoid.
  #
  # `inProgress` rather than the `failed:` form used in ks.yaml: for a
  # HelmRelease, `desiredNumberScheduled != numberReady` is true during any
  # normal rolling update, so as a failure condition it would abort the wait
  # immediately instead of waiting it out. The has() guard covers the first
  # create, when the status subresource is still empty.
  #
  # Residual race, accepted: GpuDevicePlugin status carries no
  # observedGeneration, so in the instant after the operator sees a patched CR
  # but before it patches the DaemonSet, status still reports N/N from the OLD
  # pods. This closes most of the window, not all of it.
  healthCheckExprs:
    - apiVersion: deviceplugin.intel.com/v1
      kind: GpuDevicePlugin
      current: >-
        has(status.numberReady) && status.desiredNumberScheduled > 0
        && status.desiredNumberScheduled == status.numberReady
      inProgress: >-
        !has(status.numberReady)
        || status.desiredNumberScheduled != status.numberReady
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    name: intel-gpu-plugin
    # This release owns the cluster's NodeFeatureRules -- see the block above.
    nodeFeatureRule: true
    # THE BREAKING CHANGE IN 0.36.0, made explicit.
    #
    # 0.36.0 replaces the per-KMD monitoring resources with a single combined
    # one (upstream PR #2244). `single` advertises `gpu.intel.com/monitoring`;
    # `split` restores `gpu.intel.com/i915_monitoring` + `.../xe_monitoring`,
    # which the 0.36.0 README now marks Deprecated.
    #
    # `single` is already the chart default, so this line changes nothing
    # functionally -- it is written out because the alternative is a silent,
    # invisible dependency. Nothing in a one-line OCIRepository tag bump hints
    # that a pod in a DIFFERENT directory
    # (observability/intel-gpu-exporter/helmrelease.yaml) loses the resource it
    # requests and goes Pending on all five Intel nodes. Naming the mode here
    # puts the cause next to something greppable.
    #
    # `split` was the tempting choice -- zero change to the exporter -- and is
    # deliberately NOT taken. It is deprecated upstream, so it only defers this
    # migration, and it re-pins the estate to the i915 KMD: the split names are
    # derived from the driver, so an i915 -> xe switch silently renames the
    # resource to `xe_monitoring` and breaks the exporter exactly the same way.
    # The combined name is KMD-independent and survives that.
    #
    # Values are case-sensitive and validated in the plugin's checkBasics():
    # anything other than `split` or `single` is a klog.Fatal, i.e. a
    # CrashLoopBackOff of the DaemonSet that advertises GPUs cluster-wide, not a
    # soft fallback. Do not set it to "" either -- the CRD enum has no empty
    # member and the chart interpolates unquoted, so it renders as null and the
    # API server rejects it. Omit the key or give it a real value.
    monitoringMode: single
    # Two containers per GPU across three control planes, so six slots.
    #
    # Three claims have to fit here when the media workers are shed overnight:
    # plex, jellyfin and dispatcharr. One slot per GPU would give exactly three
    # -- an exact fit with zero headroom, so a single control plane down for an
    # upgrade would leave one of the three unschedulable. Two per GPU keeps the
    # whole set schedulable on any two of the three nodes.
    sharedDevNum: 2
    # Legal only because sharedDevNum is above 1. The operator's validating
    # webhook (vgpudeviceplugin.kb.io) rejects any policy at sharedDevNum 1 with
    #   PreferredAllocationPolicy is valid only when setting sharedDevNum > 1
    # and rejects an empty value too, so at 1 this would have to read `none`
    # rather than being omitted. Caught by a server-side dry run.
    allocationPolicy: balanced
    # Pinned to the CONTROL-PLANE iGPU by device ID. The control planes and the
    # media workers run different Intel silicon, and NFD already publishes the
    # device ID -- so the two node classes separate without inventing a label.
    #
    #   46d4 -> milky-way, othalla, pegasus    (control planes)
    #   46a6 -> fluttershy, kerfuffle          (workers)
    #
    # Disjoint by construction: a node has one iGPU, so no node is ever claimed
    # by both DaemonSets and nothing has to be kept in sync by hand.
    #
    # Quoting is load-bearing: node label values are strings, and an unquoted
    # `true` here is a YAML boolean that will not match the label.
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
      gpu.intel.com/device-id.0300-46d4.present: "true"
    # NOTE: this chart renders a GpuDevicePlugin CR, not a DaemonSet -- the
    # intel-device-plugin-operator turns the CR into the DaemonSet.
    # `tolerations` is a passthrough field on the CR spec (templates/gpu.yaml),
    # so it does reach the pods, but the operator is the thing that applies it:
    # hand-patching the DaemonSet would be reverted.
    #
    # Required here: the control planes carry the NoSchedule taint from piece 20 §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# THE WORKER GPU PLUGIN. New release, so it creates only its own
# GpuDevicePlugin CR and takes ownership of nothing that already exists.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin-workers
spec:
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  maxHistory: 3
  interval: 1h
  timeout: 10m
  # The real "is the plugin serving?" gate. It has to live HERE, not on
  # features/intel-gpu/ks.yaml, and the distinction is not academic.
  #
  # Flux evaluates a Kustomization's `wait` / `healthCheckExprs` only over the
  # objects in its own inventory. That inventory is exactly three entries --
  # these two HelmReleases and the OCIRepository (verified against the live
  # Kustomization status). The GpuDevicePlugin CR is rendered by HELM, so the
  # CEL expression in ks.yaml never matches anything and is silently inert.
  #
  # Falling back to HelmRelease readiness does not help either: this chart's
  # only object IS the GpuDevicePlugin CR, and Helm's ReadyChecker has no
  # waiter for an unknown custom kind, so the release reports Ready the instant
  # the CR is written -- before the operator has turned it into a DaemonSet,
  # before the pods roll onto the new image, and before kubelet has swapped the
  # advertised monitoring resource. Consumers gated on that would be released
  # into exactly the window they were gated to avoid.
  #
  # `inProgress` rather than the `failed:` form used in ks.yaml: for a
  # HelmRelease, `desiredNumberScheduled != numberReady` is true during any
  # normal rolling update, so as a failure condition it would abort the wait
  # immediately instead of waiting it out. The has() guard covers the first
  # create, when the status subresource is still empty.
  #
  # Residual race, accepted: GpuDevicePlugin status carries no
  # observedGeneration, so in the instant after the operator sees a patched CR
  # but before it patches the DaemonSet, status still reports N/N from the OLD
  # pods. This closes most of the window, not all of it.
  healthCheckExprs:
    - apiVersion: deviceplugin.intel.com/v1
      kind: GpuDevicePlugin
      current: >-
        has(status.numberReady) && status.desiredNumberScheduled > 0
        && status.desiredNumberScheduled == status.numberReady
      inProgress: >-
        !has(status.numberReady)
        || status.desiredNumberScheduled != status.numberReady
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    name: intel-gpu-plugin-workers
    # MUST stay false. The NodeFeatureRules are owned by the control-plane
    # release above; setting this true would make two releases fight over the
    # same two fixed-name cluster-scoped objects.
    nodeFeatureRule: false
    # MUST match the control-plane release above. The monitoring resource is
    # advertised per node by whichever DaemonSet owns that node, and these two
    # releases own disjoint halves of the fleet (46d4 control planes, 46a6
    # workers). Setting this on only one release would leave the other half
    # advertising the other resource name -- so the exporter would schedule on
    # two or three nodes and sit Pending on the rest. See the full rationale on
    # the control-plane release above.
    monitoringMode: single
    # Three containers per GPU. Currently claimed on these nodes: jellyfin and
    # dispatcharr on fluttershy, plex on kerfuffle.
    sharedDevNum: 3
    allocationPolicy: balanced # Spread workloads evenly across available GPUs
    # 46a6 is the worker iGPU (Iris Xe). Disjoint from the control planes' 46d4.
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
      gpu.intel.com/device-id.0300-46a6.present: "true"
    # No control-plane toleration on purpose: this release's nodeSelector can
    # never match a control plane, so a toleration would be dead config.
