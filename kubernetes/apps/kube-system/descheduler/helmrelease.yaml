---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/descheduler/
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: kube-system
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    kind: CronJob
    schedule: "*/2 * * * *"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    priorityClassName: system-cluster-critical
    deschedulerPolicy:
      apiVersion: "descheduler/v1alpha2"
      kind: "DeschedulerPolicy"
      profiles:
        # DefaultProfile — the cluster rebalancer, and now the ONLY profile.
        # Plugin membership has never changed; the one non-default setting is
        # `nodeFit` on its evictor, which is explained below and is deliberately
        # NOT part of the media-relocation revert.
        - name: DefaultProfile
          plugins:
            evict:
              enabled:
                - DefaultEvictor
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictSystemCriticalPods: false
                evictLocalStoragePods: false
                # nodeFit makes DefaultEvictor.PreEvictionFilter run
                # PodFitsAnyOtherNode() before every eviction — re-checking
                # nodeSelector, required node affinity, taints, unschedulable and
                # resource fit against the ready nodes — and refuse the eviction
                # when nothing else can take the pod.
                # It was unset (i.e. false) until 2026-08-22, and
                # docs/cluster-consolidation/29-taint-readiness-audit.md flagged
                # exactly what that costs: with the three control planes tainted
                # they read as permanently under-utilised, so LowNodeUtilization
                # evicts pods off the workers toward targets that can never accept
                # them. The pod is destroyed, the scheduler puts it straight back,
                # and two minutes later this CronJob does it again. Churn, not
                # outage — but pure loss.
                # Turning it on can only ever REDUCE evictions, never add one, so
                # it is safe to apply to the existing balance plugins.
                #
                # WHY THIS SURVIVED THE 2026-08-22 REVERT. It arrived in the same
                # PR (#1051) as the media-relocation machinery, and that machinery
                # — the LowPowerReturnProfile that used to sit below this one, the
                # control-plane tolerations and the soft worker-iGPU affinity on
                # plex/jellyfin/dispatcharr — has been backed out. `nodeFit` is
                # NOT part of it. Its cause is the control-plane NoSchedule taint
                # from piece 20 §4, which is still applied and is not being
                # reverted; the churn it prevents is real today and would be real
                # if the media apps had never been touched. Doc 29 is the record.
                nodeFit: true
            - name: RemoveDuplicates
            - name: RemovePodsViolatingTopologySpreadConstraint
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 20
                  memory: 20
                  pods: 20
                targetThresholds:
                  cpu: 50
                  memory: 50
                  pods: 50
