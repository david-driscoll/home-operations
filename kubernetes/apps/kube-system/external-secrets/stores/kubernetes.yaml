---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-external-secrets
rules:
- apiGroups: [""]
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectrulesreviews
  verbs:
  - create
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-external-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: kube-system
---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: backup
spec:
  provider:
    kubernetes:
      remoteNamespace: backup
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: "external-secrets"
          namespace: kube-system
---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: database
spec:
  provider:
    kubernetes:
      remoteNamespace: database
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: "external-secrets"
          namespace: kube-system
---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: network
spec:
  provider:
    kubernetes:
      remoteNamespace: network
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: "external-secrets"
          namespace: kube-system
---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster
spec:
  provider:
    kubernetes:
      remoteNamespace: ${CLUSTER_CNAME}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: "external-secrets"
          namespace: kube-system
---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/external-secrets.io/clustersecretstore_v1.json
#
# Secrets in `agents`, readable as a source by other ExternalSecrets. First
# consumer: kubernetes/apps/agents/toolport, whose registry ExternalSecret
# (Periodic) hashes the client tokens minted by a CreatedOnce generator
# ExternalSecret beside it -- the two refresh policies cannot share one
# ExternalSecret, so the second reads the first's Secret through this store.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: agents
spec:
  provider:
    kubernetes:
      remoteNamespace: agents
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-system
          key: ca.crt
      auth:
        serviceAccount:
          name: "external-secrets"
          namespace: kube-system
