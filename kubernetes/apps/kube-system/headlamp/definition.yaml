---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: ${APP}
spec:
  name: Headlamp
  category: ${CLUSTER_TITLE}
  description: Kubernetes Dashboard and Management UI
  url: &url https://${APP}.${CLUSTER_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/headlamp.svg
  authentik:
    oauth2:
      clientType: confidential
      allowedRedirectUris:
      - url: "https://${APP}.${CLUSTER_DOMAIN}/oidc-callback"
      # MagicDNS is flat: the tailnet name is `${APP}`, with no per-cluster
      # label the way ${CLUSTER_DOMAIN} has one.
      - url: "https://${APP}.${TAILSCALE_DOMAIN}/oidc-callback"
      propertyMappings:
        - email
        - openid
        - profile
      includeClaimsInIdToken: true
      subMode: user_email
  access_policy:
    groups:
      - admins
  gatus:
    - url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
