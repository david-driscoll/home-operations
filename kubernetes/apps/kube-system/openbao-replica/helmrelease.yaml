# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# Phase 5 break-glass replication — two cronjobs, one trust boundary:
#
#   dump          nightly: pg_dump the `openbao` database, age-encrypt it to
#                 the three estate recipients, ship it to the bao-standby dump
#                 receiver on alpha-site over SFTP, prune to 30 days.
#
#   restore-test  monthly: pull the newest dump BACK from alpha-site, decrypt,
#                 restore into a scratch Postgres sidecar, start a throwaway
#                 bao against it, let it unseal via transit, read a canary key
#                 with a purpose-made AppRole, and report to Gatus. An
#                 unverified backup is not a backup (RUNBOOK Scenario D).
#
# Both run HERE, not on alpha-site, and that placement is load-bearing: the
# dump must never be decryptable on alpha-site alone (that host also holds the
# transit key), so no age identity may ever land there. The cluster already
# holds an age identity (Flux's sops-age), so decrypting here adds no new
# exposure — and the restore test doubles as proof the dump actually left the
# building and can be fetched back.
#
# Both containers use the OpenBao image: the restore test needs the `bao`
# binary anyway, the dump job gets an image the estate already pins, and the
# missing client tools (pg_dump/psql 18, age, rclone, curl, jq) are installed
# at runtime — the same pattern as the postgres-backup cronjob in
# database/postgres/backups.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openbao-replica
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: openbao
      namespace: kube-system
    - name: external-secrets
      namespace: kube-system
  values:
    controllers:
      dump:
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          # PLAN §E: nightly at 03:00, an hour after the general postgres
          # backup at 02:00 so the two never contend for the database.
          schedule: "0 3 * * *"
          backoffLimit: 3
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          successfulJobsHistory: 3
          failedJobsHistory: 3
          suspend: false
        containers:
          main:
            image: &baoImage
              repository: ghcr.io/openbao/openbao
              tag: 2.6.2@sha256:11fd73a2102cda9c55d5d881a8c3210303146a7ec1e8ac76f526e175c6d24641
              pullPolicy: IfNotPresent
            # Root: apk needs it. kube-system is a privileged-PSS namespace.
            securityContext: &rootCtx
              runAsUser: 0
              runAsGroup: 0
            env:
              # PG_URI is a LITERAL now, not an envFrom on openbao-replica-db.
              #
              # The nightly dump used to authenticate with the openbao role's
              # PASSWORD, pulled out of the generated `openbao-postgres` uri --
              # and with `sslmode=disable`, so not even over TLS. Phase 2.4b sets
              # that password to NULL (`disablePassword: true`) and adds
              # `hostnossl openbao openbao all reject`, either of which breaks
              # this job silently at 03:00. Converting it first is the documented
              # prerequisite (docs/postgres-credentials/PHASE2.md, 2.4b).
              #
              # A certificate URI carries no secret, so it needs no
              # ExternalSecret: the credential is the mounted key, not the
              # string. That is why openbao-replica-db is deleted in this change.
              #
              # Verified against the live cluster before writing this, with the
              # same image, the same secret and runAsUser 0:
              #   openbao | ssl=true | TLSv1.3 | cipher=TLS_AES_256_GCM_SHA384
              #   pg_dump exit=0
              # libpq enforces private-key permissions where pgx does not, so
              # this needed checking rather than assuming from the openbao app.
              # Without an fsGroup the key lands 0400 root:root and libpq is
              # satisfied; the 0440 seen inside the openbao pod comes from that
              # StatefulSet's fsGroup, and this CronJob sets none.
              PG_URI: "postgres://openbao@postgres-rw.database.svc.cluster.local:5432/openbao?sslmode=verify-full&sslcert=/etc/pg-certs/tls.crt&sslkey=/etc/pg-certs/tls.key&sslrootcert=/etc/pg-certs/ca.crt"
              SFTP_HOST: dockge-as.${TAILSCALE_DOMAIN}
              SFTP_PORT: "2023"
              SFTP_KEY_FILE: /secrets/sftp/id_ed25519
              RETENTION_DAYS: "30"
              GATUS_URL: https://uptime.${ROOT_DOMAIN}
              # Pods have no route to the tailnet and no DNS answer for
              # uptime.${ROOT_DOMAIN} that they can reach — Gatus is reported
              # to through the dockge-as egress on 443, with --connect-to
              # keeping the Host/SNI intact so Traefik routes and the LE cert
              # validates.
              GATUS_CONNECT_TO: uptime.${ROOT_DOMAIN}:443:dockge-as.${TAILSCALE_DOMAIN}:443
              GATUS_TOKEN: openbao-break-glass_nightly-dump
            command:
              - /bin/sh
              - -c
              - >-
                set -eu;
                apk add --no-cache bash postgresql18-client age rclone curl
                && exec bash /scripts/dump.sh
            resources:
              requests:
                memory: 256Mi
                cpu: 20m
              limits:
                memory: 512Mi
                cpu: 500m

      restore-test:
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          # Monthly, two hours after that night's dump.
          schedule: "0 5 1 * *"
          backoffLimit: 2
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 3600
          successfulJobsHistory: 1
          failedJobsHistory: 3
          suspend: false
        initContainers:
          # Native sidecar (restartPolicy: Always on an init container): stays
          # up while main runs, dies with the pod, and — unlike a plain second
          # container — does not stop the Job from ever completing.
          postgres:
            image:
              # Postgres 18 — see #843. This was deliberately ahead of the CNPG
              # cluster (17.5) for a long stretch; the cluster has since caught
              # up to 18 too, and the constraint below is what still governs the
              # pairing, so leave this reasoning in place rather than collapsing
              # it into "they match now". The old comment claimed the scratch
              # engine had to be the same major as CNPG "so the restored dump is
              # read by the engine version that wrote it". That rationale does not
              # survive contact with what dump.sh actually produces:
              #
              #   pg_dump --schema=openbao --format=plain --no-owner --no-privileges
              #
              # a PLAIN SQL dump, which restores into any equal-or-newer major. The
              # direction that genuinely breaks is the other one — a pg_dump OLDER
              # than the server it reads — and that constraint lives on the dump
              # side, which is why `postgresql18-client` above moved to 18 in the
              # SAME change that took the CNPG cluster to 18: an 18 client reads a
              # 17 server fine, so bumping it early is safe, whereas leaving it at
              # 17 would abort every dump the moment the server crossed the major.
              #
              # What this job verifies is the ARTIFACT: that the nightly dump is
              # intact, decrypts, loads, and that the transit seal can unseal the
              # restored keyring. It is not a rehearsal of the production engine —
              # that is piece 03's Scenario B rehearsal, which is a separate gate.
              # So the scratch engine only has to be >= the dump's origin major,
              # and staying current is worth more than mirroring whatever CNPG
              # happens to be on.
              #
              # Getting here took a detour worth recording. Renovate crossed this
              # major on its own once, and 18 broke the job outright — the image
              # refuses to start when the mount IS the data directory, which is how
              # `pgdata` was mounted. Nothing noticed for weeks: this job runs on
              # the 1st of the month and had never run at all. #835 reverted to 17
              # and added the renovate rule that now blocks majors for this image.
              #
              # So this bump is a deliberate, hand-made decision rather than a tag
              # moving on its own, and it carries the actual fix — PGDATA below.
              # Leave the renovate guard in place; it is doing its job.
              repository: docker.io/library/postgres
              tag: 18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
              pullPolicy: IfNotPresent
            restartPolicy: Always
            env:
              # Scratch database, lives exactly as long as this pod, holds
              # only ciphertext OpenBao already encrypted. The password guards
              # nothing an attacker inside the pod does not already have.
              POSTGRES_USER: &scratchUser openbao
              POSTGRES_PASSWORD: &scratchPw restore-test
              POSTGRES_DB: &scratchDb openbao
              # THE 18 FIX. Postgres 18 images refuse to start when the mount IS
              # the data directory:
              #
              #   "there appears to be PostgreSQL data in /var/lib/postgresql/data
              #    (unused mount/volume)"
              #
              # and the pgdata volume below mounts exactly there. Pointing PGDATA at
              # a SUBDIRECTORY of the mount is the fix, and it is the same one
              # docker/_common/postgres already uses — which is the only reason that
              # stack survived the identical major bump while this job broke closed
              # for weeks (#835).
              #
              # Chosen over the upstream suggestion of mounting at
              # /var/lib/postgresql: that path is also the postgres user's home in
              # the image, and replacing it wholesale with an empty emptyDir is a
              # larger blast radius than this needs.
              PGDATA: /var/lib/postgresql/data/pgdata
            resources:
              requests:
                memory: 256Mi
                cpu: 50m
              limits:
                memory: 1Gi
                cpu: "1"
        containers:
          main:
            image: *baoImage
            securityContext: *rootCtx
            env:
              SFTP_HOST: dockge-as.${TAILSCALE_DOMAIN}
              SFTP_PORT: "2023"
              SFTP_KEY_FILE: /secrets/sftp/id_ed25519
              GATUS_URL: https://uptime.${ROOT_DOMAIN}
              GATUS_CONNECT_TO: uptime.${ROOT_DOMAIN}:443:dockge-as.${TAILSCALE_DOMAIN}:443
              GATUS_TOKEN: openbao-break-glass_restore-test
              # The estate age identity, from the same Secret/sops-age the
              # common component stamps into every namespace for Flux. The
              # cluster already holds this material; mounting it here adds no
              # new exposure — and it is exactly the key RUNBOOK Scenario B
              # says a human will use, so the test exercises the real path.
              AGE_KEY_FILE: /secrets/sops-age/age.agekey
              # A dump older than this is treated as a FAILED test even if it
              # restores cleanly — it means replication has silently stopped
              # and the "latest" backup is stale.
              MAX_DUMP_AGE_DAYS: "3"
              SCRATCH_PG_URI: postgres://openbao:restore-test@localhost:5432/openbao
              SCRATCH_PG_USER: *scratchUser
              SCRATCH_PG_PASSWORD: *scratchPw
              SCRATCH_PG_DB: *scratchDb
              # Same transit path the real cluster unseals through.
              TRANSIT_ADDR: http://dockge-as.${TAILSCALE_DOMAIN}:8200
              # ANCHORED because ./canary-check.sh's controller reads the same
              # path and the two must never disagree — a checker watching a
              # different key than the test it front-runs is worse than no
              # checker. This value also has four counterparts OUTSIDE this file
              # (bootstrap/openbao/restore-test.sh's CANARY_PATH,
              # docker/alpha-site/bao-standby/restore.sh, bootstrap/RUNBOOK.md,
              # and the live `restore-test` policy); scripts/bao-reorg/plan.ts
              # names them and they change in lockstep or break-glass
              # verification fails. The live policy lagging that lockstep on
              # 2026-09-05 is the whole reason canary-check exists.
              CANARY_PATH: &canaryPath secrets/data/third-party-tokens/cloudflare/driscoll-tech
              VAULT_TRANSIT_SEAL_TOKEN:
                valueFrom:
                  secretKeyRef:
                    # Owned by the openbao app — referenced, not copied, so a
                    # re-minted token never needs a second edit here.
                    name: openbao-seal
                    key: transit-token
              BAO_ROLE_ID:
                valueFrom:
                  secretKeyRef:
                    name: openbao-replica-restore
                    key: role-id
              BAO_SECRET_ID:
                valueFrom:
                  secretKeyRef:
                    name: openbao-replica-restore
                    key: secret-id
            command:
              - /bin/sh
              - -c
              - >-
                set -eu;
                apk add --no-cache bash coreutils postgresql18-client age rclone curl jq
                && exec bash /scripts/restore-test.sh
            resources:
              requests:
                memory: 512Mi
                cpu: 50m
              limits:
                memory: 1Gi
                cpu: "1"

      # The daily half of Scenario D. ./resources/canary-check.sh's header has
      # the full argument; the short version is that the monthly restore test
      # covers six steps that depend on the DUMP and one that depends on
      # server-side GRANT state, and only the grant can rot with nobody
      # touching this repo. Testing just that one, daily, turns a month of
      # silence into a day.
      #
      # Deliberately the cheapest controller here: no SFTP, no scratch
      # Postgres, no age identity, no transit. It logs in with the AppRole the
      # restore test already carries and reads one key. Nothing it touches can
      # affect the nightly dump or the monthly test.
      canary-check:
        annotations:
          reloader.stakater.com/auto: "true"
        type: cronjob
        cronjob:
          # 04:00 daily: after the 03:00 dump, well clear of the 05:00 monthly
          # restore test on the 1st. It reads live server state and shares no
          # resource with either, so the spacing is for legible logs rather
          # than contention.
          schedule: "0 4 * * *"
          backoffLimit: 2
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 300
          successfulJobsHistory: 1
          failedJobsHistory: 3
          suspend: false
        containers:
          main:
            image: *baoImage
            securityContext: *rootCtx
            env:
              # openbao-active, not openbao: the general Service also routes to
              # standbys, and a standby answers a read with a 307 to the leader
              # rather than the data. Same address every in-cluster consumer
              # uses (kubernetes/components/postgres/database/credentials.yaml,
              # the pulumi stacks).
              #
              # In-cluster on purpose, NOT bao.${ROOT_DOMAIN}: this check must
              # stay up when DNS, the gateway or the external cert is what is
              # broken, because none of those say anything about the grant.
              BAO_ADDR: http://openbao-active.kube-system.svc.cluster.local:8200
              CANARY_PATH: *canaryPath
              GATUS_URL: https://uptime.${ROOT_DOMAIN}
              GATUS_CONNECT_TO: uptime.${ROOT_DOMAIN}:443:dockge-as.${TAILSCALE_DOMAIN}:443
              GATUS_TOKEN: openbao-break-glass_canary-check
              # THE SAME low-privilege AppRole the monthly test uses — read on
              # one path and nothing else. That is the point: this proves the
              # credential a human would break glass with still works, using
              # only that credential. No admin token is parked in the cluster,
              # which is why this is a CronJob and `restore-test.sh status` is
              # not (that reads the policy document and needs admin).
              BAO_ROLE_ID:
                valueFrom:
                  secretKeyRef:
                    name: openbao-replica-restore
                    key: role-id
              BAO_SECRET_ID:
                valueFrom:
                  secretKeyRef:
                    name: openbao-replica-restore
                    key: secret-id
            command:
              - /bin/sh
              - -c
              - >-
                set -eu;
                apk add --no-cache bash coreutils curl jq
                && exec bash /scripts/canary-check.sh
            resources:
              requests:
                memory: 64Mi
                cpu: 10m
              limits:
                memory: 128Mi
                # A whole core, not a "right-sized" 200m: a fractional limit is
                # CFS-throttled even on an idle node, which only slows the
                # `apk add` this job spends most of its runtime in. The request
                # is what reserves capacity; this is a ceiling. Same value as
                # restore-test above, and Codacy's no-fractional-cpu-limits
                # rule flags anything less.
                cpu: "1"

    persistence:
      scripts:
        type: configMap
        name: openbao-replica-scripts
        defaultMode: 493
        globalMounts:
          - path: /scripts
      sftp-key:
        type: secret
        name: openbao-replica-sftp
        defaultMode: 256
        advancedMounts:
          dump:
            main:
              - path: /secrets/sftp
          restore-test:
            main:
              - path: /secrets/sftp
      # The client certificate the dump now authenticates with. Same Secret the
      # openbao StatefulSet mounts at /etc/pg-certs; 256 is 0400 octal.
      pg-client-cert:
        type: secret
        name: openbao-pg-client-cert
        defaultMode: 256
        advancedMounts:
          dump:
            main:
              - path: /etc/pg-certs
      sops-age:
        type: secret
        name: sops-age
        defaultMode: 256
        advancedMounts:
          restore-test:
            main:
              - path: /secrets/sops-age
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      pgdata:
        type: emptyDir
        advancedMounts:
          restore-test:
            postgres:
              - path: /var/lib/postgresql/data
