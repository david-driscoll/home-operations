---
fullnameOverride: coredns
image:
  repository: mirror.gcr.io/coredns/coredns
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: "${CLUSTER_IP}"
replicaCount: 2
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: log
        configBlock: |-
          class error
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        parameters: 30
      - name: loop
      - name: reload
      - name: loadbalance
  # Technitium cluster node names: rewrite <node>.dns.driscoll.tech to the
  # node's tailnet name (dns-<node>) and resolve it via the tailscale operator
  # nameserver, which maps it to the in-cluster egress service ClusterIP. This
  # is what lets the in-cluster technitium secondary reach its cluster peers
  # (heartbeat/config sync) without hardcoded addresses.
  - zones:
      - zone: dns.driscoll.tech
        scheme: dns://
        use_tcp: false
    port: 53
    plugins:
      - name: errors
      - name: cache
        parameters: 30
      - name: rewrite
        parameters: name regex ([a-z0-9-]+)\.dns\.driscoll\.tech dns-{1}.${TAILSCALE_DOMAIN} answer auto
      - name: forward
        parameters: . "${TAILSCALE_NAMESERVER_IP}"
  # Dockge hosts by their canonical names: dockge-*.driscoll.tech resolves to
  # tailnet IPs on the estate's split-horizon DNS, which cluster nodes cannot
  # route. Same trick as the dns.driscoll.tech block above — exact-name zones,
  # rewritten to the tailnet name and resolved via the tailscale operator
  # nameserver to the in-cluster egress service ClusterIP
  # (tailscale-system/services/*.yaml, which carry the matching ports).
  # This is what lets Home Assistant use dockge-luna.driscoll.tech for the
  # voice pipeline (llm 8080 / stt 10300 / tts 10200) and
  # dockge-celestia.driscoll.tech for llama-agent (8081); the other two hosts
  # get their standard 443/22 egress under the same names.
  #
  # Deliberately exact names rather than a driscoll.tech catch-all: the apex
  # also carries this cluster's own *.<cluster>.driscoll.tech ingresses, other
  # clusters' VIPs (e.g. alertmanager.driscoll.tech), and the ACME lookups
  # cert-manager depends on. CoreDNS's rewrite has no NXDOMAIN fallthrough, so
  # a catch-all would hard-fail every name that has no tailnet counterpart.
  - zones:
      - zone: dockge-celestia.driscoll.tech
        scheme: dns://
        use_tcp: false
      - zone: dockge-luna.driscoll.tech
        scheme: dns://
        use_tcp: false
      - zone: dockge-as.driscoll.tech
        scheme: dns://
        use_tcp: false
      - zone: dockge-skystar.driscoll.tech
        scheme: dns://
        use_tcp: false
    port: 53
    plugins:
      - name: errors
      - name: cache
        parameters: 30
      - name: rewrite
        parameters: name regex (dockge-[a-z0-9-]+)\.driscoll\.tech {1}.${TAILSCALE_DOMAIN} answer auto
      - name: forward
        parameters: . "${TAILSCALE_NAMESERVER_IP}"
  # The rest of driscoll.tech, resolved against the INTERNAL authoritative zone
  # (Technitium) first and the node's upstream only if Technitium is down.
  #
  # WHY. Until this block, driscoll.tech fell through to `.` above, which
  # forwards to /etc/resolv.conf -- the node resolver, i.e. public Quad9. So
  # pods resolved internal hostnames through PUBLIC DNS, and only worked because
  # Cloudflare happened to carry a CNAME->RFC1918 record for every internal
  # route. Scoping external-dns by gateway (so one hostname can live on both
  # gateways) removed those records, and in-cluster resolution of 12 of the 21
  # internal names workloads here call went NXDOMAIN at once -- git, bao, s3,
  # registry, code, photos, renovate among them. The Pulumi `system` stack
  # stalled on `getaddrinfo ENOTFOUND git.driscoll.tech`.
  #
  # Pods now resolve these names the way every tailnet device already does:
  # acl-manager.ts sets `overrideLocalDns: true` with the Technitium nodes as
  # nameservers, so the internal zone is already the estate's resolver of record.
  #
  # THIS IS NOT THE CATCH-ALL THE dockge BLOCK ABOVE WARNS AGAINST. That warning
  # is about a REWRITE to tailnet names, which hard-fails every name with no
  # tailnet counterpart. This is a FORWARD to the authoritative zone, which
  # carries all of those names -- checked before landing: all 21 hostnames
  # in-cluster code references resolve in Technitium, and none resolve
  # publicly that do not also resolve there. The ACME lookups that warning
  # mentions do not come through here at all: cert-manager checks DNS-01 over
  # DoH to Quad9 with dns01RecursiveNameserversOnly (cert-manager/helm/values.yaml).
  #
  # The more specific dns.driscoll.tech and dockge-*.driscoll.tech blocks still
  # win for their names -- CoreDNS routes a query to the most specific zone.
  #
  # The upstream is the TECHNITIUM_CLUSTER_IP substitution: a pinned ClusterIP
  # Service on the in-cluster Technitium, NOT its ipvlan address (the
  # TECHNITIUM_VIP substitution). See the `dns` service in
  # apps/equestria/dns/technitium/helmrelease.yaml for why the ipvlan address
  # would time out from whichever CoreDNS replica shares a node with it.
  #
  # (Variable names are spelled without the dollar-brace form in these comments
  # on purpose: this file is slurped into a ConfigMap, and Flux postBuild
  # envsubst expands that form even inside a comment -- eso-values-lint.)
  - zones:
      - zone: driscoll.tech
        scheme: dns://
        use_tcp: false
    port: 53
    plugins:
      - name: errors
      - name: cache
        parameters: 30
      - name: forward
        # Two upstreams, tried IN ORDER. plugin/pkg/parse HostPortOrFile parses
        # each argument independently -- an IP becomes ip:53, a path is read as
        # resolv.conf -- so the second entry is exactly the upstream this zone
        # used before, not a new egress path.
        #
        # ⚠️ The fallback is for Technitium being UNREACHABLE, not for a missing
        # record. forward only moves on when an upstream is unhealthy; an
        # authoritative NXDOMAIN from Technitium is returned as-is. That is the
        # intended behaviour: Technitium is a single replica, and without the
        # fallback its restart would take in-cluster resolution of the whole
        # zone with it. With it, an outage degrades to how this zone behaved
        # before this block existed.
        parameters: . "${TECHNITIUM_CLUSTER_IP}" /etc/resolv.conf
        configBlock: |-
          policy sequential
  # Tailscale DNS stub zone for ts.net domains
  - zones:
      - zone: ts.net
        scheme: dns://
        use_tcp: false
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: log
        configBlock: |-
          class all
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: forward
        parameters: . "${TAILSCALE_NAMESERVER_IP}"
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "DoNotSchedule"
    labelSelector:
      matchLabels:
        k8s-app: kube-dns
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
