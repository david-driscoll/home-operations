---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-etcd-restic-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: talos-etcd-restic-keys
    creationPolicy: Owner
    # Where the etcd repository lives: the `etcd` prefix of the
    # `volsync-equestria` Garage bucket, beside every VolSync app's
    # (docs/plans/host-owned-backups.md, phase 3 step 4). It has the VolSync
    # movers' key, password and route, in the shape of
    # kubernetes/components/volsync/externalsecret.yaml, where the route is
    # explained. The backup and prune CronJobs take everything from this
    # Secret through envFrom and set no repository of their own.
    #
    # Its old repository, /mnt/stash/backup/<cluster>/volsync/etcd on TrueNAS,
    # stays read-only until step 7. garage-history-copy carried its snapshots
    # across.
    #
    # The label is what the copy tier's scan matched
    # (stacks/system/application-backups.ts). That scan skips `s3:`
    # repositories, so it no longer picks this one up; TrueNAS's pull of the
    # bucket is the independent copy now. The label stays until step 6 retires
    # the scan.
    template:
      metadata:
        labels:
          volsync: "true"
      data:
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: "s3:{{ .garage_endpoint }}/{{ .garage_bucket }}/etcd"
        AWS_ACCESS_KEY_ID: "{{ .garage_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_password }}"
        AWS_DEFAULT_REGION: "{{ .garage_region }}"
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        # was: Volsync Password
        key: apps/volsync/password
        property: credential
  dataFrom:
    # The movers' Garage key, written by stacks/system (garage.ts) with the
    # bucket and endpoint beside it. ESO fails the WHOLE ExternalSecret on one
    # unreadable extract, so move this line in the same change that moves or
    # renames the record.
    - extract:
        key: clusters/equestria/apps/volsync/garage
      rewrite:
        - regexp:
            source: "(.*)"
            target: "garage_$1"
