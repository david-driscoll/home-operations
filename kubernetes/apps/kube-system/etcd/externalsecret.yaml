---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-etcd-restic-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: talos-etcd-restic-keys
    creationPolicy: Owner
    # The label and RESTIC_REPOSITORY make this repo visible to the copy tier.
    # stacks/system/application-backups.ts finds restic repos by listing
    # Secrets labelled volsync=true and reading RESTIC_REPOSITORY, which is how
    # every VolSync repo reaches celestia, luna and skystar. This Secret carried
    # neither, so the etcd repo (/mnt/stash/backup/<cluster>/volsync/etcd) had
    # exactly one copy, on TrueNAS. Same shape as
    # kubernetes/components/volsync/externalsecret.yaml; the scan names it
    # `equestria-volsync-etcd` after the path's last segment.
    #
    # The CronJobs keep their explicit RESTIC_REPOSITORY env, which wins over
    # this key through envFrom and carries the same value. See
    # docs/plans/host-owned-backups.md, phase 0 step 0.3; phase 3 moves the repo
    # into Garage and retires the scan.
    template:
      metadata:
        labels:
          volsync: "true"
      data:
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        RESTIC_REPOSITORY: /repository/etcd
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        # was: Volsync Password
        key: apps/volsync/password
        property: credential
