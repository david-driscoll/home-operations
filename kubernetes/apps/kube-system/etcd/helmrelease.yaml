---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app etcd-tasks
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      backup:
        type: cronjob
        cronjob:
          schedule: "12 4 * * *"
          parallelism: 1
          successfulJobsHistory: 1
          failedJobsHistory: 1

        initContainers:
          talosctl:
            image:
              repository: ghcr.io/siderolabs/talosctl
              tag: v1.14.0@sha256:ff9b1177abf0874e963261c4937ce5f5e8080adde6ae49b4e13195f37bee1a67
            args:
              - --talosconfig
              - /var/run/secrets/talos.dev/config
              - -n
              - "$(CP_NODE_IP)"
              - -e
              - "$(CP_NODE_IP)"
              - etcd
              - snapshot
              - /data/etcd.snapshot
            env:
              - name: CP_NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP

        containers:
          restic:
            image:
              # docker.io/restic/restic, NOT the previous ghcr image. Same
              # version, the upstream project's own build, and still PUBLIC:
              # the old one now denies anonymous pulls outright -- its token
              # endpoint returns DENIED for any scope, so it cannot be fetched
              # from upstream at all any more.
              #
              # Nothing had failed yet, which is the dangerous part. spegel
              # still serves it from cache, so the nightly backup kept
              # completing while the only remaining copy was in-cluster. This
              # is the etcd backup -- a disaster-recovery path -- and it was one
              # cache eviction or one fresh node away from being unable to pull
              # its own image.
              #
              # It is also what Renovate had been failing on: a "no-result"
              # lookup for that package, so the image was receiving no updates
              # either. The warning only became visible once #1116 stopped
              # suppressing dependencyLookupWarnings.
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            workingDir: /data
            args:
              - backup
              - --host
              - kubernetes # set a consistent hostname to avoid restic rescans
              - . # use workingDir to get relative paths in backup
            envFrom:
              - secretRef:
                  name: talos-etcd-restic-keys
            env:
              - name: RESTIC_REPOSITORY
                value: /repository/etcd

        pod:
          hostNetwork: true
          hostPID: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          # The nodeSelector above PINS this job to the control planes, so once
          # `allowSchedulingOnControlPlanes: false` lands in
          # talos/patches/controller/cluster.yaml it becomes a contradiction:
          # a pod that selects the tainted nodes and does not tolerate the taint
          # is permanently unschedulable. It fails quietly -- the Job is created,
          # its pod sits Pending with "had untolerated taint", and nothing alerts.
          # See docs/cluster-consolidation/29-taint-readiness-audit.md.
          #
          # Verified with `helm template` against app-template 5.1.0 (the pinned
          # version in kubernetes/components/repos/app-template/ocirepository.yaml)
          # that controllers.<name>.pod.tolerations reaches the CronJob's
          # jobTemplate pod spec -- several charts ignore the obvious key.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
      defrag:
        type: cronjob
        cronjob:
          schedule: "3 9 * * *" # daily at 09:03
          parallelism: 1
          successfulJobsHistory: 1
          failedJobsHistory: 1

        containers:
          defrag:
            image:
              repository: ghcr.io/ahrtr/etcd-defrag
              tag: v0.44.0@sha256:7b0f66e51e484a635cc82a0656f9db67974c0d4f570eb3e90b929d3a2a3dc91f
            args:
              - --endpoints=https://127.0.0.1:2379
              - --cluster
              - --cacert=/certs/ca.crt
              - --cert=/certs/server.crt
              - --key=/certs/server.key
              # Defrag when DB quota usage > 50% OR free space > 100MB
              - --defrag-rule=dbQuotaUsage > 0.5 || dbSizeFree > 100*1024*1024
              # Move leader during defrag (safe for single-node)
              - --move-leader
              # Wait 30s between defrags
              - --wait-between-defrags=30s
              # Match the quota-backend-bytes set in Talos config
              - --etcd-storage-quota-bytes=8589934592
              # Auto-disalarm space quota alarms
              - --auto-disalarm
              - --disalarm-threshold=0.8
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              privileged: true
              runAsUser: 0

        pod:
          hostNetwork: true
          hostPID: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          # Same nodeSelector-pins-to-tainted-nodes contradiction as `backup`
          # above -- read the comment there.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
      prune:
        type: cronjob
        cronjob:
          schedule: "32 5 1 * *"
          successfulJobsHistory: 1
          failedJobsHistory: 1

        containers:
          restic:
            image:
              # Same swap and same reason as the backup container above.
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            args:
              - forget
              - --keep-last=7 # change me - set retention policy
              - --keep-weekly=4 # see: https://restic.readthedocs.io/en/latest/060_forget.html
              - --prune
            envFrom:
              - secretRef:
                  name: talos-etcd-restic-keys
            env:
              - name: RESTIC_REPOSITORY
                value: /repository/etcd
    defaultPodOptions:
      automountServiceAccountToken: true
    persistence:
      serviceaccount:
        type: secret
        name: etcd-talos
        advancedMounts:
          backup:
            talosctl:
              - path: /var/run/secrets/talos.dev
                readOnly: true
      certs:
        type: hostPath
        hostPath: /system/secrets/etcd
        advancedMounts:
          defrag:
            defrag:
              - path: /certs
                readOnly: true
      backupdata:
        type: emptyDir
        globalMounts:
          - path: /data
      repository:
        type: nfs
        server: "10.10.10.10"
        path: "/mnt/stash/backup/${CLUSTER_CNAME}/volsync"
