---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
#
# A ServiceMonitor rather than a PodMonitor because the chart DOES render a
# Service (unlike go-kube-downscaler and toolhive-operator next door).
#
# `targetPort` rather than `port`: the chart's Service port is unnamed
# (`- protocol: TCP / port: 10000 / targetPort: 10000`), and `port` takes a
# name. Naming it would require a fork of the chart; addressing the number does
# not.
#
# `/metrics` is served by the same HTTP server as `/health` and the strategy
# API, so this scrape shares a port with request-path traffic. That is upstream's
# design, not a local shortcut.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${APP}
spec:
  selector:
    matchLabels:
      # A ServiceMonitor selects SERVICES, by the Service's own
      # `metadata.labels` -- it never looks at pods. The chart does write
      # `app: sablier-<release>` onto the Deployment's pod template, and into
      # the Service's `spec.selector`, but it writes NO `app` label onto the
      # Service's own metadata. That metadata carries only:
      #
      #   app.kubernetes.io/managed-by: Helm
      #   helm.toolkit.fluxcd.io/name: sablier
      #   helm.toolkit.fluxcd.io/namespace: kube-system
      #
      # So the previous `app: sablier-sablier` here matched zero Services and
      # the scrape target was silently absent -- SablierAbsent fired from
      # 2026-09-05T20:14Z while the Deployment itself was a healthy 1/1. An
      # absent target and a dead Sablier look identical from Prometheus, which
      # is exactly the failure ./prometheusrule.yaml exists to catch, so this
      # selector being wrong disarmed that rule.
      #
      # Flux's label is the only stable identifier on that Service, and it
      # matches exactly one Service in this namespace.
      helm.toolkit.fluxcd.io/name: sablier
  endpoints:
    - targetPort: 10000
      path: /metrics
      interval: 1m
