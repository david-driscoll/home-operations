---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: py-kube-downscaler
  namespace: kube-system
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.3.12
    digest: sha256:261d8213ae8f9c4fb65d565589f85b5e365eb1af738c57356df52d329f2015bf
  url: oci://ghcr.io/caas-team/charts/py-kube-downscaler
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-downscaler
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: py-kube-downscaler
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    # Low Power mode's shed mechanism. See
    # docs/cluster-consolidation/24-power-states.md — "Mechanism".
    #
    # POLARITY, and it is two separate things:
    #   * SCOPE is opt-out — every workload is in scope unless it carries
    #     `downscaler/exclude: "true"` or lives in an excluded namespace. That is what
    #     makes a NEW app shed by default in Low Power without anyone remembering to
    #     opt it in.
    #   * ACTION is inert — with no DEFAULT_UPTIME/DEFAULT_DOWNTIME set, the upstream
    #     defaults are `always`/`never`, so this controller scales NOTHING until a
    #     namespace is annotated. Installing it changes no behaviour.
    #
    # The Full <-> Low Power toggle is therefore a live annotation, no Git commit:
    #   kubectl annotate namespace equestria downscaler/force-downtime=true  --overwrite
    #   kubectl annotate namespace equestria downscaler/force-downtime=false --overwrite
    #
    # `downscaler/force-downtime` is read from the NAMESPACE only — there is no
    # workload-level equivalent — and a per-workload `downscaler/exclude: "true"` beats
    # it (scaler.py `define_scope`, :97). That precedence is what lets the Low Power
    # keep-list (plex, jellyfin, immich, …) share the `equestria` namespace with the
    # shed-list. Original replica counts are stored per workload as
    # `downscaler/original-replicas` and restored on the way back up.
    arguments:
      - --interval=60
      - --include-resources=deployments,statefulsets,cronjobs,scaledobjects
      # NIGHTLY LOW POWER — 02:00-09:00 estate-local time, every day.
      #
      # This is the Low Power tier of docs/cluster-consolidation/24-power-states.md
      # on a schedule rather than a manual toggle. It sheds Tier 2 only: the
      # eleven keep-list workloads carry `downscaler/exclude: "true"` in Git and
      # survive, because `define_scope` short-circuits on exclude BEFORE any
      # uptime/downtime is evaluated (scaler.py:97) — the same precedence that
      # makes the manual toggle safe, verified by two live dry-run scans.
      #
      # It does NOT power any node off. Node shutdown is 24's other half and
      # needs a different mechanism; this is workloads only.
      #
      # FORMAT CONSTRAINTS, both load-bearing:
      #   * a spec cannot cross midnight — the downscaler only interprets ranges
      #     within a single day, so `22:00-06:00` would be silently wrong. 02:00
      #     to 09:00 is same-day, which is why this window works as written.
      #   * end must be later than start in 24-hour time.
      # Comma-separate for more windows; `Mon-Sun` is every day.
      #
      # ${TIMEZONE} comes from the `shared-secrets` Secret and is the estate's
      # single source of truth for local time (America/New_York today). It is
      # substituted here rather than hardcoded so this window and the Gatus
      # maintenance windows that mirror it can never drift apart.
      #
      # This resolves because components/common patches child Kustomizations to
      # add `shared-secrets` to substituteFrom -- verified on the LIVE
      # kube-downscaler Kustomization, not just inferred from the component.
      # A postBuild variable that does not resolve makes the Kustomization fail
      # rather than render an empty string, so a regression here is loud.
      #
      # The manual `downscaler/force-downtime` namespace toggle still works on
      # top of this for an ad-hoc window outside the nightly one.
      - --default-downtime=Mon-Sun 02:00-09:00 ${TIMEZONE}
      # `--dry-run` was REMOVED 2026-08-21, after two scans confirmed the shed-list
      # matched the design. The condition its SAFETY note set -- "remove this line only
      # after reading a full scan in the logs and confirming the would-be actions match
      # the intended shed-list" -- was met:
      #
      #   scan 1: 40 workloads, all in `equestria`, 9 of 11 keep-list survived. Found
      #           dynacat unannotated and three namespaces missing from the exclude
      #           list -- both fixed in #1005.
      #   scan 2: 40 workloads, 38 `equestria` + 2 `github-actions`, ALL 11 keep-list
      #           entries survived, `coder`/`database` untouched. Replica counts and
      #           CronJob suspend flags byte-identical before and after, cluster-wide.
      #
      # Removing it does NOT make this controller start acting. Scope is opt-out but
      # ACTION is inert: with no DEFAULT_UPTIME/DEFAULT_DOWNTIME set, upstream defaults
      # are `always`/`never`, so nothing is scaled until a namespace carries
      # `downscaler/force-downtime`. What changes is that the toggle now works -- which
      # is the point, and is also why a mistyped `kubectl annotate` is no longer
      # harmless. That is what `excludedNamespaces` below is for.

    # Tier 0 and Tier 1 (docs/cluster-consolidation/20-low-power-tier.md §1) can never be
    # shed. They are never annotated with force-downtime either, so this list is
    # belt-and-braces — its job is to make a mistyped `kubectl annotate` inert.
    excludedNamespaces:
      - py-kube-downscaler
      - kube-downscaler
      - kube-system
      - longhorn-system
      - cert-manager
      - nfs-system
      - flux-system
      - cloudnative-pg
      - volsync-system
      - openebs-system
      - network
      - stargate-command
      - tailscale-system
      # Tier 1 by 24 §1's amendment — these stay up during Battery.
      - observability
      - pulumi
      # Low Power keep-list namespace (24 "Keep-list"). Same belt-and-braces
      # reasoning as the Tier-0/1 entries above: it is never annotated with
      # `force-downtime`, so listing it only makes a mistyped `kubectl annotate`
      # inert.
      - coder
      # Same reasoning as `coder`: Tier 1, never annotated with force-downtime,
      # listed only so a mistyped `kubectl annotate` cannot take the estate's
      # git forge down. Its runner lives in `forgejo-runner`, which is
      # deliberately NOT here -- CI can wait out a window.
      - forgejo
      # `system-upgrade` holds tuppr, which drives Talos and Kubernetes node
      # upgrades. A nightly shed could stop it mid-upgrade — and tuppr does not
      # self-clear a Failed TalosUpgrade, it needs a generation bump. Excluded
      # because "CI can wait" does not extend to "the thing rebooting nodes can
      # be stopped halfway".
      - system-upgrade
      # `database` is not on the written keep-list but every keep-list app
      # depends on it. CNPG's Postgres is operator-managed and invisible to the
      # downscaler, but `valkey` is a plain Deployment and `postgres-backup` a
      # CronJob — shedding `database` would take the cache and the nightly
      # backup out from under Plex/Immich/n8n/FreshRSS while they keep running.
      - database
      #
      # NOT excluded, deliberately: `github-actions`. 24's keep-list carried it,
      # but David confirmed 2026-08-21 that it is safe to scale down — CI can
      # wait out a window. It is a *shed* namespace, so Low Power entry annotates
      # it alongside `equestria`.

    # This controller IS the Low Power shed mechanism, and Battery is entered
    # *from* Low Power -- so it has to be placeable on a control plane, or the
    # one thing that sheds Tier 2 is itself the first casualty of the taint.
    # Chart 0.3.12 renders .Values.tolerations into the Deployment pod spec --
    # verified with `helm template`.
    # See docs/cluster-consolidation/24-power-states.md and
    # docs/cluster-consolidation/20-low-power-tier.md §4.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
