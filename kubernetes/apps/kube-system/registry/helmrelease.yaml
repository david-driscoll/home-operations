---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app registry
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn: []
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        pod:
          # Tier 1 (docs/cluster-consolidation/20-low-power-tier.md §1). The pull
          # path is spegel -> zot -> zot-via-ingress -> upstream, and during a
          # low-power window the workers are off, so a cache that cannot run on a
          # control plane is a cache that is not there when image pulls matter
          # most — a crash-looping pod mid-window is exactly the case it covers.
          priorityClassName: critical-tier
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: false
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            # fsGroupChangePolicy: OnRootMismatch
            supplementalGroups:
              - 65542 # gladius:external-services
        initContainers:
          fix-permissions:
            image:
              repository: busybox
              tag: 1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - /bin/sh
              - -c
              - |
                chown -R 568:568 /var/lib/registry
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              capabilities:
                add:
                  - CHOWN
                  - FOWNER
        containers:
          *app :
            image:
              repository: ghcr.io/project-zot/zot
              tag: v2.1.20@sha256:542e25be4d32e7879c0cfad93492a93c81b1e059cbd2d30d485d4bd567318234
            env: []
            envFrom: []
            resources:
              requests:
                cpu: 50m
                # Idles around 240Mi; the spikes are sync-shaped, not steady, so
                # this stays small deliberately and the headroom lives in the limit.
                memory: 512Mi
              limits:
                # cpu: 1
                # 1Gi OOMKilled this pod 10x in 5h on 2026-08-22, and each kill
                # took an in-flight on-demand sync down with it. That is not a
                # crash-and-recover — it is a loop that cannot converge: a cold
                # pull of a multi-GB image (windmill 1.794.0, the trigger here)
                # asks zot to sync on demand, zot buffers layers while copying,
                # hits the limit, dies, and the manifest is never served. Every
                # containerd retry restarts the same doomed sync from zero, so
                # the image stays unpullable for as long as the limit stands.
                # Downstream that surfaced as `ErrImagePull ... not found` on an
                # image that returns HTTP 200 upstream, which reads like a bad
                # tag and is not one.
                memory: 4Gi
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 5
                  httpGet:
                    path: /livez
                    port: &port 8080
              readiness:
                enabled: true
                spec:
                  initialDelaySeconds: 10
                  httpGet:
                    path: /readyz
                    port: *port
              startup:
                enabled: true
                spec:
                  # zot does not listen until it has walked every repo in
                  # /var/lib/registry building metadb ("parsing storage and
                  # initializing", pkg/meta/parse.go). That scan is O(repos)
                  # against a 60Gi Longhorn RWX volume and grows as the cache
                  # fills -- it is already 82 repos.
                  #
                  # 10 + 3x10 gave it 40s. On a cold restart 2026-09-04 that
                  # was not enough: the probe killed the container mid-scan
                  # TWICE before a pass finally landed inside the budget.
                  # Nothing was wrong with zot either time. The failure mode
                  # is nasty out of proportion to the component -- if the
                  # scan ever exceeds the budget consistently, the registry
                  # crash-loops forever, and NOTHING in the cluster can pull
                  # an image, including the registry's own dependencies.
                  #
                  # 10 + 30x10 = 310s. failureThreshold is the right dial
                  # rather than initialDelaySeconds: a warm start still goes
                  # Ready on the first probe ~10s in, so this costs nothing
                  # in the normal case and only buys headroom for the cold
                  # one.
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
                  httpGet:
                    path: /startupz
                    port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 568
        runAsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "registry.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user

    persistence:
      config-file:
        type: configMap
        name: registry-values
        globalMounts:
          - path: /etc/zot/config.json
            subPath: config.json
            readOnly: true
          - path: /etc/credentials/credentials.json
            subPath: credentials.json
            readOnly: true
      registry:
        existingClaim: ${APP}
        globalMounts:
          - path: /var/lib/registry
      tmp:
        type: emptyDir
