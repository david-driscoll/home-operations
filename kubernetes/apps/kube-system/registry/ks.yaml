# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app registry
  namespace: &namespace kube-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: external-secrets
      namespace: kube-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/kube-system/registry
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  components:
    - ../../../components/failover/fast-node-eviction
    - ../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 60Gi
      VOLSYNC_ACCESSMODES: ReadWriteMany
      # Tier 1: one replica on each control plane, so the cache survives a
      # low-power window with every worker off. `longhorn` (the default) is
      # confined to `bulk`-tagged workers by piece 12, which is why all three
      # replicas sat on workers and none on the trio.
      #
      # storageClassName is IMMUTABLE on a bound PVC, so this does not migrate
      # the existing volume on its own — see the PR for the recreate. It is free
      # to do here because the cache is EMPTY (zot has never been in the pull
      # path; its catalog returns zero repositories), so there is nothing to
      # preserve and it refills on demand.
      VOLSYNC_STORAGECLASS: longhorn-critical
