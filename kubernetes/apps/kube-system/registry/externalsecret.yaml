---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-values
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  refreshPolicy: Periodic
  refreshInterval: 1m
  target:
    name: registry-values
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      templateFrom:
      - target: Data
        configMap:
          name: registry-values
          items:
          - key: config.json
            templateAs: Values
          - key: credentials.json
            templateAs: Values
  dataFrom:
    - extract:
        # was: Docker Hub
        key: third-party-tokens/docker-hub/api-key
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "docker_$1"
