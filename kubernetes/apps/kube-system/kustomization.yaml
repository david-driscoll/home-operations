---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
components:
  - ../../components/alerts
  - ../../components/common
  - ../../components/repos/app-template
resources:
  - ./1password/ks.yaml
  - ./cilium/ks.yaml
  - ./coredns/ks.yaml
  - ./descheduler/ks.yaml
  - ./metrics-server/ks.yaml
  - ./reloader/ks.yaml
  - ./features
  - ./secrets
  - ./spegel/ks.yaml
  - ./reflector/ks.yaml
  - ./snapshot-crds/ks.yaml
  - ./snapshot-controller/ks.yaml
  - ./external-secrets
  - ./registry/ks.yaml
  - ./etcd/ks.yaml
  - ./headlamp/ks.yaml
  - ./multus/ks.yaml
  - ./priority-class/ks.yaml
  - ./go-kube-downscaler/ks.yaml
  - ./sablier/ks.yaml
  - ./openbao/ks.yaml
  - ./openbao-replica/ks.yaml
  - ./vsc-retention/ks.yaml
  - ./keda/ks.yaml
patches:
  # The Namespace's PodSecurity level. A JSON patch, because kustomize ignores
  # `metadata.labels` on this file (#3162); scripts/podsecurity-label-lint fails
  # if it stops rendering. A no-op today: talos/control-plane/10-cluster.yaml
  # deletes the PodSecurity config, so the default is already privileged.
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
