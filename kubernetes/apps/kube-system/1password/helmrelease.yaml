---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  chart:
    spec:
      chart: connect
      version: 2.4.1
      sourceRef:
        kind: HelmRepository
        name: 1password
        namespace: flux-system
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    # Tier 0 (§1's named components): OpenBao cannot boot at exit without
    # external-secrets + onepassword-connect, so these must be placeable on a
    # control plane once §4's taint is live. Key verified against the chart.
    # Added after §8 Stage 2. See docs/cluster-consolidation/20-low-power-tier.md §4.
    connect:
      applicationName: onepassword-connect
      # `connect.tolerations` and `operator.tolerations` are separate keys in the
      # connect chart -- setting only one leaves the other pod untolerated.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      host: onepassword-connect
      annotations:
        reloader.stakater.com/auto: "true"
      serviceAnnotations:
        reloader.stakater.com/auto: "true"
      api:
        serviceMonitor:
          enabled: true
          interval: 30s
          path: "/metrics"
          params: {}
          annotations: {}

      credentialsName: onepassword-connect
      credentialsKey: 1password-credentials.json
      imagePullPolicy: IfNotPresent
      ingress:
        enabled: true
        ingressClassName: internal
        annotations:
          reloader.stakater.com/auto: "true"
          external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: "op-connect.${CLUSTER_DOMAIN}"
    operator:
      create: true
      # Tier 0: the ExternalSecrets stores depend on onepassword-connect, which
      # OpenBao's Kustomization transitively depends on -- so it must be placeable
      # on a control plane once §4's taint is live. `connect.tolerations` and
      # `operator.tolerations` are separate keys; both are set.
      # Added after §8 Stage 2. See docs/cluster-consolidation/20-low-power-tier.md §4.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      autoRestart: true
      imagePullPolicy: IfNotPresent
      pollingInterval: 600
      token:
        name: onepassword-connect
        key: access-token
