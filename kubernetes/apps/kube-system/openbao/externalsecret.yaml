---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The TLS client certificate OpenBao will authenticate to Postgres with, plus
# the cluster CA needed to verify the server. Phase 2 of
# docs/postgres-credentials/PLAN.md.
#
# INERT until BAO_PG_CONNECTION_URL asks for SSL. This lands the files on disk
# and proves the mount and the reloader wiring first, so the cutover itself is
# a one-line change to the URL.
#
# WHY ESO AND NOT REFLECTOR: both source Secrets are created by the CNPG
# operator, not by Flux, so nothing in git can put reflector's
# `reflection-allowed` annotation on them -- and reflector's explicit
# `reflects:` mode still requires it on the source. ClusterSecretStore/database
# is a `kubernetes` provider reading the `database` namespace directly, which
# is exactly this problem and is already how ${APP}-storage below works.
#
# Everything lands in ONE Secret on purpose: one volume to mount, and one
# object for reloader to watch. That matters -- pgx reads the certificate into
# its tls.Config once, at ParseConfig, so a renewed cert on disk is invisible
# to a running process. Reloader rolling the StatefulSet is what makes renewal
# take effect, and it only sees Secrets the pod actually mounts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pg-client-cert
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Well under the 7-day margin CNPG renews within, so a renewal is picked up
  # long before the old certificate expires.
  refreshInterval: 1h
  target:
    name: ${APP}-pg-client-cert
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        tls.crt: "{{ .cert_tls_crt }}"
        tls.key: "{{ .cert_tls_key }}"
        ca.crt: "{{ .ca_ca_crt }}"
  dataFrom:
    # Issued and auto-renewed by the DatabaseRole in
    # kubernetes/apps/database/postgres/app/openbao-role.yaml.
    - extract:
        key: openbao-client-cert
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "cert_$1"
    # serverCASecret and clientCASecret are the same Secret on this cluster.
    - extract:
        key: postgres-ca
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "ca_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# BAO_PG_CONNECTION_URL, taken from the generated `${APP}-postgres` secret
# rather than copied into secret.sops.yaml. `task update` writes that role's
# password once, in passwords.sops.yaml; a second hand-maintained copy would
# fork from it the next time the role rotates and nothing would catch the
# mismatch until OpenBao failed to reach its own storage.
#
# The `uri` key is already exactly the form the Postgres backend wants:
#   postgres://openbao:<pw>@postgres-rw.database.svc.cluster.local:5432/openbao?sslmode=disable
#
# This does NOT reintroduce the bootstrap cycle the ks.yaml comment warns about.
# ClusterSecretStore/database is a `kubernetes` provider reading the `database`
# namespace directly — it is not backed by 1Password and will not be backed by
# OpenBao, so OpenBao is never a link in the chain that starts OpenBao. The only
# new coupling is ordering: external-secrets must be running first, which is why
# it is now a dependsOn in ks.yaml.
#
# The transit token has no such source and stays in secret.sops.yaml.
#
# Named `-storage`, not `-postgres`: the generated secret this reads from is
# already called `openbao-postgres` over in the `database` namespace, and two
# different objects under one name across two namespaces is a trap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-storage
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-storage
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        pg-connection-url: "{{ .postgres_uri }}"
  dataFrom:
    - extract:
        key: ${APP}-postgres
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "postgres_$1"
