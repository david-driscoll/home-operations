---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The TLS client certificate OpenBao will authenticate to Postgres with, plus
# the cluster CA needed to verify the server. Phase 2 of
# docs/postgres-credentials/PLAN.md.
#
# INERT until BAO_PG_CONNECTION_URL asks for SSL. This lands the files on disk
# and proves the mount and the reloader wiring first, so the cutover itself is
# a one-line change to the URL.
#
# WHY ESO AND NOT REFLECTOR: both source Secrets are created by the CNPG
# operator, not by Flux, so nothing in git can put reflector's
# `reflection-allowed` annotation on them -- and reflector's explicit
# `reflects:` mode still requires it on the source. ClusterSecretStore/database
# is a `kubernetes` provider reading the `database` namespace directly, which
# is exactly this problem and is already how ${APP}-storage below works.
#
# Everything lands in ONE Secret on purpose: one volume to mount, and one
# object for reloader to watch. That matters -- pgx reads the certificate into
# its tls.Config once, at ParseConfig, so a renewed cert on disk is invisible
# to a running process. Reloader rolling the StatefulSet is what makes renewal
# take effect, and it only sees Secrets the pod actually mounts.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pg-client-cert
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  # Well under the 7-day margin CNPG renews within, so a renewal is picked up
  # long before the old certificate expires.
  refreshInterval: 1h
  target:
    name: ${APP}-pg-client-cert
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        tls.crt: "{{ .cert_tls_crt }}"
        tls.key: "{{ .cert_tls_key }}"
        ca.crt: "{{ .ca_ca_crt }}"
  dataFrom:
    # Issued and auto-renewed by the DatabaseRole in
    # kubernetes/apps/database/postgres/app/openbao-role.yaml.
    - extract:
        key: openbao-client-cert
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "cert_$1"
    # serverCASecret and clientCASecret are the same Secret on this cluster.
    - extract:
        key: postgres-ca
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "ca_$1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
#
# The SUPERUSER certificate the database secrets engine rotates other roles'
# passwords with. Phase 3a of docs/postgres-credentials/PLAN.md.
#
# INERT: nothing reads these files until the engine is configured from Pulumi in
# 3b. Landing the projection and the mount first means 3b is a pure OpenBao-side
# change with no Kubernetes moving parts left to get wrong.
#
# A SEPARATE Secret and a separate mount from ${APP}-pg-client-cert, on purpose.
# That one is the unprivileged `openbao` storage identity; this one is a
# PostgreSQL superuser. Sharing a directory would put a superuser key one
# `sslcert=` typo away from the storage connection, and would make "which cert
# does this path hold" a question rather than a fact.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pg-admin-cert
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: ${APP}-pg-admin-cert
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        tls.crt: "{{ .cert_tls_crt }}"
        tls.key: "{{ .cert_tls_key }}"
        ca.crt: "{{ .ca_ca_crt }}"
  dataFrom:
    # Issued and auto-renewed by the DatabaseRole in
    # kubernetes/apps/database/postgres/app/baoadmin-role.yaml.
    - extract:
        key: baoadmin-client-cert
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "cert_$1"
    - extract:
        key: postgres-ca
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "ca_$1"
