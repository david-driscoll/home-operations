---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# "A Flux object has been broken for a while" -- the signal the estate did not
# have until 2026-09-20.
#
# WHAT WENT UNNOTICED: media/jellyfin-pg's Kustomization stopped applying on
# 2026-09-18 and failed 510 more times before anyone looked -- 386 attempts on
# one revision, 39 on the next, 85 on the one after, each rejected in under
# half a second because the PVC declared 20Gi against a volume already at 40Gi
# (fixed in #1903). For two days it served a stale revision and said so only in
# its own status.
#
# `components/alerts` was already wired into every namespace, including this
# one, and it is NOT the thing that was missing: it forwards Flux EVENTS to
# Alertmanager, one per occurrence. An event says "this reconcile failed"; it
# cannot say "this has been failing since Thursday". Duration is what makes a
# stuck object legible, and duration is a metric question.
#
# ⚠️ THE OBVIOUS RULE FROM THE FLUX DOCS MATCHES NOTHING HERE. Every published
# example alerts on `gotk_reconcile_condition{type="Ready",status="False"}`.
# That metric does not exist in this cluster -- verified against Prometheus,
# which knows only the notification-controller's `gotk_*_http_*` server
# metrics. The controllers are scraped and healthy (`up{namespace="flux-system"}`
# is 1 for all five); this Flux simply does not publish per-object condition
# metrics. What does is `flux_resource_info`, from the flux-operator PodMonitor
# next to this file, which carries the state in labels: ready, reason,
# revision, suspended.
#
# It covers everything in one rule -- 280 Kustomizations, 155 HelmReleases and
# the sources behind them, 585 objects at the time of writing.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-resource-rules
spec:
  groups:
    - name: flux-resource.rules
      rules:
        - alert: FluxResourceNotReady
          annotations:
            summary: >-
              Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has been not ready for 30 minutes.
            description: >-
              This object is not converging on its own. Nothing here says why,
              deliberately -- see the aggregation note below -- so get the
              reason from the cluster:
              `flux get {{ $labels.kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}`,
              or the `reason` label on
              flux_resource_info{kind="{{ $labels.kind }}",name="{{ $labels.name }}"}.
              A sub-second ReconciliationFailed is an apply the API server
              rejected; a long one is usually a health check timing out.
          # ⚠️ THE `max by (...)` IS LOAD-BEARING, NOT TIDINESS. `reason` and
          # `revision` are LABELS on this metric, so without the aggregation
          # every new commit and every change of failure reason starts a NEW
          # series and restarts the `for:` clock. jellyfin-pg alternated
          # between DependencyNotReady and ReconciliationFailed and moved
          # across four revisions while it was broken -- exactly the shape that
          # would have reset the timer forever and never fired. Aggregating to
          # (kind, namespace, name) keeps one stable series per object for as
          # long as it stays unready, which is the thing being measured.
          #
          # The cost is that the alert cannot name the reason, hence the
          # lookups in the description above.
          #
          # `suspended="False"` excludes objects deliberately parked. Nothing
          # in the estate is suspended today, so this filter is insurance
          # rather than load-bearing -- but a suspended object is not
          # reconciling ON PURPOSE and must never page.
          expr: |-
            max by (kind, exported_namespace, name) (
              flux_resource_info{ready="False", suspended="False"}
            ) == 1
          # 30m, chosen against what normal looks like here rather than a round
          # number. App Kustomizations reconcile hourly and retry failures
          # every 2-5m, so a genuinely broken object re-fails six or more times
          # inside this window. The transient to ride out is dependency churn:
          # when a merge lands, every Kustomization in the estate takes the new
          # revision at once and dependents report DependencyNotReady while
          # their dependencies rebuild. Measured on 2026-09-20 that lasted
          # about ten minutes, so 30m clears it three times over.
          for: 30m
          labels:
            severity: warning
