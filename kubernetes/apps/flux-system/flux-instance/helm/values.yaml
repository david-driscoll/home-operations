---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/charts/refs/heads/main/charts/flux-instance/values.schema.json
instance:
  distribution:
    # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
    version: 2.9.4
    registry: "ghcr.io/fluxcd"
  cluster:
    networkPolicy: false
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    name: flux-system
    kind: GitRepository
    url: "https://github.com/david-driscoll/home-operations.git"
    ref: "refs/heads/main"
    path: kubernetes/flux/cluster
  kustomize:
    patches:
    - # Tolerate the control-plane taint that arrives with
      # allowSchedulingOnControlPlanes: false.
      #
      # This has to be a kustomize patch. The FluxInstance CRD has no
      # tolerations/nodeSelector field -- checked against the flux-instance
      # chart 0.58.0 values schema, which exposes only distribution,
      # components, cluster, commonMetadata, storage, sharding, sync and
      # kustomize.patches. flux-operator owns these Deployments and reconciles
      # them continuously, so patching them by hand (or with a postRenderer on
      # some other release) would simply be reverted; kustomize.patches is the
      # managed path and is what the rest of this file already uses.
      #
      # These are Deployments, so nothing breaks without this -- the four
      # controllers would just be confined to the two worker nodes. See the PR
      # description for the argument about whether that is actually desirable
      # on 4-core/16GiB control planes.
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: all
        spec:
          template:
            spec:
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
      target:
        kind: Deployment
        name: (kustomize-controller|helm-controller|source-controller|notification-controller)
    - # Increase the number of workers
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=10
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --requeue-dependency=5s
      target:
        kind: Deployment
        name: (kustomize-controller|helm-controller|source-controller)
    - # Increase the memory limits
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: all
        spec:
          template:
            spec:
              containers:
                - name: manager
                  resources:
                    limits:
                      memory: 1Gi
      target:
        kind: Deployment
        name: (kustomize-controller|helm-controller|source-controller)
    - # Enable in-memory kustomize builds
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=20
        - op: replace
          path: /spec/template/spec/volumes/0
          value:
            name: temp
            emptyDir:
              medium: Memory
      target:
        kind: Deployment
        name: kustomize-controller
    - # Enable Helm repositories caching.
      #
      # --helm-cache-max-size is a COUNT of cached repo indexes, not a byte budget
      # ("The maximum size of the cache in number of indexes."), and the cache has
      # NO eviction: source-controller's Set() returns "Cache is full" rather than
      # evicting anything. The first N keys to land therefore hold their slots and
      # every other repo is starved permanently. The estate has 24 HelmRepositories
      # (all spec.type default, all referenced by the 29 HelmCharts); at 10 that
      # left TEN of them at a 0% hit rate -- openebs, external-dns, longhorn,
      # k8s-gateway, coder-v2, cloudnative-pg, node-feature-discovery, cloudflare,
      # authentik, tailscale -- logging CacheOperationFailed ~450x/day for an
      # overall hit rate of 41.3%. Nothing was broken by this; on a full cache the
      # index is simply re-read and re-parsed from disk.
      #
      # 100 is a ceiling, not an allocation: occupancy is bounded by the number of
      # live index revisions, and the entire 24-index corpus is 6.6 MiB serialized
      # against a 1Gi limit the pod currently sits at ~80Mi of. It is deliberately
      # far above the ~48 worst case (24 repos x a superseded revision) because the
      # only signal that this cap is too small is the "Cache is full" line that this
      # change exists to remove -- nobody would be watching for its return.
      #
      # Do NOT raise --helm-cache-ttl to "give entries more margin". The TTL is
      # SLIDING: helmchart_controller.go:618 calls SetExpiration on every hit, so a
      # key that is being read never expires. Measured under the current 60m, repos
      # whose HelmCharts are on a 1h interval sit at 98-100% (amd-device-plugin
      # 178/0, csi-driver-nfs 178/0, jetstack 177/0 hits/misses), while windmill at
      # a 30m interval -- well inside the TTL -- sits at 9.2%. Reconcile interval
      # does not predict hit rate; slot availability does. Expiry is also the ONLY
      # mechanism that ever frees a slot here, so a longer TTL makes superseded keys
      # squat and erodes the headroom this cap is buying.
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --helm-cache-max-size=100
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --helm-cache-ttl=60m
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --helm-cache-purge-interval=5m
      target:
        kind: Deployment
        name: source-controller
    - # Flux near OOM detection for Helm
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=OOMWatch=true
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --oom-watch-memory-threshold=95
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --oom-watch-interval=500ms
      target:
        kind: Deployment
        name: helm-controller
    - # Disable chart digest tracking
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=DisableChartDigestTracking=true
      target:
        kind: Deployment
        name: helm-controller
    - # Controller-level SOPS decryption
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --sops-age-secret=sops-age
      target:
        kind: Deployment
        name: kustomize-controller
    - # Watch configmaps and secrets attached to HelmReleases and Kustomizations
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --watch-configs-label-selector=owner!=helm
      target:
        kind: Deployment
        name: (helm-controller|kustomize-controller)
    - # Cancel health checks on new Kustomizations revisions
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=CancelHealthCheckOnNewRevision=true
      target:
        kind: Deployment
        name: kustomize-controller
