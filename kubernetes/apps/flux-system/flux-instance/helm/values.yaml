---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/charts/refs/heads/main/charts/flux-instance/values.schema.json
instance:
  distribution:
    # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
    version: 2.9.4
    registry: "ghcr.io/fluxcd"
  cluster:
    networkPolicy: false
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    name: flux-system
    kind: GitRepository
    url: "https://github.com/david-driscoll/home-operations.git"
    ref: "refs/heads/main"
    path: kubernetes/flux/cluster
  kustomize:
    patches:
    - # Tolerate the control-plane taint that arrives with
      # allowSchedulingOnControlPlanes: false.
      #
      # This has to be a kustomize patch. The FluxInstance CRD has no
      # tolerations/nodeSelector field -- checked against the flux-instance
      # chart 0.58.0 values schema, which exposes only distribution,
      # components, cluster, commonMetadata, storage, sharding, sync and
      # kustomize.patches. flux-operator owns these Deployments and reconciles
      # them continuously, so patching them by hand (or with a postRenderer on
      # some other release) would simply be reverted; kustomize.patches is the
      # managed path and is what the rest of this file already uses.
      #
      # These are Deployments, so nothing breaks without this -- the four
      # controllers would just be confined to the two worker nodes. See the PR
      # description for the argument about whether that is actually desirable
      # on 4-core/16GiB control planes.
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: all
        spec:
          template:
            spec:
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
      target:
        kind: Deployment
        name: (kustomize-controller|helm-controller|source-controller|notification-controller)
    - # Increase the number of workers.
      #
      # kustomize-controller does NOT end up on 10: the "Raise kustomize-controller
      # concurrency" patch further down appends a second `--concurrent` for it, and
      # the last occurrence wins. Both are left in place rather than folded together
      # because this patch targets three controllers and that one targets only
      # kustomize-controller. If you are reading a live `args` array and seeing two
      # `--concurrent` values, that is why, and the SECOND one is in effect.
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=10
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --requeue-dependency=5s
      target:
        kind: Deployment
        name: (kustomize-controller|helm-controller|source-controller)
    - # Increase the memory limits
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: all
        spec:
          template:
            spec:
              containers:
                - name: manager
                  resources:
                    limits:
                      memory: 1Gi
      target:
        kind: Deployment
        name: (kustomize-controller|helm-controller|source-controller)
    - # Enable in-memory kustomize builds, and raise kustomize-controller
      # concurrency (overrides the `--concurrent=10` set above for all three).
      #
      # 20, and DO NOT RAISE IT WITHOUT RAISING THE MEMORY LIMIT ABOVE IN THE SAME
      # CHANGE. It was briefly 64 on 2026-08-28 and that OOMKilled the controller
      # into CrashLoopBackOff within two minutes of merging, stopping GitOps
      # cluster-wide (exit 137, 7 restarts, 217 Kustomizations frozen).
      #
      # The reason is the `medium: Memory` volume in this same patch: /tmp is a
      # tmpfs, and tmpfs pages count against the container's memory limit. So
      # concurrency and memory are COUPLED here -- `--concurrent` is the number of
      # kustomize build trees held in RAM at once, on top of the controller's own
      # heap. ~127Mi steady state at 20 concurrent while idle says nothing about
      # 64 concurrent during a full 247-Kustomization reconcile wave, which is
      # exactly the mistake that was made.
      #
      # The reason someone will want to raise it: a parent app ks with `wait: true`
      # health-checks any nested Kustomization it applies, holding a worker for up
      # to its 10m timeout, while that child needs a worker of its own to progress.
      # Once the number of waiting parents reaches `--concurrent`, every worker is
      # held by a waiter and the pool deadlocks. That is real -- it took the cluster
      # to 131 of 247 not-Ready on 2026-08-28 -- but the fix that actually holds is
      # not to outrun it here. It is to keep nested-ks `dependsOn` pointed only at
      # things that do not flap, which is the rule ../../../components/postgres/ks.yaml
      # states and which components/tailscale/ks.yaml now follows.
      #
      # If a raise is genuinely needed, size the memory limit against
      # `--concurrent` x build-tree size first and verify under a full wave.
      #
      # A SECOND, slower-motion instance of the same failure hit on
      # 2026-08-29, at this same `--concurrent=20` / 1Gi pairing that
      # supposedly-safe combination -- no concurrency change this time, just
      # estate growth (this rollout alone added ~30 new Kustomizations under
      # kubernetes/apps/agents/). 129 restarts over 27h (not 7 over 2m: this
      # one starved slowly enough to go unnoticed rather than paging), 28
      # Kustomizations frozen across nine namespaces (not 217: caught before
      # cluster-apps itself fell over). Exit 137 every time, ~38s after
      # start -- each restart re-processes a backlog that only grows while
      # the pod is down, so the memory pressure gets WORSE with time, not
      # better; it does not self-heal.
      #
      # Fixed here by raising ONLY kustomize-controller's own memory limit
      # (this patch, layered on top of the shared 1Gi "all" patch above --
      # this is a LATER entry in kustomize.patches, so it wins for this one
      # controller, same "last occurrence wins" rule as --concurrent's own
      # comment states), not by touching --concurrent again. helm-controller
      # stays at the shared 1Gi: it does not carry the concurrent-build-trees-
      # in-tmpfs coupling that makes kustomize-controller the one that needs
      # headroom sized against estate growth. source-controller was reasoned
      # the same way here, and that reasoning held for two days -- see the
      # bottom of this file's patches list for why it stopped holding
      # (2026-08-30, source-controller's own memory raise).
      #
      # A THIRD instance, 2026-08-29, minutes after the 2Gi fix above merged
      # (#1316) -- 2Gi was not enough either. Same fast signature as the
      # first incident this time, not the slow one: 3 restarts in under 3
      # minutes, exit 137 every time, ~37s from container start to kill
      # (23:18:18 -> 23:18:55), caught mid-build of `cluster-apps` (the
      # single Kustomization covering the whole `./kubernetes/apps` tree)
      # while merging #1317, which froze reconciliation cluster-wide before
      # `cluster-apps` itself could ever record a Ready/False status. Node
      # (fluttershy) had 62GB allocatable at 20% used, so this is a
      # container-limit problem, not a capacity one. Raising to 4Gi rather
      # than re-deriving a tighter number: estate growth has now blown
      # through two successive "should be enough" limits inside 24h, and
      # `--concurrent` was left untouched both times, so there is no
      # cheaper knob to turn here without reopening the worker-starvation
      # deadlock the comment above already warns off.
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=20
        - op: replace
          path: /spec/template/spec/volumes/0
          value:
            name: temp
            emptyDir:
              medium: Memory
        - op: replace
          path: /spec/template/spec/containers/0/resources/limits/memory
          value: 4Gi
      target:
        kind: Deployment
        name: kustomize-controller
    - # Enable Helm repositories caching.
      #
      # --helm-cache-max-size is a COUNT of cached repo indexes, not a byte budget
      # ("The maximum size of the cache in number of indexes."), and the cache has
      # NO eviction: source-controller's Set() returns "Cache is full" rather than
      # evicting anything. The first N keys to land therefore hold their slots and
      # every other repo is starved permanently. The estate has 24 HelmRepositories
      # (all spec.type default, all referenced by the 29 HelmCharts); at 10 that
      # left TEN of them at a 0% hit rate -- openebs, external-dns, longhorn,
      # k8s-gateway, coder-v2, cloudnative-pg, node-feature-discovery, cloudflare,
      # authentik, tailscale -- logging CacheOperationFailed ~450x/day for an
      # overall hit rate of 41.3%. Nothing was broken by this; on a full cache the
      # index is simply re-read and re-parsed from disk.
      #
      # 100 is a ceiling, not an allocation: occupancy is bounded by the number of
      # live index revisions, and the entire 24-index corpus is 6.6 MiB serialized
      # against a 1Gi limit the pod currently sits at ~80Mi of. It is deliberately
      # far above the ~48 worst case (24 repos x a superseded revision) because the
      # only signal that this cap is too small is the "Cache is full" line that this
      # change exists to remove -- nobody would be watching for its return.
      #
      # Do NOT raise --helm-cache-ttl to "give entries more margin". The TTL is
      # SLIDING: helmchart_controller.go:618 calls SetExpiration on every hit, so a
      # key that is being read never expires. Measured under the current 60m, repos
      # whose HelmCharts are on a 1h interval sit at 98-100% (amd-device-plugin
      # 178/0, csi-driver-nfs 178/0, jetstack 177/0 hits/misses), while windmill at
      # a 30m interval -- well inside the TTL -- sits at 9.2%. Reconcile interval
      # does not predict hit rate; slot availability does. Expiry is also the ONLY
      # mechanism that ever frees a slot here, so a longer TTL makes superseded keys
      # squat and erodes the headroom this cap is buying.
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --helm-cache-max-size=100
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --helm-cache-ttl=60m
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --helm-cache-purge-interval=5m
      target:
        kind: Deployment
        name: source-controller
    - # Flux near OOM detection for Helm
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=OOMWatch=true
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --oom-watch-memory-threshold=95
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --oom-watch-interval=500ms
      target:
        kind: Deployment
        name: helm-controller
    - # Disable chart digest tracking
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=DisableChartDigestTracking=true
      target:
        kind: Deployment
        name: helm-controller
    - # Controller-level SOPS decryption
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --sops-age-secret=sops-age
      target:
        kind: Deployment
        name: kustomize-controller
    - # Watch configmaps and secrets attached to HelmReleases and Kustomizations
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --watch-configs-label-selector=owner!=helm
      target:
        kind: Deployment
        name: (helm-controller|kustomize-controller)
    - # Cancel health checks on new Kustomizations revisions
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=CancelHealthCheckOnNewRevision=true
      target:
        kind: Deployment
        name: kustomize-controller
    - # source-controller OOMKilled live on 2026-08-30, ~2d21h into its own
      # pod's life (created 2026-08-27T05:02:14Z), 22 restarts by the time it
      # was caught -- not the fast single-incident signature
      # kustomize-controller's own comment above describes, but the same
      # slow-motion one: exitCode 137, container Running one moment and
      # CrashLoopBackOff the next, no single triggering event found. The
      # symptom that actually surfaced it: the Service had ZERO endpoints,
      # so every consumer of a flux artifact -- not just this cluster's own
      # Kustomizations, but every pulumi-kubernetes-operator Workspace pod's
      # `fetch` init container too (`dial tcp ...:80: connect: connection
      # refused`) -- started failing at once. unifi-network's own Stack had
      # been separately failing on an unrelated, already-fixed DNS issue,
      # which is what surfaced this: its retry after that fix landed hung
      # for 28+ minutes at idle CPU instead of failing fast, because `fetch`
      # itself was the thing now broken, not the Pulumi program.
      #
      # Raised to 2Gi, not re-deriving a number from measured usage first --
      # this reasoning was explicitly "helm-controller and source-controller
      # stay at the shared 1Gi" above and it held for two days before this,
      # so treat this the same as kustomize-controller's own history: verify
      # under real load rather than assume 2Gi is now enough forever.
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/resources/limits/memory
          value: 2Gi
      target:
        kind: Deployment
        name: source-controller
