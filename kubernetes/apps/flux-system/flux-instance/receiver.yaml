---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/receiver-notification-v1.json
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-webhook
spec:
  type: github
  events: ["ping", "push"]
  secretRef:
    name: github-webhook-token-secret
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: flux-system
      namespace: flux-system
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: flux-system
      namespace: flux-system
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: home-operations
      namespace: pulumi
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: home-operations
      namespace: flux-system
    # Not something the cluster deploys from: its new-artifact event is what
    # tells the forge's copy of this repository to pull
    # (../../coder/forgejo-github-sync/gitrepository.yaml).
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: forgejo-github-sync
      namespace: coder
