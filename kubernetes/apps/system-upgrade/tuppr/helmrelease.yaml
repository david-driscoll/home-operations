---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: tuppr
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.5.7
    digest: sha256:80b9dc76d72d282b4497db300d253783e6c83bb6747fa6875235bfa6bc7c03bb
  url: oci://ghcr.io/home-operations/charts/tuppr
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    replicaCount: 1
    monitoring:
      serviceMonitor:
        enabled: true
      # This chart-managed PrometheusRule (TalosUpgradeStuck, TalosUpgradeFailed,
      # TupprUpgradeBlocked, TupprOperatorAbsent, ...) is the ONLY tuppr
      # alerting. It is what turns a wedged health check -- which tuppr waits on
      # forever, whatever `timeout` says -- into a page instead of a silent
      # stall. Do not disable it.
      #
      # A hand-written upgrades/alerts.yaml existed until 2026-09-21 and was
      # deleted: it was never in that directory's kustomization, so Flux never
      # applied it, and two of its three rules could not fire anyway
      # (`phase="Failed"} == 3` on a 0/1 gauge; a `phase="InProgress"` label
      # tuppr does not emit). The rules here cover the same ground correctly.
      prometheusRule:
        enabled: true
    webhook:
      enabled: true
