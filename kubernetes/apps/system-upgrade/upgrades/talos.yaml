---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.9
  policy:
    rebootMode: default
  healthChecks:
    # A wedged VolSync mover (e.g. a failed snapshot clone) can hold Synchronizing:
    # True indefinitely with no built-in timeout of its own. Bound this check so
    # one stuck backup job can't silently freeze node upgrades for days (2026-07
    # incident: fluttershy/othalla stayed cordoned a week because of this).
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
      timeout: 15m
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 15m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      description: Wait for degraded Longhorn volumes to finish rebuilding before draining the next node, so its replica isn't the last healthy copy
      expr: status.robustness != "degraded"
      timeout: 15m

  # ENABLED 2026-08-22, and it is now load-bearing rather than optional.
  #
  # The health check above gates every node drain on
  # `status.robustness != "degraded"`, and it names no volume -- it is
  # CLUSTER-WIDE, so ANY degraded volume anywhere stalls the next drain.
  #
  # The media config volumes (longhorn-media) deliberately keep replicas on
  # fluttershy and kerfuffle so the apps get a local replica during the day.
  # Those two nodes power off for the nightly Low Power window, which means
  # those replicas fail and their volumes read `degraded` from 02:00 to 09:00
  # every single night, by design.
  #
  # Without this window, tuppr would therefore be unable to drain a node for
  # seven hours a night, and would fail on the 15m timeout rather than wait --
  # silently, since a blocked upgrade looks the same as an idle one.
  #
  # 11:00 for 2h puts upgrades squarely inside the awake hours, when the media
  # workers are up and their replicas are healthy. Keep this window OUTSIDE
  # 02:00-09:00 for as long as longhorn-media keeps replicas on the shed nodes.
  maintenance:
    windows:
      - start: "0 11 * * *"    # Daily at 11
        duration: "2h"         # How long window stays open
        timezone: "${TIMEZONE}"
