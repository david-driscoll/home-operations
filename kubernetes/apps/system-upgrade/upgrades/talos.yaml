---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # Talos v1.14.0 stopped publishing `ghcr.io/siderolabs/installer`; v1.13.10
    # is the last release that image exists for, so a docker datasource on it
    # reports "up to date" forever and this field never moves -- which is a
    # SILENT stall, not a visible one: tuppr reports Completed and there is no
    # failing alert to notice. Track the releases themselves.
    #
    # Only the version string matters here. tuppr resolves the installer per
    # node from that node's own Image Factory schematic, e.g.
    # factory.talos.dev/metal-installer/946edf75...:v1.13.10 -- so nothing in
    # this repo ever referenced the retired image for an actual install.
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.1
  policy:
    rebootMode: default
  healthChecks:
    # HOW tuppr USES THESE (read from internal/healthcheck/checker.go and the
    # talosupgrade controller at 0.5.7, then confirmed against the 1.14.1 rollout
    # on 2026-09-20):
    #
    #   * All checks share ONE deadline: the largest `timeout` below (tuppr's
    #     floor is 10m). The per-check values are not per-check.
    #   * Every 10s all checks are re-evaluated; the gate opens only when every
    #     one passes in the same pass.
    #   * `timeout` does NOT bound the wait. When the deadline passes, tuppr sets
    #     `HealthChecking` / "Waiting for health checks", requeues after a
    #     minute and opens a fresh window. It never drains the next node past a
    #     failing check -- it waits for as long as the check keeps failing.
    #
    # So a wedged VolSync mover (e.g. a failed snapshot clone -- the 2026-07
    # incident, when fluttershy/othalla stayed cordoned a week) still blocks
    # upgrades indefinitely, and `timeout: 15m` was never going to change that.
    # What makes it NOT silent is the chart's `TalosUpgradeStuck` alert: 1h in
    # Upgrading|Rebooting|Draining|HealthChecking. It is enabled via
    # `monitoring.prometheusRule` in tuppr/helmrelease.yaml; see the note there.
    #
    # The timeout message misleads. On expiry tuppr reports only evaluation
    # ERRORS, and the final pass runs against the already-expired context -- so
    # every check reads "failed to list resources: context deadline exceeded",
    # while the check that was actually unsatisfied is not named at all. During
    # the 1.14.1 rollout that text reported all three checks as broken; the real
    # cause was the Longhorn check correctly waiting out replica rebuilds
    # (`tuppr_health_check_failures_total`: check 2 = 573, checks 0 and 1 = 2).
    # Read that counter, not the message, to see which check is holding.
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
      timeout: 15m
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 15m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      description: Wait for degraded Longhorn volumes to finish rebuilding before draining the next node, so its replica isn't the last healthy copy
      expr: status.robustness != "degraded"
      timeout: 15m

  # DISABLED again 2026-08-22 (revert of #1054). Left here, commented, because
  # it is the drafted-and-verified form of a window we may still want one day.
  #
  # It was enabled only as a consequence of the `low-power-off` media tier:
  # that design kept plex/jellyfin/dispatcharr replicas on fluttershy and
  # kerfuffle while those two nodes powered off nightly, so those volumes read
  # `degraded` 02:00-09:00 every night. The Longhorn health check above is
  # CLUSTER-WIDE (`status.robustness != "degraded"` names no volume), so a
  # nightly degraded volume would have stalled every node drain for seven hours
  # a night. (It would have WAITED those hours, re-arming the 15m window each
  # time -- not failed or skipped the check; see the health-check note above.)
  #
  # That premise is gone. fluttershy and kerfuffle now STAY POWERED overnight
  # (they idle instead of shutting down), the media volumes are back on the
  # ordinary `longhorn` bulk class, and nothing is degraded on a schedule. With
  # nothing to work around, restricting Talos upgrades to a 2h daily window is
  # an unwanted constraint on when the estate can be patched.
  #
  # If this is ever re-enabled: the shape below was validated against the live
  # CRD (`start` and `duration` required, `timezone` optional) and accepted by a
  # server-side dry-run.
  #
  # maintenance:
  #   windows:
  #     - start: "0 11 * * *"    # Daily at 11
  #       duration: "2h"         # How long window stays open
  #       timezone: "${TIMEZONE}"
