---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.10
  policy:
    rebootMode: default
  healthChecks:
    # A wedged VolSync mover (e.g. a failed snapshot clone) can hold Synchronizing:
    # True indefinitely with no built-in timeout of its own. Bound this check so
    # one stuck backup job can't silently freeze node upgrades for days (2026-07
    # incident: fluttershy/othalla stayed cordoned a week because of this).
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
      timeout: 15m
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 15m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn-system
      description: Wait for degraded Longhorn volumes to finish rebuilding before draining the next node, so its replica isn't the last healthy copy
      expr: status.robustness != "degraded"
      timeout: 15m

  # DISABLED again 2026-08-22 (revert of #1054). Left here, commented, because
  # it is the drafted-and-verified form of a window we may still want one day.
  #
  # It was enabled only as a consequence of the `low-power-off` media tier:
  # that design kept plex/jellyfin/dispatcharr replicas on fluttershy and
  # kerfuffle while those two nodes powered off nightly, so those volumes read
  # `degraded` 02:00-09:00 every night. The Longhorn health check above is
  # CLUSTER-WIDE (`status.robustness != "degraded"` names no volume), so a
  # nightly degraded volume would have stalled every node drain for seven hours
  # a night -- and failed on the 15m timeout rather than waited, silently.
  #
  # That premise is gone. fluttershy and kerfuffle now STAY POWERED overnight
  # (they idle instead of shutting down), the media volumes are back on the
  # ordinary `longhorn` bulk class, and nothing is degraded on a schedule. With
  # nothing to work around, restricting Talos upgrades to a 2h daily window is
  # an unwanted constraint on when the estate can be patched.
  #
  # If this is ever re-enabled: the shape below was validated against the live
  # CRD (`start` and `duration` required, `timezone` optional) and accepted by a
  # server-side dry-run.
  #
  # maintenance:
  #   windows:
  #     - start: "0 11 * * *"    # Daily at 11
  #       duration: "2h"         # How long window stays open
  #       timezone: "${TIMEZONE}"
