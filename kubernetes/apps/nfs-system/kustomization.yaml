---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfs-system
components:
  - ../../components/alerts
  - ../../components/common
resources:
  - ./csi-driver-nfs/ks.yaml
patches:
  # The Namespace's PodSecurity level. A JSON patch, because kustomize ignores
  # `metadata.labels` on this file (#3162); scripts/podsecurity-label-lint fails
  # if it stops rendering. A no-op today: talos/control-plane/10-cluster.yaml
  # deletes the PodSecurity config, so the default is already privileged.
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
