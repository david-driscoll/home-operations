---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# The Flux root, ported from equestria-cluster for piece 21 Phase B.
# See docs/cluster-consolidation/21-repo-consolidation-flux-repoint.md.
#
# NOTHING READS THIS FILE YET. The live FluxInstance still syncs from
# equestria-cluster at this same relative path; this copy only becomes live at
# the Phase C root flip, when `instance.sync.url` changes to this repo.
#
# Two deliberate differences from equestria-cluster's copy are recorded at
# their respective sites below: `prune: false`, and the dropped
# `cluster-versions` substitution source.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-meta
  namespace: &namespace flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/flux/meta
  # DIFFERENCE 1 of 2 vs equestria-cluster (`prune: true` there).
  #
  # TEMPORARY, and load-bearing. At the instant of the Phase C flip both roots
  # re-diff their entire apply set against a tree they have never read before.
  # If anything in this repo is missing or misnamed, `prune: true` would
  # garbage-collect the live objects rather than report drift -- at this
  # cluster's scale, most of it. With `prune: false` the same gap surfaces as
  # drift you can read and fix, which is the whole reason Phase B exists as a
  # separate step from Phase C.
  #
  # Restore to `true` in Phase C step 4, AFTER `flux get kustomizations -A`
  # confirms every Applied revision is a home-operations SHA and nothing is
  # NotReady. Re-enabling prune is its own deliberate act; do not bundle it
  # into the flip commit.
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Flux repositories under this need flux-system hardcoded as namespace for Renovate lookups
  targetNamespace: *namespace
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cluster-meta
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps
  # See the note on cluster-meta above -- same reason, and this is the one
  # that matters: cluster-apps owns the entire ./kubernetes/apps apply set.
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  patches:
    # Add Sops decryption and postBuild substitutions to child Kustomizations
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - name: cluster-secrets
                kind: Secret
              # DIFFERENCE 2 of 2 vs equestria-cluster, which also lists
              # `- name: cluster-versions, kind: ConfigMap` here.
              #
              # That ConfigMap is generated by components/common's
              # configMapGenerator from a repo-root `versions.env`. THIS REPO
              # HAS NEITHER -- kubernetes/components/common dropped the
              # generator, and versions.env is still in the "non-Kubernetes
              # tree to merge" backlog in piece 21.
              #
              # substituteFrom is NOT optional by default, so keeping the entry
              # would fail EVERY child Kustomization with
              # "ConfigMap/cluster-versions not found" the moment the root
              # flips. The 18 live cluster-versions ConfigMaps that exist today
              # are produced by equestria-cluster's -ref stubs, which stop
              # being read at that same instant -- so they vanish and the
              # reference breaks simultaneously.
              #
              # Dropping it is safe and verified: grepping both repos'
              # kubernetes/ trees for ${KUBERNETES_VERSION} / ${TALOS_VERSION}
              # returns nothing. The only consumer of versions.env is
              # .taskfiles/talos/Taskfile.yaml, which reads the file directly
              # and never goes through Flux substitution.
              #
              # If versions.env is later ported here, re-add the generator to
              # components/common and this entry together, or the substitution
              # is silently absent in one of the two places that need it.
              - name: shared-secrets
                kind: Secret
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: shared-secrets
        kind: Secret
