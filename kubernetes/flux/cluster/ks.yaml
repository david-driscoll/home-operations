---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# The Flux root, ported from equestria-cluster for piece 21 Phase B.
# See docs/cluster-consolidation/21-repo-consolidation-flux-repoint.md.
#
# NOTHING READS THIS FILE YET. The live FluxInstance still syncs from
# equestria-cluster at this same relative path; this copy only becomes live at
# the Phase C root flip, when `instance.sync.url` changes to this repo.
#
# One deliberate difference from equestria-cluster's copy is recorded at its
# site below: `prune: false`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-meta
  namespace: &namespace flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 1h
  path: ./kubernetes/flux/meta
  # THE deliberate difference vs equestria-cluster (`prune: true` there).
  #
  # TEMPORARY, and load-bearing. At the instant of the Phase C flip both roots
  # re-diff their entire apply set against a tree they have never read before.
  # If anything in this repo is missing or misnamed, `prune: true` would
  # garbage-collect the live objects rather than report drift -- at this
  # cluster's scale, most of it. With `prune: false` the same gap surfaces as
  # drift you can read and fix, which is the whole reason Phase B exists as a
  # separate step from Phase C.
  #
  # Restore to `true` in Phase C step 4, AFTER `flux get kustomizations -A`
  # confirms every Applied revision is a home-operations SHA and nothing is
  # NotReady. Re-enabling prune is its own deliberate act; do not bundle it
  # into the flip commit.
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Flux repositories under this need flux-system hardcoded as namespace for Renovate lookups
  targetNamespace: *namespace
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cluster-meta
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps
  # See the note on cluster-meta above -- same reason, and this is the one
  # that matters: cluster-apps owns the entire ./kubernetes/apps apply set.
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  patches:
    # Add Sops decryption and postBuild substitutions to child Kustomizations
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
          postBuild:
            substituteFrom:
              - name: cluster-secrets
                kind: Secret
              # Kept identical to equestria-cluster, but only because this same
              # commit ports what makes it resolvable here.
              #
              # `cluster-versions` is generated by components/common's
              # configMapGenerator from a repo-root versions.env. This repo had
              # NEITHER until now -- the generator had been dropped and
              # versions.env was still in piece 21's non-Kubernetes backlog.
              # Both are added alongside this entry.
              #
              # The three sites -- versions.env, the generator + both
              # substituteFrom lists in components/common, and this entry --
              # must change together. substituteFrom is not optional by
              # default, so a reference without a generator fails EVERY child
              # Kustomization with "ConfigMap/cluster-versions not found", and
              # a generator without references silently substitutes nothing.
              #
              # Why this could not simply be dropped: the versions feed tuppr's
              # Talos and Kubernetes upgrades. Those CRs
              # (kubernetes/apps/system-upgrade/upgrades/) hold literal
              # versions with their own `# renovate:` annotations rather than
              # ${TALOS_VERSION} / ${KUBERNETES_VERSION} today, so nothing
              # would have broken immediately -- but removing the mechanism
              # would have foreclosed collapsing that duplication onto one
              # source of truth, which is where it should end up.
              - name: shared-secrets
                kind: Secret
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: shared-secrets
        kind: Secret
