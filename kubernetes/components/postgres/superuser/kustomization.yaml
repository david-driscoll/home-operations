---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Opt an app's database role into PostgreSQL superuser. Add it AFTER
# ../../postgres in the app's `spec.components`:
#
#   components:
#     - ../../../../components/postgres
#     - ../../../../components/postgres/superuser
#
# This is a component rather than a `POSTGRES_SUPERUSER` substitution because a
# boolean cannot travel through `postBuild.substitute` -- that field is typed
# map[string]string, so a bare `false` is rejected by the Kustomization CRD, and
# quoting it in source does not survive `kustomize build`. The full reasoning is
# in ../ks.yaml.
#
# It works by patching the nested `${APP}-postgres` Kustomization to carry its
# own `spec.patches` entry, which Flux applies to the DatabaseRole when it
# renders ../database. Two levels of patch, one level of indirection each:
# this component patches the child Kustomization; the child patches the CR.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # Scoped by name so this cannot reach a Flux Kustomization emitted by some
  # other component of the same app.
  #
  # JSON6902 append, NOT a strategic merge setting `spec.patches`. A Flux
  # Kustomization is a CRD with no Go schema, so kustomize applies a JSON merge
  # patch and a list replaces rather than merges -- two sibling components each
  # setting `spec.patches` meant the second silently won. Appending composes.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: .*-postgres$
    patch: |-
      - op: add
        path: /spec/patches/-
        value:
          target:
            group: postgresql.cnpg.io
            kind: DatabaseRole
          patch: |-
            apiVersion: postgresql.cnpg.io/v1
            kind: DatabaseRole
            metadata:
              name: not-used
            spec:
              superuser: true
