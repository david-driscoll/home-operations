---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The app-facing credential Secret, `${APP}-postgres`, in the `database`
# namespace. Apps read it back out through ClusterSecretStore/database with
# `extract: {key: ${APP}-postgres}` -- that contract is unchanged from the
# generated users.yaml this replaces, so no app-side edits were needed.
#
# It templates through the `pgsql-user-template` ConfigMap, which lives in the
# postgres app directory (kubernetes/apps/database/postgres/app/user-template.yaml)
# and therefore in this same namespace. Editing the key list there changes every
# app's Secret at once -- that is intentional, and it is why the ConfigMap did
# not move into this component.
#
# Source of the password today: the sops secret `${APP}-postgres-password`,
# hand-maintained in the postgres app. Phase 4 of docs/postgres-credentials/PLAN.md
# swaps `dataFrom` for a VaultDynamicSecret generator over
# `database/static-creds/${APP}`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-postgres
  annotations:
    reloader.stakater.com/auto: "true"
    # `creationPolicy: Owner` puts an ownerReference on the Secret this
    # produces, so pruning THIS object garbage-collects the live credential --
    # for the app and for CNPG both. `target.deletionPolicy: Retain` does not
    # cover that; it governs the provider-side key vanishing, not this object
    # being deleted. The nested ks is already `deletionPolicy: Orphan`, so this
    # only guards the narrower case of a reconcile that stops rendering it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 4m
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      templateFrom:
        - target: Data
          configMap:
            name: pgsql-user-template
            items:
            - key: username
              templateAs: Values
            - key: password
              templateAs: Values
            - key: hostname
              templateAs: Values
            - key: public-hostname
              templateAs: Values
            - key: port
              templateAs: Values
            - key: database
              templateAs: Values
            - key: pgpass
              templateAs: Values
            - key: jdbc-uri
              templateAs: Values
            - key: uri
              templateAs: Values
            - key: uriql
              templateAs: Values
            - key: public-jdbc-uri
              templateAs: Values
            - key: public-uri
              templateAs: Values
            - key: public-uriql
              templateAs: Values
            - key: connection-string
              templateAs: Values
            - key: public-connection-string
              templateAs: Values
  dataFrom:
    - extract:
        key: "${APP}-postgres-password"
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/clustergenerator_v1alpha1.json
#
# Reads the password OpenBao's database secrets engine owns for this role.
#
# ⚠️ CLUSTER-SCOPED, and that is not a preference. A namespaced
# VaultDynamicSecret cannot authenticate: its `serviceAccountRef` is confined to
# its own namespace, so pointing at `external-secrets` in kube-system fails with
#
#   unable to setup Vault client: cannot request Kubernetes service account
#   token for service account "external-secrets": ServiceAccount
#   "external-secrets" not found
#
# even with `namespace: kube-system` spelled out. ESO refuses the cross-namespace
# reference from a namespaced object because it would be privilege escalation --
# any namespace could mint a token for any ServiceAccount. ClusterSecretStore
# gets away with it precisely because it is cluster-scoped, and a
# ClusterGenerator is the generator equivalent.
#
# The name therefore has to be globally unique, hence the ${APP} prefix.
#
# INERT unless the ../rotate component is on the app: a generator does nothing
# until an ExternalSecret references it, so this exists for all 16 apps and is
# invoked only by those that opted in.
#
# `database/static-creds/<role>` is IDEMPOTENT: it returns the CURRENT password
# rather than minting one. `database/creds/` would issue a fresh lease per read,
# which is why the ESO policy grants the former and deliberately not the latter.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: ${APP}-postgres-rotation
spec:
  kind: VaultDynamicSecret
  generator:
    vaultDynamicSecretSpec:
      path: database/static-creds/${APP}
      method: GET
      resultType: Data
      provider:
        # openbao-active, not openbao: the leader answers reads directly,
        # standbys 307 to it. Same reasoning as the ClusterSecretStore.
        server: http://openbao-active.kube-system.svc.cluster.local:8200
        auth:
          kubernetes:
            mountPath: kubernetes
            # eso-postgres-rotation, matching the ServiceAccount below. These
            # two MUST agree: the role carries bound_service_account_names, and
            # a mismatch is a 403 "service account name not authorized" at
            # login -- which is what happened when this said eso-equestria
            # while the SA had already been changed.
            role: eso-postgres-rotation
            # eso-postgres-rotation in THIS namespace, not external-secrets in
            # kube-system. ESO resolves a generator's serviceAccountRef against
            # the invoking ExternalSecret's namespace and ignores the
            # `namespace` field, so the identity has to live where the
            # ExternalSecret does. See
            # kubernetes/apps/database/postgres/app/rotation-serviceaccount.yaml.
            serviceAccountRef:
              name: eso-postgres-rotation
              namespace: database
