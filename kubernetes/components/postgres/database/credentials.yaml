---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
#
# The app-facing credential Secret, `${APP}-postgres`, in the `database`
# namespace. Apps read it back out through ClusterSecretStore/database with
# `extract: {key: ${APP}-postgres}` -- that contract is unchanged from the
# generated users.yaml this replaces, so no app-side edits were needed.
#
# It templates through the `pgsql-user-template` ConfigMap, which lives in the
# postgres app directory (kubernetes/apps/database/postgres/app/user-template.yaml)
# and therefore in this same namespace. Editing the key list there changes every
# app's Secret at once -- that is intentional, and it is why the ConfigMap did
# not move into this component.
#
# Source of the password today: the sops secret `${APP}-postgres-password`,
# hand-maintained in the postgres app. Phase 4 of docs/postgres-credentials/PLAN.md
# swaps `dataFrom` for a VaultDynamicSecret generator over
# `database/static-creds/${APP}`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${APP}-postgres
  annotations:
    reloader.stakater.com/auto: "true"
    # `creationPolicy: Owner` puts an ownerReference on the Secret this
    # produces, so pruning THIS object garbage-collects the live credential --
    # for the app and for CNPG both. `target.deletionPolicy: Retain` does not
    # cover that; it governs the provider-side key vanishing, not this object
    # being deleted. The nested ks is already `deletionPolicy: Orphan`, so this
    # only guards the narrower case of a reconcile that stops rendering it.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: Periodic
  refreshInterval: 4m
  secretStoreRef:
    kind: ClusterSecretStore
    name: database
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reloader.stakater.com/auto: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      templateFrom:
        - target: Data
          configMap:
            name: pgsql-user-template
            items:
            - key: username
              templateAs: Values
            - key: password
              templateAs: Values
            - key: hostname
              templateAs: Values
            - key: public-hostname
              templateAs: Values
            - key: port
              templateAs: Values
            - key: database
              templateAs: Values
            - key: pgpass
              templateAs: Values
            - key: jdbc-uri
              templateAs: Values
            - key: uri
              templateAs: Values
            - key: uriql
              templateAs: Values
            - key: public-jdbc-uri
              templateAs: Values
            - key: public-uri
              templateAs: Values
            - key: public-uriql
              templateAs: Values
            - key: connection-string
              templateAs: Values
            - key: public-connection-string
              templateAs: Values
  dataFrom:
    - extract:
        key: "${APP}-postgres-password"
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/generators.external-secrets.io/vaultdynamicsecret_v1alpha1.json
#
# Reads the password OpenBao's database secrets engine owns for this role.
#
# INERT unless the ../rotate component is on the app: a generator does nothing
# until an ExternalSecret references it, so this is rendered for all 16 apps and
# invoked for none of them until one opts in. Rendering it unconditionally is
# what keeps ../rotate a pure patch -- a Kustomize component cannot add a
# resource to the child path it patches.
#
# `database/static-creds/<role>` is IDEMPOTENT: it returns the CURRENT password
# rather than minting one. `database/creds/` would issue a fresh lease per read,
# which is why the ESO policy grants the former and deliberately not the latter.
#
# `spec.path` is the full OpenBao API path, not relative to a mount, and the
# provider block is the same kubernetes auth ClusterSecretStore/openbao uses --
# ESO presents its own ServiceAccount token and OpenBao validates it. Verified
# against the live role: a read of a nonexistent static-cred returns 400 (past
# the ACL, unknown role), while database/creds/ returns 403.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: ${APP}-postgres-rotation
spec:
  path: database/static-creds/${APP}
  method: GET
  resultType: Data
  provider:
    # openbao-active, not openbao: the leader answers reads directly, standbys
    # 307 to it. Same reasoning as the ClusterSecretStore.
    server: http://openbao-active.kube-system.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: eso-equestria
        serviceAccountRef:
          name: external-secrets
          namespace: kube-system
