---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Hand this app's PostgreSQL password to OpenBao's database secrets engine.
# Phase 4 of docs/postgres-credentials/PLAN.md. Add it AFTER ../../postgres:
#
#   components:
#     - ../../../components/postgres
#     - ../../../components/postgres/rotate
#
# ⚠️ THIS IS THE IRREVERSIBLE ONE. Adding it makes the Pulumi system stack
# create a static role for the app, and creating a static role ROTATES THE
# PASSWORD IMMEDIATELY. OpenBao offers no way to opt out -- rotation_period is
# mandatory and openbao#284 (disable auto rotation) is still open -- so from
# here the app has a scheduled restart forever, and the value in
# passwords.sops.yaml is stale the moment this lands.
#
# It does two things, and BOTH are required for the app to survive:
#
# 1. Drops `passwordSecret` from the DatabaseRole. Without this CNPG and
#    OpenBao fight: OpenBao rotates, CNPG's role sync notices the role's
#    transaction ID moved and re-applies the sops password, OpenBao rotates
#    again. With no passwordSecret the instance manager stops managing the
#    password entirely, which is exactly what the docs prescribe.
#
# 2. Repoints the credential ExternalSecret at the VaultDynamicSecret generator
#    that ../database/credentials.yaml already renders (inert until now).
#
# ORDER OF OPERATIONS. Merge this BEFORE the app appears in the Pulumi run --
# they are different systems and cannot be atomic. This way the generator reads
# a static-creds path that does not exist yet, ESO errors, and
# `deletionPolicy: Retain` keeps the existing Secret so the app rides through on
# its current password. When the static role appears the next refresh picks up
# the rotated value. The reverse order is an outage.
#
# The sops secret is still read for hostname/port/database/username -- the
# static-creds response carries only username and password, and the shared
# pgsql-user-template ConfigMap needs the rest. The generator is listed SECOND
# so its password wins. Retiring the sops document therefore needs those three
# descriptive fields sourced from somewhere else first; that is a later change.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # JSON6902 append, not a strategic merge setting `spec.patches` -- a Flux
  # Kustomization is a CRD with no Go schema, so a list would REPLACE rather
  # than merge and this would silently clobber ../superuser on immich. See
  # ../ks.yaml.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: .*-postgres$
    patch: |-
      - op: add
        path: /spec/patches/-
        value:
          target:
            group: postgresql.cnpg.io
            kind: DatabaseRole
          patch: |-
            - op: remove
              path: /spec/passwordSecret
      - op: add
        path: /spec/patches/-
        value:
          target:
            group: external-secrets.io
            kind: ExternalSecret
            name: .*-postgres$
          patch: |-
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: not-used
            spec:
              dataFrom:
                - extract:
                    key: "${APP}-postgres-password"
                  rewrite:
                    - regexp:
                        source: "[\\W]"
                        target: _
                - sourceRef:
                    generatorRef:
                      apiVersion: generators.external-secrets.io/v1alpha1
                      kind: ClusterGenerator
                      name: ${APP}-postgres-rotation
