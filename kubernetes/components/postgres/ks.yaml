---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
#
# The app's database, role and credential Secret, rendered into the `database`
# namespace where the CNPG Cluster lives.
#
# WHY A NESTED KUSTOMIZATION AND NOT PLAIN RESOURCES IN THIS COMPONENT:
# `Database`, `DatabaseRole` and the password Secret are namespace-scoped and
# must be co-located with the `Cluster` they reference. A component rendered
# into the app's build cannot put them in `database` -- Flux's `targetNamespace`
# is Kustomize's namespace transformer, which OVERRIDES an explicitly-set
# `metadata.namespace` (verified; both a `namespace: database` document and a
# namespace-less one come out in the app's namespace). So the component emits
# this Kustomization instead: the object itself lands in the app's namespace,
# and `spec.targetNamespace` below puts what it renders in the right place.
#
# `decryption` and `substituteFrom` are spelled out rather than inherited.
# `components/common` patches every Kustomization with them, but it is applied
# by the UMBRELLA kustomization (kubernetes/apps/<group>/kustomization.yaml) --
# a Kustomization emitted by a component of an APP is built from the app's path
# and never passes through it. Without these, ${CLUSTER_DOMAIN} and friends
# resolve to nothing, silently.
#
# ─── ORDER OF OPERATIONS ────────────────────────────────────────────────────
#
# This component gives the app a database, a login role AND a rotating
# OpenBao-owned password. The password half is not optional and cannot be
# staged separately -- the `rotate` sibling that used to make it opt-in was
# folded in here once every app had migrated, because `passwords.sops.yaml` no
# longer holds an app password to fall back to.
#
# Two systems have to converge and they cannot be atomic. Kubernetes renders
# ./database (role, database, credential ExternalSecret); the Pulumi `system`
# stack discovers this component in the app's ks.yaml and creates
# `database/static-roles/${APP}` in OpenBao. There are TWO ordering
# constraints, pointing in OPPOSITE directions:
#
#  1. FOR A MIGRATED APP -- merge the Kubernetes half BEFORE the Pulumi run
#     picks it up. In that order the generator reads a `static-creds` path that
#     does not exist yet, ESO errors, and `deletionPolicy: Retain` keeps the
#     existing Secret so the app rides through on its current password. The
#     reverse order rotates a password the app cannot yet read: an outage.
#
#  2. FOR A BRAND-NEW APP -- the login role must exist BEFORE the Pulumi run.
#     Creating a static role immediately issues `ALTER ROLE ... PASSWORD`
#     against PostgreSQL, so if CNPG has not applied the `DatabaseRole` yet,
#     `stacks/system` fails outright:
#
#       Code: 500 ... error setting credentials: failed to execute query:
#       ERROR: role "degoog" does not exist (SQLSTATE 42704)
#
#     A migrated app never hit this -- its role already existed from the sops
#     era. A new app ships both halves in ONE commit, and the Pulumi operator
#     reconciles that merge within seconds while Flux's `cluster-apps` runs on
#     its own interval, so Pulumi reliably wins the race. After 3 failures the
#     Stack goes Stalled/UpdateFailed and, with `continueResyncOnCommitMatch:
#     false` and `resyncFrequencySeconds: 86400`, will not retry for a DAY.
#
# This is expected on new-app day, not a bug to debug. Recovery, in order:
#
#     flux -n flux-system reconcile ks cluster-apps
#     kubectl -n database get databaserole ${APP} -w        # status.applied
#     kubectl annotate stack -n pulumi system \
#       pulumi.com/reconciliation-request=$(date +%s) --overwrite
#     kubectl -n database annotate externalsecret ${APP}-postgres \
#       force-sync=$(date +%s) --overwrite
#
# That last step is a real third-order symptom, not belt-and-braces: after the
# static role lands and `${APP}-postgres` in the `database` namespace goes
# Ready, the app's own `${APP}-env` ExternalSecret can stay stuck on a cached
# `error processing spec.dataFrom[N].extract, err: Secret does not exist`,
# leaving the pod in CreateContainerConfigError until it is forced to
# re-resolve.
#
# See docs/postgres-credentials/PLAN.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${APP}-postgres
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: ${APP}
      driscoll.dev/name: ${APP}
  path: ./kubernetes/components/postgres/database
  # Empty on purpose, and load-bearing. The sibling components (./superuser,
  # ./client-cert) append to this list with a JSON6902
  # `add /spec/patches/-`, which requires the list to already exist.
  #
  # They append rather than strategic-merge because a Flux Kustomization is a
  # CRD with no Go schema, so kustomize applies a JSON merge patch and a list
  # REPLACES rather than merges. Two components each setting `spec.patches`
  # meant the second silently won: verified with a fixture, `from-c1` vanished
  # entirely. That is how immich's superuser flag would have been dropped the
  # moment a second sibling landed on it, with nothing failing. The `rotate`
  # sibling was the one that nearly did it; it is folded into ./database now,
  # but the hazard belongs to any future sibling, so the list stays.
  patches: []
  # The OPERATOR, not the `postgres` cluster Kustomization. There is a live
  # readiness cycle between the two: the postgres ks reads its Helm values
  # through ClusterSecretStore/openbao, and openbao reads its storage URL out of
  # the `database` namespace. kube-system/openbao/ks.yaml breaks that cycle by
  # deliberately commenting out its own `dependsOn: postgres` -- depending on it
  # here would reintroduce it through the back door for every app that has one.
  # `postgres-operator` has no dependsOn at all and is safe.
  dependsOn:
    - name: postgres-operator
      namespace: cloudnative-pg
  prune: true
  # Same reason as every other ks that owns data: an ownership change must never
  # cascade-delete. See docs/cluster-consolidation/27-migration-churn-failure-modes.md.
  deletionPolicy: Orphan
  # `false` on purpose. With `wait: true` the parent app ks -- most of which set
  # `wait: true` -- would transitively block on `Database` reaching
  # `status.applied`, which needs a healthy CNPG cluster, which on a cold boot
  # needs OpenBao: the same cycle again. This reproduces today's behaviour
  # exactly (no gating). Opting a single app into `wait: true` plus
  # `healthCheckExprs` on `status.applied` is a fine follow-up, per app.
  wait: false
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      # APP is the ONLY substitution here, and that is deliberate.
      #
      # `postBuild.substitute` is typed map[string]string, and these values are
      # resolved by the PARENT before this document is applied. A boolean-valued
      # variable therefore lands as a bare `false`, which YAML parses as a
      # boolean and the Kustomization CRD rejects outright:
      #   spec.postBuild.substitute.POSTGRES_SUPERUSER: Invalid value:
      #   "boolean": ... must be of type string
      #
      # Quoting the source does NOT help: kustomize re-emits `"${X:=false}"` as
      # bare `${X:=false}`, because at build time that scalar is an ordinary
      # string needing no quotes. It has no way to know Flux will later turn it
      # into `false`. Verified -- double, single and bare all render identically.
      #
      # So anything non-string is expressed as a sibling COMPONENT that patches
      # this Kustomization, not as a variable. See ./superuser.
      APP: ${APP}
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      - name: cluster-versions
        kind: ConfigMap
      - name: shared-secrets
        kind: Secret
