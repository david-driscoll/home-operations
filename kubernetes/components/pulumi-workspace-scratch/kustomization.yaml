---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# A Pulumi workspace's /share on a Longhorn scratch volume instead of the
# operator's emptyDir. List it AFTER ../pulumi-workspace in a Stack's
# `components:`: these patches replace the empty lists that component writes.
#
# /share holds the fetched program and everything a run installs into it, and
# the operator puts it in an emptyDir named `share`, i.e. on the node's /var.
# That is the disk that wedged fluttershy on 2026-10-19 and fluttershy and
# kerfuffle on 2026-10-28. This puts it on `longhorn-scratch`
# (kubernetes/apps/longhorn-system/storageclass/scratch.yaml): a generic
# ephemeral volume, node-local on the NVMe, created and deleted with the
# workspace pod.
#
# WHY A NEW VOLUME AND A REMOUNT, not a replacement of `share`. The operator
# (v2.10.0) strategic-merges podTemplate into the pod it builds, so an
# `ephemeral:` on a volume named `share` would sit next to its `emptyDir: {}`
# and the API server rejects a volume with two sources; an `emptyDir: null` to
# delete it is pruned by the CRD schema long before that merge. Mounts,
# though, merge on mountPath: a mount of `scratch` at /share in bootstrap,
# fetch and pulumi takes the place of the operator's. `share` stays defined
# and unused. (operator/internal/controller/auto/workspace_controller.go,
# mergePodTemplateSpec; k8s.io/api core/v1 VolumeMounts patchMergeKey.)
#
# fsGroup 1000: the workspace runs as uid/gid 1000 under the operator's
# restricted profile, and a fresh ext4 volume's root belongs to root.
#
# JSON patches for the same reason as ../pulumi-workspace's last one: the Stack
# CRD has no schema kustomize knows, and the pulumi container is the only one,
# at index 0. bootstrap and fetch are the operator's init containers; every
# Stack here uses a Flux source, so fetch always exists.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: pulumi.com
      kind: Stack
    patch: |-
      - op: add
        path: /spec/workspaceTemplate/spec/podTemplate/spec/securityContext
        value:
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      - op: add
        path: /spec/workspaceTemplate/spec/podTemplate/spec/volumes
        value:
          - name: scratch
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: longhorn-scratch
                  resources:
                    requests:
                      storage: 20Gi
      - op: add
        path: /spec/workspaceTemplate/spec/podTemplate/spec/initContainers
        value:
          - name: bootstrap
            volumeMounts:
              - {name: scratch, mountPath: /share}
          - name: fetch
            volumeMounts:
              - {name: scratch, mountPath: /share}
      - op: add
        path: /spec/workspaceTemplate/spec/podTemplate/spec/containers/0/volumeMounts
        value:
          - {name: scratch, mountPath: /share}
