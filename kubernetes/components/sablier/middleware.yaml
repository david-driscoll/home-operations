---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# The per-app half of on-demand scale-to-zero. The Traefik plugin is registered
# once in apps/network/traefik/values.yaml; the Sablier server is
# apps/kube-system/sablier. This is the object a route points at.
#
# ONE PER APP, not one per namespace. `group` has to identify the workload, and
# ~40 apps share the `equestria` namespace -- hence `sablier-${APP}` rather than
# a shared alias like `local-user`. ${APP} resolves from the app's own ks.yaml
# postBuild, which is the same mechanism components/tailscale/ingressroute.yaml
# uses for `${APP}-tailnet`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sablier-${APP}
spec:
  plugin:
    # This key MUST match the key under `experimental.plugins` in
    # apps/network/traefik/values.yaml. A mismatch is not a validation error --
    # Traefik simply never registers the middleware and drops every router that
    # references it, which presents as a 404 on an app that was working. Same
    # trap documented in apps/network/traefik/middleware/crowdsec.yaml.
    sablier:
      sablierUrl: http://sablier-sablier.kube-system.svc.cluster.local:10000
      group: ${APP}
      sessionDuration: ${SABLIER_SESSION_DURATION:=30m}

      # FAIL LOUD. With failOpen:false an unreachable Sablier returns HTTP 500
      # instead of passing the request through to a backend that is probably
      # scaled to zero anyway -- which would be a connection error the user
      # cannot distinguish from the app being broken. It does mean Sablier is a
      # hard dependency of every opted-in app; apps/kube-system/sablier's
      # PrometheusRule exists because of this line.
      failOpen: false

      # MONITORING MUST NOT COUNT AS TRAFFIC.
      #
      # Gatus probes every app every 2 MINUTES -- the interval is hardcoded in
      # components/authentik.ts (`endpoint.interval ??= "2m"`), not in the app's
      # definition.yaml -- and it sends `User-Agent: Gatus/1.0`
      # (GatusUserAgent in config/endpoint/endpoint.go). Without this list every
      # probe would renew the session, `sessionDuration: 30m` would never
      # elapse, and NOTHING WOULD EVER SLEEP. The feature would silently do
      # nothing at all.
      #
      # KNOW EXACTLY WHAT THIS BUYS AND WHAT IT COSTS. The plugin's ServeHTTP
      # checks this list FIRST and returns HTTP 200 immediately, before it
      # contacts Sablier at all. So a matched probe proves:
      #
      #   DNS, TLS, Traefik up, the router still exists, and the plugin loaded
      #   (a plugin that fails to build drops every router referencing it,
      #   which Gatus sees as a 404)
      #
      # and proves NOTHING about:
      #
      #   whether Sablier is reachable, or whether this app would actually
      #   start if a real user arrived
      #
      # Those two are covered by Prometheus instead -- SablierAbsent and
      # SablierInstanceStartFailing in
      # apps/kube-system/sablier/prometheusrule.yaml. The uptime page and
      # Alertmanager deliberately assert different things here; each app's
      # definition.yaml repeats this next to its check so the row is not
      # mistaken for an app-health signal.
      #
      # Residual gap, accepted: an app nobody has visited for a week could be
      # unstartable with nothing firing, because a failed start is only
      # observable once someone asks for one. That is inherent to on-demand,
      # not a defect in this configuration.
      ignoreUserAgent:
        - "^Gatus/"

      # The BLOCKING strategy is unsupported on Kubernetes by this plugin, and
      # the POKE strategy (Sablier v1.17.0) has no field in plugin v1.3.0's
      # Config struct. Dynamic is the only option, not a preference.
      dynamic:
        displayName: ${APP}
        theme: ${SABLIER_THEME:=ghost}
        # NOT the 5s default. Traefik's accessLog is CrowdSec's only input, and
        # a self-refreshing page emitting ~12 requests to one URL per minute is
        # the shape of `crowdsecurity/http-crawl-non_statics`. At 5s the waiting
        # page can get the waiting user banned. Also set as the server-side
        # default in apps/kube-system/sablier.
        refreshFrequency: ${SABLIER_REFRESH_FREQUENCY:=20s}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/middleware_v1alpha1.json
#
# THE TAILNET PATH. Unreferenced, and harmless, for an app with no tailnet route.
#
# components/tailscale/ingressroute.yaml has exactly ONE middleware slot, and
# Sablier's middleware is necessarily per-app because its plugin config carries
# `group: ${APP}` -- so it cannot be folded into the shared `tailscale-local` /
# `tailscale-user` objects in `network`. This chain is the fan-out: the shared
# base first, then the app's own Sablier middleware. ../kustomization.yaml
# repoints the IngressRoute at it.
#
# WITHOUT IT, an opted-in app answers 503 on its tailnet hostname the whole time
# it is asleep, with nothing to wake it -- you would have to hit the internal
# hostname first. Reaching an app from off-LAN is most of what the tailnet is
# for, so that is a regression, not a rough edge.
#
# THE BASE IS READ FROM THE APP'S OWN `TAILSCALE_MIDDLEWARE`, which is the whole
# point: an app already sets that to `tailscale-user` when its tailnet route
# needs the authentik hop (tandoor, kapowarr, super-productivity), and leaves it
# unset for the network-gated default. Reusing it means the tailnet route cannot
# silently lose that hop while the internal route keeps it, and it means opting
# an app in adds NO new substitution -- the earlier revision of this component
# required three, one of which was a hand-typed copy of the app's own name.
#
# ORDER MATCHES THE INTERNAL ROUTE: the network gate (and the authentik outpost,
# where used) runs BEFORE Sablier, so waking a workload still requires getting
# past whatever that app already required. Sablier last.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${APP}-sablier-tailnet
spec:
  chain:
    middlewares:
      - name: ${TAILSCALE_MIDDLEWARE:=tailscale-local}
        namespace: network
      - name: sablier-${APP}
