---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: "${APP}"
spec:
  sourcePVC: "${APP}"
  trigger:
    schedule: "0 14 * * *"
  restic:
    copyMethod: "${VOLSYNC_COPYMETHOD:=Snapshot}"
    pruneIntervalDays: 14
    repository: "${APP}-volsync-secret"
    # Schedules `restic unlock` on the next sync, once per repository.
    #
    # A destination mover that dies mid-prune leaves its restic lock behind, and
    # the lock outlives the pod. Every later SOURCE run then backs up fine and
    # fails on the forget/prune step:
    #
    #   === Starting forget ===
    #   unable to create lock in backend: repository is already locked by PID 186
    #     on volsync-dst-jellyfin-dst-ptpfd
    #
    # So the failure is RETENTION, not backup — the snapshot is already saved by
    # the time this happens, which is why it can run for days looking like broken
    # backups while the data is fine. On 2026-08-20 this was live on eight
    # repositories, Tier-1 ones included (home-assistant, crowdsec-ui, registry).
    #
    # It is not only a backup problem: tuppr's TalosUpgrade healthChecks gate on
    # ReplicationSource `Synchronizing == False`, so stuck movers freeze node
    # upgrades. That is the 2026-07 incident which left fluttershy and othalla
    # cordoned for a week, and why talos.yaml carries a 15m timeout on that check.
    #
    # Safe to apply fleet-wide: the mover runs plain `restic unlock`, which removes
    # only STALE locks — `unlock --remove-all` is commented out in VolSync's
    # mover-restic/entry.sh — so this cannot disturb a live mover, and it is a
    # no-op on a repository that is not locked.
    #
    # Runs once per repository, not every sync: the operator copies this value to
    # status.restic.lastUnlocked when it completes and skips the unlock while the
    # two match. To force another pass estate-wide, change the date below; to do
    # one app only, set VOLSYNC_UNLOCK in that app's ks.yaml.
    #
    # 2026-08-21: it recurred, and the cause is worth recording because it will
    # recur again on the same trigger. tuppr rolled all seven nodes for the
    # v1.36.3 -> v1.36.4 Kubernetes upgrade, which killed in-flight movers
    # mid-`forget` and left their locks behind. Two repositories were stuck
    # (`kube-system/registry`, `equestria/radarr`, 10 mover pods in Error), each
    # holding a lock from a SOURCE mover this time rather than a destination one
    # — same failure, either side can strand a lock.
    #
    # Bumped estate-wide rather than per-app on purpose: a node roll is not
    # selective, and a repository whose next sync has not run yet looks healthy
    # until it does. The pass is a no-op wherever there is no stale lock.
    unlock: "${VOLSYNC_UNLOCK:=2026-08-21-locks-stranded-by-k8s-node-roll}"
    volumeSnapshotClassName: "${VOLSYNC_SNAPSHOTCLASS:=longhorn-snapclass}"
    cacheCapacity: "${VOLSYNC_CACHE_CAPACITY:=2Gi}"
    cacheStorageClassName: "${VOLSYNC_CACHE_SNAPSHOTCLASS:=longhorn-cache}"
    cacheAccessModes: ["${VOLSYNC_CACHE_ACCESSMODES:=ReadWriteOnce}"]
    # The mover's temporary staging clone, NOT the app's PVC. It gets its own
    # variable so an app can pin its data to one tier while its disposable
    # backup churn stays on another -- see AGENTS.md "Two storage classes, not
    # one". Default is unchanged from when this read VOLSYNC_STORAGECLASS.
    storageClassName: "${VOLSYNC_STAGING_STORAGECLASS:=longhorn-snapshot}"
    accessModes: ["${VOLSYNC_ACCESSMODES:=ReadWriteOnce}"]
    moverSecurityContext:
      runAsUser: ${VOLSYNC_PUID:=568}
      runAsGroup: ${VOLSYNC_PGID:=568}
      fsGroup: ${VOLSYNC_PGID:=568}

    # moverResources:
    #   requests:
    #     cpu: "50m"
    #     memory: "256Mi"
    #   limits:
    #     cpu: "500m"
    #     memory: "4Gi"
    retain:
      hourly: 0
      daily: 7
      monthly: 4
      yearly: 1
      weekly: 4
      last: "5"
