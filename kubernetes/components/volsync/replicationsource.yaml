---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: "${APP}"
spec:
  sourcePVC: "${APP}"
  trigger:
    schedule: "0 14 * * *"
  restic:
    copyMethod: "${VOLSYNC_COPYMETHOD:=Snapshot}"
    pruneIntervalDays: 14
    repository: "${APP}-volsync-secret"
    volumeSnapshotClassName: "${VOLSYNC_SNAPSHOTCLASS:=longhorn-snapclass}"
    cacheCapacity: "${VOLSYNC_CACHE_CAPACITY:=2Gi}"
    cacheStorageClassName: "${VOLSYNC_CACHE_SNAPSHOTCLASS:=longhorn-cache}"
    cacheAccessModes: ["${VOLSYNC_CACHE_ACCESSMODES:=ReadWriteOnce}"]
    # The mover's temporary staging clone, NOT the app's PVC. It gets its own
    # variable so an app can pin its data to one tier while its disposable
    # backup churn stays on another -- see AGENTS.md "Two storage classes, not
    # one". Default is unchanged from when this read VOLSYNC_STORAGECLASS.
    storageClassName: "${VOLSYNC_STAGING_STORAGECLASS:=longhorn-snapshot}"
    accessModes: ["${VOLSYNC_ACCESSMODES:=ReadWriteOnce}"]
    moverSecurityContext:
      runAsUser: ${VOLSYNC_PUID:=568}
      runAsGroup: ${VOLSYNC_PGID:=568}
      fsGroup: ${VOLSYNC_PGID:=568}

    # moverResources:
    #   requests:
    #     cpu: "50m"
    #     memory: "256Mi"
    #   limits:
    #     cpu: "500m"
    #     memory: "4Gi"
    retain:
      hourly: 0
      daily: 7
      monthly: 4
      yearly: 1
      weekly: 4
      last: "5"
