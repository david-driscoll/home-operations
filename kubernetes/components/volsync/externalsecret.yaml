---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-volsync"
spec:
  refreshInterval: 4m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: "${APP}-volsync-secret"
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
          volsync: "true"
      data:
        # Where the repository lives: the NFS share on TrueNAS, or the
        # app's prefix in the `volsync-equestria` Garage bucket. An app moves
        # by setting `VOLSYNC_BACKEND: garage` in its ks.yaml. The move is
        # docs/plans/host-owned-backups.md phase 3, and garage becomes the
        # default once every app has moved. The same Secret feeds the
        # ReplicationSource and the restore-once ReplicationDestination, so
        # both follow the switch together. The label on the mover pods
        # (replicationsource.yaml) is what stops volsync-mover-nfs mounting
        # NFS into a mover that no longer uses it.
        #
        # The endpoint comes from the record, not from this file. It is
        # celestia's node at its LAN address, plain HTTP on 3900: celestia's
        # per-node name resolves to its tailnet address, which no pod can
        # route to. Plain HTTP carries nothing readable, because restic
        # encrypts every pack before it leaves the mover and SigV4 never
        # sends the secret key. While celestia is down, the fallback is
        # one change to that record in stacks/system (garage.ts).
        RESTIC_REPOSITORY: '{{ if eq "${VOLSYNC_BACKEND:=nfs}" "garage" }}s3:{{ .garage_endpoint }}/{{ .garage_bucket }}/${APP}{{ else }}/repository/${APP}{{ end }}'
        RESTIC_PASSWORD: "{{ .credential }}"
        # Present on every app, used only by a Garage repository: restic
        # ignores them for a local path. It is one key for every mover, so
        # the NFS apps carrying it expose nothing the moved ones do not.
        AWS_ACCESS_KEY_ID: "{{ .garage_username }}"
        AWS_SECRET_ACCESS_KEY: "{{ .garage_password }}"
        AWS_DEFAULT_REGION: "{{ .garage_region }}"
  dataFrom:
    - extract:
        # was: 'Volsync Password'   (1Password item title in vault Eris)
        # Path within the `secrets` mount; the store pins `path: secrets`.
        key: apps/volsync/password
    # The movers' Garage key, written by stacks/system (garage.ts) with the
    # bucket and endpoint beside it. ESO fails the WHOLE ExternalSecret on one
    # unreadable extract (kubernetes/apps/database/postgres/app/externalsecret.yaml
    # has the history), and every app's backup Secret now carries this one.
    # It exists, and eso-equestria reads all of clusters/*. Moving or
    # deleting it in garage.ts stalls every app's Secret, so move this
    # line in the same change.
    - extract:
        key: clusters/equestria/apps/volsync/garage
      rewrite:
        - regexp:
            source: "(.*)"
            target: "garage_$1"
