---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - ./namespace.yaml
  - ./service-account.yaml
  - ./middleware.yaml
  - ./limit-range.yaml
  - ./traefik-tailnet.yaml
  - ./templates
# Generates the `cluster-versions` ConfigMap in every namespace, from the
# repo-root versions.env. Both substituteFrom lists below reference it, as does
# kubernetes/flux/cluster/ks.yaml's cluster-apps patch -- all three must carry
# it or drop it together, since substituteFrom is not optional by default and a
# dangling reference fails the Kustomization outright.
#
# disableNameSuffixHash is required: the substituteFrom references are by the
# literal name `cluster-versions`, so a content hash suffix would break them.
#
# The env file is outside this component's directory, so a local
# `kustomize build` needs `--load-restrictor LoadRestrictionsNone`. Flux's
# kustomize-controller already runs with that setting.
configMapGenerator:
  - name: cluster-versions
    envs:
      - ../../../versions.env
    options:
      disableNameSuffixHash: true
patches:
  - target:
      group: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        maxHistory: 3
        interval: 15m
        timeout: 10m
        install:
          createNamespace: true
          replace: true
          remediation:
            retries: 7
        upgrade:
          crds: CreateReplace
          cleanupOnFail: true
          remediation:
            retries: 7
            strategy: rollback
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        postBuild:
          substituteFrom:
            - name: cluster-secrets
              kind: Secret
            - name: cluster-versions
              kind: ConfigMap
            - name: shared-secrets
              kind: Secret
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: not-used
      spec:
        decryption:
          provider: sops
          secretRef:
            name: sops-age
        postBuild:
          substituteFrom:
            - name: cluster-secrets
              kind: Secret
            - name: cluster-versions
              kind: ConfigMap
            - name: shared-secrets
              kind: Secret
