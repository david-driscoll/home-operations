---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/ingress.json
#
# Publishes `${TAILSCALE_HOST}.${TAILSCALE_DOMAIN}` as a Tailscale VIP service on
# the shared tailnet-outbound ProxyGroup. tailscaled terminates TLS with the
# tailnet cert and reverse-proxies cleartext to the backend below.
#
# The backend is TRAEFIK, not the app. Pointing it at the app's own Service --
# which is what this did until now -- puts the app on the tailnet with no
# authentik, no crowdsec, no error-pages and no source check, because nothing in
# the request path is Traefik. `curl https://radarr.opossum-yo.ts.net` answered
# 200 unauthenticated. Traefik dispatches by Host on its `tailscale` entrypoint
# instead; the route lives in ./ingressroute.yaml.
#
# tailscaled preserves the original Host (`r.Out.Host = r.In.Host`,
# ipn/ipnlocal/serve.go), which is what makes the Host-based dispatch work and is
# the same mechanism the Dockge hosts have used for months.
#
# Nothing here is per-app any more except the hostname: the app's own Service and
# port moved to the IngressRoute, where a port NAME is legal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP}-tailscale-ingress
  annotations:
    tailscale.com/proxy-group: tailnet-outbound
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
    tailscale.com/tags: "tag:apps"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      # Created once per namespace by components/common/traefik-tailnet.yaml.
      # Must be a real ClusterIP in THIS namespace -- the operator rejects
      # ExternalName and cross-namespace backends are not a thing for Ingress.
      name: traefik-tailnet
      port:
        name: tailscale
  tls:
    - hosts:
        - ${TAILSCALE_HOST:=${APP}}
