---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master/ingress.json
#
# The app's tailnet front door, rendered into `network` by ../ks.yaml.
#
# The Tailscale operator turns this into a VIP service on the tailnet-outbound
# ProxyGroup, terminates TLS with the tailnet cert, and reverse-proxies cleartext
# to the backend. The backend is TRAEFIK, which then dispatches on the Host header
# (tailscaled preserves it) to the app's own IngressRoute in ../ingressroute.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP}-tailscale-ingress
  annotations:
    tailscale.com/proxy-group: tailnet-outbound
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
    tailscale.com/tags: "tag:apps"
    # Port 80 too, for short names. MagicDNS answers `jellyfin` with this
    # Service before the root-domain search path is ever tried, so a browser
    # typing a short name lands here, and its plain-HTTP fallback needs
    # something on :80. tailscaled forwards it to the same backend with the
    # Host kept (`jellyfin`). Traefik's `tailscale` entrypoint then redirects
    # every plain-HTTP request and serves none: a short name to its app route,
    # a full name to https (apps/network/traefik/short-names.yaml).
    # Not `tailscale.com/http-redirect`: that redirects to https://<same host>,
    # which for a short name is https://jellyfin/, a name no certificate covers.
    tailscale.com/http-endpoint: enabled
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      # Traefik's real Service, which is why this whole manifest has to be
      # rendered into `network` -- see ../ks.yaml for what happened when it was
      # not.
      name: traefik
      port:
        name: tailscale
  tls:
    - hosts:
        - ${TAILSCALE_HOST}
