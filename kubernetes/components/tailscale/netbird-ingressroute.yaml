---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
#
# The app's NetBird front door: `<host>.nb.<root domain>`, the NetBird
# counterpart of `<host>.<tailnet>` and the same <host>
# (docs/plans/netbird-mirror.md §N). Every app that publishes a tailnet name
# gets this from the same component, so a new tailnet app is a NetBird app too.
#
# The other half lives in stacks/netbird (apps.ts): it finds this app through
# its tailnet Ingress, declares a PRIVATE service for the host on the NetBird
# proxy, open to the groups in the app's definition.yaml, and points it at
# Traefik's `netbird` entrypoint with the client's Host kept. So, as on the
# tailnet, Traefik dispatches on Host to this router, and it to the app.
#
# Same target, port and priority as ./ingressroute.yaml, and the same gate:
# `netbird-as-<TAILSCALE_MIDDLEWARE>` is that chain with the tailnet address
# check swapped for the NetBird one (apps/network/traefik/middleware/netbird.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${APP}-netbird
  annotations:
    kubernetes.io/ingress.class: internal
spec:
  entryPoints:
    - netbird
  routes:
    - kind: Rule
      priority: 10
      match: Host(`${TAILSCALE_HOST:=${APP}}.nb.${ROOT_DOMAIN}`)
      middlewares:
        # A redirect to the app route, the same as the tailnet route
        # (./ingressroute.yaml, docs/adr/0004). The NetBird proxy has already
        # checked the app's access policy; the app route does the rest.
        - name: app-route-redirect
          namespace: network
        - name: netbird-as-${TAILSCALE_MIDDLEWARE:=tailscale-local}
          namespace: network
      services:
        - name: ${TAILSCALE_SERVICE:=${APP}}
          port: ${TAILSCALE_PORT:=http}
