---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
commonLabels:
  app.kubernetes.io/name: "${APP}"
  driscoll.dev/name: "${APP}"
resources:
  # The Traefik router, in the app's own namespace.
  - ./ingressroute.yaml
  # The tailnet Ingress. NOT a plain resource: it has to land in `network`,
  # which only a nested Kustomization can do. See ./ks.yaml.
  - ./ks.yaml
