---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Scheduling for every Pulumi operator workspace pod. Each Stack under
# kubernetes/apps/pulumi/<stack>/ pulls this in from its own kustomization.yaml,
# because each one is rendered by its own Flux Kustomization -- the parent
# kubernetes/apps/pulumi/kustomization.yaml only renders the ks.yaml objects.
#
# Why it exists: on 2026-10-19 one commit to main made the operator reconcile
# all 7 Stacks at once. Each was a cold workspace (artifact extract, npm into
# the /var/lib/pulumi-npm-cache hostPath, mise/vals, plugins), and 6 of the 7
# landed on fluttershy. Its /var is a DRAM-less PNY SATA SSD that tops out
# around 40 MiB/s. It went to 95% util, CRI wedged, the node went NotReady, and
# the Longhorn force-detach fallout took kerfuffle (the same hardware) down too.
#
# Two rules, both applied to the pod template the operator merges into its
# workspace StatefulSet (strategic merge, so the volumes/initContainers each
# stack.yaml declares are untouched):
#
#  1. PREFERRED: avoid nodes labelled `driscoll.dev/ephemeral-disk: sata`.
#     The label comes from talos/talconfig.yaml nodeLabels (fluttershy,
#     kerfuffle) and does nothing until those two nodes have had
#     `mise run talos:apply-node`. Preferred, not required, so any worker can
#     still run a workspace. With only hard-hat and shining-armor eligible, a
#     required rule would hold every Stack Pending whenever both were down.
#     The weight is the maximum (100) so the preference outweighs the
#     ImageLocality and free-capacity scores that packed 6 of 7 onto
#     fluttershy, but it is still only a score. What actually limits load on
#     one /var is the MAX_CONCURRENT_RECONCILES cap on the operator
#     (../../apps/pulumi/pulumi-operator/helmrelease.yaml). The control
#     planes stay out because of their NoSchedule taint, on purpose: they
#     have 4 cores, and the low-power tier sheds workspaces.
#
#  2. PREFERRED: spread workspaces across nodes. Every workspace pod carries
#     `auto.pulumi.com/component: workspace` (set by the operator, verified
#     live). ScheduleAnyway, not DoNotSchedule: a hard skew limit plus the
#     default nodeTaintsPolicy (Ignore) counts a NotReady node as an empty
#     domain and holds later workspaces Pending. A spread preference must
#     never block a Pulumi run.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: pulumi.com
      kind: Stack
    patch: |-
      apiVersion: pulumi.com/v1
      kind: Stack
      metadata:
        name: not-used
      spec:
        workspaceTemplate:
          spec:
            podTemplate:
              spec:
                affinity:
                  nodeAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        preference:
                          matchExpressions:
                            - key: driscoll.dev/ephemeral-disk
                              operator: NotIn
                              values: ["sata"]
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                      matchLabels:
                        auto.pulumi.com/component: workspace
