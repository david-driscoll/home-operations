---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/ingress_v1.json
#
# One path of one Service, in the app's own namespace, published to the whole
# internet at <FUNNEL_HOST>.<tailnet>.ts.net through Tailscale Funnel. The
# design is docs/plans/cloudflare-tunnel-to-funnel.md; the rules are here,
# because each one was a real failure mode in review.
#
# PUBLISHING SOMETHING IS TWO CHANGES, NOT ONE. This renders the Ingress;
# apps/tailscale-system/funnel-policy/funnel-ingress-shape.yaml admits it only
# if its namespace, Service, path and host are on the allow-list there. That
# list is the estate's entire public surface -- add the line in the same PR.
#
# VARIABLES (the consuming Kustomization's postBuild.substitute):
#   APP                  names the Ingress: APP-funnel. Required.
#   FUNNEL_HOST          first label of the public name. Required.
#   FUNNEL_PATH          the path WITHOUT slashes: `hook` publishes /hook/.
#                        Required.
#   FUNNEL_SERVICE       a Service in the same namespace. Required, and write
#                        it literally: cluster-apps substitutes ks.yaml files
#                        from cluster-secrets and shared-secrets only, and
#                        neither has APP, so APP-cdn would render as `-cdn`.
#   FUNNEL_PORT          the Service port NAME. Default http.
#   FUNNEL_PROXY_CLASS   default control-plane-tolerant.
#
# THE CONSUMING KUSTOMIZATION ALSO NEEDS (copy apps/flux-system/flux-webhook-funnel/ks.yaml):
#   dependsOn funnel-policy and tailscale-resources (tailscale-system) -- the
#     gate, and the owner of control-plane-tolerant (or of whatever ProxyClass
#     FUNNEL_PROXY_CLASS names);
#   a healthCheckExprs entry for Ingress on its own FUNNEL_HOST -- without it
#     `wait` calls the Ingress healthy before any proxy exists.
#
# FAILS CLOSED. FUNNEL_PATH and FUNNEL_SERVICE have no defaults: unset, the path
# renders as `//` and the backend name as empty, and the API rejects both.
# Flux's `:?` form does NOT fail -- it falls through -- so do not reach for it.
# There is deliberately no `/` default: that would publish a whole app.
#
# DO NOT ADD any of these. Each one silently breaks Funnel or widens it:
#   tailscale.com/proxy-group -- the ProxyGroup/HA Ingress path never reads
#     the funnel annotation (operator 1.102.4). Funnel runs standalone only,
#     which also means one replica.
#   tailscale.com/experimental-forward-cluster-traffic-via-ingress -- the
#     tailnet template carries it; here it flips the proxy to kernel mode and
#     turns off ProxyClass metrics.
#   a `host` on the rule -- one that differs from tls.hosts[0] is dropped,
#     leaving a proxy that serves nothing while the Ingress looks healthy.
#   a defaultBackend, or a second path.
#
# What the proxy does with it: tailscaled mounts FUNNEL_PATH and proxies to
# <ClusterIP>:<port> plus the same path, so the backend sees the original
# path. It matches on the CLEANED path and 404s anything outside the mount,
# /hook/../x included. It dials https+insecure:// only for port 443 or a port
# named `https`, plain http:// otherwise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP}-funnel
  labels:
    # A label, not the annotation: the label wins, and with neither the proxy
    # gets NO ProxyClass -- the operator's defaultProxyClass is inert (it is
    # set under operatorConfig, which chart 1.102.4 ignores). No ProxyClass
    # means no control-plane toleration and no metrics.
    tailscale.com/proxy-class: ${FUNNEL_PROXY_CLASS:=control-plane-tolerant}
  annotations:
    tailscale.com/funnel: "true"
    # Exactly this, no spaces. A malformed value fails the auth-key mint; only
    # an ABSENT annotation falls back to the operator default (tag:apps), which
    # cannot Funnel. And tag:funnel ALONE: it is the one tag left out of every
    # autogroup:tagged grant (stacks/unifi-network/acl-manager.ts), so a second
    # tag would hand the proxy that tag's tailnet reach.
    tailscale.com/tags: "tag:funnel"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - "${FUNNEL_HOST}"
  rules:
    - http:
        paths:
          - path: /${FUNNEL_PATH}/
            pathType: Prefix
            backend:
              service:
                name: ${FUNNEL_SERVICE}
                port:
                  name: ${FUNNEL_PORT:=http}
