---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/networking.k8s.io/ingress_v1.json
#
# THE FUNNEL DEVICE: <FUNNEL_HOST>.<tailnet>.ts.net, published to the whole
# internet, mounting /<FUNNEL_PATH>/ and nothing else, in front of Traefik's
# `funnel` entrypoint. Rendered into `network` by ../ks.yaml. Admitted only if
# '/<FUNNEL_PATH>/ <FUNNEL_HOST>' is on funnel-ingress-shape.yaml's device list.
#
# THE BACKEND IS NEVER TEMPLATED. Always traefik-funnel, port NAME funnel --
# the policy refuses anything else. traefik:websecure or traefik:tailscale
# would put the INTERNAL estate on the internet with an attacker-chosen Host:
# network/internal-network is a RemoteAddr ipAllowList and this proxy's pod
# IP passes it (the 2026-09-15 shape). A port NUMBER is refused too: 443, or a
# port named `https`, flips the proxy to https+insecure:// against a plaintext
# listener (cmd/k8s-operator/ingress.go:363-368 @v1.102.4).
#
# THE MOUNT IS NOISE REDUCTION, NOT A BOUNDARY. tailscaled 404s anything
# outside /<path>/ after path.Clean (ipn/ipnlocal/serve.go:830-860), so scans
# of / never reach Traefik. It does NOT confine this device to its own route:
# the mount is checked on the decoded, cleaned path and the raw path is
# forwarded, so /<path>/a%2Fb/../../<other> passes it and Traefik routes it as
# /<other>. The boundary is the set of routes on the door
# (funnel-httproute-shape). Keep this path equal to the HTTPRoute's PathPrefix.
#
# DO NOT ADD any of these. Each one silently breaks Funnel or widens it:
#   tailscale.com/proxy-group -- the ProxyGroup/HA Ingress path never reads
#     the funnel annotation (operator 1.102.4). Funnel runs standalone only,
#     which also means one replica.
#   tailscale.com/experimental-forward-cluster-traffic-via-ingress -- the
#     tailnet template carries it; here it flips the proxy to kernel mode and
#     turns off ProxyClass metrics.
#   a `host` on the rule -- one that differs from tls.hosts[0] is dropped,
#     leaving a proxy that serves nothing while the Ingress looks healthy.
#   a defaultBackend, or a second path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: funnel-${FUNNEL_HOST}
  namespace: network
  labels:
    # A label, not the annotation: the label wins, and with neither the proxy
    # gets NO ProxyClass -- the operator's defaultProxyClass is inert (it is
    # set under operatorConfig, which chart 1.102.4 ignores). No ProxyClass
    # means no control-plane toleration and no metrics.
    tailscale.com/proxy-class: ${FUNNEL_PROXY_CLASS}
  annotations:
    tailscale.com/funnel: "true"
    # Exactly this, no spaces. A malformed value fails the auth-key mint; only
    # an ABSENT annotation falls back to the operator default (tag:apps), which
    # cannot Funnel. And tag:funnel ALONE: it is the one tag left out of every
    # autogroup:tagged grant (stacks/unifi-network/acl-manager.ts), so a second
    # tag would hand the proxy that tag's tailnet reach.
    tailscale.com/tags: "tag:funnel"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - "${FUNNEL_HOST}"
  rules:
    - http:
        paths:
          - path: /${FUNNEL_PATH}/
            pathType: Prefix
            backend:
              service:
                name: traefik-funnel
                port:
                  name: funnel
