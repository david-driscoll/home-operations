
[tools]
python = "3.15.2"
kubectl = "1.37.1"
# kubectl plugin (invoked as `kubectl cnpg ...`) for CNPG replica surgery and
# planned primary switchovers -- see docs/cluster-consolidation/*.md, which
# repeatedly calls out `kubectl cnpg destroy`/`promote` over touching a PVC or
# forcing a failover by hand.
"github:cloudnative-pg/cloudnative-pg" = { version = "v1.30.1", bin = "kubectl-cnpg" }
powershell-core = "7.6.9"
1password-cli = "2.41.1"
# Talos tooling for the `talos:*` tasks under .config/mise/tasks/talos/.
#
# `talosctl` MUST stay in step with talos/talenv.yaml's talosVersion. That is
# not a convention, it is enforced: `mise run talos:validate-config` compares
# the two and refuses to validate a machine config with a mismatched schema.
# Renovate bumps talenv.yaml from the ghcr.io/siderolabs/installer tag; this
# line has to move with it.
talosctl = "1.14.4"
talhelper = "3.1.17"
yq = "4.54.1"
jq = "1.8.2"
sops = "3.13.3"
flux2 = "2.9.6"
age = "1.3.2"
gh = "2.103.0"
# Git hook manager (see .config/hk.pkl). MUST stay pinned here: hk registers
# itself as `hk run pre-commit --from-hook` via git config, and an unpinned mise
# shim fails inside the hook with `mise ERROR No version is set for shim: hk`.
# The hook exits non-zero and git aborts the commit.
hk = "2.8.1"
pkl = "0.32.2"
biome = "2.5.2"
typos = "1.51.1"
# Linters invoked by hk. The same pinning rule as hk applies -- an unpinned
# shim here fails the individual step rather than the whole commit, but still
# breaks the hook.
#
# actionlint shells out to `shellcheck` for `run:` blocks, so it hard-fails with
# a `fatal error` if shellcheck is on PATH as an unpinned shim -- which is the
# second, independent reason shellcheck is pinned rather than assumed.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Same rule, third instance. hk's `eso-values-lint` step runs
# `go -C scripts/eso-values-lint run .`, and `go` was never pinned -- it worked
# only where Go happened to be installed system-wide, exactly like `pipx` below.
# In the agentboard pod it was not, so the step died with `sh: 1: go: not found`
# and took the whole pre-push hook down with it once the hooks were registered.
# CI does not catch this: .github/workflows/flux-local.yaml installs Go from
# scripts/eso-values-lint/go.mod via actions/setup-go, so the workflow passes on
# a machine the local hook cannot reproduce.
#
# Keep the MAJOR.MINOR in step with that go.mod's `go 1.24` directive, which is
# the version CI resolves; the patch floats on Renovate.
go = "1.27.3"
"pipx:yamllint" = "1.38.0"
"npm:typescript" = "5.9.3"
node = "24.22.1"
pulumi = "3.272.0"
"github:microsoft/apm" = { version = "v0.35.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.2", bin = "skillfile" }
"github:home-operations/flate" = "v0.6.5"
dotnet = { version = "10.0.402" }
# Secret-reference resolver for ref+openbao:// inside documents
# (components/store/refs.ts, PLAN §D.1). Keep this version in step with the
# vals initContainer in kubernetes/apps/pulumi/*/stack.yaml — the workspace
# pods install the same pin via mise.
vals = "0.50.0"
# Resolves the secrets local commands need: `fnox exec -- <command>`, configured
# by .config/fnox.toml. 1.40.0 is the floor: the sops and openbao providers
# there are Lua plugins, which landed in that release.
fnox = "v1.42.1"
"github:stacklok/toolhive" = "v0.56.0"
# REQUIRED BY the `pipx:` backend below, and the reason it never installed here.
# mise's pipx backend shells out to a `pipx` on PATH (or `uv`, with
# MISE_PIPX_UVX=1); it does not vendor one. Neither was pinned, so
# `pipx:graphifyy` could only ever resolve on a machine that happened to have
# pipx installed system-wide -- on one that did not, `mise install` reported
# `pipx may be required but was not found`, graphify never landed, and
# [hooks].postinstall's `graphify hook install` failed with 127 on EVERY
# `mise install` in this repo. Pinning it makes the dependency explicit and
# satisfiable from the lockfile like everything else.
#
# `python` above is also required (pipx builds the venv with it) and was
# already pinned -- it was simply never installed in the agentboard pod, which
# is what ../kubernetes/apps/agents/agentboard/resources/entrypoint.sh now fixes.
pipx = "1.18.4"
"pipx:graphifyy" = "0.9.94"

[tasks.codegen]
description = 'Regenerate types/application-definition.d.ts from schemas/'
# schemas/ is the source of truth for the ApplicationDefinition types that
# components/ and stacks/ compile against, and for the `$schema` every
# kubernetes/**/definition.yaml points at. The generator also asserts that the
# Gatus endpoint key set in schemas/gatus.schema.json matches the one in
# kubernetes/apps/observability/crds/application-crd.yaml -- the CRD carries no
# x-kubernetes-preserve-unknown-fields, so a key the CRD does not list is
# silently PRUNED by the API server on apply and never reaches the Pulumi stack
# that renders the Gatus config.
#
# `--no-install` keeps this honest: json-schema-to-typescript and yaml are
# devDependencies, so a missing `npm ci` fails loudly here instead of silently
# resolving a different version off the network.
run = ['npx --no-install tsx scripts/generate-types.ts']

[tasks.update]
description = 'Update all apps that have an update script'
# `depends`, not another `run` line, so codegen still happens even if the dotnet
# step below fails.
#
# `dir` is pinned because scripts/do-update.cs walks `kubernetes/` RELATIVE to
# the working directory -- without it, `mise run update` from a subdirectory
# finds no update scripts.
#
# The dotnet step goes through `fnox exec` rather than resolving secrets itself:
# the Update.cs scripts read credentials from the environment, and this way they
# are resolved ONCE for the whole run instead of once per script. In
# equestria-cluster this was `op run` inside do-update.cs; see that file.
#
# do-update.cs runs every kubernetes/**/Update.cs and exits non-zero if any of
# them fail, having run them all, so one broken script reports itself rather
# than hiding the state of the others.
dir = '{{config_root}}'
depends = ['codegen']
run = [
  'fnox exec -- dotnet run scripts/do-update.cs',
  # `mise task <name>` prints information about a task; `mise run <name>` runs
  # it. This line was the former and had never actually run flate.
  'mise run flate',
]

[tasks.flate]
description = 'Run flate'
# `--path` scopes flate to the Flux entrypoint. Without it flate walks the whole
# repo and tries to parse every JSON/TS file it finds, emitting a
# `loader: file failed to parse` line for each sdks/*/tsconfig.json before
# arriving at the same 350 resources. Scoped, the run drops from ~5s to ~1.5s.
# Kept in step with the `flate` step in .config/hk.pkl.
run = [
  'flate test all --path ./kubernetes/flux/cluster --allow-missing-secrets --source-retry-attempts 10',
]

[tasks.eso-values-lint]
description = 'Lint configMapGenerator-slurped files for live envsubst/Go-template in comments'
# The half `flate` cannot see: Flux postBuild envsubst and the external-secrets
# `templateAs: Values` engine both treat a comment as live text, so a `${VAR}`
# or `{{ ... }}` inside one is executed. Twice the cause of a CrowdSec outage
# (vault#111). Kept in step with the `eso-values-lint` step in .config/hk.pkl
# and the job of the same name in .github/workflows/flux-local.yaml.
#
# `go -C` is required (nested module, no go.mod at the repo root) and it also
# changes the program's working directory, so the target must be absolute.
run = [
  'go -C scripts/eso-values-lint run . "$(git rev-parse --show-toplevel)/kubernetes"',
]

[tasks.pkl-vscode]
description = 'Install the Pkl VS Code extension (not on the marketplace; installed from VSIX)'
# Ported from rocketsurgeonsguild/Specular. Not part of [hooks] postinstall on
# purpose: it needs the `code` CLI and touches the user's editor, which is not
# something `mise install` should do unasked. Run it once by hand.
run = ['bash scripts/install-pkl-vscode.sh']

[tasks."claude:toolport-env"]
description = 'Pin the toolport MCP door URLs into ~/.claude/settings.json (for desktop-app sessions)'
# The Claude desktop app starts sessions without mise's environment, so the
# TOOLPORT_<PROFILE>_URL references in .mcp.json stay unexpanded there. This
# writes the six URLs [env] resolves below into the user's own settings `env`,
# never into the repo. Once per machine; see the script's header.
run = ['bash scripts/claude-toolport-env.sh']

[settings]
experimental = true
prereleases = true
idiomatic_version_file_enable_tools = ["dotnet"]
# Put mise's tool paths AHEAD of the ambient PATH.
#
# Without this, /opt/homebrew/bin shadows every pinned tool. Found 2026-08-17
# when `talos:validate-config` refused to run: it compares `talosctl version`
# against talos/talenv.yaml and reported v1.13.5 while [tools] pins 1.13.8 —
# because all 15 talos tasks were resolving Homebrew's talosctl, not mise's.
# The gate was right and the environment was wrong.
#
# It is not hypothetical or talosctl-specific: the estate has hit the same
# shadowing with a Homebrew `pulumi` ahead of mise's. Pinning a tool version in
# [tools] means nothing if a task can silently run a different binary, and the
# failure is quiet — a Talos config generated for 1.13.8 validated by a 1.13.5
# client.
activate_aggressive = true
# mise decrypts ONE file itself: .config/domains.sops.yaml, at the top of
# [env]. Strict mode would fail every mise command in the repo wherever the
# age key is absent (CI, Renovate, a fresh laptop); off, the two names are
# just empty there, and nothing that needs them works anyway.
sops.strict = false

# fnox as mise's secrets source (experimental, mise >= 2026.10.4). It adds a
# NARROWER way in than `fnox exec`: mise asks fnox for the named keys only and
# hands them to that one command or task.
#
#   mise x --secrets PULUMI_CONFIG_PASSPHRASE,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY -- pulumi stack ls
#   [tasks.x] secrets = ["AUTHENTIK_TOKEN"]         # a task's own grant
#   mise secrets ls                                 # what exists, never values
#
# `fnox exec` resolves EVERY secret fnox can see, including any in your
# personal ~/.config/fnox/config.toml, which can mean a password-manager prompt
# for a value the command never reads.
[secrets.fnox]

[env]
# Secrets are NOT in this block. They live in .config/fnox.toml and are
# resolved per command:
#
#   fnox exec -- pulumi preview
#   mise x --secrets KEY[,KEY…] -- <command>    # only those keys ([secrets.fnox] above)
#
# This block keeps only non-secret settings, which fnox reads from the
# environment mise provides (BAO_ADDR below is the OpenBao provider's address).
#
# Resolution is per command rather than by mise itself on purpose: mise
# re-evaluates `[env]` on EVERY load with no caching, so resolving here would
# hit OpenBao on every `cd` into the repo and break the shell whenever you are
# off-network or without an age key.
#
# History: these were `op://` literals substituted by `op run`, then `ref+`
# values resolved by `mise run vals-run` (2026-08 to 2026-10). fnox replaced the
# wrapper; the references moved into fnox.toml one for one. The OpenBao
# credential still comes from the mise AppRole in SOPS, so no
# `eval "$(bootstrap/openbao/pulumi-env.sh)"` step is needed. That script still
# works and is still the break-glass path when the AppRole is revoked: fnox's
# openbao provider uses an exported BAO_TOKEN ahead of the AppRole.

# The estate's root domain and tailnet: the two names this public repo never
# writes (docs/plans/private-domain-scrub.md). They are the one exception to
# resolving per command: mise decrypts .config/domains.sops.yaml itself, on
# every load, so plain commands (docker, bao, an MCP client) see real values.
# The file is local, so no network is involved, and without the age key the
# names are just empty (`sops.strict = false` above).
#
# It is a flat copy of ROOT_DOMAIN / TAILSCALE_DOMAIN in
# kubernetes/flux/meta/shared-secrets.sops.yaml, the file Flux reads. Write it
# only with `mise run private-names-sync`; scripts/private-domain-guard fails
# a commit where the two disagree.
#
# SOPS_AGE_KEY_FILE comes first because mise's own decryption reads it from
# here.
#
# It is only a DEFAULT. An agentboard pod already exports SOPS_AGE_KEY_FILE pointing
# at the mounted estate identity (/var/run/secrets/sops-age/age.agekey, see
# kubernetes/apps/agents/agentboard/helmrelease.yaml), and no repo-root age.key
# exists there. A plain assignment overrode that correct value with a missing
# file, so every `ref+sops://` failed in the pod with "0 successful groups
# required, got 0". Verified 2026-09-12: get_env keeps an inherited value and
# falls back to {{config_root}}/age.key when nothing is set.
SOPS_AGE_KEY_FILE = "{{ get_env(name='SOPS_AGE_KEY_FILE', default=config_root ~ '/age.key') }}"
_.file = "{{config_root}}/.config/domains.sops.yaml"
# Always defined, so the templates below render empty instead of failing.
ROOT_DOMAIN = "{{ env.ROOT_DOMAIN | default(value='') }}"
TAILSCALE_DOMAIN = "{{ env.TAILSCALE_DOMAIN | default(value='') }}"
# The Pulumi state backend's region: the key itself (AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY) is in .config/fnox.toml. Region `garage` is part of
# every SigV4 signature.
AWS_REGION = "garage"
# Same as every Stack CR: no copy of the previous checkpoint in
# .pulumi/backups/ per update (kubernetes/apps/pulumi/history-pruner/cronjob.yaml).
PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS = "true"
# Same as every Stack CR: gzip every state write (<stack>.json.gz). The backend
# reads whichever of .json/.json.gz is newest, so a CLI run without this still
# works -- but keep the two in step, or each side rewrites the other's format.
PULUMI_DIY_BACKEND_GZIP = "true"
# 1Password Connect, which Pulumi still WRITES PBS items to. CONNECT_TOKEN, the
# Pulumi passphrase, the authentik token and the Tailscale OAuth client are in
# .config/fnox.toml.
CONNECT_HOST = "https://op-connect.equestria.{{ env.ROOT_DOMAIN }}/"
CONNECT_VAULT = "Eris"

# The toolport MCP doors that .mcp.json reads. It has no defaults, because a
# default would name the domain. An agentboard or kube-coder pod exports its
# own TOOLPORT_<PROFILE>_URL (the in-cluster proxy that presents the bearer),
# and get_env keeps that; anywhere else it is the profile's OAuth door
# (docs/kubernetes/agentboard-mcp.md).
TOOLPORT_INFRASTRUCTURE_URL = "{{ get_env(name='TOOLPORT_INFRASTRUCTURE_URL', default='https://toolport-infrastructure.agents.' ~ env.ROOT_DOMAIN ~ '/mcp') }}"
TOOLPORT_NETWORKING_URL = "{{ get_env(name='TOOLPORT_NETWORKING_URL', default='https://toolport-networking.agents.' ~ env.ROOT_DOMAIN ~ '/mcp') }}"
TOOLPORT_HOME_URL = "{{ get_env(name='TOOLPORT_HOME_URL', default='https://toolport-home.agents.' ~ env.ROOT_DOMAIN ~ '/mcp') }}"
TOOLPORT_MEDIA_URL = "{{ get_env(name='TOOLPORT_MEDIA_URL', default='https://toolport-media.agents.' ~ env.ROOT_DOMAIN ~ '/mcp') }}"
TOOLPORT_POSTGRES_URL = "{{ get_env(name='TOOLPORT_POSTGRES_URL', default='https://toolport-postgres.agents.' ~ env.ROOT_DOMAIN ~ '/mcp') }}"
TOOLPORT_RESEARCH_URL = "{{ get_env(name='TOOLPORT_RESEARCH_URL', default='https://toolport-research.agents.' ~ env.ROOT_DOMAIN ~ '/mcp') }}"
_.python.venv = { path = "{{config_root}}/.venv", create = true }

# Where OpenBao is. fnox's openbao provider (.config/fnox/openbao.lua) reads
# this, and so does `components/bao.ts` for the Pulumi provider.
#
# The AppRole they log in with, BAO_ROLE_ID / BAO_SECRET_ID, is in
# .config/fnox.toml (from .config/bao-approle.sops.yaml). It used to be a pair
# of `ref+sops://` values here, which is why vals-run had to resolve in two
# passes; fnox resolves a provider's credential before the provider itself.
#
# BAO_AUTH_METHOD selects AppRole over token auth for `vals`, which
# components/store/refs.ts still spawns to resolve ref+openbao:// inside
# documents.
BAO_ADDR = "https://bao.equestria.{{ env.ROOT_DOMAIN }}"
BAO_AUTH_METHOD = "approle"

# Where talhelper writes the generated admin talosconfig, and where every
# `talos:*` task expects to find it. Set globally so an ad-hoc `talosctl` in
# this repo targets equestria too.
#
# This path does not exist until `mise run talos:genconfig` has run —
# talos/clusterconfig/.gitignore excludes the generated files, including this
# one. Pointing an env var at a missing file is inert; talosctl only complains
# when you actually use it.
#
# NOT pointed at the tracked talos/talosconfig: that one carries
# `endpoints: []`, so every command through it would need an explicit
# `--endpoints`.
#
# Note what is deliberately NOT set here: KUBECONFIG. This repo carries no
# kubeconfig, and pinning the var at a missing path would break every kubectl
# invocation for anyone using their own. The kubectl/flux tasks therefore
# follow the ambient context — check `kubectl config current-context` first.
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

# UNIFI_HOST = "unifi.<root domain>"
# UNIFI_USERNAME = "op://Eris/unifipoller/username"
# UNIFI_PASSWORD = "op://Eris/unifipoller/password"
# UNIFI_API_KEY = "op://Eris/Unifi Api Key Eris Cluster/credential"
# UNIFI_PORT = "443"
#
# UNIFI_SITE = "default"
# UNIFI_VERIFY_SSL = "false"
# UNIFI_TOOL_REGISTRATION_MODE = "lazy"
# PULUMI_DEBUG_PROMISE_LEAKS = "1"
# Pinned version of the Pkl VS Code extension installed by the `pkl-vscode`
# task. Renovate has no datasource for a VSIX, so this is bumped by hand
# against https://github.com/apple/pkl-vscode/releases.
PKL_VSCODE_VERSION = "0.22.0"
HK_MISE = 1
# Keep npm's download cache inside the mise data dir so jdx/mise-action's
# cache (which caches MISE_DATA_DIR / ~/.local/share/mise) also persists npm
# tarballs across CI runs. `npm ci` still wipes node_modules, but reuses these.
npm_config_cache = "{{env.HOME}}/.local/share/mise/npm-cache"

[hooks]
# NOT `postinstall = ["hk install --mise", "npm install", "pulumi install"]`.
# mise does not read a bare array of strings as a list of commands -- it reads
# it as one command plus its arguments, so that form actually ran
# `pulumi install "hk install --mise"`, failed with `accepts 0 arg(s),
# received 1`, and silently never ran `hk install --mise` or `npm install` at
# all. On a fresh clone that left hk's git hooks unregistered, which quietly
# disables every check in .config/hk.pkl.
#
# The array-of-tables form below is the documented way to get three separate
# subprocesses. A multiline string also works but shares one shell, so an early
# failure would take the later commands with it.
postinstall = [
  { run = "hk install --mise" },
  { run = "npm install" },
  { run = "pulumi install" },
  # NOT `graphify hook install` any more. Its post-commit and post-checkout
  # hooks rebuild graphify-out/ in a DETACHED process, so the output could
  # only ever land after the commit, as working-tree dirt against tracked
  # files. hk's pre-commit `graphify` step now rebuilds synchronously on main
  # and stages the result into the commit itself (.config/hk.pkl,
  # .config/hooks/graphify-precommit.sh). This strips the old detached
  # blocks from .git/hooks -- crew's sections stay -- and keeps graph.json's
  # union merge driver registered. Idempotent.
  { run = ".config/hooks/retire-graphify-hooks.sh" }
]
