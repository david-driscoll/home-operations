
[tools]
python = "3.14.7"
kubectl = "1.36.3"
# kubectl plugin (invoked as `kubectl cnpg ...`) for CNPG replica surgery and
# planned primary switchovers -- see docs/cluster-consolidation/*.md, which
# repeatedly calls out `kubectl cnpg destroy`/`promote` over touching a PVC or
# forcing a failover by hand.
"github:cloudnative-pg/cloudnative-pg" = { version = "v1.30.0", bin = "kubectl-cnpg" }
powershell-core = "7.6.5"
1password-cli = "2.39.0"
# Talos tooling for the `talos:*` tasks under .config/mise/tasks/talos/, ported
# from equestria-cluster alongside the talos/ tree in 9cd47c0a.
#
# `talosctl` MUST stay in step with talos/talenv.yaml's talosVersion. That is
# not a convention, it is enforced: `mise run talos:validate-config` compares
# the two and refuses to validate a machine config with a mismatched schema.
# Renovate bumps talenv.yaml from the ghcr.io/siderolabs/installer tag; this
# line has to move with it.
talosctl = "1.13.9"
talhelper = "3.1.16"
yq = "4.53.6"
jq = "1.8.2"
sops = "3.13.3"
flux2 = "2.9.4"
age = "1.3.1"
gh = "2.97.0"
# Git hook manager (see .config/hk.pkl). MUST stay pinned here: hk registers
# itself as `hk run pre-commit --from-hook` via git config, and an unpinned mise
# shim fails inside the hook with `mise ERROR No version is set for shim: hk`.
# The hook exits non-zero and git aborts the commit.
hk = "1.56.0"
pkl = "0.32.1"
biome = "2.5.2"
typos = "1.49.0"
# Linters invoked by hk. The same pinning rule as hk applies -- an unpinned
# shim here fails the individual step rather than the whole commit, but still
# breaks the hook. Versions match david-driscoll/equestria-cluster, which runs
# the same three steps against the same .yamllint / .shellcheckrc.
#
# actionlint shells out to `shellcheck` for `run:` blocks, so it hard-fails with
# a `fatal error` if shellcheck is on PATH as an unpinned shim -- which is the
# second, independent reason shellcheck is pinned rather than assumed.
actionlint = "1.7.12"
shellcheck = "0.11.0"
"pipx:yamllint" = "1.38.0"
"npm:typescript" = "5.9.3"
node = "24.19.0"
pulumi = "3.259.0"
"github:microsoft/apm" = { version = "v0.28.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.1", bin = "skillfile" }
"github:home-operations/flate" = "v0.5.0"
dotnet = { version = "10.0.203" }
# Secret-reference resolver for ref+openbao:// (PLAN §D.1). Keep this version
# in step with the vals initContainer in kubernetes/apps/pulumi/*/stack.yaml —
# the workspace pods install the same pin via mise.
vals = "0.46.0"

[tasks.codegen]
description = 'Regenerate types/application-definition.d.ts from schemas/'
# schemas/ is the source of truth for the ApplicationDefinition types that
# components/ and stacks/ compile against, and for the `$schema` every
# kubernetes/**/definition.yaml points at. The generator also asserts that the
# Gatus endpoint key set in schemas/gatus.schema.json matches the one in
# kubernetes/apps/observability/crds/application-crd.yaml -- the CRD carries no
# x-kubernetes-preserve-unknown-fields, so a key the CRD does not list is
# silently PRUNED by the API server on apply and never reaches the Pulumi stack
# that renders the Gatus config.
#
# `--no-install` keeps this honest: json-schema-to-typescript and yaml are
# devDependencies, so a missing `npm ci` fails loudly here instead of silently
# resolving a different version off the network.
run = ['npx --no-install tsx scripts/generate-types.ts']

[tasks.update]
description = 'Update all apps that have an update script'
# `depends`, not another `run` line, so codegen still happens if the dotnet
# step below fails. It currently always does: `.mise/tasks/do-update.cs` was
# never carried over from equestria-cluster and does not exist in this repo, so
# `mise run update` errors on its first line. Left as-is rather than papered
# over -- porting that script is its own piece of work.
depends = ['codegen']
run = [
  'dotnet run .mise/tasks/do-update.cs',
  # `mise task <name>` prints information about a task; `mise run <name>` runs
  # it. This line was the former and had never actually run flate.
  'mise run flate',
]

[tasks.flate]
description = 'Run flate'
# `--path` scopes flate to the Flux entrypoint. Without it flate walks the whole
# repo and tries to parse every JSON/TS file it finds, emitting a
# `loader: file failed to parse` line for each sdks/*/tsconfig.json before
# arriving at the same 350 resources. Scoped, the run drops from ~5s to ~1.5s.
# Kept in step with the `flate` step in .config/hk.pkl.
run = [
  'flate test all --path ./kubernetes/flux/cluster --allow-missing-secrets --source-retry-attempts 10',
]

[tasks.eso-values-lint]
description = 'Lint configMapGenerator-slurped files for live envsubst/Go-template in comments'
# The half `flate` cannot see: Flux postBuild envsubst and the external-secrets
# `templateAs: Values` engine both treat a comment as live text, so a `${VAR}`
# or `{{ ... }}` inside one is executed. Twice the cause of a CrowdSec outage
# (vault#111). Kept in step with the `eso-values-lint` step in .config/hk.pkl
# and the job of the same name in .github/workflows/flux-local.yaml.
#
# `go -C` is required (nested module, no go.mod at the repo root) and it also
# changes the program's working directory, so the target must be absolute.
run = [
  'go -C scripts/eso-values-lint run . "$(git rev-parse --show-toplevel)/kubernetes"',
]

[tasks.pkl-vscode]
description = 'Install the Pkl VS Code extension (not on the marketplace; installed from VSIX)'
# Ported from rocketsurgeonsguild/Specular. Not part of [hooks] postinstall on
# purpose: it needs the `code` CLI and touches the user's editor, which is not
# something `mise install` should do unasked. Run it once by hand.
run = ['bash scripts/install-pkl-vscode.sh']

[settings]
experimental = true
prereleases = true
idiomatic_version_file_enable_tools = ["dotnet"]
# Put mise's tool paths AHEAD of the ambient PATH.
#
# Without this, /opt/homebrew/bin shadows every pinned tool. Found 2026-08-17
# when `talos:validate-config` refused to run: it compares `talosctl version`
# against talos/talenv.yaml and reported v1.13.5 while [tools] pins 1.13.8 —
# because all 15 talos tasks were resolving Homebrew's talosctl, not mise's.
# The gate was right and the environment was wrong.
#
# It is not hypothetical or talosctl-specific: the estate has hit the same
# shadowing with a Homebrew `pulumi` ahead of mise's. Pinning a tool version in
# [tools] means nothing if a task can silently run a different binary, and the
# failure is quiet — a Talos config generated for 1.13.8 validated by a 1.13.5
# client.
activate_aggressive = true

[env]
# Secret values are `vals` references, resolved per command:
#
#   mise exec -- ./scripts/vals-run pulumi preview
#
# They were `op://` literals, which mise passed through untouched and `op run`
# substituted — so every value had to come from 1Password. Each one now names
# its own backend (openbao, sops, op, …), and moving a value between stores is
# a one-line edit here.
#
# Resolution is per command rather than by mise itself on purpose: mise
# re-evaluates `[env]` on EVERY load with no caching, so resolving here would
# hit OpenBao on every `cd` into the repo and break the shell whenever you are
# off-network or without an age key.
#
# `mise run vals-run` is the `op run` replacement — it resolves whatever `ref+`
# values are in the environment. It is self-contained: the OpenBao credential
# comes from the BAO_* references at the bottom of this block, so there is no
# `eval "$(../vault/bootstrap/openbao/pulumi-env.sh)"` step any more. That
# script still works and is still the break-glass path when this repo's
# AppRole is revoked.
AWS_ACCESS_KEY_ID = "ref+openbao://secrets/shared/minio-root-user#/username"
AWS_SECRET_ACCESS_KEY = "ref+openbao://secrets/shared/minio-root-user#/password"
AWS_REGION = "home"
# The Pulumi state passphrase. It lives in OpenBao like everything else
# (estate decision 2026-08-12), reached through the AppRole that
# pulumi-env.sh exports — so the chain is age key -> sops -> AppRole ->
# OpenBao, and no step needs 1Password.
#
# bootstrap/openbao/pulumi-passphrase.sops.yaml is KEPT as break-glass: if
# OpenBao is sealed or unreachable, that offline copy is what still lets
# you decrypt state and run Pulumi to fix it. Point this at the sops file
# if you ever need that.
PULUMI_CONFIG_PASSPHRASE = "ref+openbao://secrets/shared/pulumi-passphrase#/password"
CONNECT_HOST = "https://op-connect.equestria.driscoll.tech/"
CONNECT_VAULT = "Eris"
# Still needed: Pulumi WRITES the PBS items a human logs into the generated
# LXCs with (Phase 11 estate decision). Nothing READS 1Password any more.
CONNECT_TOKEN = "ref+openbao://secrets/shared/eris-1password-connect-access-token#/credential"
AUTHENTIK_TOKEN = "ref+openbao://secrets/clusters/alpha-site/apps/authentik/token#/credential"
AUTHENTIK_URL = "ref+openbao://secrets/clusters/alpha-site/apps/authentik/token#/url"
_.python.venv = { path = "{{config_root}}/.venv", create = true }

# How every ref+openbao:// value above authenticates.
#
# `vals` reads BAO_ADDR / BAO_ROLE_ID / BAO_SECRET_ID (its openbao provider is
# BAO_*-only — it does not fall back to VAULT_*), and BAO_AUTH_METHOD selects
# AppRole over the default token auth. `components/bao.ts` reads the same three
# for the Pulumi provider, so one credential covers vals and Pulumi both.
#
# The role_id/secret_id are themselves `ref+`, which is why the ordering is not
# free: .config/mise/tasks/vals-run resolves these BAO_* references in a first
# pass (sops, age key only) before resolving anything that needs OpenBao. A
# single-pass resolve authenticates with the literal string "ref+sops://…" and
# fails with a bare 403.
#
# The AppRole lives in SOPS, not in OpenBao: the credential you authenticate
# WITH cannot live in the store it unlocks (vault:bootstrap/INVENTORY.md §2).
# Create or rotate it with ./scripts/bao-mise-approle.sh — the sealed file is
# committed, and the age key is what actually gates access.
BAO_ADDR = "https://bao.equestria.driscoll.tech"
BAO_AUTH_METHOD = "approle"
BAO_ROLE_ID = "ref+sops://{{config_root}}/.config/bao-approle.sops.yaml#/role_id"
BAO_SECRET_ID = "ref+sops://{{config_root}}/.config/bao-approle.sops.yaml#/secret_id"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"

# Where talhelper writes the generated admin talosconfig, and where every
# `talos:*` task expects to find it. Set globally so an ad-hoc `talosctl` in
# this repo targets equestria too, matching what equestria-cluster's Taskfile
# did with its `env:` block.
#
# This path does not exist until `mise run talos:genconfig` has run —
# talos/clusterconfig/.gitignore excludes the generated files, including this
# one. Pointing an env var at a missing file is inert; talosctl only complains
# when you actually use it.
#
# NOT pointed at the tracked talos/talosconfig: that one carries
# `endpoints: []`, so every command through it would need an explicit
# `--endpoints`.
#
# Note what is deliberately NOT set here: KUBECONFIG. equestria-cluster's
# Taskfile pinned it to a repo-local ./kubeconfig; this repo carries no such
# file, and setting it to a missing path would break every kubectl invocation
# for anyone using their own. The migrated kubectl/flux tasks therefore follow
# the ambient context — check `kubectl config current-context` first.
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

# UNIFI_HOST = "unifi.driscoll.tech"
# UNIFI_USERNAME = "op://Eris/unifipoller/username"
# UNIFI_PASSWORD = "op://Eris/unifipoller/password"
# UNIFI_API_KEY = "op://Eris/Unifi Api Key Eris Cluster/credential"
# UNIFI_PORT = "443"
#
# UNIFI_SITE = "default"
# UNIFI_VERIFY_SSL = "false"
# UNIFI_TOOL_REGISTRATION_MODE = "lazy"
# PULUMI_DEBUG_PROMISE_LEAKS = "1"
# Pinned version of the Pkl VS Code extension installed by the `pkl-vscode`
# task. Renovate has no datasource for a VSIX, so this is bumped by hand
# against https://github.com/apple/pkl-vscode/releases.
PKL_VSCODE_VERSION = "0.22.0"
HK_MISE = 1
# Keep npm's download cache inside the mise data dir so jdx/mise-action's
# cache (which caches MISE_DATA_DIR / ~/.local/share/mise) also persists npm
# tarballs across CI runs. `npm ci` still wipes node_modules, but reuses these.
npm_config_cache = "{{env.HOME}}/.local/share/mise/npm-cache"

[hooks]
# NOT `postinstall = ["hk install --mise", "npm install", "pulumi install"]`.
# mise does not read a bare array of strings as a list of commands -- it reads
# it as one command plus its arguments, so that form actually ran
# `pulumi install "hk install --mise"`, failed with `accepts 0 arg(s),
# received 1`, and silently never ran `hk install --mise` or `npm install` at
# all. On a fresh clone that left hk's git hooks unregistered, which quietly
# disables every check in .config/hk.pkl.
#
# The array-of-tables form below is the documented way to get three separate
# subprocesses. A multiline string also works but shares one shell, so an early
# failure would take the later commands with it.
postinstall = [
  { run = "hk install --mise" },
  { run = "npm install" },
  { run = "pulumi install" },
]
