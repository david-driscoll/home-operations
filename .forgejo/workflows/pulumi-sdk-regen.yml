---
# The forge's copy of .github/workflows/pulumi-sdk-regen.yaml: completes
# Renovate's half of a bridged-provider bump, for a pull request opened on the
# Forgejo copy of this repository (docs/runbooks/forgejo-github-mirror.md).
# GitHub never reads this directory and Forgejo never reads that one, so the two
# files are kept in step by hand.
#
# The reason is the same as there. A bump in the root Pulumi.yaml `packages:`
# block changes only the human-editable pin; the SDK under sdks/<name>/ keeps
# the old version in its package.json and in the base64 parameterization blob
# the bridge resolves the provider from, so a merge without a regeneration
# quietly keeps running the old provider. `pulumi install` regenerates every SDK
# from Pulumi.yaml; this runs it, type-checks against the result, and commits it
# back onto the pull request's branch.
#
# It matters more here than there. What merges on the forge is pushed straight
# to GitHub's main, past the pull request GitHub would have put this workflow in
# front of -- and the forge's Renovate automerges the unifi provider bump. Until
# this file existed the forge's Renovate did not raise Pulumi.yaml bumps at all.
#
# Where it differs from the GitHub file, and why:
#
#   * No `permissions:` block. Forgejo's job token is already scoped to this
#     repository, and a push made with it starts no workflow -- the same
#     property the GitHub file relies on -- so the status below is what the new
#     head is judged by, not a re-run of flate or image-check.
#   * The commit is authored as `renovate[bot]`, Renovate's own `gitAuthor` on
#     the forge (kubernetes/apps/coder/renovate/renovatejob.yaml). That is what
#     keeps Renovate treating the branch as its own: on the forge the ignored
#     author is an address under the root domain, which the sync would refuse
#     to publish, and `github-actions[bot]` is not on that list.
#   * The pull request's author is a forge account, not `renovate[bot]`, so the
#     "is this Renovate's" test is the branch name (`renovate/`) instead.
#   * The status is posted with the forge's API, as flate.yml posts its comment.
name: pulumi-sdk-regen

on:
  pull_request:
    branches: ["main"]
    paths: ["Pulumi.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  regen:
    name: Regenerate SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Renovate's own branches in this repository only: pushing to a person's
    # branch, or a fork's, is not this workflow's business.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # The same versions the repo pins for everyone else, read from the mise
      # config rather than repeated here.
      - name: Read pinned versions
        id: pins
        run: |
          {
            echo "node=$(yq -p toml -oy '.tools.node' .config/mise.toml)"
            echo "pulumi=$(yq -p toml -oy '.tools.pulumi' .config/mise.toml)"
            echo "typescript=$(yq -p toml -oy '.tools["npm:typescript"]' .config/mise.toml)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Setup Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ steps.pins.outputs.pulumi }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check before regeneration
        env:
          TS_VERSION: ${{ steps.pins.outputs.typescript }}
        run: scripts/sdk-typecheck > "$RUNNER_TEMP/before.txt"

      - name: Regenerate SDKs
        run: pulumi install

      - name: Commit regenerated SDKs
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add sdks package-lock.json
          if git diff --cached --quiet; then
            echo "SDKs already match Pulumi.yaml; nothing to commit"
            exit 0
          fi
          git diff --cached --stat
          changed=$(git diff --cached --name-only -- 'sdks/*/package.json' | cut -d/ -f2 | sort -u | paste -sd, -)
          git config user.name "renovate[bot]"
          git config user.email "29139614+renovate[bot]@users.noreply.github.com"
          git commit -m "chore(sdks): regenerate ${changed} from Pulumi.yaml" \
            -m "pulumi install, run by .forgejo/workflows/pulumi-sdk-regen.yml"
          git push origin "HEAD:${HEAD_REF}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The pushed head has no status of its own until the check below ends,
      # and the forge's Renovate reads "no status" as nothing to wait for.
      # Say so at once.
      - name: Mark the pushed commit pending
        if: ${{ steps.commit.outputs.sha != '' }}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ vars.MIRROR_FORGEJO_URL || github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            --data "$(jq -n --arg url "$RUN_URL" \
              '{state: "pending", context: "pulumi-sdk-regen", description: "Type-checking against the regenerated SDK", target_url: $url}')" \
            "${SERVER%/}/api/v1/repos/${REPOSITORY}/statuses/${SHA}"

      # Only errors the regeneration INTRODUCED fail this. The tree carries
      # type errors of its own on main, and they are not this PR's to fix.
      - name: Type-check after regeneration
        id: check
        if: ${{ steps.commit.outputs.sha != '' }}
        env:
          TS_VERSION: ${{ steps.pins.outputs.typescript }}
        run: |
          scripts/sdk-typecheck > "$RUNNER_TEMP/after.txt"
          new=$(comm -13 "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt")
          if [[ -n "$new" ]]; then
            echo "### New type errors against the regenerated SDK"
            echo "$new"
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "desc=$(echo "$new" | wc -l | tr -d ' ') new type error(s) against the new SDK" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "desc=SDKs regenerated; no new type errors" >> "$GITHUB_OUTPUT"
          fi

      - name: Report on the pushed commit
        if: ${{ !cancelled() && steps.commit.outputs.sha != '' }}
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ vars.MIRROR_FORGEJO_URL || github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          STATE: ${{ steps.check.outputs.result || 'failure' }}
          DESC: ${{ steps.check.outputs.desc || 'type-check did not run' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            --data "$(jq -n --arg state "$STATE" --arg desc "$DESC" --arg url "$RUN_URL" \
              '{state: $state, context: "pulumi-sdk-regen", description: $desc, target_url: $url}')" \
            "${SERVER%/}/api/v1/repos/${REPOSITORY}/statuses/${SHA}"
          [[ "$STATE" == success ]]
