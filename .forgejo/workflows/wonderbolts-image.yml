---
# Builds the region picker app (apps/wonderbolts, docs/plans/wonderbolts-nuxt.md,
# ADR 0006) and pushes it to this forge's container registry as
# git.<root domain>/estate-images/wonderbolts. Forge-only, like
# ./pulumi-workspace-image.yml, whose shape this follows; the pull-request
# check is the GitHub twin, .github/workflows/wonderbolts.yaml, which never
# pushes.
#
# TRUSTED TRIGGERS ONLY. Never `pull_request`: the push token below can
# overwrite any tag of this image. A tag overwrite alone gets nowhere -- the
# HelmRelease pins the image by DIGEST -- but there is no reason to hand the
# token to a branch's workflow.
#
# NO DOCKER DAEMON. The forge's job containers get no Docker socket
# (kubernetes/apps/coder/forgejo-runner/resources/config.yml). Nuxt's build
# output (.output/) is self-contained, so the image is the base plus that one
# directory: built here in the base itself, so nothing in it was compiled
# against another libc, then appended as one layer with `crane mutate`.
name: wonderbolts-image

on:
  push:
    branches: [main]
    paths:
      - apps/wonderbolts/**
      - .forgejo/workflows/wonderbolts-image.yml
  workflow_dispatch: {}

concurrency:
  group: wonderbolts-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The container it is built in, AND the base the image is appended to:
    # "Work out the tag" reads this very line back as the base, so the build
    # runs on exactly the filesystem it ships on. One pin, the one Renovate's
    # github-actions manager bumps; a second copy in env drifted the first
    # time it did (f09d6851 bumped this line only).
    container:
      image: node:24-alpine@sha256:a34ab6d7f6f4813f4d0c5469d74685604b962fbdbf5793a7bc7b4998ecb867c8
    env:
      # The account that owns the image (stacks/system/forgejo-github-mirror.ts).
      IMAGE_OWNER: estate-images
      IMAGE_NAME: wonderbolts
      APP_DIR: apps/wonderbolts
      # Where the HelmRelease pins the image; the report and the pruning read it.
      PIN_FILE: kubernetes/apps/netbird-system/wonderbolts/helmrelease.yaml
      # The forge's PUBLIC host, the name nodes pull by; see
      # ./pulumi-workspace-image.yml for why not github.server_url.
      ROOT_DOMAIN: ${{ secrets.PRIVATE_DOMAIN_ROOT }}
    steps:
      # node:24-alpine has sh and busybox only. git first, so checkout keeps
      # .git and the tag can hash the app's tree; GNU tar for --sort and
      # --numeric-owner.
      - name: Tools
        shell: sh
        run: apk add --no-cache bash git curl tar

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the tag counts commits (below).
          fetch-depth: 0

      - name: Work out the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          # The job container's pin, above: the one image reference in this file.
          pinned="$(sed -nE 's#^      image: (node:[^[:space:]]+@sha256:[0-9a-f]{64})$#\1#p' .forgejo/workflows/wonderbolts-image.yml)"
          if [ "$(printf '%s\n' "$pinned" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one pinned 'image: node:<tag>@sha256:<digest>' line in this workflow"
            exit 1
          fi
          BASE_IMAGE="docker.io/library/${pinned}"
          version="$(node -p "require('./${APP_DIR}/package.json').version")"
          # <major>.<minor> from package.json, then how many commits on this
          # branch touched the app or this file (which holds the base pin). The
          # count only grows on main, so docker versioning can order the tags
          # and Renovate can bump the HelmRelease's pin (.github/renovate.json5,
          # "Estate images on the forge's registry"); a hash suffix, as the
          # first tags had, is an incompatible suffix to it, so it never moved.
          # A re-run at the same commit, or a commit touching neither path,
          # gets the same tag and finds it already built.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::error::shallow checkout: the tag needs the whole history to count commits"
            exit 1
          fi
          IFS=. read -r major minor _ <<< "$version"
          count="$(git rev-list --count HEAD -- "$APP_DIR" .forgejo/workflows/wonderbolts-image.yml)"
          tag="${major}.${minor}.${count}"
          if [ -z "$ROOT_DOMAIN" ]; then
            echo "::error::PRIVATE_DOMAIN_ROOT is not set on this repository (stacks/system sets it)"
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "path=${IMAGE_OWNER}/${IMAGE_NAME}:${tag}"
            echo "base=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: git.${ROOT_DOMAIN}/${IMAGE_OWNER}/${IMAGE_NAME}:${tag}"

      - name: Setup crane
        shell: bash
        env:
          # The same pin as ./pulumi-workspace-image.yml and ./image-check.yml;
          # bump all three together.
          CRANE_VERSION: "0.22.1"
          CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/crane.tgz" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in and check for the tag
        id: exists
        shell: bash
        env:
          IMAGE_PATH: ${{ steps.tag.outputs.path }}
          # write:package for IMAGE_OWNER, minted by stacks/system.
          TOKEN: ${{ secrets.ESTATE_IMAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::ESTATE_IMAGES_TOKEN is not set on this repository yet (stacks/system creates it)"
            exit 1
          fi
          REGISTRY="git.${ROOT_DOMAIN}"
          REF="${REGISTRY}/${IMAGE_PATH}"
          printf '%s' "$TOKEN" | crane auth login "$REGISTRY" --username "$IMAGE_OWNER" --password-stdin
          # Only "no such tag" means build; anything else fails here with crane's message.
          if digest="$(crane digest "$REF" 2>"$RUNNER_TEMP/digest.err")"; then
            echo "Already built: ${REF}@${digest}"
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          elif grep -qE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|404 Not Found' "$RUNNER_TEMP/digest.err"; then
            echo "Not built yet: ${REF}"
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not check ${REF} in the registry"
            cat "$RUNNER_TEMP/digest.err"
            exit 1
          fi

      - name: Build
        if: ${{ steps.exists.outputs.built != 'true' }}
        shell: bash
        working-directory: apps/wonderbolts
        run: |
          set -euo pipefail
          npm ci
          npm run test:unit
          npm run build

      - name: Push
        id: push
        if: ${{ steps.exists.outputs.built != 'true' }}
        shell: bash
        env:
          IMAGE_PATH: ${{ steps.tag.outputs.path }}
          BASE_IMAGE: ${{ steps.tag.outputs.base }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          REF="git.${ROOT_DOMAIN}/${IMAGE_PATH}"
          # .output/ becomes /app, root-owned and read-only to the app's uid.
          stage="$(mktemp -d)"
          mkdir "$stage/app"
          cp -a "${APP_DIR}/.output/." "$stage/app/"
          layer="$RUNNER_TEMP/layer.tar.gz"
          tar --create --gzip --file "$layer" --directory "$stage" --numeric-owner --owner=0 --group=0 --sort=name app
          ls -l "$layer"
          # The base's linux/amd64 manifest, resolved now, so the layer lands on
          # the filesystem it was built on.
          base="docker.io/library/node@$(crane digest --platform linux/amd64 "$BASE_IMAGE")"
          crane mutate "$base" \
            --append "$layer" \
            --workdir /app \
            --user 1000:1000 \
            --env NODE_ENV=production --env HOST=0.0.0.0 --env PORT=8080 \
            --cmd node,/app/server/index.mjs \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.title=wonderbolts" \
            --tag "$REF"
          echo "digest=$(crane digest "$REF")" >> "$GITHUB_OUTPUT"

      # The HelmRelease pins tag AND digest, so a new image goes live only when
      # that line changes; this prints it. (Renovate does not bump it yet: the
      # reference is written git.${ROOT_DOMAIN}/..., which it cannot resolve.)
      - name: Report
        if: ${{ always() && steps.tag.outputs.path != '' }}
        shell: bash
        env:
          IMAGE_PATH: ${{ steps.tag.outputs.path }}
          DIGEST: ${{ steps.push.outputs.digest || steps.exists.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || exit 0
          wanted="${IMAGE_PATH#*/}"
          wanted="${wanted#*:}@${DIGEST}"
          pinned="$(sed -nE 's#.*tag: ([^[:space:]]+@sha256:[0-9a-f]+).*#\1#p' "$PIN_FILE" 2>/dev/null | head -n1 || true)"
          echo "built:  ${IMAGE_NAME}:${wanted}"
          echo "pinned: ${pinned:-<none>}"
          if [ "$pinned" != "$wanted" ]; then
            echo "::notice::${PIN_FILE} pins ${pinned:-nothing}; to roll this image out set tag: ${wanted}"
          fi

      # RETENTION, as in ./pulumi-workspace-image.yml: keep the pinned tag, this
      # run's, and the KEEP_NEWEST most recent; delete the rest. A tag is a hash
      # of its inputs, so a deleted one is rebuilt by re-running at its commit.
      - name: Prune old versions
        if: ${{ !cancelled() && steps.exists.outcome == 'success' }}
        shell: bash
        env:
          KEEP_NEWEST: "5"
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.ESTATE_IMAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f "$PIN_FILE" ]; then
            echo "::notice::${PIN_FILE} does not exist yet; not pruning"
            exit 0
          fi
          pinned="$(sed -nE 's#.*tag: ([^@[:space:]]+)@sha256:.*#\1#p' "$PIN_FILE" | head -n1)"
          if [ -z "$pinned" ]; then
            echo "::error::could not read the pinned tag from ${PIN_FILE}; not pruning"
            exit 1
          fi
          echo "pinned: ${pinned}"
          echo "current: ${CURRENT_TAG}"
          page=1
          : > "$RUNNER_TEMP/versions.jsonl"
          while :; do
            body="$(curl -fsS -H "Authorization: token ${TOKEN}" \
              "${API}/packages/${IMAGE_OWNER}?type=container&q=${IMAGE_NAME}&limit=50&page=${page}")"
            count="$(printf '%s' "$body" | node -e '
              const all = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              for (const p of all) if (p.name === process.argv[1]) console.log(JSON.stringify({v: p.version, at: p.created_at}));
              console.error(all.length);
            ' "$IMAGE_NAME" 2>&1 >>"$RUNNER_TEMP/versions.jsonl")"
            [ "$count" -lt 50 ] && break
            page=$((page + 1))
          done
          mapfile -t doomed < <(node -e '
            const fs = require("node:fs");
            const [file, keepNewest, ...keep] = process.argv.slice(1);
            const versions = fs.readFileSync(file, "utf8").split("\n").filter(Boolean).map(JSON.parse)
              .sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
            const kept = new Set([...keep, ...versions.slice(0, Number(keepNewest)).map(x => x.v)]);
            for (const { v } of versions) if (!kept.has(v)) console.log(v);
          ' "$RUNNER_TEMP/versions.jsonl" "$KEEP_NEWEST" "$pinned" "$CURRENT_TAG")
          echo "$(wc -l < "$RUNNER_TEMP/versions.jsonl") versions, deleting ${#doomed[@]}"
          for v in "${doomed[@]}"; do
            echo "delete ${IMAGE_NAME}:${v}"
            curl -fsS -X DELETE -H "Authorization: token ${TOKEN}" \
              "${API}/packages/${IMAGE_OWNER}/container/${IMAGE_NAME}/${v}"
          done
