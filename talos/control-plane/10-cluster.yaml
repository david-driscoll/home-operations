# Talos 1.14 moved every kube-* component out of `.cluster.*` in v1alpha1 and
# into its own document (#1914). The old and new forms are MUTUALLY EXCLUSIVE,
# so this file had to move wholesale: leaving `.cluster.apiServer` et al. in
# place fails rendering with "kube-apiserver config is already set in v1alpha1
# config (.cluster.apiServer)".
#
# `.cluster.etcd` is NOT part of that move -- it is not deprecated on 1.14 and
# is kept below. `.cluster.allowSchedulingOnControlPlanes: false` used to sit
# beside it; under TOPF the control-plane `NoSchedule` taint is a
# KubeNodeConfig taint (./12-node-role.yaml), and setting the v1alpha1 field
# as well fails validation (".cluster.allowSchedulingOnControlPlanes is already
# set in v1alpha1 config"). Same effect, no line here.
cluster:
  etcd:
    extraArgs:
      # Keeps etcd metrics on 2381. Talos 1.14 split etcd's HTTP endpoints onto
      # a new port 2383 (they used to share the 2379 client port), but an
      # explicit listen-metrics-urls overrides that default -- verified on all
      # three control planes after the 1.14.1 rollout: 2381 serves /metrics and
      # 2383 is closed. Nothing in the Prometheus scrape config had to change.
      listen-metrics-urls: http://0.0.0.0:2381
      quota-backend-bytes: 4294967296
      election-timeout: 5000
    advertisedSubnets:
      - 10.10.0.0/16
---
# Was `.cluster.coreDNS.disabled: true`. The cluster runs its own CoreDNS, so
# Talos must not deploy one. LOAD-BEARING under TOPF: a generated 1.14 config
# carries `KubeCoreDNSConfig {enabled: true}`, and that document wins over any
# v1alpha1 field.
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# Was `.cluster.apiServer.extraArgs` + `.cluster.apiServer.resources`.
# NOTE: extraArgs values are strings in the new documents, so `true` must be
# quoted -- an unquoted bool is rejected.
#
# `certExtraSANs` is set in ./11-apiserver-certsans.yaml.tpl, which needs the
# root domain from the environment.
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: "true"
resources:
  requests:
    cpu: 200m
    memory: 2Gi
  limits:
    memory: 4Gi
---
# Was `.cluster.apiServer.admissionControl: {$patch: delete}`.
#
# That deletion no longer has a v1alpha1 path to target -- admission control is
# its own document now, and the generated config carries one named
# `PodSecurity` (enforce: baseline, audit/warn: restricted, kube-system exempt).
# Deleting the DOCUMENT is the equivalent operation; without this the estate
# silently gains PodSecurity enforcement it has never run with.
#
# `$patch`, one dollar sign. talhelper ran envsubst over patches and needed
# `$$patch` to keep it literal; TOPF does not, and `$$patch` here would be an
# unknown key rather than a deletion.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$patch: delete
---
# Was `.cluster.secretboxEncryptionSecret`. The generated
# KubeEtcdEncryptionConfig is DELETED here and replaced wholesale by
# ./30-etcd-encryption.yaml.tpl, which sorts after this file. See that file
# for why -- short version: the generated document does not match what every
# Secret in etcd was written with, and the apiserver then cannot read Secrets.
#
# It has to be delete-then-add, not a merge: a strategic merge APPENDS to
# `config.resources`, leaving the generated entry first, and `$patch: replace`
# is not honoured inside the unstructured `config` field (it is copied through
# as a literal key). Both were tried.
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
$patch: delete
---
# Was `.cluster.controllerManager.extraArgs`. bind-address on 0.0.0.0 is what
# lets Prometheus scrape controller-manager; losing it fails silently (the
# scrape target just goes down), so it is called out here deliberately.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Was `.cluster.scheduler.extraArgs`. Same scrape-visibility reason as above.
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Was `.cluster.proxy.disabled: true` -- the flag is now `enabled` on the
# KubeProxyConfig document, inverted.
#
# THIS ONE IS LOAD-BEARING. Cilium runs with kube-proxy replacement; the
# generated KubeProxyConfig defaults to enabled, so dropping the v1alpha1
# block without restating this would deploy kube-proxy alongside Cilium.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
