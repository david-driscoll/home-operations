machine:
  registries:
    mirrors:
      # `overridePath: true` is REQUIRED on every mirror here and is why each
      # upstream endpoint carries an explicit `/v2`.
      #
      # It is a MIRROR-wide flag, not a per-endpoint one — Talos rejects
      # `endpoints` as a list of objects ("cannot construct !!map into string"),
      # so every endpoint of a mirror shares it. With it set, containerd uses the
      # endpoint URL exactly as written and appends only the repository path;
      # without it, it appends `/v2` itself.
      #
      # zot proxies each upstream under its own prefix (`/v2/<registry>/<repo>`),
      # which only resolves with `overridePath: true`. That same flag then means
      # a bare `https://index.docker.io` fallback is requested WITHOUT `/v2` —
      # which is not a registry API. Verified 2026-08-21:
      #
      #   https://index.docker.io/v2/library/busybox/manifests/latest  -> 401 (auth challenge, correct)
      #   https://index.docker.io/library/busybox/manifests/latest     -> 301 (redirect to a web page)
      #
      # So a mirror with `overridePath` and a bare upstream endpoint has a
      # fallback that cannot work, and a mirror without it has a zot endpoint
      # that cannot work (`…/v2/<registry>/v2/<repo>`). This file had four of the
      # first and three of the second. All seven are now consistent: cache first,
      # then the same cache via its ingress, then upstream — each with `/v2`.
      docker.io:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/docker.io
          - https://registry.driscoll.tech/v2/docker.io
          - https://index.docker.io/v2
          - https://registry-1.docker.io/v2
      gcr.io:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/gcr.io
          - https://registry.driscoll.tech/v2/gcr.io
          - https://gcr.io/v2
      quay.io:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/quay.io
          - https://registry.driscoll.tech/v2/quay.io
          - https://quay.io/v2
      ghcr.io:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/ghcr.io
          - https://registry.driscoll.tech/v2/ghcr.io
          - https://ghcr.io/v2
      registry.k8s.io:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/registry.k8s.io
          - https://registry.driscoll.tech/v2/registry.k8s.io
          # 307s to a regional mirror, which containerd follows.
          - https://registry.k8s.io/v2
      public.ecr.aws:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/public.ecr.aws
          - https://registry.driscoll.tech/v2/public.ecr.aws
          - https://public.ecr.aws/v2
      cgr.dev:
        overridePath: true
        endpoints:
          - http://registry.kube-system.svc.cluster.local:8080/v2/cgr.dev
          - https://registry.driscoll.tech/v2/cgr.dev
          - https://cgr.dev/v2
