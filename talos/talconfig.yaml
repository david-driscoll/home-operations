  #       {
  #         "disks": [
  #           {
  #             "path": "/var/mnt/longhorn",
  #             "allowScheduling": true,
  #             "tags":["nvme", "ssd"]
  #           }
  #         ]
  #       }
  #   schematic:
  #     customization:
  #       systemExtensions:
  #         officialExtensions:
  #           # - siderolabs/nonfree-kmod-nvidia-production
  #           - siderolabs/nvidia-container-toolkit-production
  #           - siderolabs/nvidia-open-gpu-kernel-modules-production
  #           - siderolabs/iscsi-tools
  #           - siderolabs/util-linux-tools
  #           # - siderolabs/tailscale
  #   networkInterfaces:
  #     - deviceSelector:
  #         hardwareAddr: "a8:a1:59:00:b7:17"
  #       dhcp: false
  #       addresses:
  #         - "10.10.206.12/16"
  #       routes:
  #         - network: "0.0.0.0/0"
  #           gateway: "10.10.0.1"
  #       mtu: 1500
  # - hostname: "unused"
  #   ipAddress: "10.10.206.13"
  - hostname: "hard-hat"
    ipAddress: "10.10.206.14"
    installDiskSelector:
      model: "KINGSTON SNV3S1000G"
    machineSpec:
      secureboot: false
    # Rotated out to a worker 2026-08-17 (piece 19). Talos cannot demote a
    # control plane in place, so this node was drained, removed from etcd,
    # wiped and rejoined — the same mechanism piece 18 used to promote the
    # ex-SGC nodes, run in the other direction.
    controlPlane: false
    userVolumes:
      - name: longhorn
        filesystem:
          type: xfs
        provisioning:
          diskSelector:
            match: disk.model == "Samsung SSD 990 EVO Plus 1TB"
          grow: false
          minSize: 1TB
          maxSize: 1TB
    nodeLabels: *nodeLabels
    nodeAnnotations: &amd_minifm_annotations
      node.longhorn.io/default-node-tags: '["bulk"]'
      node.longhorn.io/default-disks-config: |
        {
          "disks": [
            {
              "path": "/var/mnt/longhorn",
              "allowScheduling": true,
              "tags":["nvme", "ssd"]
            }
          ]
        }
    schematic: &amd_minifm_schematic
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/amd-ucode
            - siderolabs/amdgpu
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools

    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:11:7d:6a"
        dhcp: false
        addresses:
          - "10.10.206.14/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
        # No `vip:` here on purpose. This node carried
        # `vip: {ip: 10.10.206.201}` -- the API server VIP -- until 2026-08-24,
        # left behind by piece 19's rotation: it was a control plane, and the
        # stanza was not removed when it was wiped and rejoined as a worker.
        # fluttershy and kerfuffle had the same leftover.
        #
        # It was inert, and that was VERIFIED rather than assumed: ARP for
        # 10.10.206.201 resolves to othalla's NIC (e0:51:d8:19:d4:98), a current
        # control plane. Talos only advertises the VIP from a control plane, so a
        # worker declaring it simply never claims the address.
        #
        # Removed anyway, because "inert today" is not "correct": the stanza is
        # config that says this node may serve the Kubernetes API, and the next
        # person to read it -- or the next tool to act on it -- has no way to know
        # it is vestigial. The three control-plane entries below keep theirs.
        #
        # NOTE: talconfig.yaml is NOT GitOps -- Flux never reads it. This change
        # is inert in-cluster until someone applies it, and it should be applied
        # PER NODE (`talos:apply-node`), never with a blanket `mise run
        # talos:apply`, which would carry any pending Kubernetes version bump
        # into a tuppr-owned upgrade.
  # - hostname: "unused"
  #   ipAddress: "10.10.206.15"
  - hostname: "fluttershy"
    ipAddress: "10.10.206.16"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    # Rotated out of the control plane 2026-08-18, piece 19 (2 of 3). Talos
    # cannot demote in place, so this was a drain -> etcd leave -> wipe ->
    # rejoin-as-worker cycle, not a flag flip on a live node.
    controlPlane: false
    userVolumes: &intel_un1290_user_volumes
      - name: longhorn
        filesystem:
          type: xfs
        provisioning:
          diskSelector:
            match: disk.model == "Samsung SSD 990 EVO Plus 1TB"
          grow: false
          minSize: 1TB
          maxSize: 1TB
    nodeLabels:
      <<: *nodeLabels
      # Names this node's LAN parent interface so a Multus ipvlan NAD -- which
      # hardcodes exactly one `master` -- can pin its workload to nodes where
      # that parent exists. Consumed by jellyfin's nodeAffinity alongside the
      # Intel GPU label, since the GPU set alone spans both enp2s0 (workers)
      # and enp3s0 (control planes). See docs/lan-attach/README.md.
      lan-nic: enp2s0
    nodeAnnotations: &intel_un1290_annotations
      node.longhorn.io/default-node-tags: '["bulk"]'
      node.longhorn.io/default-disks-config: |
        {
          "disks": [
            {
              "path": "/var/mnt/longhorn",
              "allowScheduling": true,
              "tags":["nvme", "ssd"]
            }
          ]
        }
    schematic: &intel_un1290_schematic
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/i915
            - siderolabs/intel-ucode
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
    patches: &intel_un1290_patches []
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "58:47:ca:7a:09:3d"
        dhcp: false
        addresses:
          - "10.10.206.16/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
        # No `vip:` here on purpose -- see the note on hard-hat.
  - hostname: "kerfuffle"
    ipAddress: "10.10.206.17"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    # Rotated out of the control plane 2026-08-19, piece 19 (3 of 3 -- the last
    # one). Talos cannot demote in place, so this was drain -> etcd leave ->
    # wipe -> rejoin-as-worker. etcd is now the ex-SGC trio alone.
    controlPlane: false
    userVolumes: *intel_un1290_user_volumes
    nodeLabels:
      <<: *nodeLabels
      # See fluttershy above -- same NIC, same reason.
      lan-nic: enp2s0
    nodeAnnotations: *intel_un1290_annotations
    schematic: *intel_un1290_schematic
    patches: *intel_un1290_patches
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "58:47:ca:7a:07:b4"
        dhcp: false
        addresses:
          - "10.10.206.17/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
        # No `vip:` here on purpose -- see the note on hard-hat.

  - hostname: "milky-way"
    ipAddress: "10.10.209.10"
    installDisk: "/dev/nvme0n1"
    machineSpec:
      secureboot: false
    controlPlane: true
    userVolumes: &userVolumes
      - name: longhorn
        filesystem:
          type: xfs
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/sda"
          grow: false
          minSize: 1TB
          maxSize: 1TB
    nodeLabels:
      <<: *nodeLabels
      # Technitium DNS runs on the control planes (they carry enp3s0, which the
      # ipvlan L2 NAD now binds). Moved here from hard-hat 2026-08-19 so the LAN
      # resolver survives a low-power window with every worker powered off —
      # docs/cluster-consolidation/20-low-power-tier.md §0.3.
      technitium-dns: "true"
    nodeAnnotations: &nodeAnnotations
      # `critical` = D6's low-power survivors: Tier-1 data must live on the
      # control planes. See docs/cluster-consolidation/12-longhorn-critical-tier.md.
      node.longhorn.io/default-node-tags: '["critical"]'
      node.longhorn.io/default-disks-config: |
        {
          "disks": [
            {
              "path": "/var/mnt/longhorn",
              "allowScheduling": true,
              "tags":["ssd"]
            }
          ]
        }
    schematic: &schematic
      customization:
        extraKernelArgs:
          - i915.enable_guc=3
          - intel_iommu=on
          - iommu=pt
          - sysctl.kernel.kexec_load_disabled=1
          - apparmor=0                          # Less security, faster puter
          - init_on_alloc=0                     # Less security, faster puter
          - init_on_free=0                      # Less security, faster puter
          - mitigations=off                     # Less security, faster puter
          - security=none                       # Less security, faster puter
          - talos.auditd.disabled=1             # Less security, faster puter
        systemExtensions:
          officialExtensions:
            - siderolabs/i915
            - siderolabs/intel-ucode
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "e0:51:d8:19:93:18"
        dhcp: false
        addresses:
          - "10.10.209.10/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
        vip:
          # 10.10.206.201, not SGC's old 10.10.209.201. These three join
          # equestria, whose endpoint is https://10.10.206.201:6443 — a control
          # plane advertising a different VIP forms its own election for an
          # address nothing routes to, and additionalApiServerCertSans does not
          # cover .209.201, so anything reaching the API that way fails TLS.
          # Viable as a shared VIP because every node here is /16 inside
          # 10.10.0.0/16 behind gateway 10.10.0.1 — one broadcast domain.
          ip: "10.10.206.201"
  - hostname: "othalla"
    ipAddress: "10.10.209.11"
    installDisk: "/dev/nvme0n1"
    machineSpec:
      secureboot: false
    controlPlane: true
    userVolumes: *userVolumes
    nodeLabels:
      <<: *nodeLabels
      # Technitium DNS runs on the control planes (they carry enp3s0, which the
      # ipvlan L2 NAD now binds). Moved here from hard-hat 2026-08-19 so the LAN
      # resolver survives a low-power window with every worker powered off —
      # docs/cluster-consolidation/20-low-power-tier.md §0.3.
      technitium-dns: "true"
    nodeAnnotations: *nodeAnnotations
    schematic: *schematic
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "e0:51:d8:19:d4:98"
        dhcp: false
        addresses:
          - "10.10.209.11/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
        vip:
          # 10.10.206.201, not SGC's old 10.10.209.201. These three join
          # equestria, whose endpoint is https://10.10.206.201:6443 — a control
          # plane advertising a different VIP forms its own election for an
          # address nothing routes to, and additionalApiServerCertSans does not
          # cover .209.201, so anything reaching the API that way fails TLS.
          # Viable as a shared VIP because every node here is /16 inside
          # 10.10.0.0/16 behind gateway 10.10.0.1 — one broadcast domain.
          ip: "10.10.206.201"
  - hostname: "pegasus"
    ipAddress: "10.10.209.12"
    installDisk: "/dev/nvme0n1"
    machineSpec:
      secureboot: false
    controlPlane: true
    userVolumes: *userVolumes
    nodeLabels:
      <<: *nodeLabels
      # Technitium DNS runs on the control planes (they carry enp3s0, which the
      # ipvlan L2 NAD now binds). Moved here from hard-hat 2026-08-19 so the LAN
      # resolver survives a low-power window with every worker powered off —
      # docs/cluster-consolidation/20-low-power-tier.md §0.3.
      technitium-dns: "true"
    nodeAnnotations: *nodeAnnotations
    schematic: *schematic
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "e0:51:d8:19:d2:b2"
        dhcp: false
        addresses:
          - "10.10.209.12/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
        vip:
          # 10.10.206.201, not SGC's old 10.10.209.201. These three join
          # equestria, whose endpoint is https://10.10.206.201:6443 — a control
          # plane advertising a different VIP forms its own election for an
          # address nothing routes to, and additionalApiServerCertSans does not
          # cover .209.201, so anything reaching the API that way fails TLS.
          # Viable as a shared VIP because every node here is /16 inside
          # 10.10.0.0/16 behind gateway 10.10.0.1 — one broadcast domain.
          ip: "10.10.206.201"
# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"
  - "@./patches/global/machine-registries.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/machine-rbac.yaml"
