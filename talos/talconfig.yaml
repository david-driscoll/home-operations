# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
clusterName: "equestria"

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://10.10.206.201:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.10.206.201"
  - "apiserver.equestria.driscoll.tech"
  - "k8s-equestria.sgc.svc.cluster.local"
additionalMachineCertSans: *sans

clusterPodNets: ["10.206.0.0/16"]
clusterSvcNets: ["10.196.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "shining-armor"
    ipAddress: "10.10.206.10"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    controlPlane: false
    userVolumes:
      - name: longhorn
        filesystem:
          type: xfs
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/sdb"
          grow: false
          minSize: 1TB
          maxSize: 1TB
    nodeLabels: &nodeLabels
      node.longhorn.io/create-default-disk: 'config'
    nodeAnnotations:
      node.longhorn.io/default-disks-config: |
        {
          "disks": [
            {
              "path": "/var/mnt/longhorn",
              "allowScheduling": true,
              "tags":["nvme", "ssd"]
            }
          ]
        }
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/qemu-guest-agent
            - siderolabs/amdgpu
            # - siderolabs/tailscale
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:4c:62:fc"
        dhcp: false
        addresses:
          - "10.10.206.10/16"
        routes:
          - network: "0.0.0.0/0"
            gateway: "10.10.0.1"
        mtu: 1500
