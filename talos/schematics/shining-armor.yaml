# Image Factory schematic for shining-armor, a VM (qemu-guest-agent) with an
# AMD GPU passed through. Hashed locally by TOPF into b2443f14...; see
# control-plane.yaml for how.
customization:
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools
      # fstrim. Longhorn's filesystem-trim RecurringJob nsenters the
      # host mount namespace and runs it there; without this every
      # trim of a volume attached here fails with exit 127.
      - siderolabs/util-linux-tools
      - siderolabs/qemu-guest-agent
      - siderolabs/amdgpu
      # - siderolabs/tailscale
