# Stream Talos's own logs off the node, so a reboot no longer erases them.
#
# Talos keeps service logs (kubelet, containerd, cri, machined, ...) and the
# kernel ring buffer in memory. On 2026-10-17 two workers lost their CRI and
# had to be power-cycled, and the logs that would have said why went with the
# reboot. Both streams now go to the talos-logs receiver
# (kubernetes/apps/observability/talos-logs), a hostNetwork Alloy DaemonSet
# listening on this node's loopback -- so every node ships to the receiver on
# itself, and that receiver stamps the `node` label. Neither stream carries a
# hostname of its own (KmsgLogConfig has no extraTags), which is why it is
# loopback rather than one central address.
#
# TCP, not UDP: Talos reconnects and newline-frames over TCP, and a kernel line
# longer than one datagram is not silently cut.
#
# Until the receiver pod is up (early boot, or the receiver itself down) Talos
# cannot connect and those lines are not shipped; `talosctl logs` / `dmesg`
# still have them in memory until the next reboot.
#
# `.machine.logging` stays v1alpha1: it is not deprecated on 1.14 and has no
# multi-document replacement.
machine:
  logging:
    destinations:
      - endpoint: tcp://127.0.0.1:6051/
        format: json_lines
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: talos-logs
url: tcp://127.0.0.1:6050/
