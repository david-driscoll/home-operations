---
# SOPS config for home-operations. Uses the single estate age recipient, so
# `age.key` decrypts every file here and Flux's `sops-age` Secret needs no
# separate key material.
#
# Why this repo needs SOPS at all: the Pulumi operator authenticates to OpenBao
# with the `pulumi` AppRole, and per bootstrap/INVENTORY.md §2 the credential
# Pulumi authenticates WITH cannot live in a store that mediates access.
# Sourcing it from 1Password would make the operator depend on 1Password
# Connect in order to reach OpenBao — exactly the dependency Phase 11 exists
# to remove.
#
# encrypted_regex keeps Kubernetes Secret keys (`data`/`stringData`) encrypted
# while leaving apiVersion/kind/metadata readable, so Flux and kustomize can
# still parse the manifest before decryption.
creation_rules:
  # Bootstrap-tier material under bootstrap/ — the OpenBao seal chain, recovery
  # shares, the Pulumi AppRole and passphrase. DO NOT reshape this rule: it is
  # byte-for-byte the one those files were encrypted under, so they decrypt
  # unchanged and `sops --encrypt --filename-override bootstrap/...` keeps
  # producing the same shape. No encrypted_regex: every value is encrypted, because these
  # files are consumed by humans and `sops exec-file`, never reconciled in
  # place by Flux. `mac_only_encrypted` lets the plaintext key NAMES and
  # comments be edited without invalidating the MAC — key names are always
  # visible anyway, so never put anything sensitive in one.
  - path_regex: bootstrap/.*\.sops\.ya?ml
    mac_only_encrypted: true
    key_groups:
      - age:
        - "age1eurl2t7pepw66guv8m7lxh5fjhs4t4frsntqjp08lmypwudlsp7qdusgnf"
        - "age150z0s36kl9vud8728c5e4zqq6nmyywekk76rwvjclcsfc8mrxuuqr0qfg6"
  # The Talos secrets bundle, talos/talsecret.sops.yaml: cluster PKI, bootstrap
  # token, secretbox key. Same shape as the file's own sops metadata (every
  # value encrypted, mac_only_encrypted, both recipients), so it describes what
  # is already there rather than reshaping it.
  #
  # It exists for one reason: TOPF. Asked for a secrets bundle it cannot find,
  # TOPF offers to GENERATE one and writes it with `sops encrypt
  # --filename-override <path>` -- and when no rule matches that path it falls
  # back to writing the bundle IN PLAINTEXT, under a filename that says
  # `.sops.yaml`. With this rule an accidental write is at least encrypted. The
  # talos:* tasks also refuse to run unless the file exists and `sops filestatus`
  # reports it encrypted.
  - path_regex: talos/.*\.sops\.ya?ml
    mac_only_encrypted: true
    key_groups:
      - age:
        - "age1eurl2t7pepw66guv8m7lxh5fjhs4t4frsntqjp08lmypwudlsp7qdusgnf"
        - "age150z0s36kl9vud8728c5e4zqq6nmyywekk76rwvjclcsfc8mrxuuqr0qfg6"
  # Tooling credentials under .config/ — the AppRole .config/mise.toml
  # authenticates to OpenBao with (scripts/bao-mise-approle.sh). No
  # encrypted_regex: these are not Kubernetes manifests, nothing needs to parse
  # them before decryption, so every value is encrypted. Listed before the
  # kubernetes/ rule because sops applies the FIRST matching rule.
  - path_regex: \.config/.*\.sops\.ya?ml
    key_groups:
      - age:
        - "age1eurl2t7pepw66guv8m7lxh5fjhs4t4frsntqjp08lmypwudlsp7qdusgnf"
        - "age150z0s36kl9vud8728c5e4zqq6nmyywekk76rwvjclcsfc8mrxuuqr0qfg6"
  - path_regex: kubernetes/.*\.sops\.ya?ml
    encrypted_regex: "^(data|stringData)$"
    mac_only_encrypted: true
    key_groups:
      - age:
        - "age1eurl2t7pepw66guv8m7lxh5fjhs4t4frsntqjp08lmypwudlsp7qdusgnf"
        - "age150z0s36kl9vud8728c5e4zqq6nmyywekk76rwvjclcsfc8mrxuuqr0qfg6"
stores:
  yaml:
    indent: 2
