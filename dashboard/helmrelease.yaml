---
# NOTE: this file deliberately does NOT define its own `OCIRepository`.
#
# It used to, named `app-template` at tag 5.0.1 with no digest pin -- and that
# collided with the shared `kubernetes/components/repos/app-template`, which
# `kubernetes/apps/equestria/kustomization.yaml` already pulls into this exact
# namespace at 5.1.0 WITH a digest. Two Kustomizations, one object name, one
# namespace: `dynacat` won ownership, so all of equestria ran the stale
# un-pinned 5.0.1.
#
# The un-pinned tag is what made it expensive. Without a digest, source-
# controller re-resolved the tag every interval and re-stored the artifact --
# 116 `NewArtifact` events for an unchanged revision -- and every re-store made
# ALL 40 equestria HelmReleases run a `helm upgrade`. Each upgrade reset
# `spec.replicas` to the chart default, which the nightly downscaler then had to
# undo: 378 scale operations in one night across 38 workloads, instead of 76.
#
# Same shape as the Traefik middleware alias collision -- a locally-defined
# resource sharing a name with a shared one in the same namespace silently wins
# and nothing reports the conflict.
#
# The HelmRelease below refers to `OCIRepository/app-template` by name and
# resolves to the shared one. Do not reintroduce a local copy.

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dynacat
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 15m
  driftDetection:
    mode: enabled
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: true
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        replicas: 1
        pod:
          securityContext:
            runAsNonRoot: false

        containers:
          *app :
            image:
              repository: ghcr.io/panonim/dynacat
              tag: 2.3.1@sha256:879f07646aaf6fc5f6ded8d734711a4c8364df3a64ab48091ddd1be9b7151172
            env:
              TZ: "${TIMEZONE}"
              # Minted by the vault stack from the GitHub App and reflected into
              # every namespace by emberstack, so it rotates on its own. It is
              # deliberately NOT part of ${APP}-env: that Secret is assembled
              # from OpenBao, and putting a self-rotating token behind an
              # ExternalSecret refresh would pin it to whatever value the last
              # sync saw.
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: github-token
                    key: token
            envFrom:
              - secretRef:
                  name: ${APP}-env
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }

          extensions:
            image:
              repository: mcr.microsoft.com/dotnet/sdk
              tag: "10.0"
            command: ["dotnet", "run", "Extensions.cs"]
            workingDir: /app
            env:
              ASPNETCORE_HTTP_PORTS: "8090"
              NUGET_PACKAGES: "/tmp/nuget"
              DOTNET_ENVIRONMENT: "Production"
            envFrom:
              - secretRef:
                  name: ${APP}-env
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }

      equestria-glance:
        annotations:
          reloader.stakater.com/auto: "true"
          # Low Power keep-list: survives `downscaler/force-downtime` on the
          # equestria namespace. Per-workload exclude beats the namespace toggle
          # (scaler.py define_scope). docs/cluster-consolidation/24-power-states.md
          downscaler/exclude: "true"
        replicas: 1
        pod:
          securityContext:
            runAsNonRoot: false
        containers:
          equestria-glance:
            image:
              repository: ghcr.io/lukasdietrich/glance-k8s/glance-k8s
              tag: v0.5.2
            env:
              GLANCE_KUBE_CONFIG: /glance.kubeconfig
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    configMaps:
      ${APP}-glance-kubeconfig:
        forceRename: '${APP}-glance-kubeconfig'
        data:
          equestria.kubeconfig: |
            {
              "kind": "Config",
              "apiVersion": "v1",
              "clusters": [
                {
                  "cluster": {
                    "server": "https://equestria-kubeproxy.${TAILSCALE_DOMAIN}"
                  },
                  "name": "equestria"
                }
              ],
              "contexts": [
                {
                  "context": {
                    "cluster": "equestria",
                    "user": "equestria"
                  },
                  "name": "equestria"
                }
              ],
              "current-context": "equestria",
              "users": [
                {
                  "name": "equestria",
                  "user": {}
                }
              ]
            }


    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    persistence:
      assets:
        existingClaim: ${APP}
        advancedMounts:
          dynacat:
            dynacat:
              - path: /home/user/glance-assets
                subPath: assets
      config-files:
        type: configMap
        name: ${APP}-config
        defaultMode: 493
        globalMounts:
          - path: /app/config/
            readOnly: true
      widgets-files:
        type: configMap
        name: ${APP}-widgets
        defaultMode: 493
        globalMounts:
          - path: /app/config/widgets/
            readOnly: true
      servers-files:
        type: configMap
        name: ${APP}-servers
        defaultMode: 493
        globalMounts:
          - path: /app/config/servers/
            readOnly: true
      extensions-file:
        type: configMap
        name: ${APP}-extensions
        defaultMode: 444
        advancedMounts:
          dynacat:
            extensions:
              - path: /app/Extensions.cs
                subPath: Extensions.cs
                readOnly: true
      glance-kubeconfig:
        type: configMap
        name: ${APP}-glance-kubeconfig
        defaultMode: 444
        advancedMounts:
          equestria-glance:
            equestria-glance:
              - path: /glance.kubeconfig
                subPath: equestria.kubeconfig
                readOnly: true

    service:
      app:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: &port 8080
          extensions:
            port: 8090

      equestria-glance:
        controller: equestria-glance
        type: ClusterIP
        ports:
          http:
            port: 8080

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${ROOT_DOMAIN}"
          - "g.${ROOT_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user
