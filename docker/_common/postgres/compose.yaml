services:
  postgres:
    # Postgres 18. All three services in this file MUST stay on the same major:
    # pg_dump refuses to dump a server newer than itself ("aborting because of
    # server version mismatch"), and backup.sh treats a failed dump as a warning
    # and keeps looping — so a skew here is a permanently silent backup failure,
    # not a visible one. Verified against 18.4: pg_dump/pg_dumpall 17.10 exit 1,
    # the matching 18 client exits 0. (psql 17 -> 18 does work, so provision.sh
    # would have survived the skew; the backups would not have.)
    #
    # A major bump is NOT an image bump: PGDATA is bound to the major that
    # created it, so 18 -> 19 is a pg_upgrade or dump/restore. renovate.json5
    # disables major updates for this image; minor/patch/digest still flow.
    image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    container_name: postgres
    hostname: postgres
    env_file:
      - path: .env
        required: true
      - path: .env-local
        required: false
    environment:
      TZ: ${TIMEZONE}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # The maintenance database. Application databases are created by the
      # postgres-provision service below, never here.
      POSTGRES_DB: postgres
      # First-init only. Checksums make torn pages loud instead of silent;
      # they cannot be turned on later without a dump/restore, so the choice
      # has to be made now.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    # Runs as the image's own postgres user (uid/gid 70 on Alpine) rather than
    # starting as root and stepping down. init.sh pre-creates and chowns the
    # data directories, so the entrypoint's chown pass is unnecessary — which
    # in turn means the container needs no capabilities at all.
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # MUST be under /opt/stacks-data, never /opt/stacks. Two reasons, both
      # load-bearing:
      #
      #   * /opt/stacks/<stack> is the Dockge *definition* directory — Pulumi
      #     copies compose.yaml/.env/init.sh there, and DockgeLxc.ts:810 runs
      #     `rm -rf /opt/stacks/<stack>` when the stack is deleted. PGDATA
      #     there means removing the stack silently destroys the database.
      #   * init.sh only prepares paths under /opt/stacks-data. Point this
      #     elsewhere and Docker auto-creates the bind source as root:root
      #     0755 at `up` time; the container runs as uid 70 with cap_drop ALL,
      #     cannot mkdir $PGDATA inside it, and crash-loops on
      #     "mkdir: can't create directory '.../pgdata': Permission denied".
      #     Commit 2b99cb93 retargeted this line to /opt/stacks and that is
      #     exactly what happened on celestia and skystar — 14 restarts, no
      #     cluster ever initialised. Keep this path and init.sh in lockstep.
      #
      # It is also NOT usable as a backup source — a file copy of a running
      # cluster is torn, not crash-consistent. stacks/backups/index.ts excludes
      # this path and backs up the pg_dump output below instead.
      - /opt/stacks-data/postgres/pgdata:/var/lib/postgresql/data
    # Postgres uses POSIX shared memory for parallel query; Docker's 64m
    # default is small enough to cause "could not resize shared memory segment".
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The image sets STOPSIGNAL SIGINT (fast shutdown). The grace period is
    # headroom for the resulting checkpoint on a busy cluster.
    stop_grace_period: 1m
    restart: unless-stopped
    dns:
      - 100.100.100.100
    # Deliberately NOT autoheal-labelled. autoheal restarts unhealthy
    # containers, and a database that is slow to answer pg_isready is usually
    # in crash recovery — the one moment when restarting it repeatedly is the
    # worst available action.
    #
    # No traefik labels and no published ports. Reachable only from
    # dockge_default by name. See the exposure note in .env.
    mem_limit: 2g
    cpus: 2
    networks:
      - dockge_default

  # Idempotent provisioner. Runs to completion on every stack start and
  # reconciles roles + databases to whatever the .env declares.
  #
  # This exists because the postgres image's own /docker-entrypoint-initdb.d
  # hook runs ONCE, on first init of an empty PGDATA. Adding a second consumer
  # six months from now would never re-run it, and the failure would be silent.
  # A provisioner that runs every time makes "add a consumer" a git edit.
  #
  # Convention: any variable named PGAPP_<NAME>_PASSWORD provisions a login
  # role <name> and a database <name> owned by it. Nothing else is read, so a
  # host with no consumers provisions nothing and this container exits 0.
  postgres-provision:
    # Same major + digest as the server above. See the note there.
    image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    container_name: postgres-provision
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
      - path: .env-local
        required: false
    environment:
      TZ: ${TIMEZONE}
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./provision.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    # One-shot. `no` rather than `on-failure` so a persistently broken
    # declaration is visible in `docker compose ps` instead of looping.
    restart: "no"
    dns:
      - 100.100.100.100
    networks:
      - dockge_default

  # Periodic logical dumps — the actual backup source for this database.
  #
  # The celestia dockge backrest plan (stacks/backups/index.ts) rclone-pulls
  # /opt/stacks-data/ from each host and restic-snapshots it. That is a file
  # copy of a live cluster, which for Postgres is not a restorable artifact.
  # pg_dump produces one that is: each dump is a consistent snapshot taken
  # inside a single transaction.
  postgres-backup:
    # Same major + digest as the server above — this is the one that MUST match.
    # pg_dump aborts against a newer server and backup.sh only warns, so a skew
    # here fails every dump forever without ever failing the container.
    image: postgres:18-alpine@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44
    container_name: postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
      - path: .env-local
        required: false
    environment:
      TZ: ${TIMEZONE}
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backup.sh:/backup.sh:ro
      - /opt/stacks-data/postgres/dumps:/dumps
    entrypoint: ["/bin/sh", "/backup.sh"]
    # A stalled or failing dump loop is otherwise indistinguishable from a
    # healthy one: the container stays up either way, and restic goes on
    # snapshotting whatever is already in /dumps. backup.sh writes
    # "<epoch> ok|failed" to /dumps/.last-run at the end of every cycle; this
    # turns that into container health, so `docker ps` and Arcane show it
    # without anyone reading logs. The paging signal is the Gatus heartbeat
    # (POSTGRES_DUMP_UPTIME_TOKEN in .env), not this.
    #
    # Deliberately NOT autoheal-labelled, like the server above: restarting the
    # loop cannot fix an unreachable database or a full disk, and a restart
    # resets the very state this reads.
    #
    # `$$` is compose's escape for a literal `$`. The image has no bash, and
    # every construct here is POSIX sh -- verified against the pinned digest.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          set -- $$(cat /dumps/.last-run 2>/dev/null);
          [ "$${2:-}" = ok ] || exit 1;
          [ $$(( $$(date +%s) - $${1:-0} )) -lt $$(( $${POSTGRES_DUMP_INTERVAL_SECONDS:-86400} + 10800 )) ]
      interval: 5m
      timeout: 10s
      retries: 2
      # A cold start dumps every database on the node before it can write the
      # first result, so nothing is judged until that has had room to finish.
      start_period: 30m
    restart: unless-stopped
    dns:
      - 100.100.100.100
    networks:
      - dockge_default

networks:
  dockge_default:
    external: true
