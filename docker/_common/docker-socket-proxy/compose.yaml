services:
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    privileged: true
    environment:
      - CONFIGS=1
      - CONTAINERS=1
      - DISTRIBUTION=1
      - SERVICES=1
      - SYSTEM=1
      - INFO=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - EXEC=1
      - BUILD=1
      - POST=1
      - DELETE=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - ALLOW_PAUSE=1
      - ALLOW_UNPAUSE=1
      - GRPC=1
      - NODES=1
      - LOG_LEVEL=warning
    ports:
      - 2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./haproxy:/var/lib/haproxy/
    labels:
      traefik.enable: false
    networks:
      - dockge_default

networks:
  dockge_default:
    external: true
