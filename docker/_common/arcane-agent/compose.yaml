services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:latest@sha256:231f9f97d2939c0102978cca1f21b1a8941ebd5cff3aecd753e14958c8ae1a56
    container_name: arcane-agent
    environment:
      # Direct mode: the manager connects inbound to :3553 via the Traefik
      # router below. The port is deliberately not published on the host —
      # Traefik reaches it over dockge_default and terminates TLS.
      - AGENT_MODE=true
      - EDGE_TRANSPORT=auto
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    env_file:
      - .env
      - token.env
    volumes:
      - agent-data:/app/data
    cgroup: host
    restart: unless-stopped
    dns:
      - 100.100.100.100
    networks:
      - dockge_default
    labels:
      # Enable Traefik
      traefik.enable: true

      # Arcane Agent - HTTPS
      traefik.http.routers.${APP}.rule: Host(`${APP}.${CLUSTER_DOMAIN}`)
      traefik.http.routers.${APP}.entrypoints: websecure
      traefik.http.routers.${APP}.tls.certresolver: le
      traefik.http.routers.${APP}.service: ${APP}

      # Tailscale internal routing
      traefik.http.routers.${APP}-tailscale.rule: Host(`${APP}-${host}.${tailscaleDomain}`)
      traefik.http.routers.${APP}-tailscale.entrypoints: tailscale
      traefik.http.routers.${APP}-tailscale.service: ${APP}

      traefik.http.services.${APP}.loadbalancer.server.port: 3553
    healthcheck:
      test: [ 'CMD', '/app/arcane-agent', 'health' ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-data: {}

networks:
  dockge_default:
    external: true
