services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:latest@sha256:deb74013ac72cbdecd46abc0b34248f6f3425b5ebd04d36e260f04518808e605
    container_name: arcane-agent
    environment:
      # Direct mode: the manager connects inbound to :3553 via the Traefik
      # router below. The port is deliberately not published on the host —
      # Traefik reaches it over dockge_default and terminates TLS.
      - AGENT_MODE=true
      - EDGE_TRANSPORT=auto
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    env_file:
      - .env
      - token.env
    volumes:
      - agent-data:/app/data
    cgroup: host
    restart: unless-stopped
    dns:
      - 100.100.100.100
    networks:
      - dockge_default
    labels:
      # Enable Traefik
      traefik.enable: true

      # Arcane Agent - HTTPS
      traefik.http.routers.arcane-agent.rule: Host(`${APP}.${CLUSTER_DOMAIN}`)
      traefik.http.routers.arcane-agent.entrypoints: websecure
      traefik.http.routers.arcane-agent.tls.certresolver: le
      traefik.http.routers.arcane-agent.service: ${APP}

      # Tailscale internal routing
      traefik.http.routers.arcane-agent-tailscale.rule: Host(`${APP}-${host}.${tailscaleDomain}`)
      traefik.http.routers.arcane-agent-tailscale.entrypoints: tailscale
      traefik.http.routers.arcane-agent-tailscale.service: arcane-agent

      traefik.http.services.arcane-agent.loadbalancer.server.port: 3553
    healthcheck:
      test: [ 'CMD', '/app/arcane-agent', 'health' ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-data: {}

networks:
  dockge_default:
    external: true
