services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:latest@sha256:6f18b6dc08b529a2df818b1f94df79cb23e5c06bb1b0625e5df065599009c80f
    container_name: arcane-agent
    environment:
      # Edge mode: the agent dials OUT to the manager at MANAGER_API_URL
      # (.env) and the manager drives it over that tunnel. The manager runs in
      # the equestria cluster (kubernetes/apps/equestria/utils/arcane), whose
      # pods have no route to the tailnet names the old direct mode dialled
      # (arcane-agent-<host>.<tailnet>), while every Dockge host can reach the
      # cluster's internal gateway.
      #
      # websocket, not `auto`: through Traefik the gRPC tunnel is accepted at
      # TLS and then never answered, so `auto` spends 10s on it before falling
      # back to websocket on every (re)connect.
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=websocket
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    env_file:
      - .env
      - token.env
    volumes:
      - agent-data:/app/data
    cgroup: host
    restart: unless-stopped
    dns:
      - 100.100.100.100
    networks:
      - dockge_default
    labels:
      # Nothing dials these routers since the move to edge mode. Edge agents
      # still serve :3553 (the healthcheck below uses it), so they are inert
      # rather than broken. They stay for now because dropping them deletes
      # the arcane-agent.* StandardDns records -- see the warning in
      # components/StandardDns.ts before doing it.
      # Enable Traefik
      traefik.enable: true

      # Arcane Agent - HTTPS
      traefik.http.routers.${APP}.rule: Host(`${APP}.${CLUSTER_DOMAIN}`)
      traefik.http.routers.${APP}.entrypoints: websecure
      traefik.http.routers.${APP}.tls.certresolver: le
      traefik.http.routers.${APP}.service: ${APP}

      # Tailscale internal routing
      traefik.http.routers.${APP}-tailscale.rule: Host(`${APP}-${host}.${tailscaleDomain}`)
      traefik.http.routers.${APP}-tailscale.entrypoints: tailscale
      traefik.http.routers.${APP}-tailscale.service: ${APP}

      traefik.http.services.${APP}.loadbalancer.server.port: 3553
    healthcheck:
      test: [ 'CMD', '/app/arcane-agent', 'health' ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-data: {}

networks:
  dockge_default:
    external: true
