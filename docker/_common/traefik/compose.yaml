services:
  traefik:
    container_name: traefik
    image: ghcr.io/traefik/traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    restart: unless-stopped
    dns:
      - 100.100.100.100
    command:
      - --configfile=/config/config.yaml
    labels:
      autoheal: true
      # Enable Traefik for itself
      traefik.enable: true
      # Dashboard configuration
      traefik.http.routers.dashboard.rule: Host(`internal.${CLUSTER_DOMAIN}`)
      # BREAK-GLASS: network-gated, NOT authentik-gated. This dashboard is on
      # EVERY Dockge host (_common), including the one that will host authentik
      # itself -- gating it behind authentik makes it unreachable exactly when it
      # is needed. See docs/cluster-consolidation/07-authentik-to-alpha-site.md
      # section 3.3. The authentik-outpost middleware below stays defined: other
      # stacks on this host still reference it.
      traefik.http.routers.dashboard.middlewares: internal-network@file
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.tls.certresolver: le

      traefik.http.routers.dashboard-tailscale.rule: Host(`internal-${host}.${tailscaleDomain}`)
      traefik.http.routers.dashboard-tailscale.entrypoints: tailscale
      traefik.http.routers.dashboard-tailscale.service: api@internal

      # The middleware.
      #
      # ${AUTHENTIK_FORWARDAUTH_HOST} defaults to `authentik_proxy` — the service in
      # docker/_common/authentik-outpost, i.e. the sidecar every host runs. A host
      # that runs authentik ITSELF has no sidecar and points this at the authentik
      # server container instead, because the embedded outpost serves this same
      # /outpost.goauthentik.io path. Set per host via DockgeLxc's
      # authentikForwardAuthHost arg, which defaults rather than requiring every host
      # to remember it. See docs/cluster-consolidation/07-authentik-to-alpha-site.md
      # section 2.5.
      traefik.http.middlewares.authentik-outpost.forwardauth.address: http://${AUTHENTIK_FORWARDAUTH_HOST}:9000/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.authentik-outpost.forwardauth.trustForwardHeader: true
      traefik.http.middlewares.authentik-outpost.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version

    env_file:
      - path: .env
    ports:
      - 80:80
      - 443:443
      - 5443:5443
      - 8443:8443
      - 2022:2022/tcp
      - 7687:7687
      - 8082:8082/tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt
      - ./config.yaml:/config/config.yaml
      - /opt/stacks-data/${APP}/dynamic:/config/dynamic
      - ./dynamic/middlewares.yaml:/config/dynamic/middlewares.yaml
    networks:
      - dockge_default
  cert-extractor:
    image: ghcr.io/datacore/traefik-certextractor:1.0.0@sha256:415495c0633c08cec5ad74bd5fd1e7b1078a0748c930f33ce6c065770e703ec1
    restart: unless-stopped
    environment:
      AcmeFileServiceOptions__FilePath: "/var/cert/in/acme.json"
      CertExtractorServiceOptions__DirectoryPath: "/var/cert/out/"
    volumes:
      - ./letsencrypt:/var/cert/in/:ro
      - ./certs/:/var/cert/out/
  error-pages:
    container_name: error-pages
    image: ghcr.io/tarampampam/error-pages:4.2@sha256:f23f8042a2804669315fd232281d0ccecf1959332314a46e02ca2482064064a6
    environment:
      # TEMPLATE_NAME: "ghost"
      # disabled/random-on-startup/random-on-each-request/random-hourly/random-daily
      TEMPLATES_ROTATION_MODE: random-hourly
      SEND_SAME_HTTP_CODE: true
      SHOW_DETAILS: true
    networks:
      - dockge_default
x-dockge:
  urls:
    - https://internal.${CLUSTER_DOMAIN}
    - https://internal-${host}.${tailscaleDomain}
networks:
  dockge_default:
    external: true
