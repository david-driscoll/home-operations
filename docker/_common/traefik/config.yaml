# yaml-language-server: $schema=https://json.schemastore.org/traefik-v3.json

# Traefik static configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard configuration
api:
  dashboard: true
  insecure: false

log:
  level: INFO
  format: common
accessLog:
  format: common
  # Filter on status codes, retry attempts and minimal duration
  filters:
    statusCodes:
      - "200"
      - "300-302"
    retryAttempts: true
    minDuration: "10ms"

# Entry points configuration
entryPoints:
  # `web` and `websecure` deliberately have NO `forwardedHeaders`. Unlike the
  # cluster -- where all external traffic arrives through in-cluster cloudflared
  # pods and the header is the only way to see a real client -- nothing in front of
  # these two sets X-Forwarded-For on a Dockge host. Trusting it would therefore
  # buy nothing and cost something: the userland proxy makes every connection look
  # like the bridge gateway, so a trust rule here would let ANY client assert its
  # own address. See the `tailscale` entrypoint below, which is loopback-bound and
  # therefore can trust it.
  web:
    address: ":80"
    http:
      middlewares:
        - compress@file
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
      middlewares:
        - compress@file
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  # The tailnet entrypoint. `tailscale serve --https=443 127.0.0.1:8443` terminates
  # the tailnet cert and reverse-proxies cleartext here; Traefik routes on the Host
  # header, which tailscaled preserves (`r.Out.Host = r.In.Host`, ipn/ipnlocal/serve.go).
  #
  # compose.yaml binds this to 127.0.0.1 ONLY, and that is what makes the
  # `forwardedHeaders` trust below sound rather than a blanket "believe anyone".
  # This host runs docker with EnableUserlandProxy: true, so every published-port
  # connection is SNAT'd to the bridge gateway and Traefik logs 172.18.0.1 for
  # LAN, tailnet and host-local traffic alike -- it cannot tell them apart by
  # source address. Loopback-binding restores the distinction the userland proxy
  # erases: after it, the only thing that can open a connection here is a
  # host-local process, i.e. tailscaled.
  tailscale:
    address: ":8443"
    # tailscaled sets X-Forwarded-For to the CLIENT's tailnet address, and Traefik
    # discards an inbound X-Forwarded-* header unless it arrives from a trusted
    # source -- so without this every tailnet request reaches the authentik outpost
    # and the apps as 172.18.0.1, and the real user is unrecoverable.
    #
    # Note the NESTING: `forwardedHeaders` is a direct child of the entryPoint,
    # a sibling of `address`/`http`/`transport`. Putting it under `http:` renders
    # nothing -- that mistake is exactly what left the Kubernetes Traefik's
    # equivalent block dead (see kubernetes/apps/network/traefik/values.yaml).
    #
    # The range is the docker bridge, wide because the subnet is assigned per host
    # (172.18.0.0/16 on celestia, but Docker picks from a pool). Safe only in
    # combination with the loopback bind above.
    forwardedHeaders:
      trustedIPs:
        - 172.16.0.0/12
    http:
      middlewares:
        - compress@file
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  sftp:
    address: ":2022"
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  metrics:
    address: ":8082"
  bolt:
    address: ":7687"
    transport:
      respondingTimeouts:
        readTimeout: "0s"

serversTransport:
  insecureSkipVerify: true

# Metrics configuration
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.0
      - 3.0
      - 5.0
    entryPoint: metrics

# Plugin configuration
#
# ADDED 2026-09-05 alongside ../sablier. The plugin is the proxy half of
# on-demand scale-to-zero: it asks Sablier whether the container behind a router
# is running, starts it if not, and serves a self-refreshing waiting page until
# it is ready. The middlewares that use it are in ./dynamic/middlewares.yaml;
# the opted-in stacks carry `sablier.enable=true` labels.
#
# Traefik downloads plugins from GitHub at startup and compiles them with Yaegi.
# `abortOnPluginFailure` is not set, and its default is false, so a version that
# cannot be fetched or built does NOT stop Traefik -- the `sablier` middleware
# simply never registers and every router referencing it is dropped, which
# presents as a 404 on the opted-in stacks only. Rollback is deleting this block
# and the middleware references.
#
# The per-stack middlewares are defined as LABELS on each opted-in container,
# not here and not in ./dynamic/middlewares.yaml, so a stack stays readable as
# one file. That works because Traefik lists containers with `All: true` and,
# when a container carries `traefik.docker.allownonrunning`, `keepContainer`
# returns before the non-running filter and the full dynamic config -- routers
# AND middlewares -- is still decoded from its labels
# (pkg/provider/docker/{pdocker,config}.go, v3.7). Support for that arrived in
# Traefik v3.6; this host runs v3.7.13.
#
# ./dynamic/middlewares.yaml keeps only the genuinely shared middlewares
# (compress, internal-network, errors), which is what it was always for.
#
# Keep this in step with kubernetes/apps/network/traefik/values.yaml, which
# registers the same plugin at the same version for the cluster.
experimental:
  plugins:
    sablier:
      moduleName: "github.com/sablierapp/sablier-traefik-plugin"
      # renovate: datasource=github-releases depName=sablierapp/sablier-traefik-plugin
      version: "v1.3.0"

# Providers configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /config/dynamic/
    watch: true

# Certificate resolvers configuration
certificatesResolvers:
  le:
    acme:
      email: "david.driscoll+${host}@gmail.com"
      storage: "/letsencrypt/acme.json"
      dnsChallenge:
        provider: cloudflare
        # Resolve challenges against public DNS, never the container resolver.
        # MagicDNS routes *.driscoll.tech to the Technitium cluster, which is
        # authoritative for dns.driscoll.tech — lego would then pick that as the
        # ACME zone and ask Cloudflare for a zone that does not exist there.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

  cloudflare:
    acme:
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      email: "david.driscoll+${host}@gmail.com"
      storage: "/letsencrypt/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
