---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: traefik
spec:
  name: Traefik Dashboard
  category: ${CLUSTER_TITLE}
  description: Access to the Traefik dashboard
  url: &url https://internal.${CLUSTER_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/traefik.svg
  access_policy:
    groups:
      - admins
  # No `authentik:` block by design -- see compose.yaml's dashboard router. The
  # other _common stacks (backrest, prometheus) still declare proxy
  # providers, so each host keeps a non-empty proxyProviders list and its
  # Outpost resource survives (components/DockgeLxc.ts:748).
  gatus:
    - url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
    # Short names (docs/plans/short-names.md C6): a dotless Host on :80 must
    # be redirected (301) to its app route by dynamic/short-names.yaml. The
    # check follows it to https://uptime.<root domain> and expects a 200.
    - name: short-name redirect
      url: http://internal.${CLUSTER_DOMAIN}/
      method: GET
      headers:
        Host: uptime
      conditions:
        - "[STATUS] == 200"
