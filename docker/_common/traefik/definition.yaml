---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/stargate-command-cluster/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: traefik
spec:
  name: Traefik Dashboard
  category: ${CLUSTER_TITLE}
  description: Access to the Traefik dashboard
  url: &url https://internal.${CLUSTER_DOMAIN}
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/traefik.svg
  access_policy:
    groups:
      - admins
  # No `authentik:` block by design -- see compose.yaml's dashboard router. The
  # other _common stacks (backrest, neo4j, prometheus) still declare proxy
  # providers, so each host keeps a non-empty proxyProviders list and its
  # Outpost resource survives (components/DockgeLxc.ts:748).
  gatus:
    - url: *url
      method: GET
      conditions:
        - "[STATUS] == 200"
    - url: "tcp://internal.${CLUSTER_DOMAIN}:7687"
      interval: 30s
      conditions:
        - "[CONNECTED] == true"
