http:
  middlewares:
    compress:
      compress:
        minResponseBodyBytes: 1024
    # The Dockge-side equivalent of the cluster's network/internal-network
    # Middleware. Same intent, same ranges minus the two Kubernetes-only ones
    # (CLUSTER_NETWORK/SERVICE_NETWORK), which have no meaning on a Docker host.
    # This exists so the dashboard has a network-only gate to use instead of the
    # authentik forwardAuth one -- see compose.yaml's dashboard router.
    internal-network:
      ipAllowList:
        sourceRange:
          - 10.0.0.0/8
          - 192.168.0.0/16
          - 100.64.0.0/10
          - 172.16.0.0/12
    errors:
      errors:
        status:
          - "401-599"
        query: /{status}.html
        service: error-pages@file

    # ---- Sablier: on-demand scale-to-zero -----------------------------------
    #
    # One middleware per opted-in stack, because `group` has to identify the
    # container. Attached from the stack's own router label:
    #
    #   traefik.http.routers.<stack>.middlewares: sablier-<stack>@file
    #
    # and the container itself carries `sablier.enable=true` and
    # `sablier.group=<stack>` so Sablier knows what to start and stop. Both
    # halves are required -- a router with the middleware but no labels asks
    # Sablier to start a group it has never heard of.
    #
    # The plugin key `sablier` must match ../config.yaml's `experimental.plugins`
    # entry; a mismatch is not an error, the middleware just never registers and
    # the router is dropped.
    #
    # `failOpen: false` -- if Sablier is unreachable these routes return HTTP 500
    # rather than passing through to a container that is almost certainly
    # stopped, which would surface as a connection reset the user cannot tell
    # from the app being broken.
    #
    # BLOCKING is not used and DYNAMIC is not really a choice: the plugin's
    # blocking strategy is unsupported on Kubernetes and the poke strategy has no
    # field in plugin v1.3.0. Keeping both deployments on `dynamic` means one
    # behaviour to reason about.
    #
    # `refreshFrequency` is 20s, NOT the 5s default. The waiting page reloads
    # itself, Traefik's accessLog feeds CrowdSec on the cluster side, and ~12
    # requests to one URL per minute is the shape of
    # `crowdsecurity/http-crawl-non_statics`. Kept identical on both sides so the
    # two cannot drift.
    sablier-librespeed:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: librespeed
          sessionDuration: 30m
          failOpen: false
          dynamic:
            displayName: LibreSpeed
            theme: ghost
            refreshFrequency: 20s
    sablier-openspeedtest:
      plugin:
        sablier:
          sablierUrl: http://sablier:10000
          group: openspeedtest
          sessionDuration: 30m
          failOpen: false
          dynamic:
            displayName: OpenSpeedTest
            theme: ghost
            refreshFrequency: 20s

  services:
    error-pages:
      loadBalancer:
        servers:
          - url: "http://error-pages:8080"
