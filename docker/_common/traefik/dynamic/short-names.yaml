# SHORT NAMES: `http://uptime/` -> `https://uptime.<root domain>/`.
#
# The Dockge twin of kubernetes/apps/network/traefik/short-names.yaml; read that
# header for the why (GLOSSARY.md "Short name", ADR 0003,
# docs/plans/short-names.md). A client completes a short name with the root
# domain search domain and reaches this host's Traefik with `Host: uptime`. A
# dotless host on :80 is sent to its full name, where the app's own router on
# `websecure` takes it.
#
# 302 on purpose, never 301: a cached permanent redirect outlives a rename.
#
# `web` has no entrypoint-wide redirect here (config.yaml), so this only has to
# outrank the app routers; it uses the highest user priority anyway, the same
# as the cluster's. DockgeLxc substitutes only the variables it names, so the
# capture groups `${1}` and `${3}` reach Traefik as written.
http:
  routers:
    short-names:
      entryPoints:
        - web
      rule: HostRegexp(`^[a-zA-Z0-9-]+$`) && !Host(`localhost`)
      priority: 2147482647
      middlewares:
        - short-name-redirect
      service: noop@internal

    # THE TAILNET'S PORT 80 (docs/plans/short-names.md E5). Each Dockge
    # Tailscale Service also serves :80 (components/DockgeLxc.ts), and
    # tailscaled forwards it, Host kept, to the loopback `tailscale` entrypoint,
    # the same as :443. tailscaled sets `X-Forwarded-Proto: https` only over
    # TLS, and that entrypoint trusts it (config.yaml), so a request without it
    # came in on :80. Every such request is redirected and none is served: a
    # short name to its app route, anything else to https on the same host.
    # The twin of the cluster's short-names-tailscale IngressRoute.
    short-names-tailscale:
      entryPoints:
        - tailscale
      rule: HostRegexp(`^[a-zA-Z0-9-]+$`) && !Host(`localhost`) && !Header(`X-Forwarded-Proto`, `https`)
      priority: 2147482647
      middlewares:
        - short-name-redirect
      service: noop@internal
    tailscale-plain-http:
      entryPoints:
        - tailscale
      rule: "!Header(`X-Forwarded-Proto`, `https`)"
      priority: 2147482646
      middlewares:
        - tailscale-https-redirect
      service: noop@internal

  middlewares:
    tailscale-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
    short-name-redirect:
      redirectRegex:
        regex: "^(?i)https?://([a-z0-9-]+)(:[0-9]+)?(/.*)?$"
        replacement: "https://${1}.${ROOT_DOMAIN}${3}"
        permanent: false
