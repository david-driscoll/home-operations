services:
  # Read-only SFTP view of this host's restic repos (/data/backup/), which the
  # other hosts' copy services pull (BackupPlanDirector's copy jobs).
  #
  # It does not serve /opt/stacks-data. Every Docker host backs its own stacks
  # up in place (docs/plans/host-owned-backups.md), so nothing pulls stack data,
  # and a server with no reason to read it should not be able to. The per-host
  # copies of this file that kept the export for pulled hosts are gone with the
  # pull.
  #
  # Runs as uid 0 with CAP_DAC_READ_SEARCH and nothing else. That combination
  # is deliberate and load-bearing. Two uids write the repos here -- 65534
  # (the copy service, and backrest before phase 1) and 0 (backrest since) --
  # and restic keeps its files and directories owner-only, so no single uid
  # can read them all without the capability. An EPERM here does not reach the
  # client as an error: the serve side answers the directory request with an
  # EMPTY LISTING, so the client copies nothing and exits 0. When this server
  # exported stack data as uid 65534, that is how forgejo's git repositories
  # (data/git, 0700 uid 1000), all 1.2 GB of hermes, pdm's acme/auth/access
  # and technitium/tailscale went missing from every snapshot while the
  # backup went on reporting success.
  #
  # CAP_DAC_READ_SEARCH is exactly "bypass file read and directory search
  # permission checks" and nothing more. cap_drop ALL removes the rest,
  # including DAC_OVERRIDE (write-permission bypass), and every mount below
  # is :ro, so this container can read what it serves and cannot alter it.
  # Do NOT relax this to plain root — the dropped caps are the reason
  # running as uid 0 is acceptable here.
  #
  # A non-root user cannot hold the capability: docker's cap_add populates the
  # permitted set, but caps are cleared on the setuid to a non-root user
  # unless they are ambient, and compose cannot set ambient caps. uid 0 with
  # a minimal cap set is the workable form.
  rclone-sftp:
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    container_name: rclone-sftp
    image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    restart: unless-stopped
    dns:
      - 100.100.100.100
    env_file:
      - path: .env
    command: >-
      serve sftp /data/ --addr :2022
      --authorized-keys /config/ssh/authorized_keys
      --key /config/ssh/host_key
    volumes:
      - /data/backup/:/data/backup/:ro
      - /opt/stacks-data/${APP}/keys:/config/ssh:ro
    tmpfs:
      - /.cache:uid=0,gid=0
    networks:
      - dockge_default
    labels:
      traefik.enable: true
      traefik.tcp.routers.rclone-sftp.rule: HostSNI(`*`)
      traefik.tcp.routers.rclone-sftp.entrypoints: sftp
      traefik.tcp.services.rclone-sftp.loadbalancer.server.port: 2022

networks:
  dockge_default:
    external: true
