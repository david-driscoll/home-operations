services:
  traefik:
    container_name: openspeedtest
    image: openspeedtest/latest:v2.0.6@sha256:a6a7e3b3e9e93cfe7b9b2eb49c60b2a93644149a0a600845d4df57148b193ff6
    restart: unless-stopped
    dns:
      - 100.100.100.100
    labels:
      # ON-DEMAND SET. This container is stopped after 30 minutes of no traffic
      # and started again by the next request, instead of running 24/7 on four
      # hosts. A speed-test page is idle essentially all of the time, which makes
      # it the safest possible pilot: no volume, no state, nothing else on the
      # host calls it, and a cold start is a couple of seconds.
      #
      # BOTH labels are required. `sablier.enable` is what Sablier discovers on
      # (its Docker provider filters on this label), and `sablier.group` is what
      # the `sablier-openspeedtest@file` middleware in ../traefik/dynamic/middlewares.yaml
      # asks to be started. A container with the labels but no middleware is
      # stopped and never woken; a router with the middleware but no labels asks
      # for a group that does not exist.
      sablier.enable: true
      sablier.group: openspeedtest
      # Enable Traefik for itself
      traefik.enable: true
      # WITHOUT THIS THE WHOLE THING IS INERT. Traefik's docker provider ignores
      # a stopped container by default, so the router below would vanish the
      # moment Sablier stopped it -- 404, with no middleware left to wake
      # anything. Traefik v3.6 added support for reading configuration from
      # non-running containers (PR #10645); this host runs v3.7.13.
      traefik.docker.allownonrunning: true
      # Dashboard configuration
      traefik.http.routers.openspeedtest.rule: Host(`openspeedtest.${CLUSTER_DOMAIN}`)
      traefik.http.routers.openspeedtest.entrypoints: websecure
      traefik.http.routers.openspeedtest.service: openspeedtest
      traefik.http.routers.openspeedtest.tls.certresolver: le
      # The Sablier middleware, and it is the only one on this router. There is
      # no auth or network gate here today, so anything that can reach the host
      # can wake this container -- which matches its existing exposure rather
      # than adding to it.
      traefik.http.routers.openspeedtest.middlewares: sablier-openspeedtest@file

      traefik.http.services.openspeedtest.loadbalancer.server.port: 3000
    networks:
      - dockge_default
x-dockge:
  urls:
    - https://openspeedtest.${CLUSTER_DOMAIN}
networks:
  dockge_default:
    external: true
