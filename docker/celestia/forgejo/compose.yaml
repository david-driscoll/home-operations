services:
  # Forgejo — self-hosted git forge (git.driscoll.tech).
  #
  # This host is deliberately OUTSIDE the GitOps loop it will eventually serve:
  # it deploys via stacks/home (Pulumi from the workstation), never via Flux, so
  # a Forgejo outage can always be repaired with a local clone + `pulumi up`.
  # Keep it that way — do not move this stack behind anything that pulls from it.
  #
  # Rootless image variant: runs as uid/gid 1000 from the start, so no
  # capabilities are needed at all and DockgeLxc's `user:`-driven chown pass
  # keeps /opt/stacks-data/forgejo owned by the runtime user.
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2-rootless@sha256:23ccc146e6dc2cd1f5c5435909baae64db873201717f1726490dae649283e6cd
    container_name: forgejo
    hostname: forgejo
    env_file:
      - .env
    environment:
      TZ: ${TIMEZONE}

      # --- server ------------------------------------------------------------
      FORGEJO__server__ROOT_URL: "https://git.${searchDomain}/"
      FORGEJO__server__DOMAIN: "git.${searchDomain}"
      FORGEJO__server__HTTP_PORT: "3000"
      # Built-in Go SSH server (the rootless image has no sshd). 2222 both
      # inside and out so the UI's clone URLs and reality agree:
      #   ssh://git@git.driscoll.tech:2222/<owner>/<repo>.git
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_DOMAIN: "git.${searchDomain}"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      # LFS on local disk for now. If LFS content ever gets big, move it to
      # Minio via [lfs] STORAGE_TYPE=minio — supported natively, no migration
      # of git data required.
      FORGEJO__server__LFS_START_SERVER: "true"

      # --- database — shared per-node postgres (docker/_common/postgres) -----
      # The role + database are provisioned by PGAPP_FORGEJO_PASSWORD in
      # docker/celestia/postgres/.env-local. Cross-stack, so no depends_on is
      # possible: on a cold host boot this container may crash-loop for a few
      # cycles until postgres is up, and `restart: unless-stopped` converges it.
      FORGEJO__database__DB_TYPE: "postgres"
      FORGEJO__database__HOST: "postgres:5432"
      FORGEJO__database__NAME: "forgejo"
      FORGEJO__database__USER: "forgejo"
      # FORGEJO__database__PASSWD comes from .env (secret).

      # --- security ----------------------------------------------------------
      # No web installer; this stack is configured entirely from here.
      FORGEJO__security__INSTALL_LOCK: "true"
      # FORGEJO__security__SECRET_KEY comes from .env (secret).

      # --- registration: SSO-only --------------------------------------------
      # This exact pair is the documented combo for "accounts come only from
      # the IDP": registration stays technically enabled but only the external
      # (OAuth2) path may exercise it. DISABLE_REGISTRATION=true would block
      # OIDC auto-registration too.
      FORGEJO__service__DISABLE_REGISTRATION: "false"
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      # Private instance: nothing is browsable anonymously. Flux and runners
      # authenticate with tokens, so this costs nothing operationally.
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"

      # --- oauth2 client (login VIA authentik) -------------------------------
      # The authentik auth source itself is DB-backed and registered by the
      # forgejo-provision one-shot below, not by env.
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      FORGEJO__oauth2_client__ACCOUNT_LINKING: "auto"

      # --- actions -----------------------------------------------------------
      # Enabled from day one; inert until a runner registers. Runners land on
      # equestria as a separate piece of work.
      FORGEJO__actions__ENABLED: "true"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # SSH clone/push only. HTTP stays unpublished — Traefik reaches :3000
      # over dockge_default.
      - "2222:2222"
    volumes:
      - /opt/stacks-data/forgejo/data:/var/lib/gitea
      - /opt/stacks-data/forgejo/config:/etc/gitea
    healthcheck:
      # /api/healthz is Forgejo's unauthenticated liveness endpoint; it answers
      # even with REQUIRE_SIGNIN_VIEW=true. busybox wget — the image has no curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot runs DB migrations; generous on purpose.
      start_period: 120s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    dns:
      - 100.100.100.100
    networks:
      - dockge_default
    labels:
      traefik.enable: true

      traefik.http.routers.forgejo.rule: Host(`git.${searchDomain}`)
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.routers.forgejo.tls.certresolver: le
      traefik.http.routers.forgejo.service: forgejo

      traefik.http.routers.forgejo-tailscale.rule: Host(`git.${tailscaleDomain}`)
      traefik.http.routers.forgejo-tailscale.entrypoints: tailscale
      traefik.http.routers.forgejo-tailscale.service: forgejo

      traefik.http.services.forgejo.loadbalancer.server.port: 3000

  # Idempotent one-shot, same shape as postgres-provision: runs to completion
  # on every stack start and reconciles the two pieces of Forgejo state that
  # live in its database rather than in app.ini — the local break-glass admin
  # account and the authentik OAuth2 auth source. The forgejo CLI talks to the
  # database directly via the shared /etc/gitea/app.ini, which the main
  # container's entrypoint has already materialized from env by the time the
  # healthcheck passes.
  forgejo-provision:
    image: codeberg.org/forgejo/forgejo:16.0.2-rootless@sha256:23ccc146e6dc2cd1f5c5435909baae64db873201717f1726490dae649283e6cd
    container_name: forgejo-provision
    depends_on:
      forgejo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TIMEZONE}
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/stacks-data/forgejo/data:/var/lib/gitea
      - /opt/stacks-data/forgejo/config:/etc/gitea
      - ./provision.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    # One-shot. `no` rather than `on-failure` so a persistently broken
    # declaration is visible in `docker compose ps` instead of looping.
    restart: "no"
    dns:
      - 100.100.100.100
    networks:
      - dockge_default

networks:
  dockge_default:
    external: true

x-dockge:
  urls:
    - https://git.${searchDomain}
