---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/stargate-command-cluster/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: llama-agent
spec:
  name: llama.cpp Agent Server (gemma-4-E4B)
  category: AI
  url: &url https://llama-agent.${searchDomain}
  icon: https://avatars.githubusercontent.com/u/134263123
  gatus:
    # Probed through Traefik rather than ${ipAddress}:8081 so the check covers
    # the route Hermes' operators actually click. The container port stays
    # published, so a failure here means "hostname is broken", not "llama.cpp
    # is down" — /health only returns 200 once the model is fully loaded.
    - url: https://llama-agent.${searchDomain}/health
      method: GET
      group: "Applications"
      conditions:
        - "[STATUS] == 200"
