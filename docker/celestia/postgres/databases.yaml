# Host-level postgres declarations for this node — the home for databases
# whose owning stack no longer exists, since an x-postgres block needs a stack
# to live in. Parsed by Pulumi (components/dockerStackPostgres.ts) into the
# postgres stack's generated .env-local; entries use the same schema as a
# stack's x-postgres block: database, ensure, passwordVersion.
#
# The forgejo role and database on this node are orphaned since the move to
# equestria (PR #1078, live and verified since 2026-08-22). The tombstone
# below DROPS both on the next deploy — merging the change that armed it is
# the consent. Remove the entry once the drop has landed; removal WITHOUT an
# ensure-absent tombstone never drops anything — that is the retain default.
databases:
  - database: forgejo
    ensure: absent
