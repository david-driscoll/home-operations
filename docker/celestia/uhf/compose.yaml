services:
  uhf-server:
    restart: unless-stopped
    dns:
      - 100.100.100.100
    image: swapplications/uhf-server:2.2.0@sha256:5244ab9592cb1ffd13db1fa1a5612bbcc0aeb56e6e3048f6db302d8f07551b02
    container_name: uhf-server
    labels:
      # Enable Traefik
      traefik.enable: true

      # Web UI routing (HTTPS)
      traefik.http.routers.${APP}.rule: Host(`uhf.${CLUSTER_DOMAIN}`)
      traefik.http.routers.${APP}.entrypoints: websecure
      traefik.http.routers.${APP}.tls.certresolver: le
      traefik.http.routers.${APP}.service: ${APP}

      traefik.http.services.${APP}.loadbalancer.server.port: 8809
    volumes:
      - /data/uhf/recordings/:/recordings
      - /opt/stacks-data/${APP}:/var/lib/uhf-server
    environment:
      PORT: "8809"
    command: uhf-server --port 8809 --recordings-dir /recordings
      --enable-commercial-detection
    networks:
      - dockge_default
networks:
  dockge_default:
    external: true
x-dockge:
  urls:
    - https://uhf.${CLUSTER_DOMAIN}
