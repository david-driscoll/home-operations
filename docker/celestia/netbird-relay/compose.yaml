# The NetBird relay at home (docs/plans/netbird-mirror.md, D30).
#
# `relay-home.<root domain>`, beside the two on the Azure hosts
# (components/netbird/compose.yaml). Every management server lists it
# (stacks/netbird-edge), so relayed traffic with a home peer on the controlling
# side stays here instead of crossing Azure's metered egress.
#
# Reached from the internet on WAN 443, TCP and UDP, through the UniFi port
# forward in stacks/unifi-network/netbird-relay.ts, which lands on this
# host's 33443. The name and ports live in components/netbird/homeRelay.ts;
# homeRelay.test.ts checks this file against them.
#
# Unlike the Azure relays there is no Traefik in front. The relay terminates
# TLS itself, so it serves QUIC on 443/udp as well as WebSocket, and its own
# Let's Encrypt answers the TLS-ALPN-01 challenge that arrives on WAN 443. The
# certificate is cached under /opt/stacks-data, so a restart does not ask
# again. No Traefik labels either: a Host() rule here would make DockgeLxc
# publish the name as a CNAME to this host's LAN address, in Cloudflare too.
#
# No STUN (the server lists only the Azure relays' STUN), and its health and
# metrics ports stay inside the container.
services:
  netbird-relay:
    # Same release as the Azure relays and the gateways (the NetBird Renovate group).
    image: netbirdio/relay:0.82.0@sha256:8f6b9e4193653ede89e83dd4aa4e2cf2562579b3e2481dcf259a7ab28bcd5fa1
    container_name: netbird-relay
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 33443:443/tcp
      - 33443:443/udp
    volumes:
      - /opt/stacks-data/${APP}/letsencrypt:/var/lib/netbird-relay
    labels:
      traefik.enable: false
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"
