services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7
    ports:
      - 6785:6785
    restart: unless-stopped
    dns:
      - 100.100.100.100
    labels:
      # Enable Traefik
      traefik.enable: true

      # Zot Registry - HTTPS
      traefik.http.routers.registry.rule: Host(`registry.${searchDomain}`)
      traefik.http.routers.registry.entrypoints: websecure
      traefik.http.routers.registry.tls.certresolver: le
      traefik.http.routers.registry.service: registry

      traefik.http.routers.registry-tailscale.rule: Host(`registry.${tailscaleDomain}`)
      traefik.http.routers.registry-tailscale.entrypoints: tailscale
      traefik.http.routers.registry-tailscale.service: registry

      traefik.http.services.registry.loadbalancer.server.port: 6785
    environment:
      TZ: ${TIMEZONE}
    volumes:
      - ./config/config.json:/etc/zot/config.json
      # Blobs live on celestia's ZFS pool, not ./data. ./data sat on the boot SSD
      # (local-lvm), the same disk as milky-way's etcd: zot's syncs, scrub and GC
      # wrote 30-50 GB per burst there and stalled etcd fsync for seconds.
      - /data/zot:/var/lib/registry
    networks:
      - dockge_default
networks:
  dockge_default:
    external: true
x-dockge:
  urls:
    - https://registry.${searchDomain}
    - https://registry.${tailscaleDomain}
