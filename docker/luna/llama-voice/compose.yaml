services:
  # llama.cpp Vulkan server hosting gemma-4-E2B for the Home Assistant voice
  # pipeline. E2B (not E4B) is deliberate: voice lives on time-to-first-token,
  # and the smaller model roughly doubles decode speed on this iGPU (~17 tok/s
  # measured for a same-size model vs ~10 for E4B). Single slot + small window
  # keep latency down; HA's system prompt (exposed entities) stays in the
  # prompt cache so each utterance only prefills the spoken words.
  #
  # Pairs with the wyoming stack (whisper STT + piper TTS) on this host.
  llama-voice:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:3dd0b326c9899cf7a7491fcafba51f54e78af2a366953769a847dd380a732420
    container_name: llama-voice
    restart: unless-stopped
    ports:
      - "8080:8080"
    # The Dockge LXCs have no IPv6 egress (ipv6_method: none), but huggingface.co
    # resolves to AAAA records and llama.cpp's HTTP client does not fall back to
    # IPv4 the way curl does — every -hf model download fails instantly with
    # "HTTPLIB failed: Could not establish connection". Disabling IPv6 inside
    # the container forces the v4 path. Verified on celestia 2026-08-03.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992" # host "render" group GID -> /dev/dri/renderD128 access
    volumes:
      - ./models:/models
    environment:
      - LLAMA_CACHE=/models # cache downloaded GGUFs here (persists across restarts)
    command: >
      -hf ggml-org/gemma-4-E2B-it-GGUF:Q4_0
      --host 0.0.0.0
      --port 8080
      -ngl 999
      -c 8192
      -np 1
      --jinja
    networks:
      - dockge_default
    labels:
      traefik.enable: true

      # Hostname for the built-in llama.cpp web UI. The published 8080 stays —
      # the Home Assistant voice pipeline points at ${ipAddress}:8080 and that
      # path must not depend on Traefik being up.
      #
      # luna's _common traefik is deployed like every other dockge host (the
      # "no Traefik labels on luna" note in docker/AGENTS.md is about the
      # network_mode: host stacks, which this is not). No authentik middleware,
      # same reasoning as docker/celestia/llama-agent: the name resolves to the
      # LXC's tailnet address, and forward-auth would break API clients.
      traefik.http.routers.llama-voice.rule: Host(`llama-voice.${searchDomain}`)
      traefik.http.routers.llama-voice.entrypoints: websecure
      traefik.http.routers.llama-voice.tls.certresolver: le
      traefik.http.routers.llama-voice.service: llama-voice

      traefik.http.routers.llama-voice-tailscale.rule: Host(`llama-voice.${tailscaleDomain}`)
      traefik.http.routers.llama-voice-tailscale.entrypoints: tailscale
      traefik.http.routers.llama-voice-tailscale.service: llama-voice

      traefik.http.services.llama-voice.loadbalancer.server.port: 8080

networks:
  dockge_default:
    external: true

x-dockge:
  urls:
    - https://llama-voice.${searchDomain}
    - http://${ipAddress}:8080
