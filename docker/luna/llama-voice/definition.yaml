---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/stargate-command-cluster/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: llama-voice
spec:
  name: llama.cpp Voice Server (gemma-4-E2B)
  category: AI
  url: &url https://llama-voice.${searchDomain}
  icon: https://avatars.githubusercontent.com/u/134263123
  gatus:
    # Probed through Traefik, same reasoning as docker/celestia/llama-agent.
    # The Home Assistant voice pipeline still talks to ${ipAddress}:8080
    # directly, so this check does not gate the thing HA depends on.
    - url: https://llama-voice.${searchDomain}/health
      method: GET
      group: "Applications"
      conditions:
        - "[STATUS] == 200"
