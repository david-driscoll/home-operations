---
# yaml-language-server: $schema=https://raw.githubusercontent.com/david-driscoll/home-operations/refs/heads/main/schemas/definition.schema.json
apiVersion: driscoll.dev/v1
kind: ApplicationDefinition
metadata:
  name: wyoming
spec:
  name: Wyoming Speech (whisper + piper)
  category: AI
  # No `url:` on purpose. Wyoming is Home Assistant's satellite protocol, spoken over raw
  # TCP — there is no web UI, so there is no launch URL. Authentik validates
  # meta_launch_url with Django's URL validator (http/https/ftp/ftps only), so a tcp://
  # value 400s and stalls the stack. The TCP endpoints below are correct for Gatus.
  icon: https://brands.home-assistant.io/wyoming/icon.png
  gatus:
    - url: tcp://${ipAddress}:10300
      group: "Applications"
      conditions:
        - "[CONNECTED] == true"
    - url: tcp://${ipAddress}:10200
      group: "Applications"
      conditions:
        - "[CONNECTED] == true"
