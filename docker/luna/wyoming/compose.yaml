services:
  # Wyoming speech services for Home Assistant Assist: whisper (STT) and
  # piper (TTS). Both run on CPU — the iGPU is reserved for llama-voice —
  # and speak the Wyoming protocol (raw TCP), so they publish ports directly
  # instead of routing through Traefik. HA connects via the Wyoming
  # integration at <luna>:10300 (whisper) and <luna>:10200 (piper).
  whisper:
    image: rhasspy/wyoming-whisper:3.5.0@sha256:308b7959a925d0cca381c3e6e77292fed87822695635db39c24199d6b7a9e610
    container_name: wyoming-whisper
    restart: unless-stopped
    ports:
      - "10300: "
    volumes:
      - ./whisper-data:/data
    # small-int8 balances accuracy vs the 8 Zen3 cores; drop to base-int8 if
    # transcription latency feels slow in practice.
    command: --model small-int8 --language en

  piper:
    image: rhasspy/wyoming-piper:2.3.1@sha256:69b7f797ae3a8c3c0202cbf97152fb795d78c2355de2a31655c20671247360d8
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - ./piper-data:/data
    command: --voice en_US-lessac-medium
x-dockge:
  urls:
    - tcp://${ipAddress}:10300
    - tcp://${ipAddress}:10200
