# authentik-pg-standby client authentication. Used instead of the pg_hba.conf
# the clone copied from CNPG (standby-entrypoint.sh).
#
# Roles and passwords are NOT defined here or on this host: they replicate from
# authentik-pg. After a promotion the Pi's authentik logs in with the same
# `authentik` role and password it used against equestria.

# TYPE  DATABASE   USER       ADDRESS          METHOD

# docker exec / healthcheck: the container runs as uid 999 = `postgres`, and
# CNPG always has a `postgres` superuser role (password-disabled there, which
# peer auth does not need).
local   all        postgres                    peer
# pg_basebackup FROM this server over the socket -- the FAILOVER.md rehearsal
# clones the standby rather than touching the primary. `all` above never
# matches the replication pseudo-database.
local   replication postgres                   peer

# The Pi's authentik, over dockge_default — only meaningful once promoted.
host    authentik  authentik  172.16.0.0/12    scram-sha-256

# Everything else is refused.
host    all        all        0.0.0.0/0        reject
