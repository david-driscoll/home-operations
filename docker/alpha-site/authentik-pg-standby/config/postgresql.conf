# authentik-pg-standby — the whole server configuration.
#
# Used INSTEAD of the postgresql.conf the clone copied from CNPG, which points
# at /controller/... paths that do not exist here (standby-entrypoint.sh).
# Survives promotion unchanged: nothing below is standby-only except the
# recovery settings, which a promoted server simply stops reading.

listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'

# --- MUST BE >= THE PRIMARY'S ----------------------------------------------
# A hot standby refuses to keep replaying (and on startup, to run at all) when
# any of these is lower than on the primary. The primary's values come from
# kubernetes/apps/stargate-command/authentik/resources/postgres-values.yaml plus CNPG's
# defaults for what it does not set. Raise these BEFORE raising the primary's.
max_connections = 200
max_worker_processes = 32
max_wal_senders = 10
max_locks_per_transaction = 64
max_prepared_transactions = 0

# --- recovery ----------------------------------------------------------------
hot_standby = on
primary_slot_name = 'alpha_site_standby'
# Follow CNPG failovers: a switchover inside equestria starts a new timeline,
# and `latest` is what lets this standby move onto it instead of stopping.
recovery_target_timeline = 'latest'
wal_receiver_timeout = 60s
wal_retrieve_retry_interval = 10s
# Queries on the standby are rare (rehearsals, amcheck); do not hold back the
# primary's vacuum for them.
hot_standby_feedback = off
max_standby_streaming_delay = 30s

# --- sized for a Pi 4 sharing 8 GB -------------------------------------------
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
work_mem = 4MB

# --- WAL, for the day this is promoted ------------------------------------------
wal_level = replica
# No archive: after a promotion the recovery point for this copy is the
# FAILOVER.md "re-establish" clone back into equestria, not a WAL archive on a
# USB SSD.
archive_mode = off
max_wal_size = 1GB
min_wal_size = 80MB

# --- auth / logging ------------------------------------------------------------
password_encryption = scram-sha-256
ssl = off
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
