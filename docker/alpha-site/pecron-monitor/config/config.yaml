      type: STRUCT
      desc: DC
      access: R
    ac_data_output_hm:
      id: 31
      type: STRUCT
      desc: AC
      access: R
    host_packet_data_jdb:
      id: 35
      type: STRUCT
      desc: Host power pack details
      access: R
    charging_pack_data_jdb:
      id: 36
      type: ARRAY
      desc: Power pack information
      access: R
    dc_data_input_hm:
      id: 28
      type: STRUCT
      desc: DC/PV
      access: R
    ac_data_input_hm:
      id: 29
      type: STRUCT
      desc: 'AC '
      access: R
    dc_switch_hm:
      id: 38
      type: BOOL
      desc: Dc output
      access: RW
    ac_switch_hm:
      id: 40
      type: BOOL
      desc: Ac output
      access: RW
    high_frequency_reporting:
