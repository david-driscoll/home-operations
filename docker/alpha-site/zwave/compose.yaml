services:
  zwave-js-ui:
    container_name: zwave-js-ui
    image: zwavejs/zwave-js-ui:11.26.1@sha256:fefcfac3b0cebea74e00e1c6a611dc18ddd1a8f55db51e45091b63ca5e8926a1
    restart: unless-stopped
    dns:
      - 100.100.100.100
    tty: true
    stop_signal: SIGINT
    labels:
      # Enable Traefik
      traefik.enable: true

      # Z-Wave JS UI - HTTPS
      traefik.http.routers.zwave.rule: Host(`zwave.${searchDomain}`) || Host(`zwave.as.${searchDomain}`)
      traefik.http.routers.zwave.entrypoints: websecure
      traefik.http.routers.zwave.tls.certresolver: le
      traefik.http.routers.zwave.service: zwave

      traefik.http.routers.zwave-tailscale.rule: Host(`zwave.${tailscaleDomain}`)
      # Redirects to the app route, https://zwave.${searchDomain} (docs/adr/0004);
      # the app is no longer served on its tailnet name.
      traefik.http.routers.zwave-tailscale.middlewares: zwave-app-route
      traefik.http.middlewares.zwave-app-route.redirectregex.regex: "^https?://[^/]+(/.*)?$$"
      traefik.http.middlewares.zwave-app-route.redirectregex.replacement: "https://zwave.${searchDomain}$${1}"
      traefik.http.middlewares.zwave-app-route.redirectregex.permanent: "true"
      traefik.http.routers.zwave-tailscale.entrypoints: tailscale
      traefik.http.routers.zwave-tailscale.service: zwave

      traefik.http.services.zwave.loadbalancer.server.port: 8091
    environment:
      SESSION_SECRET: someothervaluethatisntonlie131
      TZ: ${TIMEZONE}
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_C1301C21-if00-port0:/dev/zwave
    volumes:
      - /opt/stacks-data/${APP}:/usr/src/app/store
    ports:
      - 8091:8091
      - 3000:3000
    networks:
      - dockge_default
networks:
  dockge_default:
    external: true
x-dockge:
  urls:
    - https://${APP}.${searchDomain}
    - https://${APP}.as.${searchDomain}
    - https://zwave.${tailscaleDomain}
