services:
  uptime:
    container_name: uptime
    image: ghcr.io/twin/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
    restart: unless-stopped
    dns:
      - 100.100.100.100
    environment:
      GATUS_CONFIG_PATH: /config
      # Log timestamps only. The image has no /usr/share/zoneinfo, but the
      # binary embeds the tz database, so the name resolves. Maintenance
      # windows do not move: Gatus evaluates them in UTC unless a window names
      # its own timezone.
      TZ: ${TIMEZONE}
    labels:
      # Enable Traefik
      traefik.enable: true

      traefik.http.routers.uptime.rule: Host(`uptime.${searchDomain}`)
      traefik.http.routers.uptime.entrypoints: websecure
      traefik.http.routers.uptime.service: uptime
      traefik.http.routers.uptime.tls.certresolver: le

      traefik.http.routers.uptime-tailscale.rule: Host(`uptime.${tailscaleDomain}`)
      traefik.http.routers.uptime-tailscale.entrypoints: tailscale
      traefik.http.routers.uptime-tailscale.service: uptime

      traefik.http.services.uptime.loadbalancer.server.port: 9595
    volumes:
      - /opt/stacks-data/${APP}/data/:/data/
      # NOT :ro, and it cannot be. Gatus reads every YAML in GATUS_CONFIG_PATH
      # as one merged config, so the Pulumi-written endpoint files (here) and
      # the in-repo static files (below) have to arrive in the same directory —
      # the static ones as individual file mounts layered on top of this one.
      # runc has to CREATE a mountpoint inside this directory for any such file
      # that does not already exist in it, and on a :ro mount that create fails
      # with "make mountpoint: read-only file system" before the container
      # process ever starts. `default.yaml` only escaped it by having a stale
      # 0-byte twin in stacks-data from June; `openbao-break-glass.yaml` had no
      # such twin and took the whole uptime stack down when it was added.
      # Keep the individual file mounts below :ro — that is where read-only
      # actually belongs.
      - /opt/stacks-data/${APP}/config:/config
      - ./config/default.yaml:/config/default.yaml:ro
      # Heartbeat endpoints the equestria openbao-replica cronjobs report
      # into — in-repo rather than Pulumi-written because the consumers are
      # GitOps jobs, not Pulumi-managed backup plans.
      - ./config/openbao-break-glass.yaml:/config/openbao-break-glass.yaml:ro
      # The endpoint the Forgejo runner canary reports into. The file had been
      # in the repo since the canary was added, but without a mount here Gatus
      # never read it, so every hourly push got a 404 and the canary's job was
      # red from its first run.
      - ./config/forgejo-actions.yaml:/config/forgejo-actions.yaml:ro
    networks:
      - dockge_default
x-dockge:
  urls:
    - https://uptime.${searchDomain}
    - https://uptime.${tailscaleDomain}
networks:
  dockge_default:
    external: true
