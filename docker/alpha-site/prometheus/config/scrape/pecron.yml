---
# Pecron battery/UPS metrics, from the exporter in the pecron-monitor stack.
#
# The exporter publishes no host port; it sits on dockge_default and is reached
# by container name, same as node-exporter and cadvisor.
#
# 60s matches the global scrape_interval deliberately. pecron-monitor polls the
# batteries every 70s and the cloud path enforces a 63s floor, so anything
# faster only resamples a value that has not changed.
scrape_configs:
  - job_name: 'pecron'
    static_configs:
      - targets: ['pecron-exporter:9836']
        labels:
          host: '${host}'
          service: 'power'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [instance]
        target_label: hostname
        replacement: '${1}'
        regex: '([^:]+).*'
