# authentik VIP -- alpha-site side.
#
# The secret resolver expands references anywhere in this file, comments
# included: never write a reference-shaped string in a comment here.
#
# MUST AGREE with kubernetes/apps/network/authentik-vip/app/resources/keepalived.conf.tmpl
# on virtual_router_id, advert_int, auth_pass and the VIP, and list its nodes as
# peers (talos/talconfig.yaml). Disagreement means two MASTERs for one address.

global_defs {
    router_id alpha-site
    enable_script_security
    script_user root
    vrrp_garp_master_refresh 60
}

# The Pi's authentik can serve a login: server ready (which includes its
# database -- authentik-pg normally, the promoted standby after FAILOVER.md) and
# the Pi's Traefik accepting connections.
vrrp_script authentik_ready {
    script "/bin/sh /config/check-authentik.sh"
    interval 5
    timeout 4
    fall 3
    rise 2
}

vrrp_instance authentik {
    state BACKUP
    interface eth0
    virtual_router_id 55
    # Below equestria's 150: equestria holds the VIP whenever it is healthy and
    # takes it back when it recovers (after its preempt_delay). No fence check
    # here -- the Pi is the side a failover promotes, never the stale one.
    priority 100
    preempt_delay 30
    advert_int 1

    unicast_src_ip 10.10.10.9
    unicast_peer {
        10.10.206.10
        10.10.206.14
        10.10.206.16
        10.10.206.17
        10.10.209.10
        10.10.209.11
        10.10.209.12
    }

    authentication {
        auth_type PASS
        auth_pass ref+openbao://secrets/clusters/equestria/apps/authentik-vip/vrrp#/password
    }

    virtual_ipaddress {
        10.10.255.10/16 dev eth0
    }

    track_script {
        authentik_ready
    }
}
