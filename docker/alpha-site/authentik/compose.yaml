# Authentik — the estate's identity provider, on alpha-site.
#
# GATED by the .ignore in this directory. Read it before deploying.
#
# Piece G' of docs/cluster-consolidation/07-authentik-to-alpha-site.md: SSO moves
# off Kubernetes so that the SGC -> equestria cluster merge cannot take identity
# down with it. Embedded and proxy outposts STAY in their clusters next to the
# apps they front; only the central server relocates here.
#
# Two deliberate differences from every other stack in this tree:
#
#   - No `authentik:` block in definition.yaml. Authentik cannot be an OAuth
#     client of itself, and this host uses the server's own embedded outpost
#     rather than the authentik-outpost sidecar (section 2.5) — the sidecar is
#     suppressed by docker/alpha-site/authentik-outpost/.ignore, and Traefik's
#     forwardAuth address is repointed here via DockgeLxc's
#     authentikForwardAuthHost arg. Both land with the cutover, not with this file.
#
#   - Single replica. In-cluster this runs 2 server pods with anti-affinity; here
#     it is N, not N+1 — one Pi, one PSU, one USB cable. That is an accepted risk
#     (section 6), and the mitigation is a rehearsed, verified restore, not
#     redundancy.
#
# No Redis. authentik 2025.10 moved its cache, task broker and channel layer
# into PostgreSQL, so the bundled valkey this stack used to run served nothing;
# it was removed in phase 4 of docs/authentik-active-active/PLAN.md. A deploy
# does not remove the old container (`compose up -d` leaves orphans running) —
# `docker rm -f authentik-redis` and `rm -rf /opt/stacks-data/authentik/redis`
# once, by hand.
services:
  # ---------------------------------------------------------------------------
  # Server — the API and the UI, and the embedded outpost this host's own
  # forwardAuth will use once section 2.5 lands.
  # ---------------------------------------------------------------------------
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    container_name: authentik-server
    hostname: authentik-server
    command: server
    env_file:
      - path: .env
        required: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/stacks-data/authentik/media:/media
      - /opt/stacks-data/authentik/templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      # First boot runs the full schema migration against an empty database, and
      # this is a Pi. Generous on purpose.
      start_period: 300s
    restart: unless-stopped
    mem_limit: 1500m
    dns:
      - 100.100.100.100
    # LOOPBACK ONLY. For keepalived's track script (docker/alpha-site/authentik-vip),
    # which runs on the host network and cannot resolve this container by name.
    # Never widen it: everything that is not a local health check goes through
    # Traefik, and authentik behind no proxy would trust whatever X-Forwarded-*
    # a LAN client chose to send.
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - dockge_default
    labels:
      autoheal: true
      traefik.enable: true

      # STAGING HOSTNAMES — deliberately NOT the production vanity aliases.
      #
      # Every `Host(...)` rule in this file is parsed by DockgeLxc's hostRegex
      # (components/DockgeLxc.ts:1061) and turned into infrastructure, not just
      # routing: a name under the tailnet domain becomes a `tailscale.Service`
      # (`svc:<name>`), and any other name becomes a StandardDns CNAME pointing at
      # this Dockge host. So naming the production aliases here does not merely
      # duplicate a route — it REPOINTS LIVE SSO DNS the moment the stack deploys,
      # against records external-dns is simultaneously publishing from SGC's
      # HTTPRoute. Two writers on the same names, one of which has wiped live DNS
      # before. Verified 2026-08-15, all four are live and in use:
      #   authentik/iris/canterlot.driscoll.tech -> odyssey (SGC gateway), 10.10.209.101
      #   authentik.<tailnet>                    -> 100.106.100.188
      #
      # So staging runs on names nothing else claims. The cutover swaps these two
      # rules for the three vanity aliases in the SAME change that removes them
      # from SGC's HTTPRoute — see section 4 step 5 of
      # docs/cluster-consolidation/07-authentik-to-alpha-site.md, and the
      # "cutover" section of the .ignore in this directory.
      #
      # Issuer URLs do not change in this migration; only what answers behind
      # them does, which is why no app's OIDC config is touched.
      # CUTOVER (step 5), SECOND ATTEMPT. The first (#856) merged but never
      # applied — the Pulumi state backend was broken estate-wide, so this file
      # sat claiming names SGC was serving, and #864 reverted it to disarm that.
      # stacks/home has since completed a clean run, and the restore below was
      # re-synced and verified minutes before this landed.
      #
      # These three are the estate's SSO names, released by
      # stargate-command-cluster#1831 and confirmed retracted from cloudflare,
      # technitium and unifi before this landed. Every cluster's outposts and
      # Dockge hosts know authentik by one of them:
      #   canterlot -> equestria, celestia, luna, skystar
      #   iris      -> sgc, alpha-site
      #   authentik -> the chart default, and AUTHENTIK_URL for every Pulumi stack
      # Issuer URLs do not change; only what answers behind them does.
      #
      # authentik.${CLUSTER_DOMAIN} stays alongside them, so this host keeps a
      # name of its own that is independent of the vanity set.
      traefik.http.routers.authentik.rule: Host(`authentik.${searchDomain}`) || Host(`iris.${searchDomain}`) || Host(`canterlot.${searchDomain}`) || Host(`authentik.${CLUSTER_DOMAIN}`)
      traefik.http.routers.authentik.entrypoints: websecure
      traefik.http.routers.authentik.tls.certresolver: le
      traefik.http.routers.authentik.service: authentik

      # The tailnet name moves here too. DockgeLxc's hostRegex turns this rule
      # into the whole chain automatically (components/DockgeLxc.ts:1078-1118):
      # a tailscale.Service `svc:authentik`, a `tailscale serve --service=svc:authentik
      # --https=443 127.0.0.1:8443` on this host so it actually backs the VIP, and a
      # monitor.addService entry. Dropping the old rule likewise runs
      # `tailscale serve clear svc:authentik-as`.
      #
      # This is the name remote Dockge hosts use, NOT a public vanity alias:
      # DockgeLxc.ts:700 hands `remote: true` hosts `authentik.${tailscaleDomain}` as
      # their CLUSTER_AUTHENTIK_DOMAIN. skystar (stacks/ocracoke) is such a host — its
      # outpost dials https://authentik.opossum-yo.ts.net and is serving through it
      # today — so this has to land before SGC is scaled to zero.
      traefik.http.routers.authentik-tailscale.rule: Host(`authentik.${tailscaleDomain}`)
      traefik.http.routers.authentik-tailscale.entrypoints: tailscale
      traefik.http.routers.authentik-tailscale.service: authentik

      # NO forwardAuth middleware here, on purpose: the identity provider cannot
      # be gated behind itself.
      traefik.http.services.authentik.loadbalancer.server.port: 9000
      traefik.http.services.authentik.loadbalancer.healthcheck.path: /-/health/live/
      traefik.http.services.authentik.loadbalancer.healthcheck.port: 9000

  # ---------------------------------------------------------------------------
  # Worker — background tasks, blueprint application, outpost reconciliation.
  # Shares .env with the server; the only difference is the command.
  # ---------------------------------------------------------------------------
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    container_name: authentik-worker
    hostname: authentik-worker
    command: worker
    env_file:
      - path: .env
        required: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/stacks-data/authentik/media:/media
      - /opt/stacks-data/authentik/templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 300s
    restart: unless-stopped
    mem_limit: 1g
    dns:
      - 100.100.100.100
    networks:
      - dockge_default

# Declares a database + login role on this node's shared postgres
# (docker/_common/postgres). Pulumi collects this block, mints the password,
# stores it in OpenBao, and substitutes ${PGAPP_USER}/${PGAPP_PASSWORD}/
# ${PGAPP_DATABASE} into this stack's files.
#
# NO LONGER WHAT AUTHENTIK CONNECTS TO. Since phase 2 of
# docs/authentik-active-active/PLAN.md the .env points at stargate-command/authentik-pg,
# and nothing in this stack uses the ${PGAPP_*} tokens any more. The block stays
# so the frozen pre-cutover copy -- the soak's rollback path -- keeps a working
# login role. Deleting the block would orphan that database rather than drop it
# (dockerStackPostgres.ts: removed means RETAIN), so retirement goes through
# `ensure: absent` in phase 4, once the soak has passed.
x-postgres:
  database: authentik

# The SSO names resolve to the keepalived VIP, not to this Dockge host (phase 7
# of docs/authentik-active-active/PLAN.md). Each stays the CNAME DockgeLxc has
# always created for it -- only the target moves, which is an in-place update in
# all three DNS providers. authentik-vip is an A record for 10.10.255.10 owned by
# stacks/home, held by equestria (priority 150) or this Pi (100).
#
# authentik.${CLUSTER_DOMAIN} is deliberately NOT here: it stays this site's own
# name, pointing at this host, so the Pi's authentik can be reached directly
# whoever holds the VIP. equestria's counterpart is authentik.<its domain>.
#
# Undoing this (e.g. keepalived is misbehaving) is deleting the three lines and
# merging: the names go back to CNAMEs for this host, in place.
x-dns:
  authentik.${searchDomain}: authentik-vip.${searchDomain}
  iris.${searchDomain}: authentik-vip.${searchDomain}
  canterlot.${searchDomain}: authentik-vip.${searchDomain}

x-dockge:
  urls:
    - https://authentik.${searchDomain}
    - https://iris.${searchDomain}
    - https://canterlot.${searchDomain}
    - https://authentik.${CLUSTER_DOMAIN}
    - https://authentik.${tailscaleDomain}

networks:
  dockge_default:
    external: true
