# The NetBird combined server on the netbird-edge VM (#3000,
# docs/plans/netbird-mirror.md §F). Shipped to /opt/netbird by
# components/netbird/NetbirdServer.ts; Renovate keeps the image tags here current.
#
# Adapted from upstream's getting-started.sh (v0.82.0), built-in Traefik mode,
# without the optional reverse proxy. CrowdSec is upstream's dashboard AppSec
# guide, reporting to Equestria's LAPI instead of a local one
# (components/netbird/crowdsec.ts). The .env file written beside this one sets
# NETBIRD_DOMAIN and, on a relay host, NETBIRD_RELAY_DOMAIN and
# COMPOSE_PROFILES=relay; config.yaml, dashboard.env and relay.env are rendered
# by components/netbird/server.ts, the crowdsec-* files and
# traefik-dynamic.yaml by components/netbird/crowdsec.ts.
#
# A fenced host (#3001, components/netbird/fence.ts) runs Traefik and the relay
# always, and netbird-server and the dashboard only while it holds the DNS
# lease; its .env sets NETBIRD_SERVER_RESTART=no, so a reboot never starts
# management before the fence has checked the lease.
name: netbird

services:
  traefik:
    image: traefik:v3.7.17@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
    container_name: netbird-traefik
    restart: unless-stopped
    networks:
      netbird:
        # renderServerConfig trusts exactly this address for client IPs.
        ipv4_address: 172.30.0.10
    # MagicDNS first, for the CrowdSec LAPI's tailnet name (the VM runs
    # --accept-dns=false). For any other name quad-100 has no upstream and
    # answers SERVFAIL, and Docker's resolver moves on to the next server on
    # SERVFAIL or REFUSED (libnetwork resolver.go forwardExtDNS), so ACME and
    # the plugin download still resolve.
    dns: [100.100.100.100, 1.1.1.1]
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=netbird_netbird"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.allowACMEByPass=true"
      # GHSA-rf44-j88r-hh8c: needs Traefik >= 3.7.12.
      - "--entrypoints.web.http.aliasHeadersStrategy=delete"
      - "--entrypoints.websecure.http.aliasHeadersStrategy=delete"
      # Long-lived gRPC streams (signal, management) must never time out.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The relay's own name, in a file of its own: acme.json is the management
      # name's, backed up and handed to whichever host takes the lease, and
      # this one never leaves the host that serves the relay.
      - "--certificatesresolvers.relay.acme.storage=/letsencrypt/relay-acme.json"
      - "--certificatesresolvers.relay.acme.tlschallenge=true"
      - "--serverstransport.forwardingtimeouts.responseheadertimeout=0s"
      - "--serverstransport.forwardingtimeouts.idleconntimeout=0s"
      # The CrowdSec bouncer (components/netbird/crowdsec.ts), pinned like
      # home's (kubernetes/apps/network/traefik/values.yaml). Downloaded at
      # startup; abortOnPluginFailure makes a failed download a crash, which
      # `restart: unless-stopped` retries, rather than a Traefik that runs with
      # every plugin disabled and 404s each route naming the middleware. The
      # cost, accepted: while the download fails, gRPC and the relay are down
      # with it.
      - "--experimental.abortOnPluginFailure=true"
      - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer-traefik-plugin.version=v1.7.1"
      # The `netbird-crowdsec` middleware. A file, not labels, so it exists on
      # every host whichever containers are running.
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=true"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netbird_traefik_letsencrypt:/letsencrypt
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ./crowdsec-bouncer.key:/etc/traefik/crowdsec-bouncer.key:ro
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  dashboard:
    image: netbirdio/dashboard:v2.96.0@sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
    container_name: netbird-dashboard
    restart: unless-stopped
    networks: [netbird]
    env_file:
      - ./dashboard.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.netbird-dashboard.rule=Host(`${NETBIRD_DOMAIN}`)
      - traefik.http.routers.netbird-dashboard.entrypoints=websecure
      - traefik.http.routers.netbird-dashboard.tls=true
      - traefik.http.routers.netbird-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-dashboard.service=dashboard
      - traefik.http.routers.netbird-dashboard.priority=1
      - traefik.http.routers.netbird-dashboard.middlewares=netbird-crowdsec@file
      - traefik.http.services.dashboard.loadbalancer.server.port=80
    logging: *logging

  # Management + Signal (+ Relay + STUN when server.relays is empty).
  netbird-server:
    image: netbirdio/netbird-server:0.82.0@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
    container_name: netbird-server
    restart: ${NETBIRD_SERVER_RESTART:-unless-stopped}
    networks: [netbird]
    environment:
      # Lets POST /api/setup return the owner's PAT, so Pulumi can bootstrap
      # the account without a human. The endpoint only works once, before any
      # account exists.
      NB_SETUP_PAT_ENABLED: "true"
    # No 3478/udp: with the standalone relays listed in config.yaml the
    # embedded STUN is off, and the relay below owns the port.
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    command: ["--config", "/etc/netbird/config.yaml"]
    labels:
      - traefik.enable=true
      # gRPC needs an h2c backend.
      - traefik.http.routers.netbird-grpc.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      - traefik.http.routers.netbird-grpc.entrypoints=websecure
      - traefik.http.routers.netbird-grpc.tls=true
      - traefik.http.routers.netbird-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-grpc.service=netbird-server-h2c
      - traefik.http.routers.netbird-grpc.priority=100
      - traefik.http.routers.netbird-backend.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.netbird-backend.entrypoints=websecure
      - traefik.http.routers.netbird-backend.tls=true
      - traefik.http.routers.netbird-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-backend.service=netbird-server
      - traefik.http.routers.netbird-backend.priority=100
      # /api and /oauth2 again, above netbird-backend, through CrowdSec
      # (upstream's dashboard AppSec guide). /relay and /ws-proxy/ stay on
      # netbird-backend and the gRPC router stays bare: a false positive there
      # would take peers off the mesh.
      - traefik.http.routers.netbird-api.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.netbird-api.entrypoints=websecure
      - traefik.http.routers.netbird-api.tls=true
      - traefik.http.routers.netbird-api.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-api.service=netbird-server
      - traefik.http.routers.netbird-api.priority=110
      - traefik.http.routers.netbird-api.middlewares=netbird-crowdsec@file
      - traefik.http.services.netbird-server.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.scheme=h2c
    logging: *logging

  # The standalone relay and its STUN (#3001), on hosts with
  # COMPOSE_PROFILES=relay. Not fenced: a standby keeps relaying. Plain HTTP
  # behind Traefik, which terminates TLS for NETBIRD_RELAY_DOMAIN with its own
  # resolver; relay.env is rendered by components/netbird/server.ts.
  relay:
    image: netbirdio/relay:0.82.0@sha256:8f6b9e4193653ede89e83dd4aa4e2cf2562579b3e2481dcf259a7ab28bcd5fa1
    container_name: netbird-relay
    profiles: [relay]
    restart: unless-stopped
    networks: [netbird]
    env_file:
      - path: ./relay.env
        required: false
    ports:
      - "3478:3478/udp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.netbird-relay.rule=Host(`${NETBIRD_RELAY_DOMAIN:-relay.invalid}`) && PathPrefix(`/relay`)
      - traefik.http.routers.netbird-relay.entrypoints=websecure
      - traefik.http.routers.netbird-relay.tls=true
      - traefik.http.routers.netbird-relay.tls.certresolver=relay
      - traefik.http.routers.netbird-relay.service=netbird-relay
      - traefik.http.services.netbird-relay.loadbalancer.server.port=80
    logging: *logging

  # ── CrowdSec: components/netbird/crowdsec.ts ────────────────────────────
  # An agent and an AppSec listener, NOT a LAPI: it logs in to Equestria's
  # LAPI over the tailnet as this host's machine (crowdsec.env), so bans are
  # shared with home both ways. Not fenced: a standby's Traefik still takes
  # internet traffic. No ports: Traefik reaches AppSec on 7422 and Alloy the
  # metrics on 6060 over the compose network.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    container_name: netbird-crowdsec
    restart: unless-stopped
    networks: [netbird, crowdsec-socket]
    # MagicDNS for the LAPI's tailnet name, falling through to a public
    # resolver for the hub (see traefik above).
    dns: [100.100.100.100, 1.1.1.1]
    environment:
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/base-http-scenarios
        crowdsecurity/http-cve
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
    env_file:
      - ./crowdsec.env
    volumes:
      # Volumes, so a restart skips the hub download (docker_start.sh only
      # refreshes an index older than 24h).
      - netbird_crowdsec_config:/etc/crowdsec
      - netbird_crowdsec_data:/var/lib/crowdsec/data
      - ./crowdsec-config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - ./crowdsec-acquis-traefik.yaml:/etc/crowdsec/acquis.d/traefik.yaml:ro
      - ./crowdsec-acquis-appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - ./crowdsec-whitelist.yaml:/etc/crowdsec/postoverflows/s01-whitelist/driscoll-internal-networks.yaml:ro
    healthcheck:
      # AppSec listening is what Traefik needs; the LAPI being reachable is
      # not (everything fails open), so `cscli lapi status` is not the check.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7422"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on: [crowdsec-socket]
    logging: *logging

  # The Docker API the agent reads netbird-traefik's log through: GETs only,
  # no exec, no POST. CONTAINERS for list, inspect and logs; INFO because the
  # docker datasource calls /info once at startup to detect Swarm (CrowdSec
  # 1.8.2 pkg/acquisition/modules/docker/source.go) and fails without it;
  # events, ping and version are the proxy's defaults. On a network of its own
  # with no route out, shared with the crowdsec container alone, so the one
  # container parsing attacker-controlled input never holds the socket itself.
  crowdsec-socket:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: netbird-crowdsec-socket
    restart: unless-stopped
    networks: [crowdsec-socket]
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging

  # ── Metrics: components/netbird/metrics.ts ──────────────────────────────
  # Scrapes netbird-server:9090 and netbird-relay:9090 over this network and
  # remote-writes to thanos-receive over the tailnet. Not fenced: on a standby
  # it reports the relay and a down management target. No ports: its UI
  # listens on loopback and the host is internet-facing. Root, because
  # alloy.alloy is written mode 600 like every file here. MagicDNS directly,
  # as for backup-restic; Docker's resolver still answers the container names.
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: netbird-alloy
    profiles: [metrics]
    restart: unless-stopped
    user: "0:0"
    networks: [netbird]
    dns: [100.100.100.100]
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - netbird_alloy_data:/var/lib/alloy
    logging: *logging

  # ── Backups (#2884): components/netbird/backup.ts ───────────────────────
  # Profile services: `docker compose up` never starts them. The 15-minute
  # timer and the pre-start restore run them with `docker compose run`.

  # SQLite's online `.backup` of the live store into ./backup/staging. Root,
  # because the store is root's and a WAL reader must write the -shm file.
  backup-sqlite:
    image: keinos/sqlite3:3.54.1@sha256:b577e65892c6468d94b390097eda4488e05253470c161bdea68a05abb961fa17
    profiles: [backup]
    user: "0:0"
    network_mode: none
    volumes:
      - netbird_data:/var/lib/netbird
      - ./backup/staging:/staging
    logging: *logging

  # Uploads the staging copy to Garage, and restores the newest snapshot into
  # an empty volume. MagicDNS directly: the VM runs tailscale with
  # --accept-dns=false, and the garage-s3 and uptime VIPs are tailnet names.
  backup-restic:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [backup]
    dns: [100.100.100.100]
    env_file:
      # Written by NetbirdServer from stdin; absent on a server without backups.
      - path: ./backup/restic.env
        required: false
    volumes:
      - netbird_data:/var/lib/netbird
      # The restore puts Traefik's acme.json back before Traefik first starts.
      - netbird_traefik_letsencrypt:/letsencrypt
      - ./backup/staging:/staging
      - netbird_restic_cache:/root/.cache/restic
    logging: *logging

volumes:
  netbird_data:
  netbird_traefik_letsencrypt:
  netbird_restic_cache:
  netbird_alloy_data:
  netbird_crowdsec_config:
  netbird_crowdsec_data:

networks:
  netbird:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  # The socket proxy's only client is the crowdsec container.
  crowdsec-socket:
    driver: bridge
    internal: true
