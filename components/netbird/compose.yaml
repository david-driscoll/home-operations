# The NetBird combined server on the netbird-edge VM (#3000,
# docs/plans/netbird-mirror.md §F). Shipped to /opt/netbird by
# components/netbird/NetbirdServer.ts; Renovate keeps the image tags here current.
#
# Adapted from upstream's getting-started.sh (v0.82.0), built-in Traefik mode,
# without the optional reverse proxy and CrowdSec. The .env file written beside
# this one sets NETBIRD_DOMAIN and, on a relay host, NETBIRD_RELAY_DOMAIN and
# COMPOSE_PROFILES=relay; config.yaml, dashboard.env and relay.env are rendered
# by components/netbird/server.ts.
#
# A fenced host (#3001, components/netbird/fence.ts) runs Traefik and the relay
# always, and netbird-server and the dashboard only while it holds the DNS
# lease; its .env sets NETBIRD_SERVER_RESTART=no, so a reboot never starts
# management before the fence has checked the lease.
name: netbird

services:
  traefik:
    image: traefik:v3.7.14
    container_name: netbird-traefik
    restart: unless-stopped
    networks:
      netbird:
        # renderServerConfig trusts exactly this address for client IPs.
        ipv4_address: 172.30.0.10
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=netbird_netbird"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.allowACMEByPass=true"
      # GHSA-rf44-j88r-hh8c: needs Traefik >= 3.7.12.
      - "--entrypoints.web.http.aliasHeadersStrategy=delete"
      - "--entrypoints.websecure.http.aliasHeadersStrategy=delete"
      # Long-lived gRPC streams (signal, management) must never time out.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The relay's own name, in a file of its own: acme.json is the management
      # name's, backed up and handed to whichever host takes the lease, and
      # this one never leaves the host that serves the relay.
      - "--certificatesresolvers.relay.acme.storage=/letsencrypt/relay-acme.json"
      - "--certificatesresolvers.relay.acme.tlschallenge=true"
      - "--serverstransport.forwardingtimeouts.responseheadertimeout=0s"
      - "--serverstransport.forwardingtimeouts.idleconntimeout=0s"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netbird_traefik_letsencrypt:/letsencrypt
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "2"

  dashboard:
    image: netbirdio/dashboard:v2.96.0@sha256:340b13c00b84349572a2acc5605e907cb09250a9e6461c757097eabdb8e02f2c
    container_name: netbird-dashboard
    restart: unless-stopped
    networks: [netbird]
    env_file:
      - ./dashboard.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.netbird-dashboard.rule=Host(`${NETBIRD_DOMAIN}`)
      - traefik.http.routers.netbird-dashboard.entrypoints=websecure
      - traefik.http.routers.netbird-dashboard.tls=true
      - traefik.http.routers.netbird-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-dashboard.service=dashboard
      - traefik.http.routers.netbird-dashboard.priority=1
      - traefik.http.services.dashboard.loadbalancer.server.port=80
    logging: *logging

  # Management + Signal (+ Relay + STUN when server.relays is empty).
  netbird-server:
    image: netbirdio/netbird-server:0.82.0
    container_name: netbird-server
    restart: ${NETBIRD_SERVER_RESTART:-unless-stopped}
    networks: [netbird]
    environment:
      # Lets POST /api/setup return the owner's PAT, so Pulumi can bootstrap
      # the account without a human. The endpoint only works once, before any
      # account exists.
      NB_SETUP_PAT_ENABLED: "true"
    # No 3478/udp: with the standalone relays listed in config.yaml the
    # embedded STUN is off, and the relay below owns the port.
    volumes:
      - netbird_data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    command: ["--config", "/etc/netbird/config.yaml"]
    labels:
      - traefik.enable=true
      # gRPC needs an h2c backend.
      - traefik.http.routers.netbird-grpc.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      - traefik.http.routers.netbird-grpc.entrypoints=websecure
      - traefik.http.routers.netbird-grpc.tls=true
      - traefik.http.routers.netbird-grpc.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-grpc.service=netbird-server-h2c
      - traefik.http.routers.netbird-grpc.priority=100
      - traefik.http.routers.netbird-backend.rule=Host(`${NETBIRD_DOMAIN}`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      - traefik.http.routers.netbird-backend.entrypoints=websecure
      - traefik.http.routers.netbird-backend.tls=true
      - traefik.http.routers.netbird-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.netbird-backend.service=netbird-server
      - traefik.http.routers.netbird-backend.priority=100
      - traefik.http.services.netbird-server.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.port=80
      - traefik.http.services.netbird-server-h2c.loadbalancer.server.scheme=h2c
    logging: *logging

  # The standalone relay and its STUN (#3001), on hosts with
  # COMPOSE_PROFILES=relay. Not fenced: a standby keeps relaying. Plain HTTP
  # behind Traefik, which terminates TLS for NETBIRD_RELAY_DOMAIN with its own
  # resolver; relay.env is rendered by components/netbird/server.ts.
  relay:
    image: netbirdio/relay:0.82.0
    container_name: netbird-relay
    profiles: [relay]
    restart: unless-stopped
    networks: [netbird]
    env_file:
      - path: ./relay.env
        required: false
    ports:
      - "3478:3478/udp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.netbird-relay.rule=Host(`${NETBIRD_RELAY_DOMAIN:-relay.invalid}`) && PathPrefix(`/relay`)
      - traefik.http.routers.netbird-relay.entrypoints=websecure
      - traefik.http.routers.netbird-relay.tls=true
      - traefik.http.routers.netbird-relay.tls.certresolver=relay
      - traefik.http.routers.netbird-relay.service=netbird-relay
      - traefik.http.services.netbird-relay.loadbalancer.server.port=80
    logging: *logging

  # ── Backups (#2884): components/netbird/backup.ts ───────────────────────
  # Profile services: `docker compose up` never starts them. The 15-minute
  # timer and the pre-start restore run them with `docker compose run`.

  # SQLite's online `.backup` of the live store into ./backup/staging. Root,
  # because the store is root's and a WAL reader must write the -shm file.
  backup-sqlite:
    image: keinos/sqlite3:3.54.1@sha256:b577e65892c6468d94b390097eda4488e05253470c161bdea68a05abb961fa17
    profiles: [backup]
    user: "0:0"
    network_mode: none
    volumes:
      - netbird_data:/var/lib/netbird
      - ./backup/staging:/staging
    logging: *logging

  # Uploads the staging copy to Garage, and restores the newest snapshot into
  # an empty volume. MagicDNS directly: the VM runs tailscale with
  # --accept-dns=false, and the garage-s3 and uptime VIPs are tailnet names.
  backup-restic:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [backup]
    dns: [100.100.100.100]
    env_file:
      # Written by NetbirdServer from stdin; absent on a server without backups.
      - path: ./backup/restic.env
        required: false
    volumes:
      - netbird_data:/var/lib/netbird
      # The restore puts Traefik's acme.json back before Traefik first starts.
      - netbird_traefik_letsencrypt:/letsencrypt
      - ./backup/staging:/staging
      - netbird_restic_cache:/root/.cache/restic
    logging: *logging

volumes:
  netbird_data:
  netbird_traefik_letsencrypt:
  netbird_restic_cache:

networks:
  netbird:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
