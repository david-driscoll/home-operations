---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Region Picker"

# The region picker app (apps/wonderbolts, docs/plans/wonderbolts-nuxt.md):
# typecheck, unit tests, the production build, and the e2e tests, which run
# the built app against dev/mock-agent.ts. Never pushes anything: the image is
# built and published from main by .forgejo/workflows/wonderbolts-image.yml.
# The app is its own npm package (not a root workspace), hence the
# working-directory and its own lockfile.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            apps/wonderbolts/**
            .github/workflows/wonderbolts.yaml

  test:
    name: Test
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    defaults:
      run:
        working-directory: apps/wonderbolts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The image's major (node:24-alpine in .forgejo/workflows/wonderbolts-image.yml).
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/wonderbolts/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

  # The one check branch protection would require. `test` is skipped when the
  # app did not change, and a skipped job never reports; this always runs and
  # fails only on failure. Same shape as netbird-policy.yaml.
  region-picker-status:
    name: Region Picker Success
    needs: ["pre-job", "test"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
