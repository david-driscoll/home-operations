---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "NetBird Policy"

# The NetBird client-access policy and its drift guard (#2888). Fails when a
# user-facing Tailscale grant in stacks/unifi-network/acl-manager.ts has no
# NetBird twin in stacks/netbird/policy.ts and no TAILSCALE_ONLY reason.
# The tests import only pure modules, so no `npm ci`.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            stacks/netbird/**
            stacks/unifi-network/acl-manager.ts
            .github/workflows/netbird-policy.yaml

  test:
    name: Test
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as .config/mise.toml: the tests run TypeScript by type stripping.
          node-version: "24"

      - name: Run policy tests
        run: node --test stacks/netbird/policy.test.ts stacks/netbird/policyDrift.test.ts stacks/netbird/sites.test.ts

  # The one check branch protection requires. `test` is skipped when nothing it
  # covers changed, and a skipped job never reports, so a required `Test`
  # would block every unrelated PR; this always runs and fails only on failure.
  # Same shape as flux-local.yaml's `flate Success`.
  netbird-policy-status:
    name: NetBird Policy Success
    needs: ["pre-job", "test"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
