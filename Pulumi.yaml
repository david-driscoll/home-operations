name: home
description: Configure base homelab services, and services.
runtime:
  name: nodejs
  options:
    packagemanager: npm
    typescript: false
    nodeargs: "--import tsx/esm"
config:
  pulumi:tags:
    value:
      pulumi:template: typescript
packages:
  authentik:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/goauthentik/authentik, 2026.8.0]
  unifi:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/ubiquiti-community/unifi, 0.62.0]
  pbs:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/mcfitz2/pbs, 0.2.1]
  terrifi:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.opentofu.org/alexklibisz/terrifi, 0.11.0]
  tailscale:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/tailscale/tailscale, 0.29.3]
  technitium:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/darkhonor/technitium, 1.3.0]
  forgejo:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/svalabs/forgejo, 1.7.0]
  coderd:
    source: terraform-provider
    version: 0.14.0
    parameters: [registry.terraform.io/coder/coderd, 0.0.30]
